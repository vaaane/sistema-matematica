window.inserir = async function() {
  const btn = document.getElementById("btn");
  const log = document.getElementById("log");
  btn.disabled = true;
  log.innerHTML = "";

    await push(ref(db, "resultados"), { ...d, criadoEm: serverTimestamp() });

  }
  log.innerHTML += "<br><strong>Pronto! Pode fechar esta página.</strong>";
