    <path d="M0 -58 L7 -8 L44 0 L7 8 L0 58 L-7 8 L-44 0 L-7 -8 Z" fill="url(#es-emb)"/>
    <path d="M0 -58 L7 -8 L44 0 L0 0 Z" fill="#e8a060" opacity=".45"/>
