<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 300">
  <defs>
    <linearGradient id="es-bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8763a"/>
      <stop offset=".5" stop-color="#a65630"/>
      <stop offset="1" stop-color="#7e3d22"/>
    </linearGradient>
    <linearGradient id="es-pano" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1236"/>
      <stop offset=".55" stop-color="#4a1446"/>
      <stop offset="1" stop-color="#6e1652"/>
