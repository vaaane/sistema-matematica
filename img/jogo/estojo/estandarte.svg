  </defs>
  <!-- moldura de bronze -->
  <path d="M6 -2 H134 V228 L70 296 L6 228 Z" fill="url(#es-bronze)"/>
  <path d="M6 -2 H12 V226 L70 288 V296 L6 228 Z" fill="#000" opacity=".12"/>
