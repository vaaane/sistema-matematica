<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#15102a">
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎮 Tabuada — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    /* ── Tab bar ── */
    .page-tabs{display:flex;gap:0;border-bottom:1.5px solid var(--border);margin-bottom:20px;}
    .page-tab{padding:9px 20px;border:none;background:none;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-muted);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;font-family:'Inter',sans-serif;transition:color .12s;white-space:nowrap;}
    .page-tab:hover{color:var(--text);}
    .page-tab.active{color:var(--blue);border-bottom-color:var(--blue);}

    /* ── Jogar tab styles ── */
    .nota-row{padding:10px 0;border-bottom:0.5px solid var(--border);}
    .nota-row:last-child{border-bottom:none;}
    .nota-nivel{font-size:12px;font-weight:700;color:var(--blue-dark);}
    .nota-texto{font-size:13px;color:var(--text);line-height:1.5;margin-top:3px;white-space:pre-wrap;}
    @media(max-width:560px){.stat-grid{grid-template-columns:repeat(2,1fr)!important;}}
    .prog-tr:hover td{filter:brightness(.97);}
    .ovr-btn{padding:1px 7px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;line-height:1.6;font-family:inherit;}
    .ovr-btn:hover{background:var(--blue-pale);border-color:var(--blue);}
    .ovr-val{min-width:36px;display:inline-block;text-align:center;font-size:12px;font-weight:700;}
    .ovr-val.changed{color:var(--blue);}
    .ovr-rst{padding:1px 6px;border:1px solid rgba(239,68,68,.3);border-radius:5px;background:rgba(239,68,68,.06);color:var(--red);cursor:pointer;font-size:11px;font-family:inherit;}

    /* ── Alunos tab styles (from tabuada_relatorio) ── */
    .lvl-badge{display:inline-flex;align-items:center;justify-content:center;width:38px;height:24px;border-radius:12px;font-size:12px;font-weight:800;}
    .lvl-1-5{background:#DCFCE7;color:#15803D;}
    .lvl-6-10{background:#DBEAFE;color:#1D4ED8;}
    .lvl-11-15{background:#F5F3FF;color:#5B21B6;}
    .lvl-16p{background:linear-gradient(135deg,#FEF3C7,#FDE68A);color:#92400E;}
    .turma-pill{display:inline-flex;align-items:center;padding:4px 11px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:all .14s;margin-right:6px;margin-bottom:6px;}
    .turma-pill.on{border-color:var(--blue);background:var(--blue);color:#fff;}
    .rank-hero{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,var(--blue-pale),#F0F9FF);border:1.5px solid #BAE6FD;border-radius:var(--radius);margin-bottom:14px;}
    .spark{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 2px;}
    .spark.done{background:var(--green);}
    .spark.todo{background:var(--border);}
    .no-data{display:flex;flex-direction:column;align-items:center;padding:48px 20px;text-align:center;color:var(--text-muted);gap:10px;}
    .no-data svg{width:40px;height:40px;fill:var(--border);}
    .cfg-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .cfg-label{font-size:13px;font-weight:600;color:var(--text);min-width:130px;}
    .cfg-stepper{display:inline-flex;align-items:center;gap:0;border:1.5px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;}
    .cfg-step-btn{width:32px;height:36px;border:none;background:var(--bg);color:var(--text);font-size:18px;font-weight:700;cursor:pointer;transition:background .12s;display:flex;align-items:center;justify-content:center;}
    .cfg-step-btn:hover{background:var(--blue-pale);}
    .cfg-val{width:56px;height:36px;text-align:center;font-size:14px;font-weight:700;color:var(--text);border:none;border-left:1.5px solid var(--border);border-right:1.5px solid var(--border);background:var(--card);font-family:inherit;}
    .cfg-unit{font-size:12px;color:var(--text-muted);}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">🎮 Tabuada</div>
        <div class="topbar-sub" id="topbar-sub">Modo professor</div>
      </div>
      <div class="topbar-right" style="gap:8px;display:flex">
        <button class="btn btn-ghost btn-sm" id="btn-csv" style="display:none" onclick="exportarCSV()">
          <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
          Exportar CSV
        </button>
        <button class="btn btn-ghost btn-sm" id="btn-reload" onclick="recarregarAba()">
          <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          Atualizar
        </button>
      </div>
    </div>
    <div class="content">
      <!-- Tab bar -->
      <div class="page-tabs">
        <button class="page-tab active" id="tab-jogar" onclick="setTab('jogar')">🎮 Jogar</button>
        <button class="page-tab" id="tab-alunos" onclick="setTab('alunos')">👥 Alunos</button>
      </div>
      <!-- Tab contents -->
      <div id="pane-jogar"><div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div></div>
      <div id="pane-alunos" style="display:none"><div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div></div>
    </div>
  </div>
</div>

<script type="module">
import { requireProfessor, renderSidebarProfessor, clearSession } from "/js/auth.js";
import { ALUNOS_POR_TURMA } from "/js/constants.js";
import { db } from "/js/firebase-config.js";
import { ref, get, set, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { escH, agruparPorTurma, compilarAlertasTabuada } from "/js/tabuada-alerts.js";

requireProfessor();
renderSidebarProfessor("sidebar", "jogos");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

// ── Tab state ─────────────────────────────────────────────────
let _abaAtiva = 'jogar';
let _alunosCarregado = false;

window.setTab = function(aba) {
  _abaAtiva = aba;
  document.getElementById('tab-jogar').classList.toggle('active', aba === 'jogar');
  document.getElementById('tab-alunos').classList.toggle('active', aba === 'alunos');
  document.getElementById('pane-jogar').style.display = aba === 'jogar' ? '' : 'none';
  document.getElementById('pane-alunos').style.display = aba === 'alunos' ? '' : 'none';
  document.getElementById('btn-csv').style.display = aba === 'alunos' ? '' : 'none';
  document.getElementById('topbar-sub').textContent = aba === 'jogar'
    ? 'Modo professor — progresso salvo separado dos alunos'
    : 'Progresso dos alunos no mini-jogo';
  if (aba === 'alunos' && !_alunosCarregado) { loadAlunos(); }
};

window.recarregarAba = function() {
  if (_abaAtiva === 'jogar') loadJogar();
  else { _alunosCarregado = false; loadAlunos(); }
};

// ══════════════════════════════════════════════════════════════
// ABA JOGAR (ex professor/jogos.html)
// ══════════════════════════════════════════════════════════════
const PROF_UID  = 'professora';
const niveisRef = ref(db, `professor_tabuada_niveis/${PROF_UID}`);
const notasRef  = ref(db, `professor_jogos_notas/${PROF_UID}`);

function fmtDate(ts) {
  if (!ts) return '—';
  return new Date(Number(ts)).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

const _TB129 = 65;
const _TB200 = 45;
const _TB300 = 35;

function _tipoChefao(lvl) {
  if (lvl < 130 || lvl % 10 !== 0) return null;
  const ciclo = Math.floor((lvl - 130) / 10) % 3;
  return ciclo === 0 ? 'rapido' : ciclo === 1 ? 'dificil' : 'grande';
}

function _getLvlCfg(lvl) {
  if (lvl > 80 && lvl <= 120) { const b = _getLvlCfg(80); return { ...b, secs: b.secs + 40 }; }
  if (lvl <= 54) {
    const t = (lvl - 1) / 53;
    const pairs = Math.round(2 + t * 6);
    let secs = Math.round(70 - t * 15);
    const maxResult = Math.round(8 + t * 17);
    const cols = pairs <= 2 ? 2 : pairs <= 3 ? 3 : 4;
    if (lvl <= 30) secs = Math.round(secs / 2);
    return { pairs, cols, secs, maxResult, minMul: 0, minDiv: 0 };
  }
  if (lvl <= 65) {
    const t = (lvl - 55) / 10;
    const pairs = Math.round(4 + t * 4);
    const secs = Math.round(65 - t * 10);
    const cols = pairs <= 4 ? 3 : 4;
    const minMul = Math.max(1, Math.round(1 + t * (Math.floor(pairs / 3) - 1)));
    return { pairs, cols, secs, maxResult: 0, minMul, minDiv: 0 };
  }
  if (lvl <= 121) {
    const t = Math.min(1, (lvl - 66) / 24);
    const pairs = Math.round(4 + t * 14);
    const secs = Math.round(60 - t * 15);
    const cols = pairs <= 6 ? 4 : 6;
    const perOp = Math.floor(pairs / 4);
    const minMul = Math.max(1, Math.round(1 + t * (perOp - 1)));
    const minDiv = Math.max(1, Math.round(1 + t * (perOp - 1)));
    return { pairs, cols, secs, maxResult: 0, minMul, minDiv };
  }
  if (lvl <= 129) return { pairs: 12, cols: 6, secs: _TB129, maxResult: 0, minMul: 4, minDiv: 4 };
  const n = Math.floor((lvl - 130) / 10);
  if (lvl % 10 === 0) {
    const tipo = _tipoChefao(lvl);
    const minMul = Math.min(5 + n, 7), minDiv = Math.min(5 + n, 7);
    if (tipo === 'rapido') {
      const secsR = lvl > 300 ? _TB300 - 5 : _TB129 - 20;
      return { pairs: 12, cols: 6, secs: Math.max(20, secsR), maxResult: 0, minMul, minDiv, ehChefao: true, tipoChefao: 'rapido' };
    }
    if (tipo === 'dificil') {
      const secsD = lvl > 300 ? _TB300 : lvl >= 200 ? _TB200 : _TB129;
      return { pairs: 12, cols: 6, secs: secsD, maxResult: 0, minMul: Math.min(6+n,8), minDiv: Math.min(6+n,8), ehChefao: true, tipoChefao: 'dificil' };
    }
    const grandeIdx = Math.floor((lvl - 150) / 30);
    const _tBase = lvl > 300 ? _TB300 : lvl > 200 ? _TB200 : _TB129;
    const secsG = lvl === 300 ? 20 : grandeIdx % 2 === 1 ? Math.max(20, _tBase - 10) : Math.min(120, _tBase + 5);
    return { pairs: 18, cols: 6, secs: secsG, maxResult: 0, minMul, minDiv, ehChefao: true, tipoChefao: 'grande' };
  }
  const _tBase = lvl > 300 ? _TB300 : lvl > 200 ? _TB200 : _TB129;
  const secs = (lvl >= 132 && lvl <= 139) ? Math.max(20, _TB129 - 20) : _tBase;
  return { pairs: 12, cols: 6, secs, maxResult: 0, minMul: Math.min(4+n,6), minDiv: Math.min(4+n,6), pesado: lvl > 300 };
}

function _gerarGrupos() {
  const gs = [];
  let g = null;
  for (let lvl = 1; lvl <= 400; lvl++) {
    const cfg = _getLvlCfg(lvl);
    const tipo = cfg.ehChefao ? 'chefao' : (lvl >= 130 && lvl % 10 !== 0 ? 'pos' : 'normal');
    const sig = [cfg.pairs, cfg.cols, cfg.secs, cfg.minMul, cfg.minDiv, cfg.maxResult || 0, tipo, cfg.tipoChefao || ''].join('|');
    if (g && g.sig === sig) { g.end = lvl; }
    else { g = { start: lvl, end: lvl, cfg, tipo, sig }; gs.push(g); }
  }
  return gs;
}

function _fmtOps(cfg) {
  let s = '➕ ➖';
  if (cfg.minMul > 0) s += ' ×';
  if (cfg.minDiv > 0) s += ' ÷';
  const m = [];
  if (cfg.minMul > 0) m.push(`${cfg.minMul}×`);
  if (cfg.minDiv > 0) m.push(`${cfg.minDiv}÷`);
  if (m.length) s += ` <span style="font-size:10px;color:var(--text-muted)">(mín ${m.join(' ')})</span>`;
  return s;
}

function _rowObs(g) {
  if (g.end <= 30)                    return '⏱️ Tempo ÷2 (aprendizado)';
  if (g.start >= 55 && g.end <= 65)  return '× introduzida gradualmente';
  if (g.start >= 66 && g.end <= 80)  return 'Todas as ops: ➕➖×÷';
  if (g.start >= 81  && g.end <= 120) return 'Dificuldade = nv80 + 40s';
  if (g.start === 121)               return 'Pico: 45s · 12 pares';
  if (g.start >= 122 && g.end <= 129) return 'Respiro pré-chefão (65s)';
  if (g.tipo === 'chefao') {
    const t = g.cfg.tipoChefao;
    return t === 'rapido' ? '⚡ Chefão Rápido (45s)' : t === 'dificil' ? '🧮 Chefão Difícil' : '📦 Chefão Grande';
  }
  if (g.start > 200) return 'Base 45s (200+)';
  return '';
}

let _tempoOverrides = {};
let _ultimoTeste = {};
const _ovrRef  = ref(db, 'professor_tabuada_config/tempo_override');
const _histRef = ref(db, 'modo_teste_historico/PROFESSOR_TESTE/tabuada');

async function _carregarDadosProgressao() {
  const [ovrSnap, histSnap, profHistSnap] = await Promise.all([
    get(_ovrRef).catch(() => null),
    get(_histRef).catch(() => null),
    get(ref(db, 'professor_tabuada_niveis/professora/historico')).catch(() => null),
  ]);
  _tempoOverrides = {};
  if (ovrSnap?.exists()) ovrSnap.forEach(c => { _tempoOverrides[+c.key] = c.val(); });
  _ultimoTeste = {};
  if (histSnap?.exists()) {
    histSnap.forEach(c => {
      const ts = +c.key; const v = c.val();
      if (!v?.nivel) return;
      const entry = { ...v, timestamp: ts };
      const prev = _ultimoTeste[v.nivel];
      if (!prev || ts > prev.timestamp) _ultimoTeste[v.nivel] = entry;
    });
  }
  if (profHistSnap?.exists()) {
    profHistSnap.forEach(c => {
      const ts = +c.key; const v = c.val();
      if (!v?.nivel) return;
      const cfg = _getLvlCfg(v.nivel);
      const segs = v.segundos_restantes ?? null;
      const tempo_usado = segs != null ? cfg.secs - segs : cfg.secs;
      const entry = { ...v, timestamp: ts, tempo_usado };
      const prev = _ultimoTeste[v.nivel];
      if (!prev || ts > prev.timestamp) _ultimoTeste[v.nivel] = entry;
    });
  }
}

function _fmtTempo(seg) {
  const m = Math.floor(seg / 60), s = seg % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function _ultimoTesteHTML(g) {
  let best = null;
  for (let l = g.start; l <= g.end; l++) {
    const e = _ultimoTeste[l];
    if (e && (!best || e.timestamp > best.timestamp)) best = e;
  }
  if (!best) return '<span style="color:var(--text-muted)">—</span>';
  const t = best.tempo_usado != null ? _fmtTempo(best.tempo_usado) : '?';
  const ok = best.resultado === 'completou';
  return `<span style="font-weight:600">${t}</span> ${ok ? '✅' : '⏱'}`;
}

function _ovrSecsForGroup(g) {
  return _tempoOverrides[g.start] ?? g.cfg.secs;
}

function _renderProgressaoTable() {
  const gs = _gerarGrupos();
  const YEL_BG = 'background:rgba(250,184,0,.22);outline:1.5px solid rgba(250,184,0,.55);outline-offset:-1px;';
    // yel(val, flag): wraps val in amber span when flag is truthy
    const yel = (val, flag) => flag
      ? `<span style="color:#FAB800;font-weight:700">${val}</span>`
      : val;
  const rows = gs.map((g, i) => {
    const prev = gs[i - 1];
    const lvlLabel = g.start === g.end ? `${g.start}` : `${g.start}–${g.end}`;
    const rowBg = g.tipo === 'chefao' ? 'background:rgba(239,68,68,.1);'
      : g.tipo === 'pos' ? 'background:rgba(249,115,22,.07);'
      : i % 2 ? 'background:rgba(0,0,0,.018);' : '';
    const tipoLabel = g.tipo === 'chefao'
      ? (g.cfg.tipoChefao === 'rapido' ? '⚡ Rápido' : g.cfg.tipoChefao === 'dificil' ? '🧮 Difícil' : g.cfg.tipoChefao === 'grande' ? '📦 Grande' : '👹 Chefão')
      : g.tipo === 'pos' ? 'Pós-chefão' : '—';
    const gridLabel = `${g.cfg.cols}×${Math.ceil(g.cfg.pairs * 2 / g.cfg.cols)}`;
    const faixaLabel = g.cfg.maxResult ? `1–${g.cfg.maxResult}` : '—';
    const td = s => `style="padding:5px 10px;border-bottom:1px solid var(--border);${s}"`;
    const cS = prev && prev.cfg.secs !== g.cfg.secs ? YEL_BG : '';
    const cG = prev && (prev.cfg.pairs !== g.cfg.pairs || prev.cfg.cols !== g.cfg.cols) ? YEL_BG : '';
    const cC = prev && prev.cfg.pairs !== g.cfg.pairs ? YEL_BG : '';
    const ovrSecs = _ovrSecsForGroup(g);
    const hasOvr = _tempoOverrides[g.start] != null;
    const ovrValCls = hasOvr ? 'ovr-val changed' : 'ovr-val';
    return `<tr class="prog-tr" style="${rowBg}cursor:pointer" onclick="selecionarNivelParaTeste(${g.start})" title="Testar nível ${g.start}">
      <td ${td('font-weight:700;white-space:nowrap')}>${lvlLabel}</td>
      <td ${td('font-size:11px')}>${tipoLabel}</td>
      <td ${td('text-align:center;'+cS)}>${yel(g.cfg.secs+'s', cS)}</td>
      <td ${td('text-align:center;'+cG)}>${yel(gridLabel, cG)}</td>
      <td ${td('text-align:center;'+cC)}>${yel(g.cfg.pairs * 2, cC)}</td>
      <td ${td('')}>${_fmtOps(g.cfg)}</td>
      <td ${td('text-align:center')}>${faixaLabel}</td>
      <td ${td('white-space:nowrap')} onclick="event.stopPropagation()">
        <div style="display:flex;align-items:center;gap:3px">
          <button class="ovr-btn" onclick="ajustarTempoGrupo(${g.start},${g.end},-5)">−</button>
          <span class="${ovrValCls}" id="ovr-${g.start}">${ovrSecs}s</span>
          <button class="ovr-btn" onclick="ajustarTempoGrupo(${g.start},${g.end},+5)">+</button>
          ${hasOvr ? `<button class="ovr-rst" onclick="resetarTempoGrupo(${g.start},${g.end})">↩</button>` : ''}
        </div>
      </td>
      <td ${td('white-space:nowrap;font-size:12px')}>${_ultimoTesteHTML(g)}</td>
      <td ${td('font-size:11px;color:var(--text-muted)')}>${_rowObs(g)}</td>
    </tr>`;
  }).join('');
  const body = document.getElementById('prog-table-body');
  if (body) body.innerHTML = rows;
}

window.toggleProgressao = async function() {
  const wrap = document.getElementById('prog-table-wrap');
  const chev = document.getElementById('prog-chev');
  if (!wrap) return;
  const open = wrap.style.display !== 'none';
  wrap.style.display = open ? 'none' : 'block';
  if (chev) chev.textContent = open ? '▼' : '▲';
  if (!open) {
    await _carregarDadosProgressao();
    _renderProgressaoTable();
  }
};

window.exportarProgressaoCSV = function() {
  const gs = _gerarGrupos();
  const linhas = [['Nível','Tipo','Tempo (s)','Grid','Total cards','Min ×','Min ÷','Faixa números','Observação']];
  gs.forEach(g => {
    linhas.push([
      g.start === g.end ? `${g.start}` : `${g.start}-${g.end}`,
      g.tipo === 'chefao' ? 'Chefão' : g.tipo === 'pos' ? 'Pós-chefão' : 'Normal',
      g.cfg.secs, `${g.cfg.cols}x${Math.ceil(g.cfg.pairs * 2 / g.cfg.cols)}`,
      g.cfg.pairs * 2, g.cfg.minMul || 0, g.cfg.minDiv || 0,
      g.cfg.maxResult ? `1-${g.cfg.maxResult}` : 'variada', _rowObs(g),
    ]);
  });
  const csv = linhas.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8' })), download:'progressao_niveis_tabuada.csv' });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

window.selecionarNivelParaTeste = function(lvl) {
  const inp = document.getElementById('inp-nivel');
  if (!inp) return;
  inp.value = lvl;
  inp.closest('.card')?.scrollIntoView({ behavior:'smooth', block:'center' });
  inp.focus();
};

async function loadJogar() {

window.ajustarTempoGrupo = async function(start, end, delta) {
  const defaultSecs = _getLvlCfg(start).secs;
  const current = _tempoOverrides[start] ?? defaultSecs;
  const novo = Math.max(5, Math.min(300, current + delta));
  const updates = {};
  for (let l = start; l <= end; l++) updates[l] = novo;
  try {
    await update(ref(db, 'professor_tabuada_config/tempo_override'), updates);
    for (let l = start; l <= end; l++) _tempoOverrides[l] = novo;
    const el = document.getElementById(`ovr-${start}`);
    if (el) { el.textContent = `${novo}s`; el.className = 'ovr-val changed'; el.style.color = '#16A34A'; setTimeout(() => { el.style.color = ''; }, 1500); }
  } catch(e) { alert(`Erro ao salvar override: ${e.message}`); }
};

window.resetarTempoGrupo = async function(start, end) {
  const removes = [];
  for (let l = start; l <= end; l++) { removes.push(remove(ref(db, `professor_tabuada_config/tempo_override/${l}`))); delete _tempoOverrides[l]; }
  await Promise.all(removes);
  const el = document.getElementById(`ovr-${start}`);
  if (el) { el.textContent = `${_getLvlCfg(start).secs}s`; el.className = 'ovr-val'; }
  await _carregarDadosProgressao();
  _renderProgressaoTable();
};

window.testarNivel = function() {
  const nivel = parseInt(document.getElementById('inp-nivel')?.value, 10);
  if (isNaN(nivel) || nivel < 1 || nivel > 999) { alert('Digite um nível entre 1 e 999.'); return; }
  const ovr = _tempoOverrides[nivel];
  window.location.href = ovr != null ? `/aluno/tabuada.html?nivel=${nivel}&secs=${ovr}` : `/aluno/tabuada.html?nivel=${nivel}`;
};

window.salvarNota = async function() {
  const nivel = Math.max(1, Math.min(50, parseInt(document.getElementById('nota-nivel')?.value) || 1));
  const texto = document.getElementById('nota-texto')?.value?.trim() || '';
  if (!texto) return;
  await set(ref(db, `professor_jogos_notas/${PROF_UID}/${nivel}`), { texto, atualizado_em: Date.now() });
  await loadJogar();
};

window.deletarNota = async function(nivel) {
  if (!confirm(`Remover anotação do nível ${nivel}?`)) return;
  await remove(ref(db, `professor_jogos_notas/${PROF_UID}/${nivel}`));
  await loadJogar();
};

function stdPos(lista, getVal) {
  let pos = 0, n = 0, last = null;
  return lista.map(item => { n++; const v = getVal(item); if (v !== last) { pos = n; last = v; } return pos; });
}

function lvlClass(n) {
  if (n >= 16) return 'lvl-16p';
  if (n >= 11) return 'lvl-11-15';
  if (n >= 6)  return 'lvl-6-10';
  return 'lvl-1-5';
}
function fmtDateShort(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}

async function loadAlunos() {
  _alunosCarregado = true;
  const pane = document.getElementById('pane-alunos');
  pane.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando dados…</div>';

  try {
    const cfgSnap = await get(ref(db, 'tabuada_config/global'));
    if (cfgSnap?.exists()) _tabuadaConfig = { ..._tabuadaConfig, ...cfgSnap.val() };

    const [rankSnap, niveisSnap] = await Promise.all([
      get(ref(db, 'tabuada_ranking')),
      get(ref(db, 'tabuada_niveis')),
    ]);

    _allData = [];
    if (rankSnap?.exists()) rankSnap.forEach(c => { const v=c.val(); if(v?.nome) _allData.push({...v}); });

    const niveisMap = {};
    if (niveisSnap?.exists()) niveisSnap.forEach(c => { if(c.val()) niveisMap[c.key]=c.val(); });

    _allData.forEach(d => {
      const key = (d.turma+'_'+d.nome).replace(/[.#$\[\]/\s]/g,'_');
      const nd = niveisMap[key];
      d.total_partidas = nd?.total_partidas || 0;
      d.maior_combo    = nd?.maior_combo    || 0;
    });
    _allData.sort((a,b) => (b.melhor_nivel||0)-(a.melhor_nivel||0));

    const { individuais, coletivos } = compilarAlertasTabuada(niveisSnap, rankSnap);
    _alertasInd = individuais; _alertasCol = coletivos;

    document.getElementById('btn-csv').disabled = _allData.length === 0;
  } catch(e) {
    pane.innerHTML = `<div class="alert alert-error">Erro ao carregar dados. Verifique a conexão.</div>`;
    return;
  }
  renderAlunos();
}

    ${top3.map((d,i)=>{

      const ico=['🥇','🥈','🥉'][i];
      return `<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:11px;background:${bg}">
        <span style="font-size:28px">${ico}</span>
        <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:800;color:#fff">${d.nome}</div><div style="font-size:11px;color:rgba(255,255,255,.75)">Turma ${d.turma} · ${d.total_partidas} partida(s)</div></div>
        <div style="text-align:right"><div style="font-size:20px;font-weight:800;color:#fff">Nível ${d.melhor_nivel}</div><div style="font-size:10px;color:rgba(255,255,255,.7)">melhor</div></div>
      </div>`;
    }).join('')}
  </div>
</div>` : ''}

<div class="card" style="margin-bottom:20px">
  <div class="card-header"><div class="card-title"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>Resumo por Turma</div></div>
  <div style="overflow-x:auto"><table class="table">
    <thead><tr><th>Turma</th><th>Cadastrados</th><th>Jogaram</th><th>Participação</th><th>Nível Médio</th><th>Maior Nível</th></tr></thead>
    <tbody>${turmaSummary.map(ts=>`<tr>
      <td><strong>Turma ${ts.t}</strong></td><td>${ts.cad}</td><td><strong>${ts.jog}</strong></td>
      <td><div style="display:flex;align-items:center;gap:6px"><div style="width:80px;height:6px;background:var(--border);border-radius:3px;overflow:hidden"><div style="width:${ts.cad?Math.round(ts.jog/ts.cad*100):0}%;height:100%;background:var(--blue);border-radius:3px"></div></div><span style="font-size:12px;color:var(--text-muted)">${ts.cad?Math.round(ts.jog/ts.cad*100):0}%</span></div></td>
      <td><span style="font-weight:700;color:var(--blue)">${ts.med}</span></td>
      <td><span style="font-weight:800;color:var(--gold)">${ts.mx}</span></td>
    </tr>`).join('')}</tbody>
  </table></div>
</div>

<div class="card">
  <div class="card-header">
    <div class="card-title"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>Todos os Alunos</div>
    <div><span style="font-size:11px;color:var(--text-muted);margin-right:8px">Filtrar:</span>${turmasPillsHtml}</div>
  </div>
  ${data.length===0
    ? `<div class="no-data"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><p>${_filtroTurma?`Nenhum aluno da Turma ${_filtroTurma} jogou ainda.`:'Nenhum aluno jogou ainda.'}</p></div>`
    : `<div style="overflow-x:auto"><table class="table">
    <thead><tr><th>#</th><th>Aluno</th><th>Turma</th><th>Nível</th><th>Partidas</th><th>Maior Combo</th><th>Última Partida</th></tr></thead>
    <tbody>${(()=>{
      const pos=stdPos(data,d=>Math.max(d.nivel_atual||1,d.melhor_nivel||1));
      return data.map((d,i)=>{
        const nMax=Math.max(d.nivel_atual||1,d.melhor_nivel||1);
        return `<tr>
          <td style="color:var(--text-muted);font-weight:600">${pos[i]}</td>
          <td><strong>${d.nome}</strong></td>
          <td>${d.turma}</td>
          <td><span class="lvl-badge ${lvlClass(nMax)}">${nMax}</span></td>
          <td style="color:var(--text-muted);font-size:13px">${d.total_partidas||0}</td>
          <td style="font-size:13px;color:${d.maior_combo>=5?'#FAB800':d.maior_combo>=3?'#f97316':'var(--text-muted)'};font-weight:${d.maior_combo>=3?'700':'400'}">${d.maior_combo||'—'}</td>
          <td style="color:var(--text-muted);font-size:12px">${fmtDateShort(d.ultima_partida)}</td>
        </tr>`;
      }).join('');
    })()}</tbody>
  </table></div>`}
</div>`;
}

window.mudarFiltroAlunos = function(t) { _filtroTurma = t; renderAlunos(); };

window.exportarCSV = function() {
  const data = _filtroTurma ? _allData.filter(d=>d.turma===_filtroTurma) : _allData;
  const header = ['Nome','Turma','Nível Atual','Melhor Nível','Total Partidas','Maior Combo','Última Partida'];
  const rows = data.map(d=>[d.nome,d.turma,d.nivel_atual||1,d.melhor_nivel||1,d.total_partidas||0,d.maior_combo||0,d.ultima_partida?new Date(d.ultima_partida).toLocaleString('pt-BR'):'—']);
  const csv = [header,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'})); a.download=`tabuada_alunos_${new Date().toISOString().slice(0,10)}.csv`; a.click();
};

// ── Boot ──────────────────────────────────────────────────────
// Abrir aba de alunos direto se URL tiver #alunos
if (location.hash === '#alunos') setTab('alunos');
else loadJogar();
</script>
</body>
</html>
