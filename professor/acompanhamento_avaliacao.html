<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Avaliação ao Vivo — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .av-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
    .av-filters select,.av-filters input[type=date]{padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}
    .av-filters select:focus,.av-filters input[type=date]:focus{outline:2px solid var(--blue);outline-offset:1px;}
    .av-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
    @media(max-width:640px){.av-cards{grid-template-columns:repeat(2,1fr);}}
    .av-card{background:var(--card);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;border:1px solid var(--border);}
    .av-card-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;}
    .av-card-val{font-size:24px;font-weight:800;line-height:1;}
    .av-card-label{font-size:11px;color:var(--text-muted);margin-top:3px;}
    .av-section{margin-bottom:22px;}
    .av-section-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
    .av-section-title{font-size:15px;font-weight:700;}
    .av-section-count{font-size:12px;color:var(--text-muted);background:var(--bg);padding:2px 8px;border-radius:10px;border:1px solid var(--border);}
    .av-table{width:100%;border-collapse:collapse;font-size:13px;}
    .av-table th{text-align:left;padding:8px 12px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--border);white-space:nowrap;}
    .av-table td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
    .av-table tr:last-child td{border-bottom:none;}
    .av-table tr.row-urgent{background:rgba(239,68,68,.06);}
    .av-table tr.row-urgent td:first-child{border-left:3px solid #EF4444;}
    .av-table tr.row-warn{background:rgba(234,179,8,.06);}
    .av-table tbody tr:hover{background:rgba(0,0,0,.03);}
    .av-table tr.row-urgent:hover{background:rgba(239,68,68,.1);}
    .badge-turma{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:rgba(47,158,220,.12);color:var(--blue);}
    .badge-tent{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:rgba(0,0,0,.07);color:var(--text);}
    .badge-last{background:rgba(234,179,8,.15);color:#B45309;}
    .tempo-ok{color:var(--green);font-weight:700;font-variant-numeric:tabular-nums;}
    .tempo-warn{color:#F59E0B;font-weight:700;font-variant-numeric:tabular-nums;}
    .tempo-urgente{color:#EF4444;font-weight:800;font-variant-numeric:tabular-nums;animation:blink-red .9s step-end infinite;}
    .tempo-esgotado{color:var(--text-muted);font-size:12px;}
    @keyframes blink-red{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes flash-green{0%{background:rgba(34,197,94,.28)}100%{background:transparent}}
    .flash-green{animation:flash-green 2.4s ease forwards;}
    .av-aviso{font-size:13px;color:var(--text-muted);padding:16px;border-radius:0;}
    @media(max-width:768px){
      .av-filters{flex-direction:column;align-items:stretch;}
      .av-filters select,.av-filters input{width:100%;box-sizing:border-box;}
      .av-table th:nth-child(3),.av-table td:nth-child(3){display:none;}
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Avaliação ao Vivo</div>
        <div class="topbar-sub">Acompanhamento em tempo real · modo Avaliação+</div>
      </div>
      <div class="topbar-right"><div class="avatar avatar-blue">P</div></div>
    </div>
    <div class="content">

      <!-- Filtros -->
      <div class="av-filters">
        <select id="filtro-ativ"><option value="">Todas as atividades</option></select>
        <select id="filtro-turma">
          <option value="">Todas as turmas</option>
          <option value="8D">8D</option>
          <option value="8E">8E</option>
          <option value="8F">8F</option>
          <option value="8G">8G</option>
          <option value="8H">8H</option>
        </select>
        <input type="date" id="filtro-data"/>
      </div>

      <!-- Cards resumo -->
      <div class="av-cards">
        <div class="av-card">
          <div class="av-card-icon" style="background:rgba(47,158,220,.12)">👥</div>
          <div><div class="av-card-val" id="card-total">0</div><div class="av-card-label">Total</div></div>
        </div>
        <div class="av-card">
          <div class="av-card-icon" style="background:rgba(34,197,94,.12)">✅</div>
          <div><div class="av-card-val" id="card-concluidas" style="color:var(--green)">0</div><div class="av-card-label">Concluídas</div></div>
        </div>
        <div class="av-card">
          <div class="av-card-icon" style="background:rgba(234,179,8,.12)">⏳</div>
          <div><div class="av-card-val" id="card-andamento" style="color:#F59E0B">0</div><div class="av-card-label">Em andamento</div></div>
        </div>
        <div class="av-card">
          <div class="av-card-icon" style="background:rgba(239,68,68,.12)">❌</div>
          <div><div class="av-card-val" id="card-nao" style="color:#EF4444">0</div><div class="av-card-label">Não iniciaram</div></div>
        </div>
      </div>

      <!-- Em andamento -->
      <div class="av-section">
        <div class="av-section-head">
          <div class="av-section-title">⏳ Em andamento</div>
          <div class="av-section-count" id="count-andamento">0</div>
        </div>
        <div class="card" style="padding:0;overflow:hidden">
          <div id="sec-andamento">
            <div class="av-aviso">Carregando…</div>
          </div>
        </div>
      </div>

      <!-- Concluídas -->
      <div class="av-section">
        <div class="av-section-head">
          <div class="av-section-title">✅ Concluídas</div>
          <div class="av-section-count" id="count-concluidas">0</div>
        </div>
        <div class="card" style="padding:0;overflow:hidden">
          <div id="sec-concluidas">
            <div class="av-aviso">Carregando…</div>
          </div>
        </div>
      </div>

      <!-- Não iniciaram -->
      <div class="av-section">
        <div class="av-section-head">
          <div class="av-section-title">❌ Não iniciaram</div>
          <div class="av-section-count" id="count-nao">0</div>
        </div>
        <div class="card" style="padding:0;overflow:hidden">
          <div id="sec-nao-aviso" class="av-aviso">
            Selecione uma atividade e uma turma específicas para ver quem ainda não iniciou.
          </div>
          <div id="sec-nao-lista" style="display:none"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script type="module">
import { db } from "/js/firebase-config.js";
import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { ALUNOS_POR_TURMA } from "/js/constants.js";
import { requireProfessor, renderSidebarProfessor, clearSession } from "/js/auth.js";

const sess = requireProfessor();
if (!sess) throw new Error();
renderSidebarProfessor("sidebar", "acomp_aval");
window.sair = () => { clearSession(); location.href = '/index.html'; };

const DURACAO_MS = 25 * 60 * 1000;
const escH = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let todosRegistros = [];
let filtroAtiv  = '';
let filtroTurma = '';
let filtroData  = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
let prevInProgress  = new Set();
let recentlyDone = new Set();

// Init date filter to today
document.getElementById('filtro-data').value = filtroData;

// Filter event handlers
document.getElementById('filtro-ativ').addEventListener('change', e => { filtroAtiv = e.target.value; renderizarTudo(); });
document.getElementById('filtro-turma').addEventListener('change', e => { filtroTurma = e.target.value; renderizarTudo(); });
document.getElementById('filtro-data').addEventListener('change', e => { filtroData = e.target.value; renderizarTudo(); });

// ── Firebase listener ─────────────────────────────────────────
onValue(ref(db, 'resultados'), snap => {
  todosRegistros = [];
  snap.forEach(child => {
    const v = child.val();
    if (v?.modo === 'avaliacao_plus') todosRegistros.push({ id: child.key, ...v });
  });

  popularDropdownAtiv();

  // Detect newly completed sessions for flash effect
  const { emAndamento } = aplicarFiltros();
  const currIds = new Set(emAndamento.map(r => r.id));
  recentlyDone = new Set([...prevInProgress].filter(id => !currIds.has(id)));
  prevInProgress = currIds;

  renderizarTudo();
  setTimeout(() => recentlyDone.clear(), 2600);
});

// ── Timer: atualiza tempo restante a cada segundo ─────────────
setInterval(() => {
  document.querySelectorAll('.tempo-cell[data-ts]').forEach(cell => {
    const ms = parseInt(cell.dataset.ts) * 1000 + DURACAO_MS - Date.now();
    cell.innerHTML = tempoHtml(ms);
    const row = cell.closest('tr');
    if (!row) return;
    if (ms > 0 && ms < 3 * 60 * 1000) {
      if (!row.classList.contains('row-urgent')) row.className = 'row-urgent';
    } else if (ms > 0 && ms < 5 * 60 * 1000) {
      if (!row.classList.contains('row-warn') && !row.classList.contains('row-urgent')) row.className = 'row-warn';
    }
  });
}, 1000);

// ── Dropdown de atividades ────────────────────────────────────
function popularDropdownAtiv() {
  const atividades = [...new Set(todosRegistros.map(r => r.atividade).filter(Boolean))].sort();
  const sel = document.getElementById('filtro-ativ');
  const cur = filtroAtiv;
  while (sel.options.length > 1) sel.remove(1);
  atividades.forEach(a => sel.add(new Option(a, a)));
  if (atividades.includes(cur)) {
    sel.value = cur;
  } else {
    sel.value = '';
    filtroAtiv = '';
  }
}

// ── Filtros ───────────────────────────────────────────────────
function aplicarFiltros() {
  let r = todosRegistros;
  if (filtroAtiv)  r = r.filter(x => x.atividade === filtroAtiv);
  if (filtroTurma) r = r.filter(x => x.turma === filtroTurma);
  if (filtroData) {
    const [y, m, d] = filtroData.split('-');
    const ptBR = `${d}/${m}/${y}`;
    r = r.filter(x => {
      if (x.ts_inicio) return new Date(x.ts_inicio * 1000).toLocaleDateString('pt-BR') === ptBR;
      return x.data?.startsWith(ptBR);
    });
  }
  return { emAndamento: r.filter(x => !x.concluido), concluidos: r.filter(x => x.concluido) };
}

// ── Agrupamento por sessão (mesmo ts_inicio = mesmo par) ──────
function agruparPorSessao(registros) {
  const map = new Map();
  for (const r of registros) {
    const k = `${r.turma}|${r.atividade}|${r.ts_inicio}`;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  }
  return [...map.values()];
}

// ── Renderização principal ────────────────────────────────────
function renderizarTudo() {
  const { emAndamento, concluidos } = aplicarFiltros();
  const sessoesAnd = agruparPorSessao(emAndamento);
  const sessoesCon = agruparPorSessao(concluidos);

  // Não iniciaram: só quando atividade e turma específicas selecionadas
  let naoIniciaram = [];
  if (filtroAtiv && filtroTurma) {
    const iniciaram = new Set(
      todosRegistros
        .filter(r => r.atividade === filtroAtiv && r.turma === filtroTurma)
        .map(r => r.aluno)
    );
    naoIniciaram = (ALUNOS_POR_TURMA[filtroTurma] || []).filter(n => !iniciaram.has(n));
  }

  const totalCount = sessoesAnd.length + sessoesCon.length + naoIniciaram.length;

  // Cards
  document.getElementById('card-total').textContent       = totalCount;
  document.getElementById('card-concluidas').textContent  = sessoesCon.length;
  document.getElementById('card-andamento').textContent   = sessoesAnd.length;
  document.getElementById('card-nao').textContent         = naoIniciaram.length;
  document.getElementById('count-andamento').textContent  = sessoesAnd.length;
  document.getElementById('count-concluidas').textContent = sessoesCon.length;
  document.getElementById('count-nao').textContent        = naoIniciaram.length;

  // Sections
  document.getElementById('sec-andamento').innerHTML  = renderAndamento(sessoesAnd);
  document.getElementById('sec-concluidas').innerHTML = renderConcluidas(sessoesCon);
  renderNaoIniciaram(naoIniciaram);
}

// ── Tempo restante ────────────────────────────────────────────
function tempoHtml(ms) {
  if (ms <= 0) return '<span class="tempo-esgotado">Esgotado</span>';
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const str = `${String(m).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
  if (ms < 3 * 60 * 1000) return `<span class="tempo-urgente">⏱ ${str}</span>`;
  if (ms < 5 * 60 * 1000) return `<span class="tempo-warn">⏱ ${str}</span>`;
  return `<span class="tempo-ok">⏱ ${str}</span>`;
}

// ── Seção: Em andamento ───────────────────────────────────────
function renderAndamento(sessoes) {
  if (!sessoes.length) return emptyState('Nenhum aluno em avaliação no momento.');
  return `<table class="av-table">
    <thead><tr>
      <th>Aluno(s)</th><th>Turma</th><th>Tentativa</th><th>Tempo restante</th>
    </tr></thead>
    <tbody>${sessoes.map(grupo => {
      const rep = grupo[0];
      const nomes = grupo.map(g => escH(g.aluno)).join(' &amp; ');
      const ms = rep.ts_inicio * 1000 + DURACAO_MS - Date.now();
      const urgent  = ms > 0 && ms < 3 * 60 * 1000;
      const warnLast = (rep.tentativa_num || 1) >= 3;
      const cls = urgent ? 'row-urgent' : warnLast ? 'row-warn' : '';
      const tentLabel = (rep.tentativa_num || 1) >= 3
        ? `<span class="badge-tent badge-last">${rep.tentativa_num || 1}ª de 3</span>`
        : `<span class="badge-tent">${rep.tentativa_num || 1}ª de 3</span>`;
      return `<tr class="${cls}" data-session-id="${escH(rep.id)}">
        <td><strong>${nomes}</strong></td>
        <td><span class="badge-turma">${escH(rep.turma)}</span></td>
        <td>${tentLabel}</td>
        <td class="tempo-cell" data-ts="${rep.ts_inicio}">${tempoHtml(ms)}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

// ── Seção: Concluídas ─────────────────────────────────────────
function renderConcluidas(sessoesList) {
  if (!sessoesList.length) return emptyState('Nenhum aluno concluiu ainda.');

  // Agrupar sessões por grupo de alunos (nomes ordenados + atividade + turma)
  const byGroup = new Map();
  for (const sessao of sessoesList) {
    const nomesSorted = [...new Set(sessao.map(r => r.aluno))].sort().join('|');
    const k = `${nomesSorted}|${sessao[0].atividade}|${sessao[0].turma}`;
    if (!byGroup.has(k)) {
      byGroup.set(k, { nomes: [...new Set(sessao.map(r => r.aluno))], turma: sessao[0].turma, sessoes: [] });
    }
    byGroup.get(k).sessoes.push(sessao);
  }

  const rows = [...byGroup.values()].map(sg => {
    const recs = sg.sessoes.flat();
    const maxTent    = Math.max(...recs.map(r => r.tentativa_num || 1));
    const notaVals   = recs.map(r => r.nota_quiz).filter(n => typeof n === 'number');
    const melhorNota = notaVals.length ? Math.max(...notaVals) : null;
    const ultimaTs   = Math.max(...recs.map(r => r.ts_inicio || 0));
    const ultimaData = recs.find(r => r.ts_inicio === ultimaTs)?.data || '';
    const isRecent   = recs.some(r => recentlyDone.has(r.id));
    return { nomes: sg.nomes, turma: sg.turma, maxTent, melhorNota, ultimaTs, ultimaData, isRecent };
  });

  rows.sort((a, b) => b.ultimaTs - a.ultimaTs);

  return `<table class="av-table">
    <thead><tr>
      <th>Aluno(s)</th><th>Turma</th><th>Tentativas</th><th>Melhor nota F1</th><th>Horário</th>
    </tr></thead>
    <tbody>${rows.map(row => {
      const notaStr = row.melhorNota !== null ? row.melhorNota.toFixed(1) + '/10' : '—';
      const horario = row.ultimaData.split(' ')[1] || '—';
      return `<tr class="${row.isRecent ? 'flash-green' : ''}">
        <td><strong>${row.nomes.map(escH).join(' &amp; ')}</strong></td>
        <td><span class="badge-turma">${escH(row.turma)}</span></td>
        <td style="color:var(--text-muted)">${row.maxTent} de 3</td>
        <td><strong style="color:var(--green)">${notaStr}</strong></td>
        <td style="color:var(--text-muted);font-variant-numeric:tabular-nums">${horario}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

// ── Seção: Não iniciaram ──────────────────────────────────────
function renderNaoIniciaram(lista) {
  const aviso = document.getElementById('sec-nao-aviso');
  const listaEl = document.getElementById('sec-nao-lista');
  if (!filtroAtiv || !filtroTurma) {
    aviso.style.display = '';
    listaEl.style.display = 'none';
    return;
  }
  aviso.style.display = 'none';
  listaEl.style.display = '';
  if (!lista.length) {
    listaEl.innerHTML = emptyState('Todos os alunos já iniciaram! 🎉');
    return;
  }
  listaEl.innerHTML = `<table class="av-table">
    <thead><tr><th>Aluno</th><th>Turma</th><th>Status</th></tr></thead>
    <tbody>${lista.map(nome => `<tr>
      <td>${escH(nome)}</td>
      <td><span class="badge-turma">${escH(filtroTurma)}</span></td>
      <td style="color:var(--text-muted);font-size:12px">Não iniciou</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function emptyState(msg) {
  return `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">${escH(msg)}</div>`;
}
</script>
</body>
</html>
