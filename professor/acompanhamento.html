<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acompanhamento — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    /* ── Resumo por atividade ────────────────────────────────── */
    .ativ-summary { border:1.5px solid var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; }
    .ativ-summary-head { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--bg); cursor:pointer; transition:background .15s; }
    .ativ-summary-head:hover { background:#f0f0f0; }
    .ativ-nome { flex:1; font-size:14px; font-weight:700; }
    .ativ-summary-body { padding:12px 16px 14px; border-top:1px solid var(--border); }
    .ativ-metrics { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:10px; }
    @media(max-width:640px){ .ativ-metrics { grid-template-columns:repeat(3,1fr); } }
    .metric-box { background:var(--bg); border-radius:8px; padding:10px 6px; text-align:center; }
    .metric-val { font-size:18px; font-weight:800; line-height:1; }
    .metric-lbl { font-size:10px; color:var(--text-muted); margin-top:3px; }

    /* ── Métricas Competição+ ────────────────────────────────── */
    .ativ-metrics-plus { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:6px; }
    @media(max-width:640px){ .ativ-metrics-plus { grid-template-columns:repeat(2,1fr); } }
    .metric-box-plus { background:var(--bg); border-radius:8px; padding:10px 6px; text-align:center; border:1px solid var(--border); }

    /* ── Histórico de tentativas ─────────────────────────────── */
    .tent-row { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; border:1px solid var(--border); margin-bottom:6px; background:var(--card); cursor:pointer; transition:background .15s; }
    .tent-row:hover { background:#fafafa; }
    .tent-info-wrap { flex:1; }
    .tent-date { font-size:11px; color:var(--text-muted); }
    .tent-badges { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
    .tent-detail-body { padding:8px 12px 12px; border:1px solid var(--border); border-top:none; border-radius:0 0 8px 8px; background:#FAFAFA; margin-top:-6px; margin-bottom:6px; }

    /* ── Análise de erros ────────────────────────────────────── */
    .erro-item { display:flex; align-items:flex-start; gap:10px; padding:9px 12px; border-radius:7px; border:1px solid #FECACA; background:#FEF2F2; margin-bottom:6px; font-size:12px; }
    .erro-freq { font-size:15px; font-weight:800; color:var(--red); flex-shrink:0; min-width:24px; text-align:center; }
    .erro-txt { flex:1; color:var(--text); }
    .erro-resposta { font-size:11px; color:var(--text-muted); margin-top:2px; }

    /* ── q-rev ───────────────────────────────────────────────── */
    .q-rev { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:7px; border:1px solid var(--border); margin-top:5px; font-size:12px; }
    .q-rev.ok { background:#F0FDF4; border-color:#BBF7D0; }
    .q-rev.err { background:#FEF2F2; border-color:#FECACA; }

    /* ── Sumário geral ───────────────────────────────────────── */
    .sumario-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
    @media(max-width:540px){ .sumario-grid { grid-template-columns:repeat(2,1fr); } }
    .sum-box { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); padding:14px 10px; text-align:center; }
    .sum-val { font-size:24px; font-weight:800; line-height:1; }
    .sum-lbl { font-size:11px; color:var(--text-muted); margin-top:4px; }

    /* ── Abas de modo (Competição+ / Avaliação+) ─────────────── */
    .mode-tabs{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:14px;}
    .mode-tab{padding:7px 12px;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);background:transparent;transition:all .2s;}
    .mode-tab.on{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(47,158,220,.3);}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Acompanhamento</div>
        <div class="topbar-sub">Progresso individual dos alunos</div>
      </div>
      <div class="topbar-right" style="gap:10px;display:flex">
        <div class="select-wrap" style="width:160px">
          <select class="input" id="sel-turma" onchange="mudarTurma()" style="padding:8px 12px;font-size:13px">
            <option value="">Selecionar turma…</option>
          </select>
        </div>
        <div class="select-wrap" style="width:200px">
          <select class="input" id="sel-aluno" onchange="mudarAluno()" disabled style="padding:8px 12px;font-size:13px">
            <option value="">Selecionar aluno…</option>
          </select>
        </div>
      </div>
    </div>
    <div class="content" id="content">
      <div class="empty-state" style="margin-top:40px">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <p>Selecione uma turma e um aluno para começar.</p>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { ALUNOS_POR_TURMA } from "/js/constants.js";
import { getResultados, getDetalhes } from "/js/db.js";
import { requireProfessor, renderSidebarProfessor, clearSession } from "/js/auth.js";

requireProfessor();
renderSidebarProfessor("sidebar", "acompanhamento");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const selT = document.getElementById("sel-turma");
const selA = document.getElementById("sel-aluno");
Object.keys(ALUNOS_POR_TURMA).forEach(t => { selT.innerHTML += `<option value="${t}">Turma ${t}</option>`; });

const todos = await getResultados();

window.mudarTurma = function() {
  const turma = selT.value;
  selA.innerHTML = '<option value="">Selecionar aluno…</option>';
  if (turma) {
    (ALUNOS_POR_TURMA[turma] || []).sort().forEach(a => { selA.innerHTML += `<option value="${a}">${a}</option>`; });
    selA.disabled = false;
  } else {
    selA.disabled = true;
  }
  document.getElementById("content").innerHTML = '<div class="empty-state" style="margin-top:40px"><p>Selecione um aluno.</p></div>';
};

window.mudarAluno = async function() {
  const turma = selT.value;
  const aluno = selA.value;
  if (!aluno) return;
  const hist = todos.filter(r => r.aluno === aluno && r.turma === turma && r.concluido);
  renderAluno(aluno, turma, hist);
};

// ── Estatísticas ──────────────────────────────────────────────
function calcSumario(hist) {
  const melhorPorAtiv = {};
  for (const r of hist) {
    if ((r.pontuacao || 0) > (melhorPorAtiv[r.atividade] || 0))
      melhorPorAtiv[r.atividade] = r.pontuacao || 0;
  }
  const totalPts = Object.values(melhorPorAtiv).reduce((a, b) => a + b, 0);
  const numAtivs = Object.keys(melhorPorAtiv).length;
  const comboMax = Math.max(0, ...hist.map(r => r.combo_max || 0));
  const totalAc  = hist.reduce((a, r) => a + (r.acertos || 0), 0);
  const totalErr = hist.reduce((a, r) => a + (r.erros || 0), 0);
  const taxa     = (totalAc + totalErr) > 0 ? Math.round(totalAc / (totalAc + totalErr) * 100) : 0;
  return { totalPts, numAtivs, comboMax, taxa };
}

function calcAtivStats(tentativas) {
  const melhorPts    = Math.max(0, ...tentativas.map(r => r.pontuacao || 0));
  const comboMax     = Math.max(0, ...tentativas.map(r => r.combo_max || 0));
  const difMax       = Math.max(0, ...tentativas.map(r => r.acertos_dificeis || 0));
  const totalAc      = tentativas.reduce((a, r) => a + (r.acertos || 0), 0);
  const totalErr     = tentativas.reduce((a, r) => a + (r.erros || 0), 0);
  const taxa         = (totalAc + totalErr) > 0 ? Math.round(totalAc / (totalAc + totalErr) * 100) : 0;
  const modos        = [...new Set(tentativas.map(r => r.modo || 'classico'))];
  // Competição+ extras
  const isPlus       = modos.includes('competicao_plus');
  const rapMax       = Math.max(0, ...tentativas.map(r => r.acertos_rapidos || 0));
  const rapTotal     = tentativas.reduce((a, r) => a + (r.acertos_rapidos || 0), 0);
  const ajudasTotal  = tentativas.reduce((a, r) => a + (r.ajudas_usadas || 0), 0);
  const semPenCount  = tentativas.filter(r => r.sem_penalidade === true).length;
  return { melhorPts, comboMax, difMax, taxa, totalAc, totalErr, modos, isPlus, rapMax, rapTotal, ajudasTotal, semPenCount };
}

const MODO_LABEL = { classico: 'Clássico', competicao: 'Competição', competicao_plus: 'Competição+', avaliacao_plus: 'Avaliação+' };
const MODO_BADGE = { classico: 'badge-blue', competicao: 'badge-orange', competicao_plus: 'badge-gold', avaliacao_plus: '' };

const modoAtivoAcomp = {};

window.mostrarModoAcomp = function(uid, modo) {
  modoAtivoAcomp[uid] = modo;
  const compEl = document.getElementById(`modo-comp-${uid}`);
  const avEl   = document.getElementById(`modo-avplus-${uid}`);
  if (compEl) compEl.style.display = modo === 'comp' ? '' : 'none';
  if (avEl)   avEl.style.display   = modo === 'avaliacao_plus' ? '' : 'none';
  document.querySelectorAll(`.mtab-${uid}`).forEach(b =>
    b.classList.toggle('on', b.dataset.modo === modo));
};

function calcAtivStatsAvPlus(tentativas) {
  const melhorNQ  = Math.max(0, ...tentativas.map(r => r.nota_quiz ?? 0));
  const melhorPts = Math.max(0, ...tentativas.map(r => r.pontuacao  ?? 0));
  const totalAc   = tentativas.reduce((a, r) => a + (r.acertos || 0), 0);
  const totalErr  = tentativas.reduce((a, r) => a + (r.erros   || 0), 0);
  const taxa      = (totalAc + totalErr) > 0 ? Math.round(totalAc / (totalAc + totalErr) * 100) : 0;
  return { melhorNQ, melhorPts, totalAc, totalErr, taxa };
}

function renderAluno(aluno, turma, hist) {
  if (!hist.length) {
    document.getElementById("content").innerHTML = `
      <div class="card"><div class="card-title" style="margin-bottom:12px">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        ${aluno}
      </div>
      <div class="empty-state"><p>Nenhuma atividade concluída ainda.</p></div>
      </div>`;
    return;
  }

  // Group by atividade then by modo
  const porAtivModo = {};
  for (const r of hist) {
    if (!porAtivModo[r.atividade]) porAtivModo[r.atividade] = {};
    const m = r.modo || 'classico';
    if (!porAtivModo[r.atividade][m]) porAtivModo[r.atividade][m] = [];
    porAtivModo[r.atividade][m].push(r);
  }

  const sum = calcSumario(hist);

  let html = `
  <div class="card">
    <div class="card-title" style="margin-bottom:14px">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      ${aluno} — Turma ${turma}
    </div>
    <div class="sumario-grid">
      <div class="sum-box"><div class="sum-val" style="color:var(--gold)">${sum.totalPts}</div><div class="sum-lbl">Pontos (melhor)</div></div>
      <div class="sum-box"><div class="sum-val" style="color:var(--blue)">${sum.numAtivs}</div><div class="sum-lbl">Atividades</div></div>
      <div class="sum-box"><div class="sum-val" style="color:var(--orange)">${sum.comboMax > 0 ? '×'+sum.comboMax : '—'}</div><div class="sum-lbl">Combo máximo</div></div>
      <div class="sum-box"><div class="sum-val" style="color:var(--green)">${sum.taxa}%</div><div class="sum-lbl">Taxa de acerto</div></div>
    </div>

    <div class="section-label" style="margin-bottom:12px">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
      Resumo por Atividade
    </div>

    ${Object.entries(porAtivModo).map(([ativNome, modoMap]) => {
      const uid = ativNome.replace(/\W/g, '_');
      const allTentativas  = Object.values(modoMap).flat();
      const avTentativas   = modoMap['avaliacao_plus'] || [];
      const compModos      = Object.keys(modoMap).filter(m => m !== 'avaliacao_plus');
      const compTentativas = compModos.flatMap(m => modoMap[m]);
      const hasAvPlus = avTentativas.length > 0;
      const hasComp   = compTentativas.length > 0;
      const showTabs  = hasAvPlus && hasComp;
      modoAtivoAcomp[uid] = hasComp ? 'comp' : 'avaliacao_plus';

      const melhorPts = Math.max(0, ...allTentativas.map(r => r.pontuacao || 0));
      const totalAc   = allTentativas.reduce((a, r) => a + (r.acertos || 0), 0);
      const totalErr  = allTentativas.reduce((a, r) => a + (r.erros   || 0), 0);
      const taxa      = (totalAc + totalErr) > 0 ? Math.round(totalAc / (totalAc + totalErr) * 100) : 0;

      const tabsHtml = showTabs ? `
        <div class="mode-tabs">
          <button class="mode-tab on mtab-${uid}" data-modo="comp" onclick="mostrarModoAcomp('${uid}','comp')">⚔️ Competição+</button>
          <button class="mode-tab mtab-${uid}" data-modo="avaliacao_plus" onclick="mostrarModoAcomp('${uid}','avaliacao_plus')">📝 Avaliação+</button>
        </div>` : '';

      let compBlockHtml = '';
      if (hasComp) {
        const stComp = calcAtivStats(compTentativas);
        let compMetrics;
        if (stComp.isPlus) {
          compMetrics = `
            <div class="ativ-metrics-plus">
              <div class="metric-box-plus"><div class="metric-val" style="color:var(--gold)">${stComp.melhorPts}</div><div class="metric-lbl">Melhor saldo</div></div>
              <div class="metric-box-plus"><div class="metric-val" style="color:var(--blue)">${compTentativas.length}</div><div class="metric-lbl">Sessões jogadas</div></div>
              <div class="metric-box-plus"><div class="metric-val" style="color:#60A5FA">${stComp.rapMax > 0 ? stComp.rapMax : '—'}</div><div class="metric-lbl">⚡ Veloz (max)</div></div>
              <div class="metric-box-plus"><div class="metric-val" style="color:var(--gold)">${stComp.difMax > 0 ? stComp.difMax : '—'}</div><div class="metric-lbl">🏆 Bônus (max)</div></div>
            </div>
            <div class="ativ-metrics-plus" style="margin-top:0">
              <div class="metric-box-plus"><div class="metric-val" style="color:#A855F7">${stComp.ajudasTotal}</div><div class="metric-lbl">🎯 Ajudas usadas</div></div>
              <div class="metric-box-plus"><div class="metric-val" style="color:var(--green)">${stComp.semPenCount}</div><div class="metric-lbl">🔥 Sessão limpa</div></div>
              <div class="metric-box-plus"><div class="metric-val" style="color:var(--green)">${stComp.taxa}%</div><div class="metric-lbl">Taxa de acerto</div></div>
              <div class="metric-box-plus"><div class="metric-val" style="color:var(--text-muted)">${stComp.totalAc} / ${stComp.totalAc+stComp.totalErr}</div><div class="metric-lbl">Ac / Total</div></div>
            </div>`;
        } else {
          compMetrics = `<div class="ativ-metrics">
            <div class="metric-box"><div class="metric-val" style="color:var(--gold)">${stComp.melhorPts}</div><div class="metric-lbl">Melhor pontuação</div></div>
            <div class="metric-box"><div class="metric-val" style="color:var(--blue)">${compTentativas.length}</div><div class="metric-lbl">Tentativas</div></div>
            <div class="metric-box"><div class="metric-val" style="color:var(--orange)">${stComp.comboMax > 0 ? '×'+stComp.comboMax : '—'}</div><div class="metric-lbl">Combo máx</div></div>
            <div class="metric-box"><div class="metric-val" style="color:var(--red)">${stComp.difMax > 0 ? stComp.difMax : '—'}</div><div class="metric-lbl">Difíceis ✓</div></div>
            <div class="metric-box"><div class="metric-val" style="color:var(--green)">${stComp.taxa}%</div><div class="metric-lbl">Acertos</div></div>
            <div class="metric-box"><div class="metric-val" style="color:var(--text-muted)">${stComp.totalAc} / ${stComp.totalAc+stComp.totalErr}</div><div class="metric-lbl">Ac / Total</div></div>
          </div>`;
        }
        const tentIds = compTentativas.map(r => r.id);
        compBlockHtml = `<div id="modo-comp-${uid}">
          ${compMetrics}
          <div id="tentativas-${uid}">${renderTentativas(compTentativas, stComp.isPlus, ativNome, turma, false)}</div>
          <div id="analise-${uid}">
            <button class="btn btn-ghost" style="font-size:12px;margin-top:6px" onclick="analisarErros('${uid}', ${JSON.stringify(tentIds).replace(/"/g,'&quot;')})">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
              Analisar questões erradas
            </button>
          </div>
        </div>`;
      }

      let avBlockHtml = '';
      if (hasAvPlus) {
        const stAv = calcAtivStatsAvPlus(avTentativas);
        const avMetrics = `<div class="ativ-metrics-plus">
          <div class="metric-box-plus"><div class="metric-val" style="color:#7C3AED">${stAv.melhorNQ.toFixed(1)}</div><div class="metric-lbl">Melhor nota quiz</div></div>
          <div class="metric-box-plus"><div class="metric-val" style="color:var(--gold)">${stAv.melhorPts}</div><div class="metric-lbl">Melhor pts total</div></div>
          <div class="metric-box-plus"><div class="metric-val" style="color:var(--blue)">${avTentativas.length}/3</div><div class="metric-lbl">Tentativas usadas</div></div>
          <div class="metric-box-plus"><div class="metric-val" style="color:var(--green)">${stAv.taxa}%</div><div class="metric-lbl">Taxa de acerto</div></div>
        </div>`;
        avBlockHtml = `<div id="modo-avplus-${uid}"${showTabs ? ' style="display:none"' : ''}>
          ${avMetrics}
          <div id="tentativas-avplus-${uid}">${renderTentativas(avTentativas, false, ativNome, turma, true)}</div>
        </div>`;
      }

      return `<div class="ativ-summary" id="ativ-${uid}">
        <div class="ativ-summary-head" onclick="toggleAtiv('${uid}')">
          <div class="ativ-nome">${ativNome}</div>
          <span class="badge badge-gold">${melhorPts} pts</span>
          <span class="badge badge-blue">${allTentativas.length} sess.</span>
          <span class="badge badge-green">${taxa}%</span>
          <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:var(--text-muted)" id="chev-${uid}"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
        </div>
        <div class="ativ-summary-body" id="body-${uid}" style="display:none">
          ${tabsHtml}${compBlockHtml}${avBlockHtml}
        </div>
      </div>`;
    }).join('')}
  </div>`;

  document.getElementById("content").innerHTML = html;
}

function renderTentativas(tentativas, isPlus, ativNome, turma, isAvPlus = false) {
  const sorted = [...tentativas].reverse();

  let evolucaoTempoHTML = '';
  if (isPlus) {
    const withTempo = [...tentativas].filter(r => r.tempo_medio_ms > 0);
    if (withTempo.length >= 2) {
      const firstS = Math.round(withTempo[0].tempo_medio_ms / 1000);
      const lastS  = Math.round(withTempo[withTempo.length - 1].tempo_medio_ms / 1000);
      if (firstS !== lastS) {
        const better = lastS < firstS;
        const color  = better ? 'var(--green)' : 'var(--red)';
        evolucaoTempoHTML = `<div style="font-size:11px;color:${color};font-weight:600;padding:4px 0 8px">
          ⏱ ${better ? '↓' : '↑'} 1ª sessão: ${firstS}s/questão → ${withTempo.length}ª sessão: ${lastS}s/questão
        </div>`;
      }
    }
  }

  const labelSessao = isAvPlus ? 'Tentativas de Avaliação+' : isPlus ? 'Sessões' : 'Tentativas';
  return `${evolucaoTempoHTML}<div style="font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase;margin:10px 0 6px">${labelSessao}</div>
  ${sorted.map((r, i) => {
    const total = (r.acertos || 0) + (r.erros || 0);
    const taxa  = total > 0 ? Math.round((r.acertos || 0) / total * 100) : 0;
    const uid2  = `tent-${r.id}`;
    const tempoS = r.tempo_medio_ms > 0 ? Math.round(r.tempo_medio_ms / 1000) : 0;
    const labelRow = i === 0 ? '→ Mais recente' : `${isAvPlus ? 'Tentativa' : isPlus ? 'Sessão' : 'Tentativa'} ${sorted.length - i}`;

    return `<div>
      <div class="tent-row" onclick="toggleTent('${uid2}','${r.id}',${isPlus || isAvPlus},${!!isAvPlus})">
        <div class="tent-info-wrap">
          <div style="font-size:13px;font-weight:600">${labelRow}</div>
          <div class="tent-date">${r.data || ''}</div>
          <div class="tent-badges">
            ${isAvPlus ? `
              <span class="badge" style="background:#F5F3FF;color:#7C3AED;font-weight:700">📝 ${typeof r.nota_quiz === 'number' ? r.nota_quiz.toFixed(1) : '—'}</span>
              <span class="badge badge-gold">${r.pontuacao || 0} pts</span>
              ${r.tentativa_num ? `<span class="badge badge-blue">Tentativa ${r.tentativa_num}</span>` : ''}
              <span class="badge badge-green">${taxa}%</span>
              <span class="badge badge-green">${r.acertos || 0} ✓</span>
              <span class="badge badge-red">${r.erros || 0} ✗</span>
            ` : `
              <span class="badge badge-gold">${r.pontuacao || 0} pts</span>
              <span class="badge badge-green">${r.acertos || 0} ✓</span>
              <span class="badge badge-red">${r.erros || 0} ✗</span>
              ${(r.nao_respondidas || 0) > 0 ? `<span class="badge" style="background:#F3F4F6;color:#6B7280">⏸ ${r.nao_respondidas}</span>` : ''}
              <span class="badge badge-blue">${taxa}%</span>
              ${isPlus ? `
                ${(r.acertos_rapidos || 0) > 0 ? `<span class="badge" style="background:#EFF6FF;color:#1D4ED8">⚡${r.acertos_rapidos}</span>` : ''}
                ${(r.acertos_dificeis || 0) > 0 ? `<span class="badge badge-gold">🏆${r.acertos_dificeis}</span>` : ''}
                ${(r.ajudas_usadas || 0) > 0 ? `<span class="badge" style="background:#F5F3FF;color:#6D28D9">🎯${r.ajudas_usadas}</span>` : ''}
                ${r.sem_penalidade ? `<span class="badge" style="background:#F0FDF4;color:#16A34A">🔥 Limpo</span>` : ''}
                ${tempoS > 0 ? `<span class="badge" style="background:#F0F9FF;color:#0369A1">⏱ ${tempoS}s/q</span>` : ''}
              ` : `
                ${(r.combo_max || 0) > 1 ? `<span class="badge badge-orange">🔥×${r.combo_max}</span>` : ''}
                ${(r.acertos_dificeis || 0) > 0 ? `<span class="badge" style="background:#EDE9FE;color:#6D28D9">💀${r.acertos_dificeis}</span>` : ''}
                ${(() => { const mE = r.modo || (r.nota_quiz != null ? 'avaliacao_plus' : 'competicao_plus'); return mE !== 'classico' ? `<span class="badge ${MODO_BADGE[mE] || 'badge-blue'}" style="font-size:10px">${MODO_LABEL[mE]}</span>` : ''; })()}
              `}
            `}
          </div>
        </div>
        <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:var(--text-muted)" id="chev2-${uid2}"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
      </div>
      <div class="tent-detail-body" id="${uid2}" style="display:none" data-loaded="false">
        <p style="font-size:12px;color:var(--text-muted)">Carregando…</p>
      </div>
    </div>`;
  }).join('')}`;
}

window.toggleAtiv = function(uid) {
  const body  = document.getElementById(`body-${uid}`);
  const chev  = document.getElementById(`chev-${uid}`);
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (chev) chev.style.transform = open ? '' : 'rotate(180deg)';
};

function renderQuestaoPlus(q, i) {
  const resultado = q.resultado ?? null;
  const isNR = resultado === 'nao_respondida';
  const isOk = resultado === 'acerto' || (resultado === null && !!q.acertou);
  const icon = isNR ? '⏸' : isOk ? '✅' : '❌';
  const cls  = isNR ? '' : isOk ? ' ok' : ' err';
  const tempoMs = q.tempo_resposta_ms ?? null;
  const tempoS  = tempoMs != null ? `${Math.round(tempoMs / 1000)}s` : null;
  const extras = [
    (q.bonus_velocidade ?? q.velocidade) ? '⚡' : '',
    (q.usou_ajuda ?? q.usouAjuda)        ? '🎯' : '',
  ].filter(Boolean).join(' ');
  const respostaAluno = q.resposta_aluno ?? (() => {
    const ts = q.tentativas ?? [];
    const certa = ts.find(t => t.correto);
    const ultima = ts[ts.length - 1];
    return (certa ?? ultima)?.resposta ?? '—';
  })();
  return `<div class="q-rev${cls}">
    <span style="font-size:10px;font-weight:700;color:var(--text-muted);width:24px;flex-shrink:0">Q${i+1}</span>
    <div style="flex:1">
      <div style="font-size:12px">${q.enunciado || q.pergunta || '—'}</div>
      ${isNR
        ? `<div style="margin-top:2px;font-size:11px;color:var(--text-muted)">não respondida</div>`
        : `<div style="margin-top:2px;font-size:11px">
            <span style="${isOk?'color:var(--green)':'color:var(--red)'};font-weight:700">${respostaAluno}</span>
            ${!isOk ? `<span style="color:var(--text-muted);margin-left:6px">✓ ${q.resposta_correta || '—'}</span>` : ''}
            ${extras ? `<span style="margin-left:6px">${extras}</span>` : ''}
            ${tempoS ? `<span style="color:var(--text-muted);margin-left:6px">⏱ ${tempoS}</span>` : ''}
           </div>`}
    </div>
    <span>${icon}</span>
  </div>`;
}

window.toggleTent = async function(uid, resultadoId, isPlus, isAvPlus = false) {
  const body  = document.getElementById(uid);
  const chev  = document.getElementById(`chev2-${uid}`);
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (chev) chev.style.transform = open ? '' : 'rotate(180deg)';
  if (open || body.dataset.loaded === 'true') return;
  body.dataset.loaded = 'true';
  const questoes = await getDetalhes(resultadoId);
  if (!questoes || !questoes.length) {
    body.innerHTML = '<p style="font-size:12px;color:var(--text-muted)">Detalhes não disponíveis.</p>';
    return;
  }
  if (isAvPlus) {
    const result = todos.find(r => r.id === resultadoId);
    const f1Qs = questoes.filter(q => q.fase === 1);
    const f2Qs = questoes.filter(q => q.fase === 2);
    const fmtMs = ms => { if (!ms||ms<=0) return null; const s=Math.round(ms/1000); return `${Math.floor(s/60)}m${String(s%60).padStart(2,'0')}s`; };
    const f1nq   = result?.nota_quiz != null ? result.nota_quiz.toFixed(1) : '—';
    const f1pts  = result?.pontos_fase1 != null ? result.pontos_fase1 : '—';
    const f1cred = result?.credito_final != null ? (Number.isInteger(result.credito_final) ? result.credito_final : result.credito_final.toFixed(2)) : null;
    const f1t    = fmtMs(result?.tempo_fase1_ms);
    const f2rap  = result?.acertos_rapidos || 0;
    const f2combo= result?.combo_max || 0;
    const f2aj   = result?.ajudas_usadas || 0;
    const f2nr   = f2Qs.filter(q => q.resultado === 'nao_respondida').length;
    const f2ac   = f2Qs.filter(q => q.resultado === 'acerto' || (q.resultado == null && q.acertou)).length;
    const f2err  = f2Qs.filter(q => q.resultado === 'erro'   || (q.resultado == null && !q.acertou)).length;
    body.innerHTML = `
      <div style="margin-bottom:10px">
        <div style="font-size:11px;font-weight:700;color:#7C3AED;background:#F5F3FF;padding:5px 10px;border-radius:7px;margin-bottom:6px;display:inline-block">📖 Fase 1 — Quiz</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">
          <span class="badge" style="background:#F5F3FF;color:#7C3AED;font-weight:700">📝 ${f1nq}/10</span>
          <span class="badge badge-gold">${f1pts}/12 pts</span>
          ${f1t ? `<span class="badge badge-blue">⏱ ${f1t}</span>` : ''}
          ${f1cred != null ? `<span class="badge badge-green">Crédito final: ${f1cred}</span>` : ''}
        </div>
        ${f1Qs.length ? f1Qs.map((q,i) => renderQuestaoPlus(q,i)).join('') : '<p style="font-size:11px;color:var(--text-muted)">Detalhes F1 não disponíveis.</p>'}
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin:8px 0">
        <div style="flex:1;height:1px;background:var(--border)"></div>
        <span style="font-size:10px;color:var(--text-muted);font-weight:700;padding:2px 8px;border:1px solid var(--border);border-radius:10px">FASE 2</span>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:700;color:#1D4ED8;background:#EFF6FF;padding:5px 10px;border-radius:7px;margin-bottom:6px;display:inline-block">⚔️ Fase 2 — Ranking</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">
          <span class="badge badge-green">✅ ${f2ac}</span>
          <span class="badge badge-red">❌ ${f2err}</span>
          ${f2nr > 0 ? `<span class="badge" style="background:#F3F4F6;color:#6B7280">⏸ ${f2nr}</span>` : ''}
          ${f2rap > 0 ? `<span class="badge" style="background:#EFF6FF;color:#1D4ED8">⚡ ${f2rap} rápidos</span>` : ''}
          ${f2combo > 1 ? `<span class="badge badge-orange">🔥 combo ×${f2combo}</span>` : ''}
          ${f2aj > 0 ? `<span class="badge" style="background:#F5F3FF;color:#6D28D9">🎯 ${f2aj} ajudas</span>` : ''}
        </div>
        ${f2Qs.length ? f2Qs.map((q,i) => renderQuestaoPlus(q,i)).join('') : '<p style="font-size:11px;color:var(--text-muted)">Detalhes F2 não disponíveis.</p>'}
      </div>`;
  } else if (isPlus) {
    const nrCount  = questoes.filter(q => (q.resultado ?? null) === 'nao_respondida').length;
    const acertos  = questoes.filter(q => { const r = q.resultado ?? null; return r === 'acerto' || (r === null && !!q.acertou); }).length;
    const erros    = questoes.filter(q => { const r = q.resultado ?? null; return r === 'erro'   || (r === null && !q.acertou); }).length;
    const comTempo = questoes.filter(q => (q.resultado ?? null) !== 'nao_respondida' && q.tempo_resposta_ms != null);
    const avgS     = comTempo.length > 0 ? Math.round(comTempo.reduce((s, q) => s + q.tempo_resposta_ms, 0) / comTempo.length / 1000) : null;
    body.innerHTML = `
      <div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:8px">
        ✅ ${acertos} | ❌ ${erros}${nrCount > 0 ? ` | ⏸ ${nrCount}` : ''} ${avgS != null ? `· ⏱ ${avgS}s/questão` : ''}
      </div>
      ${questoes.map((q, i) => renderQuestaoPlus(q, i)).join('')}`;
  } else {
    body.innerHTML = questoes.map((q, i) => `
      <div class="q-rev ${q.acertou ? 'ok' : 'err'}">
        <span style="font-size:10px;font-weight:700;color:var(--text-muted);width:24px;flex-shrink:0">Q${i+1}</span>
        <span style="flex:1">${q.enunciado || q.pergunta || '—'}</span>
        <span style="${q.acertou ? 'color:var(--green)' : 'color:var(--red)'};font-weight:700">${q.resposta_aluno || '—'}</span>
        ${!q.acertou ? `<span style="font-size:10px;color:var(--text-muted)">✓ ${q.resposta_correta || '—'}</span>` : ''}
        <span>${q.acertou ? '✅' : '❌'}</span>
      </div>`).join('');
  }
};

window.analisarErros = async function(uid, tentIds) {
  const el = document.getElementById(`analise-${uid}`);
  if (!el) return;
  el.innerHTML = '<p style="font-size:12px;color:var(--text-muted);padding:6px 0">Carregando análise…</p>';

  const erros = {};
  for (const id of tentIds) {
    const questoes = await getDetalhes(id);
    for (const q of (questoes || [])) {
      if (!q.acertou) {
        const k = q.enunciado || q.pergunta || '?';
        if (!erros[k]) erros[k] = { count: 0, resposta_correta: q.resposta_correta, erradas: [] };
        erros[k].count++;
        if (q.resposta_aluno && !erros[k].erradas.includes(q.resposta_aluno))
          erros[k].erradas.push(q.resposta_aluno);
      }
    }
  }

  const lista = Object.entries(erros).sort((a, b) => b[1].count - a[1].count);
  if (!lista.length) {
    el.innerHTML = '<p style="font-size:12px;color:var(--green);padding:6px 0">✅ Nenhum erro registrado nas tentativas com detalhes.</p>';
    return;
  }

  el.innerHTML = `
    <div style="font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase;margin:10px 0 8px">Questões mais erradas</div>
    ${lista.slice(0, 8).map(([pergunta, info]) => `
      <div class="erro-item">
        <div class="erro-freq">${info.count}×</div>
        <div class="erro-txt">
          <div>${pergunta}</div>
          <div class="erro-resposta">✓ Correto: <strong>${info.resposta_correta}</strong>${info.erradas.length ? ' · Aluno respondeu: ' + info.erradas.join(', ') : ''}</div>
        </div>
      </div>`).join('')}`;
};

// ── URL param auto-selection ──────────────────────────────────
const _urlP = new URLSearchParams(window.location.search);
const _pAluno = _urlP.get('aluno');
const _pAtiv  = _urlP.get('atividade');
const _pModo  = _urlP.get('modo');
if (_pAluno) {
  const _turmaAluno = Object.entries(ALUNOS_POR_TURMA).find(([, als]) => als.includes(_pAluno))?.[0];
  if (_turmaAluno) {
    selT.value = _turmaAluno;
    mudarTurma();
    selA.value = _pAluno;
    await mudarAluno();
    if (_pAtiv) {
      const _uid = _pAtiv.replace(/\W/g, '_');
      const _bodyEl = document.getElementById(`body-${_uid}`);
      if (_bodyEl) {
        toggleAtiv(_uid);
        if (_pModo === 'avaliacao_plus') mostrarModoAcomp(_uid, 'avaliacao_plus');
      }
    }
  }
}
</script>
