<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acompanhamento — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    /* ── Resumo por atividade ────────────────────────────────── */
    .ativ-summary { border:1.5px solid var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; }
    .ativ-summary-head { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--bg); cursor:pointer; transition:background .15s; }
    .ativ-summary-head:hover { background:#f0f0f0; }
    .ativ-nome { flex:1; font-size:14px; font-weight:700; }
    .ativ-summary-body { padding:12px 16px 14px; border-top:1px solid var(--border); }
    .ativ-metrics { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:10px; }
    @media(max-width:640px){ .ativ-metrics { grid-template-columns:repeat(3,1fr); } }
    .metric-box { background:var(--bg); border-radius:8px; padding:10px 6px; text-align:center; }
    .metric-val { font-size:18px; font-weight:800; line-height:1; }
    .metric-lbl { font-size:10px; color:var(--text-muted); margin-top:3px; }

    /* ── Métricas Competição+ ────────────────────────────────── */
    .ativ-metrics-plus { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:6px; }
    @media(max-width:640px){ .ativ-metrics-plus { grid-template-columns:repeat(2,1fr); } }
    .metric-box-plus { background:var(--bg); border-radius:8px; padding:10px 6px; text-align:center; border:1px solid var(--border); }
    .nota-box { background:#EFF6FF; border:1.5px solid #BFDBFE; border-radius:10px; padding:10px 14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; }
    .nota-val { font-size:22px; font-weight:800; color:var(--blue); }
    .nota-desc { font-size:11px; color:var(--text-muted); line-height:1.5; }
    .nota-badge { font-size:11px; font-weight:700; border-radius:6px; padding:2px 8px; }
    .nota-badge.inside { background:#DCFCE7; color:#16A34A; }
    .nota-badge.same-day { background:#FEF9C3; color:#CA8A04; }
    .nota-badge.late { background:#FEE2E2; color:#DC2626; }

    /* ── Histórico de tentativas ─────────────────────────────── */
    .tent-row { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; border:1px solid var(--border); margin-bottom:6px; background:var(--card); cursor:pointer; transition:background .15s; }
    .tent-row:hover { background:#fafafa; }
    .tent-info-wrap { flex:1; }
    .tent-date { font-size:11px; color:var(--text-muted); }
    .tent-badges { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
    .tent-detail-body { padding:8px 12px 12px; border:1px solid var(--border); border-top:none; border-radius:0 0 8px 8px; background:#FAFAFA; margin-top:-6px; margin-bottom:6px; }

    /* ── Análise de erros ────────────────────────────────────── */
    .erro-item { display:flex; align-items:flex-start; gap:10px; padding:9px 12px; border-radius:7px; border:1px solid #FECACA; background:#FEF2F2; margin-bottom:6px; font-size:12px; }
    .erro-freq { font-size:15px; font-weight:800; color:var(--red); flex-shrink:0; min-width:24px; text-align:center; }
    .erro-txt { flex:1; color:var(--text); }
    .erro-resposta { font-size:11px; color:var(--text-muted); margin-top:2px; }

    /* ── q-rev ───────────────────────────────────────────────── */
    .q-rev { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:7px; border:1px solid var(--border); margin-top:5px; font-size:12px; }
    .q-rev.ok { background:#F0FDF4; border-color:#BBF7D0; }
    .q-rev.err { background:#FEF2F2; border-color:#FECACA; }

    /* ── Sumário geral ───────────────────────────────────────── */
    .sumario-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
    @media(max-width:540px){ .sumario-grid { grid-template-columns:repeat(2,1fr); } }
    .sum-box { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); padding:14px 10px; text-align:center; }
    .sum-val { font-size:24px; font-weight:800; line-height:1; }
    .sum-lbl { font-size:11px; color:var(--text-muted); margin-top:4px; }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Acompanhamento</div>
        <div class="topbar-sub">Progresso individual dos alunos</div>
      </div>
      <div class="topbar-right" style="gap:10px;display:flex">
        <div class="select-wrap" style="width:160px">
          <select class="input" id="sel-turma" onchange="mudarTurma()" style="padding:8px 12px;font-size:13px">
            <option value="">Selecionar turma…</option>
          </select>
        </div>
        <div class="select-wrap" style="width:200px">
          <select class="input" id="sel-aluno" onchange="mudarAluno()" disabled style="padding:8px 12px;font-size:13px">
            <option value="">Selecionar aluno…</option>
          </select>
        </div>
      </div>
    </div>
    <div class="content" id="content">
      <div class="empty-state" style="margin-top:40px">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <p>Selecione uma turma e um aluno para começar.</p>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { ALUNOS_POR_TURMA } from "/js/constants.js";
import { getResultados, getDetalhes, getLiberacoesHistoricoTodas } from "/js/db.js";
import { requireProfessor, renderSidebarProfessor, clearSession } from "/js/auth.js";

requireProfessor();
renderSidebarProfessor("sidebar", "acompanhamento");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const selT = document.getElementById("sel-turma");
const selA = document.getElementById("sel-aluno");
Object.keys(ALUNOS_POR_TURMA).forEach(t => { selT.innerHTML += `<option value="${t}">Turma ${t}</option>`; });

// Carrega resultados e histórico de liberações em paralelo
let [todos, liberacoesHist] = await Promise.all([getResultados(), getLiberacoesHistoricoTodas()]);

window.mudarTurma = function() {
  const turma = selT.value;
  selA.innerHTML = '<option value="">Selecionar aluno…</option>';
  if (turma) {
    (ALUNOS_POR_TURMA[turma] || []).sort().forEach(a => { selA.innerHTML += `<option value="${a}">${a}</option>`; });
    selA.disabled = false;
  } else {
    selA.disabled = true;
  }
  document.getElementById("content").innerHTML = '<div class="empty-state" style="margin-top:40px"><p>Selecione um aluno.</p></div>';
};

window.mudarAluno = async function() {
  const turma = selT.value;
  const aluno = selA.value;
  if (!aluno) return;
  const hist = todos.filter(r => r.aluno === aluno && r.turma === turma && r.concluido);
  renderAluno(aluno, turma, hist);
};

// ── Nota Competição+ ──────────────────────────────────────────
// Encontra a liberação (com janela_aula) ativa quando a sessão foi jogada
function findLibJanela(atividade, turma, tsInicio) {
  const tsMs = (tsInicio || 0) * 1000;
  // Filtra liberações de Competição+ com janela_aula, criadas ANTES do início da sessão
  const candidates = liberacoesHist.filter(h =>
    h.atividade === atividade && h.turma === turma &&
    h.modo === 'competicao_plus' && h.janela_aula &&
    (h.criadoEm || 0) <= tsMs
  ).sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));
  return candidates[0] || null;
}

function calcNota(atividade, turma, tsInicio) {
  const lib = findLibJanela(atividade, turma, tsInicio);
  if (!lib) return null;
  const janela = lib.janela_aula;
  const percentual = lib.percentual ?? 100;
  const ts = (tsInicio || 0) * 1000;
  const ini = new Date(janela.inicio).getTime();
  const fim = new Date(janela.fim).getTime();
  let mod, label, cls;
  if (ts >= ini && ts <= fim) {
    mod = 100; label = 'Dentro da janela de aula'; cls = 'inside';
  } else {
    const dS = new Date(ts).toDateString();
    const dI = new Date(ini).toDateString();
    if (dS === dI) { mod = 50; label = 'Mesmo dia, fora da janela'; cls = 'same-day'; }
    else           { mod = 25; label = 'Outro dia'; cls = 'late'; }
  }
  const nota = Math.round(percentual * mod / 100);
  return { percentual, mod, nota, label, cls };
}

// ── Estatísticas ──────────────────────────────────────────────
function calcSumario(hist) {
  const melhorPorAtiv = {};
  for (const r of hist) {
    if ((r.pontuacao || 0) > (melhorPorAtiv[r.atividade] || 0))
      melhorPorAtiv[r.atividade] = r.pontuacao || 0;
  }
  const totalPts = Object.values(melhorPorAtiv).reduce((a, b) => a + b, 0);
  const numAtivs = Object.keys(melhorPorAtiv).length;
  const comboMax = Math.max(0, ...hist.map(r => r.combo_max || 0));
  const totalAc  = hist.reduce((a, r) => a + (r.acertos || 0), 0);
  const totalErr = hist.reduce((a, r) => a + (r.erros || 0), 0);
  const taxa     = (totalAc + totalErr) > 0 ? Math.round(totalAc / (totalAc + totalErr) * 100) : 0;
  return { totalPts, numAtivs, comboMax, taxa };
}

function calcAtivStats(tentativas) {
  const melhorPts    = Math.max(0, ...tentativas.map(r => r.pontuacao || 0));
  const comboMax     = Math.max(0, ...tentativas.map(r => r.combo_max || 0));
  const difMax       = Math.max(0, ...tentativas.map(r => r.acertos_dificeis || 0));
  const totalAc      = tentativas.reduce((a, r) => a + (r.acertos || 0), 0);
  const totalErr     = tentativas.reduce((a, r) => a + (r.erros || 0), 0);
  const taxa         = (totalAc + totalErr) > 0 ? Math.round(totalAc / (totalAc + totalErr) * 100) : 0;
  const modos        = [...new Set(tentativas.map(r => r.modo || 'classico'))];
  // Competição+ extras
  const isPlus       = modos.includes('competicao_plus');
  const rapMax       = Math.max(0, ...tentativas.map(r => r.acertos_rapidos || 0));
  const rapTotal     = tentativas.reduce((a, r) => a + (r.acertos_rapidos || 0), 0);
  const ajudasTotal  = tentativas.reduce((a, r) => a + (r.ajudas_usadas || 0), 0);
  const semPenCount  = tentativas.filter(r => r.sem_penalidade === true).length;
  return { melhorPts, comboMax, difMax, taxa, totalAc, totalErr, modos, isPlus, rapMax, rapTotal, ajudasTotal, semPenCount };
}

const MODO_LABEL = { classico: 'Clássico', competicao: 'Competição', competicao_plus: 'Competição+' };
const MODO_BADGE = { classico: 'badge-blue', competicao: 'badge-orange', competicao_plus: 'badge-gold' };

function renderAluno(aluno, turma, hist) {
  if (!hist.length) {
    document.getElementById("content").innerHTML = `
      <div class="card"><div class="card-title" style="margin-bottom:12px">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        ${aluno}
      </div>
      <div class="empty-state"><p>Nenhuma atividade concluída ainda.</p></div>
      </div>`;
    return;
  }

  const porAtiv = {};
  for (const r of hist) {
    if (!porAtiv[r.atividade]) porAtiv[r.atividade] = [];
    porAtiv[r.atividade].push(r);
  }

  const sum = calcSumario(hist);

  let html = `
  <div class="card">
    <div class="card-title" style="margin-bottom:14px">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      ${aluno} — Turma ${turma}
    </div>
    <div class="sumario-grid">
      <div class="sum-box"><div class="sum-val" style="color:var(--gold)">${sum.totalPts}</div><div class="sum-lbl">Pontos (melhor)</div></div>
      <div class="sum-box"><div class="sum-val" style="color:var(--blue)">${sum.numAtivs}</div><div class="sum-lbl">Atividades</div></div>
      <div class="sum-box"><div class="sum-val" style="color:var(--orange)">${sum.comboMax > 0 ? '×'+sum.comboMax : '—'}</div><div class="sum-lbl">Combo máximo</div></div>
      <div class="sum-box"><div class="sum-val" style="color:var(--green)">${sum.taxa}%</div><div class="sum-lbl">Taxa de acerto</div></div>
    </div>

    <div class="section-label" style="margin-bottom:12px">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
      Resumo por Atividade
    </div>

    ${Object.entries(porAtiv).map(([ativNome, tentativas]) => {
      const st = calcAtivStats(tentativas);
      const tentIds = tentativas.map(r => r.id);
      const uid = ativNome.replace(/\W/g, '_');

      // Nota para Competição+: usa a sessão com melhor pontuação
      let notaHTML = '';
      if (st.isPlus) {
        const plusSessions = tentativas.filter(r => r.modo === 'competicao_plus' && r.ts_inicio);
        const bestPlus = plusSessions.reduce((b, r) => (!b || (r.pontuacao||0) > (b.pontuacao||0)) ? r : b, null);
        const ni = bestPlus ? calcNota(ativNome, turma, bestPlus.ts_inicio) : null;
        if (ni) {
          notaHTML = `<div class="nota-box">
            <div class="nota-val">${ni.nota}%</div>
            <div class="nota-desc">
              <div style="font-weight:700;margin-bottom:2px">Nota final estimada</div>
              <span class="nota-badge ${ni.cls}">${ni.label}</span>
              <div style="margin-top:4px;font-size:10px">${ni.percentual}% da nota × ${ni.mod}% do momento = ${ni.nota}%</div>
            </div>
          </div>`;
        }
      }

      // Métricas: grid diferente para Competição+
      let metricsHTML;
      if (st.isPlus) {
        metricsHTML = `
          ${notaHTML}
          <div class="ativ-metrics-plus">
            <div class="metric-box-plus"><div class="metric-val" style="color:var(--gold)">${st.melhorPts}</div><div class="metric-lbl">Melhor saldo</div></div>
            <div class="metric-box-plus"><div class="metric-val" style="color:var(--blue)">${tentativas.length}</div><div class="metric-lbl">Sessões jogadas</div></div>
            <div class="metric-box-plus"><div class="metric-val" style="color:#60A5FA">${st.rapMax > 0 ? st.rapMax : '—'}</div><div class="metric-lbl">⚡ Veloz (max)</div></div>
            <div class="metric-box-plus"><div class="metric-val" style="color:var(--gold)">${st.difMax > 0 ? st.difMax : '—'}</div><div class="metric-lbl">🏆 Bônus (max)</div></div>
          </div>
          <div class="ativ-metrics-plus" style="margin-top:0">
            <div class="metric-box-plus"><div class="metric-val" style="color:#A855F7">${st.ajudasTotal}</div><div class="metric-lbl">🎯 Ajudas usadas</div></div>
            <div class="metric-box-plus"><div class="metric-val" style="color:var(--green)">${st.semPenCount}</div><div class="metric-lbl">🔥 Sessão limpa</div></div>
            <div class="metric-box-plus"><div class="metric-val" style="color:var(--green)">${st.taxa}%</div><div class="metric-lbl">Taxa de acerto</div></div>
            <div class="metric-box-plus"><div class="metric-val" style="color:var(--text-muted)">${st.totalAc} / ${st.totalAc+st.totalErr}</div><div class="metric-lbl">Ac / Total</div></div>
          </div>`;
      } else {
        metricsHTML = `<div class="ativ-metrics">
          <div class="metric-box"><div class="metric-val" style="color:var(--gold)">${st.melhorPts}</div><div class="metric-lbl">Melhor pontuação</div></div>
          <div class="metric-box"><div class="metric-val" style="color:var(--blue)">${tentativas.length}</div><div class="metric-lbl">Tentativas</div></div>
          <div class="metric-box"><div class="metric-val" style="color:var(--orange)">${st.comboMax > 0 ? '×'+st.comboMax : '—'}</div><div class="metric-lbl">Combo máx</div></div>
          <div class="metric-box"><div class="metric-val" style="color:var(--red)">${st.difMax > 0 ? st.difMax : '—'}</div><div class="metric-lbl">Difíceis ✓</div></div>
          <div class="metric-box"><div class="metric-val" style="color:var(--green)">${st.taxa}%</div><div class="metric-lbl">Acertos</div></div>
          <div class="metric-box"><div class="metric-val" style="color:var(--text-muted)">${st.totalAc} / ${st.totalAc+st.totalErr}</div><div class="metric-lbl">Ac / Total</div></div>
        </div>`;
      }

      return `<div class="ativ-summary" id="ativ-${uid}">
        <div class="ativ-summary-head" onclick="toggleAtiv('${uid}')">
          <div class="ativ-nome">${ativNome}</div>
          <span class="badge badge-gold">${st.melhorPts} pts</span>
          <span class="badge badge-blue">${tentativas.length} ${st.isPlus ? 'sess.' : 'tent.'}</span>
          <span class="badge badge-green">${st.taxa}%</span>
          ${st.isPlus ? `<span class="badge badge-gold" style="background:#FEF9C3;color:#92400E">🚀 C+</span>` : ''}
          <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:var(--text-muted)" id="chev-${uid}"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
        </div>
        <div class="ativ-summary-body" id="body-${uid}" style="display:none">
          ${metricsHTML}
          <div id="tentativas-${uid}">${renderTentativas(tentativas, st.isPlus, ativNome, turma)}</div>
          <div id="analise-${uid}">
            <button class="btn btn-ghost" style="font-size:12px;margin-top:6px" onclick="analisarErros('${uid}', ${JSON.stringify(tentIds).replace(/"/g,'&quot;')})">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
              Analisar questões erradas
            </button>
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;

  document.getElementById("content").innerHTML = html;
}

function renderTentativas(tentativas, isPlus, ativNome, turma) {
  const sorted = [...tentativas].reverse();
  return `<div style="font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase;margin:10px 0 6px">${isPlus ? 'Sessões' : 'Tentativas'}</div>
  ${sorted.map((r, i) => {
    const total = (r.acertos || 0) + (r.erros || 0);
    const taxa  = total > 0 ? Math.round((r.acertos || 0) / total * 100) : 0;
    const uid2  = `tent-${r.id}`;

    // Nota para esta sessão específica (Competição+)
    let notaBadge = '';
    if (isPlus && r.ts_inicio) {
      const ni = calcNota(ativNome, turma, r.ts_inicio);
      if (ni) notaBadge = `<span class="badge nota-badge ${ni.cls}" style="font-size:10px;border-radius:8px;padding:2px 8px">📝 ${ni.nota}%</span>`;
    }

    return `<div>
      <div class="tent-row" onclick="toggleTent('${uid2}','${r.id}')">
        <div class="tent-info-wrap">
          <div style="font-size:13px;font-weight:600">${i === 0 ? '→ Mais recente' : `${isPlus ? 'Sessão' : 'Tentativa'} ${sorted.length - i}`}</div>
          <div class="tent-date">${r.data || ''}</div>
          <div class="tent-badges">
            <span class="badge badge-gold">${r.pontuacao || 0} pts</span>
            <span class="badge badge-green">${r.acertos || 0} ✓</span>
            <span class="badge badge-red">${r.erros || 0} ✗</span>
            <span class="badge badge-blue">${taxa}%</span>
            ${isPlus ? `
              ${(r.acertos_rapidos || 0) > 0 ? `<span class="badge" style="background:#EFF6FF;color:#1D4ED8">⚡${r.acertos_rapidos}</span>` : ''}
              ${(r.acertos_dificeis || 0) > 0 ? `<span class="badge badge-gold">🏆${r.acertos_dificeis}</span>` : ''}
              ${(r.ajudas_usadas || 0) > 0 ? `<span class="badge" style="background:#F5F3FF;color:#6D28D9">🎯${r.ajudas_usadas}</span>` : ''}
              ${r.sem_penalidade ? `<span class="badge" style="background:#F0FDF4;color:#16A34A">🔥 Limpo</span>` : ''}
              ${notaBadge}
            ` : `
              ${(r.combo_max || 0) > 1 ? `<span class="badge badge-orange">🔥×${r.combo_max}</span>` : ''}
              ${(r.acertos_dificeis || 0) > 0 ? `<span class="badge" style="background:#EDE9FE;color:#6D28D9">💀${r.acertos_dificeis}</span>` : ''}
              ${r.modo && r.modo !== 'classico' ? `<span class="badge ${MODO_BADGE[r.modo] || 'badge-blue'}" style="font-size:10px">${MODO_LABEL[r.modo]}</span>` : ''}
            `}
          </div>
        </div>
        <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:var(--text-muted)" id="chev2-${uid2}"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
      </div>
      <div class="tent-detail-body" id="${uid2}" style="display:none" data-loaded="false">
        <p style="font-size:12px;color:var(--text-muted)">Carregando…</p>
      </div>
    </div>`;
  }).join('')}`;
}

window.toggleAtiv = function(uid) {
  const body  = document.getElementById(`body-${uid}`);
  const chev  = document.getElementById(`chev-${uid}`);
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (chev) chev.style.transform = open ? '' : 'rotate(180deg)';
};

window.toggleTent = async function(uid, resultadoId) {
  const body  = document.getElementById(uid);
  const chev  = document.getElementById(`chev2-${uid}`);
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (chev) chev.style.transform = open ? '' : 'rotate(180deg)';
  if (open || body.dataset.loaded === 'true') return;
  body.dataset.loaded = 'true';
  const questoes = await getDetalhes(resultadoId);
  if (!questoes || !questoes.length) {
    body.innerHTML = '<p style="font-size:12px;color:var(--text-muted)">Detalhes não disponíveis.</p>';
    return;
  }
  body.innerHTML = questoes.map((q, i) => `
    <div class="q-rev ${q.acertou ? 'ok' : 'err'}">
      <span style="font-size:10px;font-weight:700;color:var(--text-muted);width:24px;flex-shrink:0">Q${i+1}</span>
      <span style="flex:1">${q.pergunta}</span>
      <span style="${q.acertou ? 'color:var(--green)' : 'color:var(--red)'};font-weight:700">${q.resposta_aluno}</span>
      ${!q.acertou ? `<span style="font-size:10px;color:var(--text-muted)">✓ ${q.resposta_correta}</span>` : ''}
      <span>${q.acertou ? '✅' : '❌'}</span>
    </div>`).join('');
};

window.analisarErros = async function(uid, tentIds) {
  const el = document.getElementById(`analise-${uid}`);
  if (!el) return;
  el.innerHTML = '<p style="font-size:12px;color:var(--text-muted);padding:6px 0">Carregando análise…</p>';

  const erros = {};
  for (const id of tentIds) {
    const questoes = await getDetalhes(id);
    for (const q of (questoes || [])) {
      if (!q.acertou) {
        if (!erros[q.pergunta]) erros[q.pergunta] = { count: 0, resposta_correta: q.resposta_correta, erradas: [] };
        erros[q.pergunta].count++;
        if (q.resposta_aluno && !erros[q.pergunta].erradas.includes(q.resposta_aluno))
          erros[q.pergunta].erradas.push(q.resposta_aluno);
      }
    }
  }

  const lista = Object.entries(erros).sort((a, b) => b[1].count - a[1].count);
  if (!lista.length) {
    el.innerHTML = '<p style="font-size:12px;color:var(--green);padding:6px 0">✅ Nenhum erro registrado nas tentativas com detalhes.</p>';
    return;
  }

  el.innerHTML = `
    <div style="font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase;margin:10px 0 8px">Questões mais erradas</div>
    ${lista.slice(0, 8).map(([pergunta, info]) => `
      <div class="erro-item">
        <div class="erro-freq">${info.count}×</div>
        <div class="erro-txt">
          <div>${pergunta}</div>
          <div class="erro-resposta">✓ Correto: <strong>${info.resposta_correta}</strong>${info.erradas.length ? ' · Aluno respondeu: ' + info.erradas.join(', ') : ''}</div>
        </div>
      </div>`).join('')}`;
};
</script>
</body>
</html>
