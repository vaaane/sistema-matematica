<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Histórico Geral — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .hist-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
    .hist-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:background .15s;}
    .hist-header:hover{background:#FAFAFA;}
    .hist-body{padding:0 16px 14px;border-top:1px solid var(--border);}
    .hist-data{font-size:11px;color:var(--text-muted);white-space:nowrap;}
    .q-rev{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;border:1px solid var(--border);margin-top:6px;font-size:12px;}
    .q-rev.ok{background:#F0FDF4;border-color:#BBF7D0;}
    .q-rev.err{background:#FEF2F2;border-color:#FECACA;}
    .pill{padding:5px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:all .15s;}
    .pill.on{border-color:var(--blue);background:var(--blue);color:#fff;}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Histórico Geral</div>
        <div class="topbar-sub" id="topbar-sub">Todos os resultados</div>
      </div>
      <div class="topbar-right" style="display:flex;gap:10px">
        <select id="sel-turma" style="display:none">
          <option value="Todas">Todas as turmas</option>
        </select>
        <div class="select-wrap" style="width:200px">
          <select class="input" id="sel-ativ" onchange="filtrar()" style="padding:8px 12px;font-size:13px">
            <option value="Todas">Todas as atividades</option>
          </select>
        </div>
      </div>
    </div>
    <div style="padding:12px 24px 0">
      <div id="turma-pills" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    </div>
    <div class="content" id="content">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div>
    </div>
  </div>
</div>
<script type="module">
import { ALUNOS_POR_TURMA } from "/js/constants.js";
import { getResultados, getDetalhes, getConquistas, salvarConquistas } from "/js/db.js";
import { requireProfessor, renderSidebarProfessor, clearSession } from "/js/auth.js";
import { calcularConquistas, CONQUISTAS } from "/js/conquistas.js";
import { db } from "/js/firebase-config.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

requireProfessor();
renderSidebarProfessor("sidebar", "historico");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

function fmtData(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}

const [todosRaw, conquistas, torneiosSnap] = await Promise.all([
  getResultados(),
  getConquistas(),
  get(ref(db, 'torneios')).catch(() => null),
]);
const todos = todosRaw.filter(r => !r.modo_teste && r.aluno !== 'PROFESSOR_TESTE');

// ── Carregar sessões dos torneios encerrados ──────────────────
const torneiosMeta   = []; // { id, nome, encerrado_em }
const torneioEntries = []; // itens planos para exibição

if (torneiosSnap?.exists()) {
  const encerrados = [];
  torneiosSnap.forEach(c => {
    const v = c.val();
    if (v.status === 'encerrado' && !v.modo_teste) encerrados.push({ id: c.key, ...v });
  });
  encerrados.sort((a, b) => (b.encerrado_em || 0) - (a.encerrado_em || 0));

  await Promise.all(encerrados.map(async t => {
    const sessSnap = await get(ref(db, `torneios/${t.id}/sessoes`)).catch(() => null);
    if (!sessSnap?.exists()) return;
    const sessoes = [];
    sessSnap.forEach(c => {
      const s = c.val();
      if (s.turma !== 'TESTE') sessoes.push({ _uid: c.key, ...s });
    });
    if (!sessoes.length) return;
    torneiosMeta.push({ id: t.id, nome: t.nome || 'Torneio', encerrado_em: t.encerrado_em });
    // Calcular posição por turma
    const porTurma = {};
    for (const s of sessoes) {
      if (!porTurma[s.turma]) porTurma[s.turma] = [];
      porTurma[s.turma].push(s);
    }
    for (const [turma, lista] of Object.entries(porTurma)) {
      lista.sort((a, b) => (b.pontuacao || 0) - (a.pontuacao || 0));
      lista.forEach((s, pos) => {
        torneioEntries.push({
          _tipo: 'torneio', torneioId: t.id, torneioNome: t.nome || 'Torneio',
          turma, aluno: s.aluno || '',
          pontuacao: s.pontuacao || 0, acertos: s.acertos || 0, erros: s.erros || 0,
          tabuleiros: s.tabuleiros_completos || 0, streak: s.maior_streak || 0,
          tipos_acertos: s.tipos_acertos || {}, tipos_erros: s.tipos_erros || {},
          posicao: pos + 1, total_turma: lista.length,
          encerrado_em: t.encerrado_em || 0,
          data: fmtData(t.encerrado_em),
        });
      });
    }
  }));
}

const selT = document.getElementById("sel-turma");
const selA = document.getElementById("sel-ativ");
const turmas = Object.keys(ALUNOS_POR_TURMA);
turmas.forEach(t => { selT.innerHTML += `<option value="${t}">Turma ${t}</option>`; });
const ativNomes = [...new Set(todos.map(r=>r.atividade))].sort();
ativNomes.forEach(a => { selA.innerHTML += `<option value="${a}">${a}</option>`; });
// Adicionar torneios ao dropdown
if (torneiosMeta.length) {
  selA.innerHTML += `<option disabled>──────────────</option>`;
  torneiosMeta.forEach(t => {
    selA.innerHTML += `<option value="__tn__${t.id}">🏆 ${t.nome} · ${fmtData(t.encerrado_em)}</option>`;
  });
}

window.setFiltroTurma = function(turma) {
  selT.value = turma;
  document.querySelectorAll('#turma-pills .pill').forEach(p =>
    p.classList.toggle('on', p.dataset.t === turma));
  filtrar();
};

const pillsEl = document.getElementById('turma-pills');
pillsEl.innerHTML =
  `<button class="pill on" data-t="Todas" onclick="setFiltroTurma('Todas')">Todas</button>` +
  turmas.map(t => `<button class="pill" data-t="${t}" onclick="setFiltroTurma('${t}')">Turma ${t}</button>`).join('');

window.toggleDetalhes = async function(id, bodyEl) {
  const visivel = bodyEl.style.display !== 'none';
  if (visivel) { bodyEl.style.display = 'none'; return; }
  bodyEl.style.display = 'block';
  if (bodyEl.dataset.loaded === 'true') return;
  bodyEl.dataset.loaded = 'true';
  const questoes = await getDetalhes(id);
  if (!questoes || !questoes.length) {
    bodyEl.innerHTML = '<p style="font-size:12px;color:var(--text-muted);padding-top:8px">Detalhes não disponíveis.</p>';
    return;
  }
  bodyEl.innerHTML = questoes.map((q, i) => {
    const enun = q.enunciado || q.pergunta || '—';
    const rAluno = q.resposta_aluno || '—';
    const rCorreta = (q.resposta_correta && q.resposta_correta !== 'undefined') ? q.resposta_correta : '—';
    return `
    <div class="q-rev ${q.acertou ? 'ok' : 'err'}">
      <span style="font-size:10px;font-weight:700;color:var(--text-muted);width:24px">Q${i+1}</span>
      <span style="flex:1">${enun}</span>
      <span style="${q.acertou ? 'color:var(--green)' : 'color:var(--red)'};font-weight:700">${rAluno}</span>
      ${!q.acertou ? `<span style="font-size:10px;color:var(--text-muted)">✓ ${rCorreta}</span>` : ''}
      <span>${q.acertou ? '✅' : '❌'}</span>
    </div>`;
  }).join('');
};

const TIPO_LABELS = { adicao:'Adição', subtracao:'Subtração', duplo_neg:'−(−)', multiplicacao:'Mult.', divisao:'Div.' };

function renderTorneioItem(e) {
  const medals = ['🥇','🥈','🥉'];
  const pos    = e.posicao;
  const posLabel = pos <= 3 ? medals[pos-1]+` ${pos}º` : `#${pos}º`;
  const tot  = (e.acertos||0) + (e.erros||0);
  const taxa = tot > 0 ? Math.round(e.acertos/tot*100) + '%' : '—';
  const tipos = Object.keys(TIPO_LABELS);
  const pior  = tipos.reduce((acc, tp) => {
    const t = (e.tipos_acertos[tp]||0) + (e.tipos_erros[tp]||0);
    const pct = t > 0 ? (e.tipos_erros[tp]||0)/t : -1;
    return pct > acc.pct ? { tp, pct } : acc;
  }, { tp: null, pct: -1 });
  return `<div class="hist-item" style="border-color:rgba(245,158,11,.35)">
    <div class="hist-header" style="cursor:default">
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:14px;font-weight:700">🏆 ${e.torneioNome}</span>
          <span class="badge badge-blue">T${e.turma}</span>
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${e.aluno}</div>
        <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
          <span class="badge badge-gold">${e.pontuacao} pts</span>
          <span class="badge" style="background:#FFFBEB;color:#92400E;border-color:#FDE68A">${posLabel} de ${e.total_turma}</span>
          <span class="badge badge-green">${e.acertos} ✓</span>
          <span class="badge badge-red">${e.erros} ✗</span>
          <span class="badge badge-blue">${taxa}</span>
          ${e.tabuleiros > 0 ? `<span class="badge badge-blue">${e.tabuleiros} tab.</span>` : ''}
          ${e.streak > 0 ? `<span class="badge badge-orange">🔥×${e.streak}</span>` : ''}
          ${pior.tp ? `<span class="badge" style="background:#FEF2F2;color:#DC2626;border-color:#FECACA">⚠️ ${TIPO_LABELS[pior.tp]}</span>` : ''}
        </div>
      </div>
      <div class="hist-data">${e.data}</div>
    </div>
  </div>`;
}

window.filtrar = function() {
  const turma = selT.value;
  const ativ  = selA.value;
  const isTnFilter = ativ.startsWith('__tn__');
  const tnFiltId   = isTnFilter ? ativ.slice(5) : null;

  const conquFilt = turma === "Todas" ? conquistas : conquistas.filter(c => c.turma === turma);

  // ── Atividades regulares ──────────────────────────────────
  let dadosAtiv = isTnFilter ? [] : [...todos].reverse().filter(r => r.concluido);
  if (turma !== "Todas") dadosAtiv = dadosAtiv.filter(r => r.turma === turma);
  if (!isTnFilter && ativ !== "Todas") dadosAtiv = dadosAtiv.filter(r => r.atividade === ativ);

  const listaAtivHtml = dadosAtiv.slice(0, 50).map(r => {
    const total = (r.acertos||0) + (r.erros||0);
    const aproveit = total > 0 ? Math.round((r.acertos||0)/total*100) : 0;
    return `<div class="hist-item">
      <div class="hist-header" onclick="toggleDetalhes('${r.id}', this.nextElementSibling)">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-size:14px;font-weight:700">${r.atividade}</span>
            ${r.turma === 'TESTE' ? '<span class="badge" style="background:#FEF9C3;color:#854D0E;border:1px solid #FDE68A">👩‍🏫 TESTE</span>' : `<span class="badge badge-blue">T${r.turma}</span>`}
          </div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${r.aluno}</div>
          <div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap">
            <span class="badge badge-gold">${r.pontuacao||0} pts</span>
            <span class="badge badge-green">${r.acertos||0} ✓</span>
            <span class="badge badge-red">${r.erros||0} ✗</span>
            <span class="badge badge-blue">${aproveit}%</span>
          </div>
        </div>
        <div class="hist-data">${r.data||''}</div>
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:var(--text-muted)"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
      </div>
      <div class="hist-body" style="display:none" data-loaded="false">
        <p style="font-size:12px;color:var(--text-muted);padding-top:8px">Carregando…</p>
      </div>
    </div>`;
  }).join('');

  // ── Torneios ──────────────────────────────────────────────
  let dadosTn = isTnFilter
    ? torneioEntries.filter(e => e.torneioId === tnFiltId)
    : (ativ === "Todas" ? [...torneioEntries] : []);
  if (turma !== "Todas") dadosTn = dadosTn.filter(e => e.turma === turma);
  dadosTn.sort((a, b) => b.pontuacao - a.pontuacao || a.posicao - b.posicao);

  const tornTitulo = isTnFilter
    ? (torneiosMeta.find(t => t.id === tnFiltId)?.nome || 'Torneio')
    : '🏆 Torneios realizados';

  const listaTnHtml = dadosTn.length
    ? dadosTn.map(renderTorneioItem).join('')
    : '<div class="empty-state"><p>Nenhum torneio.</p></div>';

  // ── Layout ────────────────────────────────────────────────
  const colEsq = isTnFilter
    ? `<div class="card"><div class="card-title" style="margin-bottom:16px">${tornTitulo} (${dadosTn.length})</div>${listaTnHtml}</div>`
    : `<div class="card" style="margin-bottom:14px"><div class="card-title" style="margin-bottom:16px">Atividades (${dadosAtiv.length})</div>${listaAtivHtml || '<div class="empty-state"><p>Nenhum resultado.</p></div>'}</div>
       ${dadosTn.length ? `<div class="card"><div class="card-title" style="margin-bottom:16px">${tornTitulo} (${dadosTn.length})</div>${listaTnHtml}</div>` : ''}`;

  document.getElementById("content").innerHTML = `
    <div class="grid-2">
      <div>${colEsq}</div>
      <div>
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <div class="card-title">🏆 Conquistas Recentes</div>
            <button id="btn-retro" class="btn btn-sm btn-ghost" onclick="recalcularConquistas(this)">↺ Recalcular</button>
          </div>
          ${conquFilt.slice(0,20).map(c=>`
          <div class="list-row">
            ${c.icon ? `<div style="font-size:18px;flex-shrink:0">${c.icon}</div>` : ''}
            <div style="flex:1">
              <div style="font-size:13px;font-weight:600">${c.aluno}</div>
              <div style="font-size:11px;color:var(--text-muted)">${c.nome || c.descricao} · ${c.atividade}</div>
            </div>
            <span class="badge badge-gold">${c.data||''}</span>
          </div>`).join('')}
          ${!conquFilt.length ? '<div class="empty-state"><p>Nenhuma conquista.</p></div>' : ''}
        </div>
      </div>
    </div>`;
};


function buildRankingStatico(resultados) {
  const melhor = {};
  for (const r of resultados) {
    if (!r.concluido || !r.aluno) continue;
    if (!melhor[r.aluno]) melhor[r.aluno] = { aluno: r.aluno, turma: r.turma || '?', porAtiv: {} };
    const pts = r.pontuacao || 0;
    if ((melhor[r.aluno].porAtiv[r.atividade] || 0) < pts) melhor[r.aluno].porAtiv[r.atividade] = pts;
  }
  return Object.values(melhor).map(a => {
    const total = Object.values(a.porAtiv).reduce((s, v) => s + v, 0);
    return { aluno: a.aluno, turma: a.turma, total };
  }).sort((a, b) => b.total - a.total);
}

window.recalcularConquistas = async function(btn) {
  btn.disabled = true;
  btn.textContent = 'Calculando…';
  try {
    const existingConqs = await getConquistas();
    const existingKeys = new Set(existingConqs.filter(c => c.sessaoId).map(c => `${c.sessaoId}:${c.tipo}`));

    const rankGeral = buildRankingStatico(todos);
    const sessionsByAluno = {};
    for (const r of todos.filter(r => r.concluido)) {
      if (!sessionsByAluno[r.aluno]) sessionsByAluno[r.aluno] = [];
      sessionsByAluno[r.aluno].push(r);
    }

    const toSave = [];
    for (const [aluno, sessions] of Object.entries(sessionsByAluno)) {
      const byAtiv = {};
      for (const r of sessions) {
        if (!byAtiv[r.atividade]) byAtiv[r.atividade] = [];
        byAtiv[r.atividade].push(r);
      }
      for (const [atividade, ativSessions] of Object.entries(byAtiv)) {
        const sorted = [...ativSessions].sort((a, b) => (a.criadoEm || 0) - (b.criadoEm || 0));
        for (let i = 0; i < sorted.length; i++) {
          const r = sorted[i];
          const prevAtiv = sorted.slice(0, i);
          const prevMelhor = prevAtiv.length > 0 ? Math.max(...prevAtiv.map(x => x.pontuacao_bruta || x.pontuacao || 0)) : 0;
          const rankTurma = rankGeral.filter(x => x.turma === r.turma);
          const sessaoData = {
            aluno, pontuacao_bruta: r.pontuacao_bruta || r.pontuacao || 0,
            acertos: r.acertos || 0, erros: r.erros || 0,
            respondidas: r.respondidas || ((r.acertos || 0) + (r.erros || 0)),
            acertos_rapidos: r.acertos_rapidos || 0, combo_max: r.combo_max || 0,
            novoMelhor: (r.pontuacao_bruta || r.pontuacao || 0) > prevMelhor, prevMelhor,
          };
          const earned = calcularConquistas(sessaoData, prevAtiv, rankTurma, rankGeral);
          for (const tipo of earned) {
            const key = `${r.id}:${tipo}`;
            if (!existingKeys.has(key)) {
              const c = CONQUISTAS[tipo];
              toSave.push({ aluno, tipo, atividade, turma: r.turma || '',
                sessaoId: r.id, icon: c.icon, nome: c.nome, descricao: c.desc, data: r.data || '' });
              existingKeys.add(key);
            }
          }
        }
      }
    }
    if (toSave.length) await salvarConquistas(toSave);
    btn.textContent = `✓ ${toSave.length} novas`;
    setTimeout(() => location.reload(), 1500);
  } catch(e) {
    console.error(e);
    btn.textContent = 'Erro';
    btn.disabled = false;
  }
};

filtrar();
</script>
</body>
</html>
