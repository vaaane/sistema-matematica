<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#6c00d4">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Migrar Lucas Matheus</title>
<link rel="stylesheet" href="/css/main.css"/>
<style>
  body{max-width:620px;margin:0 auto;padding:24px 16px 60px;background:#0d0f1a;color:#e8eaf0;font-family:'Inter',sans-serif;}
  h2{font-size:20px;margin-bottom:4px;}
  .sub{font-size:12px;color:#6b7280;margin-bottom:24px;}
  .box{background:#151828;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 18px;margin-bottom:14px;}
  .row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);}
  .row:last-child{border-bottom:none;}
  .lbl{color:#6b7280;}
  .val{font-weight:700;}
  .btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;}
  .btn-exec{background:linear-gradient(135deg,#7c5cfc,#5a3fcf);color:#fff;}
  .btn-exec:disabled{opacity:.4;cursor:not-allowed;}
  .log{background:#0d0f1a;border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:12px 14px;font-size:12px;font-family:monospace;max-height:250px;overflow-y:auto;margin-top:14px;}
  .ok{color:#22c55e;}.er{color:#ef4444;}.inf{color:#6b7280;}
  .warn{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:10px;padding:12px 14px;font-size:12px;color:rgba(245,158,11,.9);margin-bottom:16px;}
</style>
</head>
<body>
<h2>🔄 Migrar dados: Lucas Oliveira → Lucas Matheus</h2>
<p class="sub">8D · tabuada_niveis + tabuada_ranking + tabuada_presenca</p>

<div class="warn">⚠️ Esta página copiará os dados de <strong>8D_Lucas_Oliveira</strong> para <strong>8D_Lucas_Matheus</strong> e apagará os dados antigos. Operação irreversível.</div>

<div id="preview">
  <div class="inf" style="font-size:13px;padding:8px 0">Carregando dados…</div>
</div>

<button class="btn btn-exec" id="btn-migrar" disabled onclick="executarMigracao()">⚡ Executar migração</button>
<div class="log" id="log" style="display:none"></div>

<script type="module">
import { requireProfessor } from '/js/auth.js';
import { db } from '/js/firebase-config.js';
import { ref, get, set, remove } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

requireProfessor('/index.html');

const ORIGEM  = '8D_Lucas_Oliveira';
const DESTINO = '8D_Lucas_Matheus';
const NOME_DESTINO = 'Lucas Matheus';

const PATHS = ['tabuada_niveis', 'tabuada_ranking', 'tabuada_presenca'];

let dadosOrigem = {};

async function carregarPreview() {
  try {
    for (const p of PATHS) {
      const s = await get(ref(db, `${p}/${ORIGEM}`));
      dadosOrigem[p] = s.exists() ? s.val() : null;
    }

    const nO = dadosOrigem['tabuada_niveis'];
    const rO = dadosOrigem['tabuada_ranking'];
    const fmt = ts => ts ? new Date(ts).toLocaleDateString('pt-BR') : '—';

    document.getElementById('preview').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 32px 1fr;gap:8px;align-items:start">
        <div>
          <div style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;margin-bottom:8px">ORIGEM (será apagado)</div>
          <div class="box">
            <div class="row"><span class="lbl">UID</span><span class="val" style="font-size:11px">${ORIGEM}</span></div>
            <div class="row"><span class="lbl">Nível atual</span><span class="val" style="color:#22c55e">${nO?.nivel_atual ?? '—'}</span></div>
            <div class="row"><span class="lbl">Melhor nível</span><span class="val" style="color:#7c5cfc">${nO?.melhor_nivel ?? '—'}</span></div>
            <div class="row"><span class="lbl">Total partidas</span><span class="val">${nO?.total_partidas ?? '—'}</span></div>
            <div class="row"><span class="lbl">Maior combo</span><span class="val">${nO?.maior_combo ?? '—'}</span></div>
            <div class="row"><span class="lbl">Sessões no hist.</span><span class="val">${nO?.historico ? Object.keys(nO.historico).length : '—'}</span></div>
            <div class="row"><span class="lbl">Última partida</span><span class="val">${fmt(nO?.ultima_partida)}</span></div>
            <div class="row"><span class="lbl">Nome (ranking)</span><span class="val">${rO?.nome ?? '—'}</span></div>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;padding-top:60px;font-size:22px">→</div>
        <div>
          <div style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;margin-bottom:8px">DESTINO (vazio)</div>
          <div class="box" style="border-color:rgba(34,197,94,.25)">
            <div class="row"><span class="lbl">UID</span><span class="val" style="font-size:11px">${DESTINO}</span></div>
            <div class="row"><span class="lbl">Nível atual</span><span class="val" style="color:#6b7280">—</span></div>
            <div class="row"><span class="lbl">Melhor nível</span><span class="val" style="color:#6b7280">—</span></div>
            <div class="row"><span class="lbl">Total partidas</span><span class="val" style="color:#6b7280">—</span></div>
            <div class="row"><span class="lbl">Maior combo</span><span class="val" style="color:#6b7280">—</span></div>
            <div class="row"><span class="lbl">Sessões no hist.</span><span class="val" style="color:#6b7280">—</span></div>
            <div class="row"><span class="lbl">Última partida</span><span class="val" style="color:#6b7280">—</span></div>
            <div class="row"><span class="lbl">Nome (ranking)</span><span class="val" style="color:#22c55e">"${NOME_DESTINO}" (novo)</span></div>
          </div>
        </div>
      </div>
      <div style="font-size:12px;color:#6b7280;margin-top:8px">
        Após a migração: <strong style="color:#e8eaf0">${DESTINO}</strong> terá nível ${nO?.melhor_nivel ?? '?'} com ${nO?.historico ? Object.keys(nO.historico).length : '?'} sessões históricas.
      </div>`;

    if (nO) document.getElementById('btn-migrar').disabled = false;
  } catch(e) {
    document.getElementById('preview').innerHTML = `<div class="er">Erro ao carregar: ${e.message}</div>`;
  }
}

function log(msg, tipo='inf') {
  const el = document.getElementById('log');
  el.style.display = 'block';
  el.innerHTML += `<div class="${tipo}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

window.executarMigracao = async function() {
  const btn = document.getElementById('btn-migrar');
  btn.disabled = true;
  btn.textContent = 'Migrando…';

  try {
    if (dadosOrigem['tabuada_niveis']) {
      log('Copiando tabuada_niveis…');
      await set(ref(db, `tabuada_niveis/${DESTINO}`), dadosOrigem['tabuada_niveis']);
      log('✓ tabuada_niveis copiado', 'ok');
    }

    if (dadosOrigem['tabuada_ranking']) {
      log('Copiando tabuada_ranking…');
      await set(ref(db, `tabuada_ranking/${DESTINO}`), { ...dadosOrigem['tabuada_ranking'], nome: NOME_DESTINO });
      log(`✓ tabuada_ranking copiado (nome → "${NOME_DESTINO}")`, 'ok');
    }

    log('Removendo dados da origem…');
    await remove(ref(db, `tabuada_niveis/${ORIGEM}`));
    log(`✓ tabuada_niveis/${ORIGEM} removido`, 'ok');
    await remove(ref(db, `tabuada_ranking/${ORIGEM}`));
    log(`✓ tabuada_ranking/${ORIGEM} removido`, 'ok');
    if (dadosOrigem['tabuada_presenca']) {
      await remove(ref(db, `tabuada_presenca/${ORIGEM}`));
      log(`✓ tabuada_presenca/${ORIGEM} removido`, 'ok');
    }

    log('');
    log('✅ Migração concluída! Lucas Matheus agora tem nível ' + dadosOrigem['tabuada_niveis']?.melhor_nivel, 'ok');
    btn.textContent = '✅ Concluído!';
    btn.style.background = '#22c55e';
  } catch(e) {
    log(`❌ Erro: ${e.message}`, 'er');
    btn.disabled = false;
    btn.textContent = '⚡ Tentar novamente';
  }
};

carregarPreview();
</script>
</body>
</html>
