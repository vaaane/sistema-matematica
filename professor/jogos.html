<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎮 Jogar · Tabuada — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .nota-row{padding:10px 0;border-bottom:0.5px solid var(--border);}
    .nota-row:last-child{border-bottom:none;}
    .nota-nivel{font-size:12px;font-weight:700;color:var(--blue-dark);}
    .nota-texto{font-size:13px;color:var(--text);line-height:1.5;margin-top:3px;white-space:pre-wrap;}
    .nota-ts{font-size:11px;color:var(--text-muted);margin-top:3px;}
    @media(max-width:560px){.stat-grid{grid-template-columns:repeat(2,1fr)!important;}}
    .prog-tr:hover td{filter:brightness(.97);}
    .ovr-btn{padding:1px 7px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;line-height:1.6;font-family:inherit;}
    .ovr-btn:hover{background:var(--blue-pale);border-color:var(--blue);}
    .ovr-val{min-width:36px;display:inline-block;text-align:center;font-size:12px;font-weight:700;}
    .ovr-val.changed{color:var(--blue);}
    .ovr-rst{padding:1px 6px;border:1px solid rgba(239,68,68,.3);border-radius:5px;background:rgba(239,68,68,.06);color:var(--red);cursor:pointer;font-size:11px;font-family:inherit;}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">🎮 Jogar · Tabuada</div>
        <div class="topbar-sub">Modo professor — progresso salvo separado dos alunos</div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-ghost btn-sm" onclick="loadData()">
          <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          Atualizar
        </button>
      </div>
    </div>
    <div class="content" id="content">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div>
    </div>
  </div>
</div>

<script type="module">
import { requireProfessor, renderSidebarProfessor, clearSession } from "/js/auth.js";
import { db } from "/js/firebase-config.js";
import { ref, get, set, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

requireProfessor();
renderSidebarProfessor("sidebar", "jogos");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const PROF_UID  = 'professora';
const niveisRef = ref(db, `professor_tabuada_niveis/${PROF_UID}`);
const notasRef  = ref(db, `professor_jogos_notas/${PROF_UID}`);

function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(ts) {
  if (!ts) return '—';
  return new Date(Number(ts)).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

// ── Progressão de níveis (réplica fiel de _getLevelConfigBase em tabuada.html) ─
const _TB129 = 65;  // TEMPO_BASE_129 = getLevelConfigBase(121).secs + 20 = 45+20
const _TB200 = 45;  // TEMPO_BASE_200 = _TB129 - 20
const _TB300 = 35;  // TEMPO_BASE_300 = _TB200 - 10 — base para níveis 301+

function _tipoChefao(lvl) {
  if (lvl < 130 || lvl % 10 !== 0) return null;
  const ciclo = Math.floor((lvl - 130) / 10) % 3;
  return ciclo === 0 ? 'rapido' : ciclo === 1 ? 'dificil' : 'grande';
}

function _getLvlCfg(lvl) {
  if (lvl > 80 && lvl <= 120) { const b = _getLvlCfg(80); return { ...b, secs: b.secs + 40 }; }
  if (lvl <= 54) {
    const t = (lvl - 1) / 53;
    const pairs = Math.round(2 + t * 6);
    let secs = Math.round(70 - t * 15);
    const maxResult = Math.round(8 + t * 17);
    const cols = pairs <= 2 ? 2 : pairs <= 3 ? 3 : 4;
    if (lvl <= 30) secs = Math.round(secs / 2);
    return { pairs, cols, secs, maxResult, minMul: 0, minDiv: 0 };
  }
  if (lvl <= 65) {
    const t = (lvl - 55) / 10;
    const pairs = Math.round(4 + t * 4);
    const secs = Math.round(65 - t * 10);
    const cols = pairs <= 4 ? 3 : 4;
    const minMul = Math.max(1, Math.round(1 + t * (Math.floor(pairs / 3) - 1)));
    return { pairs, cols, secs, maxResult: 0, minMul, minDiv: 0 };
  }
  if (lvl <= 121) {
    const t = Math.min(1, (lvl - 66) / 24);
    const pairs = Math.round(4 + t * 14);
    const secs = Math.round(60 - t * 15);
    const cols = pairs <= 6 ? 4 : 6;
    const perOp = Math.floor(pairs / 4);
    const minMul = Math.max(1, Math.round(1 + t * (perOp - 1)));
    const minDiv = Math.max(1, Math.round(1 + t * (perOp - 1)));
    return { pairs, cols, secs, maxResult: 0, minMul, minDiv };
  }
  if (lvl <= 129) return { pairs: 12, cols: 6, secs: _TB129, maxResult: 0, minMul: 4, minDiv: 4 };
  const n = Math.floor((lvl - 130) / 10);
  if (lvl % 10 === 0) {
    const tipo = _tipoChefao(lvl);
    const minMul = Math.min(5 + n, 7), minDiv = Math.min(5 + n, 7);
    if (tipo === 'rapido') {
      const secsR = lvl > 300 ? _TB300 - 5 : _TB129 - 20;
      return { pairs: 12, cols: 6, secs: Math.max(20, secsR), maxResult: 0, minMul, minDiv, ehChefao: true, tipoChefao: 'rapido' };
    }
    if (tipo === 'dificil') {
      const secsD = lvl > 300 ? _TB300 : lvl >= 200 ? _TB200 : _TB129;
      return { pairs: 12, cols: 6, secs: secsD, maxResult: 0, minMul: Math.min(6+n,8), minDiv: Math.min(6+n,8), ehChefao: true, tipoChefao: 'dificil' };
    }
    const tBase = lvl > 300 ? _TB300 : lvl > 200 ? _TB200 : _TB129;
    const grandeIdx = Math.floor((lvl - 150) / 30);
    const secsG = lvl === 300 ? 20 : grandeIdx % 2 === 1 ? Math.max(20, tBase - 10) : Math.min(120, tBase + 5);
    return { pairs: 18, cols: 6, secs: secsG, maxResult: 0, minMul, minDiv, ehChefao: true, tipoChefao: 'grande' };
  }
  const tBase = lvl > 300 ? _TB300 : lvl > 200 ? _TB200 : _TB129;
  const secs = (lvl >= 132 && lvl <= 139) ? Math.max(20, _TB129 - 20) : tBase;
  return { pairs: 12, cols: 6, secs, maxResult: 0, minMul: Math.min(4+n,6), minDiv: Math.min(4+n,6), pesado: lvl > 300 };
}

function _gerarGrupos() {
  const gs = [];
  let g = null;
  for (let lvl = 1; lvl <= 400; lvl++) {
    const cfg = _getLvlCfg(lvl);
    const tipo = cfg.ehChefao ? 'chefao' : (lvl >= 130 && lvl % 10 !== 0 ? 'pos' : 'normal');
    const sig = [cfg.pairs, cfg.cols, cfg.secs, cfg.minMul, cfg.minDiv, cfg.maxResult || 0, tipo, cfg.tipoChefao || ''].join('|');
    if (g && g.sig === sig) { g.end = lvl; }
    else { g = { start: lvl, end: lvl, cfg, tipo, sig }; gs.push(g); }
  }
  return gs;
}

function _fmtOps(cfg) {
  let s = '➕ ➖';
  if (cfg.minMul > 0) s += ' ×';
  if (cfg.minDiv > 0) s += ' ÷';
  const m = [];
  if (cfg.minMul > 0) m.push(`${cfg.minMul}×`);
  if (cfg.minDiv > 0) m.push(`${cfg.minDiv}÷`);
  if (m.length) s += ` <span style="font-size:10px;color:var(--text-muted)">(mín ${m.join(' ')})</span>`;
  return s;
}

function _rowObs(g) {
  if (g.end <= 30)                            return '⏱️ Tempo ÷2 (aprendizado)';
  if (g.start >= 55 && g.end <= 65)           return '× introduzida gradualmente';
  if (g.start >= 66 && g.end <= 80)           return 'Todas as ops: ➕➖×÷';
  if (g.start >= 81  && g.end <= 120)         return 'Dificuldade = nv80 + 40s';
  if (g.start === 121)                         return 'Pico: 45s · 12 pares';
  if (g.start >= 122 && g.end <= 129)         return 'Respiro pré-chefão (65s)';
  if (g.tipo === 'chefao') {
    const t = g.cfg.tipoChefao;
    return t === 'rapido' ? '⚡ Chefão Rápido (45s)' : t === 'dificil' ? '🧮 Chefão Difícil' : '📦 Chefão Grande';
  }
  if (g.start > 200)                           return 'Base 45s (200+)';
  return '';
}

// ── Dados de override e histórico de testes ──────────────────
let _tempoOverrides = {};   // { nivel: secs }
let _ultimoTeste    = {};   // { nivel: { tempo_usado, resultado, timestamp } }
const _ovrRef  = ref(db, 'professor_tabuada_config/tempo_override');
const _histRef = ref(db, 'modo_teste_historico/PROFESSOR_TESTE/tabuada');

async function _carregarDadosProgressao() {
  const [ovrSnap, histSnap, profHistSnap] = await Promise.all([
    get(_ovrRef).catch(() => null),
    get(_histRef).catch(() => null),
    get(ref(db, 'professor_tabuada_niveis/professora/historico')).catch(() => null),
  ]);
  _tempoOverrides = {};
  if (ovrSnap?.exists()) ovrSnap.forEach(c => { _tempoOverrides[+c.key] = c.val(); });
  _ultimoTeste = {};
  // Histórico do modo teste (chave = timestamp, tem tempo_usado direto no valor)
  if (histSnap?.exists()) {
    histSnap.forEach(c => {
      const ts = +c.key;           // timestamp está na chave, não no valor
      const v  = c.val();
      if (!v?.nivel) return;
      const entry = { ...v, timestamp: ts };
      const prev  = _ultimoTeste[v.nivel];
      if (!prev || ts > prev.timestamp) _ultimoTeste[v.nivel] = entry;
    });
  }
  // Histórico do modo professor (chave = timestamp, calcula tempo_usado)
  if (profHistSnap?.exists()) {
    profHistSnap.forEach(c => {
      const ts = +c.key;
      const v  = c.val();
      if (!v?.nivel) return;
      const cfg  = _getLvlCfg(v.nivel);
      const segs = v.segundos_restantes ?? null;
      const tempo_usado = segs != null ? cfg.secs - segs : cfg.secs;
      const entry = { ...v, timestamp: ts, tempo_usado };
      const prev  = _ultimoTeste[v.nivel];
      if (!prev || ts > prev.timestamp) _ultimoTeste[v.nivel] = entry;
    });
  }
}

function _fmtTempo(seg) {
  const m = Math.floor(seg / 60), s = seg % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function _ultimoTesteHTML(g) {
  // Encontrar o teste mais recente em qualquer nível do grupo
  let best = null;
  for (let l = g.start; l <= g.end; l++) {
    const e = _ultimoTeste[l];
    if (e && (!best || e.timestamp > best.timestamp)) best = e;
  }
  if (!best) return '<span style="color:var(--text-muted)">—</span>';
  const t = best.tempo_usado != null ? _fmtTempo(best.tempo_usado) : '?';
  const ok = best.resultado === 'completou';
  return `<span style="font-weight:600">${t}</span> ${ok ? '✅' : '⏱'}`;
}

function _ovrSecsForGroup(g) {
  // Pega o override do nível inicial do grupo (ou padrão se não há override)
  return _tempoOverrides[g.start] ?? g.cfg.secs;
}

function _renderProgressaoTable() {
  const gs = _gerarGrupos();
  const YEL = 'background:#FEF9C3;';
  const rows = gs.map((g, i) => {
    const prev = gs[i - 1];
    const lvlLabel = g.start === g.end ? `${g.start}` : `${g.start}–${g.end}`;
    const rowBg = g.tipo === 'chefao'
      ? 'background:rgba(239,68,68,.1);'
      : g.tipo === 'pos'
      ? 'background:rgba(249,115,22,.07);'
      : i % 2 ? 'background:rgba(0,0,0,.018);' : '';
    const tipoLabel = g.tipo === 'chefao'
      ? (g.cfg.tipoChefao === 'rapido' ? '⚡ Rápido' : g.cfg.tipoChefao === 'dificil' ? '🧮 Difícil' : g.cfg.tipoChefao === 'grande' ? '📦 Grande' : '👹 Chefão')
      : g.tipo === 'pos' ? 'Pós-chefão' : '—';
    const gridLabel = `${g.cfg.cols}×${Math.ceil(g.cfg.pairs * 2 / g.cfg.cols)}`;
    const faixaLabel = g.cfg.maxResult ? `1–${g.cfg.maxResult}` : '—';
    const td = s => `style="padding:5px 10px;border-bottom:1px solid var(--border);${s}"`;
    const cS  = prev && prev.cfg.secs    !== g.cfg.secs    ? YEL : '';
    const cG  = prev && (prev.cfg.pairs  !== g.cfg.pairs || prev.cfg.cols !== g.cfg.cols) ? YEL : '';
    const cC  = prev && prev.cfg.pairs   !== g.cfg.pairs   ? YEL : '';
    const cO  = prev && (prev.cfg.minMul !== g.cfg.minMul  || prev.cfg.minDiv !== g.cfg.minDiv) ? YEL : '';
    const cF  = prev && (prev.cfg.maxResult||0) !== (g.cfg.maxResult||0) ? YEL : '';
    const ovrSecs = _ovrSecsForGroup(g);
    const hasOvr  = _tempoOverrides[g.start] != null;
    const ovrValCls = hasOvr ? 'ovr-val changed' : 'ovr-val';
    return `<tr class="prog-tr" style="${rowBg}cursor:pointer" onclick="selecionarNivelParaTeste(${g.start})" title="Testar nível ${g.start}">
      <td ${td('font-weight:700;white-space:nowrap')}>${lvlLabel}</td>
      <td ${td('font-size:11px')}>${tipoLabel}</td>
      <td ${td('text-align:center;'+cS)}>${g.cfg.secs}s</td>
      <td ${td('text-align:center;'+cG)}>${gridLabel}</td>
      <td ${td('text-align:center;'+cC)}>${g.cfg.pairs * 2}</td>
      <td ${td(cO)}>${_fmtOps(g.cfg)}</td>
      <td ${td('text-align:center;'+cF)}>${faixaLabel}</td>
      <td ${td('white-space:nowrap')} onclick="event.stopPropagation()">
        <div style="display:flex;align-items:center;gap:3px">
          <button class="ovr-btn" onclick="ajustarTempoGrupo(${g.start},${g.end},-5)">−</button>
          <span class="${ovrValCls}" id="ovr-${g.start}">${ovrSecs}s</span>
          <button class="ovr-btn" onclick="ajustarTempoGrupo(${g.start},${g.end},+5)">+</button>
          ${hasOvr ? `<button class="ovr-rst" onclick="resetarTempoGrupo(${g.start},${g.end})">↩</button>` : ''}
        </div>
      </td>
      <td ${td('white-space:nowrap;font-size:12px')}>${_ultimoTesteHTML(g)}</td>
      <td ${td('font-size:11px;color:var(--text-muted)')}>${_rowObs(g)}</td>
    </tr>`;
  }).join('');
  const body = document.getElementById('prog-table-body');
  if (body) body.innerHTML = rows;
}

window.toggleProgressao = async function() {
  const wrap = document.getElementById('prog-table-wrap');
  const chev = document.getElementById('prog-chev');
  if (!wrap) return;
  const open = wrap.style.display !== 'none';
  wrap.style.display = open ? 'none' : 'block';
  if (chev) chev.textContent = open ? '▼' : '▲';
  if (!open) {
    if (!wrap.dataset.filled) wrap.dataset.filled = '1';
    await _carregarDadosProgressao();
    _renderProgressaoTable();
  }
};

window.exportarProgressaoCSV = function() {
  const gs = _gerarGrupos();
  const linhas = [['Nível','Tipo','Tempo (s)','Grid','Total cards','Min ×','Min ÷','Faixa números','Observação']];
  gs.forEach(g => {
    const tipo = g.tipo === 'chefao' ? 'Chefão' : g.tipo === 'pos' ? 'Pós-chefão' : 'Normal';
    linhas.push([
      g.start === g.end ? `${g.start}` : `${g.start}-${g.end}`,
      tipo, g.cfg.secs,
      `${g.cfg.cols}x${Math.ceil(g.cfg.pairs * 2 / g.cfg.cols)}`,
      g.cfg.pairs * 2, g.cfg.minMul || 0, g.cfg.minDiv || 0,
      g.cfg.maxResult ? `1-${g.cfg.maxResult}` : 'variada',
      _rowObs(g),
    ]);
  });
  const csv = linhas.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'progressao_niveis_tabuada.csv' });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

window.selecionarNivelParaTeste = function(lvl) {
  const inp = document.getElementById('inp-nivel');
  if (!inp) return;
  inp.value = lvl;
  inp.closest('.card')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  inp.focus();
};

// ─────────────────────────────────────────────────────────────────────────────
async function loadData() {
  const content = document.getElementById('content');

  const [niveisSnap, notasSnap] = await Promise.all([
    get(niveisRef).catch(() => null),
    get(notasRef).catch(() => null),
  ]);

  const niveis        = niveisSnap?.exists() ? niveisSnap.val() : {};
  const nivelAtual    = Math.max(1, niveis.nivel_atual  || 1);
  const melhorNivel   = Math.max(1, niveis.melhor_nivel || 1);
  const totalPartidas = niveis.total_partidas || 0;
  const maiorCombo    = niveis.maior_combo    || 0;

  // Últimas 10 partidas (mais recentes primeiro, depois inverter para gráfico)
  const hist = [];
  if (niveis.historico) {
    Object.entries(niveis.historico)
      .sort(([a], [b]) => Number(b) - Number(a))
      .slice(0, 10)
      .forEach(([ts, v]) => hist.push({ ts: Number(ts), ...v }));
    hist.reverse();
  }

  // Notas salvas
  const notas = [];
  if (notasSnap?.exists()) {
    notasSnap.forEach(child => notas.push({ nivel: child.key, ...child.val() }));
    notas.sort((a, b) => Number(a.nivel) - Number(b.nivel));
  }

  // ── Gráfico das últimas partidas ──────────────────────────────
  const maxLv = hist.length ? Math.max(...hist.map(x => x.nivel || 1)) : 1;
  const chartBars = hist.map(h => {
    const ok   = h.resultado === 'completou';
    const barH = Math.max(8, Math.round(((h.nivel || 1) / maxLv) * 64));
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px" title="${ok ? 'Completou' : 'Tempo esgotado'} · Nível ${h.nivel || 1}">
      <div style="font-size:9px;color:var(--text-muted);font-weight:600">${h.nivel || 1}</div>
      <div style="width:100%;background:${ok ? '#22C55E' : '#f97316'};border-radius:4px 4px 0 0;height:${barH}px"></div>
    </div>`;
  }).join('');

  content.innerHTML = `
  <div style="max-width:680px">

  <!-- Stats + botões -->
  <div class="card" style="padding:0;overflow:hidden;margin-bottom:16px">
    <div class="stat-grid" style="display:grid;grid-template-columns:repeat(4,1fr)">
      ${[
        [nivelAtual,       'Nível atual',    'var(--blue)'],
        [melhorNivel,      'Melhor nível',   '#22C55E'],
        [totalPartidas,    'Partidas',       'var(--text)'],
        [maiorCombo||'—',  'Maior combo 🔥', '#FAB800'],
      ].map(([v, l, c], i) => `
        <div style="padding:16px 12px;text-align:center;${i < 3 ? 'border-right:1px solid var(--border)' : ''}">
          <div style="font-size:24px;font-weight:800;color:${c};line-height:1">${v}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px">${l}</div>
        </div>`).join('')}
    </div>
    <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px">
      <a href="/aluno/tabuada.html" class="btn btn-blue" style="flex:1;justify-content:center;text-decoration:none">▶ Jogar nível ${nivelAtual}</a>
      <a href="/aluno/tabuada.html?modo=sprint" class="btn" style="background:#7F77DD;color:#fff;border:none;flex:1;justify-content:center;text-decoration:none">⚡ Sprint</a>
    </div>
  </div>

  <!-- Testar nível específico -->
  <div class="card" style="margin-bottom:16px">
    <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px">Testar nível específico</div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <input type="number" id="inp-nivel" min="1" max="999" value="${nivelAtual}"
        style="width:76px;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-weight:700;text-align:center;background:var(--bg);color:var(--text)">
      <button onclick="testarNivel()" class="btn btn-blue">▶ Testar este nível</button>
      <span style="font-size:12px;color:var(--text-muted)">Não altera o nível atual</span>
    </div>
  </div>

  ${hist.length > 0 ? `
  <!-- Gráfico últimas partidas -->
  <div class="card" style="margin-bottom:16px">
    <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px">Últimas ${hist.length} partidas</div>
    <div style="display:flex;align-items:flex-end;gap:4px;height:80px">
      ${chartBars}
    </div>
    <div style="display:flex;align-items:center;gap:16px;margin-top:10px;font-size:11px;color:var(--text-muted)">
      <span><span style="display:inline-block;width:10px;height:10px;background:#22C55E;border-radius:2px;margin-right:4px;vertical-align:middle"></span>Completou</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:#f97316;border-radius:2px;margin-right:4px;vertical-align:middle"></span>Tempo esgotado</span>
      <span style="margin-left:auto;font-size:11px">mais antigo → mais recente</span>
    </div>
  </div>` : ''}

  <!-- Anotações por nível -->
  <div class="card" style="margin-bottom:16px">
    <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px">Anotações por nível</div>
    <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:5px;flex-shrink:0">
        <label style="font-size:11px;color:var(--text-muted)">Nível</label>
        <input type="number" id="nota-nivel" min="1" max="50" value="${nivelAtual}"
          style="width:66px;padding:7px 8px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-weight:700;text-align:center;background:var(--bg);color:var(--text)">
      </div>
      <div style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:5px">
        <label style="font-size:11px;color:var(--text-muted)">Observação</label>
        <textarea id="nota-texto" rows="2" placeholder="Ex: nível 8 muito difícil para 8D…"
          style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);resize:vertical;box-sizing:border-box"></textarea>
      </div>
      <div style="display:flex;align-items:flex-end;padding-bottom:0">
        <button onclick="salvarNota()" class="btn btn-blue">Salvar</button>
      </div>
    </div>
    <div id="notas-list">
      ${notas.length === 0
        ? `<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:16px">Nenhuma anotação ainda</div>`
        : notas.map(n => `
          <div class="nota-row">
            <div style="display:flex;align-items:center;gap:8px">
              <span class="nota-nivel">Nível ${escH(n.nivel)}</span>
              <span style="font-size:11px;color:var(--text-muted);margin-left:auto">${n.atualizado_em ? fmtDate(n.atualizado_em) : ''}</span>
              <button onclick="deletarNota('${escH(n.nivel)}')" style="font-size:11px;color:var(--text-muted);background:none;border:none;cursor:pointer;padding:2px 4px" title="Remover">✕</button>
            </div>
            <div class="nota-texto">${escH(n.texto || '')}</div>
          </div>`).join('')}
    </div>
  </div>

  <!-- Progressão de níveis -->
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;padding:2px 0" onclick="toggleProgressao()">
      <div style="font-size:13px;font-weight:700;color:var(--text)">📊 Ver progressão completa dos níveis (1–400)</div>
      <span id="prog-chev" style="font-size:12px;color:var(--text-muted)">▼</span>
    </div>
    <div id="prog-table-wrap" style="display:none;margin-top:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:14px;font-size:11px;color:var(--text-muted);flex-wrap:wrap">
          <span><span style="display:inline-block;width:10px;height:10px;background:rgba(239,68,68,.25);border-radius:2px;margin-right:4px;vertical-align:middle"></span>👹 Chefão</span>
          <span><span style="display:inline-block;width:10px;height:10px;background:rgba(249,115,22,.2);border-radius:2px;margin-right:4px;vertical-align:middle"></span>Pós-chefão</span>
          <span><span style="display:inline-block;width:10px;height:10px;background:#FEF9C3;border-radius:2px;border:1px solid #FCD34D;margin-right:4px;vertical-align:middle"></span>Valor mudou</span>
        </div>
        <button onclick="exportarProgressaoCSV()" class="btn btn-ghost" style="font-size:12px;padding:5px 12px">📥 Exportar CSV</button>
      </div>
      <div style="overflow-x:auto;max-height:540px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius)">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead style="position:sticky;top:0;z-index:1;background:var(--card)">
            <tr>
              ${['Nível','Tipo','Tempo','Grid','Cards','Operações','Faixa','Tempo teste','Último teste','Obs.'].map((h,i) =>
                `<th style="padding:7px 10px;text-align:${i>=2&&i<=4?'center':'left'};font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);border-bottom:2px solid var(--border);white-space:nowrap">${h}</th>`
              ).join('')}
            </tr>
          </thead>
          <tbody id="prog-table-body"></tbody>
        </table>
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:6px;text-align:center">
        Clique em qualquer linha para preencher "Testar nível específico" ↑
      </div>
    </div>
  </div>

  </div>`;

  document.getElementById('inp-nivel')?.addEventListener('keydown', e => { if (e.key === 'Enter') window.testarNivel(); });
}

window.ajustarTempoGrupo = async function(start, end, delta) {
  const defaultSecs = _getLvlCfg(start).secs;
  const current = _tempoOverrides[start] ?? defaultSecs;
  const novo = Math.max(5, Math.min(300, current + delta));
  const updates = {};
  for (let l = start; l <= end; l++) updates[l] = novo;
  try {
    await update(ref(db, 'professor_tabuada_config/tempo_override'), updates);
    for (let l = start; l <= end; l++) _tempoOverrides[l] = novo;
    const el = document.getElementById(`ovr-${start}`);
    if (el) {
      el.textContent = `${novo}s`;
      el.className = 'ovr-val changed';
      // Confirmação visual: verde por 1.5s
      el.style.color = '#16A34A';
      setTimeout(() => { el.style.color = ''; }, 1500);
    }
  } catch(e) {
    console.error('[tempo_override] Erro ao salvar:', e);
    alert(`Erro ao salvar override: ${e.message}\n\nVerifique se há permissão de escrita em professor_tabuada_config/tempo_override no Firebase.`);
  }
};

window.resetarTempoGrupo = async function(start, end) {
  const removes = [];
  for (let l = start; l <= end; l++) {
    removes.push(remove(ref(db, `professor_tabuada_config/tempo_override/${l}`)));
    delete _tempoOverrides[l];
  }
  await Promise.all(removes);
  const el = document.getElementById(`ovr-${start}`);
  if (el) { el.textContent = `${_getLvlCfg(start).secs}s`; el.className = 'ovr-val'; }
  // Re-render to remove the reset button
  await _carregarDadosProgressao();
  _renderProgressaoTable();
};

window.testarNivel = function() {
  const nivel = parseInt(document.getElementById('inp-nivel')?.value, 10);
  if (isNaN(nivel) || nivel < 1 || nivel > 999) {
    alert('Digite um nível entre 1 e 999.');
    return;
  }
  const ovr = _tempoOverrides[nivel];
  const url = ovr != null
    ? `/aluno/tabuada.html?nivel=${nivel}&secs=${ovr}`
    : `/aluno/tabuada.html?nivel=${nivel}`;
  window.location.href = url;
};

window.salvarNota = async function() {
  const nivel = Math.max(1, Math.min(50, parseInt(document.getElementById('nota-nivel')?.value) || 1));
  const texto = document.getElementById('nota-texto')?.value?.trim() || '';
  if (!texto) return;
  await set(ref(db, `professor_jogos_notas/${PROF_UID}/${nivel}`), { texto, atualizado_em: Date.now() });
  await loadData();
};

window.deletarNota = async function(nivel) {
  if (!confirm(`Remover anotação do nível ${nivel}?`)) return;
  await remove(ref(db, `professor_jogos_notas/${PROF_UID}/${nivel}`));
  await loadData();
};

loadData();
</script>
</body>
</html>
