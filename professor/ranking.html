<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ranking — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    /* ── MODO PROJEÇÃO / TV ──────────────────────────────────── */
    body.proj { background:#07071a; }
    body.proj .sidebar { display:none; }
    body.proj .main { background:#07071a; }
    body.proj .topbar { background:#0c0c22; border-bottom:1px solid #2a2a50; }
    body.proj .topbar-title { font-family:'Orbitron',monospace; font-size:13px; letter-spacing:1px; color:#c0c0ff; }
    body.proj .topbar-sub { color:#4444a0; }
    body.proj .content { padding:16px 28px 24px; }

    /* ── RELÓGIO ─────────────────────────────────────────────── */
    .proj-clock { font-family:'Orbitron',monospace; font-size:13px; color:#333360; }

    /* ── SEÇÃO LABEL ─────────────────────────────────────────── */
    .proj-sec { font-family:'Orbitron',monospace; font-size:10px; font-weight:700; color:#2a2a50; letter-spacing:2px; text-align:center; margin:10px 0 12px; }

    /* ── PÓDIO ───────────────────────────────────────────────── */
    .podium-stage { display:flex; align-items:flex-end; justify-content:center; gap:10px; height:200px; margin-bottom:6px; }
    .pod-col { display:flex; flex-direction:column; align-items:center; }
    .pod-medal { font-size:26px; margin-bottom:5px; }
    .pod-step { min-width:150px; border-radius:12px 12px 0 0; display:flex; flex-direction:column; align-items:center; padding:10px 14px 0; }
    .pod-step.p1 { height:160px; background:linear-gradient(180deg,rgba(250,184,0,.22),rgba(250,184,0,.04)); border:2px solid rgba(250,184,0,.45); }
    .pod-step.p2 { height:120px; background:linear-gradient(180deg,rgba(200,200,220,.16),rgba(200,200,220,.04)); border:2px solid rgba(200,200,220,.32); }
    .pod-step.p3 { height:90px; background:linear-gradient(180deg,rgba(180,110,20,.16),rgba(180,110,20,.04)); border:2px solid rgba(180,110,20,.32); }
    .pod-nome { font-size:14px; font-weight:800; color:#dddeff; max-width:136px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
    .pod-turma { font-size:10px; color:#5555a0; margin-top:2px; }
    .pod-pts { font-family:'Orbitron',monospace; font-size:18px; font-weight:900; color:#FAB800; margin-top:5px; transition:color .4s; }
    .pod-extras { display:flex; gap:8px; align-items:center; margin-top:3px; flex-wrap:wrap; justify-content:center; }
    .pod-combo { font-size:10px; color:#FF8800; font-weight:700; }
    .pod-tent { font-size:10px; color:#4444a0; }
    .pod-ativo { font-size:10px; font-weight:700; color:#22C55E; animation:blink-g 1.4s ease infinite; }
    .pod-rapid { font-size:10px; color:#60A5FA; font-weight:700; }
    .pod-dif { font-size:10px; color:#FDE047; font-weight:700; }
    .pod-empty { font-size:12px; color:#1a1a38; margin-top:8px; }
    @keyframes blink-g { 0%,100%{opacity:1}50%{opacity:.3} }

    /* ── LISTA (4º em diante) ────────────────────────────────── */
    .rank-list { display:flex; flex-direction:column; gap:5px; }
    @keyframes row-in { from{opacity:0;transform:translateX(-12px)} to{opacity:1;transform:translateX(0)} }
    .rk-row { display:grid; grid-template-columns:46px 1fr auto; align-items:center; gap:14px; padding:10px 16px; border-radius:10px; background:#0d0d24; border:1px solid #191938; animation:row-in .35s ease; transition:background .5s,border-color .5s; }
    .rk-row.ativo-now { border-color:#1a3a1a; background:#081508; }
    .rk-num { font-family:'Orbitron',monospace; font-size:18px; font-weight:700; color:#2a2a50; text-align:center; }
    .rk-nome { font-size:15px; font-weight:700; color:#c0c0e0; }
    .rk-meta { display:flex; gap:10px; align-items:center; font-size:11px; color:#4444a0; margin-top:3px; flex-wrap:wrap; }
    .rk-tag-ativo { background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.4); color:#4ADE80; border-radius:10px; padding:1px 8px; font-size:10px; font-weight:700; animation:blink-g 1.4s ease infinite; }
    .rk-combo { color:#FF8800; font-weight:700; }
    .rk-rapid { color:#60A5FA; font-weight:700; }
    .rk-dif   { color:#FDE047; font-weight:700; }
    .rk-pts { font-family:'Orbitron',monospace; font-size:18px; font-weight:900; color:#FAB800; white-space:nowrap; transition:color .4s; }
    .rk-footer { text-align:center; padding:14px 0 0; font-size:10px; color:#2a2a50; font-family:'Orbitron',monospace; letter-spacing:.8px; }
    .rk-vazio { text-align:center; padding:60px; color:#2a2a50; font-family:'Orbitron',monospace; font-size:13px; }

    /* ── MODO PAINEL (default) ───────────────────────────────── */
    .tab-nav{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:20px;}
    .tab-nav button{flex:1;padding:9px;border:none;border-radius:9px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);background:transparent;transition:all .2s;}
    .tab-nav button.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(47,158,220,.3);}
    th.sortable{cursor:pointer;user-select:none;}
    th.sortable:hover{color:var(--blue);}
    th.sort-asc::after{content:" ▲";font-size:9px;}
    th.sort-desc::after{content:" ▼";font-size:9px;}
    .tr-top1 td{background:rgba(250,184,0,.10)!important}
    .tr-top2 td{background:rgba(200,200,220,.08)!important}
    .tr-top3 td{background:rgba(180,110,20,.08)!important}
    .ativ-sel-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
    .ativ-btn-prof{padding:7px 14px;border:1.5px solid var(--border);border-radius:20px;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:all .2s;}
    .ativ-btn-prof.active{border-color:var(--blue);background:var(--blue);color:#fff;}
    .live-tag{font-size:10px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.4);color:#16A34A;border-radius:10px;padding:1px 7px;font-weight:700;display:inline-flex;align-items:center;}

    /* ── TV progress bar ─────────────────────────────────────── */
    .tv-bar-wrap{height:3px;background:#1a1a38;border-radius:2px;margin-bottom:14px;overflow:hidden;}
    .tv-bar{height:3px;background:#FAB800;border-radius:2px;width:0%;}

    @media(max-width:640px) {
      .pod-step { min-width:90px; }
      .rk-meta { display:none; }
      .rk-row { grid-template-columns:36px 1fr auto; }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title" id="topbar-title">Ranking</div>
        <div class="topbar-sub" id="topbar-sub">Visão geral de desempenho</div>
      </div>
      <div class="topbar-right" id="topbar-right" style="gap:8px"></div>
    </div>
    <div class="content" id="content">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div>
    </div>
  </div>
</div>

<script type="module">
import { getLiberadas, listenRankingProfessor, getResultados } from "/js/db.js";
import { requireProfessor, renderSidebarProfessor, clearSession } from "/js/auth.js";
import { LISTA_ATIVIDADES } from "/js/constants.js";

requireProfessor();
renderSidebarProfessor("sidebar", "ranking");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const params    = new URLSearchParams(window.location.search);
const ativParam = params.get("ativ");
const tvMode    = params.get("tv") === "true";

let modoAtivo = params.get("modo") || "competicao";

if (ativParam) {
  iniciarModoProjecao(ativParam, modoAtivo);
} else if (tvMode) {
  await iniciarTVMode();
} else {
  await renderPainelPrincipal();
}

// ══════════════════════════════════════════════════════════════
// PAINEL PRINCIPAL (default — duas abas)
// ══════════════════════════════════════════════════════════════
async function renderPainelPrincipal() {
  const todos = await getResultados();

  function buildRankingMedia(lista) {
    const melhor = {};
    for (const r of lista) {
      if (!r.concluido || !r.aluno) continue;
      if (!melhor[r.aluno]) melhor[r.aluno] = { aluno: r.aluno, turma: r.turma || '?', porAtiv: {}, sessoes: 0 };
      const prev = melhor[r.aluno].porAtiv[r.atividade] || 0;
      if ((r.pontuacao || 0) > prev) melhor[r.aluno].porAtiv[r.atividade] = r.pontuacao || 0;
      melhor[r.aluno].sessoes++;
    }
    return Object.values(melhor).map(a => {
      const vals = Object.values(a.porAtiv);
      const media = vals.length ? Math.round(vals.reduce((s, v) => s + v, 0) / vals.length) : 0;
      return { aluno: a.aluno, turma: a.turma, media, atividades: vals.length, sessoes: a.sessoes };
    }).sort((a, b) => b.media - a.media);
  }

  const rankAll = buildRankingMedia(todos);

  // Sortable table state
  let sortCol = 'media';
  let sortAsc = false;

  function renderTabelaGeral() {
    const sorted = [...rankAll].sort((a, b) => {
      const v = sortAsc ? 1 : -1;
      if (sortCol === 'aluno') return v * a.aluno.localeCompare(b.aluno);
      if (sortCol === 'turma') return v * a.turma.localeCompare(b.turma);
      return v * ((a[sortCol] || 0) - (b[sortCol] || 0));
    });
    const tbody = document.getElementById('geral-tbody');
    if (!tbody) return;
    tbody.innerHTML = sorted.map((r, i) => {
      const pos = i + 1;
      const medal = pos <= 3 ? ['🥇','🥈','🥉'][pos-1] : pos;
      const cls = pos === 1 ? 'tr-top1' : pos === 2 ? 'tr-top2' : pos === 3 ? 'tr-top3' : '';
      return `<tr class="${cls}">
        <td style="text-align:center;font-weight:700">${medal}</td>
        <td style="font-weight:600">${r.aluno}</td>
        <td><span class="badge badge-blue">Turma ${r.turma}</span></td>
        <td style="font-weight:800;color:var(--gold)">${r.media}</td>
        <td>${r.atividades}</td>
        <td>${r.sessoes}</td>
      </tr>`;
    }).join('');
    // Update header sort indicators
    ['aluno','turma','media','atividades','sessoes'].forEach(col => {
      const th = document.getElementById('th-' + col);
      if (!th) return;
      th.className = 'sortable' + (sortCol === col ? (sortAsc ? ' sort-asc' : ' sort-desc') : '');
    });
  }

  window.sortGeral = function(col) {
    if (sortCol === col) sortAsc = !sortAsc; else { sortCol = col; sortAsc = false; }
    renderTabelaGeral();
  };

  // Activity tab state
  let ativSel     = LISTA_ATIVIDADES[0]?.nome || '';
  let unsubAtiv   = null;

  function abrirAtivProf(nome) {
    ativSel = nome;
    document.querySelectorAll('.ativ-btn-prof').forEach(b =>
      b.classList.toggle('active', b.dataset.ativ === nome));
    if (unsubAtiv) { unsubAtiv(); unsubAtiv = null; }
    const el = document.getElementById('rank-ativ-prof');
    if (!el) return;
    el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted)">Aguardando…</div>';
    unsubAtiv = listenRankingProfessor(nome, ranking => {
      if (!el) return;
      if (!ranking.length) {
        el.innerHTML = '<p style="padding:16px;color:var(--text-muted);font-size:13px">Sem resultados para esta atividade.</p>';
        return;
      }
      el.innerHTML = `<table class="table">
        <thead><tr>
          <th style="width:40px">#</th>
          <th>Aluno</th>
          <th>Turma</th>
          <th>Melhor</th>
          <th class="rank-hide-mobile">Sessões</th>
          <th class="rank-hide-mobile">Combo</th>
          <th class="rank-hide-mobile">Status</th>
        </tr></thead>
        <tbody>${ranking.map((r, i) => {
          const pos = i + 1;
          const medal = pos <= 3 ? ['🥇','🥈','🥉'][pos-1] : pos;
          const cls = pos === 1 ? 'tr-top1' : pos === 2 ? 'tr-top2' : pos === 3 ? 'tr-top3' : '';
          return `<tr class="${cls}">
            <td style="text-align:center;font-weight:700">${medal}</td>
            <td style="font-weight:600">${r.aluno}</td>
            <td><span class="badge badge-blue">Turma ${r.turma}</span></td>
            <td style="font-weight:800;color:var(--gold)">${r.melhorPts}</td>
            <td class="rank-hide-mobile">${r.tentativas}</td>
            <td class="rank-hide-mobile">${r.comboMax > 1 ? `🔥×${r.comboMax}` : '—'}</td>
            <td class="rank-hide-mobile">${r.ativo ? '<span style="color:var(--green);font-weight:700">⚡ jogando</span>' : '—'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;
    });
  }

  window.mudarTabPainel = function(tab) {
    ['geral','ativ'].forEach(t => {
      document.getElementById('ptab-' + t)?.classList.toggle('active', t === tab);
      document.getElementById('ppanel-' + t).style.display = t === tab ? '' : 'none';
    });
    if (tab === 'ativ') abrirAtivProf(ativSel);
    if (tab === 'geral' && unsubAtiv) { unsubAtiv(); unsubAtiv = null; }
  };

  const ativBtns = LISTA_ATIVIDADES.map(a =>
    `<button class="ativ-btn-prof${a.nome === ativSel ? ' active' : ''}" data-ativ="${a.nome}">${a.nome}</button>`
  ).join('');

  const tvUrl = '/professor/ranking.html?tv=true';
  document.getElementById('topbar-right').innerHTML =
    `<a href="${tvUrl}" target="_blank" class="btn btn-ghost" style="font-size:12px">📺 Modo TV</a>`;

  document.getElementById('content').innerHTML = `
    <div class="tab-nav">
      <button id="ptab-geral" class="active" onclick="mudarTabPainel('geral')">🏆 Geral</button>
      <button id="ptab-ativ"                 onclick="mudarTabPainel('ativ')">📚 Por Atividade <span class="live-tag" style="margin-left:4px">ao vivo</span></button>
    </div>

    <div id="ppanel-geral">
      <div class="card" style="padding:0">
        ${rankAll.length
          ? `<table class="table">
              <thead><tr>
                <th style="width:40px">#</th>
                <th id="th-aluno" class="sortable sort-desc" onclick="sortGeral('aluno')">Aluno</th>
                <th id="th-turma" class="sortable" onclick="sortGeral('turma')">Turma</th>
                <th id="th-media" class="sortable sort-desc" onclick="sortGeral('media')">Média</th>
                <th id="th-atividades" class="sortable rank-hide-mobile" onclick="sortGeral('atividades')">Ativ.</th>
                <th id="th-sessoes" class="sortable rank-hide-mobile" onclick="sortGeral('sessoes')">Sessões</th>
              </tr></thead>
              <tbody id="geral-tbody"></tbody>
            </table>`
          : '<p style="padding:16px;color:var(--text-muted);font-size:13px">Nenhum resultado registrado ainda.</p>'}
      </div>
    </div>

    <div id="ppanel-ativ" style="display:none">
      <div class="ativ-sel-wrap" id="ativ-sel-prof">${ativBtns}</div>
      <div class="card" style="padding:0" id="rank-ativ-prof"></div>
    </div>`;

  if (rankAll.length) renderTabelaGeral();

  document.querySelectorAll('.ativ-btn-prof').forEach(b => {
    b.addEventListener('click', () => abrirAtivProf(b.dataset.ativ));
  });

  window.addEventListener('beforeunload', () => { if (unsubAtiv) unsubAtiv(); });
}

// ══════════════════════════════════════════════════════════════
// MODO PROJEÇÃO (?ativ=X) — mantido igual ao original
// ══════════════════════════════════════════════════════════════
function iniciarModoProjecao(atividade, modo) {
  modoAtivo = modo;
  const isPlus = modo === 'competicao_plus';
  document.body.classList.add('proj');
  document.getElementById("topbar-title").textContent = atividade;
  document.getElementById("topbar-sub").textContent = isPlus
    ? "Ranking ao vivo · Competição+" : "Ranking ao vivo · Competição";
  document.title = `Ranking — ${atividade}`;

  document.getElementById("topbar-right").innerHTML = `
    <span class="proj-clock" id="proj-clock"></span>
    <button class="btn btn-ghost" onclick="window.toggleFs()" style="font-size:12px">⛶ Tela cheia</button>
    <a href="/professor/ranking.html" class="btn btn-ghost" style="font-size:12px">← Sair</a>`;

  function tickClock() {
    const el = document.getElementById("proj-clock");
    if (el) el.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  tickClock();
  setInterval(tickClock, 15000);

  window.toggleFs = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  };

  const podLabel = isPlus ? "🏆 COMPETIÇÃO+ · TOP 3" : "🏆 PÓDIO";
  document.getElementById("content").innerHTML = `
    <div class="proj-sec">${podLabel}</div>
    <div class="podium-stage" id="podium-stage">${renderPodiumHTML([])}</div>
    <div class="proj-sec" id="demais-label" style="display:none">DEMAIS PARTICIPANTES</div>
    <div class="rank-list" id="rank-list"></div>
    <div class="rk-footer" id="rk-footer">Aguardando resultados…</div>`;

  const unsub = listenRankingProfessor(atividade, ranking => {
    atualizarPodio(ranking.slice(0, 3));
    atualizarLista(ranking.slice(3));
    const ativos = ranking.filter(r => r.ativo).length;
    document.getElementById("rk-footer").textContent =
      `⏱ atualizado às ${new Date().toLocaleTimeString('pt-BR')} · ${ranking.length} participante${ranking.length !== 1 ? 's' : ''}${ativos > 0 ? ` · ⚡ ${ativos} jogando` : ''}`;
    const demaisLbl = document.getElementById("demais-label");
    if (demaisLbl) demaisLbl.style.display = ranking.length > 3 ? '' : 'none';
  });
  window.addEventListener("beforeunload", () => unsub());
}

// ══════════════════════════════════════════════════════════════
// MODO TV (?tv=true)
// ══════════════════════════════════════════════════════════════
async function iniciarTVMode() {
  const [todos, liberadas] = await Promise.all([getResultados(), getLiberadas()]);

  document.body.classList.add('proj');
  document.getElementById("topbar-right").innerHTML = `
    <span class="proj-clock" id="proj-clock"></span>
    <button class="btn btn-ghost" onclick="document.documentElement.requestFullscreen().catch(()=>{})" style="font-size:12px">⛶ Tela cheia</button>
    <a href="/professor/ranking.html" class="btn btn-ghost" style="font-size:12px">← Sair</a>`;

  function tickClock() {
    const el = document.getElementById("proj-clock");
    if (el) el.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  tickClock();
  setInterval(tickClock, 15000);

  // Build avg ranking from todos
  function buildRankingMedia(lista) {
    const melhor = {};
    for (const r of lista) {
      if (!r.concluido || !r.aluno) continue;
      if (!melhor[r.aluno]) melhor[r.aluno] = { aluno: r.aluno, turma: r.turma || '?', porAtiv: {}, sessoes: 0 };
      const prev = melhor[r.aluno].porAtiv[r.atividade] || 0;
      if ((r.pontuacao || 0) > prev) melhor[r.aluno].porAtiv[r.atividade] = r.pontuacao || 0;
      melhor[r.aluno].sessoes++;
    }
    return Object.values(melhor).map(a => {
      const vals = Object.values(a.porAtiv);
      const media = vals.length ? Math.round(vals.reduce((s, v) => s + v, 0) / vals.length) : 0;
      return { aluno: a.aluno, turma: a.turma, media, atividades: vals.length, sessoes: a.sessoes };
    }).sort((a, b) => b.media - a.media);
  }

  // Slides: geral first, then one per liberated activity
  const slides = [
    { tipo: 'geral' },
    ...liberadas.map(lib => ({ tipo: 'ativ', atividade: lib.atividade, modo: lib.modo || 'competicao' })),
  ];
  if (slides.length === 1) slides.push(...LISTA_ATIVIDADES.map(a => ({ tipo: 'ativ', atividade: a.nome, modo: a.modo || 'competicao' })));

  let slideIdx    = 0;
  let currentUnsub = null;

  document.getElementById("content").innerHTML = `
    <div class="tv-bar-wrap"><div class="tv-bar" id="tv-bar"></div></div>
    <div id="tv-slide"></div>`;

  function animateBar() {
    const bar = document.getElementById('tv-bar');
    if (!bar) return;
    bar.style.transition = 'none';
    bar.style.width = '0%';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bar.style.transition = 'width 30s linear';
      bar.style.width = '100%';
    }));
  }

  function showSlide(idx) {
    if (currentUnsub) { currentUnsub(); currentUnsub = null; }
    const slide = slides[idx % slides.length];
    animateBar();

    if (slide.tipo === 'geral') {
      const rankAll = buildRankingMedia(todos);
      modoAtivo = 'classico';
      document.getElementById("topbar-title").textContent = '🏆 RANKING GERAL';
      document.getElementById("topbar-sub").textContent = `Classificação por média · ${rankAll.length} participantes`;
      const top3 = rankAll.slice(0, 3).map(r => ({
        aluno: r.aluno, turma: r.turma, melhorPts: r.media,
        ativo: false, tentativas: r.sessoes, comboMax: 0, acertosRapidos: 0, acertosDificeis: 0,
      }));
      document.getElementById('tv-slide').innerHTML = `
        <div class="proj-sec">CLASSIFICAÇÃO GERAL · MÉDIA DE PONTUAÇÃO</div>
        <div class="podium-stage" id="podium-stage">${renderPodiumHTML(top3)}</div>
        ${rankAll.length > 3 ? `
          <div class="proj-sec">DEMAIS PARTICIPANTES</div>
          <div class="rank-list">${rankAll.slice(3).map((r, i) => `
            <div class="rk-row">
              <div class="rk-num">${i + 4}</div>
              <div>
                <div class="rk-nome">${r.aluno} — T${r.turma}</div>
                <div class="rk-meta"><span>${r.atividades} ativ.</span><span>${r.sessoes} sess.</span></div>
              </div>
              <div class="rk-pts">${r.media}</div>
            </div>`).join('')}
          </div>` : ''}
        <div class="rk-footer">Média de pontuação por atividade realizada</div>`;
    } else {
      modoAtivo = slide.modo;
      const isPlus = slide.modo === 'competicao_plus';
      document.getElementById("topbar-title").textContent = slide.atividade;
      document.getElementById("topbar-sub").textContent = isPlus ? 'Ranking ao vivo · Competição+' : 'Ranking ao vivo';
      document.getElementById('tv-slide').innerHTML = `
        <div class="proj-sec">${isPlus ? '🏆 COMPETIÇÃO+ · TOP 3' : '🏆 PÓDIO'}</div>
        <div class="podium-stage" id="podium-stage">${renderPodiumHTML([])}</div>
        <div class="proj-sec" id="demais-label" style="display:none">DEMAIS PARTICIPANTES</div>
        <div class="rank-list" id="rank-list"></div>
        <div class="rk-footer" id="rk-footer">Aguardando resultados…</div>`;
      currentUnsub = listenRankingProfessor(slide.atividade, ranking => {
        atualizarPodio(ranking.slice(0, 3));
        atualizarLista(ranking.slice(3));
        const ativos = ranking.filter(r => r.ativo).length;
        const footer = document.getElementById('rk-footer');
        if (footer) footer.textContent =
          `⏱ ${new Date().toLocaleTimeString('pt-BR')} · ${ranking.length} participante${ranking.length !== 1 ? 's' : ''}${ativos ? ` · ⚡ ${ativos} jogando` : ''}`;
        const demais = document.getElementById('demais-label');
        if (demais) demais.style.display = ranking.length > 3 ? '' : 'none';
      });
    }
  }

  showSlide(slideIdx);
  const interval = setInterval(() => {
    slideIdx = (slideIdx + 1) % slides.length;
    showSlide(slideIdx);
  }, 30000);

  window.addEventListener("beforeunload", () => {
    clearInterval(interval);
    if (currentUnsub) currentUnsub();
  });
}

// ══════════════════════════════════════════════════════════════
// FUNÇÕES COMPARTILHADAS (pódio / lista)
// ══════════════════════════════════════════════════════════════
function renderPodiumHTML(top3) {
  const order   = [1, 0, 2];
  const classes = ['p2', 'p1', 'p3'];
  const medals  = ['🥇', '🥈', '🥉'];
  const isPlus  = modoAtivo === 'competicao_plus';
  return order.map((ri, vi) => {
    const r   = top3[ri];
    const cls = classes[vi];
    return `<div class="pod-col" id="pod-col-${ri}">
      <div class="pod-medal">${r ? medals[ri] : ''}</div>
      <div class="pod-step ${cls}">
        ${r ? `
          <div class="pod-nome">${r.aluno}</div>
          <div class="pod-turma">Turma ${r.turma}</div>
          <div class="pod-pts">${r.melhorPts} pts</div>
          <div class="pod-extras">
            ${r.ativo ? `<span class="pod-ativo">⚡ jogando</span>` : ''}
            ${isPlus
              ? `${r.acertosRapidos > 0 ? `<span class="pod-rapid">⚡${r.acertosRapidos}</span>` : ''}
                 ${r.acertosDificeis > 0 ? `<span class="pod-dif">🏆${r.acertosDificeis}</span>` : ''}
                 <span class="pod-tent">${r.tentativas} sess.</span>`
              : `${r.comboMax > 1 ? `<span class="pod-combo">🔥×${r.comboMax}</span>` : ''}
                 <span class="pod-tent">${r.tentativas} tent.</span>`}
          </div>` : `<div class="pod-empty">—</div>`}
      </div>
    </div>`;
  }).join('');
}

function atualizarPodio(top3) {
  const order  = [1, 0, 2];
  const medals = ['🥇', '🥈', '🥉'];
  const isPlus = modoAtivo === 'competicao_plus';
  order.forEach((ri, vi) => {
    const col = document.getElementById(`pod-col-${ri}`);
    if (!col) return;
    const r        = top3[ri];
    const medalDiv = col.querySelector('.pod-medal');
    const stepDiv  = col.querySelector('.pod-step');
    if (medalDiv) medalDiv.textContent = r ? medals[ri] : '';
    if (!stepDiv) return;
    if (!r) { stepDiv.innerHTML = '<div class="pod-empty">—</div>'; return; }
    stepDiv.innerHTML = `
      <div class="pod-nome">${r.aluno}</div>
      <div class="pod-turma">Turma ${r.turma}</div>
      <div class="pod-pts">${r.melhorPts} pts</div>
      <div class="pod-extras">
        ${r.ativo ? `<span class="pod-ativo">⚡ jogando</span>` : ''}
        ${isPlus
          ? `${r.acertosRapidos > 0 ? `<span class="pod-rapid">⚡${r.acertosRapidos}</span>` : ''}
             ${r.acertosDificeis > 0 ? `<span class="pod-dif">🏆${r.acertosDificeis}</span>` : ''}
             <span class="pod-tent">${r.tentativas} sess.</span>`
          : `${r.comboMax > 1 ? `<span class="pod-combo">🔥×${r.comboMax}</span>` : ''}
             <span class="pod-tent">${r.tentativas} tent.</span>`}
      </div>`;
  });
}

function atualizarLista(resto) {
  const list = document.getElementById("rank-list");
  if (!list) return;
  if (!resto.length) { list.innerHTML = ''; return; }
  const isPlus = modoAtivo === 'competicao_plus';
  list.innerHTML = resto.map((r, i) => {
    const pos = i + 4;
    const metaPlus = `
      ${r.ativo ? `<span class="rk-tag-ativo">⚡ jogando</span>` : ''}
      ${r.acertosRapidos > 0 ? `<span class="rk-rapid">⚡${r.acertosRapidos} veloz</span>` : ''}
      ${r.acertosDificeis > 0 ? `<span class="rk-dif">🏆${r.acertosDificeis} bônus</span>` : ''}
      <span>${r.tentativas} sess.</span>`;
    const metaComp = `
      <span>Turma ${r.turma}</span>
      ${r.ativo ? `<span class="rk-tag-ativo">⚡ ao vivo</span>` : ''}
      ${r.comboMax > 1 ? `<span class="rk-combo">🔥×${r.comboMax}</span>` : ''}
      <span>${r.tentativas} tentativa${r.tentativas !== 1 ? 's' : ''}</span>`;
    return `<div class="rk-row${r.ativo ? ' ativo-now' : ''}">
      <div class="rk-num">${pos}</div>
      <div>
        <div class="rk-nome">${r.aluno}${isPlus ? '' : ` — T${r.turma}`}</div>
        <div class="rk-meta">${isPlus ? metaPlus : metaComp}</div>
      </div>
      <div class="rk-pts">${r.melhorPts}</div>
    </div>`;
  }).join('');
}
</script>
