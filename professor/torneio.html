<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🏆 Torneio — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    /* ── Turmas checkboxes ── */
    .turmas-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
    .turma-chk{display:none;}
    .turma-lbl{padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-size:12px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .15s;user-select:none;}
    .turma-chk:checked+.turma-lbl{border-color:var(--blue);background:var(--blue);color:#fff;}
    /* ── Operações ── */
    .ops-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
    .ops-radio{display:none;}
    .ops-lbl{padding:7px 16px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg);font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .15s;}
    .ops-radio:checked+.ops-lbl{border-color:var(--orange);background:var(--orange-pale);color:var(--orange);}
    /* ── Stepper ── */
    .stepper{display:inline-flex;align-items:center;gap:4px;}
    .stp-btn{width:30px;height:30px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;transition:all .12s;}
    .stp-btn:hover{border-color:var(--blue);color:var(--blue);}
    .stp-val{min-width:60px;text-align:center;font-weight:700;font-size:14px;color:var(--text);}
    /* ── Torneio ativo ── */
    .torneio-ativo{border:2px solid var(--blue);border-radius:var(--radius);background:linear-gradient(135deg,var(--blue-pale),transparent);padding:20px;margin-bottom:16px;}
    .torneio-timer{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--blue);text-align:center;letter-spacing:2px;margin:8px 0;}
    .torneio-timer.warn{color:var(--orange);}
    .torneio-timer.danger{color:var(--red);}
    .torneio-timer.pausado{color:var(--text-muted);}
    .status-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
    .status-liberada{background:rgba(34,197,94,.12);color:var(--green);}
    .status-iniciado{background:rgba(47,158,220,.12);color:var(--blue);}
    .status-pausado{background:rgba(245,158,11,.12);color:var(--gold);}
    .status-encerrado{background:rgba(107,114,128,.1);color:var(--text-muted);}
    .participantes-count{text-align:center;font-size:28px;font-weight:800;color:var(--text);}
    .participantes-label{text-align:center;font-size:12px;color:var(--text-muted);margin-top:2px;}
    .ctrl-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px;}
    /* ── Ranking ── */
    .rank-row{display:grid;grid-template-columns:32px 1fr 60px 60px 60px;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;}
    .rank-row:last-child{border-bottom:none;}
    .rank-pos{font-weight:800;text-align:center;font-size:15px;}
    .rank-1{color:var(--gold);}
    .rank-2{color:#9CA3AF;}
    .rank-3{color:#CD853F;}
    .rank-nome{font-weight:600;}
    .rank-turma{font-size:11px;color:var(--text-muted);}
    .rank-pts{text-align:right;font-weight:700;color:var(--blue);}
    /* ── Histórico ── */
    .hist-card{border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:10px;}
    .hist-header{padding:12px 16px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:10px;}
    .hist-body{padding:14px 16px;border-top:1px solid var(--border);display:none;}
    .hist-body.open{display:block;}
    /* ── Form ── */
    .form-field{margin-bottom:14px;}
    .form-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:5px;display:block;}
    .form-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);transition:border .15s;}
    .form-input:focus{outline:none;border-color:var(--blue);}
    /* ── Global ranking table ── */
    .grank-row{display:grid;grid-template-columns:28px 1fr 55px 55px 70px 60px;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;}
    .grank-header{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);background:var(--bg);}
    @media(max-width:560px){
      .rank-row{grid-template-columns:28px 1fr 50px 50px;}
      .grank-row{grid-template-columns:24px 1fr 44px 44px 56px;}
    }
    /* ── Tipo de torneio ── */
    .tipo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;}
    @media(max-width:480px){.tipo-grid{grid-template-columns:repeat(2,1fr);}}
    .tipo-card{padding:12px 8px;border-radius:10px;border:2px solid var(--border);background:var(--bg);cursor:pointer;transition:all .15s;text-align:center;user-select:none;}
    .tipo-card:hover{border-color:var(--blue);background:var(--blue-pale);}
    .tipo-card.sel{border-color:var(--blue);background:var(--blue-pale);box-shadow:0 0 0 3px rgba(47,158,220,.15);}
    .tipo-card-icon{font-size:22px;line-height:1.1;margin-bottom:4px;}
    .tipo-card-nome{font-size:11px;font-weight:700;line-height:1.3;}
    /* ── Ajustes ── */
    .ajustes-panel{border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin-top:10px;}
    .ajustes-tgl{padding:9px 14px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:600;background:var(--bg);user-select:none;}
    .ajustes-tgl:hover{background:rgba(0,0,0,.035);}
    .ajustes-body{padding:12px 14px;border-top:1px solid var(--border);}
    /* ── Preview ── */
    .preview-box{margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:8px;border:1.5px dashed var(--border);}
    .preview-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:6px;}
    .preview-pairs{display:flex;gap:6px;flex-wrap:wrap;}
    .preview-par{padding:5px 10px;background:var(--card);border-radius:7px;border:1px solid var(--border);font-size:12px;font-weight:600;}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">🏆 Torneio</div>
        <div class="topbar-sub">Criar, controlar e acompanhar torneios em tempo real</div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-ghost btn-sm" onclick="loadData()">
          <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          Atualizar
        </button>
      </div>
    </div>
    <div class="content" id="content">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div>
    </div>
  </div>
</div>

<script type="module">
import { requireProfessor, renderSidebarProfessor, clearSession } from "/js/auth.js";
import { ALUNOS_POR_TURMA } from "/js/constants.js";
import { db } from "/js/firebase-config.js";
import { ref, get, set, update, push, remove, onValue, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

requireProfessor();
renderSidebarProfessor("sidebar", "torneio");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

// ── Constantes ───────────────────────────────────────────────
const TURMAS = Object.keys(ALUNOS_POR_TURMA);

// ── Estado local ─────────────────────────────────────────────
let _timerInterval   = null;
let _liveUnsub       = null;
let _torneioAtivo    = null;   // { id, ...dados }
let _tempoStepper    = 5;      // minutos
let _tiposConfig     = [];
let _selectedTipoId  = 'negativos';
let _cfgOps          = ['adicao_neg','subtracao_neg','multiplicacao_neg','divisao_neg'];
let _cfgOpMin        = -12;
let _cfgOpMax        = 12;
let _ajustesAbertos  = false;

const TIPO_ICONS = {
  negativos:'➖', tabuada_normal:'×', fracoes:'½', potencias:'²', misto:'∑', personalizado:'⚙️'
};
const OP_LABELS = {
  adicao_neg:'+ Adição (neg)', subtracao_neg:'− Subtração (neg)',
  multiplicacao_neg:'× Multiplicação (neg)', divisao_neg:'÷ Divisão (neg)',
  adicao:'+ Adição', subtracao:'− Subtração',
  multiplicacao:'× Multiplicação', divisao:'÷ Divisão',
  adicao_fracao:'+ Frações', subtracao_fracao:'− Frações',
  potencia:'² Potências', raiz:'√ Raízes',
};

// ── Helpers ──────────────────────────────────────────────────
function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtTs(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtSecs(s) {
  if (s < 0) s = 0;
  const m = Math.floor(s / 60), ss = s % 60;
  return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}
function turmasBadges(turmas) {
  return (turmas||[]).map(t => `<span class="badge badge-blue" style="font-size:10px">${t}</span>`).join(' ');
}
function opsLabel(o) {
  return o === 'negativos' ? '➖ Negativos' : o === 'misto' ? '🔀 Misto' : '⚙️ Personalizado';
}

// ── Firebase refs ────────────────────────────────────────────
const torneiosRef = ref(db, 'torneios');

// ── Load ─────────────────────────────────────────────────────
window.loadData = async function() {
  _pararLive();
  document.getElementById('content').innerHTML =
    `<div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div>`;

  const snap = await get(torneiosRef).catch(() => null);
  const todos = [];
  if (snap?.exists()) snap.forEach(c => todos.push({ id: c.key, ...c.val() }));
  todos.sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));

  const ativo = todos.find(t => t.status === 'liberada' || t.status === 'iniciado' || t.status === 'pausado');
  _torneioAtivo = ativo || null;

  const historico = todos.filter(t => t.status === 'encerrado');

  _renderPage(ativo, historico);
  if (ativo) _iniciarLive(ativo.id);
};

// ── Render principal ─────────────────────────────────────────
function _renderPage(ativo, historico) {
  const conteudo = document.getElementById('content');
  conteudo.innerHTML = `
    ${ativo ? _htmlAtivo(ativo) : ''}
    ${_htmlFormCriar(ativo)}
    ${_htmlHistorico(historico)}
  `;

  // Bind stepper
  document.getElementById('stp-minus')?.addEventListener('click', () => { _tempoStepper = Math.max(1, _tempoStepper - 1); _atualizarStepper(); });
  document.getElementById('stp-plus' )?.addEventListener('click', () => { _tempoStepper = Math.min(30, _tempoStepper + 1); _atualizarStepper(); });

  if (ativo) _iniciarTimerLocal();
}

// ── Seção 1: Formulário criar torneio ────────────────────────
function _htmlFormCriar(ativo) {
  if (ativo) return '';
  const turmasChk = TURMAS.map(t => `
    <input type="checkbox" id="chk-${t}" class="turma-chk" name="turma" value="${t}">
    <label for="chk-${t}" class="turma-lbl">${t}</label>`).join('');

  const tipoGrid = _tiposConfig.length
    ? `<div class="tipo-grid">
        ${_tiposConfig.map(t => `
          <div class="tipo-card${t.id===_selectedTipoId?' sel':''}" data-id="${t.id}" onclick="selecionarTipo('${t.id}')">
            <div class="tipo-card-icon">${TIPO_ICONS[t.id]||'🎯'}</div>
            <div class="tipo-card-nome">${escH(t.nome)}</div>
          </div>`).join('')}
      </div>`
    : '<p style="color:var(--text-muted);font-size:12px;margin-top:6px">Carregando tipos…</p>';

  return `
    <div class="card" style="margin-bottom:16px">
      <div class="card-header"><div class="card-title">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        Criar novo torneio
      </div></div>

      <div class="form-field">
        <label class="form-label">Nome do torneio</label>
        <input type="text" id="inp-nome" class="form-input" placeholder="Ex: Torneio 1 — Números Negativos" value="Torneio 1 — Operações com Números Negativos" maxlength="80">
      </div>

      <div class="form-field">
        <label class="form-label">Turmas participantes</label>
        <div class="turmas-grid">${turmasChk}</div>
      </div>

      <div class="form-field">
        <label class="form-label">Tempo de duração</label>
        <div class="stepper">
          <button class="stp-btn" id="stp-minus">−</button>
          <span class="stp-val" id="stp-display">${_tempoStepper} min</span>
          <button class="stp-btn" id="stp-plus">+</button>
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">Tipo de torneio</label>
        ${tipoGrid}
        <div id="tipo-details">${_htmlTipoDetails()}</div>
      </div>

      <p id="form-erro" style="color:var(--red);font-size:12px;margin-bottom:8px;display:none"></p>
      <button class="btn btn-blue" onclick="liberarTorneio()" style="width:100%;justify-content:center;padding:12px">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M18 11v-1c0-2.21-1.79-4-4-4s-4 1.79-4 4v1H8v9h8v-9h-2zm-6-1c0-1.1.9-2 2-2s2 .9 2 2v1h-4v-1zm4 8.5c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5.67-1.5 1.5-1.5 1.5.67 1.5 1.5z"/></svg>
        📢 Liberar torneio
      </button>
    </div>`;
}

function _atualizarStepper() {
  const el = document.getElementById('stp-display');
  if (el) el.textContent = `${_tempoStepper} min`;
}

// ── Tipo details: descrição + ajustes + preview ───────────────
function _htmlTipoDetails() {
  const tipo = _tiposConfig.find(t => t.id === _selectedTipoId);
  if (!tipo) return '';

  const descHtml = tipo.descricao
    ? `<div style="font-size:12px;color:var(--text-muted);margin-top:6px">${escH(tipo.descricao)}</div>` : '';

  // Operações disponíveis para ajuste
  const opsDisp = tipo.id === 'personalizado' ? Object.keys(OP_LABELS) : (tipo.operacoes || []);
  const opsHtml = opsDisp.map(op => `
    <label style="display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;padding:2px 0">
      <input type="checkbox" value="${op}" ${_cfgOps.includes(op)?'checked':''}
        onchange="toggleOp('${op}')">
      ${escH(OP_LABELS[op]||op)}
    </label>`).join('');

  const ajusteBody = _ajustesAbertos ? `
    <div class="ajustes-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
        <div>
          <label class="form-label">Operandos mín</label>
          <input type="number" value="${_cfgOpMin}" id="inp-op-min" class="form-input"
            style="font-size:13px;padding:7px 10px" oninput="updateOpRange()">
        </div>
        <div>
          <label class="form-label">Operandos máx</label>
          <input type="number" value="${_cfgOpMax}" id="inp-op-max" class="form-input"
            style="font-size:13px;padding:7px 10px" oninput="updateOpRange()">
        </div>
      </div>
      <div class="form-label" style="margin-bottom:5px">Operações incluídas</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px 20px">${opsHtml}</div>
    </div>` : '';

  return `
    ${descHtml}
    <div class="ajustes-panel">
      <div class="ajustes-tgl" onclick="toggleAjustes()">
        ⚙ Ajustar configurações
        <span style="margin-left:auto;font-size:11px">${_ajustesAbertos?'▲':'▼'}</span>
      </div>
      ${ajusteBody}
    </div>
    <div id="tipo-preview">${_htmlPreview()}</div>`;
}

function _htmlPreview() {
  const pares = _gerarPreviewPares();
  if (!pares.length) return '';
  return `<div class="preview-box">
    <div class="preview-lbl">Preview das operações</div>
    <div class="preview-pairs">
      ${pares.map(p => `<span class="preview-par">${escH(p.expr)} = ${escH(p.resultStr??String(p.result))}</span>`).join('')}
    </div>
  </div>`;
}

function _gerarPreviewPares() {
  // Usa exemplos estáticos se sem operações configuradas
  if (!_cfgOps.length) {
    const tipo = _tiposConfig.find(t => t.id === _selectedTipoId);
    return (tipo?.exemplos||[]).slice(0,3).map(e => {
      const [expr, res] = e.split('=').map(s => s.trim());
      return { expr: expr||e, result: 0, resultStr: res||'' };
    });
  }
  const ri_  = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
  const rNZ_ = (a,b) => { let n; do { n=ri_(a,b); } while(n===0); return n; };
  const fN_  = n => n<0?`(${n})`:String(n);
  const gcd_ = (a,b) => { a=Math.abs(a);b=Math.abs(b); while(b){let t=b;b=a%b;a=t;} return a||1; };
  const simplFrac_ = (n,d) => { const g=gcd_(n,d);return[n/g,d/g]; };
  const fracStr_   = (n,d) => d===1?String(n):`${n}/${d}`;
  const DENS = [2,3,4,6,8,12];
  const MIN=_cfgOpMin, MAX=_cfgOpMax;
  const pares=[]; const usedR=new Set();
  for (let att=0; pares.length<3 && att<90; att++) {
    const op = _cfgOps[Math.floor(Math.random()*_cfgOps.length)];
    let p=null;
    switch(op){
      case 'adicao':case 'adicao_neg':{const a=ri_(MIN,MAX),b=ri_(MIN,MAX);p={expr:`${fN_(a)} + ${fN_(b)}`,result:a+b};break;}
      case 'subtracao':case 'subtracao_neg':{const a=ri_(MIN,MAX),b=ri_(MIN,MAX);p={expr:`${fN_(a)} − ${fN_(b)}`,result:a-b};break;}
      case 'multiplicacao':case 'multiplicacao_neg':{const a=rNZ_(MIN,MAX),b=rNZ_(MIN,MAX);p={expr:`${fN_(a)} × ${fN_(b)}`,result:a*b};break;}
      case 'divisao':case 'divisao_neg':{const b=rNZ_(MIN,MAX),r=rNZ_(MIN,MAX);p={expr:`${fN_(b*r)} ÷ ${fN_(b)}`,result:r};break;}
      case 'potencia':{const base=ri_(Math.max(1,MIN),Math.min(12,MAX));p={expr:`${base}²`,result:base*base};break;}
      case 'raiz':{const r=ri_(Math.max(1,MIN),Math.min(12,MAX));p={expr:`√${r*r}`,result:r};break;}
      case 'adicao_fracao':case 'subtracao_fracao':{
        const d1=DENS[ri_(0,DENS.length-1)],d2=DENS[ri_(0,DENS.length-1)];
        const n1=ri_(1,d1-1),n2=ri_(1,d2-1);
        const lcm=d1*d2/gcd_(d1,d2);
        const sign=op==='adicao_fracao'?1:-1;
        const rn=n1*(lcm/d1)+sign*n2*(lcm/d2);
        if(rn>0){const[srn,srd]=simplFrac_(rn,lcm);const[sn1,sd1]=simplFrac_(n1,d1);const[sn2,sd2]=simplFrac_(n2,d2);
          p={expr:`${fracStr_(sn1,sd1)} ${op==='adicao_fracao'?'+':'−'} ${fracStr_(sn2,sd2)}`,result:srn/srd,resultStr:fracStr_(srn,srd)};}
        break;}
    }
    if(p&&!usedR.has(p.result)){usedR.add(p.result);pares.push(p);}
  }
  return pares;
}

// ── Ações de seleção de tipo ──────────────────────────────────
window.selecionarTipo = function(id) {
  _selectedTipoId = id;
  _ajustesAbertos = false;
  const tipo = _tiposConfig.find(t => t.id === id);
  if (tipo) {
    _cfgOps   = [...(tipo.operacoes||[])];
    _cfgOpMin = tipo.operandos_min ?? -12;
    _cfgOpMax = tipo.operandos_max ?? 12;
  }
  document.querySelectorAll('.tipo-card').forEach(c => c.classList.remove('sel'));
  document.querySelector(`.tipo-card[data-id="${id}"]`)?.classList.add('sel');
  const det = document.getElementById('tipo-details');
  if (det) det.innerHTML = _htmlTipoDetails();
};

window.toggleAjustes = function() {
  _ajustesAbertos = !_ajustesAbertos;
  const det = document.getElementById('tipo-details');
  if (det) det.innerHTML = _htmlTipoDetails();
};

window.toggleOp = function(op) {
  const idx = _cfgOps.indexOf(op);
  if (idx >= 0) _cfgOps.splice(idx, 1); else _cfgOps.push(op);
  const pv = document.getElementById('tipo-preview');
  if (pv) pv.innerHTML = _htmlPreview();
};

window.updateOpRange = function() {
  const minEl = document.getElementById('inp-op-min');
  const maxEl = document.getElementById('inp-op-max');
  if (minEl) _cfgOpMin = parseInt(minEl.value) || _cfgOpMin;
  if (maxEl) _cfgOpMax = parseInt(maxEl.value) || _cfgOpMax;
  const pv = document.getElementById('tipo-preview');
  if (pv) pv.innerHTML = _htmlPreview();
};

// ── Seção 2: Torneio ativo ───────────────────────────────────

// ── Ações ─────────────────────────────────────────────────────
window.liberarTorneio = async function() {
  const nome   = document.getElementById('inp-nome')?.value.trim();
  const turmas = [...document.querySelectorAll('.turma-chk:checked')].map(c => c.value);
  const erro   = document.getElementById('form-erro');

  if (!nome)          { _showErro('Digite o nome do torneio.'); return; }
  if (!turmas.length) { _showErro('Selecione ao menos uma turma.'); return; }
  if (!_cfgOps.length){ _showErro('Selecione ao menos uma operação nas configurações.'); return; }

  erro.style.display = 'none';

  const tipo = _tiposConfig.find(t => t.id === _selectedTipoId);
  const config = {
    tipo: _selectedTipoId,
    tipo_nome: tipo?.nome || _selectedTipoId,
    operacoes: [..._cfgOps],
    operandos_min: _cfgOpMin,
    operandos_max: _cfgOpMax,
    resultado_min: tipo?.resultado_min ?? -9999,
    resultado_max: tipo?.resultado_max ?? 9999,
  };

  const dados = {
    nome,
    turmas,
    tempo_segundos: _tempoStepper * 60,
    operacoes: _selectedTipoId,  // mantido para compatibilidade com opsLabel()
    config,
    status: 'liberada',
    inicio: null,
    pausa_inicio: null,
    pausa_total_ms: 0,
    num_participantes: 0,
    criadoEm: Date.now(),
  };
  await push(torneiosRef, dados);
  loadData();
};

window.iniciarTorneio = async function(id) {
  await update(ref(db, `torneios/${id}`), { status: 'iniciado', inicio: Date.now() });
  _torneioAtivo = { ..._torneioAtivo, status: 'iniciado', inicio: Date.now() };
  _renderAtivoStatus(_torneioAtivo);
  _iniciarTimerLocal();
};

window.pausarTorneio = async function(id) {
  await update(ref(db, `torneios/${id}`), { status: 'pausado', pausa_inicio: Date.now() });
  clearInterval(_timerInterval); _timerInterval = null;
  const timer = document.getElementById('torneio-timer');
  if (timer) timer.className = 'torneio-timer pausado';
  _renderAtivoStatus({ ..._torneioAtivo, status: 'pausado' });
};

window.retomarTorneio = async function(id) {
  const agora = Date.now();
  const pausaMs = _torneioAtivo?.pausa_inicio ? agora - _torneioAtivo.pausa_inicio : 0;
  const novaPausaTotal = (_torneioAtivo?.pausa_total_ms || 0) + pausaMs;
  await update(ref(db, `torneios/${id}`), { status: 'iniciado', pausa_inicio: null, pausa_total_ms: novaPausaTotal });
  _torneioAtivo = { ..._torneioAtivo, status: 'iniciado', pausa_inicio: null, pausa_total_ms: novaPausaTotal };
  _renderAtivoStatus(_torneioAtivo);
  _iniciarTimerLocal();
};

window.encerrarTorneio = async function(id) {
  if (!confirm('Encerrar o torneio agora? Isso finaliza para todos os alunos.')) return;
  clearInterval(_timerInterval); _timerInterval = null;
  _pararLive();

  // Determinar vencedor (maior pontuação nas sessoes)
  let vencedor_nome = null, vencedor_turma = null, vencedor_pts = -1;
  const sessSnap = await get(ref(db, `torneios/${id}/sessoes`)).catch(() => null);
  if (sessSnap?.exists()) {
    sessSnap.forEach(c => {
      const s = c.val();
      if ((s.pontuacao || 0) > vencedor_pts) {
        vencedor_pts = s.pontuacao || 0;
        vencedor_nome = s.aluno;
        vencedor_turma = s.turma;
      }
    });
  }
  await update(ref(db, `torneios/${id}`), {
    status: 'encerrado',
    encerrado_em: Date.now(),
    vencedor_nome,
    vencedor_turma,
    vencedor_pts,
  });
  loadData();
};

// ── Timer local ───────────────────────────────────────────────
function _iniciarTimerLocal() {
  clearInterval(_timerInterval);
  _timerInterval = setInterval(() => {
    if (!_torneioAtivo || _torneioAtivo.status !== 'iniciado') return;
    const elapsed   = Date.now() - (_torneioAtivo.inicio || Date.now()) - (_torneioAtivo.pausa_total_ms || 0);
    const restante  = Math.max(0, (_torneioAtivo.tempo_segundos || 300) - Math.floor(elapsed / 1000));
    const timerEl   = document.getElementById('torneio-timer');
    if (timerEl) {
      timerEl.textContent = fmtSecs(restante);
      timerEl.className   = 'torneio-timer' + (restante <= 30 ? ' danger' : restante <= 60 ? ' warn' : '');
    }
    if (restante <= 0) {
      clearInterval(_timerInterval); _timerInterval = null;
      encerrarTorneio(_torneioAtivo.id);
    }
  }, 1000);
}

// ── Live listener (participantes + ranking) ───────────────────
function _iniciarLive(torneioId) {
  _pararLive();
  _liveUnsub = onValue(ref(db, `torneios/${torneioId}/sessoes`), snap => {
    const sess = [];
    if (snap?.exists()) snap.forEach(c => sess.push({ uid: c.key, ...c.val() }));
    const countEl = document.getElementById('part-count');
    if (countEl) countEl.textContent = sess.length;
    _renderRankingLive(sess);
  });
}

function _pararLive() {
  if (_liveUnsub) { _liveUnsub(); _liveUnsub = null; }
  clearInterval(_timerInterval); _timerInterval = null;
}

function _renderRankingLive(sess) {
  const el = document.getElementById('ranking-live');
  if (!el || !sess.length) return;
  const sorted = [...sess].sort((a, b) => (b.pontuacao || 0) - (a.pontuacao || 0)).slice(0, 10);
  const medals = ['🥇','🥈','🥉'];
  const rows = sorted.map((s, i) => `
    <div class="rank-row">
      <span class="rank-pos ${i<3?'rank-'+(i+1):''}">${medals[i]||i+1}</span>
      <div><div class="rank-nome">${escH(s.aluno||'—')}</div><div class="rank-turma">${escH(s.turma||'')}</div></div>
      <span class="rank-pts" style="grid-column:3/6">${s.pontuacao||0} pts</span>
    </div>`).join('');
  el.innerHTML = `
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin-bottom:4px">Ranking ao vivo</div>
    <div style="border:1px solid var(--border);border-radius:9px;overflow:hidden">${rows}</div>`;
}

// ── Render botões ativo ───────────────────────────────────────
function _renderAtivoStatus(t) {
  const wrap = document.querySelector('.torneio-ativo');
  if (!wrap) return;
  const statusCls = `status-${t.status}`;
  const statusTxt = t.status === 'iniciado' ? '▶ Em andamento'
    : t.status === 'pausado' ? '⏸ Pausado' : '⏳ Aguardando início';
  wrap.querySelector(`.status-badge`).className = `status-badge ${statusCls}`;
  wrap.querySelector(`.status-badge`).textContent = statusTxt;

  const ctrls = wrap.querySelector('.ctrl-btns');
  if (ctrls) {
    ctrls.innerHTML = `
      ${t.status === 'liberada' ? `<button class="btn btn-blue" onclick="iniciarTorneio('${t.id}')">▶ Iniciar agora</button>` : ''}
      ${t.status === 'iniciado' ? `<button class="btn" style="background:var(--gold);color:#fff;border:none" onclick="pausarTorneio('${t.id}')">⏸ Pausar</button>` : ''}
      ${t.status === 'pausado'  ? `<button class="btn btn-blue" onclick="retomarTorneio('${t.id}')">▶ Retomar</button>` : ''}
      <button class="btn" style="background:var(--red);color:#fff;border:none" onclick="encerrarTorneio('${t.id}')">⏹ Encerrar</button>
      <a href="/professor/torneio_tv.html?id=${t.id}" target="_blank" class="btn btn-ghost">🖥️ Tela da TV →</a>`;
  }
}

// ── Histórico: toggle + carregar ranking ──────────────────────
const _rankCache = {};

window.toggleHist = async function(bodyId) {
  const body  = document.getElementById(bodyId);
  const torneioId = bodyId.replace('hist-', '');   // índice local, não o ID Firebase
  if (!body) return;
  const isOpen = body.classList.toggle('open');
  const chevIdx = bodyId.split('-')[1];
  const chev = document.getElementById(`chev-hist-${chevIdx}`);
  if (chev) chev.textContent = isOpen ? '▲' : '▼';
  if (!isOpen) return;

  // Buscar torneio pelo índice
  const histCards = document.querySelectorAll('.hist-card');
  const idx = Array.from(histCards).findIndex(c => c.querySelector(`#${bodyId}`));
  if (idx < 0) return;
  const snap = await get(torneiosRef).catch(() => null);
  const todos = [];
  if (snap?.exists()) snap.forEach(c => todos.push({ id: c.key, ...c.val() }));
  const encerrados = todos.filter(t => t.status === 'encerrado').sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0));
  const t = encerrados[idx];
  if (!t) return;

  const rankEl = document.getElementById(`hist-rank-${t.id}`);
  if (!rankEl) return;
  if (_rankCache[t.id]) { rankEl.innerHTML = _rankCache[t.id]; return; }

  const sessSnap = await get(ref(db, `torneios/${t.id}/sessoes`)).catch(() => null);
  const sess = [];
  if (sessSnap?.exists()) sessSnap.forEach(c => sess.push({ uid: c.key, ...c.val() }));
  if (!sess.length) { rankEl.innerHTML = '<span style="color:var(--text-muted)">Nenhum participante registrado.</span>'; return; }
  sess.sort((a, b) => (b.pontuacao || 0) - (a.pontuacao || 0));
  const medals = ['🥇','🥈','🥉'];
  const html = `<div style="border:1px solid var(--border);border-radius:9px;overflow:hidden">
    <div class="rank-row" style="background:var(--bg);font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text-muted)">
      <span>#</span><span>Aluno</span><span style="text-align:right">Pts</span><span style="text-align:right">✅</span><span style="text-align:right">❌</span>
    </div>
    ${sess.map((s,i)=>`<div class="rank-row">
      <span class="rank-pos ${i<3?'rank-'+(i+1):''}">${medals[i]||i+1}</span>
      <div><div class="rank-nome">${escH(s.aluno||'—')}</div><div class="rank-turma">${escH(s.turma||'')}</div></div>
      <span class="rank-pts">${s.pontuacao||0}</span>
      <span style="text-align:right;color:var(--green)">${s.acertos||0}</span>
      <span style="text-align:right;color:var(--red)">${s.erros||0}</span>
    </div>`).join('')}
  </div>`;
  _rankCache[t.id] = html;
  rankEl.innerHTML = html;

  // Atualizar ranking global
  _sessCache[t.id] = sess;
  renderRankGlobal();
};

// ── Ranking global ────────────────────────────────────────────
const _sessCache = {};

window.renderRankGlobal = function() {
  const el = document.getElementById('rank-global-body');
  if (!el) return;
  const filtroTurma = document.getElementById('filtro-turma-grank')?.value || '';
  const porAluno = {};
  for (const [tid, sess] of Object.entries(_sessCache)) {
    const sorted = [...sess].sort((a,b)=>(b.pontuacao||0)-(a.pontuacao||0));
    sess.forEach((s,i) => {
      const k = `${s.aluno}|||${s.turma}`;
      if (!porAluno[k]) porAluno[k] = { aluno: s.aluno, turma: s.turma, torneios: 0, vitorias: 0, melhor: 0, totalPts: 0 };
      porAluno[k].torneios++;
      if (i === 0) porAluno[k].vitorias++;
      if ((s.pontuacao||0) > porAluno[k].melhor) porAluno[k].melhor = s.pontuacao||0;
      porAluno[k].totalPts += s.pontuacao||0;
    });
  }
  let lista = Object.values(porAluno);
  if (filtroTurma) lista = lista.filter(a => a.turma === filtroTurma);
  lista.sort((a,b) => b.vitorias - a.vitorias || b.melhor - a.melhor);
  if (!lista.length) { el.innerHTML = '<span style="color:var(--text-muted)">Abra torneios do histórico para ver o ranking.</span>'; return; }
  el.innerHTML = `<div style="border:1px solid var(--border);border-radius:9px;overflow:hidden">
    <div class="grank-row grank-header">
      <span>#</span><span>Aluno</span><span style="text-align:right">Torneios</span><span style="text-align:right">Vitórias</span><span style="text-align:right">Melhor pts</span><span style="text-align:right">Média</span>
    </div>
    ${lista.map((a,i)=>`<div class="grank-row" style="${i%2?'background:rgba(0,0,0,.018)':''}">
      <span style="font-weight:700;text-align:center;color:${i===0?'var(--gold)':i===1?'#9CA3AF':i===2?'#CD853F':'var(--text-muted)'}">${i+1}</span>
      <div><div style="font-weight:600;font-size:13px">${escH(a.aluno)}</div><div style="font-size:11px;color:var(--text-muted)">${escH(a.turma)}</div></div>
      <span style="text-align:right">${a.torneios}</span>
      <span style="text-align:right;font-weight:700;color:var(--gold)">${a.vitorias}</span>
      <span style="text-align:right;color:var(--blue);font-weight:600">${a.melhor}</span>
      <span style="text-align:right">${a.torneios > 0 ? Math.round(a.totalPts/a.torneios) : 0}</span>
    </div>`).join('')}
  </div>`;
};

// ── Exportar CSV ──────────────────────────────────────────────
window.exportarCSV = async function(torneioId, nomeArquivo) {
  let sess = _rankCache[torneioId] ? _sessCache[torneioId] : null;
  if (!sess) {
    const snap = await get(ref(db, `torneios/${torneioId}/sessoes`)).catch(() => null);
    sess = [];
    if (snap?.exists()) snap.forEach(c => sess.push({ uid: c.key, ...c.val() }));
    sess.sort((a,b)=>(b.pontuacao||0)-(a.pontuacao||0));
  }
  const linhas = [['Pos','Aluno','Turma','Pontuação','Acertos','Erros','Concluído']];
  sess.forEach((s,i) => linhas.push([i+1, s.aluno||'', s.turma||'', s.pontuacao||0, s.acertos||0, s.erros||0, s.concluido?'Sim':'Não']));
  _downloadCSV(linhas, `torneio_${nomeArquivo}_ranking.csv`);
};

window.exportarRankingGlobal = function() {

    const sorted = [...sess].sort((a,b)=>(b.pontuacao||0)-(a.pontuacao||0));
    sess.forEach((s,i) => {
      const k = `${s.aluno}|||${s.turma}`;
      if (!porAluno[k]) porAluno[k] = { aluno: s.aluno, turma: s.turma, torneios: 0, vitorias: 0, melhor: 0, totalPts: 0 };
      porAluno[k].torneios++;
      if (i === 0) porAluno[k].vitorias++;
      if ((s.pontuacao||0) > porAluno[k].melhor) porAluno[k].melhor = s.pontuacao||0;
      porAluno[k].totalPts += s.pontuacao||0;
    });
  }
  let lista = Object.values(porAluno);
  if (filtroTurma) lista = lista.filter(a => a.turma === filtroTurma);
  lista.sort((a,b) => b.vitorias-a.vitorias||b.melhor-a.melhor);
  const linhas = [['Pos','Aluno','Turma','Torneios','Vitórias','Melhor pts','Média']];
  lista.forEach((a,i) => linhas.push([i+1,a.aluno,a.turma,a.torneios,a.vitorias,a.melhor,a.torneios>0?Math.round(a.totalPts/a.torneios):0]));
  _downloadCSV(linhas, 'ranking_geral_torneios.csv');
};

function _downloadCSV(linhas, filename) {
  const csv = linhas.map(r => r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a = Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:filename});
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function _showErro(msg) {
  const el = document.getElementById('form-erro');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

// ── Init ──────────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch('/torneios_config.json');
    const d = await r.json();
    _tiposConfig = d.tipos || [];
    const prim = _tiposConfig[0];
    if (prim) {
      _selectedTipoId = prim.id;
      _cfgOps   = [...(prim.operacoes||[])];
      _cfgOpMin = prim.operandos_min ?? -12;
      _cfgOpMax = prim.operandos_max ?? 12;
    }
  } catch(e) {
    console.warn('torneios_config.json não carregado, usando fallback:', e);
    _tiposConfig = [
      { id:'negativos', nome:'Negativos', descricao:'Operações com negativos',
        operacoes:['adicao_neg','subtracao_neg','multiplicacao_neg','divisao_neg'],
        operandos_min:-12,operandos_max:12,resultado_min:-144,resultado_max:144,exemplos:['(-3)+5=2'] },
      { id:'tabuada_normal', nome:'Tabuada', descricao:'Mult. e divisão básica',
        operacoes:['multiplicacao','divisao'],operandos_min:1,operandos_max:10,
        resultado_min:1,resultado_max:100,exemplos:['3×4=12'] },
      { id:'misto', nome:'Misto', descricao:'Todas as operações básicas',
        operacoes:['adicao','subtracao','multiplicacao','divisao'],
        operandos_min:1,operandos_max:20,resultado_min:0,resultado_max:400,exemplos:['3+7=10'] },
      { id:'personalizado', nome:'Personalizado', descricao:'Configure manualmente',
        operacoes:[],operandos_min:1,operandos_max:10,resultado_min:0,resultado_max:100,exemplos:[] },
    ];
  }
  loadData();
}
init();
