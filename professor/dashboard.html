<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .top3-card{border-radius:12px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
    .top3-card:last-child{margin-bottom:0;}
    .top3-nome{font-size:12px;font-weight:800;color:#fff;line-height:1.2;}
    .top3-turma{font-size:10px;color:rgba(255,255,255,.75);margin-top:2px;}
    .top3-pts{font-size:16px;font-weight:800;color:#fff;}
    /* Online */
    .online-dot{width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block;vertical-align:middle;margin-left:4px;box-shadow:0 0 5px #22C55E;animation:pulse-dot 1.5s ease-in-out infinite;}
    @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.35)}}
    .online-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;}
    .online-modal{background:var(--card);border-radius:16px;padding:24px;min-width:280px;max-width:420px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.22);max-height:80vh;overflow-y:auto;}
    .online-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
    .online-row:last-child{border-bottom:none;}
    .stat-card-clickable{cursor:pointer;transition:transform .15s,box-shadow .15s;}
    .stat-card-clickable:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(34,197,94,.18);}
    .alerta-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;}
    .alerta-modal{background:var(--card);border-radius:16px;padding:24px;min-width:300px;max-width:500px;width:92%;box-shadow:0 8px 40px rgba(0,0,0,.22);max-height:80vh;overflow-y:auto;}
    .alerta-turma-head{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;padding:12px 0 4px;border-bottom:1px solid var(--border);margin-bottom:2px;}
    .alerta-turma-head:first-child{padding-top:0;}
    .alerta-aluno-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);}
    .alerta-aluno-row:last-child{border-bottom:none;}
    .alerta-taxa-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#FEF2F2;color:#DC2626;flex-shrink:0;}
    .alerta-list-row{cursor:pointer;}
    .alerta-list-row:hover{background:var(--hover,rgba(0,0,0,.04));border-radius:6px;}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Dashboard</div>
        <div class="topbar-sub">Visão geral do sistema</div>
      </div>
      <div class="topbar-right"><div class="avatar avatar-blue">P</div></div>
    </div>
    <div class="content" id="content">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div>
    </div>
  </div>
</div>

<!-- Modal: Alertas -->
<div id="alerta-modal-bg" class="alerta-modal-bg" style="display:none" onclick="fecharAlertaModal(event)">
  <div class="alerta-modal" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div id="alerta-modal-titulo" style="font-size:15px;font-weight:700"></div>
      <button onclick="fecharAlertaModal()" style="border:none;background:none;cursor:pointer;font-size:18px;color:var(--text-muted);line-height:1;padding:2px 6px">✕</button>
    </div>
    <div id="alerta-modal-list"></div>
  </div>
</div>

<!-- Modal: Alunos Online -->
<div id="online-modal-bg" class="online-modal-bg" style="display:none" onclick="fecharOnlineModal(event)">
  <div class="online-modal" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:15px;font-weight:700">Alunos Online Agora <span class="online-dot"></span></div>
      <button onclick="fecharOnlineModal()" style="border:none;background:none;cursor:pointer;font-size:18px;color:var(--text-muted);line-height:1;padding:2px 6px">✕</button>
    </div>
    <div id="online-modal-list"><p style="color:var(--text-muted);font-size:13px">Verificando…</p></div>
  </div>
</div>

<script type="module">
import { ALUNOS_POR_TURMA, LISTA_ATIVIDADES } from "/js/constants.js";
import { getResultados, getLiberadas, getAlertas, getAllAtividadeStatus, getDetalhes } from "/js/db.js";
import { db } from "/js/firebase-config.js";
import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { requireProfessor, renderSidebarProfessor, clearSession } from "/js/auth.js";

const sess = requireProfessor();
if (!sess) throw new Error();
renderSidebarProfessor("sidebar", "dashboard");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const [todos, liberadasRaw, alertas, statusMap] = await Promise.all([
  getResultados(), getLiberadas(), getAlertas(true), getAllAtividadeStatus()
]);

const liberadas = liberadasRaw.map(lib => {
  const st = statusMap[`${lib.turma}|${lib.atividade}`] || { status: 'ativa', percentual: lib.percentual ?? 100 };
  return { ...lib, percentual: st.percentual, status: st.status };
}).filter(lib => lib.status !== 'encerrada');

const totalAlunos = Object.values(ALUNOS_POR_TURMA).reduce((a, b) => a + b.length, 0);
const totalTurmas = Object.keys(ALUNOS_POR_TURMA).length;

const melhorDash = {};
const turmaDash  = {};
const regsPorAluno = {};
todos.filter(r => r.concluido).forEach(r => {
  if (!melhorDash[r.aluno]) melhorDash[r.aluno] = {};
  melhorDash[r.aluno][r.atividade] = Math.max(melhorDash[r.aluno][r.atividade] || 0, r.pontuacao || 0);
  if (!turmaDash[r.aluno]) turmaDash[r.aluno] = r.turma;
  if (!regsPorAluno[r.aluno]) regsPorAluno[r.aluno] = [];
  regsPorAluno[r.aluno].push(r);
});
const ptsPorAluno = Object.fromEntries(
  Object.entries(melhorDash).map(([a, m]) => [a, Object.values(m).reduce((x, y) => x + y, 0)])
);
const ultimos = [...todos].reverse().filter(r => r.concluido).slice(0, 6);

// ── Alertas automáticos ───────────────────────────────────────
const todosAlunosFlat = Object.values(ALUNOS_POR_TURMA).flat();
const semAtividade = todosAlunosFlat.filter(a => !regsPorAluno[a]);
const baixaTaxa = Object.entries(regsPorAluno).filter(([_, regs]) => {
  const ac  = regs.reduce((s, r) => s + (r.acertos || 0), 0);
  const tot = regs.reduce((s, r) => s + (r.acertos || 0) + (r.erros || 0), 0);
  return tot > 0 && ac / tot < 0.3;
});
const zeroAcertoUlt = liberadas.length ? (() => {
  const ativ = liberadas[0].atividade;
  return todos.filter(r => r.concluido && r.atividade === ativ && (r.acertos || 0) === 0 && (r.erros || 0) > 0);
})() : [];
const autoAlertas = [];
if (semAtividade.length)   autoAlertas.push({ icon: '📭', tipo: 'semAtividade', msg: `${semAtividade.length} aluno${semAtividade.length > 1 ? 's' : ''} sem nenhuma atividade` });
if (baixaTaxa.length)      autoAlertas.push({ icon: '⚠️', tipo: 'baixaTaxa',    msg: `${baixaTaxa.length} aluno${baixaTaxa.length > 1 ? 's' : ''} com taxa de acerto abaixo de 30%` });
if (zeroAcertoUlt.length)  autoAlertas.push({ icon: '🚨', tipo: 'zeroAcerto',   msg: `${zeroAcertoUlt.length} aluno${zeroAcertoUlt.length > 1 ? 's' : ''} com 0% de acerto em "${liberadas[0]?.atividade}"` });

// ── Top Alunos: cards horizontais ─────────────────────────────
function renderPodiumDash() {
  const lista = Object.entries(ptsPorAluno)
    .sort((a, b) => b[1] - a[1])
    .map(([nome, pts]) => ({ nome, pts, turma: turmaDash[nome] || '?' }));

  if (!lista.length) return '<div class="empty-state"><p>Nenhum resultado ainda.</p></div>';

  const groups = [];
  let gi = 0;
  while (gi < lista.length && groups.length < 3) {
    const pts = lista[gi].pts;
    let gj = gi + 1;
    while (gj < lista.length && lista[gj].pts === pts) gj++;
    groups.push({ pos: groups.length + 1, students: lista.slice(gi, gj), score: pts });
    gi = gj;
  }

  const TOP3_BG = [
    'linear-gradient(135deg,#F59E0B,#D97706)',
    'linear-gradient(135deg,#9CA3AF,#6B7280)',
    'linear-gradient(135deg,#CD853F,#92400E)',
  ];
  const TROPHIES = ['🥇', '🥈', '🥉'];
  const GLOWS    = ['glow-gold', 'glow-silver', 'glow-bronze'];

  return groups.map((g, i) => {
    const namesHtml = g.students.length === 1
      ? `<div><div class="top3-nome">${g.students[0].nome}</div><div class="top3-turma">Turma ${g.students[0].turma}</div></div>`
      : `<div style="display:flex;align-items:flex-start;gap:0;flex:1;min-width:0">${
          g.students.map((s, ni) => {
            const vsep = ni < g.students.length - 1
              ? `<div style="width:1px;background:rgba(255,255,255,.35);align-self:stretch;margin:0 8px;flex-shrink:0"></div>` : '';
            return `<div style="flex:1;min-width:0"><div class="top3-nome">${s.nome}</div><div class="top3-turma">T${s.turma}</div></div>${vsep}`;
          }).join('')
        }</div>`;
    return `<div class="top3-card ${GLOWS[i]}" style="background:${TOP3_BG[i]}">
      <div style="font-size:28px;flex-shrink:0">${TROPHIES[i]}</div>
      <div style="flex:1;min-width:0">${namesHtml}</div>
      <div style="text-align:right;flex-shrink:0;white-space:nowrap">
        <div class="top3-pts">${g.score}<span style="font-size:10px;font-weight:600;margin-left:2px">pts</span></div>
      </div>
    </div>`;
  }).join('');
}

// ── Renderizar página ─────────────────────────────────────────
document.getElementById("content").innerHTML = `
  <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:22px">
    <div class="stat-card" style="flex:1;min-width:140px">
      <div class="stat-icon blue"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></div>
      <div><div class="stat-value blue">${totalAlunos}</div><div class="stat-meta">Total de Alunos</div></div>
    </div>
    <div class="stat-card" style="flex:1;min-width:140px">
      <div class="stat-icon orange"><svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18V17h2v-4.82L9 13.36V17c0 1.1 1.35 2 3 2s3-.9 3-2v-3.64l2-1.09V17h2v-5.82L23 9 12 3z"/></svg></div>
      <div><div class="stat-value orange">${totalTurmas}</div><div class="stat-meta">Turmas</div></div>
    </div>
    <div class="stat-card" style="flex:1;min-width:140px">
      <div class="stat-icon green"><svg viewBox="0 0 24 24"><path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg></div>
      <div><div class="stat-value green">${todos.length}</div><div class="stat-meta">Resultados</div></div>
    </div>
    <div class="stat-card" style="flex:1;min-width:140px">
      <div class="stat-icon red"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></div>
      <div><div class="stat-value red">${alertas.length}</div><div class="stat-meta">Alertas</div></div>
    </div>
    <div class="stat-card stat-card-clickable" style="flex:1;min-width:140px;display:none" id="analise-card" onclick="window.location.href='/professor/analise.html'">
      <div class="stat-icon orange"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></div>
      <div><div class="stat-value orange" id="analise-count">0</div><div class="stat-meta">⚠️ Para verificar</div></div>
    </div>
    <div class="stat-card stat-card-clickable" style="flex:1;min-width:120px" id="online-quiz-card" onclick="window.abrirOnlineModal()">
      <div class="stat-icon green"><svg viewBox="0 0 24 24"><path d="M11 17h2v-6h-2v6zm1-15C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zM11 9h2V7h-2v2z"/></svg></div>
      <div>
        <div class="stat-value green" id="online-quiz-count">—</div>
        <div class="stat-meta">Quiz online <span class="online-dot"></span></div>
      </div>
    </div>
    <div class="stat-card stat-card-clickable" style="flex:1;min-width:120px" id="online-tabuada-card" onclick="window.abrirOnlineModal()">
      <div class="stat-icon blue"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg></div>
      <div>
        <div class="stat-value blue" id="online-tabuada-count">—</div>
        <div class="stat-meta">Tabuada online <span class="online-dot" style="background:var(--blue)"></span></div>
      </div>
    </div>
  </div>

  <div class="grid-2">
    <div>
      <div class="card">
        <div class="card-header">
          <div class="card-title"><svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>Atividades Liberadas</div>
          <a href="/professor/atividades.html" class="btn btn-sm btn-blue">Liberar atividade</a>
        </div>
        ${liberadas.length ? liberadas.map(lib => `
        <div class="list-row">
          <div style="flex:1"><div style="font-size:13px;font-weight:700">${lib.atividade}</div>
          <div style="font-size:11px;color:var(--text-muted)">Turma ${lib.turma} · ${lib.percentual}% da nota · ${lib.modo === 'avaliacao_plus' ? '📝 Avaliação+' : lib.modo === 'competicao_plus' ? '⚔️ Competição+' : lib.modo || ''}</div></div>
          <span class="badge badge-green">Ativa</span>
        </div>`).join('') : '<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg><p>Nenhuma atividade liberada.</p></div>'}
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title"><svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21L13 13.04V8h-1z"/></svg>Últimos Resultados</div></div>
        ${ultimos.map(r => `
        <div class="list-row">
          <div style="flex:1"><div style="font-size:13px;font-weight:600">${r.aluno}</div>
          <div style="font-size:11px;color:var(--text-muted)">${r.atividade} · Turma ${r.turma}</div></div>
          <span class="badge badge-gold">${r.pontuacao} pts</span>
          <span style="font-size:11px;color:var(--text-muted)">${r.data || ''}</span>
        </div>`).join('')}
        ${!ultimos.length ? '<div class="empty-state"><p>Nenhum resultado ainda.</p></div>' : ''}
      </div>
    </div>

    <div>
      <div class="card">
        <div class="card-header"><div class="card-title"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>Alertas</div></div>
        ${autoAlertas.map(a => `
        <div class="list-row alerta-list-row" onclick="abrirModalAlerta('${a.tipo}')">
          <div style="flex:1"><div style="font-size:13px;font-weight:600">${a.icon} ${a.msg}</div></div>
          <span class="btn btn-sm btn-ghost" style="font-size:11px;pointer-events:none">Ver →</span>
        </div>`).join('')}
        ${alertas.length ? alertas.slice(0, 4).map(a => `
        <div class="list-row">
          <div style="flex:1"><div style="font-size:13px;font-weight:600">${a.aluno} — ${a.atividade}</div>
          <div style="font-size:11px;color:var(--text-muted)">${a.motivo}</div></div>
          <span class="badge badge-red">⚠️</span>
        </div>`).join('') : ''}
        ${!autoAlertas.length && !alertas.length ? '<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg><p>Nenhum alerta.</p></div>' : ''}
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title"><svg viewBox="0 0 24 24"><path d="M7.5 21H2V9h5.5v12zm7.25-18h-5.5v18h5.5V3zM22 11h-5.5v10H22V11z"/></svg>Top Alunos</div>
          <a href="/professor/ranking.html" class="btn btn-sm btn-ghost" style="font-size:11px">Ver ranking →</a>
        </div>
        ${renderPodiumDash()}
      </div>
    </div>
  </div>`;

// ── Online Agora (listeners em tempo real) ────────────────────
const ONLINE_WINDOW_MS = 5 * 60 * 1000;
let onlineQuiz    = [];
let onlineTabuada = [];

onValue(ref(db, 'resultados'), snap => {
  const now = Date.now();
  const seen = {};
  snap.forEach(child => {
    const v = child.val();
    if (!v.concluido && v.aluno && v.criadoEm && (now - v.criadoEm) < ONLINE_WINDOW_MS) {
      seen[v.aluno] = { nome: v.aluno, turma: v.turma || '?', atividade: v.atividade || '' };
    }
  });
  onlineQuiz = Object.values(seen);
  const el = document.getElementById('online-quiz-count');
  if (el) el.textContent = onlineQuiz.length;
  atualizarListaOnline();
});

onValue(ref(db, 'tabuada_presenca'), snap => {
  const now = Date.now();
  const found = [];
  snap.forEach(child => {
    const v = child.val();
    if (v?.nome && v.ts && (now - v.ts) < ONLINE_WINDOW_MS) {
      found.push({ nome: v.nome, turma: v.turma || '?' });
    }
  });
  onlineTabuada = found;
  const el = document.getElementById('online-tabuada-count');
  if (el) el.textContent = onlineTabuada.length;
  atualizarListaOnline();
});

function atualizarListaOnline() {
  const el = document.getElementById('online-modal-list');
  if (!el) return;
  let html = '';
  if (onlineQuiz.length) {
    html += `<div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">🎮 Quiz</div>`;
    html += onlineQuiz.map(a => `
      <div class="online-row">
        <span class="online-dot"></span>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">${a.nome}</div>
          <div style="font-size:11px;color:var(--text-muted)">Turma ${a.turma}${a.atividade ? ' · ' + a.atividade : ''}</div>
        </div>
      </div>`).join('');
  }
  if (onlineTabuada.length) {
    if (html) html += `<div style="height:1px;background:var(--border);margin:10px 0"></div>`;
    html += `<div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">🔢 Tabuada</div>`;
    html += onlineTabuada.map(a => `
      <div class="online-row">
        <span class="online-dot" style="background:var(--blue)"></span>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">${a.nome}</div>
          <div style="font-size:11px;color:var(--text-muted)">Turma ${a.turma}</div>
        </div>
      </div>`).join('');
  }
  if (!html) html = '<p style="color:var(--text-muted);font-size:13px;text-align:center;padding:12px 0">Nenhum aluno jogando agora.</p>';
  el.innerHTML = html;
}

window.abrirOnlineModal = function() {
  document.getElementById('online-modal-bg').style.display = 'flex';
  atualizarListaOnline();
};
window.fecharOnlineModal = function(e) {
  if (!e || e.target === document.getElementById('online-modal-bg')) {
    document.getElementById('online-modal-bg').style.display = 'none';
  }
};

// ── Modais de alertas ─────────────────────────────────────────
const semAtividadeSet = new Set(semAtividade);
const baixaTaxaData = baixaTaxa.map(([aluno, regs]) => {
  const ac  = regs.reduce((s, r) => s + (r.acertos || 0), 0);
  const tot = regs.reduce((s, r) => s + (r.acertos || 0) + (r.erros || 0), 0);
  return { aluno, turma: turmaDash[aluno] || '?', taxa: tot > 0 ? ac / tot * 100 : 0 };
});

function _verAcomp(nome) {
  return `<a href="/professor/acompanhamento.html?aluno=${encodeURIComponent(nome)}" class="btn btn-sm btn-ghost" style="font-size:11px;white-space:nowrap">Ver acompanhamento</a>`;
}

function _renderPorTurma(grupos) {
  return Object.entries(grupos).sort(([a],[b]) => a.localeCompare(b)).map(([turma, rows]) => rows.length ? `
    <div class="alerta-turma-head">Turma ${turma} &nbsp;(${rows.length})</div>
    ${rows.join('')}` : '').join('');
}

window.abrirModalAlerta = function(tipo) {
  const tit  = document.getElementById('alerta-modal-titulo');
  const list = document.getElementById('alerta-modal-list');

  if (tipo === 'semAtividade') {
    tit.textContent = `📭 Sem atividade (${semAtividade.length} aluno${semAtividade.length > 1 ? 's' : ''})`;
    const grupos = {};
    for (const [turma, alunoList] of Object.entries(ALUNOS_POR_TURMA)) {
      const grupo = alunoList.filter(a => semAtividadeSet.has(a));
      if (!grupo.length) continue;
      grupos[turma] = grupo.map(nome => `
        <div class="alerta-aluno-row">
          <div style="flex:1;font-size:13px;font-weight:600">${nome}</div>
          ${_verAcomp(nome)}
        </div>`);
    }
    list.innerHTML = _renderPorTurma(grupos) || '<p style="color:var(--text-muted);font-size:13px">Nenhum aluno.</p>';

  } else if (tipo === 'baixaTaxa') {
    tit.textContent = `⚠️ Taxa abaixo de 30% (${baixaTaxaData.length} aluno${baixaTaxaData.length > 1 ? 's' : ''})`;
    const grupos = {};
    for (const d of baixaTaxaData) {
      if (!grupos[d.turma]) grupos[d.turma] = [];
      grupos[d.turma].push(d);
    }
    for (const g of Object.values(grupos)) g.sort((a, b) => a.taxa - b.taxa);
    const htmlGrupos = {};
    for (const [turma, grupo] of Object.entries(grupos)) {
      htmlGrupos[turma] = grupo.map(d => `
        <div class="alerta-aluno-row">
          <div style="flex:1;font-size:13px;font-weight:600">${d.aluno}</div>
          <span class="alerta-taxa-badge">${Math.round(d.taxa)}%</span>
          ${_verAcomp(d.aluno)}
        </div>`);
    }
    list.innerHTML = _renderPorTurma(htmlGrupos) || '<p style="color:var(--text-muted);font-size:13px">Nenhum aluno.</p>';

  } else if (tipo === 'zeroAcerto') {
    const nomeAtiv = liberadas[0]?.atividade || '';
    tit.textContent = `🚨 Zero acertos em "${nomeAtiv}" (${zeroAcertoUlt.length})`;
    const grupos = {};
    for (const r of zeroAcertoUlt) {
      const t = r.turma || '?';
      if (!grupos[t]) grupos[t] = [];
      grupos[t].push(`<div class="alerta-aluno-row">
        <div style="flex:1;font-size:13px;font-weight:600">${r.aluno}</div>
        ${_verAcomp(r.aluno)}
      </div>`);
    }
    list.innerHTML = _renderPorTurma(grupos) || '<p style="color:var(--text-muted);font-size:13px">Nenhum aluno.</p>';
  }

  document.getElementById('alerta-modal-bg').style.display = 'flex';
};

window.fecharAlertaModal = function(e) {
  if (!e || e.target === document.getElementById('alerta-modal-bg')) {
    document.getElementById('alerta-modal-bg').style.display = 'none';
  }
};

// ── Análise anti-IA: conta suspeitos em background ────────────
(async () => {
  const plusSessoes = todos.filter(r => r.concluido && r.modo === 'competicao_plus');
  if (!plusSessoes.length) return;
  const detalhesList = await Promise.all(plusSessoes.map(s => getDetalhes(s.id).then(d => [s.id, d || []])));
  const detalhesPorId = Object.fromEntries(detalhesList);
  const grupos = {};
  for (const s of plusSessoes) {
    const key = s.aluno + '|||' + s.atividade;
    if (!grupos[key]) grupos[key] = [];
    grupos[key].push(s);
  }
  let suspeitos = 0;
  for (const sessoes of Object.values(grupos)) {
    const validas = sessoes.filter(s => ((s.acertos||0)+(s.erros||0)+(s.nao_respondidas||0)) >= 10);
    if (!validas.length) continue;
    const todasQ = validas.flatMap(s => detalhesPorId[s.id] || []);
    let score = 0;
    const faceis = todasQ.filter(q => q.dificuldade === 1);
    const difs   = todasQ.filter(q => q.dificuldade === 2 || q.dificuldade === 3);
    if (faceis.length >= 3 && difs.length >= 3) {
      const acF = faceis.filter(q => { const r = q.resultado ?? null; return r === 'acerto' || (r === null && !!q.acertou); }).length;
      const acD = difs.filter(q => { const r = q.resultado ?? null; return r === 'acerto' || (r === null && !!q.acertou); }).length;
      if (acD / difs.length > acF / faceis.length + 0.20) score += 25;
    }
    if (validas.length >= 2) {
      const sorted = [...validas].sort((a, b) => (a.ts_inicio||0) - (b.ts_inicio||0));
      if ((sorted[0].pontuacao||0) > 0 && (sorted[1].pontuacao||0) > sorted[0].pontuacao * 3) score += 25;
    }
    const comTempo = todasQ.filter(q => q.tempo_resposta_ms != null);
    if (comTempo.length >= 5) {
      const tempos = comTempo.map(q => q.tempo_resposta_ms);
      const avg = tempos.reduce((a, b) => a + b, 0) / tempos.length;
      const std = Math.sqrt(tempos.reduce((s, t) => s + (t - avg) ** 2, 0) / tempos.length);
      if (std < 3000) score += 25;
      const fT = comTempo.filter(q => q.dificuldade === 1);
      if (fT.length >= 3 && fT.reduce((s, q) => s + q.tempo_resposta_ms, 0) / fT.length > 7000) score += 25;
    }
    if (score > 50) suspeitos++;
  }
  if (suspeitos > 0) {
    const card = document.getElementById('analise-card');
    if (card) { card.querySelector('#analise-count').textContent = suspeitos; card.style.display = 'flex'; }
  }
})();
</script>
