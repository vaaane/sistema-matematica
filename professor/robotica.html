<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Robótica — Professor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .live-dot{width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block;animation:pulse 1.4s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

    .pill{padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:all .15s;}
    .pill.ativo{border-color:var(--blue);background:var(--blue);color:#fff;}
    .pill.turma.ativo{border-color:#7C3AED;background:#7C3AED;color:#fff;}

    .resumo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
    @media(max-width:600px){.resumo-grid{grid-template-columns:1fr 1fr;}}
    .resumo-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;}
    .resumo-val{font-size:28px;font-weight:800;line-height:1;margin-bottom:4px;}
    .resumo-lbl{font-size:11px;color:var(--text-muted);font-weight:500;}

    .analise-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
    @media(max-width:700px){.analise-grid{grid-template-columns:1fr;}}
    .analise-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
    .analise-hdr{padding:12px 16px;font-size:12px;font-weight:700;border-bottom:1px solid var(--border);}
    .analise-body{padding:8px 16px 12px;}
    .q-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
    .q-row:last-child{border-bottom:none;}
    .q-rank{width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
    .q-txt{flex:1;min-width:0;font-size:11px;font-weight:600;line-height:1.4;}
    .q-sub{font-size:10px;color:var(--text-muted);font-weight:400;margin-top:1px;}
    .q-cnt{font-size:13px;font-weight:800;flex-shrink:0;text-align:right;line-height:1.3;}

    .cat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;overflow:hidden;}
    .pct-bar{flex:1;height:6px;background:var(--border);border-radius:6px;overflow:hidden;min-width:60px;}
    .pct-fill{height:100%;border-radius:6px;}

    .aluno-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
    .aluno-hdr{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:background .12s;user-select:none;}
    .aluno-hdr:hover{background:rgba(0,0,0,.025);}
    [data-theme=dark] .aluno-hdr:hover{background:rgba(255,255,255,.04);}
    .aluno-av{width:36px;height:36px;border-radius:50%;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;}
    .aluno-nome{font-size:14px;font-weight:700;}
    .aluno-turma{font-size:11px;color:var(--text-muted);margin-top:1px;}
    .aluno-body{display:none;border-top:1px solid var(--border);}
    .aluno-body.open{display:block;}

    .ativ-bloco{padding:14px 16px;border-bottom:1px dashed var(--border);}
    .ativ-bloco:last-child{border-bottom:none;}
    .ativ-bloco-hdr{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
    .ativ-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
    .ativ-stat{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 6px;text-align:center;}
    .ativ-stat-val{font-size:16px;font-weight:800;line-height:1;}
    .ativ-stat-lbl{font-size:10px;color:var(--text-muted);margin-top:2px;}

    .spark-wrap{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:10px;}
    .spark-lbl{font-size:10px;font-weight:700;color:var(--text-muted);flex-shrink:0;}

    .tent-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:5px;cursor:pointer;transition:background .12s;}
    .tent-item:hover{background:var(--bg);}
    .tent-item.best{border-color:#F59E0B;background:linear-gradient(to right,rgba(245,158,11,.06),transparent);}
    .tent-info{flex:1;min-width:0;}
    .tent-data{font-size:11px;color:var(--text-muted);}
    .tent-detail{padding:8px 10px 10px;border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;background:var(--bg);margin-top:-5px;margin-bottom:5px;font-size:11px;}

    .diff-blk{padding:5px 8px;border-radius:6px;border:1px solid;margin-bottom:3px;line-height:1.4;}
    .diff-nota{font-size:10px;margin-top:2px;}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">🤖 Robótica</div>
        <div class="topbar-sub" id="sub-status">Carregando… <span class="live-dot" style="margin-left:4px"></span></div>
      </div>
      <div class="topbar-right" style="display:flex;gap:6px;flex-wrap:wrap;" id="pills-ativ">
        <button class="pill ativo" data-v="0">Todas</button>
        <button class="pill" data-v="1">Atividade 1</button>
        <button class="pill" data-v="2">Atividade 2</button>
        <button class="pill" data-v="3">Atividade 3</button>
        <button class="pill" data-v="4">Atividade 4 🎯</button>
      </div>
    </div>
    <div class="content">

      <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;" id="pills-turma">
        <button class="pill turma ativo" data-v="">Todas as turmas</button>
        <button class="pill turma" data-v="8D">8D</button>
        <button class="pill turma" data-v="8E">8E</button>
        <button class="pill turma" data-v="8F">8F</button>
        <button class="pill turma" data-v="8H">8H</button>
      </div>

      <div class="resumo-grid" id="resumo">
        <div class="resumo-box"><div class="resumo-val" id="rv-alunos">—</div><div class="resumo-lbl">Alunos com dados</div></div>
        <div class="resumo-box"><div class="resumo-val" id="rv-tent">—</div><div class="resumo-lbl">Total de tentativas</div></div>
        <div class="resumo-box"><div class="resumo-val" id="rv-media">—</div><div class="resumo-lbl">Média de acerto</div></div>
      </div>

      <div class="analise-grid">
        <div class="analise-card">
          <div class="analise-hdr" style="color:var(--red)">❌ Top 5 — Mais Erradas</div>
          <div class="analise-body" id="top5-err"><div style="color:var(--text-muted);font-size:12px;padding:8px 0;">Aguardando…</div></div>
        </div>
        <div class="analise-card">
          <div class="analise-hdr" style="color:var(--green)">✅ Top 5 — Mais Acertadas</div>
          <div class="analise-body" id="top5-ok"><div style="color:var(--text-muted);font-size:12px;padding:8px 0;">Aguardando…</div></div>
        </div>
      </div>

      <div class="cat-card">
        <div class="analise-hdr">📊 Taxa de acerto por categoria</div>
        <div style="padding:8px 16px 14px;" id="cat-body"><div style="color:var(--text-muted);font-size:12px;padding:8px 0;">Aguardando…</div></div>
      </div>

      <div id="alunos-wrap">
        <div style="text-align:center;padding:48px;color:var(--text-muted);">Carregando…</div>
      </div>

    </div>
  </div>
</div>

<script type="module">
import { requireProfessor, renderSidebarProfessor, clearSession } from "/js/auth.js";

requireProfessor();
renderSidebarProfessor("sidebar", "robotica");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

// ── Questões ────────────────────────────────────────────────
const questoesMap = {};
async function carregarQuestoes() {
  const res = await Promise.allSettled(
    [1, 2, 3, 4].map(n => fetch(`/dados/robotica/atividade_${n}.json`).then(r => r.json()))
  );
  for (const r of res) {
    if (r.status === 'fulfilled' && r.value?.questoes) {
      for (const q of r.value.questoes) questoesMap[q.id] = q;
    }
  }
}
await carregarQuestoes();

// ── Estado ──────────────────────────────────────────────────
let todasTentativas = [];
let filtroAtiv  = 0;
let filtroTurma = '';

// ── Filtros ─────────────────────────────────────────────────
document.getElementById('pills-ativ').addEventListener('click', e => {
  const btn = e.target.closest('[data-v]');
  if (!btn) return;
  filtroAtiv = +btn.dataset.v;
  document.querySelectorAll('#pills-ativ .pill').forEach(p =>
    p.classList.toggle('ativo', p.dataset.v === btn.dataset.v));
  renderizar();
});

document.getElementById('pills-turma').addEventListener('click', e => {
  const btn = e.target.closest('[data-v]');
  if (!btn) return;
  filtroTurma = btn.dataset.v;
  document.querySelectorAll('#pills-turma .pill').forEach(p =>
    p.classList.toggle('ativo', p.dataset.v === btn.dataset.v));
  renderizar();
});

// ── Helpers ─────────────────────────────────────────────────
function fmtData(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR') + ' ' +
         d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

const MINIMO_APROVACAO = 85;

function pctCor(p) {
  return p === 100 ? '#F59E0B' : p >= MINIMO_APROVACAO ? 'var(--green)' : 'var(--red)';
}
function pctBg(p) {
  return p === 100 ? '#FEF3C7' : p >= MINIMO_APROVACAO ? '#DCFCE7' : '#FEF2F2';
}
function pctBorder(p) {
  return p === 100 ? '#FDE68A' : p >= MINIMO_APROVACAO ? '#BBF7D0' : '#FECACA';
}
function pctLabel(p) {
  return p === 100 ? '⭐ 100%' : p + '%';
}
function iniciais(nome) {
  return nome.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

// ── Resumo ───────────────────────────────────────────────────
function renderResumo(tentativas) {
  const alunos = new Set(tentativas.map(t => `${t.turma}|${t.aluno}`));
  const n = alunos.size;
  const tot = tentativas.length;
  const media = tot > 0
    ? Math.round(tentativas.reduce((s, t) => s + (t.total > 0 ? t.acertos / t.total * 100 : 0), 0) / tot)
    : null;

  document.getElementById('rv-alunos').textContent = n;
  document.getElementById('rv-alunos').style.color = 'var(--blue)';
  document.getElementById('rv-tent').textContent = tot;
  document.getElementById('rv-tent').style.color = 'var(--text)';
  document.getElementById('rv-media').textContent = media !== null ? media + '%' : '—';
  document.getElementById('rv-media').style.color = media !== null ? pctCor(media) : 'var(--text-muted)';

  document.getElementById('sub-status').innerHTML =
    `${n} aluno${n !== 1 ? 's' : ''} · ${tot} tentativa${tot !== 1 ? 's' : ''} <span class="live-dot" style="margin-left:4px"></span>`;
}

// ── Análise de questões ──────────────────────────────────────
function calcQuestoes(tentativas) {
  const erros = {}, acertos = {}, totais = {};
  for (const t of tentativas) {
    if (!t.respostas) continue;
    for (const [qid, r] of Object.entries(t.respostas)) {
      totais[qid] = (totais[qid] || 0) + 1;
      if (r.acertou) acertos[qid] = (acertos[qid] || 0) + 1;
      else erros[qid] = (erros[qid] || 0) + 1;
    }
  }
  return { erros, acertos, totais };
}

function renderTop5Err(tentativas) {
  const { erros, totais } = calcQuestoes(tentativas);
  const el = document.getElementById('top5-err');
  const top = Object.entries(erros).sort((a, b) => b[1] - a[1]).slice(0, 5);
  if (!top.length) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:8px 0;">Sem dados.</div>';
    return;
  }
  el.innerHTML = top.map(([id, n], i) => {
    const q = questoesMap[id];
    const pct = totais[id] ? Math.round(n / totais[id] * 100) : 0;
    return `<div class="q-row">
      <div class="q-rank" style="background:#FEE2E2;color:var(--red)">${i + 1}</div>
      <div style="flex:1;min-width:0">
        <div class="q-txt">${q ? q.enunciado.replace(/\n/g, ' ') : id}</div>
        <div class="q-sub">[${id}] ${q?.categoria || '—'}</div>
      </div>
      <div class="q-cnt" style="color:var(--red)">${n}✗<br>
        <span style="font-size:10px;color:var(--text-muted);font-weight:400">${pct}%</span></div>
    </div>`;
  }).join('');
}

function renderTop5Ok(tentativas) {
  const { acertos, totais } = calcQuestoes(tentativas);
  const el = document.getElementById('top5-ok');
  const top = Object.keys(totais)
    .map(id => ({ id, ac: acertos[id] || 0, tot: totais[id] }))
    .sort((a, b) => b.ac / b.tot - a.ac / a.tot || b.ac - a.ac)
    .slice(0, 5);
  if (!top.length) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:8px 0;">Sem dados.</div>';
    return;
  }
  el.innerHTML = top.map(({ id, ac, tot }, i) => {
    const q = questoesMap[id];
    const pct = Math.round(ac / tot * 100);
    return `<div class="q-row">
      <div class="q-rank" style="background:#DCFCE7;color:var(--green)">${i + 1}</div>
      <div style="flex:1;min-width:0">
        <div class="q-txt">${q ? q.enunciado.replace(/\n/g, ' ') : id}</div>
        <div class="q-sub">[${id}] ${q?.categoria || '—'}</div>
      </div>
      <div class="q-cnt" style="color:var(--green)">${ac}✓<br>
        <span style="font-size:10px;color:var(--text-muted);font-weight:400">${pct}%</span></div>
    </div>`;
  }).join('');
}

function renderCategorias(tentativas) {
  const cats = {};
  for (const t of tentativas) {
    if (!t.respostas) continue;
    for (const [qid, r] of Object.entries(t.respostas)) {
      const cat = questoesMap[qid]?.categoria || 'Outros';
      if (!cats[cat]) cats[cat] = { ac: 0, tot: 0 };
      cats[cat].tot++;
      if (r.acertou) cats[cat].ac++;
    }
  }
  const el = document.getElementById('cat-body');
  const sorted = Object.entries(cats).sort((a, b) => b[1].ac / b[1].tot - a[1].ac / a[1].tot);
  if (!sorted.length) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:8px 0;">Sem dados.</div>';
    return;
  }
  el.innerHTML = sorted.map(([cat, s]) => {
    const pct = Math.round(s.ac / s.tot * 100);
    const col = pctCor(pct);
    return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);">
      <div style="width:140px;font-size:12px;font-weight:600;flex-shrink:0;">${cat}</div>
      <div class="pct-bar"><div class="pct-fill" style="width:${pct}%;background:${col}"></div></div>
      <div style="font-size:12px;font-weight:700;color:${col};min-width:38px;text-align:right;">${pct}%</div>
      <div style="font-size:11px;color:var(--text-muted);min-width:60px;">${s.ac}/${s.tot}</div>
    </div>`;
  }).join('');
}

// ── Sparkline ─────────────────────────────────────────────────
function sparkline(tents) {
  const pts = tents.map(t => t.total > 0 ? Math.round(t.acertos / t.total * 100) : 0);
  if (pts.length < 2) return '';
  const first = pts[0], last = pts[pts.length - 1];
  const cor = last > first ? '#16A34A' : last < first ? '#DC2626' : '#6B7280';
  const seta = last > first ? '↑' : last < first ? '↓' : '→';
  const W = 200, H = 44, pad = 6;
  const iW = W - pad * 2, iH = H - pad * 2;
  const maxV = Math.max(...pts, 1);
  const n = pts.length;
  const xP = i => pad + (n > 1 ? i / (n - 1) * iW : iW / 2);
  const yP = v => pad + iH - Math.min(v / maxV * iH, iH);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:200px;height:${H}px;flex-shrink:0">`;
  svg += `<polyline points="${pts.map((v, i) => `${xP(i)},${yP(v)}`).join(' ')}" fill="none" stroke="${cor}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach((v, i) => {
    svg += `<circle cx="${xP(i)}" cy="${yP(v)}" r="3.5" fill="${cor}" stroke="white" stroke-width="1.5"/>`;
    svg += `<text x="${xP(i)}" y="${yP(v) - 6}" text-anchor="middle" font-size="8" fill="${cor}" font-weight="700">${v}%</text>`;
  });
  svg += '</svg>';
  return `<div class="spark-wrap">
    <span class="spark-lbl">${tents.length} tent.</span>
    ${svg}
    <div style="flex-shrink:0;text-align:center;min-width:28px">
      <div style="font-size:20px;font-weight:800;color:${cor};line-height:1">${seta}</div>
      <div style="font-size:9px;color:var(--text-muted)">${last}%</div>
    </div>
  </div>`;
}

// ── Detalhe da tentativa ─────────────────────────────────────
function detalheHTML(t, prev) {
  if (!t.respostas) return '<div style="color:var(--text-muted)">Detalhes não disponíveis.</div>';
  const entries = Object.entries(t.respostas);

  if (!prev?.respostas) {
    const oks  = entries.filter(([, r]) => r.acertou);
    const errs = entries.filter(([, r]) => !r.acertou);
    let html = '';
    if (errs.length) {
      html += `<div style="font-size:10px;font-weight:700;color:var(--red);margin-bottom:3px">Errou (${errs.length})</div>`;
      html += errs.map(([id, r]) => {
        const q = questoesMap[id];
        return `<div class="diff-blk" style="border-color:#FECACA;background:#FEF2F2;color:#991B1B">
          ${q ? q.enunciado.replace(/\n/g, ' ') : id}
          <div class="diff-nota" style="color:#B91C1C">Respondeu: <b>${r.resposta_dada ?? '—'}</b> · Certa: ${q?.resposta ?? '—'}</div>
        </div>`;
      }).join('');
    }
    if (oks.length) {
      html += `<div style="font-size:10px;font-weight:700;color:var(--green);margin:${errs.length ? '8px' : '0'} 0 3px">Acertou (${oks.length})</div>`;
      html += oks.map(([id]) => {
        const q = questoesMap[id];
        return `<div class="diff-blk" style="border-color:#BBF7D0;background:#DCFCE7;color:#166534">
          ${q ? q.enunciado.replace(/\n/g, ' ') : id}
        </div>`;
      }).join('');
    }
    return html || '<div style="color:var(--text-muted)">Sem detalhes.</div>';
  }

  // Comparação com tentativa anterior
  const melhorou = [], piorou = [], aindaErrado = [];
  for (const [id, r] of entries) {
    const p = prev.respostas[id];
    if (!p) continue;
    if (!p.acertou && r.acertou) melhorou.push({ id, r });
    else if (p.acertou && !r.acertou) piorou.push({ id, r });
    else if (!p.acertou && !r.acertou) aindaErrado.push({ id, r });
  }

  let html = '';
  if (melhorou.length) {
    html += `<div style="font-size:10px;font-weight:700;color:var(--green);margin-bottom:3px">✓ Passou a acertar (${melhorou.length})</div>`;
    html += melhorou.map(({ id }) => {
      const q = questoesMap[id];
      return `<div class="diff-blk" style="border-color:#BBF7D0;background:#DCFCE7;color:#166534">✅ ${q ? q.enunciado.replace(/\n/g, ' ') : id}</div>`;
    }).join('');
  }
  if (piorou.length) {
    html += `<div style="font-size:10px;font-weight:700;color:var(--red);margin:${melhorou.length ? '8px' : '0'} 0 3px">✗ Passou a errar (${piorou.length})</div>`;
    html += piorou.map(({ id, r }) => {
      const q = questoesMap[id];
      return `<div class="diff-blk" style="border-color:#FECACA;background:#FEF2F2;color:#991B1B">
        ❌ ${q ? q.enunciado.replace(/\n/g, ' ') : id}
        <div class="diff-nota" style="color:#B91C1C">Respondeu: <b>${r.resposta_dada ?? '—'}</b> · Certa: ${q?.resposta ?? '—'}</div>
      </div>`;
    }).join('');
  }
  if (aindaErrado.length) {
    html += `<div style="font-size:10px;font-weight:700;color:#D97706;margin:${(melhorou.length || piorou.length) ? '8px' : '0'} 0 3px">Ainda erra (${aindaErrado.length})</div>`;
    html += aindaErrado.map(({ id, r }) => {
      const q = questoesMap[id];
      return `<div class="diff-blk" style="border-color:#FED7AA;background:#FFF7ED;color:#92400E">
        ⚠ ${q ? q.enunciado.replace(/\n/g, ' ') : id}
        <div class="diff-nota" style="color:#D97706">Respondeu: <b>${r.resposta_dada ?? '—'}</b> · Certa: ${q?.resposta ?? '—'}</div>
      </div>`;
    }).join('');
  }
  if (!html) return '<div style="color:var(--text-muted);font-size:11px">Sem diferenças em relação à tentativa anterior.</div>';
  return html;
}

// ── Alunos ───────────────────────────────────────────────────
const COR_TURMA = { '8D': '#7C3AED', '8E': '#0EA5E9', '8F': '#0D9488', '8H': '#D97706' };

function renderAlunos(tentativas) {
  const wrap = document.getElementById('alunos-wrap');

  const porAluno = {};
  for (const t of tentativas) {
    const k = `${t.turma}|${t.aluno}`;
    if (!porAluno[k]) porAluno[k] = { turma: t.turma, aluno: t.aluno, ativs: {} };
    const an = +t.atividade;
    if (!porAluno[k].ativs[an]) porAluno[k].ativs[an] = [];
    porAluno[k].ativs[an].push(t);
  }

  for (const al of Object.values(porAluno)) {
    for (const arr of Object.values(al.ativs)) {
      arr.sort((a, b) => (a.completadoEm || 0) - (b.completadoEm || 0));
    }
  }

  const alunos = Object.values(porAluno)
    .sort((a, b) => a.turma.localeCompare(b.turma) || a.aluno.localeCompare(b.aluno));

  if (!alunos.length) {
    wrap.innerHTML = '<div style="text-align:center;padding:48px;color:var(--text-muted);">Nenhum dado para este filtro.</div>';
    return;
  }

  const ativsMostrar = filtroAtiv ? [filtroAtiv] : [1, 2, 3];

  wrap.innerHTML = alunos.map((al, si) => {
    const cor = COR_TURMA[al.turma] || 'var(--blue)';

    const miniBadges = ativsMostrar.map(n => {
      const tents = al.ativs[n];
      if (!tents?.length)
        return `<span style="font-size:10px;color:var(--text-muted);border:1px dashed var(--border);padding:2px 7px;border-radius:12px;">At.${n} —</span>`;
      const best = Math.max(...tents.map(t => t.total > 0 ? Math.round(t.acertos / t.total * 100) : 0));
      return `<span style="font-size:10px;font-weight:600;color:${pctCor(best)};border:1px solid ${pctBorder(best)};background:${pctBg(best)};padding:2px 7px;border-radius:12px;">At.${n} ${pctLabel(best)}</span>`;
    }).join('');

    const ativSections = ativsMostrar.map(n => {
      const tents = al.ativs[n] || [];
      if (!tents.length) {
        return `<div class="ativ-bloco">
          <div class="ativ-bloco-hdr">Atividade ${n}</div>
          <div style="font-size:12px;color:var(--text-muted)">Não realizou esta atividade.</div>
        </div>`;
      }

      const bestAc  = Math.max(...tents.map(t => t.acertos || 0));
      const tot     = tents[0].total || 33;
      const pctBest = Math.round(bestAc / tot * 100);
      const medAc   = Math.round(tents.reduce((s, t) => s + (t.acertos || 0), 0) / tents.length);
      const medPct  = Math.round(medAc / tot * 100);

      const tentRows = tents.map((t, i) => {
        const pct   = t.total > 0 ? Math.round(t.acertos / t.total * 100) : 0;
        const col   = pctCor(pct);
        const isBest = t.acertos === bestAc;
        const prev  = i > 0 ? tents[i - 1] : null;
        const diff  = prev !== null ? t.acertos - prev.acertos : null;
        const diffBadge = diff !== null
          ? `<span style="font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px;background:${diff > 0 ? '#DCFCE7' : diff < 0 ? '#FEF2F2' : '#F3F4F6'};color:${diff > 0 ? '#15803D' : diff < 0 ? '#B91C1C' : '#6B7280'};border:1px solid ${diff > 0 ? '#BBF7D0' : diff < 0 ? '#FECACA' : '#E5E7EB'}">${diff > 0 ? '+' + diff : diff === 0 ? '=' : diff}</span>`
          : '';
        const uid = `${al.turma}_${al.aluno}_${n}_${i}`.replace(/[^a-zA-Z0-9]/g, '_');
        return `<div>
          <div class="tent-item${isBest ? ' best' : ''}" onclick="toggleTent('${uid}')">
            <div class="tent-info">
              <div class="tent-data">${i + 1}ª tentativa${t.completadoEm ? ' · ' + fmtData(t.completadoEm) : ''}</div>
              <div style="display:flex;align-items:center;gap:5px;margin-top:4px;flex-wrap:wrap">
                <span style="font-size:12px;font-weight:700;color:var(--gold)">⭐ ${t.acertos}/${tot}</span>
                <span style="font-size:11px;font-weight:700;color:${col};padding:1px 6px;border-radius:8px;background:${pctBg(pct)};border:1px solid ${pctBorder(pct)}">${pctLabel(pct)}</span>
                <span style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;background:${pctBg(pct)};color:${pct >= MINIMO_APROVACAO ? '#15803D' : '#B91C1C'};border:1px solid ${pctBorder(pct)}">${pct >= MINIMO_APROVACAO ? 'Aprovado' : 'Reprovado'}</span>
                ${diffBadge}
                ${isBest ? '<span style="font-size:10px;font-weight:700;color:#B45309;background:#FEF3C7;border:1px solid #FDE68A;padding:1px 6px;border-radius:8px;">🏆 Melhor</span>' : ''}
              </div>
            </div>
            <svg viewBox="0 0 24 24" id="arr-${uid}" style="width:14px;height:14px;fill:var(--text-muted);flex-shrink:0;transition:transform .2s"><path d="M7 10l5 5 5-5z"/></svg>
          </div>
          <div id="det-${uid}" style="display:none" class="tent-detail">${detalheHTML(t, prev)}</div>
        </div>`;
      }).join('');

      return `<div class="ativ-bloco">
        <div class="ativ-bloco-hdr">
          Atividade ${n}
          <span class="badge badge-blue">${tents.length} tentativa${tents.length > 1 ? 's' : ''}</span>
        </div>
        <div class="ativ-stats">
          <div class="ativ-stat">
            <div class="ativ-stat-val" style="color:${pctCor(pctBest)}">${pctLabel(pctBest)}</div>
            <div class="ativ-stat-lbl">Melhor resultado</div>
          </div>
          <div class="ativ-stat">
            <div class="ativ-stat-val" style="color:${pctCor(medPct)}">${pctLabel(medPct)}</div>
            <div class="ativ-stat-lbl">% Média</div>
          </div>
          <div class="ativ-stat">
            <div class="ativ-stat-val" style="color:${pctBest >= MINIMO_APROVACAO ? '#15803D' : '#B91C1C'}">${pctBest >= MINIMO_APROVACAO ? '✅' : '❌'}</div>
            <div class="ativ-stat-lbl" style="color:${pctBest >= MINIMO_APROVACAO ? '#15803D' : '#B91C1C'};font-weight:700">${pctBest >= MINIMO_APROVACAO ? 'Aprovado' : 'Reprovado'}</div>
          </div>
        </div>
        ${sparkline(tents)}
        ${tentRows}
      </div>`;
    }).join('');

    return `<div class="aluno-card">
      <div class="aluno-hdr" onclick="toggleAluno(${si})">
        <div class="aluno-av" style="background:${cor}">${iniciais(al.aluno)}</div>
        <div style="flex:1;min-width:0">
          <div class="aluno-nome">${al.aluno}</div>
          <div class="aluno-turma">Turma ${al.turma}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">${miniBadges}</div>
        </div>
        <svg viewBox="0 0 24 24" id="arrow-${si}" style="width:18px;height:18px;fill:var(--text-muted);flex-shrink:0;transition:transform .2s"><path d="M7 10l5 5 5-5z"/></svg>
      </div>
      <div class="aluno-body" id="body-${si}">${ativSections}</div>
    </div>`;
  }).join('');
}

window.toggleAluno = (i) => {
  const body  = document.getElementById(`body-${i}`);
  const arrow = document.getElementById(`arrow-${i}`);
  if (!body) return;
  const open = body.classList.toggle('open');
  if (arrow) arrow.style.transform = open ? 'rotate(180deg)' : '';
};

window.toggleTent = (uid) => {
  const det = document.getElementById(`det-${uid}`);
  const arr = document.getElementById(`arr-${uid}`);
  if (!det) return;
  const vis = det.style.display !== 'none';
  det.style.display = vis ? 'none' : 'block';
  if (arr) arr.style.transform = vis ? '' : 'rotate(180deg)';
};

// ── Render principal ─────────────────────────────────────────
function renderizar() {
  const filtradas = todasTentativas.filter(t =>
    (!filtroAtiv  || +t.atividade === filtroAtiv) &&
    (!filtroTurma || t.turma === filtroTurma)
  );
  renderResumo(filtradas);
  renderTop5Err(filtradas);
  renderTop5Ok(filtradas);
  renderCategorias(filtradas);
  renderAlunos(filtradas);
}

// ── Carrega via REST API (SDK retorna dados incompletos) ──────
const DB_URL = 'https://sistemamatematica-50eff-default-rtdb.firebaseio.com';

async function carregarTentativas() {
  const resp = await fetch(`${DB_URL}/robotica_tentativas.json`);
  const data = await resp.json();
  if (!data) return [];
  return Object.entries(data).map(([id, v]) => ({ id, ...v }));
}

async function atualizar() {
  try {
    todasTentativas = await carregarTentativas();
    renderizar();
  } catch (e) {
    console.error('[Robótica] Erro ao carregar tentativas:', e);
  }
}

// Carrega agora e recarrega a cada 30 s
await atualizar();
setInterval(atualizar, 30_000);
</script>
</body>
</html>
