<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Robótica — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    /* ── Shared section card ──────────────────────────────────────── */
    .rob-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;overflow:hidden;}
    .rob-section-hdr{padding:14px 18px;font-size:13px;font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}

    /* ── Student cards ────────────────────────────────────────────── */
    .st-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
    .st-card-hdr{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;transition:background .12s;}
    .st-card-hdr:hover{background:#FAFAFA;}
    .st-name{font-size:14px;font-weight:700;}
    .st-turma{font-size:11px;color:var(--text-muted);font-weight:400;margin-left:6px;}
    .st-card-body{display:none;border-top:1px solid var(--border);}
    .st-card-body.open{display:block;}

    /* ── Activity section ─────────────────────────────────────────── */
    .ativ-section{padding:14px 18px;border-bottom:1px dashed var(--border);}
    .ativ-section:last-child{border-bottom:none;}
    .ativ-section-hdr{font-size:12px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}

    /* ── Metrics grid ─────────────────────────────────────────────── */
    .ativ-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
    @media(max-width:600px){.ativ-metrics{grid-template-columns:repeat(2,1fr);}}
    .metric-box{background:var(--bg);border-radius:8px;padding:10px 6px;text-align:center;border:1px solid var(--border);}
    .metric-val{font-size:18px;font-weight:800;line-height:1;}
    .metric-lbl{font-size:10px;color:var(--text-muted);margin-top:3px;}

    /* ── Evolution chart ──────────────────────────────────────────── */
    .evolucao-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#F8FAFC;border-radius:8px;margin-bottom:10px;border:1px solid var(--border);}
    .evolucao-label{font-size:10px;font-weight:700;color:var(--text-muted);flex-shrink:0;}

    /* ── Attempt rows ─────────────────────────────────────────────── */
    .tent-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);margin-bottom:6px;background:var(--card);cursor:pointer;transition:background .15s;}
    .tent-row:hover{background:#fafafa;}
    .tent-row.melhor{border-color:#F59E0B;border-width:1.5px;background:linear-gradient(to right,#FFFDE7,var(--card));}
    .tent-info-wrap{flex:1;}
    .tent-date{font-size:11px;color:var(--text-muted);}
    .tent-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
    .tent-detail-body{padding:8px 12px 12px;border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;background:#FAFAFA;margin-top:-6px;margin-bottom:6px;}

    /* ── Top 5 ────────────────────────────────────────────────────── */
    .top5-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
    .top5-item:last-child{border-bottom:none;}
    .top5-rank{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
    .top5-info{flex:1;min-width:0;}
    .top5-enunciado{font-size:12px;font-weight:600;line-height:1.4;}
    .top5-meta{font-size:11px;color:var(--text-muted);margin-top:2px;}
    .top5-count{font-size:13px;font-weight:800;color:var(--red);flex-shrink:0;text-align:right;}

    /* ── Misc ─────────────────────────────────────────────────────── */
    .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;animation:blink 1.4s infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .pct-bar{flex:1;height:5px;background:var(--border);border-radius:5px;overflow:hidden;min-width:50px;}
    .pct-fill{height:100%;border-radius:5px;transition:width .3s;}
    .pill{padding:5px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:all .15s;}
    .pill.on{border-color:var(--blue);background:var(--blue);color:#fff;}
    @media(max-width:700px){.top5-grid{grid-template-columns:1fr!important;}}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">🤖 Robótica</div>
        <div class="topbar-sub">Acompanhamento em tempo real <span class="live-dot"></span></div>
      </div>
      <div class="topbar-right">
        <div id="status-geral" style="font-size:12px;color:var(--text-muted);"></div>
      </div>
    </div>
    <div class="content">

      <!-- Filter pills -->
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;" id="filter-pills">
        <button class="pill on" data-ativ="0" onclick="setFiltroAtiv(0)">Todas</button>
        <button class="pill" data-ativ="1" onclick="setFiltroAtiv(1)">Atividade 1</button>
        <button class="pill" data-ativ="2" onclick="setFiltroAtiv(2)">Atividade 2</button>
        <button class="pill" data-ativ="3" onclick="setFiltroAtiv(3)">Atividade 3</button>
      </div>

      <!-- Top 5 erradas + acertadas -->
      <div class="top5-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;">
        <div class="rob-section" style="margin-bottom:0">
          <div class="rob-section-hdr">
            <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:var(--red)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            Top 5 Mais Erradas
          </div>
          <div style="padding:8px 18px 14px;" id="top5-erradas">
            <div style="color:var(--text-muted);font-size:13px;padding:12px 0;">Aguardando dados…</div>
          </div>
        </div>
        <div class="rob-section" style="margin-bottom:0">
          <div class="rob-section-hdr">
            <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:var(--green)"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
            Top 5 Mais Acertadas
          </div>
          <div style="padding:8px 18px 14px;" id="top5-acertadas">
            <div style="color:var(--text-muted);font-size:13px;padding:12px 0;">Aguardando dados…</div>
          </div>
        </div>
      </div>

      <!-- Taxa por categoria -->
      <div class="rob-section">
        <div class="rob-section-hdr">📊 Taxa de acerto por categoria</div>
        <div id="categorias" style="padding:8px 18px 14px;">
          <div style="color:var(--text-muted);font-size:13px;padding:12px 0;">Aguardando dados…</div>
        </div>
      </div>

      <!-- Alunos -->
      <div class="rob-section">
        <div class="rob-section-hdr">
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:var(--blue)"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          Histórico por Aluno
        </div>
        <div id="students-list" style="padding:14px 18px;">
          <div style="text-align:center;padding:40px;color:var(--text-muted);">Carregando…</div>
        </div>
      </div>

      <!-- Registros no Firebase fora da lista ALUNOS_ROB (diagnóstico) -->
      <div id="nao-listados-section" style="display:none;margin-top:16px;">
        <div class="rob-section" style="border-color:#FCD34D;">
          <div class="rob-section-hdr" style="background:#FEF9C3;color:#854D0E;">
            ⚠️ Registros no Firebase fora da lista de alunos
          </div>
          <div id="nao-listados" style="padding:10px 18px;font-size:12px;color:#92400E;"></div>
        </div>
      </div>

    </div>
  </div>
</div>
<script type="module">
import { listenRoboticaTentativas } from "/js/db.js";
import { requireProfessor, renderSidebarProfessor, clearSession } from "/js/auth.js";

requireProfessor();
renderSidebarProfessor("sidebar", "robotica");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const ALUNOS_ROB = [
  { aluno:"Murillo",          turma:"8H" },
  { aluno:"Pedro Jorge",      turma:"8H" },
  { aluno:"Emanuelle",        turma:"8H" },
  { aluno:"Arthur",           turma:"8D" },
  { aluno:"Sophie",           turma:"8E" },
  { aluno:"Rafaela",          turma:"8E" },
  { aluno:"Maria Elisangela", turma:"8F" },
  { aluno:"Marlon",           turma:"8F" },
];

let questoesMap = {};
async function carregarQuestoes() {
  const results = await Promise.allSettled([1,2,3].map(n => fetch(`/dados/robotica/atividade_${n}.json`).then(r => r.json())));
  for (const r of results) {
    if (r.status === 'fulfilled') for (const q of r.value.questoes) questoesMap[q.id] = q;
  }
}
await carregarQuestoes();

let filtroAtiv = 0;
let todasTentativas = [];

window.setFiltroAtiv = function(n) {
  filtroAtiv = n;
  document.querySelectorAll('#filter-pills .pill').forEach(p =>
    p.classList.toggle('on', parseInt(p.dataset.ativ) === n));
  atualizar(todasTentativas);
};

function filtrarTentativas(tentativas) {
  // == intencional: Firebase pode retornar number ou string
  return filtroAtiv ? tentativas.filter(t => t.atividade == filtroAtiv) : tentativas;
}

function formatData(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}

function calcTop5Erradas(tentativas) {
  const erros = {}, totais = {};
  for (const t of tentativas) {
    if (!t.respostas) continue;
    for (const [qid, resp] of Object.entries(t.respostas)) {
      totais[qid] = (totais[qid] || 0) + 1;
      if (!resp.acertou) erros[qid] = (erros[qid] || 0) + 1;
    }
  }
  return Object.entries(erros).sort((a, b) => b[1] - a[1]).slice(0, 5)
    .map(([id, count]) => ({ id, count, total: totais[id] || count, q: questoesMap[id] }));
}

function calcTop5Acertadas(tentativas) {
  const acertos = {}, totais = {};
  for (const t of tentativas) {
    if (!t.respostas) continue;
    for (const [qid, resp] of Object.entries(t.respostas)) {
      totais[qid] = (totais[qid] || 0) + 1;
      if (resp.acertou) acertos[qid] = (acertos[qid] || 0) + 1;
    }
  }
  return Object.keys(totais)
    .map(id => ({ id, count: acertos[id] || 0, total: totais[id], q: questoesMap[id] }))
    .sort((a, b) => (b.count / b.total) - (a.count / a.total) || b.count - a.count)
    .slice(0, 5);
}

function calcCategoria(tentativas) {
  const cats = {};
  for (const t of tentativas) {
    if (!t.respostas) continue;
    for (const [qid, resp] of Object.entries(t.respostas)) {
      const q = questoesMap[qid];
      const cat = q?.categoria || 'Outros';
      if (!cats[cat]) cats[cat] = { acertos: 0, total: 0 };
      cats[cat].total++;
      if (resp.acertou) cats[cat].acertos++;
    }
  }
  return Object.entries(cats)
    .map(([cat, s]) => ({ cat, ...s, pct: Math.round(s.acertos / s.total * 100) }))
    .sort((a, b) => b.pct - a.pct);
}

function renderTop5Erradas(top5) {
  const el = document.getElementById('top5-erradas');
  if (!top5.length) {
    el.innerHTML = `<div style="color:var(--text-muted);font-size:13px;padding:12px 0;">Nenhum erro registrado.</div>`;
    return;
  }
  el.innerHTML = top5.map((item, i) => {
    const q = item.q;
    const enunciado = q ? q.enunciado.replace(/\n/g,' ') : item.id;
    const cat = q ? q.categoria : '—';
    const pct = item.total > 0 ? Math.round(item.count / item.total * 100) : 0;
    return `<div class="top5-item">
      <div class="top5-rank">${i + 1}</div>
      <div class="top5-info">
        <div class="top5-enunciado">${enunciado}</div>
        <div class="top5-meta">[${item.id}] ${cat}</div>
      </div>
      <div class="top5-count">${item.count}✗<br><span style="font-size:11px;color:var(--text-muted);font-weight:400;">${pct}% errou</span></div>
    </div>`;
  }).join('');
}

function renderTop5Acertadas(top5) {
  const el = document.getElementById('top5-acertadas');
  if (!top5.length) {
    el.innerHTML = `<div style="color:var(--text-muted);font-size:13px;padding:12px 0;">Sem dados suficientes.</div>`;
    return;
  }
  el.innerHTML = top5.map((item, i) => {
    const q = item.q;
    const enunciado = q ? q.enunciado.replace(/\n/g,' ') : item.id;
    const cat = q ? q.categoria : '—';
    const pct = item.total > 0 ? Math.round(item.count / item.total * 100) : 0;
    return `<div class="top5-item">
      <div class="top5-rank" style="background:var(--green);">${i + 1}</div>
      <div class="top5-info">
        <div class="top5-enunciado">${enunciado}</div>
        <div class="top5-meta">[${item.id}] ${cat}</div>
      </div>
      <div class="top5-count" style="color:var(--green);">${item.count}✓<br><span style="font-size:11px;color:var(--text-muted);font-weight:400;">${pct}% acertou</span></div>
    </div>`;
  }).join('');
}

function renderCategoria(cats) {
  const el = document.getElementById('categorias');
  if (!cats.length) {
    el.innerHTML = `<div style="color:var(--text-muted);font-size:13px;padding:12px 0;">Sem dados suficientes.</div>`;
    return;
  }
  el.innerHTML = cats.map(c => {
    const pctColor = c.pct >= 80 ? 'var(--green)' : c.pct >= 60 ? '#F59E0B' : 'var(--red)';
    return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);">
      <div style="width:130px;font-size:12px;font-weight:600;flex-shrink:0;">${c.cat}</div>
      <div class="pct-bar"><div class="pct-fill" style="width:${c.pct}%;background:${pctColor};"></div></div>
      <div style="font-size:12px;font-weight:700;color:${pctColor};min-width:38px;text-align:right;">${c.pct}%</div>
      <div style="font-size:11px;color:var(--text-muted);min-width:55px;">${c.acertos}/${c.total}</div>
    </div>`;
  }).join('');
}

function compararTentativas(ant, nova, questoes) {
  const melhorou = [], piorou = [], aindarErrado = [];
  for (const q of questoes) {
    const a = ant.respostas?.[q.id];
    const n = nova.respostas?.[q.id];
    if (!a || !n) continue;
    if (!a.acertou && n.acertou)    melhorou.push(q);
    else if (a.acertou && !n.acertou) piorou.push(q);
    else if (!a.acertou && !n.acertou) aindarErrado.push(q);
  }
  return { melhorou, piorou, aindarErrado };
}

function renderEvolucaoSVG(tents) {
  const MAX = 10;
  const slice = tents.length > MAX ? tents.slice(-MAX) : tents;
  const pts = slice.map(t => t.acertos || 0);
  if (pts.length < 2) return '';
  const first = pts[0], last = pts[pts.length - 1];
  const tc = last > first ? '#16A34A' : last < first ? '#DC2626' : '#6B7280';
  const ti = last > first ? '↑' : last < first ? '↓' : '→';
  const td = last > first ? 'Melhora' : last < first ? 'Regrediu' : 'Estável';
  const W = 240, H = 48, mL = 8, mR = 8, mT = 10, mB = 6;
  const iW = W - mL - mR, iH = H - mT - mB;
  const maxV = Math.max(...pts, 1);
  const n = pts.length;
  const xP = i => mL + (n > 1 ? (i / (n - 1)) * iW : iW / 2);
  const yP = v => mT + iH - Math.min((v / maxV) * iH, iH);
  const label = tents.length > MAX ? `Últ. ${MAX} de ${tents.length}` : `${tents.length} tentativas`;
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:240px;height:${H}px;flex-shrink:0">`;
  svg += `<polyline points="${pts.map((v, i) => `${xP(i)},${yP(v)}`).join(' ')}" fill="none" stroke="${tc}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach((v, i) => {
    svg += `<circle cx="${xP(i)}" cy="${yP(v)}" r="4" fill="${tc}" stroke="white" stroke-width="1.5"/>`;
    svg += `<text x="${xP(i)}" y="${yP(v)-7}" text-anchor="middle" font-size="8" fill="${tc}" font-weight="700">${v}</text>`;
  });
  svg += '</svg>';
  return `<div class="evolucao-bar">
    <span class="evolucao-label">${label}</span>
    ${svg}
    <div style="text-align:center;flex-shrink:0;min-width:32px">
      <div style="font-size:20px;font-weight:800;color:${tc};line-height:1">${ti}</div>
      <div style="font-size:9px;color:var(--text-muted)">${td}</div>
    </div>
  </div>`;
}

function renderTentativas(tents, atividadeN) {
  const qids = tents.length > 0 && tents[0].respostas ? Object.keys(tents[0].respostas) : [];
  const qList = qids.map(id => questoesMap[id]).filter(Boolean);
  const bestAcertos = Math.max(...tents.map(t => t.acertos || 0));

  return tents.map((t, i) => {
    const pct = t.total > 0 ? Math.round(t.acertos / t.total * 100) : 0;
    const pctColor = pct >= 80 ? 'var(--green)' : pct >= 60 ? '#F59E0B' : 'var(--red)';
    const isBest = t.acertos === bestAcertos;
    const prev = i > 0 ? tents[i - 1] : null;
    const diff = prev !== null ? t.acertos - prev.acertos : null;

    const diffBadge = diff !== null
      ? `<span class="badge" style="background:${diff > 0 ? '#DCFCE7' : diff < 0 ? '#FEE2E2' : '#F3F4F6'};color:${diff > 0 ? '#15803D' : diff < 0 ? '#B91C1C' : '#6B7280'};border-color:${diff > 0 ? '#BBF7D0' : diff < 0 ? '#FECACA' : '#E5E7EB'}">${diff > 0 ? '+' + diff : diff === 0 ? '=' : diff}</span>`
      : '';

    let detailHtml = '';
    if (prev && prev.respostas) {
      const { melhorou, piorou, aindarErrado } = compararTentativas(prev, t, qList);
      if (melhorou.length || piorou.length || aindarErrado.length) {
        detailHtml += `<div style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px">Comparação com tentativa ${i}ª:</div>`;
        if (melhorou.length) {
          detailHtml += `<div style="font-size:11px;font-weight:700;color:var(--green);margin-bottom:4px">✓ Agora acerta (${melhorou.length}):</div>`;
          detailHtml += melhorou.map(q => {
            const rdada = t.respostas?.[q.id]?.resposta_dada ?? '—';
            return `<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:7px;border:1px solid #BBF7D0;background:#DCFCE7;margin-bottom:4px;">
              <span style="flex-shrink:0">✅</span>
              <div style="flex:1;min-width:0;">
                <div style="font-size:11px;font-weight:600;color:#166534">${q.enunciado.replace(/\n/g,' ')}</div>
                <div style="font-size:10px;color:#374151;margin-top:2px">Respondeu: <strong style="color:#15803D">${rdada}</strong> · Correta: ${q.resposta}</div>
              </div>
            </div>`;
          }).join('');
        }
        if (piorou.length) {
          detailHtml += `<div style="font-size:11px;font-weight:700;color:var(--red);margin-top:6px;margin-bottom:4px">✗ Passou a errar (${piorou.length}):</div>`;
          detailHtml += piorou.map(q => {
            const rdada = t.respostas?.[q.id]?.resposta_dada ?? '—';
            return `<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:7px;border:1px solid #FECACA;background:#FEE2E2;margin-bottom:4px;">
              <span style="flex-shrink:0">❌</span>
              <div style="flex:1;min-width:0;">
                <div style="font-size:11px;font-weight:600;color:#991B1B">${q.enunciado.replace(/\n/g,' ')}</div>
                <div style="font-size:10px;color:#374151;margin-top:2px">Respondeu: <strong style="color:#DC2626">${rdada}</strong> · Correta: ${q.resposta}</div>
              </div>
            </div>`;
          }).join('');
        }
        if (aindarErrado.length) {
          detailHtml += `<div style="font-size:11px;font-weight:700;color:#D97706;margin-top:6px;margin-bottom:4px">Ainda erra (${aindarErrado.length}):</div>`;
          detailHtml += aindarErrado.map(q => {
            const rdada = t.respostas?.[q.id]?.resposta_dada ?? '—';
            return `<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:7px;border:1px solid #FED7AA;background:#FFF7ED;margin-bottom:4px;">
              <span style="flex-shrink:0">❌</span>
              <div style="flex:1;min-width:0;">
                <div style="font-size:11px;color:#92400E">${q.enunciado.replace(/\n/g,' ')}</div>
                <div style="font-size:10px;color:#374151;margin-top:2px">Respondeu: <strong style="color:#D97706">${rdada}</strong> · Correta: ${q.resposta ?? '—'}</div>
              </div>
            </div>`;
          }).join('');
        }
      } else {
        detailHtml = '<span style="font-size:11px;color:var(--text-muted)">Sem diferenças em relação à tentativa anterior.</span>';
      }
    } else if (!prev && t.respostas) {
      const allEntries = Object.entries(t.respostas);
      const oks  = allEntries.filter(([,v]) => v.acertou);
      const errs = allEntries.filter(([,v]) => !v.acertou);
      if (oks.length) {
        detailHtml += `<div style="font-size:11px;font-weight:700;color:var(--green);margin-bottom:4px">Acertou (${oks.length}):</div>`;
        detailHtml += oks.map(([id]) => {
          const q = questoesMap[id];
          return `<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:7px;border:1px solid #BBF7D0;background:#DCFCE7;margin-bottom:4px;">
            <span style="flex-shrink:0">✅</span>
            <div style="flex:1;min-width:0;font-size:11px;color:#166534">${q ? q.enunciado.replace(/\n/g,' ') : id}</div>
          </div>`;
        }).join('');
      }
      if (errs.length) {
        detailHtml += `<div style="font-size:11px;font-weight:700;color:var(--red);margin-top:${oks.length?'6px':'0'};margin-bottom:4px">Errou (${errs.length}):</div>`;
        detailHtml += errs.map(([id, resp]) => {
          const q = questoesMap[id];
          return `<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:7px;border:1px solid #FECACA;background:#FEF2F2;margin-bottom:4px;">
            <span style="flex-shrink:0">❌</span>
            <div style="flex:1;min-width:0;">
              <div style="font-size:11px;color:#991B1B">${q ? q.enunciado.replace(/\n/g,' ') : id}</div>
              <div style="font-size:10px;color:#374151;margin-top:2px">Respondeu: <strong style="color:#DC2626">${resp.resposta_dada ?? '—'}</strong> · Correta: ${q?.resposta ?? '—'}</div>
            </div>
          </div>`;
        }).join('');
      }
    } else {
      detailHtml = '<span style="font-size:11px;color:var(--text-muted)">Detalhes não disponíveis.</span>';
    }

    const uid = `${t.turma}_${t.aluno}_${atividadeN}_${i}`.replace(/[^a-zA-Z0-9]/g,'_');
    return `<div>
      <div class="tent-row${isBest ? ' melhor' : ''}" onclick="toggleDetail('${uid}')">
        <div class="tent-info-wrap">
          <div class="tent-date">${i + 1}ª tentativa${formatData(t.completadoEm) ? ' · ' + formatData(t.completadoEm) : ''}</div>
          <div class="tent-badges">
            <span class="badge badge-gold">⭐ ${t.acertos}/${t.total}</span>
            <span class="badge" style="background:${pct >= 80 ? '#DCFCE7' : pct >= 60 ? '#FFF7ED' : '#FEF2F2'};color:${pctColor};border-color:${pct >= 80 ? '#BBF7D0' : pct >= 60 ? '#FED7AA' : '#FECACA'}">📊 ${pct}%</span>
            ${diffBadge}
            ${isBest ? `<span class="badge badge-gold">🏆 Melhor</span>` : ''}
          </div>
        </div>
        <svg viewBox="0 0 24 24" id="arr-${uid}" style="width:14px;height:14px;fill:var(--text-muted);flex-shrink:0;transition:transform .2s"><path d="M7 10l5 5 5-5z"/></svg>
      </div>
      <div class="tent-detail-body" id="det-${uid}" style="display:none">
        ${detailHtml}
      </div>
    </div>`;
  }).join('');
}

window.toggleDetail = (uid) => {
  const det = document.getElementById(`det-${uid}`);
  const arr = document.getElementById(`arr-${uid}`);
  if (!det) return;
  const open = det.style.display !== 'none';
  det.style.display = open ? 'none' : 'block';
  if (arr) arr.style.transform = open ? '' : 'rotate(180deg)';
};

function renderAlunos(tentativas) {
  const porAluno = {};
  for (const t of tentativas) {
    const k = `${t.turma}|${t.aluno}`;
    if (!porAluno[k]) porAluno[k] = {};
    const an = t.atividade;
    if (!porAluno[k][an]) porAluno[k][an] = [];
    porAluno[k][an].push(t);
  }
  for (const k of Object.keys(porAluno)) {
    for (const an of Object.keys(porAluno[k])) {
      porAluno[k][an].sort((a, b) => (a.completadoEm || 0) - (b.completadoEm || 0));
    }
  }

  const comResposta = ALUNOS_ROB.filter(a => porAluno[`${a.turma}|${a.aluno}`]).length;
  document.getElementById('status-geral').textContent = `${comResposta}/${ALUNOS_ROB.length} com tentativas`;

  const keysListados = new Set(ALUNOS_ROB.map(a => `${a.turma}|${a.aluno}`));
  const naoListados = Object.keys(porAluno).filter(k => !keysListados.has(k));
  const secNL = document.getElementById('nao-listados-section');
  if (naoListados.length) {
    secNL.style.display = 'block';
    document.getElementById('nao-listados').innerHTML =
      `<p style="margin:0 0 8px;font-weight:700;">⚠️ ${naoListados.length} aluno(s) salvaram dados mas não constam em ALUNOS_ROB:</p>` +
      naoListados.map(k => {
        const [turmaK, alunoK] = k.split('|');
        const total = Object.values(porAluno[k]).flat().length;
        return `<div style="padding:4px 0;border-bottom:1px dashed #FCD34D;">
          <strong>${alunoK}</strong> — Turma: <strong>${turmaK}</strong>
          — ${total} tentativa(s)
          <span style="font-size:11px;color:#B45309;margin-left:6px;">(nome/turma não bate com a lista)</span>
        </div>`;
      }).join('');
  } else {
    secNL.style.display = 'none';
  }

  const ativsMostrar = filtroAtiv ? [filtroAtiv] : [1, 2, 3];

  const cards = ALUNOS_ROB.map((a, si) => {
    const k = `${a.turma}|${a.aluno}`;
    const dados = porAluno[k] || {};

    // Overall taxa across activities shown
    let totalAc = 0, totalTot = 0;
    for (const n of ativsMostrar) {
      const tents = dados[n] || [];
      if (tents.length) {
        const best = tents.reduce((m, t) => (t.acertos || 0) > (m.acertos || 0) ? t : m, tents[0]);
        totalAc  += best.acertos || 0;
        totalTot += best.total  || 0;
      }
    }
    const taxaGeral = totalTot > 0 ? Math.round(totalAc / totalTot * 100) : null;
    const taxaColor = taxaGeral !== null ? (taxaGeral >= 80 ? 'var(--green)' : taxaGeral >= 60 ? '#D97706' : 'var(--red)') : 'var(--text-muted)';

    // Activity sections
    const ativSections = ativsMostrar.map(n => {
      const tents = dados[n] || [];
      if (!tents.length) {
        return `<div class="ativ-section">
          <div class="ativ-section-hdr">Atividade ${n}</div>
          <div style="font-size:12px;color:var(--text-muted)">Nenhuma tentativa registrada.</div>
        </div>`;
      }
      const bestAc  = Math.max(...tents.map(t => t.acertos || 0));
      const tot     = tents[0].total || 0;
      const pctBest = tot > 0 ? Math.round(bestAc / tot * 100) : 0;
      const pctColor = pctBest >= 80 ? 'var(--green)' : pctBest >= 60 ? '#D97706' : 'var(--red)';

      return `<div class="ativ-section">
        <div class="ativ-section-hdr">
          Atividade ${n}
          <span class="badge badge-blue">${tents.length} tentativa${tents.length > 1 ? 's' : ''}</span>
        </div>
        <div class="ativ-metrics">
          <div class="metric-box">
            <div class="metric-val" style="color:var(--gold)">⭐ ${bestAc}/${tot}</div>
            <div class="metric-lbl">Melhor resultado</div>
          </div>
          <div class="metric-box">
            <div class="metric-val" style="color:var(--blue)">${tents.length}</div>
            <div class="metric-lbl">Tentativas</div>
          </div>
          <div class="metric-box">
            <div class="metric-val" style="color:${pctColor}">${pctBest}%</div>
            <div class="metric-lbl">% Melhor</div>
          </div>
        </div>
        ${renderEvolucaoSVG(tents)}
        <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 6px">Tentativas</div>
        ${renderTentativas(tents, n)}
      </div>`;
    }).join('');

    return `<div class="st-card">
      <div class="st-card-hdr" onclick="toggleAluno(${si})">
        <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:var(--text-muted);flex-shrink:0"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        <div style="flex:1">
          <div class="st-name">${a.aluno}<span class="st-turma">Turma ${a.turma}</span></div>
          ${taxaGeral !== null ? `<div style="margin-top:4px"><span class="badge" style="background:${taxaGeral>=80?'#DCFCE7':taxaGeral>=60?'#FFF7ED':'#FEF2F2'};color:${taxaColor};border-color:${taxaGeral>=80?'#BBF7D0':taxaGeral>=60?'#FED7AA':'#FECACA'}">📊 ${taxaGeral}% geral</span></div>` : ''}
        </div>
        <svg viewBox="0 0 24 24" id="arrow-${si}" style="width:18px;height:18px;fill:var(--text-muted);flex-shrink:0;transition:transform .2s"><path d="M7 10l5 5 5-5z"/></svg>
      </div>
      <div class="st-card-body" id="body-${si}">
        ${ativSections}
      </div>
    </div>`;
  }).join('');

  document.getElementById('students-list').innerHTML = cards;
}

window.toggleAluno = (i) => {
  const body  = document.getElementById(`body-${i}`);
  const arrow = document.getElementById(`arrow-${i}`);
  if (!body) return;
  const open = body.classList.toggle('open');
  if (arrow) arrow.style.transform = open ? 'rotate(180deg)' : '';
};

function atualizar(tentativas) {
  todasTentativas = tentativas;
  const filtradas = filtrarTentativas(tentativas);
  renderTop5Erradas(calcTop5Erradas(filtradas));
  renderTop5Acertadas(calcTop5Acertadas(filtradas));
  renderCategoria(calcCategoria(filtradas));
  renderAlunos(tentativas);
}

listenRoboticaTentativas(atualizar);
</script>
</body>
</html>
