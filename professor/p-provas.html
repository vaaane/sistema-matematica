<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>document.documentElement.setAttribute("data-theme","dark");</script>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#15102a">
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Provas e Testes — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
<style>
  .barra{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .turma-sel{padding:9px 13px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .turma-sel option{background:var(--card);color:var(--text)}
  .sec-titulo{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;margin:22px 2px 12px}
  .sec-titulo svg{width:19px;height:19px;fill:var(--purple)}
  .sec-titulo .btn{margin-left:auto}

  .tag{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:6px;flex-shrink:0}
  .tag.prova{background:rgba(239,68,68,.16);color:#f79a9a;border:1px solid rgba(239,68,68,.35)}
  .tag.teste{background:rgba(96,165,250,.16);color:#8ec0ff;border:1px solid rgba(96,165,250,.35)}

  .prova-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--border)}
  .prova-row:last-child{border-bottom:0}
  .prova-main{flex:1;min-width:0}
  .prova-top{display:flex;align-items:center;gap:9px;margin-bottom:3px}
  .prova-cont{font-size:14.5px;font-weight:700}
  .prova-val{font-size:12.5px;color:var(--text-muted)}
  .prova-val b{color:var(--gold)}
  .prova-acoes{display:flex;gap:7px;flex-shrink:0}
  .icon-btn{border:1px solid var(--border);background:transparent;color:var(--text-muted);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}
  .icon-btn:hover{color:var(--text);border-color:rgba(155,48,255,.5)}
  .icon-btn.del:hover{color:#f87171;border-color:rgba(239,68,68,.5)}

  .ag-data{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .ag-data input[type=date]{padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:13px;color-scheme:dark}
  .ag-status{font-size:11.5px;font-weight:700}
  .ag-status.on{color:var(--green)} .ag-status.off{color:var(--text-muted)}

  .vazio{color:var(--text-muted);text-align:center;padding:28px 16px;font-size:14px}
  .banner-info{background:rgba(155,48,255,.06);border:1px solid rgba(155,48,255,.2);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--text-muted);margin-bottom:16px;line-height:1.5}
  .banner-info b{color:#c79bff}

  .tipo-pick{display:flex;gap:8px}
  .tipo-opt{flex:1;padding:12px;border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;font-size:13px;font-weight:700;color:var(--text-muted);background:rgba(255,255,255,.02)}
  .tipo-opt.on{border-color:var(--purple);background:rgba(155,48,255,.12);color:#c79bff}
  .f{margin-bottom:14px}
  .f-label{display:block;font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
  .modal-overlay.on{display:flex}
  .modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:440px;width:100%;box-shadow:var(--shadow)}
  .modal-box-body{padding:20px 22px}
  .modal-box-title{font-size:17px;font-weight:800;margin-bottom:16px}
  .modal-acoes{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left"><div class="topbar-title">📝 Provas e Testes</div><div class="topbar-sub" id="sub">Carregando…</div></div>
      <div class="topbar-right"><div class="bim-tabs" id="bimTabs"></div></div>
    </div>
    <div class="content">

      <div class="banner-info">
        Cadastre a prova <b>uma vez</b> no catálogo (conteúdo + valor). Depois, em <b>Agenda da turma</b>, é só marcar a <b>data</b> de cada turma. O aluno vê as avaliações <b>futuras</b> na página inicial.
      </div>

      <div class="sec-titulo">
        <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
        Catálogo de provas
        <button class="btn btn-blue" onclick="abrirNova()">＋ Nova prova</button>
      </div>
      <div class="card" style="padding:0"><div id="catalogo"><div class="vazio">Carregando…</div></div></div>

      <div class="barra" style="margin-top:22px">
        <div class="sec-titulo" style="margin:0">
          <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14v11z"/></svg>
          Agenda da turma
        </div>
        <select class="turma-sel" id="turmaSel"></select>
      </div>
      <div class="card" style="padding:0"><div id="agenda"><div class="vazio">Selecione uma turma.</div></div></div>

    </div>
  </div>
</div>

<div class="modal-overlay" id="ov">
  <div class="modal-box"><div class="modal-box-body">
    <div class="modal-box-title" id="mTitulo">Nova prova</div>
    <div class="f">
      <label class="f-label">Tipo</label>
      <div class="tipo-pick">
        <div class="tipo-opt on" id="optProva" onclick="setTipo('prova')">📝 Prova</div>
        <div class="tipo-opt" id="optTeste" onclick="setTipo('teste')">🧪 Teste</div>
      </div>
    </div>
    <div class="f">
      <label class="f-label">Conteúdo (o que cai)</label>
      <input class="input" id="mCont" placeholder="Ex.: Equações do 1º Grau — representação e simplificação">
    </div>
    <div class="f">
      <label class="f-label">Valor (pontos)</label>
      <input class="input" id="mVal" type="number" step="0.5" min="0" placeholder="Ex.: 10">
    </div>
    <div class="modal-acoes">
      <button class="btn" onclick="fechar()">Cancelar</button>
      <button class="btn btn-blue" onclick="salvar()">Salvar</button>
    </div>
  </div></div>
</div>

<script type="module">
import { requireProfessor, renderSidebarProfessor } from "/js/auth.js";
import { db } from "/js/firebase-config.js";
import { ALUNOS_POR_TURMA } from "/js/constants.js";
import { montarSeletorBimestre } from "/js/bimestre-seletor.js";
import { ref, get, set, update, remove, push }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

requireProfessor();
renderSidebarProfessor("sidebar", "provas");

let bimestre = 1, turma = "", catalogo = {}, agenda = {}, editId = null, tipoSel = "prova";

const TURMAS = Object.keys(ALUNOS_POR_TURMA).sort();
const selT = document.getElementById("turmaSel");
selT.innerHTML = TURMAS.map(t=>`<option value="${t}">${t}</option>`).join("");
turma = TURMAS[0] || "";
selT.value = turma;
selT.addEventListener("change", ()=>{ turma = selT.value; carregarAgenda(); });

bimestre = montarSeletorBimestre("bimTabs", { onChange: (b)=>{ bimestre = b; carregarAgenda(); } });

const fmtVal = v => (Number(v)||0).toFixed(1).replace(".", ",");
const hoje = () => new Date().toISOString().slice(0,10);

function labelTipo(t){ return t==="teste" ? "Teste" : "Prova"; }

async function carregar(){
  document.getElementById("sub").textContent = `Turma ${turma} · ${bimestre}º bimestre`;
  try{
    const snap = await get(ref(db, "provas_catalogo"));
    catalogo = snap.exists() ? snap.val() : {};
  }catch(e){ console.error(e); catalogo = {}; }
  renderCatalogo();
  await carregarAgenda();
}

async function carregarAgenda(){
  document.getElementById("sub").textContent = `Turma ${turma} · ${bimestre}º bimestre`;
  try{
    const snap = await get(ref(db, `provas/${turma}/${bimestre}`));
    agenda = snap.exists() ? snap.val() : {};
  }catch(e){ console.error(e); agenda = {}; }
  renderAgenda();
}

function renderCatalogo(){
  const ids = Object.keys(catalogo);
  const el = document.getElementById("catalogo");
  if(!ids.length){ el.innerHTML = `<div class="vazio">Nenhuma prova cadastrada ainda. Clique em “Nova prova”.</div>`; return; }
  ids.sort((a,b)=>(catalogo[b].criadoEm||0)-(catalogo[a].criadoEm||0));
  el.innerHTML = ids.map(id=>{
    const p = catalogo[id];
    return `<div class="prova-row">
      <div class="prova-main">
        <div class="prova-top"><span class="tag ${p.tipo||"prova"}">${labelTipo(p.tipo)}</span></div>
        <div class="prova-cont">${p.conteudo||"(sem conteúdo)"}</div>
        <div class="prova-val">Vale <b>${fmtVal(p.valor)} pts</b></div>
      </div>
      <div class="prova-acoes">
        <button class="icon-btn" onclick="editar('${id}')">Editar</button>
        <button class="icon-btn del" onclick="excluir('${id}')">Excluir</button>
      </div>
    </div>`;
  }).join("");
}

function renderAgenda(){
  const ids = Object.keys(catalogo);
  const el = document.getElementById("agenda");
  if(!ids.length){ el.innerHTML = `<div class="vazio">Cadastre uma prova no catálogo primeiro.</div>`; return; }
  ids.sort((a,b)=>(catalogo[b].criadoEm||0)-(catalogo[a].criadoEm||0));
  el.innerHTML = ids.map(id=>{
    const p = catalogo[id];
    const data = agenda[id] || "";
    return `<div class="prova-row">
      <div class="prova-main">
        <div class="prova-top"><span class="tag ${p.tipo||"prova"}">${labelTipo(p.tipo)}</span></div>
        <div class="prova-cont">${p.conteudo||"(sem conteúdo)"}</div>
        <div class="prova-val">Vale <b>${fmtVal(p.valor)} pts</b></div>
      </div>
      <div class="ag-data">
        <span class="ag-status ${data?"on":"off"}">${data?"agendada":"—"}</span>
        <input type="date" value="${data}" onchange="setData('${id}', this.value)">
      </div>
    </div>`;
  }).join("");
}

window.setData = async function(id, val){
  try{
    if(val) await set(ref(db, `provas/${turma}/${bimestre}/${id}`), val);
    else    await remove(ref(db, `provas/${turma}/${bimestre}/${id}`));
    await carregarAgenda();
  }catch(e){ console.error(e); alert("Erro ao salvar a data."); }
};

window.setTipo = function(t){
  tipoSel = t;
  document.getElementById("optProva").classList.toggle("on", t==="prova");
  document.getElementById("optTeste").classList.toggle("on", t==="teste");
};

window.abrirNova = function(){
  editId = null; setTipo("prova");
  document.getElementById("mTitulo").textContent = "Nova prova";
  document.getElementById("mCont").value = "";
  document.getElementById("mVal").value = "";
  document.getElementById("ov").classList.add("on");
};

window.editar = function(id){
  const p = catalogo[id]; if(!p) return;
  editId = id; setTipo(p.tipo||"prova");
  document.getElementById("mTitulo").textContent = "Editar prova";
  document.getElementById("mCont").value = p.conteudo||"";
  document.getElementById("mVal").value = p.valor!=null ? p.valor : "";
  document.getElementById("ov").classList.add("on");
};

window.fechar = function(){ document.getElementById("ov").classList.remove("on"); };

window.salvar = async function(){
  const conteudo = document.getElementById("mCont").value.trim();
  const valor = parseFloat((document.getElementById("mVal").value||"").replace(",", ".")) || 0;
  if(!conteudo){ alert("Descreva o conteúdo da prova."); return; }
  try{
    if(editId){
      await update(ref(db, `provas_catalogo/${editId}`), { tipo:tipoSel, conteudo, valor });
    }else{
      const novo = push(ref(db, "provas_catalogo"));
      await set(novo, { tipo:tipoSel, conteudo, valor, criadoEm:Date.now() });
    }
    fechar(); await carregar();
  }catch(e){ console.error(e); alert("Erro ao salvar."); }
};

window.excluir = async function(id){
  if(!confirm("Excluir esta prova do catálogo? As datas agendadas dela nas turmas também deixam de aparecer.")) return;
  try{
    await remove(ref(db, `provas_catalogo/${id}`));
    await carregar();
  }catch(e){ console.error(e); alert("Erro ao excluir."); }
};

carregar();
</script>
</body>
</html>
