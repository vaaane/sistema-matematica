<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Relatório — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    /* ── Filter bar ──────────────────────────────── */
    .filter-bar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);}
    .f-group{display:flex;flex-direction:column;gap:5px;}
    .f-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);}
    .pill-row{display:flex;gap:5px;flex-wrap:wrap;}
    .pill{padding:5px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:all .15s;}
    .pill.on{border-color:var(--blue);background:var(--blue);color:#fff;}

    /* ── Section headers ─────────────────────── */
    .sec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin:24px 0 12px;display:flex;align-items:center;gap:8px;}
    .sec::before{content:"";width:3px;height:16px;border-radius:2px;background:currentColor;display:block;flex-shrink:0;}

    /* ── Questões erradas / acertadas ────────── */
    .qcard{padding:13px 15px;border-radius:10px;border:1px solid var(--border);margin-bottom:8px;}
    .qcard.err{background:#FEF2F2;border-color:#FECACA;}
    .qcard.ok{background:#F0FDF4;border-color:#BBF7D0;}
    .q-enun{font-size:13px;font-weight:600;line-height:1.5;margin-bottom:8px;}
    .q-meta{font-size:11px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    .rate-wrap{flex:1;min-width:120px;}
    .rate-bar{height:7px;border-radius:4px;background:var(--border);overflow:hidden;}
    .rate-fill{height:100%;border-radius:4px;}

    /* ── Performance badge ───────────────────── */
    .pf{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;display:inline-block;}
    .pf.hi{background:#DCFCE7;color:#15803D;}
    .pf.md{background:#FEF9C3;color:#854D0E;}
    .pf.lo{background:#FEE2E2;color:#B91C1C;}

    /* ── Sortable table ──────────────────────── */
    .sth{cursor:pointer;user-select:none;white-space:nowrap;}
    .sth:hover{background:#F9FAFB;}
    .sth::after{content:" ⇅";font-size:9px;color:var(--border);}
    .sth.asc::after{content:" ↑";color:var(--blue);}
    .sth.desc::after{content:" ↓";color:var(--blue);}
    .table th,.table td{font-size:11px;padding:8px 10px;}
    .table th{font-size:10px;}
    .enun-col{max-width:260px;font-size:11px;line-height:1.4;}

    /* ── Visão geral turma row ───────────────── */
    .tr-turma{cursor:pointer;}
    .tr-turma:hover td{background:#F9FAFB;}
    .tr-turma td:first-child{font-size:14px;font-weight:800;}
    .expand-row>td{padding:0;}
    .expand-inner{padding:16px 18px;background:#F8FAFC;border-top:2px solid var(--border);}
    .exp-icon{font-size:11px;color:var(--text-muted);display:inline-block;transition:transform .2s;}
    .exp-icon.open{transform:rotate(180deg);}
    .best-cell{background:rgba(253,224,71,.22)!important;}
    .best-taxa{background:rgba(34,197,94,.14)!important;}
    .best-jog{background:rgba(59,130,246,.11)!important;}

    /* ── Expand sub-sections ─────────────────── */
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
    .sub-sec-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;}
    .sub-table th,.sub-table td{font-size:11px;padding:6px 9px;}
    .sub-table th{font-size:10px;}
    .nao-jogou{color:var(--text-muted);font-style:italic;}

    /* ── Misc ────────────────────────────────── */
    .no-data{text-align:center;padding:32px;color:var(--text-muted);font-size:13px;}
    .loading{text-align:center;padding:20px;color:var(--text-muted);font-size:12px;}

    @media print{
      .sidebar,.topbar-right,.filter-bar{display:none!important;}
      .layout{grid-template-columns:1fr;}
      .expand-row{display:table-row!important;}
      .expand-inner{background:white;}
    }
    @media(max-width:700px){
      .two-col{grid-template-columns:1fr;}
      .enun-col{max-width:140px;}
      .filter-bar{gap:10px;}
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Relatório por Atividade</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
      <div class="topbar-right" style="gap:8px;display:flex">
        <button class="btn btn-green" id="btn-pdf" onclick="exportarPDF()" style="display:none">
          <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
          Imprimir / PDF
        </button>
      </div>
    </div>

    <div class="content" style="padding-bottom:0">
      <div class="filter-bar">
        <div class="f-group">
          <span class="f-label">Atividade</span>
          <div class="select-wrap" style="min-width:220px">
            <select id="sel-ativ" class="input" style="padding:8px 30px 8px 12px;font-size:13px"
              onchange="onFC()"></select>
          </div>
        </div>
        <div class="f-group">
          <span class="f-label">Turmas</span>
          <div class="pill-row" id="pill-row"></div>
        </div>
        <div class="f-group" style="margin-left:auto">
          <button class="btn btn-ghost" style="font-size:12px" onclick="selecionarTodasTurmas()">Todas</button>
        </div>
      </div>
    </div>

    <div class="content" id="content">
      <div class="loading">Carregando…</div>
    </div>
  </div>
</div>

<script type="module">
import { ALUNOS_POR_TURMA, LISTA_ATIVIDADES } from "/js/constants.js";
import { getResultados, getDetalhes } from "/js/db.js";
import { requireProfessor, renderSidebarProfessor, clearSession } from "/js/auth.js";

requireProfessor();
renderSidebarProfessor("sidebar", "relatorio");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

// ── State ─────────────────────────────────────────
const TURMAS = Object.keys(ALUNOS_POR_TURMA);
let allResults = null;
const detCache = {}; // resultId → questoes[]
let selectedTurmas = new Set(TURMAS);
let expandedTurma  = null;
let vgSort = { col: 'jogadores', dir: 'desc' };
let aqSort = { col: 'taxaErro',  dir: 'desc' };

// ── Build selectors ───────────────────────────────
const selAtiv  = document.getElementById("sel-ativ");
const pillRow  = document.getElementById("pill-row");

// Activities: from LISTA_ATIVIDADES + any extra found in results (added after load)
LISTA_ATIVIDADES.forEach(a => {
  const o = document.createElement("option");
  o.value = o.textContent = a.nome;
  selAtiv.appendChild(o);
});

// Turma pills
TURMAS.forEach(t => {
  const btn = document.createElement("button");
  btn.className = "pill on";
  btn.id = `pill-${t}`;
  btn.textContent = t;
  btn.onclick = () => {
    if (selectedTurmas.has(t)) {
      if (selectedTurmas.size <= 1) return;
      selectedTurmas.delete(t);
      btn.classList.remove("on");
    } else {
      selectedTurmas.add(t);
      btn.classList.add("on");
    }
    onFC();
  };
  pillRow.appendChild(btn);
});

window.selecionarTodasTurmas = () => {
  TURMAS.forEach(t => { selectedTurmas.add(t); document.getElementById(`pill-${t}`)?.classList.add("on"); });
  onFC();
};

// ── Load + init ───────────────────────────────────
allResults = await getResultados();

// Add to selector any activity present in results but not in LISTA_ATIVIDADES
const ativNomes = new Set(LISTA_ATIVIDADES.map(a => a.nome));
allResults.forEach(r => {
  if (r.atividade && !ativNomes.has(r.atividade)) {
    ativNomes.add(r.atividade);
    const o = document.createElement("option");
    o.value = o.textContent = r.atividade;
    selAtiv.appendChild(o);
  }
});

if (selAtiv.options.length) onFC();
else document.getElementById("content").innerHTML = `<div class="no-data">Nenhuma atividade cadastrada.</div>`;

// ── Helpers ───────────────────────────────────────
function pfCls(v, hi = 70, lo = 50) { return v >= hi ? 'hi' : v >= lo ? 'md' : 'lo'; }
function pct(a, b) { return b > 0 ? Math.round(a / b * 100) : 0; }
function trunc(s, n = 80) { return s && s.length > n ? s.slice(0, n) + '…' : (s || '—'); }
function numTent(q) {
  if (Array.isArray(q.tentativas)) return q.tentativas.length;
  return typeof q.tentativas === 'number' ? q.tentativas : 1;
}

// ── Compute per-turma stats ───────────────────────
function computeStats(ativ, turma) {
  const cadastrados = ALUNOS_POR_TURMA[turma] || [];
  const sessoes = allResults.filter(r => r.concluido && r.atividade === ativ && r.turma === turma);

  const am = {};
  for (const al of cadastrados)
    am[al] = { sessoes: 0, melhorPts: 0, acertos: 0, erros: 0, respondidas: 0, qErros: {} };

  for (const r of sessoes) {
    if (!am[r.aluno]) am[r.aluno] = { sessoes: 0, melhorPts: 0, acertos: 0, erros: 0, respondidas: 0, qErros: {} };
    const d = am[r.aluno];
    d.sessoes++;
    d.melhorPts   = Math.max(d.melhorPts,   r.pontuacao  || 0);
    d.acertos     += r.acertos     || 0;
    d.erros       += r.erros       || 0;
    d.respondidas += r.respondidas || 0;
    for (const q of (detCache[r.id] || [])) {
      if (!q.acertou) {
        const k = q.enunciado || q.pergunta || '?';
        d.qErros[k] = (d.qErros[k] || 0) + 1;
      }
    }
  }

  const jogadores = cadastrados.filter(al => am[al].sessoes > 0);
  const naoJogaram = cadastrados.filter(al => !am[al] || am[al].sessoes === 0);
  const byPts = jogadores.map(al => ({ aluno: al, pts: am[al].melhorPts })).sort((a, b) => b.pts - a.pts);
  const somaM = byPts.reduce((s, x) => s + x.pts, 0);
  const totAc = sessoes.reduce((s, r) => s + (r.acertos    || 0), 0);
  const totRe = sessoes.reduce((s, r) => s + (r.respondidas || 0), 0);

  return {
    turma,
    cadastrados: cadastrados.length,
    jogadores: jogadores.length,
    naoJogaram,
    sessoes: sessoes.length,
    mediaPts: jogadores.length ? Math.round(somaM / jogadores.length) : 0,
    mediaSessoes: jogadores.length ? Math.round(sessoes.length / jogadores.length * 10) / 10 : 0,
    maior: byPts[0] || null,
    maiorPts: byPts[0]?.pts || 0,
    menor: byPts.length ? byPts[byPts.length - 1] : null,
    taxaAcerto: pct(totAc, totRe),
    totAcertos: totAc, totRespondidas: totRe,
    am, jogadores,
  };
}

// ── Compute question aggregation ──────────────────
function computeQuestoes(ativ, turmas) {
  const sessoes = allResults.filter(r => r.concluido && r.atividade === ativ && turmas.has(r.turma));
  const map = {};
  for (const r of sessoes) {
    for (const q of (detCache[r.id] || [])) {
      const k = q.enunciado || q.pergunta || '?';
      if (!map[k]) map[k] = { enun: k, acertos: 0, erros: 0, t1: 0, t2: 0, t3: 0, t4: 0 };
      const nt = numTent(q);
      if (q.acertou) {
        map[k].acertos++;
        if      (nt <= 1) map[k].t1++;
        else if (nt === 2) map[k].t2++;
        else if (nt === 3) map[k].t3++;
        else               map[k].t4++;
      } else {
        map[k].erros++;
      }
    }
  }
  return Object.values(map).map(q => ({
    ...q,
    total: q.acertos + q.erros,
    taxaErro: pct(q.erros, q.acertos + q.erros),
  }));
}

// ── Main filter handler ───────────────────────────
async function onFC() {
  const ativ = selAtiv.value;
  if (!ativ) return;
  document.getElementById("topbar-sub").textContent = ativ;
  document.getElementById("btn-pdf").style.display = "";

  const allStats = buildAllStats(ativ);

  const toLoad = allResults.filter(r =>
    r.concluido && r.atividade === ativ && !(r.id in detCache));

  if (toLoad.length > 0) {
    renderPage(allStats, [], false);
    await Promise.all(toLoad.map(async r => { detCache[r.id] = await getDetalhes(r.id); }));
    // Re-compute with details now available
    for (const t of selectedTurmas) allStats[t] = computeStats(ativ, t);
  }

  const questoes = computeQuestoes(ativ, selectedTurmas);
  renderPage(allStats, questoes, true);
}
window.onFC = onFC;

function buildAllStats(ativ) {
  const m = {};
  for (const t of selectedTurmas) m[t] = computeStats(ativ, t);
  return m;
}

// ── Master render ─────────────────────────────────
function renderPage(allStats, questoes, loaded) {
  const statsArr = [...selectedTurmas].map(t => allStats[t]);

  document.getElementById("content").innerHTML =
    renderQdestak(questoes, loaded) +
    renderVG(statsArr) +
    renderAQ(questoes, loaded);

  // Restore expanded turma
  if (expandedTurma && allStats[expandedTurma]) {
    const row = document.getElementById(`xrow-${expandedTurma}`);
    if (row) {
      row.style.display = '';
      const tQ = computeQuestoes(selAtiv.value, new Set([expandedTurma]));
      fillExpand(expandedTurma, allStats[expandedTurma], tQ);
      document.getElementById(`xi-${expandedTurma}`)?.classList.add("open");
    }
  }
}

// ── Section: Questões destaque ────────────────────
function renderQdestak(questoes, loaded) {
  const erradas   = [...questoes].sort((a, b) => b.taxaErro - a.taxaErro).slice(0, 5);
  const acertadas = [...questoes].sort((a, b) => b.acertos  - a.acertos ).slice(0, 5);

  const noQ = !loaded
    ? `<div class="loading">⏳ Carregando detalhes de questões…</div>`
    : `<div class="no-data" style="padding:16px;font-size:12px">Sem detalhes disponíveis.<br><span style="font-size:11px;color:var(--text-muted)">(Modos Clássico e Competição+ salvam detalhes por questão; Competição ao vivo não.)</span></div>`;

  const mkCard = (q, cls) => {
    const isErr  = cls === 'err';
    const rate   = isErr ? q.taxaErro : pct(q.acertos, q.total);
    const color  = isErr ? 'var(--red)' : 'var(--green)';
    const label  = isErr
      ? `${q.erros} erro${q.erros!==1?'s':''} de ${q.total} resposta${q.total!==1?'s':''}`
      : `${q.acertos} acerto${q.acertos!==1?'s':''} de ${q.total} resposta${q.total!==1?'s':''}`;
    return `
      <div class="qcard ${cls}">
        <div class="q-enun">${q.enun}</div>
        <div class="q-meta">
          <div class="rate-wrap">
            <div class="rate-bar"><div class="rate-fill" style="width:${rate}%;background:${color}"></div></div>
          </div>
          <span style="font-size:20px;font-weight:800;color:${color};min-width:46px;text-align:right">${rate}%</span>
          <span style="color:var(--text-muted)">${label}</span>
        </div>
      </div>`;
  };

  return `
    <div class="sec" style="color:#B91C1C">❌ Questões mais difíceis — todas as turmas selecionadas</div>
    ${!loaded || !erradas.length ? noQ : erradas.map(q => mkCard(q,'err')).join('')}

    ${loaded && acertadas.length ? `
    <div class="sec" style="color:#15803D;margin-top:20px">✅ Questões mais fáceis — todas as turmas selecionadas</div>
    ${acertadas.map(q => mkCard(q,'ok')).join('')}` : ''}`;
}

// ── Section: Visão geral ──────────────────────────
function renderVG(statsArr) {
  if (!statsArr.length) return '';

  const sorted = [...statsArr].sort((a, b) => {
    const va = a[vgSort.col] ?? 0, vb = b[vgSort.col] ?? 0;
    if (typeof va === 'string') return vgSort.dir === 'asc' ? va.localeCompare(vb,'pt-BR') : vb.localeCompare(va,'pt-BR');
    return vgSort.dir === 'asc' ? va - vb : vb - va;
  });

  const maxMedia = Math.max(...statsArr.map(s => s.mediaPts));
  const maxTaxa  = Math.max(...statsArr.map(s => s.taxaAcerto));
  const maxJog   = Math.max(...statsArr.map(s => s.jogadores));

  const th = (col, label) => {
    const cls = vgSort.col === col ? (vgSort.dir === 'asc' ? 'asc' : 'desc') : '';
    return `<th class="sth ${cls}" onclick="sortVG('${col}')">${label}</th>`;
  };

  const rows = sorted.map(s => {
    const pctJog = pct(s.jogadores, s.cadastrados);
    const cMedia = s.mediaPts    === maxMedia && maxMedia > 0 ? 'class="best-cell"' : '';
    const cTaxa  = s.taxaAcerto  === maxTaxa  && maxTaxa  > 0 ? 'class="best-taxa"' : '';
    const cJog   = s.jogadores   === maxJog   && maxJog   > 0 ? 'class="best-jog"'  : '';
    return `
      <tr class="tr-turma" onclick="toggleExpand('${s.turma}')">
        <td>${s.turma}</td>
        <td ${cJog}>
          <strong>${s.jogadores}</strong><span style="color:var(--text-muted)">/${s.cadastrados}</span>
          <span class="pf ${pfCls(pctJog)}" style="margin-left:4px">${pctJog}%</span>
        </td>
        <td ${cMedia}><strong style="color:var(--gold)">${s.mediaPts}</strong></td>
        <td>${s.maior ? `<span style="font-size:12px">${s.maior.aluno}</span><span style="font-size:11px;color:var(--gold);font-weight:700;display:block">${s.maior.pts} pts</span>` : '—'}</td>
        <td ${cTaxa}><span class="pf ${pfCls(s.taxaAcerto)}">${s.taxaAcerto}%</span></td>
        <td>${s.mediaSessoes.toFixed(1)}</td>
        <td style="text-align:center"><span class="exp-icon" id="xi-${s.turma}">▼</span></td>
      </tr>
      <tr class="expand-row" id="xrow-${s.turma}" style="display:none">
        <td colspan="7"><div class="expand-inner" id="xinner-${s.turma}">
          <div class="loading">Carregando…</div>
        </div></td>
      </tr>`;
  }).join('');

  return `
    <div class="sec" style="color:var(--blue);margin-top:28px">📊 Visão Geral por Turma</div>
    <div class="card" style="padding:0;overflow:auto;margin-bottom:8px">
      <table class="table" style="min-width:560px">
        <thead><tr>
          ${th('turma','Turma')}
          ${th('jogadores','Alunos')}
          ${th('mediaPts','Média pts')}
          <th>Maior pts</th>
          ${th('taxaAcerto','Taxa acerto')}
          ${th('mediaSessoes','Sessões/aluno')}
          <th style="width:28px"></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p style="font-size:11px;color:var(--text-muted);margin-bottom:0">Clique em uma turma para expandir o detalhamento por aluno.</p>`;
}

// ── Expand turma ──────────────────────────────────
window.toggleExpand = function(turma) {
  const row  = document.getElementById(`xrow-${turma}`);
  const icon = document.getElementById(`xi-${turma}`);
  if (!row) return;

  const isOpen = row.style.display !== 'none';

  // Close current
  if (expandedTurma) {
    document.getElementById(`xrow-${expandedTurma}`)?.style && (document.getElementById(`xrow-${expandedTurma}`).style.display = 'none');
    document.getElementById(`xi-${expandedTurma}`)?.classList.remove('open');
    const prev = expandedTurma;
    expandedTurma = null;
    if (prev === turma) return; // was already open → just close
  }

  row.style.display = '';
  icon?.classList.add('open');
  expandedTurma = turma;

  const ativ   = selAtiv.value;
  const stats  = computeStats(ativ, turma);
  const questoes = computeQuestoes(ativ, new Set([turma]));
  fillExpand(turma, stats, questoes);
};

function fillExpand(turma, stats, questoes) {
  const inner = document.getElementById(`xinner-${turma}`);
  if (!inner) return;

  const orderJog = [...stats.jogadores].sort((a, b) => {
    const pa = stats.am[a]?.melhorPts || 0;
    const pb = stats.am[b]?.melhorPts || 0;
    return pb - pa;
  });

  const mkRow = (al, idx) => {
    const d = stats.am[al];
    if (!d || d.sessoes === 0) return `<tr>
      <td style="color:var(--text-muted)">${idx+1}</td>
      <td><span class="nao-jogou">${al}</span></td>
      <td colspan="4" style="color:var(--text-muted);font-style:italic;font-size:11px">Não jogou</td>
    </tr>`;
    const taxa = pct(d.acertos, d.respondidas);
    const topE = Object.entries(d.qErros).sort((a,b) => b[1]-a[1]).slice(0,2)
      .map(([k,n]) => `${trunc(k,42)} <strong style="color:var(--red)">(${n}×)</strong>`).join('<br>');
    return `<tr>
      <td style="color:var(--text-muted)">${idx+1}</td>
      <td><strong>${al}</strong></td>
      <td><strong style="color:var(--gold)">${d.melhorPts}</strong></td>
      <td style="text-align:center">${d.sessoes}</td>
      <td><span class="pf ${pfCls(taxa)}">${taxa}%</span>
          <span style="font-size:10px;color:var(--text-muted);display:block">${d.acertos}✓ ${d.erros}✗</span></td>
      <td style="font-size:11px;line-height:1.5;max-width:200px">${topE||'<span style="color:var(--green)">Sem erros ✨</span>'}</td>
    </tr>`;
  };

  const allRows = [
    ...orderJog.map((al,i) => mkRow(al, i)),
    ...stats.naoJogaram.map((al,i) => mkRow(al, orderJog.length+i)),
  ].join('');

  const erradas   = [...questoes].sort((a,b) => b.taxaErro - a.taxaErro).slice(0,5);
  const acertadas = [...questoes].sort((a,b) => b.acertos  - a.acertos ).slice(0,5);
  const mkQ = (q, cls) => `
    <div class="qcard ${cls} sm">
      <div class="q-enun">${trunc(q.enun)}</div>
      <div style="font-size:11px;display:flex;gap:10px">
        ${cls==='err'
          ? `<span style="color:var(--red);font-weight:700">${q.taxaErro}% erro</span>`
          : `<span style="color:var(--green);font-weight:700">${pct(q.acertos,q.total)}% acerto</span>`}
        <span style="color:var(--text-muted)">${cls==='err'?q.erros:q.acertos}/${q.total}</span>
      </div>
    </div>`;

  const qSec = questoes.length ? `
    <div class="two-col">
      <div>
        <div class="sub-sec-title" style="color:var(--red)">❌ Mais erradas desta turma</div>
        ${erradas.map(q => mkQ(q,'err')).join('')}
      </div>
      <div>
        <div class="sub-sec-title" style="color:var(--green)">✅ Mais acertadas desta turma</div>
        ${acertadas.map(q => mkQ(q,'ok')).join('')}
      </div>
    </div>` : `<p style="font-size:12px;color:var(--text-muted);margin-top:12px">Sem detalhes de questões para esta turma.</p>`;

  inner.innerHTML = `
    <div style="overflow:auto">
      <table class="table sub-table" style="min-width:520px;background:white;border-radius:8px">
        <thead><tr>
          <th>#</th><th>Aluno</th><th>Melhor pts</th>
          <th style="text-align:center">Sessões</th><th>Taxa acerto</th>
          <th>Questões mais erradas</th>
        </tr></thead>
        <tbody>${allRows}</tbody>
      </table>
    </div>
    ${qSec}`;
}

// ── Section: Análise de questões ──────────────────
function renderAQ(questoes, loaded) {
  if (!loaded) return `
    <div class="sec" style="color:var(--text-muted);margin-top:28px">🔍 Análise Detalhada de Questões</div>
    <div class="card"><div class="loading">⏳ Carregando detalhes…</div></div>`;

  if (!questoes.length) return `
    <div class="sec" style="color:var(--text-muted);margin-top:28px">🔍 Análise Detalhada de Questões</div>
    <div class="card"><div class="no-data" style="font-size:12px">Sem dados de questões disponíveis para esta atividade.</div></div>`;

  const sorted = [...questoes].sort((a, b) => {
    const va = a[aqSort.col] ?? 0, vb = b[aqSort.col] ?? 0;
    return aqSort.dir === 'asc' ? va - vb : vb - va;
  });

  const th = (col, label) => {
    const cls = aqSort.col === col ? (aqSort.dir === 'asc' ? 'asc' : 'desc') : '';
    return `<th class="sth ${cls}" onclick="sortAQ('${col}')">${label}</th>`;
  };

  const fillColor = v => v >= 70 ? 'var(--red)' : v >= 50 ? 'var(--orange)' : 'var(--green)';

  const rows = sorted.map(q => {
    const pct1 = q.acertos > 0 ? pct(q.t1, q.acertos) : 0;
    return `<tr>
      <td class="enun-col">${q.enun}</td>
      <td style="color:var(--red);font-weight:700">${q.erros}</td>
      <td style="color:var(--green);font-weight:700">${q.acertos}</td>
      <td style="color:var(--text-muted)">${q.total}</td>
      <td><span class="pf" style="background:${q.taxaErro>=70?'#FEE2E2':q.taxaErro>=50?'#FEF9C3':'#DCFCE7'};color:${fillColor(q.taxaErro)}">${q.taxaErro}%</span></td>
      <td style="font-size:11px;color:var(--text-muted)">${q.acertos>0?`${pct1}% na 1ª tent.<span style="display:block;font-size:10px">${q.t1}×1ª ${q.t2}×2ª ${q.t3}×3ª ${q.t4>0?q.t4+'×4ª':''}</span>`:'—'}</td>
    </tr>`;
  }).join('');

  return `
    <div class="sec" style="color:var(--text-muted);margin-top:28px">🔍 Análise Detalhada de Questões</div>
    <div class="card" style="padding:0;overflow:auto;margin-bottom:28px">
      <table class="table" style="min-width:580px">
        <thead><tr>
          <th style="min-width:220px">Questão</th>
          ${th('erros','Erros')}
          ${th('acertos','Acertos')}
          ${th('total','Total')}
          ${th('taxaErro','Taxa erro')}
          <th>Por tentativa</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ── Sort handlers ─────────────────────────────────
window.sortVG = col => {
  vgSort = { col, dir: vgSort.col === col && vgSort.dir === 'desc' ? 'asc' : 'desc' };
  const ativ = selAtiv.value;
  const allStats = buildAllStats(ativ);
  const questoes = computeQuestoes(ativ, selectedTurmas);
  renderPage(allStats, questoes, true);
};
window.sortAQ = col => {
  aqSort = { col, dir: aqSort.col === col && aqSort.dir === 'desc' ? 'asc' : 'desc' };
  const ativ = selAtiv.value;
  const allStats = buildAllStats(ativ);
  const questoes = computeQuestoes(ativ, selectedTurmas);
  renderPage(allStats, questoes, true);
};

// ── PDF ───────────────────────────────────────────
window.exportarPDF = function() {
  const ativ = selAtiv.value;
  for (const t of selectedTurmas) {
    const row = document.getElementById(`xrow-${t}`);
    if (row && row.style.display === 'none') {
      row.style.display = '';
      const stats    = computeStats(ativ, t);
      const questoes = computeQuestoes(ativ, new Set([t]));
      fillExpand(t, stats, questoes);
      document.getElementById(`xi-${t}`)?.classList.add('open');
    }
  }
  setTimeout(() => window.print(), 250);
};
</script>
