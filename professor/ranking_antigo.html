<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#15102a">
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ranking — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    /* ── MODO PROJEÇÃO / TV ──────────────────────────────────── */
    body.proj { background:#07071a; }
    body.proj .sidebar { display:none; }
    body.proj .main { background:#07071a; }
    body.proj .topbar { background:#0c0c22; border-bottom:1px solid #2a2a50; }
    body.proj .topbar-title { font-family:'Orbitron',monospace; font-size:13px; letter-spacing:1px; color:#c0c0ff; }
    body.proj .topbar-sub { color:#4444a0; }
    body.proj .content { padding:16px 28px 24px; }

    /* ── RELÓGIO ─────────────────────────────────────────────── */
    .proj-clock { font-family:'Orbitron',monospace; font-size:13px; color:#333360; }

    /* ── SEÇÃO LABEL ─────────────────────────────────────────── */
    .proj-sec { font-family:'Orbitron',monospace; font-size:10px; font-weight:700; color:#2a2a50; letter-spacing:2px; text-align:center; margin:10px 0 12px; }

    /* ── PÓDIO ───────────────────────────────────────────────── */
    .podium-stage { display:flex; align-items:flex-end; justify-content:center; gap:10px; height:200px; margin-bottom:6px; }
    .pod-col { display:flex; flex-direction:column; align-items:center; }
    .pod-medal { font-size:26px; margin-bottom:5px; }
    .pod-step { min-width:150px; border-radius:12px 12px 0 0; display:flex; flex-direction:column; align-items:center; padding:10px 14px 0; }
    .pod-step.p1 { height:160px; background:linear-gradient(180deg,rgba(250,184,0,.22),rgba(250,184,0,.04)); border:2px solid rgba(250,184,0,.45); }
    .pod-step.p2 { height:120px; background:linear-gradient(180deg,rgba(200,200,220,.16),rgba(200,200,220,.04)); border:2px solid rgba(200,200,220,.32); }
    .pod-step.p3 { height:90px; background:linear-gradient(180deg,rgba(180,110,20,.16),rgba(180,110,20,.04)); border:2px solid rgba(180,110,20,.32); }
    .pod-nome { font-size:14px; font-weight:800; color:#dddeff; max-width:136px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
    .pod-turma { font-size:10px; color:#5555a0; margin-top:2px; }
    .pod-pts { font-family:'Orbitron',monospace; font-size:18px; font-weight:900; color:#FAB800; margin-top:5px; transition:color .4s; }
    .pod-extras { display:flex; gap:8px; align-items:center; margin-top:3px; flex-wrap:wrap; justify-content:center; }
    .pod-combo { font-size:10px; color:#FF8800; font-weight:700; }
    .pod-tent { font-size:10px; color:#4444a0; }
    .pod-ativo { font-size:10px; font-weight:700; color:#22C55E; animation:blink-g 1.4s ease infinite; }
    .pod-rapid { font-size:10px; color:#60A5FA; font-weight:700; }
    .pod-dif { font-size:10px; color:#FDE047; font-weight:700; }
    .pod-empty { font-size:12px; color:#1a1a38; margin-top:8px; }
    @keyframes blink-g { 0%,100%{opacity:1}50%{opacity:.3} }

    /* ── LISTA (4º em diante) ────────────────────────────────── */
    .rank-list { display:flex; flex-direction:column; gap:5px; }
    @keyframes row-in { from{opacity:0;transform:translateX(-12px)} to{opacity:1;transform:translateX(0)} }
    .rk-row { display:grid; grid-template-columns:46px 1fr auto; align-items:center; gap:14px; padding:10px 16px; border-radius:10px; background:#0d0d24; border:1px solid #191938; animation:row-in .35s ease; transition:background .5s,border-color .5s; }
    .rk-row.ativo-now { border-color:#1a3a1a; background:#081508; }
    .rk-num { font-family:'Orbitron',monospace; font-size:18px; font-weight:700; color:#2a2a50; text-align:center; }
    .rk-nome { font-size:15px; font-weight:700; color:#c0c0e0; }
    .rk-meta { display:flex; gap:10px; align-items:center; font-size:11px; color:#4444a0; margin-top:3px; flex-wrap:wrap; }
    .rk-tag-ativo { background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.4); color:#4ADE80; border-radius:10px; padding:1px 8px; font-size:10px; font-weight:700; animation:blink-g 1.4s ease infinite; }
    .rk-combo { color:#FF8800; font-weight:700; }
    .rk-rapid { color:#60A5FA; font-weight:700; }
    .rk-dif   { color:#FDE047; font-weight:700; }
    .rk-pts { font-family:'Orbitron',monospace; font-size:18px; font-weight:900; color:#FAB800; white-space:nowrap; transition:color .4s; }
    .rk-footer { text-align:center; padding:14px 0 0; font-size:10px; color:#2a2a50; font-family:'Orbitron',monospace; letter-spacing:.8px; }
    .rk-vazio { text-align:center; padding:60px; color:#2a2a50; font-family:'Orbitron',monospace; font-size:13px; }

    /* ── MODO PAINEL (default) ───────────────────────────────── */
    .tab-nav{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:20px;}
    .tab-nav button{flex:1;padding:9px;border:none;border-radius:9px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);background:transparent;transition:all .2s;}
    .tab-nav button.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(47,158,220,.3);}
    th.sortable{cursor:pointer;user-select:none;}
    th.sortable:hover{color:var(--blue);}
    th.sort-asc::after{content:" ▲";font-size:9px;}
    th.sort-desc::after{content:" ▼";font-size:9px;}
    .tr-top1 td{background:rgba(250,184,0,.10)!important}
    .tr-top2 td{background:rgba(200,200,220,.08)!important}
    .tr-top3 td{background:rgba(180,110,20,.08)!important}
    .ativ-sel-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
    .ativ-btn-prof{padding:7px 14px;border:1.5px solid var(--border);border-radius:20px;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:all .2s;}
    .ativ-btn-prof.active{border-color:var(--blue);background:var(--blue);color:#fff;}
    .live-tag{font-size:10px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.4);color:#16A34A;border-radius:10px;padding:1px 7px;font-weight:700;display:inline-flex;align-items:center;}

    /* ── TV progress bar ─────────────────────────────────────── */
    .tv-bar-wrap{height:3px;background:#1a1a38;border-radius:2px;margin-bottom:14px;overflow:hidden;}
    .tv-bar{height:3px;background:#FAB800;border-radius:2px;width:0%;}

    .pill{padding:5px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:all .15s;}
    .pill.on{border-color:var(--blue);background:var(--blue);color:#fff;}

    @media(max-width:640px) {
      .pod-step { min-width:90px; }
      .rk-meta { display:none; }
      .rk-row { grid-template-columns:36px 1fr auto; }
    }

    /* ════════════════════════════════════════
       MODO TV DATASHOW (?tv=true)
    ════════════════════════════════════════ */
    body.tv-mode .sidebar  { display:none!important; }
    body.tv-mode .topbar   { display:none!important; }
    body.tv-mode .main     { margin-left:0!important; }
    body.tv-mode .content  { padding:0!important; height:100vh; overflow:hidden; }

    .tv-wrap { height:100vh; background:radial-gradient(ellipse at 50% 0%,#0e0e2e 0%,#05051a 65%); display:flex; flex-direction:column; overflow:hidden; }
    .tv-prog-wrap { height:2px; background:#0a0a1e; flex-shrink:0; }
    .tv-prog-bar  { height:2px; background:linear-gradient(90deg,rgba(250,184,0,.25),rgba(250,184,0,.65)); width:0%; }

    .tv-hdr { display:flex; align-items:center; justify-content:space-between; padding:10px 24px; flex-shrink:0; border-bottom:1px solid rgba(255,255,255,.035); }
    .tv-hdr-l { display:flex; align-items:center; gap:12px; }
    .tv-logo { font-family:'Orbitron',monospace; font-size:11px; font-weight:700; color:rgba(250,184,0,.45); letter-spacing:2px; }
    .tv-badge { font-family:'Orbitron'; font-size:9px; font-weight:700; letter-spacing:1px; padding:3px 10px; border-radius:20px; }
    .tv-badge.geral { background:rgba(250,184,0,.1); color:rgba(250,184,0,.8); border:1px solid rgba(250,184,0,.2); }
    .tv-badge.ativ  { background:rgba(47,158,220,.1); color:rgba(120,190,255,.8); border:1px solid rgba(47,158,220,.25); }
    .tv-hdr-r { display:flex; align-items:center; gap:14px; }
    .tv-clk  { font-family:'Orbitron'; font-size:11px; color:#252545; }
    .tv-exit { font-size:10px; color:#252545; background:none; border:1px solid #181832; border-radius:7px; padding:4px 11px; cursor:pointer; font-family:'Inter'; transition:all .2s; }
    .tv-exit:hover { color:#6666aa; border-color:#4444a0; }

    .tv-body { flex:1; overflow-y:auto; padding:6px 28px 10px; scrollbar-width:none; }
    .tv-body::-webkit-scrollbar { display:none; }
    .tv-slide { transition:opacity .42s ease,transform .42s ease; }
    .tv-slide.fading { opacity:0; transform:scale(.98) translateY(6px); }

    .tv-sec { font-family:'Orbitron'; font-size:9px; font-weight:700; color:#1e1e42; letter-spacing:3px; text-align:center; margin:8px 0 5px; }
    .tv-ativ-nm { font-family:'Orbitron'; font-size:14px; font-weight:700; color:rgba(120,190,255,.7); text-align:center; letter-spacing:2px; margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* ── Pódio TV ── */
    .tv-podium { display:flex; align-items:flex-end; justify-content:center; gap:14px; padding:6px 0 0; }
    .tv-pod-col { display:flex; flex-direction:column; align-items:center; }
    /* Entrada escalonada: 3º primeiro, 2º segundo, 1º por último mais dramático */
    .tv-pod-col.anim-3 { animation:tpod-in  .9s cubic-bezier(.34,1.4,.64,1) 0s   both; }
    .tv-pod-col.anim-2 { animation:tpod-in  .9s cubic-bezier(.34,1.4,.64,1) .65s both; }
    .tv-pod-col.anim-1 { animation:tpod-big 1.1s cubic-bezier(.34,1.4,.64,1) 1.3s both; }
    .tv-pod-col.new-entry { animation:tpod-big 1.1s cubic-bezier(.34,1.4,.64,1) 0s both!important; }
    @keyframes tpod-in  { from{opacity:0;transform:translateY(50px) scale(.7)} to{opacity:1;transform:none} }
    @keyframes tpod-big { from{opacity:0;transform:translateY(60px) scale(.6)} 70%{transform:translateY(-12px) scale(1.06)} to{opacity:1;transform:none} }

    .tv-trophy { font-size:28px; margin-bottom:3px; text-align:center; }
    .tv-crown  { font-size:16px; display:block; text-align:center; margin-bottom:-4px; }
    .tv-stand  { min-width:158px; border-radius:14px 14px 0 0; display:flex; flex-direction:column; align-items:center; padding:12px 14px 0; }
    .tv-stand.p1 { height:204px; background:linear-gradient(180deg,rgba(250,184,0,.26),rgba(250,184,0,.04)); border:2px solid rgba(250,184,0,.52); box-shadow:0 0 40px rgba(250,184,0,.07),inset 0 1px 0 rgba(250,184,0,.2); }
    .tv-stand.p2 { height:154px; background:linear-gradient(180deg,rgba(200,200,230,.14),rgba(200,200,230,.03)); border:2px solid rgba(200,200,230,.28); }
    .tv-stand.p3 { height:112px; background:linear-gradient(180deg,rgba(180,110,20,.14),rgba(180,110,20,.03)); border:2px solid rgba(180,110,20,.28); }
    .tv-stand.empty { border-style:dashed; opacity:.3; }
    .tv-pname  { font-size:18px; font-weight:900; color:#e8e8ff; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
    .tv-pturma { font-size:10px; color:#4a4a80; margin-top:3px; }
    .tv-ppts   { font-family:'Orbitron'; font-size:28px; font-weight:900; color:#FAB800; margin-top:6px; line-height:1; text-align:center; transition:color .3s; }
    .tv-ppts.pts-rec { animation:tv-pts-rec 3s ease; }
    @keyframes tv-pts-rec { 0%{color:#FAB800} 15%{color:#fff;text-shadow:0 0 24px #FAB800,0 0 48px rgba(250,184,0,.4)} 80%{color:#FAB800;text-shadow:0 0 8px rgba(250,184,0,.3)} 100%{color:#FAB800;text-shadow:none} }
    .tv-pativo  { font-size:11px; font-weight:700; color:#22C55E; animation:blink-g 1.4s ease infinite; margin-top:5px; }
    .tv-pextras { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:4px; font-size:10px; }
    .tv-pempty  { color:#1a1a38; font-size:12px; margin-top:14px; }

    /* ── Lista TV (4º+) ── */
    .tv-list { display:flex; flex-direction:column; gap:4px; margin-top:6px; }
    .tv-list-row { display:grid; grid-template-columns:44px 1fr 80px; align-items:center; gap:12px; padding:9px 16px; border-radius:10px; background:#0c0c20; border:1px solid #161628; transition:background .5s,border-color .5s,box-shadow .5s; }
    .tv-list-row.ativo-now { border-color:rgba(34,197,94,.25); background:rgba(34,197,94,.04); }
    .tv-list-row.rising { animation:tv-row-rise 1.5s ease; }
    @keyframes tv-row-rise { 0%,100%{} 25%{background:rgba(34,197,94,.2);border-color:rgba(34,197,94,.6);box-shadow:0 0 18px rgba(34,197,94,.15)} }
    .tv-list-row.record { animation:tv-row-rec 3s ease; }
    @keyframes tv-row-rec { 0%,100%{} 15%{background:rgba(250,184,0,.18);border-color:rgba(250,184,0,.55);box-shadow:0 0 22px rgba(250,184,0,.2)} 80%{background:rgba(250,184,0,.08);border-color:rgba(250,184,0,.25)} }
    .tv-lnum  { font-family:'Orbitron'; font-size:15px; font-weight:700; color:#222244; text-align:center; }
    .tv-lname { font-size:14px; font-weight:700; color:#b0b0d8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tv-lmeta { font-size:10px; color:#30305a; margin-top:2px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .tv-lativo { color:#22C55E; animation:blink-g 1.4s ease infinite; font-weight:700; }
    .tv-lpts-wrap { text-align:right; }
    .tv-lpts  { font-family:'Orbitron'; font-size:16px; font-weight:900; color:#FAB800; }
    .tv-ldiff { font-size:9px; color:#333360; margin-top:2px; }
    .tv-foot  { text-align:center; padding:9px 0 2px; font-size:9px; color:#1e1e3a; font-family:'Orbitron'; letter-spacing:1px; }
    .tv-empty { text-align:center; padding:50px; color:#1a1a30; font-family:'Orbitron'; font-size:12px; }

    @media(max-width:640px) {
      .tv-stand { min-width:90px; } .tv-ppts { font-size:20px; } .tv-pname { font-size:14px; }
      .tv-list-row { grid-template-columns:36px 1fr 64px; padding:7px 10px; gap:8px; }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title" id="topbar-title">Ranking</div>
        <div class="topbar-sub" id="topbar-sub">Visão geral de desempenho</div>
      </div>
      <div class="topbar-right" id="topbar-right" style="gap:8px"></div>
    </div>
    <div class="content" id="content">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div>
    </div>
  </div>
</div>

<script type="module">
import { getLiberadas, listenRankingProfessor, getResultados } from "/js/db.js";
import { requireProfessor, renderSidebarProfessor, clearSession } from "/js/auth.js";
import { LISTA_ATIVIDADES, ALUNOS_POR_TURMA } from "/js/constants.js";

requireProfessor();
renderSidebarProfessor("sidebar", "ranking");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const params    = new URLSearchParams(window.location.search);
const ativParam = params.get("ativ");
const tvMode    = params.get("tv") === "true";

let modoAtivo = params.get("modo") || "competicao";

if (ativParam) {
  iniciarModoProjecao(ativParam, modoAtivo);
} else if (tvMode) {
  await iniciarTVMode();
} else {
  await renderPainelPrincipal();
}

// ══════════════════════════════════════════════════════════════
// PAINEL PRINCIPAL (default — duas abas)
// ══════════════════════════════════════════════════════════════
async function renderPainelPrincipal() {
  document.getElementById('topbar-right').innerHTML =
    `<button class="btn btn-ghost" style="font-size:12px" onclick="window.open('/professor/ranking_tv.html','_blank')">📺 Modo TV</button>`;
  const todos = await getResultados();
  let filtroTurma = '';

  function buildRankingMedia(lista) {
    const melhor = {};
    for (const r of lista) {
      if (!r.concluido || !r.aluno) continue;
      if (r.atividade === 'Atividade 4 - Geometria') continue;
      if (!melhor[r.aluno]) melhor[r.aluno] = {
        aluno: r.aluno, turma: r.turma || '?', porAtiv: {}, sessoes: 0,
        melhorSessao: 0, primeiroTs: Infinity
      };
      const pts = r.pontuacao || 0;
      const prev = melhor[r.aluno].porAtiv[r.atividade] || 0;
      if (pts > prev) melhor[r.aluno].porAtiv[r.atividade] = pts;
      if (pts > melhor[r.aluno].melhorSessao) melhor[r.aluno].melhorSessao = pts;
      const ts = r.criadoEm || 0;
      if (ts && ts < melhor[r.aluno].primeiroTs) melhor[r.aluno].primeiroTs = ts;
      melhor[r.aluno].sessoes++;
    }
    const result = Object.values(melhor).map(a => {
      const vals = Object.values(a.porAtiv);
      const total = vals.reduce((s, v) => s + v, 0);
      const media = vals.length ? Math.round(total / vals.length) : 0;
      return {
        aluno: a.aluno, turma: a.turma, media, total, atividades: vals.length, sessoes: a.sessoes,
        melhorSessao: a.melhorSessao, primeiroTs: a.primeiroTs === Infinity ? 0 : a.primeiroTs
      };
    }).sort((a, b) => b.total - a.total);
    return result;
  }

  const rankAll = buildRankingMedia(todos);

  // Sortable table state
  let sortCol = 'total';
  let sortAsc = false;

  function renderTabelaGeral() {
    const sorted = [...rankAll].sort((a, b) => {
      const v = sortAsc ? 1 : -1;
      if (sortCol === 'aluno') return v * a.aluno.localeCompare(b.aluno);
      if (sortCol === 'turma') return v * a.turma.localeCompare(b.turma);
      return v * ((a[sortCol] || 0) - (b[sortCol] || 0));
    });
    const tbody = document.getElementById('geral-tbody');
    if (!tbody) return;
    const display = filtroTurma ? sorted.filter(r => r.turma === filtroTurma) : sorted;
    const isStrCol = sortCol === 'aluno' || sortCol === 'turma';
    let lastTiePos = 1; let densePos = 0;
    tbody.innerHTML = display.map((r, i) => {
      if (i === 0) { lastTiePos = 1; densePos = 1; }
      else if (isStrCol) { densePos++; lastTiePos = densePos; }
      else if ((r[sortCol] || 0) !== (display[i-1][sortCol] || 0)) { densePos++; lastTiePos = densePos; }
      const pos = lastTiePos;
      const medal = pos <= 3 ? ['🥇','🥈','🥉'][pos-1] : pos;
      const cls = pos === 1 ? 'tr-top1' : pos === 2 ? 'tr-top2' : pos === 3 ? 'tr-top3' : '';
      return `<tr class="${cls}">
        <td style="text-align:center;font-weight:700;font-size:20px">${medal}</td>
        <td style="font-weight:600">${r.aluno}</td>
        <td><span class="badge badge-blue">Turma ${r.turma}</span></td>
        <td>
            <div style="font-weight:800;color:var(--gold)">${r.total}</div>
            <div style="font-size:10px;color:var(--text-muted);margin-top:1px">méd. ${r.media}</div>
          </td>
        <td>${r.atividades}</td>
        <td>${r.sessoes}</td>
      </tr>`;
    }).join('');
    // Update header sort indicators
    ['aluno','turma','total','atividades','sessoes'].forEach(col => {
      const th = document.getElementById('th-' + col);
      if (!th) return;
      th.className = 'sortable' + (sortCol === col ? (sortAsc ? ' sort-asc' : ' sort-desc') : '');
    });
  }

  window.sortGeral = function(col) {
    if (sortCol === col) sortAsc = !sortAsc; else { sortCol = col; sortAsc = false; }
    renderTabelaGeral();
  };

  // Activity tab state
  let ativSel    = LISTA_ATIVIDADES[0]?.nome || '';
  let modoAtivSel = '';

  function abrirAtivProf(nome) {
    const modoShouldReset = nome !== ativSel;
    ativSel = nome;
    document.querySelectorAll('.ativ-btn-prof').forEach(b =>
      b.classList.toggle('active', b.dataset.ativ === nome));
    const el = document.getElementById('rank-ativ-prof');
    if (!el) return;

    const resultadosAtiv = todos.filter(r => r.atividade === nome && r.concluido && r.aluno);
    const modosPresentes = new Set(resultadosAtiv.map(r => r.modo || 'competicao'));
    const temComp   = [...modosPresentes].some(m => m === 'competicao' || m === 'competicao_plus');
    const temAvPlus = modosPresentes.has('avaliacao_plus');

    if (modoShouldReset || !modoAtivSel) {
      modoAtivSel = (temAvPlus && !temComp) ? 'avaliacao_plus' : 'competicao_plus';
    }

    const submenuHtml = (temComp && temAvPlus) ? `
      <div style="padding:10px 12px 0">
        <div class="tab-nav" style="margin-bottom:10px">
          <button id="ratab-comp" onclick="mudarModoAtivRank('competicao_plus')" class="${modoAtivSel !== 'avaliacao_plus' ? 'active' : ''}">⚔️ Competição+</button>
          <button id="ratab-avplus" onclick="mudarModoAtivRank('avaliacao_plus')" class="${modoAtivSel === 'avaliacao_plus' ? 'active' : ''}">📝 Avaliação+</button>
        </div>

    el.innerHTML = submenuHtml + '<div id="rank-ativ-content"></div>';

  }

  window.mudarModoAtivRank = function(modo) {
    modoAtivSel = modo;
    document.getElementById('ratab-comp')?.classList.toggle('active', modo !== 'avaliacao_plus');
    document.getElementById('ratab-avplus')?.classList.toggle('active', modo === 'avaliacao_plus');
    renderAtivRanking();
  };

  function renderAtivRanking() {
    const el = document.getElementById('rank-ativ-content');
    if (!el) return;
    const resultadosAtiv = todos.filter(r => r.atividade === ativSel && r.concluido && r.aluno);

    if (modoAtivSel === 'avaliacao_plus') {
      const avResults = resultadosAtiv.filter(r => r.modo === 'avaliacao_plus');
      const melhor = {};
      for (const r of avResults) {
        const nq = r.nota_quiz ?? 0, pts = r.pontuacao ?? 0;
        const prev = melhor[r.aluno];
        if (!prev || nq > prev.nota_quiz || (nq === prev.nota_quiz && pts > prev.pts)) {
          melhor[r.aluno] = { aluno: r.aluno, turma: r.turma || '?', nota_quiz: nq, pts, tent: 0 };
        }
      }
      for (const r of avResults) { if (melhor[r.aluno]) melhor[r.aluno].tent++; }
      const ranking = Object.values(melhor).sort((a, b) => b.nota_quiz - a.nota_quiz || b.pts - a.pts);
      const filtrado = filtroTurma ? ranking.filter(r => r.turma === filtroTurma) : ranking;
      if (!filtrado.length) {
        el.innerHTML = '<p style="padding:16px;color:var(--text-muted);font-size:13px">Sem resultados de Avaliação+ para esta atividade.</p>';
        return;
      }
      let dp = 0, lastNQ = null, lastPts = null;
      el.innerHTML = `<table class="table">
        <thead><tr>
          <th style="width:40px">#</th><th>Aluno</th><th>Turma</th>
          <th>Nota Quiz</th><th>Pts Total</th>
          <th class="rank-hide-mobile">Tentativas</th>
        </tr></thead>
        <tbody>${filtrado.map(r => {
          if (r.nota_quiz !== lastNQ || r.pts !== lastPts) { dp++; lastNQ = r.nota_quiz; lastPts = r.pts; }
          const pos = dp, medal = pos <= 3 ? ['🥇','🥈','🥉'][pos-1] : pos;
          const cls = pos === 1 ? 'tr-top1' : pos === 2 ? 'tr-top2' : pos === 3 ? 'tr-top3' : '';
          return `<tr class="${cls}">
            <td style="text-align:center;font-weight:700;font-size:20px">${medal}</td>
            <td style="font-weight:600">${r.aluno}</td>
            <td><span class="badge badge-blue">Turma ${r.turma}</span></td>
            <td style="font-weight:800;color:#7C3AED">${r.nota_quiz.toFixed(1)}</td>
            <td style="font-weight:700;color:var(--gold)">${r.pts}</td>
            <td class="rank-hide-mobile">${r.tent}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;
    } else {
      const compResults = resultadosAtiv.filter(r => r.modo !== 'avaliacao_plus');
      const melhor = {};
      for (const r of compResults) {
        const pts = r.pontuacao || 0;
        if (!melhor[r.aluno] || pts > melhor[r.aluno].melhorPts) {
          melhor[r.aluno] = { aluno: r.aluno, turma: r.turma || '?', melhorPts: pts, tent: 0 };
        }
      }
      for (const r of compResults) { if (melhor[r.aluno]) melhor[r.aluno].tent++; }
      const ranking = Object.values(melhor).sort((a, b) => b.melhorPts - a.melhorPts);
      const filtrado = filtroTurma ? ranking.filter(r => r.turma === filtroTurma) : ranking;
      if (!filtrado.length) {
        el.innerHTML = '<p style="padding:16px;color:var(--text-muted);font-size:13px">Sem resultados de Competição+ para esta atividade.</p>';
        return;
      }
      let dp = 0, lastPts = null;
      el.innerHTML = `<table class="table">
        <thead><tr>
          <th style="width:40px">#</th><th>Aluno</th><th>Turma</th>
          <th>Melhor</th><th class="rank-hide-mobile">Sessões</th>
        </tr></thead>
        <tbody>${filtrado.map(r => {
          if (r.melhorPts !== lastPts) { dp++; lastPts = r.melhorPts; }
          const pos = dp, medal = pos <= 3 ? ['🥇','🥈','🥉'][pos-1] : pos;
          const cls = pos === 1 ? 'tr-top1' : pos === 2 ? 'tr-top2' : pos === 3 ? 'tr-top3' : '';
          return `<tr class="${cls}">
            <td style="text-align:center;font-weight:700;font-size:20px">${medal}</td>
            <td style="font-weight:600">${r.aluno}</td>
            <td><span class="badge badge-blue">Turma ${r.turma}</span></td>
            <td style="font-weight:800;color:var(--gold)">${r.melhorPts}</td>
            <td class="rank-hide-mobile">${r.tent}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;
    }
  }

  window.mudarTabPainel = function(tab) {
    ['geral','ativ'].forEach(t => {
      document.getElementById('ptab-' + t)?.classList.toggle('active', t === tab);
      document.getElementById('ppanel-' + t).style.display = t === tab ? '' : 'none';
    });
    if (tab === 'ativ') abrirAtivProf(ativSel);
  };

  window.setFiltroTurmaRank = function(turma) {
    filtroTurma = turma;
    document.querySelectorAll('#rank-turma-pills .pill').forEach(p =>
      p.classList.toggle('on', p.dataset.t === turma));
    if (document.getElementById('ppanel-geral')?.style.display !== 'none') {
      renderTabelaGeral();
    } else {
      renderAtivRanking();
    }
  };

  const ativBtns = LISTA_ATIVIDADES.map(a =>
    `<button class="ativ-btn-prof${a.nome === ativSel ? ' active' : ''}" data-ativ="${a.nome}">${a.nome}</button>`
  ).join('');

  document.getElementById('content').innerHTML = `
    <div id="rank-turma-pills" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px">
      <span style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-right:4px">Turma</span>
      <button class="pill on" data-t="" onclick="setFiltroTurmaRank('')">Todas</button>
      ${Object.keys(ALUNOS_POR_TURMA).map(t =>
        `<button class="pill" data-t="${t}" onclick="setFiltroTurmaRank('${t}')">${t}</button>`
      ).join('')}
    </div>
    <div class="tab-nav">
      <button id="ptab-geral" class="active" onclick="mudarTabPainel('geral')">🏆 Geral</button>
      <button id="ptab-ativ"                 onclick="mudarTabPainel('ativ')">📚 Por Atividade</button>
    </div>

    <div id="ppanel-geral">
      <div class="card" style="padding:0">
        ${rankAll.length
          ? `<table class="table">
              <thead><tr>
                <th style="width:40px">#</th>
                <th id="th-aluno" class="sortable sort-desc" onclick="sortGeral('aluno')">Aluno</th>
                <th id="th-turma" class="sortable" onclick="sortGeral('turma')">Turma</th>
                <th id="th-total" class="sortable sort-desc" onclick="sortGeral('total')">Total</th>
                <th id="th-atividades" class="sortable rank-hide-mobile" onclick="sortGeral('atividades')">Ativ.</th>
                <th id="th-sessoes" class="sortable rank-hide-mobile" onclick="sortGeral('sessoes')">Sessões</th>
              </tr></thead>
              <tbody id="geral-tbody"></tbody>
            </table>`
          : '<p style="padding:16px;color:var(--text-muted);font-size:13px">Nenhum resultado registrado ainda.</p>'}
      </div>
    </div>

    <div id="ppanel-ativ" style="display:none">
      <div class="ativ-sel-wrap" id="ativ-sel-prof">${ativBtns}</div>
      <div class="card" style="padding:0" id="rank-ativ-prof"></div>
    </div>`;

  if (rankAll.length) renderTabelaGeral();

  document.querySelectorAll('.ativ-btn-prof').forEach(b => {
    b.addEventListener('click', () => abrirAtivProf(b.dataset.ativ));
  });

}

  document.getElementById("topbar-sub").textContent = isPlus

  document.getElementById("topbar-right").innerHTML = `
    <span class="proj-clock" id="proj-clock"></span>
    <button class="btn btn-ghost" onclick="window.toggleFs()" style="font-size:12px">⛶ Tela cheia</button>
    <a href="/professor/ranking.html" class="btn btn-ghost" style="font-size:12px">← Sair</a>`;

  function tickClock() {
    const el = document.getElementById("proj-clock");
    if (el) el.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  tickClock();
  setInterval(tickClock, 15000);

  window.toggleFs = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  };

  const podLabel = isPlus ? "🏆 COMPETIÇÃO+ · TOP 3" : "🏆 PÓDIO";
  document.getElementById("content").innerHTML = `
    <div class="proj-sec">${podLabel}</div>
    <div class="podium-stage" id="podium-stage">${renderPodiumHTML([])}</div>
    <div class="proj-sec" id="demais-label" style="display:none">DEMAIS PARTICIPANTES</div>
    <div class="rank-list" id="rank-list"></div>
    <div class="rk-footer" id="rk-footer">Aguardando resultados…</div>`;

  const unsub = listenRankingProfessor(atividade, ranking => {
    const podGroups = getRankGroupsProf(ranking);
    const podCount  = podGroups.reduce((s, g) => s + g.students.length, 0);
    atualizarPodio(ranking);
    atualizarLista(ranking.slice(podCount));
    const ativos = ranking.filter(r => r.ativo).length;
    document.getElementById("rk-footer").textContent =
      `⏱ atualizado às ${new Date().toLocaleTimeString('pt-BR')} · ${ranking.length} participante${ranking.length !== 1 ? 's' : ''}${ativos > 0 ? ` · ⚡ ${ativos} jogando` : ''}`;
    const demaisLbl = document.getElementById("demais-label");
    if (demaisLbl) demaisLbl.style.display = ranking.length > 3 ? '' : 'none';
  });
  window.addEventListener("beforeunload", () => unsub());
}

// MODO TV (?tv=true)
// ══════════════════════════════════════════════════════════════
async function iniciarTVMode() {
  // NOTE: requires Firebase index: "resultados": { ".indexOn": ["atividade"] }
  const [todos, liberadas] = await Promise.all([getResultados(), getLiberadas()]);

  document.body.classList.add('tv-mode');
  setTimeout(() => { document.documentElement.requestFullscreen().catch(() => {}); }, 800);

  document.getElementById('content').innerHTML = `
    <div class="tv-wrap" id="tv-wrap">
      <div class="tv-prog-wrap"><div class="tv-prog-bar" id="tv-prog-bar"></div></div>
      <div class="tv-hdr">
        <div class="tv-hdr-l">
          <span class="tv-logo">SISTEMA DE MATEMÁTICA</span>
          <span class="tv-badge geral" id="tv-badge">GERAL</span>
        </div>
        <div class="tv-hdr-r">
          <span class="tv-clk" id="tv-clk"></span>
          <button class="tv-exit" onclick="tvSair()">Sair</button>
        </div>
      </div>
      <div class="tv-body"><div class="tv-slide" id="tv-slide"></div></div>
    </div>`;

  window.tvSair = function() {
    if (document.fullscreenElement) document.exitFullscreen();
    window.location.href = window.location.href.split('?')[0];
  };

  function tickClock() {
    const el = document.getElementById('tv-clk');
    if (el) el.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  tickClock();
  setInterval(tickClock, 15000);

  function buildRankingMedia(lista) {
    const melhor = {};
    for (const r of lista) {
      if (!r.concluido || !r.aluno) continue;
      if (r.atividade === 'Atividade 4 - Geometria') continue;
      if (!melhor[r.aluno]) melhor[r.aluno] = {
        aluno: r.aluno, turma: r.turma || '?', porAtiv: {}, sessoes: 0,
        melhorSessao: 0, primeiroTs: Infinity
      };
      const pts = r.pontuacao || 0;
      const prev = melhor[r.aluno].porAtiv[r.atividade] || 0;
      if (pts > prev) melhor[r.aluno].porAtiv[r.atividade] = pts;
      if (pts > melhor[r.aluno].melhorSessao) melhor[r.aluno].melhorSessao = pts;
      const ts = r.criadoEm || 0;
      if (ts && ts < melhor[r.aluno].primeiroTs) melhor[r.aluno].primeiroTs = ts;
      melhor[r.aluno].sessoes++;
    }
    const result = Object.values(melhor).map(a => {
      const vals = Object.values(a.porAtiv);
      const media = vals.length ? Math.round(vals.reduce((s, v) => s + v, 0) / vals.length) : 0;
      return {
        aluno: a.aluno, turma: a.turma, melhorPts: media, atividades: vals.length,
        tentativas: a.sessoes, comboMax: 0, acertosRapidos: 0, acertosDificeis: 0, ativo: false,
        melhorSessao: a.melhorSessao, primeiroTs: a.primeiroTs === Infinity ? 0 : a.primeiroTs
      };
    }).sort((a, b) => b.melhorPts - a.melhorPts);
    return result;
  }

  const slides = [{ tipo: 'geral' }];
  if (liberadas.length) {
    slides.push(...liberadas.map(lib => ({ tipo: 'ativ', atividade: lib.atividade, modo: lib.modo || 'competicao' })));
  } else {
    slides.push(...LISTA_ATIVIDADES.map(a => ({ tipo: 'ativ', atividade: a.nome, modo: a.modo || 'competicao' })));
  }

  // Change detection state — reset on each slide change
  let prevRankMap = {};
  let prevTop3 = new Set();

  function detectChanges(ranking) {
    const changes = {};
    const top3Set = new Set(ranking.slice(0, 3).map(r => r.aluno));
    ranking.forEach((r, i) => {
      const pts = r.melhorPts ?? 0;
      const prev = prevRankMap[r.aluno];
      if (!prev) return;
      if (top3Set.has(r.aluno) && !prevTop3.has(r.aluno)) {
        changes[r.aluno] = 'new-top3';
      } else if (pts > prev.pts) {
        changes[r.aluno] = 'record';
      } else if (i + 1 < prev.pos) {
        changes[r.aluno] = 'rising';
      }
    });
    ranking.forEach((r, i) => { prevRankMap[r.aluno] = { pos: i + 1, pts: r.melhorPts ?? 0 }; });
    prevTop3 = top3Set;
    return changes;
  }

  // layout order: 2nd left, 1st centre, 3rd right; 3rd animates first (delay 0), 2nd second, 1st last
  function tvPodium(ranking, changes, withAnim) {
    const grps = (() => {
      const gs = []; let rp = 1;
      for (let gi = 0; gi < ranking.length && gs.length < 3; ) {
        const score = ranking[gi].melhorPts ?? 0; let gj = gi + 1;
        while (gj < ranking.length && (ranking[gj].melhorPts ?? 0) === score) gj++;
        gs.push({ pos: rp, students: ranking.slice(gi, gj), score }); rp += (gj - gi); gi = gj;
      }
      return gs;
    })();
    const medals      = ['🥇', '🥈', '🥉'];
    const visualOrder = [1, 0, 2];
    const standCls    = ['p2', 'p1', 'p3'];
    const animCls     = ['anim-2', 'anim-1', 'anim-3'];
    return `<div class="tv-podium">` +
      visualOrder.map((gi, vi) => {
        const g = grps[gi];
        let cls = 'tv-pod-col';
        if (withAnim) cls += ' ' + animCls[vi];
        if (g && g.students.some(r => changes[r.aluno] === 'new-top3')) cls += ' new-entry';
        const tiedW = g && g.students.length > 1 ? ` style="min-width:${Math.min(g.students.length * 158, 360)}px"` : '';
        const r0 = g?.students[0];
        const namesC = !g ? '' : g.students.length === 1
          ? `<div class="tv-pname">${r0.aluno}</div><div class="tv-pturma">Turma ${r0.turma}</div>`
          : `<div style="display:flex;width:100%;gap:0">${
              g.students.map((r, ni) => {
                const vsep = ni < g.students.length - 1
                  ? `<div style="width:1px;background:rgba(255,255,255,.2);opacity:.6;align-self:stretch;margin:0 6px;flex-shrink:0"></div>` : '';
                return `<div style="flex:1;min-width:0;text-align:center">
                  <div class="tv-pname" style="max-width:none;font-size:${g.students.length > 2 ? '12px' : '15px'}">${r.aluno}</div>
                  <div class="tv-pturma">T ${r.turma}</div>
                </div>${vsep}`;
              }).join('')
            }</div>`;
        return `<div class="${cls}" id="tv-pod-col-${gi}">
          <div class="tv-trophy">${medals[gi]}</div>
          <div class="tv-stand ${standCls[vi]}${g ? '' : ' empty'}"${tiedW}>
            ${g ? `
              ${namesC}
              <div class="tv-ppts" id="tv-ppts-${gi}">${g.score} pts</div>
              ${r0.ativo ? `<div class="tv-pativo">⚡ jogando agora</div>` : ''}
              <div class="tv-pextras">
                ${r0.comboMax > 1 ? `<span style="color:#FF8800;font-weight:700">🔥×${r0.comboMax}</span>` : ''}
                ${r0.acertosRapidos > 0 ? `<span style="color:#60A5FA;font-weight:700">⚡${r0.acertosRapidos}</span>` : ''}
                ${r0.acertosDificeis > 0 ? `<span style="color:#FDE047;font-weight:700">🏆${r0.acertosDificeis}</span>` : ''}
              </div>
            ` : `<div class="tv-pempty">—</div>`}
          </div>
        </div>`;
      }).join('') + `</div>`;
  }

  function tvListRow(r, pos, leaderPts, changes) {
    const pts  = r.melhorPts ?? 0;
    const diff = leaderPts - pts;
    const ch   = changes[r.aluno];
    const extraCls = ch === 'rising' ? ' rising' : ch === 'record' ? ' record' : '';
    return `<div class="tv-list-row${r.ativo ? ' ativo-now' : ''}${extraCls}" id="tv-lrow-${pos}">
      <div class="tv-lnum">${pos}</div>
      <div>
        <div class="tv-lname">${r.aluno}</div>
        <div class="tv-lmeta">
          <span>T${r.turma}</span>
          ${r.ativo ? `<span class="tv-lativo">⚡ jogando</span>` : ''}
          ${r.comboMax > 1 ? `<span style="color:#FF8800;font-weight:700">🔥×${r.comboMax}</span>` : ''}
        </div>
      </div>
      <div class="tv-lpts-wrap">
        <div class="tv-lpts">${pts}</div>
        ${diff > 0 ? `<div class="tv-ldiff">-${diff} pts</div>` : ''}
      </div>
    </div>`;
  }

  function updatePodiumInPlace(ranking, changes) {
    const grps = (() => {
      const gs = []; let rp = 1;
      for (let gi = 0; gi < ranking.length && gs.length < 3; ) {
        const score = ranking[gi].melhorPts ?? 0; let gj = gi + 1;
        while (gj < ranking.length && (ranking[gj].melhorPts ?? 0) === score) gj++;
        gs.push({ pos: rp, students: ranking.slice(gi, gj), score }); rp += (gj - gi); gi = gj;
      }
      return gs;
    })();
    grps.forEach((g, gi) => {
      const ptsEl = document.getElementById(`tv-ppts-${gi}`);
      if (ptsEl) {
        const newVal = g.score + ' pts';
        if (ptsEl.textContent !== newVal) {
          ptsEl.textContent = newVal;
          if (g.students.some(r => changes[r.aluno] === 'record')) {
            ptsEl.classList.remove('pts-rec');
            void ptsEl.offsetWidth;
            ptsEl.classList.add('pts-rec');
          }
        }
      }
      if (g.students.some(r => changes[r.aluno] === 'new-top3')) {
        const col = document.getElementById(`tv-pod-col-${gi}`);
        if (col) { col.classList.remove('new-entry'); void col.offsetWidth; col.classList.add('new-entry'); }
      }
    });
  }

  let slideIdx    = 0;
  let currentUnsub = null;

  function animateBar() {
    const bar = document.getElementById('tv-prog-bar');
    if (!bar) return;
    bar.style.transition = 'none';
    bar.style.width = '0%';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bar.style.transition = 'width 30s linear';
      bar.style.width = '100%';
    }));
  }

  async function showSlide(idx) {
    const slideEl = document.getElementById('tv-slide');
    const badge   = document.getElementById('tv-badge');
    if (!slideEl) return;

    slideEl.classList.add('fading');
    await new Promise(res => setTimeout(res, 420));

    if (currentUnsub) { currentUnsub(); currentUnsub = null; }
    prevRankMap = {};
    prevTop3    = new Set();

    const slide = slides[idx % slides.length];

    if (slide.tipo === 'geral') {
      modoAtivo = 'classico';
      if (badge) { badge.className = 'tv-badge geral'; badge.textContent = 'GERAL'; }
      const rankAll   = buildRankingMedia(todos);
      const geralGrps = (() => { const gs=[]; let rp=1; for(let gi=0;gi<rankAll.length&&gs.length<3;){const s=rankAll[gi].melhorPts??0;let gj=gi+1;while(gj<rankAll.length&&(rankAll[gj].melhorPts??0)===s)gj++;gs.push({pos:rp,students:rankAll.slice(gi,gj),score:s});rp+=(gj-gi);gi=gj;}return gs; })();
      const podCount  = geralGrps.reduce((s, g) => s + g.students.length, 0);
      const resto     = rankAll.slice(podCount);
      const leaderPts = rankAll[0]?.melhorPts ?? 0;

      rankAll.forEach((r, i) => { prevRankMap[r.aluno] = { pos: i + 1, pts: r.melhorPts }; });
      prevTop3 = new Set(rankAll.slice(0, podCount).map(r => r.aluno));

      slideEl.innerHTML = `
        <div class="tv-sec">CLASSIFICAÇÃO GERAL · MÉDIA DE PONTUAÇÃO</div>
        ${tvPodium(rankAll, {}, true)}
        ${resto.length ? `
          <div class="tv-sec">DEMAIS PARTICIPANTES</div>
          <div class="tv-list">${resto.map((r, i) => tvListRow(r, i + 4, leaderPts, {})).join('')}</div>
        ` : ''}
        <div class="tv-foot">${rankAll.length} participante${rankAll.length !== 1 ? 's' : ''} · classificação por média de pontuação</div>`;

    } else {
      modoAtivo = slide.modo;
      const isPlus = slide.modo === 'competicao_plus';
      if (badge) { badge.className = 'tv-badge ativ'; badge.textContent = slide.atividade; }

      slideEl.innerHTML = `
        <div class="tv-ativ-nm">${slide.atividade}</div>
        <div class="tv-sec">${isPlus ? '🏆 COMPETIÇÃO+ · TOP 3' : '🏆 PÓDIO'}</div>
        <div id="tv-podium-wrap">${tvPodium([], {}, false)}</div>
        <div class="tv-sec" id="tv-demais-sec" style="display:none">DEMAIS PARTICIPANTES</div>
        <div class="tv-list" id="tv-list"></div>
        <div class="tv-foot" id="tv-foot">Aguardando resultados…</div>`;

      let firstUpdate = true;
      currentUnsub = listenRankingProfessor(slide.atividade, ranking => {
        const changes   = detectChanges(ranking);
        const ativGrps  = (() => { const gs=[]; let rp=1; for(let gi=0;gi<ranking.length&&gs.length<3;){const s=ranking[gi].melhorPts??0;let gj=gi+1;while(gj<ranking.length&&(ranking[gj].melhorPts??0)===s)gj++;gs.push({pos:rp,students:ranking.slice(gi,gj),score:s});rp+=(gj-gi);gi=gj;}return gs; })();
        const podCnt    = ativGrps.reduce((s, g) => s + g.students.length, 0);
        const resto     = ranking.slice(podCnt);
        const leaderPts = ranking[0]?.melhorPts ?? 0;

        const podWrap = document.getElementById('tv-podium-wrap');
        if (podWrap) {
          if (firstUpdate) {
            podWrap.innerHTML = tvPodium(ranking, changes, true);
            firstUpdate = false;
          } else {
            updatePodiumInPlace(ranking, changes);
          }
        }

        const listEl = document.getElementById('tv-list');
        if (listEl) listEl.innerHTML = resto.map((r, i) => tvListRow(r, i + podCnt + 1, leaderPts, changes)).join('');

        const demSec = document.getElementById('tv-demais-sec');
        if (demSec) demSec.style.display = resto.length ? '' : 'none';

        const footEl = document.getElementById('tv-foot');
        if (footEl) {
          const ativos = ranking.filter(r => r.ativo).length;
          footEl.textContent = `⏱ ${new Date().toLocaleTimeString('pt-BR')} · ${ranking.length} participante${ranking.length !== 1 ? 's' : ''}${ativos ? ` · ⚡ ${ativos} jogando` : ''}`;
        }
      });
    }

    slideEl.classList.remove('fading');
    animateBar();
  }

  await showSlide(slideIdx);
  const interval = setInterval(() => {
    slideIdx = (slideIdx + 1) % slides.length;
    showSlide(slideIdx);
  }, 30000);

  window.addEventListener('beforeunload', () => {
    clearInterval(interval);
    if (currentUnsub) currentUnsub();
  });
}

// ══════════════════════════════════════════════════════════════
// FUNÇÕES COMPARTILHADAS (pódio / lista)
// ══════════════════════════════════════════════════════════════
function getRankGroupsProf(ranking) {
  const groups = [];
  let runPos = 1;
  for (let gi = 0; gi < ranking.length && groups.length < 3; ) {
    const score = ranking[gi].melhorPts ?? 0;
    let gj = gi + 1;
    while (gj < ranking.length && (ranking[gj].melhorPts ?? 0) === score) gj++;
    groups.push({ pos: runPos, students: ranking.slice(gi, gj), score });
    runPos += (gj - gi); gi = gj;
  }
  return groups;
}

function podNamesHTML(g, isPlus) {
  if (g.students.length === 1) {
    const r = g.students[0];
    return `<div class="pod-nome">${r.aluno}</div><div class="pod-turma">Turma ${r.turma}</div>`;
  }
  return `<div style="display:flex;width:100%;gap:0">${
    g.students.map((r, ni) => {
      const vsep = ni < g.students.length - 1
        ? `<div style="width:1px;background:rgba(255,255,255,.3);opacity:.5;align-self:stretch;margin:0 4px;flex-shrink:0"></div>` : '';
      return `<div style="flex:1;min-width:0;text-align:center">
        <div class="pod-nome" style="white-space:normal;overflow:visible;font-size:12px">${r.aluno}</div>
        <div class="pod-turma">T ${r.turma}</div>
      </div>${vsep}`;
    }).join('')
  }</div>`;
}

function renderPodiumHTML(ranking) {
  const groups  = getRankGroupsProf(ranking);
  const order   = [1, 0, 2];
  const classes = ['p2', 'p1', 'p3'];
  const medals  = ['🥇', '🥈', '🥉'];
  const isPlus  = modoAtivo === 'competicao_plus';
  return order.map((gi, vi) => {
    const g   = groups[gi];
    const cls = classes[vi];
    const stepW = g && g.students.length > 1 ? `min-width:${Math.min(g.students.length * 150, 320)}px;` : '';
    const r0 = g?.students[0];
    return `<div class="pod-col" id="pod-col-${gi}">
      <div class="pod-medal">${g ? medals[gi] : ''}</div>
      <div class="pod-step ${cls}" style="${stepW}">
        ${g ? `
          ${podNamesHTML(g, isPlus)}
          <div class="pod-pts">${g.score} pts</div>
          <div class="pod-extras">
            ${r0.ativo ? `<span class="pod-ativo">⚡ jogando</span>` : ''}
            ${isPlus
              ? `${r0.acertosRapidos > 0 ? `<span class="pod-rapid">⚡${r0.acertosRapidos}</span>` : ''}
                 ${r0.acertosDificeis > 0 ? `<span class="pod-dif">🏆${r0.acertosDificeis}</span>` : ''}
                 <span class="pod-tent">${r0.tentativas} sess.</span>`
              : `${r0.comboMax > 1 ? `<span class="pod-combo">🔥×${r0.comboMax}</span>` : ''}
                 <span class="pod-tent">${r0.tentativas} tent.</span>`}
          </div>` : `<div class="pod-empty">—</div>`}
      </div>
    </div>`;
  }).join('');
}

function atualizarPodio(ranking) {
  const groups = getRankGroupsProf(ranking);
  const order  = [1, 0, 2];
  const medals = ['🥇', '🥈', '🥉'];
  const isPlus = modoAtivo === 'competicao_plus';
  order.forEach((gi, vi) => {
    const col = document.getElementById(`pod-col-${gi}`);
    if (!col) return;
    const g        = groups[gi];
    const medalDiv = col.querySelector('.pod-medal');
    const stepDiv  = col.querySelector('.pod-step');
    if (medalDiv) medalDiv.textContent = g ? medals[gi] : '';
    if (!stepDiv) return;
    if (!g) { stepDiv.innerHTML = '<div class="pod-empty">—</div>'; return; }
    if (g.students.length > 1) stepDiv.style.minWidth = `${Math.min(g.students.length * 150, 320)}px`;
    const r0 = g.students[0];
    stepDiv.innerHTML = podNamesHTML(g, isPlus) + `
      <div class="pod-pts">${g.score} pts</div>
      <div class="pod-extras">
        ${r0.ativo ? `<span class="pod-ativo">⚡ jogando</span>` : ''}
        ${isPlus
          ? `${r0.acertosRapidos > 0 ? `<span class="pod-rapid">⚡${r0.acertosRapidos}</span>` : ''}
             ${r0.acertosDificeis > 0 ? `<span class="pod-dif">🏆${r0.acertosDificeis}</span>` : ''}
             <span class="pod-tent">${r0.tentativas} sess.</span>`
          : `${r0.comboMax > 1 ? `<span class="pod-combo">🔥×${r0.comboMax}</span>` : ''}
             <span class="pod-tent">${r0.tentativas} tent.</span>`}
      </div>`;
  });
}

function atualizarLista(resto) {
  const list = document.getElementById("rank-list");
  if (!list) return;
  if (!resto.length) { list.innerHTML = ''; return; }
  const isPlus = modoAtivo === 'competicao_plus';
  list.innerHTML = resto.map((r, i) => {
    const pos = i + 4;
    const metaPlus = `
      <span>Turma ${r.turma}</span>
      ${r.ativo ? `<span class="rk-tag-ativo">⚡ jogando</span>` : ''}
      ${r.acertosRapidos > 0 ? `<span class="rk-rapid">⚡${r.acertosRapidos} veloz</span>` : ''}
      ${r.acertosDificeis > 0 ? `<span class="rk-dif">🏆${r.acertosDificeis} bônus</span>` : ''}
      <span>${r.tentativas} sess.</span>`;
    const metaComp = `
      <span>Turma ${r.turma}</span>
      ${r.ativo ? `<span class="rk-tag-ativo">⚡ ao vivo</span>` : ''}
      ${r.comboMax > 1 ? `<span class="rk-combo">🔥×${r.comboMax}</span>` : ''}
      <span>${r.tentativas} tentativa${r.tentativas !== 1 ? 's' : ''}</span>`;
    return `<div class="rk-row${r.ativo ? ' ativo-now' : ''}">
      <div class="rk-num">${pos}</div>
      <div>
        <div class="rk-nome">${r.aluno}${isPlus ? '' : ` — T${r.turma}`}</div>
        <div class="rk-meta">${isPlus ? metaPlus : metaComp}</div>
      </div>
      <div class="rk-pts">${r.melhorPts}</div>
    </div>`;
  }).join('');
}
</script>
