<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>document.documentElement.setAttribute("data-theme","dark");</script>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#15102a">
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acompanhamento por aluno — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
<style>
  select.sel-turma{padding:9px 14px;border-radius:9px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
  .bim-tabs{display:flex;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:11px;padding:4px;flex-wrap:wrap}
  .bim-tab{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer;border:none;background:transparent;font-family:'Inter',sans-serif}
  .bim-tab.active{background:var(--purple);color:#fff;box-shadow:0 2px 8px rgba(108,0,212,.4)}

  /* seletor de aluno */
  .aluno-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .nav-btn{width:42px;height:42px;border-radius:11px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .nav-btn:hover{border-color:var(--purple)}
  .sel-wrap{position:relative;flex:1}
  .sel-wrap .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;fill:var(--text-muted);pointer-events:none}
  .sel-wrap select{width:100%;appearance:none;-webkit-appearance:none;background:var(--card);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-weight:700;font-size:15px;padding:12px 40px 12px 40px;cursor:pointer;outline:none}
  .sel-wrap select:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(155,48,255,.15)}
  .sel-wrap .chev{left:auto;right:13px}

  /* hero */
  .hero{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,#1e1440,#161233 60%,#141026);border:1.5px solid rgba(155,48,255,.25);border-radius:18px;padding:18px 22px;margin-bottom:16px;flex-wrap:wrap}
  .avatar{width:60px;height:60px;border-radius:16px;background:var(--purple-pale);color:#c79bff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex-shrink:0}
  .hero-id{flex:1;min-width:150px}
  .hero-id .nome{font-size:22px;font-weight:800;line-height:1.1}
  .hero-id .meta{font-size:13px;color:var(--text-muted);margin-top:3px}
  .chips{display:flex;gap:10px;flex-wrap:wrap}
  .chip{min-width:96px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:13px;padding:11px 14px}
  .chip .v{font-size:22px;font-weight:800;line-height:1}
  .chip .l{font-size:11px;color:var(--text-muted);margin-top:3px}
  .chip.g .v{color:var(--green)} .chip.r .v{color:var(--red)} .chip.o .v{color:var(--gold)}

  /* grid */
  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card + .card{margin-top:14px}
  .card-title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;margin-bottom:14px}
  .card-title svg{width:18px;height:18px;fill:var(--purple)}
  .card-title .count{margin-left:auto;font-size:12px;font-weight:700;color:var(--text-muted)}

  .niveis{display:flex;flex-direction:column;gap:8px}
  .nivel-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--border,rgba(255,255,255,.08))}
  .nivel-lbl{font-size:13px;font-weight:600}
  .nivel-val{font-size:13px;font-weight:800;color:var(--purple,#9b30ff);white-space:nowrap}
  .nota-big{font-size:34px;font-weight:800;color:var(--gold,#f0a500);line-height:1;text-align:center;padding:6px 0}
  .nota-msg{font-size:12.5px;color:var(--text-muted,rgba(255,255,255,.6));text-align:center;margin-top:6px}

  .filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .filtros button{border:1px solid var(--border);background:transparent;color:var(--text-muted);font-weight:700;font-size:11.5px;padding:5px 11px;border-radius:8px;cursor:pointer}
  .filtros button.on{background:var(--purple-pale);border-color:var(--purple);color:#c79bff}

  .ativ{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
  .ativ:last-child{border-bottom:0}
  .st{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
  .st.feita{background:var(--green-pale);color:var(--green)}
  .st.atraso{background:var(--gold-pale);color:var(--gold)}
  .st.fa{background:var(--gold-pale);color:var(--gold);border:1.5px dashed var(--gold)}
  .st.at{background:rgba(59,130,246,.15);color:#60a5fa}
  .st.atv{background:var(--green-pale);color:var(--green);border:1.5px solid #60a5fa}
  .st.falta{background:var(--red-pale);color:var(--red)}
  .st.nao{background:rgba(255,255,255,.05);color:var(--text-muted)}
  .st svg{width:17px;height:17px;fill:currentColor}
  .ativ-body{flex:1;min-width:0}
  .ativ-nome{font-size:13.5px;font-weight:700}
  .ativ-data{font-size:11.5px;color:var(--text-muted);margin-top:1px}
  .badge{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:7px;white-space:nowrap}
  .badge.feita{background:var(--green-pale);color:var(--green)}
  .badge.atraso{background:var(--gold-pale);color:var(--gold)}
  .badge.fa{background:var(--gold-pale);color:var(--gold)}
  .badge.at{background:rgba(59,130,246,.15);color:#60a5fa}
  .badge.atv{background:var(--green-pale);color:var(--green)}
  .badge.falta{background:var(--red-pale);color:var(--red)}
  .badge.nao{background:rgba(255,255,255,.06);color:var(--text-muted)}

  .falta-dates{display:flex;flex-wrap:wrap;gap:8px}
  .falta-pill{display:flex;flex-direction:column;align-items:center;background:var(--red-pale);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:7px 12px;min-width:60px}
  .falta-pill .d{font-size:15px;font-weight:800;color:var(--red);line-height:1}
  .falta-pill .w{font-size:10px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
  .vazio{font-size:12.5px;color:var(--text-muted);padding:6px 0}

  .oc{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--border);margin-left:5px}
  .oc:last-child{padding-bottom:2px;border-left-color:transparent}
  .oc::before{content:'';position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--purple)}
  .oc.neg::before{border-color:var(--red)} .oc.pos::before{border-color:var(--green)}
  .oc-data{font-size:11.5px;color:var(--text-muted);font-weight:600}
  .oc-tags{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0}
  .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px}
  .tag.pos{background:var(--green-pale);color:var(--green)}
  .tag.neg{background:var(--red-pale);color:var(--red)}
  .oc-obs{font-size:12.5px;color:var(--text);opacity:.85;line-height:1.4}

  @media(max-width:860px){ .content{padding:16px 12px} }
  .chip.b .v{color:#60a5fa}
  .at-pill{display:flex;flex-direction:column;align-items:center;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);border-radius:10px;padding:7px 12px;min-width:60px}
  .at-pill .d{font-size:15px;font-weight:800;color:#60a5fa;line-height:1}
  .at-pill .w{font-size:10px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
  .atraso-pill{display:flex;flex-direction:column;align-items:center;background:var(--gold-pale);border:1px solid rgba(240,165,0,.35);border-radius:10px;padding:7px 12px;min-width:60px}
  .atraso-pill .d{font-size:15px;font-weight:800;color:var(--gold);line-height:1}
  .atraso-pill .w{font-size:10px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
  .at-dias{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
  .at-form{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .at-form .at-row{display:flex;gap:8px}
  .at-form label{flex:1;display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--text-muted);font-weight:700}
  .at-form input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:9px;padding:8px 10px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px}
  .at-form input[type=date]{color-scheme:dark}
  .btn-primary{background:var(--purple);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif}
  .btn-primary:hover{filter:brightness(1.08)}
  .at-hint{font-size:11px;color:var(--text-muted);line-height:1.35}
  .at-hint b{color:#60a5fa}
  .at-periodos{display:flex;flex-direction:column;gap:7px}
  .per-item{position:relative;background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.25);border-radius:10px;padding:9px 34px 9px 12px}
  .per-range{font-size:12.5px;font-weight:700;color:var(--text)}
  .per-range span{color:#60a5fa;margin:0 3px}
  .per-obs{font-size:11.5px;color:var(--text-muted);margin-top:2px}
  .per-del{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:6px;border:none;background:var(--red-pale);color:var(--red);font-weight:800;cursor:pointer;line-height:1}
  .per-del:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">🧑‍🎓 Acompanhamento por aluno</div>
        <div class="topbar-sub" id="topbar-sub">Carregando…</div>
      </div>
      <div class="topbar-right">
        <select class="sel-turma" id="selTurma"></select>
      </div>
    </div>

    <div class="content">
      <div class="card" style="padding:14px 20px;margin-bottom:16px">
        <div class="bim-tabs" id="bimTabs"></div>
      </div>

      <div class="aluno-bar">
        <button class="nav-btn" id="prev" title="Aluno anterior">‹</button>
        <div class="sel-wrap">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-9 2-9 6v2h18v-2c0-4-5-6-9-6z"/></svg>
          <select id="selAluno"></select>
          <svg class="chev ico" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
        <button class="nav-btn" id="next" title="Próximo aluno">›</button>
      </div>

      <div id="conteudo"><div class="vazio">Carregando…</div></div>
    </div>
  </div>
</div>

<script type="module">
import { ALUNOS_POR_TURMA, numeroChamada, turmaAgora, BIMESTRES, dentroDoAtestado, normalizarAtestados, aulasNoDia } from "/js/constants.js";
import { setBimestre, montarBoletim, buscarProgressoTabuada, fmtNota, mensagemPorNota } from "/js/notas.js";
import { requireProfessor, renderSidebarProfessor, clearSession } from "/js/auth.js";
import { db } from "/js/firebase-config.js";
import { ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

requireProfessor();
renderSidebarProfessor("sidebar", "acomp_aluno");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const TURMAS = Object.keys(ALUNOS_POR_TURMA);
let turma = turmaAgora() || (TURMAS.includes("8F") ? "8F" : TURMAS[0]);
let bimestre = 3;
let idx = 0, filtro = "todas";

const POSITIVAS = ["Aluno se comportou", "Aluno foi participativo"];
const WD = ["dom","seg","ter","qua","qui","sex","sáb"];
const fmtDMY = iso => { if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
const fmtDM  = iso => { const [,m,d]=iso.split("-"); return `${d}/${m}`; };
const weekday = iso => { try{ return WD[new Date(iso+"T12:00:00").getDay()]; }catch(e){ return ""; } };
const iniciais = n => n.split(" ").filter(Boolean).slice(0,2).map(s=>s[0]).join("").toUpperCase();
const hhmm = ts => { const d=new Date(ts); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const dataDeTs = ts => { const d=new Date(ts); const o=d.getTimezoneOffset(); return new Date(d.getTime()-o*60000).toISOString().slice(0,10); };

const LABEL = {
  feita:"Feita", atraso:"Atraso",
  fa:"Falta · entregou depois", atv:"Atestado · entregou depois",
  at:"Atestado médico", falta:"Falta", nao:"Não feita",
};
const ICON = {
  feita:'<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>',
  atraso:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 11H7v-2h4V6h2z"/></svg>',
  fa:'<span style="font-weight:800;font-size:12px">FA</span>',
  atv:'<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>',
  at:'<span style="font-weight:800;font-size:11px">AT</span>',
  falta:'<svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>',
  nao:'<svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14z"/></svg>',
};

// dados carregados
let atividades = [];   // [{id,nome,data,ordem}]
let marcas = {};       // { atvId:{ aluno:0|1|2 } }
let chamada = {};      // { "YYYY-MM-DD": { aluno:true } }
let anotacoes = {};    // { aluno:[ {ts, ocorrencias:[], obs} ] }
let atestados = {};    // { aluno:[ {inicio,fim,ts,obs} ] }
let nivelTab = 0, nivelNeg = 0, boletim = null;   // extras por-aluno (tabuada + nota)
let extrasToken = 0;                              // guarda anti-corrida ao trocar de aluno

const temAtestado = (data, aluno) => dentroDoAtestado(data, atestados[aluno]||[]);
const estadoCham = (data, aluno) => { const v=(chamada[data]||{})[aluno]; return v===true?"falta":(v||""); };
const faltou  = (data, aluno) => estadoCham(data, aluno)==="falta" && !temAtestado(data, aluno);
const atrasou = (data, aluno) => estadoCham(data, aluno)==="atraso" && !temAtestado(data, aluno);
const aulasDia = data => aulasNoDia(turma, data) || 1;

async function carregar(){
  document.getElementById("conteudo").innerHTML = `<div class="vazio">Carregando…</div>`;
  // topo
  document.getElementById("selTurma").innerHTML =
    TURMAS.map(t=>`<option ${t===turma?"selected":""}>${t}</option>`).join("");
  document.getElementById("bimTabs").innerHTML =
    [1,2,3,4].map(b=>`<button class="bim-tab ${b===bimestre?"active":""}" data-b="${b}">${b}º Bim</button>`).join("");
  document.querySelectorAll(".bim-tab").forEach(el=>el.onclick=()=>{ bimestre=+el.dataset.b; carregar(); });
  document.getElementById("topbar-sub").textContent = `Turma ${turma} · ${bimestre}º bimestre`;

  try{
    const [sV, sC, sO, sA] = await Promise.all([
      get(ref(db, `vistos/${turma}/${bimestre}`)),
      get(ref(db, `chamada/${turma}/${bimestre}`)),
      get(ref(db, `mapeamento_salas/${turma}/anotacoes`)),
      get(ref(db, `atestados/${turma}`)),
    ]);
    const rv = sV.exists()?sV.val():{};
    atividades = Object.entries(rv.atividades||{})
      .map(([id,a])=>({id, nome:a.nome||"(sem nome)", data:a.data||"", ordem:a.ordem||0}))
      .sort((x,y)=> (x.ordem-y.ordem) || (x.data<y.data?-1:1));
    marcas = rv.marcas||{};
    chamada = {};
    const rc = sC.exists()?sC.val():{};
    Object.entries(rc).forEach(([k,v])=>{ if(/^\d{4}-\d{2}-\d{2}$/.test(k)) chamada[k]=v||{}; });
    const rawAnot = sO.exists()?(sO.val()||{}):{};
    anotacoes = {};
    Object.values(rawAnot).forEach(entry=>{ if(entry && entry.nome) anotacoes[entry.nome] = entry.registros || []; });
    atestados = normalizarAtestados(sA.exists()?sA.val():{});
  }catch(e){
    console.error(e);
    atividades=[]; marcas={}; chamada={}; anotacoes={}; atestados={};
    document.getElementById("conteudo").innerHTML = `<div class="vazio">Erro ao carregar (verifique as regras do Firebase para 'vistos', 'chamada' e 'mapeamento_salas').</div>`;
    return;
  }

  // seletor de aluno
  const alunos = ALUNOS_POR_TURMA[turma] || [];
  if (idx >= alunos.length) idx = 0;
  const sel = document.getElementById("selAluno");
  sel.innerHTML = alunos.map((nome,i)=>`<option value="${i}">${numeroChamada(turma,nome)||"—"} · ${nome}</option>`).join("");
  sel.value = idx;
  carregarAlunoExtras();
}

async function carregarAlunoExtras(){
  const alunos = ALUNOS_POR_TURMA[turma] || [];
  const aluno = alunos[idx];
  nivelTab = 0; nivelNeg = 0; boletim = null;
  render();                       // desenha o resto na hora; extras chegam depois
  if (!aluno) return;
  const tk = ++extrasToken;
  setBimestre(bimestre);
  try {
    const p = await buscarProgressoTabuada(turma, aluno);
    if (tk !== extrasToken) return;      // trocou de aluno no meio
    nivelTab = p.melhorTabuada || 0;
    nivelNeg = p.melhorNeg || 0;
  } catch (e) {}
  try {
    const b = await montarBoletim(turma, aluno, { ignorarLiberacao: true });
    if (tk !== extrasToken) return;
    boletim = b;
  } catch (e) { boletim = null; }
  if (tk === extrasToken) render();
}
function statusAtiv(atv, aluno){
  const v = (marcas[atv.id]||{})[aluno]||0;
  if (v===1) return "feita";
  if (v===2) return "atraso";
  if (v===3) return "fa";
  if (v===4) return "atv";
  const faltouDia = atv.data && estadoCham(atv.data, aluno)==="falta";   // atraso NÃO conta
  if (faltouDia && temAtestado(atv.data, aluno)) return "at";
  if (faltou(atv.data, aluno)) return "falta";
  return "nao";
}

function faltasDoAluno(aluno){
  return Object.keys(chamada).filter(d=>faltou(d, aluno)).sort();
}
function atrasosDoAluno(aluno){
  return Object.keys(chamada).filter(d=>atrasou(d, aluno)).sort();
}
function atestadoDiasDoAluno(aluno){
  return Object.keys(chamada).filter(d=>estadoCham(d, aluno) && temAtestado(d, aluno)).sort();
}

function ocorrenciasDoAluno(aluno){
  const bim = BIMESTRES.find(b=>b.n===bimestre);
  const ini = bim ? new Date(bim.inicio+"T00:00:00").getTime() : -Infinity;
  const fim = bim ? new Date(bim.fim+"T23:59:59").getTime() : Infinity;
  return (anotacoes[aluno]||[])
    .filter(r=> typeof r.ts!=="number" || (r.ts>=ini && r.ts<=fim))
    .slice().sort((a,b)=> (b.ts||0)-(a.ts||0));
}

function render(){
  const alunos = ALUNOS_POR_TURMA[turma] || [];
  const aluno = alunos[idx];
  if (!aluno){ document.getElementById("conteudo").innerHTML = `<div class="vazio">Turma sem alunos.</div>`; return; }

  const linhas = atividades.map(atv=>({...atv, st:statusAtiv(atv, aluno)}));
  const cheias = linhas.filter(l=>l.st==="feita"||l.st==="atraso"||l.st==="atv").length;
  const meias  = linhas.filter(l=>l.st==="fa").length;
  const feitasNum = cheias + meias*0.5;
  const feitasTxt = Number.isInteger(feitasNum) ? String(feitasNum) : feitasNum.toFixed(1).replace(".", ",");
  const naoF   = linhas.filter(l=>l.st==="nao").length;
  const faltas = faltasDoAluno(aluno);
  const atrasos = atrasosDoAluno(aluno);
  const atDias = atestadoDiasDoAluno(aluno);
  const faltasAulas = faltas.reduce((s,d)=>s+aulasDia(d),0);
  const atrasosAulas = atrasos.length;
  const periodos = (atestados[aluno]||[]).slice().sort((a,b)=> (a.inicio<b.inicio?1:-1));
  const oc     = ocorrenciasDoAluno(aluno);

  const rows = linhas.filter(l=> filtro==="todas" ? true
    : filtro==="feita" ? (l.st==="feita"||l.st==="atraso"||l.st==="fa"||l.st==="atv")
    : filtro==="at" ? (l.st==="at"||l.st==="atv")
    : l.st===filtro);

  const atvHtml = rows.length ? rows.map(r=>`
    <div class="ativ">
      <div class="st ${r.st}">${ICON[r.st]}</div>
      <div class="ativ-body">
        <div class="ativ-nome">${r.nome}</div>
        <div class="ativ-data">${r.data?`${fmtDMY(r.data)} · ${weekday(r.data)}`:"sem data"}</div>
      </div>
      <span class="badge ${r.st}">${LABEL[r.st]}</span>
    </div>`).join("") : `<div class="vazio">Nada neste filtro.</div>`;

  const faltasHtml = faltas.length ? faltas.map(d=>`
    <div class="falta-pill"><div class="d">${fmtDM(d)}</div><div class="w">${weekday(d)} · ${aulasDia(d)}a</div></div>`).join("")
    : `<div class="vazio">Sem faltas no bimestre. 🎉</div>`;

  const atrasosHtml = atrasos.length ? atrasos.map(d=>`
    <div class="atraso-pill"><div class="d">${fmtDM(d)}</div><div class="w">${weekday(d)}</div></div>`).join("")
    : `<div class="vazio">Sem atrasos no bimestre.</div>`;

  const atDiasHtml = atDias.length ? atDias.map(d=>`
    <div class="at-pill"><div class="d">${fmtDM(d)}</div><div class="w">${weekday(d)}</div></div>`).join("")
    : `<div class="vazio" style="padding:2px 0 8px">Nenhum dia de aula caiu dentro de um atestado ainda.</div>`;

  const periodosHtml = periodos.length ? periodos.map(p=>`
    <div class="per-item">
      <div class="per-range">${fmtDMY(p.inicio)} <span>→</span> ${fmtDMY(p.fim)}</div>
      ${p.obs?`<div class="per-obs">${(p.obs+"").replace(/</g,"&lt;")}</div>`:""}
      <button class="per-del" data-ini="${p.inicio}" data-fim="${p.fim}" data-ts="${p.ts||0}" title="Remover atestado">✕</button>
    </div>`).join("") : `<div class="vazio">Nenhum atestado cadastrado.</div>`;

  const ocHtml = oc.length ? oc.map(o=>{
    const tags = (o.ocorrencias||[]);
    const neg = tags.some(t=>!POSITIVAS.includes(t));
    const cls = tags.length ? (neg?"neg":"pos") : "";
    const tagsHtml = tags.map(t=>`<span class="tag ${POSITIVAS.includes(t)?"pos":"neg"}">${t}</span>`).join("");
    const quando = typeof o.ts==="number" ? `${fmtDMY(dataDeTs(o.ts))} · ${hhmm(o.ts)}` : "";
    return `<div class="oc ${cls}">
      <div class="oc-data">${quando}</div>
      ${tagsHtml?`<div class="oc-tags">${tagsHtml}</div>`:""}
      ${o.obs?`<div class="oc-obs">${o.obs}</div>`:""}
    </div>`;
  }).join("") : `<div class="vazio">Sem ocorrências neste bimestre.</div>`;

  const tabuadaCard = `
    <div class="card">
      <div class="card-title">
        <svg viewBox="0 0 24 24"><path d="M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm1 2v4h4V5H5zm6 0v4h8V5h-8zM5 11v4h4v-4H5zm6 0v4h8v-4h-8zM5 17v2h4v-2H5zm6 0v2h8v-2h-8z"/></svg>
        Tabuada
      </div>
      <div class="niveis">
        <div class="nivel-row"><span class="nivel-lbl">Tabuada</span><span class="nivel-val">${nivelTab ? "Nível " + nivelTab : "—"}</span></div>
        <div class="nivel-row"><span class="nivel-lbl">Tabuada de Negativos</span><span class="nivel-val">${nivelNeg ? "Nível " + nivelNeg : "—"}</span></div>
      </div>
    </div>`;

  const temNota = !!boletim && (Object.values(boletim.lancados || {}).some(Boolean) || (boletim.total || 0) > 0);
  const notaCard = temNota ? `
    <div class="card">
      <div class="card-title">
        <svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm2 5v2h10V8H7zm0 4v2h10v-2H7z"/></svg>
        Nota do ${bimestre}º bimestre
      </div>
      <div class="nota-big">${fmtNota(boletim.total)}</div>
      <div class="nota-msg">${mensagemPorNota(boletim.total)}</div>
    </div>` : "";

  document.getElementById("conteudo").innerHTML = `
    <div class="hero">
      <div class="avatar">${iniciais(aluno)}</div>
      <div class="hero-id">
        <div class="nome">${aluno}</div>
        <div class="meta">Nº ${numeroChamada(turma,aluno)||"—"} · Turma ${turma} · ${bimestre}º Bimestre</div>
      </div>
      <div class="chips">
        <div class="chip g"><div class="v">${feitasTxt}/${atividades.length}</div><div class="l">Feitas</div></div>
        <div class="chip r"><div class="v">${naoF}</div><div class="l">Não feitas</div></div>
        <div class="chip r"><div class="v">${faltasAulas}</div><div class="l">Faltas (aulas)</div></div>
        <div class="chip o"><div class="v">${atrasos.length}</div><div class="l">Atrasos</div></div>
        <div class="chip b"><div class="v">${atDias.length}</div><div class="l">Atestado</div></div>
        <div class="chip o"><div class="v">${oc.length}</div><div class="l">Ocorrências</div></div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5V9.2zM10.6 5h2.8v14h-2.8V5zm5.6 8H19v6h-2.8v-6z"/></svg>
          Atividades do bimestre <span class="count">${rows.length} de ${atividades.length}</span>
        </div>
        <div class="filtros" id="filtros">
          <button class="${filtro==="todas"?"on":""}" data-f="todas">Todas</button>
          <button class="${filtro==="feita"?"on":""}" data-f="feita">Feitas</button>
          <button class="${filtro==="nao"?"on":""}" data-f="nao">Não feitas</button>
          <button class="${filtro==="falta"?"on":""}" data-f="falta">Faltas</button>
          <button class="${filtro==="at"?"on":""}" data-f="at">Atestado</button>
        </div>
        <div>${atvHtml}</div>
      </div>

      <div>
        ${tabuadaCard}
        ${notaCard}
        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm12 8v9H5v-9h14z"/></svg>
            Faltas <span class="count">${faltas.length} dia(s) · ${faltasAulas} aula(s)</span>
          </div>
          <div class="falta-dates">${faltasHtml}</div>
        </div>
        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 11h-1a1 1 0 0 1-1-1V7a1 1 0 0 1 2 0v4h1a1 1 0 0 1 0 2z"/></svg>
            Atrasos <span class="count">${atrasos.length} dia(s) · ${atrasosAulas} aula(s)</span>
          </div>
          <div class="falta-dates">${atrasosHtml}</div>
        </div>
        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm4 12h-3v3h-2v-3H8v-2h3v-3h2v3h3v2z"/></svg>
            Atestado médico <span class="count">${atDias.length} dia(s) de aula</span>
          </div>
          <div class="at-form">
            <div class="at-row">
              <label>Início<input type="date" id="atIni"></label>
              <label>Fim<input type="date" id="atFim"></label>
            </div>
            <input type="text" id="atObs" placeholder="Observação (opcional): ex. CID, médico…">
            <button class="btn-primary" id="atAdd">＋ Adicionar atestado</button>
            <div class="at-hint">Marca <b>AT</b> em todos os dias do período na chamada e nos vistos. Dias justificados não contam como falta. Nos vistos, o botão <b>AT✓</b> registra entrega com nota integral.</div>
          </div>
          <div class="at-dias">${atDiasHtml}</div>
          <div class="at-periodos">${periodosHtml}</div>
        </div>
        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            Ocorrências <span class="count">${oc.length}</span>
          </div>
          <div>${ocHtml}</div>
        </div>
      </div>
    </div>`;

  document.querySelectorAll("#filtros button").forEach(b=>b.onclick=()=>{ filtro=b.dataset.f; render(); });

  const btnAdd = document.getElementById("atAdd");
  if (btnAdd) btnAdd.onclick = ()=>{
    salvarAtestado(aluno, document.getElementById("atIni").value, document.getElementById("atFim").value, document.getElementById("atObs").value.trim());
  };
  document.querySelectorAll(".per-del").forEach(b=>b.onclick=()=>{
    removerAtestado(aluno, b.dataset.ini, b.dataset.fim, +b.dataset.ts);
  });
}

async function salvarAtestado(aluno, inicio, fim, obs){
  if(!inicio || !fim){ alert("Informe as datas de início e fim do atestado."); return; }
  if(fim < inicio){ alert("A data final não pode ser anterior à inicial."); return; }
  const lista = (atestados[aluno]||[]).slice();
  lista.push({ inicio, fim, obs: obs||"", ts: Date.now() });
  try{
    await set(ref(db, `atestados/${turma}/${aluno}`), lista);
    atestados[aluno] = lista;
    render();
  }catch(e){ console.error(e); alert("Não foi possível salvar. Verifique as regras do Firebase para 'atestados'."); }
}

async function removerAtestado(aluno, inicio, fim, ts){
  if(!confirm(`Remover o atestado de ${fmtDMY(inicio)} a ${fmtDMY(fim)}?`)) return;
  const lista = (atestados[aluno]||[]).filter(p=> !(p.inicio===inicio && p.fim===fim && (p.ts||0)===ts));
  try{
    if(lista.length) await set(ref(db, `atestados/${turma}/${aluno}`), lista);
    else await remove(ref(db, `atestados/${turma}/${aluno}`));
    atestados[aluno] = lista;
    render();
  }catch(e){ console.error(e); alert("Não foi possível remover."); }
}

// eventos
document.getElementById("selTurma").addEventListener("change", e=>{ turma=e.target.value; idx=0; carregar(); });
document.getElementById("selAluno").addEventListener("change", e=>{ idx=+e.target.value; carregarAlunoExtras(); });
document.getElementById("prev").onclick=()=>{ const n=(ALUNOS_POR_TURMA[turma]||[]).length; if(!n)return; idx=(idx-1+n)%n; document.getElementById("selAluno").value=idx; carregarAlunoExtras(); };
document.getElementById("next").onclick=()=>{ const n=(ALUNOS_POR_TURMA[turma]||[]).length; if(!n)return; idx=(idx+1)%n; document.getElementById("selAluno").value=idx; carregarAlunoExtras(); };

carregar();
</script>
</body>
</html>
