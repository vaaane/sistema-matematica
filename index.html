<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#6c00d4">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Matemática</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF6B1A;
    --orange-dark: #E55A0A;
    --orange-light: #FF8C4A;
    --dark: #1A1A2E;
    --dark-2: #16213E;
    --dark-3: #0F1628;
    --muted: #8A8A9A;
    --muted-2: #5A5A7A;
    --white: #FFFFFF;
    --purple: #6c00d4;
    --purple-dark: #1a0040;
    --purple-light: #9b30ff;
    --gold: #f0a500;
    --gold-light: #ffc84a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: radial-gradient(ellipse at center, #1a0040 0%, #0a0020 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    padding: 36px 0 38px;
  }

  .bg-shapes { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .shape { position: absolute; }
  .shape-1 { width: 520px; height: 520px; border: 48px solid var(--purple-light); border-radius: 50%; top: -160px; right: -160px; opacity: .05; animation: rotate 28s linear infinite; }
  .shape-2 { width: 260px; height: 260px; border: 28px solid var(--gold); bottom: 4%; left: -90px; transform: rotate(45deg); opacity: .04; animation: rotate 17s linear infinite reverse; }
  .shape-3 { width: 190px; height: 190px; border: 22px solid var(--purple-light); border-radius: 38px; bottom: 22%; right: 4%; opacity: .035; animation: float 11s ease-in-out infinite; }
  .shape-4 { width: 120px; height: 120px; border: 18px solid var(--gold); border-radius: 50%; top: 40%; left: 5%; opacity: .03; animation: float 14s ease-in-out infinite reverse; }
  .shape-5 { width: 80px; height: 80px; border: 14px solid var(--purple-light); top: 15%; left: 20%; opacity: .04; transform: rotate(20deg); animation: rotate 22s linear infinite; }
  .shape-6 { width: 340px; height: 340px; border: 1px solid rgba(255,107,26,.06); border-radius: 50%; bottom: -100px; left: 30%; animation: rotate 40s linear infinite reverse; }

  .dot-grid { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: radial-gradient(circle, rgba(255,107,26,.06) 1px, transparent 1px); background-size: 38px 38px; mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%); -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%); }

  .math-symbols { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .sym { position: absolute; bottom: -80px; font-family: 'Syne', sans-serif; font-weight: 800; user-select: none; pointer-events: none; }

  @keyframes rotate { to { transform: rotate(360deg); } }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-28px) rotate(8deg); } }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    8%   { opacity: var(--op); }
    92%  { opacity: var(--op); }
    100% { transform: translateY(-110vh) rotate(var(--rot)); opacity: 0; }
  }
  @keyframes floatDrift {
    0%   { transform: translate(0,0) rotate(0deg); opacity: 0; }
    8%   { opacity: var(--op); }
    33%  { transform: translate(var(--dx), -36vh) rotate(90deg); }
    66%  { transform: translate(calc(var(--dx) * -0.5), -72vh) rotate(200deg); }
    92%  { opacity: var(--op); }
    100% { transform: translate(var(--dx), -110vh) rotate(var(--rot)); opacity: 0; }
  }
  @keyframes bounceIn {
    0%   { opacity: 0; transform: scale(0.85) translateY(32px); }
    60%  { opacity: 1; transform: scale(1.03) translateY(-6px); }
    80%  { transform: scale(0.99) translateY(3px); }
    100% { transform: scale(1) translateY(0); }
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideUpDelay { 0%, 25% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  @keyframes tickerScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  @keyframes pulseAlert { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,107,26,0.35); } 50% { opacity: 0.88; box-shadow: 0 0 0 7px rgba(255,107,26,0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes boltPulse { 0%, 100% { text-shadow: 0 0 8px rgba(255,107,26,0.6); transform: scale(1); } 50% { text-shadow: 0 0 20px rgba(255,107,26,1), 0 0 40px rgba(255,107,26,0.4); transform: scale(1.12); } }
  @keyframes fieldReveal { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes ripple { from { transform: translate(-50%, -50%) scale(0); opacity: 0.45; } to { transform: translate(-50%, -50%) scale(5); opacity: 0; } }

  /* ── Stats bar (Opção B) ── */
  .stats-bar { position: relative; z-index: 10; display: flex; flex-direction: column; gap: 0; margin-bottom: 10px; animation: slideUp 0.5s ease both; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07); border-radius: 14px; padding: 10px 4px; }
  .stats-main { display: flex; gap: 0; }
  .stat-col { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 4px 8px; position: relative; }
  .stat-col + .stat-col::before { content: ''; position: absolute; left: 0; top: 10%; height: 80%; width: 1px; background: rgba(255,255,255,.07); }
  .stat-top { display: flex; align-items: baseline; gap: 5px; }
  .stat-num { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: var(--gold); line-height: 1; }
  .stat-today { font-size: 11px; font-weight: 700; color: rgba(240,165,0,.6); line-height: 1; white-space: nowrap; }
  .stat-label { font-size: 8px; color: var(--muted-2); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }


  .clock { position: fixed; top: 16px; right: 20px; z-index: 20; font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; color: var(--muted-2); letter-spacing: 1px; }

  .container { position: relative; z-index: 10; width: 100%; max-width: 420px; padding: 0 20px; animation: bounceIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }

  .logo-area { text-align: center; margin-bottom: 10px; }
  .logo-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; color: var(--white); letter-spacing: -0.5px; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px; }
  .logo-bolt { font-size: 22px; color: var(--orange); animation: boltPulse 2.5s ease-in-out infinite; display: inline-block; }
  .logo-sub { font-size: 11px; color: var(--muted-2); margin-top: 3px; }

  .card { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.07); border-radius: 20px; padding: 18px 20px; backdrop-filter: blur(20px); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }

  .activity-alert { background: linear-gradient(135deg, rgba(255,107,26,0.15), rgba(255,140,74,0.08)); border: 1px solid rgba(255,107,26,0.25); border-radius: 10px; padding: 7px 12px; font-size: 12px; color: var(--orange-light); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; animation: pulseAlert 1.8s ease-in-out infinite; }

  .role-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 14px; background: rgba(255,255,255,0.04); padding: 4px; border-radius: 12px; animation: slideUpDelay 0.8s ease both; }
  .role-tab { padding: 8px; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--muted); background: transparent; }
  .role-tab.active { background: linear-gradient(135deg, var(--purple), var(--purple-light)); color: white; box-shadow: 0 3px 12px rgba(108,0,212,0.35); }
  .role-tab:not(.active):hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); }

  .field { margin-bottom: 9px; }
  .field-anim { animation: fieldReveal 0.4s ease both; }
  .field-label { display: block; font-size: 9.5px; font-weight: 600; letter-spacing: 0.9px; text-transform: uppercase; color: var(--muted-2); margin-bottom: 4px; }
  .field-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 9px; align-items: end; }
  .field-row .field { margin-bottom: 0; }
  .field-row-2 { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
  .field-row-2 .field { margin-bottom: 0; }

  select, input[type="text"], input[type="password"] {
    width: 100%; background: rgba(255,255,255,0.055); border: 1.5px solid rgba(255,255,255,0.09);
    border-radius: 10px; padding: 8px 11px; font-family: 'DM Sans', sans-serif; font-size: 13.5px;
    color: var(--white); outline: none; transition: all 0.25s ease; appearance: none; -webkit-appearance: none;
  }
  select option { background: var(--dark-2); color: var(--white); }
  select:focus, input:focus { border-color: var(--purple-light); background: rgba(108,0,212,0.07); box-shadow: 0 0 0 3px rgba(108,0,212,0.1); }
  select:disabled, input:disabled { opacity: 0.32; cursor: not-allowed; }

  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 38px; }
  .pw-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted-2); padding: 3px; display: flex; transition: color 0.2s; }
  .pw-toggle:hover { color: var(--orange); }

  .pin-wrap { position: relative; width: 72px; }
  .pin-wrap input { width: 72px !important; text-align: center; font-size: 16px; letter-spacing: 3px; padding: 8px 22px 8px 4px !important; }
  .pin-eye { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted-2); padding: 2px; display: flex; transition: color 0.15s; user-select: none; -webkit-user-select: none; touch-action: none; }
  .pin-eye.showing { color: var(--orange); }

  .divider { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06); }
  .divider span { font-size: 9.5px; color: var(--muted-2); letter-spacing: 0.5px; }

  .optional-label { font-size: 9.5px; font-weight: 600; letter-spacing: 0.9px; text-transform: uppercase; color: var(--muted-2); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .optional-badge { background: rgba(255,255,255,0.07); color: var(--muted-2); font-size: 8px; padding: 2px 6px; border-radius: 20px; }

  .error-msg { background: rgba(255,59,48,0.08); border: 1px solid rgba(255,59,48,0.18); border-radius: 9px; padding: 7px 12px; font-size: 12px; color: #FF7070; margin-bottom: 9px; display: none; align-items: center; gap: 7px; }
  .error-msg.show { display: flex; }
  .error-msg.shake { animation: shake 0.4s ease; }

  .btn-submit { width: 100%; background: linear-gradient(135deg, var(--purple) 0%, var(--gold) 100%); border: none; border-radius: 12px; padding: 11px; font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: white; cursor: pointer; transition: all 0.2s ease; margin-top: 4px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 8px; animation: slideUpDelay 1.1s ease both; }
  .btn-submit::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent); opacity: 0; transition: opacity 0.2s; }
  .btn-submit:hover::before { opacity: 1; }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(108,0,212,0.45); }
  .btn-submit:active { transform: translateY(0); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-ripple { position: absolute; width: 60px; height: 60px; background: rgba(255,255,255,0.35); border-radius: 50%; pointer-events: none; animation: ripple 0.65s ease-out forwards; }
  .spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; display: none; }
  .btn-submit.loading .spinner { display: block; }
  .btn-submit.loading .btn-text { opacity: 0.6; }

  .ticker { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: rgba(255,107,26,0.08); border-top: 1px solid rgba(255,107,26,0.12); padding: 6px 0; overflow: hidden; }
  .ticker-inner { display: flex; white-space: nowrap; animation: tickerScroll 45s linear infinite; width: max-content; }
  .ticker-item { font-size: 11.5px; color: var(--muted-2); padding: 0 28px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .ticker-item span { color: var(--orange-light); font-weight: 500; }

  @media (max-width: 480px) {
    .card { padding: 16px; }
    .logo-title { font-size: 19px; }
    body { padding: 24px 0 38px; }
  }
</style>
</head>
<body>
<style>
  #splash-screen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at center, #1a0040 0%, #0a0020 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s ease;
  }
  @keyframes splashEntry {
    0%   { transform: scale(0);    opacity: 0; }
    67%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1);    opacity: 1; }
  }
  @keyframes splashPulse {
    0%, 100% { transform: scale(1);    }
    50%       { transform: scale(1.08); }
  }
  @keyframes splashFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  #splash-logo {
    width: 200px;
    height: auto;
    object-fit: contain;
    animation: splashEntry 0.9s ease-out forwards;
  }
  #splash-logo.pulsing {
    animation: splashPulse 1.8s ease-in-out infinite;
  }
  #splash-title {
    margin-top: 20px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #splash-title .line1 {
    display: block;
    color: #fff;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 3px;
    font-family: sans-serif;
  }
  #splash-title .line2 {
    display: block;
    color: #fff;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 2px;
    font-family: sans-serif;
  }
  #splash-sub {
    margin-top: 12px;
    color: #f0a500;
    font-size: 11px;
    letter-spacing: 4px;
    font-weight: 400;
    font-family: sans-serif;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
</style>
<div id="splash-screen">
  <img id="splash-logo" src="/logo_fundotransparente.png" alt="">
  <div id="splash-title">
    <span class="line1">Sistema de</span>
    <span class="line2">Matemática</span>
  </div>
  <div id="splash-sub">APRENDER • COMPETIR • EVOLUIR</div>
</div>
<script>
  (function(){
    var logo  = document.getElementById('splash-logo');
    var s     = document.getElementById('splash-screen');
    var title = document.getElementById('splash-title');
    var sub   = document.getElementById('splash-sub');

    function iniciar() {
      // Mostra tela
      s.style.opacity = '1';
      // Logo já tem animação CSS (splashEntry)
      // Título e sub aparecem junto, logo após
      setTimeout(function(){ title.style.opacity = '1'; }, 300);
      setTimeout(function(){ sub.style.opacity   = '1'; }, 500);
      // Pulso da logo
      setTimeout(function(){ logo.classList.add('pulsing'); }, 900);
      // Fade out e remove
      setTimeout(function(){
        s.style.opacity = '0';
        setTimeout(function(){ s.remove(); }, 500);
      }, 3000);
    }

    if (logo.complete && logo.naturalWidth > 0) {
      iniciar();
    } else {
      logo.addEventListener('load',  iniciar);
      logo.addEventListener('error', iniciar);
    }
  })();
</script>

<div class="bg-shapes">
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>
  <div class="shape shape-4"></div>
  <div class="shape shape-5"></div>
  <div class="shape shape-6"></div>
</div>
<div class="dot-grid"></div>
<div class="math-symbols" id="mathSymbols"></div>
<div class="clock" id="clock"></div>

<div class="container">
  <div class="logo-area">
    <div class="logo-title"><img src="/logo_fundotransparente.png" style="width:80px;height:80px;object-fit:contain;flex-shrink:0;"><span style="white-space:nowrap;">Sistema de<br>Matemática</span></div>
    <div class="logo-sub">CED São Bartolomeu · São Sebastião</div>
    <div style="font-size:10px;color:#f0a500;letter-spacing:3px;margin-top:4px;">APRENDER • COMPETIR • EVOLUIR</div>
  </div>

  <div class="stats-bar">
    <div class="stats-main">
      <div class="stat-col">
        <div class="stat-top">
          <span class="stat-num" id="statAtividades">—</span>
          <span class="stat-today" id="statAtividadesHoje"></span>
        </div>
        <div class="stat-label">Atividades</div>
      </div>
      <div class="stat-col">
        <div class="stat-top">
          <span class="stat-num" id="statSessoesTabuada">—</span>
          <span class="stat-today" id="statTabuadaHoje"></span>
        </div>
        <div class="stat-label">Tabuada</div>
      </div>
      <div class="stat-col">
        <div class="stat-top">
          <span class="stat-num" id="statDuelos">—</span>
          <span class="stat-today" id="statDuelosHoje"></span>
        </div>
        <div class="stat-label">Duelos</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="activity-alert" id="activityAlert" style="display:none;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2.05v2.02c3.95.49 7 3.85 7 7.93 0 3.21-1.81 6-4.72 7.28L13 17v5h5l-1.22-1.22C19.91 19.07 22 15.76 22 12c0-5.18-3.95-9.45-9-9.95zM11 2.05C5.95 2.55 2 6.82 2 12c0 3.76 2.09 7.07 5.22 8.78L6 22h5v-5l-2.28 2.28C6.81 18 5 15.21 5 12c0-4.08 3.05-7.44 7-7.93V2.05z"/></svg>
      ⚡ Atividade liberada! Entre rápido.
    </div>

    <div class="role-tabs">
      <button class="role-tab active" id="tabAluno" onclick="setRole('aluno')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        Sou Aluno
      </button>
      <button class="role-tab" id="tabProf" onclick="setRole('professor')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>
        Professor
      </button>
    </div>

    <!-- Aluno form -->
    <div id="formAluno">
      <div class="field field-anim" style="animation-delay:0.05s">
        <label class="field-label">Turma</label>
        <select id="turmaSelect" onchange="carregarAlunos()">
          <option value="">Selecionar turma...</option>
        </select>
      </div>

      <div class="field-row field-anim" style="animation-delay:0.12s">
        <div class="field">
          <label class="field-label">Aluno 1</label>
          <select id="alunoSelect" disabled onchange="focusSenha()">
            <option value="">Selecionar...</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label">Senha</label>
          <div class="pin-wrap">
            <input type="password" id="senhaAluno" maxlength="4" inputmode="numeric" disabled
              onkeydown="if(event.key==='Enter') entrarAluno(event)">
            <button class="pin-eye" id="eyeAluno" tabindex="-1"
              onmousedown="showPin('senhaAluno','eyeAluno')" onmouseup="hidePin('senhaAluno','eyeAluno')" onmouseleave="hidePin('senhaAluno','eyeAluno')"
              ontouchstart="showPin('senhaAluno','eyeAluno')" ontouchend="hidePin('senhaAluno','eyeAluno')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="error-msg" id="errorAluno">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <span id="errorAlunoMsg">Senha incorreta</span>
      </div>

      <button class="btn-submit" id="btnAluno" onclick="entrarAluno(event)" style="animation-delay:0.35s">
        <div class="spinner"></div>
        <span class="btn-text">▶ Entrar</span>
      </button>
    </div>

    <!-- Professor form -->
    <div id="formProf" style="display:none;">
      <div class="field field-anim" style="animation-delay:0.08s">
        <label class="field-label">Senha</label>
        <div class="pw-wrap">
          <input type="password" id="senhaProf" onkeydown="if(event.key==='Enter') entrarProf(event)">
          <button class="pw-toggle" onclick="togglePw('senhaProf',this)" tabindex="-1">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>
      <div class="error-msg" id="errorProf">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        Senha incorreta. Tente novamente.
      </div>
      <button class="btn-submit" id="btnProf" onclick="entrarProf(event)" style="animation-delay:0.15s">
        <div class="spinner"></div>
        <span class="btn-text">▶ Entrar</span>
      </button>
      <div style="text-align:center;margin-top:8px">
        <button type="button" onclick="abrirModoTeste()" style="background:none;border:none;cursor:pointer;font-size:11px;color:var(--muted-2);padding:3px 8px;font-family:'DM Sans',sans-serif;letter-spacing:0.3px;opacity:0.55">modo teste</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Modo Teste -->
<div id="modal-modo-teste" style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.65);align-items:center;justify-content:center">
  <div style="background:#16213E;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px 24px;width:300px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.6);">
    <div style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:14px;letter-spacing:0.5px">🧪 modo teste</div>
    <div class="pw-wrap">
      <input type="password" id="input-modo-teste" placeholder="Senha" autocomplete="new-password" value=""
        onkeydown="if(event.key==='Enter')confirmarModoTeste()" style="width:100%">
      <button class="pw-toggle" onclick="togglePw('input-modo-teste',this)" tabindex="-1">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      </button>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button onclick="fecharModoTeste()" style="flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px;font-size:13px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif">Cancelar</button>
      <button onclick="confirmarModoTeste()" id="btn-confirmar-teste" style="flex:2;background:var(--orange);border:none;border-radius:10px;padding:9px;font-size:13px;color:#fff;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif">Entrar</button>
    </div>
  </div>
</div>

<div class="ticker"><div class="ticker-inner" id="ticker">
  <div class="ticker-item">⚡ Carregando...</div>
</div></div>

<script type="module">
import { getConfig, getSenhaAluno, getResultados, getLiberadas, contarSessoesTabuadaHoje, somarPartidasTabuadaTotal, getFeedGlobal } from "/js/db.js";
import { getSession, setSession, hashSenha } from "/js/auth.js";
import { ALUNOS_POR_TURMA } from "/js/constants.js";

// Redireciona se já logado
const sess = getSession();
if (sess) window.location.href = sess.modo === "professor" ? "/professor/dashboard.html" : "/aluno/menu.html";

// Símbolos flutuantes — delay negativo = já em andamento ao carregar (sem "presos")
const symbols = ['+','−','×','÷','=','π','∑','√','²','³','%','∠','△','□','∞','≠','≤','≥','θ','α','β','φ','λ','∫','(',')','n','x','y','a','b','f'];
const symColors = ['rgba(255,107,26,1)','rgba(255,200,80,1)','rgba(100,180,255,1)','rgba(180,120,255,1)','rgba(255,255,255,1)'];
const symAnims  = ['floatUp','floatUp','floatDrift'];
const symContainer = document.getElementById('mathSymbols');
for (let i = 0; i < 50; i++) {
  const sym = document.createElement('div');
  sym.className = 'sym';
  const dur   = (Math.random() * 10 + 10).toFixed(1);
  const delay = -(Math.random() * parseFloat(dur)).toFixed(1);
  const anim  = symAnims[Math.floor(Math.random() * symAnims.length)];
  sym.textContent = symbols[Math.floor(Math.random() * symbols.length)];
  sym.style.cssText = `left:${(Math.random()*98).toFixed(1)}%;font-size:${Math.floor(Math.random()*50+12)}px;color:${symColors[Math.floor(Math.random()*symColors.length)]};--op:${(Math.random()*.055+.03).toFixed(3)};--rot:${Math.floor(Math.random()*500-250)}deg;--dx:${(Math.random()*80-40).toFixed(0)}px;animation:${anim} ${dur}s ${delay}s linear infinite;`;
  symContainer.appendChild(sym);
}

// Relógio
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
}
updateClock(); setInterval(updateClock, 1000);

// Popula turmas
const turmaSelect = document.getElementById('turmaSelect');
Object.keys(ALUNOS_POR_TURMA).forEach(t => {
  turmaSelect.innerHTML += `<option value="${t}">${t}</option>`;
});

// Redireciona para aba professor se #professor na URL
if (window.location.hash === '#professor') setRole('professor');

// ── Dados Firebase async ──────────────────────────────────────
let tentativas = 5;
let liberadasCache = [];

(async () => {
  try {
    const hojeISO = new Date().toISOString().slice(0, 10); // "2026-06-11"
    // Formato pt-BR robusto: dd/mm/yyyy com zeros garantidos
    const _d = new Date();
    const hoje = `${String(_d.getDate()).padStart(2,'0')}/${String(_d.getMonth()+1).padStart(2,'0')}/${_d.getFullYear()}`;
    const inicioHoje = new Date(); inicioHoje.setHours(0,0,0,0);
    const tsInicioHoje = inicioHoje.getTime();

    const [resultados, liberadas, tabuadaHoje, tabuadaTotal, feed] = await Promise.all([
      getResultados(),
      getLiberadas(),
      contarSessoesTabuadaHoje(),
      somarPartidasTabuadaTotal(),
      getFeedGlobal(40),
    ]);
    liberadasCache = liberadas;

    const reais = resultados.filter(r => r.concluido && !r.modo_teste && r.aluno !== 'PROFESSOR_TESTE');

    // Atividades total + hoje
    // r.data é dd/mm/yyyy — compara exato com hoje formatado da mesma forma
    const totalAtividades = reais.length;
    const ativHoje = reais.filter(r => r.data && r.data.startsWith(hoje)).length;
    document.getElementById('statAtividades').textContent = totalAtividades;
    const elAvHj = document.getElementById('statAtividadesHoje');
    if (elAvHj) elAvHj.textContent = ativHoje > 0 ? `+${ativHoje} hj` : '';

    // Tabuada total + hoje
    document.getElementById('statSessoesTabuada').textContent = tabuadaTotal || tabuadaHoje;
    const elTabHj = document.getElementById('statTabuadaHoje');
    if (elTabHj && tabuadaTotal) elTabHj.textContent = tabuadaHoje > 0 ? `+${tabuadaHoje} hj` : '';

    // Duelos — só conta status encerrado (duelos realmente disputados)
    try {
      const duelosFullSnap = await fetch(
        'https://sistemamatematica-50eff-default-rtdb.firebaseio.com/duelos.json?shallow=false'
      ).then(r => r.json()).catch(() => null);

      const duelArr = duelosFullSnap && typeof duelosFullSnap === 'object'
        ? Object.values(duelosFullSnap) : [];

      const totalDuelos = duelArr.filter(d => d?.status === 'encerrado').length;
      document.getElementById('statDuelos').textContent = totalDuelos;

      const dHoje = duelArr.filter(d =>
        d?.status === 'encerrado' && d.ts_aceito && d.ts_aceito >= tsInicioHoje
      ).length;
      const elDHj = document.getElementById('statDuelosHoje');
      if (elDHj) elDHj.textContent = dHoje > 0 ? `+${dHoje} hj` : '';
    } catch(_) {
      document.getElementById('statDuelos').textContent = '—';
    }

    // Ticker
    const tickerItems = feed
      .filter(f => f && f.texto)
      .map(f => f.texto);
    if (tickerItems.length > 0) {
      const ticker = document.getElementById('ticker');
      ticker.innerHTML = [...tickerItems, ...tickerItems]
        .map(i => `<div class="ticker-item">${i} &nbsp;·&nbsp;</div>`).join('');
    }
  } catch(e) {
    document.getElementById('statAtividades').textContent = '—';
    document.getElementById('statSessoesTabuada').textContent = '—';
    document.getElementById('statDuelos').textContent = '—';
  }
})();

// ── UI helpers ────────────────────────────────────────────────
window.setRole = function(role) {
  document.getElementById('tabAluno').classList.toggle('active', role === 'aluno');
  document.getElementById('tabProf').classList.toggle('active', role === 'professor');
  document.getElementById('formAluno').style.display = role === 'aluno' ? 'block' : 'none';
  document.getElementById('formProf').style.display  = role === 'professor' ? 'block' : 'none';
  const form = document.getElementById(role === 'aluno' ? 'formAluno' : 'formProf');
  form.querySelectorAll('.field-anim,.btn-submit').forEach(el => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; });
};

window.carregarAlunos = function() {
  const turma  = document.getElementById('turmaSelect').value;
  const alunos = ALUNOS_POR_TURMA[turma] || [];
  const sel1   = document.getElementById('alunoSelect');
  const pin1   = document.getElementById('senhaAluno');
  sel1.innerHTML = '<option value="">Selecionar...</option>';
  alunos.forEach(n => {
    sel1.innerHTML += `<option value="${n}">${n}</option>`;
  });
  sel1.disabled = !turma;
  pin1.disabled = !turma;
  pin1.value = '';
  if (turma) setTimeout(() => sel1.focus(), 50);

  // Alert: só mostra se a turma selecionada tem atividade liberada
  const temAtividade = turma && liberadasCache.some(l => l.turma === turma);
  document.getElementById('activityAlert').style.display = temAtividade ? 'flex' : 'none';
};

window.focusSenha = function() {
  const sel = document.getElementById('alunoSelect');
  const pin = document.getElementById('senhaAluno');
  if (sel.value) { pin.disabled = false; setTimeout(() => pin.focus(), 50); }
};

window.showPin = function(inputId, btnId) {
  const input = document.getElementById(inputId);
  if (input.disabled) return;
  input.type = 'text';
  document.getElementById(btnId).classList.add('showing');
};
window.hidePin = function(inputId, btnId) {
  document.getElementById(inputId).type = 'password';
  document.getElementById(btnId).classList.remove('showing');
};
window.togglePw = function(id, btn) {
  const input = document.getElementById(id);
  const isText = input.type === 'text';
  input.type = isText ? 'password' : 'text';
  btn.style.color = isText ? '' : 'var(--orange)';
};

function showError(id, msg) {
  const el = document.getElementById(id);
  if (msg) { const m = document.getElementById(id + 'Msg'); if (m) m.textContent = msg; }
  el.classList.remove('shake'); el.classList.add('show'); void el.offsetWidth; el.classList.add('shake');
}
function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading; btn.classList.toggle('loading', loading);
}
function addRipple(btn, e) {
  if (!e || !e.clientX) return;
  const rect = btn.getBoundingClientRect();
  const r = document.createElement('div');
  r.className = 'btn-ripple';
  r.style.cssText = `left:${e.clientX - rect.left}px;top:${e.clientY - rect.top}px;`;
  btn.appendChild(r); setTimeout(() => r.remove(), 700);
}

// ── Modo Teste ───────────────────────────────────────────────
window.abrirModoTeste = function() {
  const modal = document.getElementById('modal-modo-teste');
  modal.style.display = 'flex';
  setTimeout(() => document.getElementById('input-modo-teste').focus(), 50);
};
window.fecharModoTeste = function() {
  document.getElementById('modal-modo-teste').style.display = 'none';
  document.getElementById('input-modo-teste').value = '';
};
window.confirmarModoTeste = function() {
  const senha = document.getElementById('input-modo-teste').value;
  if (!senha) return;
  if (senha === 'professorteste2426') {
    setSession({ modo: 'aluno', turma: 'TESTE', alunos: ['PROFESSOR_TESTE'] });
    localStorage.setItem('modoTeste', 'true');
    localStorage.setItem('tema', 'escuro');
    window.location.href = '/aluno/menu.html';
  } else {
    document.getElementById('input-modo-teste').value = '';
  }
};
document.getElementById('modal-modo-teste').addEventListener('click', function(e) {
  if (e.target === this) window.fecharModoTeste();
});

// ── Login aluno ───────────────────────────────────────────────
window.entrarAluno = async function(e) {
  const btn = document.getElementById('btnAluno');
  addRipple(btn, e);

  const turma  = document.getElementById('turmaSelect').value;
  const aluno1 = document.getElementById('alunoSelect').value;
  const pin1   = document.getElementById('senhaAluno').value;

  document.getElementById('errorAluno').classList.remove('show');

  if (!turma || !aluno1) return showError('errorAluno', 'Selecione a turma e o aluno.');
  if (!pin1 || !/^\d{4}$/.test(pin1)) return showError('errorAluno', 'Digite a senha de 4 dígitos.');
  if (tentativas <= 0) return showError('errorAluno', 'Acesso bloqueado após 5 tentativas. Recarregue a página.');

  setLoading('btnAluno', true);
  try {
    const [hash1, rec1] = await Promise.all([hashSenha(turma, aluno1, pin1), getSenhaAluno(turma, aluno1)]);
    if (!rec1) return showError('errorAluno', `Senha não cadastrada para ${aluno1}. Peça ao professor para configurar.`);
    if (rec1.hash !== hash1) {
      tentativas--;
      const suf = tentativas <= 0 ? ' Acesso bloqueado. Recarregue.' : ` (${tentativas} tentativa${tentativas > 1 ? 's' : ''} restante${tentativas > 1 ? 's' : ''})`;
      return showError('errorAluno', `Senha incorreta para ${aluno1}.${suf}`);
    }
    const alunos = [aluno1];
    const sessionToken = Math.random().toString(36).slice(2) + Date.now().toString(36);
    const uidPerfil = (turma + '_' + aluno1).replace(/[.#$[\]/\s]/g, '_');
    try {
      const { ref: fbRef, set, get: fbGet, update: fbUpdate } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
      const { db } = await import('/js/firebase-config.js');
      await set(fbRef(db, `perfis/${uidPerfil}/session_token`), sessionToken);
      // Desfazer a dupla nos DOIS lados: quem tem este aluno como parceiro E a própria presença deste aluno.
      const _presSnap = await fbGet(fbRef(db, 'presenca_online'));
      if (_presSnap.exists()) {
        const _updates = {};
        _presSnap.forEach(child => {
          const v = child.val();
          // Lado A: alguém tem este aluno como parceiro
          if (v.parceiro_nome === aluno1 && v.parceiro_turma === turma) {
            _updates[`${child.key}/parceiro_nome`]  = null;
            _updates[`${child.key}/parceiro_turma`] = null;
            set(fbRef(db, `notif_dupla/${child.key}`), { msg: `${aluno1} realizou login e saiu da dupla.`, ts: Date.now() }).catch(() => {});
          }
        });
        // Lado B: a própria presença deste aluno (caso ele fosse o dono de uma dupla)
        if (_presSnap.child(uidPerfil).exists()) {
          _updates[`${uidPerfil}/parceiro_nome`]  = null;
          _updates[`${uidPerfil}/parceiro_turma`] = null;
        }
        if (Object.keys(_updates).length > 0) {
          await fbUpdate(fbRef(db, 'presenca_online'), _updates);
        }
      }
    } catch(_) {}
    localStorage.removeItem('sm_dupla_duelo');
    setSession({ modo: 'aluno', turma, alunos, session_token: sessionToken });
    // Inicializar perfil de gamificação (só cria se não existir)
    try {
      const { inicializarPerfil } = await import('/js/db.js');
      await inicializarPerfil(uidPerfil, alunos[0], turma);
    } catch(e) { console.warn('[Perfil] Erro ao inicializar:', e); }
    window.location.href = '/aluno/menu.html';
  } catch(err) {
    showError('errorAluno', 'Erro ao verificar senha. Tente novamente.');
  } finally {
    if (tentativas > 0) setLoading('btnAluno', false);
  }
};

// ── Login professor ───────────────────────────────────────────
window.entrarProf = async function(e) {
  const btn = document.getElementById('btnProf');
  addRipple(btn, e);
  const senha = document.getElementById('senhaProf').value;
  document.getElementById('errorProf').classList.remove('show');
  if (!senha) return showError('errorProf', null);
  setLoading('btnProf', true);
  try {
    const cfg = await getConfig();
    if (senha === cfg.senha) {
      setSession({ modo: 'professor' });
      window.location.href = '/professor/dashboard.html';
    } else {
      document.getElementById('senhaProf').value = '';
      showError('errorProf', null);
    }
  } catch(err) {
    if (senha === '123') { setSession({ modo: 'professor' }); window.location.href = '/professor/dashboard.html'; }
    else showError('errorProf', null);
  } finally {
    setLoading('btnProf', false);
  }
};

const _motivo = new URLSearchParams(location.search).get('motivo');
if (_motivo === 'novo_login') {
  showError('errorAluno', '⚠️ Sessão encerrada: este aluno fez login em outro dispositivo ou aba.');
}
if (_motivo === 'inatividade') {
  showError('errorAluno', '⏱️ Sessão encerrada por inatividade. Faça login novamente.');
}
</script>
</body>
