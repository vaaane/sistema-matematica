<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#15102a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Certificado — Imprimir</title>
<!-- 🎓 PROMPT-278 / 278b: certificados por conquista e por bimestre (js/certificados.js). A4 deitado, um por folha.
     Visual do protótipo aprovado (referencia/prototipo-certificado-revisao.html): moldura de duas linhas, faixa com o mapa geral,
     faixa escura com o nome da escola, selo, título em degradê, nome em itálico, pílula com as perguntas, as 26 insígnias
     (só na Revisão) e duas assinaturas. Tabuada, Negativa e Escalada: o mesmo modelo, com a cor e o ícone do jogo.
     ?itens=uid~tipo~bim,uid~tipo~bim…  (o aluno logado sem ?itens vê os dele) · ?modelo=tipo (exemplo) -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  @page{size:A4 landscape;margin:0}
  html,body{background:#0d0f1a;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-family:'DejaVu Serif',Georgia,serif}
  .barra{position:sticky;top:0;z-index:9;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#15102a;border-bottom:1px solid rgba(255,255,255,.1);font-family:Inter,system-ui,sans-serif}
  .barra button{border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer}
  .barra .b-fechar{background:#1a1a2e;color:#fff;border:1px solid rgba(255,255,255,.2)}
  .barra .b-imp{background:linear-gradient(135deg,#c9a84c,#f7e98e);color:#1a0f00}
  .barra .dica{font-size:12px;color:#9ca3af}
  #folhas{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 0 40px}
  .vazio{color:#9ca3af;font-family:Inter,system-ui,sans-serif;padding:60px 20px;text-align:center}

  /* ═══ A folha: 297 × 210 mm (= 1123 × 794 px do protótipo) ═══ */
  .pg{width:297mm;height:210mm;position:relative;overflow:hidden;background:#fffdf7;box-shadow:0 8px 40px rgba(0,0,0,.5);
    page-break-after:always;break-after:page}
  .pg:last-child{page-break-after:auto;break-after:auto}
  .mapa{position:absolute;inset:0;background:url(/img/jogo/mapa-geral/mapa-geral.webp) center/cover;opacity:.07;filter:saturate(.5)}
  .faixa{position:absolute;left:18px;right:18px;top:18px;height:150px;border-radius:14px 14px 0 0;background:url(/img/jogo/mapa-geral/mapa-geral.webp) center 35%/cover}
  .faixa::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,50,.25),rgba(255,253,247,1))}
  .mold{position:absolute;inset:18px;border:5px solid var(--c1);border-radius:14px;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--c2)}
  .ct{position:absolute;left:0;right:0;top:44px;text-align:center}
  .escola{display:inline-block;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#fff;font-weight:700;background:var(--escola,rgba(30,18,70,.78));padding:6px 18px;border-radius:20px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .selo{width:130px;height:130px;margin:8px auto 0;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
  .tit{font-size:50px;font-weight:900;letter-spacing:5px;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:2px}
  .sub{font-size:14px;letter-spacing:3px;text-transform:uppercase;color:#666;margin-top:2px}
  .nome{font-size:44px;font-style:italic;color:#222;margin:20px auto 4px;border-bottom:2px solid var(--c2);display:inline-block;padding:0 40px 4px}
  .turma{font-size:14px;color:#666}
  .txt{font-size:19px;color:#333;line-height:1.5;margin-top:14px}
  .imp{display:inline-block;margin-top:16px;padding:8px 26px;border-radius:40px;background:var(--grad);color:#fff;font-size:18px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.18)}
  .imp b{font-size:26px}
  .ins{position:absolute;left:0;right:0;bottom:92px;margin:auto;width:880px;display:grid;grid-template-columns:repeat(13,58px);justify-content:center;gap:10px 6px;padding:16px 18px;border-radius:10px;background:linear-gradient(180deg,#f3eefe,#e6dcfb);border:3px solid #c9b6f2;box-shadow:0 2px 8px rgba(91,63,196,.12)}
  .ins img{width:58px;height:58px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
  .data{position:absolute;left:0;right:0;bottom:262px;text-align:center;font-size:12px;color:#777;letter-spacing:1px}
  .rod{position:absolute;left:0;right:0;bottom:40px;display:flex;justify-content:space-between;padding:0 150px;font-size:13px;color:#555}
  .ass{border-top:1.5px solid #888;padding-top:5px;width:260px;text-align:center}

  /* Mestre: roxo e prateado · Lenda: dourado, fundo creme */
  .t-revisao_mestre{--c1:#5b3fc4;--c2:#b9bccb;--grad:linear-gradient(135deg,#4c32b0,#7c5cfc 55%,#8f95ad)}
  .t-revisao_lenda{--c1:#b8860b;--c2:#f0cf63;--grad:linear-gradient(135deg,#8a5a00,#d4a017 45%,#f7e27a 60%,#b8860b);--escola:rgba(90,60,0,.8);background:#fff8e1}
  .t-revisao_lenda .mold{border-width:7px}
  .t-revisao_lenda .ins{background:linear-gradient(180deg,#fff9e6,#fbefc8);border-color:#ecd38a}
  .t-revisao_lenda .ins img{filter:drop-shadow(0 0 7px #ffd34d) saturate(1.3) brightness(1.1)}
  .t-revisao_lenda .selo{filter:drop-shadow(0 0 14px #ffd34d) saturate(1.3) brightness(1.1)}

  /* Tabuada, Negativa e Escalada: o mesmo modelo, com a cor do jogo; no lugar das insígnias, um painel com os números */
  .t-tabuada {--c1:#1d7fb8;--c2:#9fd3f0;--grad:linear-gradient(135deg,#0e4f7a,#1d7fb8 55%,#38bdf8);--escola:rgba(10,45,75,.8);--painel:linear-gradient(180deg,#eef8fe,#dcf0fb);--painel-b:#a9d8f2}
  .t-negativa{--c1:#5b4fd0;--c2:#c4bdf5;--grad:linear-gradient(135deg,#2e2690,#6358d2 55%,#a99ff0);--escola:rgba(30,27,75,.8);--painel:linear-gradient(180deg,#f3f1fe,#e4e0fb);--painel-b:#c9c2f2}
  .t-escalada{--c1:#0f8a64;--c2:#a7e8cf;--grad:linear-gradient(135deg,#0b5e45,#10916b 55%,#34d399);--escola:rgba(8,55,40,.8);--painel:linear-gradient(180deg,#effbf6,#dcf5ea);--painel-b:#a6e3c9}
  .selo-ic{width:130px;height:130px;margin:8px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:66px;
    background:radial-gradient(circle at 35% 30%,#fff,var(--c2) 60%,var(--c1));border:6px solid #fff;box-shadow:0 0 0 4px var(--c1),0 6px 14px rgba(0,0,0,.3)}
  .painel{position:absolute;left:0;right:0;bottom:110px;margin:auto;width:700px;display:grid;grid-template-columns:repeat(3,1fr);padding:16px 10px;border-radius:10px;
    background:var(--painel);border:3px solid var(--painel-b);box-shadow:0 2px 8px rgba(0,0,0,.08);text-align:center}
  .painel div+div{border-left:1.5px solid var(--painel-b)}
  .painel b{display:block;font-size:30px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .painel small{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#666}

  @media screen{ .pg{zoom:var(--zoom,1)} }
  @media print{
    html,body{background:#fff!important}
    .barra{display:none!important}
    #folhas{display:block;padding:0}
    .pg{box-shadow:none;margin:0}
  }
</style>
</head>
<body>
<div class="barra">
  <button class="b-fechar" onclick="history.length > 1 ? history.back() : window.close()">← Voltar</button>
  <button class="b-imp" onclick="window.print()">🖨️ Imprimir</button>
  <span class="dica" id="dica">💡 Paisagem · sem margens · ative "Gráficos de fundo"</span>
</div>
<div id="folhas"><div class="vazio">Carregando…</div></div>

<script type="module">
import { getSession } from '/js/auth.js';
import { ALUNOS_POR_TURMA } from '/js/constants.js';
import { getNomeCompleto } from '/js/nomes_completos.js';
import { TIPOS_CERT, certificadosDoAluno, makeUidCert, fmtMil } from '/js/certificados.js';

const P = new URLSearchParams(location.search);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dataCurta = (ts) => ts ? new Date(ts).toLocaleDateString('pt-BR') : '';
const anoDe = (ts) => new Date(ts || Date.now()).getFullYear();
const alunoDoUid = (uid) => {
  for (const [turma, nomes] of Object.entries(ALUNOS_POR_TURMA)) for (const nome of nomes) if (makeUidCert(turma, nome) === uid) return { turma, nome };
  return null;
};
const INSIGNIAS = Array.from({ length: 13 }, (_, i) => ['A', 'B'].map(l => `/img/jogo/insignias/insignia-mapa${i + 1}-${l}.webp`)).flat();
const JOGO = { tabuada: 'Tabuada', negativa: 'Tabuada Negativa', escalada: 'Escalada Algébrica' };
const TITULO = { tabuada: 'Tabuada 300', negativa: 'Negativa 150', escalada: 'Escalada completa', revisao_mestre: 'Mestre da Revisão', revisao_lenda: 'Lenda da Revisão' };
const TEXTO = {
  tabuada:  (c) => `chegou ao <b>nível 300 da Tabuada</b> no ${c.bim}º bimestre,<br>com muito cálculo mental e persistência.`,
  negativa: (c) => `chegou ao <b>nível 150 da Tabuada Negativa</b> no ${c.bim}º bimestre,<br>dominando as operações com <b>números negativos</b>.`,
  escalada: (c) => `completou os <b>200 níveis da Escalada Algébrica</b> no ${c.bim}º bimestre,<br>simplificando expressões até o topo.`,
  revisao_mestre: () => `venceu os <b>26 ginásios</b> dos 13 mapas da Liga Matemática<br>e conquistou <b>todas as 26 insígnias</b>.`,
  revisao_lenda:  () => `venceu os <b>26 ginásios</b> dos 13 mapas da Liga Matemática<br>e conquistou <b>as 26 insígnias douradas</b> ✨`,
};
const PILULA = { tabuada: 'questões respondidas', negativa: 'questões respondidas', escalada: 'expressões simplificadas', revisao_mestre: 'perguntas respondidas', revisao_lenda: 'perguntas respondidas' };
const NIVEL = { tabuada: ['300', 'Nível'], negativa: ['150', 'Nível'], escalada: ['200', 'Níveis'] };

function folha(c) {
  const rev = c.tipo.startsWith('revisao');
  const escola = `CED São Bartolomeu · Liga Matemática · ${rev ? 'Jogo de Revisão' : JOGO[c.tipo]}`;
  const selo = rev ? `<img class="selo" src="/img/jogo/insignias/insignia-mapa13-B.webp" alt=""/>` : `<div class="selo-ic">${TIPOS_CERT[c.tipo].icon}</div>`;
  const baixo = rev
    ? `${c.ts ? `<div class="data">Conquistado em ${dataCurta(c.ts)}</div>` : ''}<div class="ins">${INSIGNIAS.map(s => `<img src="${s}" alt=""/>`).join('')}</div>`
    : `<div class="painel"><div><b>${NIVEL[c.tipo][0]}</b><small>${NIVEL[c.tipo][1]}</small></div><div><b>${c.bim}º</b><small>Bimestre</small></div>
         <div><b>${c.ts ? dataCurta(c.ts) : '—'}</b><small>Conquistado em</small></div></div>`;
  return `<section class="pg t-${c.tipo}">
    <div class="mapa"></div><div class="faixa"></div><div class="mold"></div>
    <div class="ct">
      <div class="escola">${escola}</div>
      ${selo}
      <div class="tit">${TITULO[c.tipo]}</div>
      <div class="sub">${c.bim}º bimestre · ${anoDe(c.ts)}</div>
      <div class="nome">${esc(c.nomeCompleto)}</div>
      <div class="turma">Turma ${esc(c.turma)}</div>
      <div class="txt">${TEXTO[c.tipo](c)}</div>
      <div class="imp"><b>${fmtMil(c.qtd)}</b> ${PILULA[c.tipo]}</div>
    </div>
    ${baixo}
    <div class="rod"><div class="ass">Prof.ª Vanessa</div><div class="ass">Direção · CED São Bartolomeu</div></div>
  </section>`;
}

async function montar() {
  const el = document.getElementById('folhas');
  const modelo = P.get('modelo');
  if (modelo && TIPOS_CERT[modelo]) {
    const bim = TIPOS_CERT[modelo].bims.at(-1);
    el.innerHTML = folha({ tipo: modelo, bim, turma: '8G', nomeCompleto: 'Nome do Aluno', qtd: 1248, ts: Date.now() });
    return;
  }
  // pedidos: ?itens=uid~tipo~bim,… ou, sem nada, os do aluno logado
  let pedidos = String(P.get('itens') || '').split(',').map(s => s.split('~')).filter(p => p.length === 3).map(([uid, tipo, bim]) => ({ uid, tipo, bim: +bim }));
  if (!pedidos.length) {
    const s = getSession();
    if (!s?.turma || !s.alunos?.[0]) { location.href = '/index.html'; return; }
    const uid = makeUidCert(s.turma, s.alunos[0]);
    pedidos = (await certificadosDoAluno(s.turma, s.alunos[0])).map(c => ({ uid, tipo: c.tipo, bim: c.bim }));
  }
  const porUid = new Map();
  for (const p of pedidos) { if (!porUid.has(p.uid)) porUid.set(p.uid, []); porUid.get(p.uid).push(p); }
  const prontos = await Promise.all([...porUid.entries()].map(async ([uid, ps]) => {
    const a = alunoDoUid(uid);
    if (!a) return [];
    const certs = await certificadosDoAluno(a.turma, a.nome).catch(() => []);
    return ps.map(p => certs.find(c => c.tipo === p.tipo && c.bim === p.bim)).filter(Boolean)
      .map(c => ({ ...c, nomeCompleto: getNomeCompleto(a.turma, a.nome) }));
  }));
  // a ordem do pedido (o dashboard já manda por turma e nome)
  const lista = [];
  for (const p of pedidos) { const c = prontos.flat().find(x => x.uid === p.uid && x.tipo === p.tipo && x.bim === p.bim); if (c && !lista.includes(c)) lista.push(c); }
  if (!lista.length) { el.innerHTML = '<div class="vazio">Nenhum certificado encontrado.</div>'; return; }
  el.innerHTML = lista.map(folha).join('');
  document.title = lista.length === 1 ? `Certificado — ${lista[0].nome} (${TIPOS_CERT[lista[0].tipo].nome})` : `Certificados — ${lista.length} folhas`;
  document.getElementById('dica').textContent = `💡 ${lista.length} folha${lista.length > 1 ? 's' : ''} · Paisagem · sem margens · ative "Gráficos de fundo"`;
}

// cabe na tela (só na tela; na impressão, tamanho real)
function ajustarZoom() {
  const px = 297 * 96 / 25.4, z = Math.min(1, (window.innerWidth - 24) / px);
  document.documentElement.style.setProperty('--zoom', z.toFixed(3));
}
window.addEventListener('resize', ajustarZoom);
ajustarZoom();
montar().catch(e => { console.error(e); document.getElementById('folhas').innerHTML = '<div class="vazio">Não foi possível carregar.</div>'; });
</script>
</body>
</html>
