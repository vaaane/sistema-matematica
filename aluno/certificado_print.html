<title>Certificado — Imprimir</title>
<!-- 🎓 PROMPT-278 / 281: certificados por conquista e por bimestre (js/certificados.js). A4 deitado, um por folha.
     Os modelos finais seguem os protótipos aprovados (referencia/, fora do repositório):
       prototipo-certificado-revisao.html          → Mestre (roxo/prateado) e Lenda (dourado, fundo creme) da Revisão
       prototipo-certificado-tabuada-negativa.html → Tabuada (azul e dourado) e Negativa (roxo e verde-água)
       prototipo-certificado-escalada.html         → Escalada (verde e laranja, com montanhas)
     PROMPT-281b: a Revisão sem a logo pequena e sem marca d'água; Tabuada, Negativa e Escalada com o selo do jogo (SVG)
     e o escudo do site como marca d'água, reto e clarinho.
     ?itens=uid~tipo~bim,uid~tipo~bim…  (o aluno logado sem ?itens vê os dele) · ?modelo=tipo (exemplo) -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  @page{size:A4 landscape;margin:0}
  html,body{background:#0d0f1a;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-family:'DejaVu Serif',Georgia,serif}
  .barra{position:sticky;top:0;z-index:9;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#15102a;border-bottom:1px solid rgba(255,255,255,.1);font-family:Inter,system-ui,sans-serif}
  .barra button{border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer}
  .barra .b-fechar{background:#1a1a2e;color:#fff;border:1px solid rgba(255,255,255,.2)}
  .barra .b-imp{background:linear-gradient(135deg,#c9a84c,#f7e98e);color:#1a0f00}
  .barra .dica{font-size:12px;color:#9ca3af}
  #folhas{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 0 40px}
  .vazio{color:#9ca3af;font-family:Inter,system-ui,sans-serif;padding:60px 20px;text-align:center}

  /* ═══ A folha: 297 × 210 mm (= os 1123 × 794 px dos protótipos) ═══ */
  .pg{width:297mm;height:210mm;position:relative;overflow:hidden;background:var(--bg,#fffdf7);box-shadow:0 8px 40px rgba(0,0,0,.5);
    page-break-after:always;break-after:page;page-break-inside:avoid;break-inside:avoid}
  .pg:last-child{page-break-after:auto;break-after:auto}
  .mold{position:absolute;inset:18px;border:5px solid var(--c1);border-radius:14px;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--c2)}
  .ct{position:absolute;left:0;right:0;text-align:center}
  .tit{font-weight:900;letter-spacing:5px;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:14px;letter-spacing:3px;text-transform:uppercase;color:#666}
  .nome{font-size:44px;font-style:italic;color:#222;border-bottom:2px solid var(--c2);display:inline-block;padding:0 40px 4px}
  .turma{font-size:14px;color:#666}
  .txt{font-size:19px;color:#333}
  .imp{display:inline-block;padding:8px 26px;border-radius:40px;background:var(--grad);color:#fff;font-size:18px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.18)}
  .imp b{font-size:26px}
  .data{font-size:12px;color:#777;letter-spacing:1px}
  /* "quizdematematica.com" interrompendo a linha de baixo da moldura */
  .site{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;z-index:4}
  .site span{background:var(--bg,#fff);padding:2px 14px;font-family:"DejaVu Sans",sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--c1)}
  .rod{position:absolute;left:0;right:0;display:flex;justify-content:space-between;padding:0 150px;font-size:13px;color:#555;z-index:3}
  .ass{border-top:1.5px solid #888;text-align:center}

  /* ─── Revisão: Mestre e Lenda (prototipo-certificado-revisao.html) ─── */
  .rv .mapa{position:absolute;inset:0;background:url(/img/jogo/mapa-geral/mapa-geral.webp) center/cover;opacity:.07;filter:saturate(.5)}
  .rv .faixa{position:absolute;left:18px;right:18px;top:18px;height:150px;border-radius:14px 14px 0 0;background:url(/img/jogo/mapa-geral/mapa-geral.webp) center 35%/cover}
  .rv .faixa::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,50,.25),rgba(255,253,247,1))}
  .rv .ct{top:44px}
  .rv .topo-esc{display:inline-flex;align-items:center;gap:8px;height:28px}
  .rv .escola{display:inline-block;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#fff;font-weight:700;background:rgba(30,18,70,.78);padding:6px 18px;border-radius:20px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .rv .selo{width:118px;height:118px;margin:8px auto 0;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
  .rv .tit{font-size:50px;margin-top:2px}
  .rv .sub{margin-top:2px}
  .rv .nome{margin:20px auto 4px}
  .rv .txt{line-height:1.5;margin-top:14px}
  .rv .imp{margin-top:16px}
  .rv .data{position:absolute;left:0;right:0;bottom:262px;text-align:center}
  .rv .ins{position:absolute;left:0;right:0;bottom:92px;margin:auto;width:880px;display:grid;grid-template-columns:repeat(13,58px);justify-content:center;gap:10px 6px;padding:16px 18px;border-radius:10px;background:linear-gradient(180deg,#f3eefe,#e6dcfb);border:3px solid #c9b6f2;box-shadow:0 2px 8px rgba(91,63,196,.12)}
  .rv .ins img{width:58px;height:58px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
  .rv .rod{bottom:40px}
  .rv .ass{padding-top:5px;width:260px}
  .t-revisao_mestre{--c1:#5b3fc4;--c2:#b9bccb;--grad:linear-gradient(135deg,#4c32b0,#7c5cfc 55%,#8f95ad)}
  .t-revisao_mestre .site span{background:#fff}
  .t-revisao_lenda{--c1:#b8860b;--c2:#f0cf63;--grad:linear-gradient(135deg,#8a5a00,#d4a017 45%,#f7e27a 60%,#b8860b);--bg:#fff8e1}
  .t-revisao_lenda .escola{background:rgba(90,60,0,.8)}
  .t-revisao_lenda .mold{border-width:7px}
  .t-revisao_lenda .ins{background:linear-gradient(180deg,#fff9e6,#fbefc8);border-color:#ecd38a}
  .t-revisao_lenda .ins img{filter:drop-shadow(0 0 7px #ffd34d) saturate(1.3) brightness(1.1)}
  .t-revisao_lenda .selo{filter:drop-shadow(0 0 14px #ffd34d) saturate(1.3) brightness(1.1)}

  /* ─── Tabuada, Negativa e Escalada (prototipo-certificado-tabuada-negativa.html e -escalada.html) ─── */
  .jg .contas{position:absolute;inset:0}
  .jg .contas span{position:absolute;white-space:nowrap;font-family:'DejaVu Sans Mono',monospace;font-weight:700;color:var(--c1);opacity:.04}
  .jg .montes{position:absolute;left:0;right:0;bottom:0;width:100%;height:300px;z-index:0}
  .jg .ct{top:40px;z-index:3}
  .jg .escola{display:inline-block;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#fff;font-weight:700;background:var(--c1);padding:6px 18px;border-radius:20px}
  .jg .selo-ic{width:104px;height:104px;margin:14px auto 10px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px #fff,0 0 0 8px var(--c2),0 6px 14px rgba(0,0,0,.25)}
  .jg .selo-ic svg{width:76px;height:76px}
  /* marca d'água: o escudo do site, reto; na Escalada menor e mais alto, sem cobrir as montanhas */
  /* (o logo_fundotransparente.png tem margem transparente: o escudo ocupa 379 dos 540 px de altura, com o centro a 48,24%;
     a altura da imagem é aumentada na mesma proporção para o ESCUDO ficar com os 560 px / 380 px do protótipo) */
  .jg .marca-logo{position:absolute;z-index:1;left:50%;top:50%;height:calc(560px * 540 / 379);transform:translate(-50%,-48.24%);opacity:.055}
  .t-escalada .marca-logo{top:40%;height:calc(380px * 540 / 379);opacity:.06}
  .jg .tit{font-size:48px}
  .jg .sub{margin-top:6px}
  .jg .nome{margin:22px auto 6px}
  .jg .txt{line-height:1.7;margin-top:16px}
  .jg .imp{margin-top:18px}
  .jg .data{margin-top:10px}
  .jg .trilha{position:absolute;left:0;right:0;bottom:132px;display:flex;justify-content:center;align-items:center;gap:0;z-index:3}
  .jg .marco{width:52px;height:52px;border-radius:50%;background:var(--grad);color:#fff;font-weight:900;font-family:'DejaVu Sans',sans-serif;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c2)}
  .jg .linha{width:44px;height:5px;background:var(--c2)}
  .jg .marco.fim{width:64px;height:64px;font-size:19px}
  .jg .rod{bottom:46px}
  .jg .ass{padding-top:6px;width:300px}
  .t-tabuada {--c1:#1d4ed8;--c2:#f2c94c;--bg:#fbfcff;--grad:linear-gradient(135deg,#1e3a8a,#2563eb 50%,#d4a017)}
  .t-negativa{--c1:#7c3aed;--c2:#22c1c3;--bg:#fcfbff;--grad:linear-gradient(135deg,#5b21b6,#7c3aed 50%,#14b8a6)}
  .t-escalada{--c1:#047857;--c2:#f59e0b;--bg:#fbfffd;--grad:linear-gradient(135deg,#065f46,#10b981 50%,#f59e0b)}
  .t-escalada .marco.fim{font-size:26px}

  @media screen{ .pg{zoom:var(--zoom,1)} }
  @media print{
    html,body{background:#fff!important;margin:0}
    .barra{display:none!important}
    #folhas{display:block;padding:0}
    .pg{box-shadow:none;margin:0;zoom:1}
  }
</style>
</head>

}

async function montar() {
  const el = document.getElementById('folhas');
  const modelo = P.get('modelo');
  if (modelo) {
    const tipos = modelo === 'todos' ? Object.keys(TIPOS_CERT) : [modelo].filter(t => TIPOS_CERT[t]);
    if (tipos.length) {
      el.innerHTML = tipos.map(t => folha({ tipo: t, bim: TIPOS_CERT[t].bims.at(-1), turma: '8G', nomeCompleto: 'Nome do Aluno', qtd: 1248, ts: Date.now() })).join('');
      return;
    }
  }
  // pedidos: ?itens=uid~tipo~bim,… ou, sem nada, os do aluno logado
  let pedidos = String(P.get('itens') || '').split(',').map(s => s.split('~')).filter(p => p.length === 3).map(([uid, tipo, bim]) => ({ uid, tipo, bim: +bim }));
  if (!pedidos.length) {
    const s = getSession();
    if (!s?.turma || !s.alunos?.[0]) { location.href = '/index.html'; return; }
    const uid = makeUidCert(s.turma, s.alunos[0]);
    pedidos = (await certificadosDoAluno(s.turma, s.alunos[0])).map(c => ({ uid, tipo: c.tipo, bim: c.bim }));
  }
  const porUid = new Map();
  for (const p of pedidos) { if (!porUid.has(p.uid)) porUid.set(p.uid, []); porUid.get(p.uid).push(p); }
  const prontos = await Promise.all([...porUid.entries()].map(async ([uid, ps]) => {
    const a = alunoDoUid(uid);
    if (!a || ehContaTeste(a.turma, a.nome)) return [];   // contas de teste, PROFESSOR e TESTE: nunca
    const certs = await certificadosDoAluno(a.turma, a.nome).catch(() => []);
    return ps.map(p => certs.find(c => c.tipo === p.tipo && c.bim === p.bim)).filter(Boolean)
      .map(c => ({ ...c, nomeCompleto: getNomeCompleto(a.turma, a.nome) }));
  }));
  // a ordem do pedido (o dashboard já manda por turma e nome)
  const lista = [];
  for (const p of pedidos) { const c = prontos.flat().find(x => x.uid === p.uid && x.tipo === p.tipo && x.bim === p.bim); if (c && !lista.includes(c)) lista.push(c); }
  if (!lista.length) { el.innerHTML = '<div class="vazio">Nenhum certificado encontrado.</div>'; return; }
  el.innerHTML = lista.map(folha).join('');
  document.title = lista.length === 1 ? `Certificado — ${lista[0].nome} (${TIPOS_CERT[lista[0].tipo].nome})` : `Certificados — ${lista.length} folhas`;
  document.getElementById('dica').textContent = `💡 ${lista.length} folha${lista.length > 1 ? 's' : ''} · Paisagem · sem margens · ative "Gráficos de fundo"`;
}

// cabe na tela (só na tela; na impressão, tamanho real)
function ajustarZoom() {
  const px = 297 * 96 / 25.4, z = Math.min(1, (window.innerWidth - 24) / px);
  document.documentElement.style.setProperty('--zoom', z.toFixed(3));
}
window.addEventListener('resize', ajustarZoom);
