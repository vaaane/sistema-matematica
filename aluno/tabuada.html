<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎮 Tabuada — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    /* ── Timer ── */
    .timer-wrap{display:flex;align-items:center;justify-content:center;gap:8px;font-size:32px;font-weight:800;margin-bottom:10px;color:var(--text);transition:color .3s;}
    .timer-wrap svg{width:30px;height:30px;fill:currentColor;}
    .timer-wrap.warn{color:var(--red);}
    .timer-bar-bg{height:7px;background:var(--border);border-radius:4px;margin-bottom:18px;overflow:hidden;}
    .timer-bar{height:100%;border-radius:4px;background:var(--blue);transition:width 1s linear,background .4s;}
    .timer-bar.warn{background:var(--orange);}
    .timer-bar.danger{background:var(--red);}

    /* ── Level badge ── */
    .nivel-badge{display:inline-flex;align-items:center;gap:6px;background:var(--blue-pale);border:1.5px solid rgba(127,119,221,0.3);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:700;color:var(--blue-dark);}
    .nivel-badge svg{width:13px;height:13px;fill:currentColor;}

    /* ── Game grid ── */
    .game-grid{display:grid;gap:7px;margin-bottom:18px;}

    /* ── Game card ── */
    .game-card{
      position:relative;
      background:var(--card);border:1.5px solid var(--border);border-radius:11px;
      padding:10px 6px;cursor:pointer;
      transition:border-color .14s,background .14s,transform .1s,box-shadow .14s;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:72px;user-select:none;-webkit-tap-highlight-color:transparent;
    }
    .game-card:hover{border-color:var(--blue);background:var(--blue-pale);transform:translateY(-1px);box-shadow:0 3px 12px rgba(47,158,220,.18);}
    .game-card.selected{border:2.5px solid var(--blue);background:var(--blue-pale);box-shadow:0 0 0 3px rgba(47,158,220,.18);}
    .game-card.error{border-color:var(--red)!important;background:var(--red-pale)!important;animation:shake .4s;}
    .game-card.matched-flash{border-color:var(--green)!important;background:var(--green-pale)!important;pointer-events:none;}
    .game-card.removed{pointer-events:none;animation:cardOut .4s forwards;}

    /* ── Operação: operador + fração como unidade centralizada no card ── */
    .op-wrap{ display:flex;align-items:center;gap:4px; }
    .operador{ font-size:14px;font-weight:900;color:var(--text);line-height:1;flex-shrink:0; }
    .fracao{ display:flex;flex-direction:column;align-items:center; }
    .num-cima,.num-baixo{ font-size:22px;font-weight:800;line-height:1.1;color:var(--text);min-width:20px;text-align:center; }
    .traco{ width:100%;height:2.5px;background:var(--text);border-radius:1px;margin:2px 0; }
    /* Expressão composta (nível 16+) */
    .op-compound{font-size:13px;font-weight:800;color:var(--text);text-align:center;line-height:1.4;letter-spacing:-.3px;padding:0 4px;}
    /* Número resultado */
    .res-number{font-size:28px;font-weight:800;color:var(--text);line-height:1;}

    /* ── Slots ── */
    .slots-wrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
    .slot{width:128px;height:60px;border:2px dashed var(--border);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text-muted);background:var(--bg);transition:all .2s;text-align:center;padding:4px;}
    .slot.filled{border-style:solid;border-color:var(--blue);background:var(--blue-pale);color:var(--text);cursor:pointer;}
    .slot.filled:hover{border-color:var(--orange);}
    .slot-eq{font-size:24px;font-weight:800;color:var(--text-muted);}

    /* ── Controls ── */
    .game-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

    /* ── Status msg ── */
    .status-msg{text-align:center;font-size:13px;color:var(--text-muted);margin-bottom:12px;min-height:18px;transition:all .2s;}

    /* ── Animations ── */
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
    @keyframes cardOut{0%{opacity:1;transform:scale(1)}30%{opacity:.7;transform:scale(1.05)}100%{opacity:0;transform:scale(0);visibility:hidden}}
    @keyframes levelUpPop{0%{opacity:0;transform:scale(.45) rotate(-8deg)}70%{transform:scale(1.12) rotate(1.5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
    @keyframes levelDownPop{0%{opacity:0;transform:scale(.88) translateY(8px)}65%{transform:scale(1.02) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideUp{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes combo-float{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}60%{opacity:1;transform:translateX(-50%) translateY(-30px) scale(1.15)}100%{opacity:0;transform:translateX(-50%) translateY(-52px) scale(.9)}}
    .combo-pop{position:fixed;pointer-events:none;z-index:150;font-weight:800;font-size:15px;font-family:'Inter',sans-serif;animation:combo-float .85s ease forwards;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.35);}
    .combo-pop.combo-big{font-size:21px;animation-duration:1.05s;}
    .combo-pop.combo-huge{font-size:28px;animation-duration:1.3s;}
    @keyframes combo-badge-pop{0%{transform:scale(1.3);opacity:.6}100%{transform:scale(1);opacity:1}}
    .combo-badge-inner{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:800;padding:3px 12px;border-radius:20px;animation:combo-badge-pop .2s;}
    .combo-c2{background:rgba(34,197,94,.1);color:#22C55E;border:1px solid rgba(34,197,94,.25);}
    .combo-c3{background:rgba(249,115,22,.1);color:#f97316;border:1px solid rgba(249,115,22,.25);}
    .combo-c4{background:rgba(250,184,0,.1);color:#FAB800;border:1px solid rgba(250,184,0,.28);}
    .combo-c5{background:rgba(250,184,0,.18);color:#FAB800;border:1px solid rgba(250,184,0,.45);font-size:15px;}

    /* ── Level overlay ── */
    .level-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
    .level-card{background:var(--card);border-radius:22px;padding:40px 44px;text-align:center;animation:levelUpPop .45s;box-shadow:0 24px 64px rgba(0,0,0,.35);max-width:320px;width:92vw;}
    .level-emoji{font-size:68px;line-height:1;margin-bottom:14px;}
    .level-title{font-size:24px;font-weight:800;margin-bottom:6px;}
    .level-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.5;}
    .level-new{font-size:19px;font-weight:700;color:var(--blue);margin-bottom:24px;}

    /* ── Back link (inside content) ── */
    .link-back{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--text-muted);text-decoration:none;transition:color .14s;padding:2px 0;}
    .link-back:hover{color:var(--text);}
    .link-back svg{width:13px;height:13px;fill:currentColor;flex-shrink:0;}

    /* ── Progress bar (pairs left) ── */
    .pairs-bar-bg{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;justify-content:center;}
    .pair-dot{width:12px;height:12px;border-radius:50%;background:var(--border);transition:background .3s;}
    .pair-dot.done{background:var(--green);}

    /* ── Confete ── */
    @keyframes confete-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(115vh) rotate(740deg);opacity:0}}
    .confete-wrap{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden;}
    .confete-particle{position:absolute;top:-12px;border-radius:3px;animation:confete-fall linear forwards;}

    /* ── Mini ranking ── */
    .mini-rank-wrap{margin-bottom:14px;}
    .mini-rank-leader{display:flex;align-items:center;gap:8px;background:rgba(234,179,8,.07);border:1px solid rgba(234,179,8,.25);border-radius:11px;padding:10px 14px;margin-bottom:6px;}
    .mini-rank-leader-icon{font-size:22px;line-height:1;flex-shrink:0;}
    .mini-rank-leader-text{flex:1;min-width:0;}
    .mini-rank-leader-title{font-size:13px;font-weight:700;color:#eab308;line-height:1.2;}
    .mini-rank-leader-sub{font-size:11px;color:rgba(234,179,8,.65);margin-top:2px;}
    .mini-rank-bar{display:flex;gap:6px;flex-wrap:wrap;}
    .mini-rank-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;}
    .mini-rank-pill.geral{background:rgba(234,179,8,.08);border:0.5px solid rgba(234,179,8,.2);color:#eab308;}
    .mini-rank-pill.turma{background:rgba(127,119,221,.08);border:0.5px solid rgba(127,119,221,.2);color:#c4b5fd;}

    /* ── Sprint ── */
    .sprint-bar{display:flex;align-items:center;gap:14px;background:rgba(127,119,221,.06);border:0.5px solid rgba(127,119,221,.2);border-radius:11px;padding:12px 16px;margin-bottom:14px;}
    .sprint-timer{font-size:30px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;min-width:62px;line-height:1;}
    .sprint-timer.warn{color:var(--orange);}
    .sprint-timer.danger{color:var(--red);}
    .sprint-label{font-size:9px;color:var(--text-muted);text-align:center;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}
    .sprint-stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
    .sprint-stat{text-align:center;padding:6px 4px;background:rgba(255,255,255,.03);border-radius:8px;}
    .sprint-stat-val{font-size:18px;font-weight:800;color:var(--text);line-height:1;}
    .sprint-stat-lbl{font-size:9px;color:var(--text-muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em;}

    /* ── Modal dupla ── */
    .dupla-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
    .dupla-modal{background:var(--card);border-radius:22px;padding:32px 28px;max-width:360px;width:92vw;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.35);}
    .dupla-title{font-size:20px;font-weight:800;margin-bottom:4px;}
    .dupla-sub{font-size:13px;color:var(--text-muted);margin-bottom:22px;}
    .dupla-btn{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:13px;background:var(--bg);cursor:pointer;margin-bottom:10px;text-align:left;display:flex;align-items:center;gap:12px;transition:border-color .15s,background .15s;font-family:inherit;}
    .dupla-btn:last-child{margin-bottom:0;}
    .dupla-btn:hover{border-color:#7F77DD;background:rgba(127,119,221,.07);}
    .dupla-btn-avatar{width:40px;height:40px;border-radius:50%;background:#7F77DD;color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .dupla-btn-name{font-size:15px;font-weight:700;color:var(--text);line-height:1.2;}
    .dupla-btn-nivel{font-size:12px;color:var(--text-muted);margin-top:2px;}
    .dupla-footer{font-size:11px;color:var(--text-muted);margin-top:18px;line-height:1.5;}

    /* ── Responsive ── */
    @media(max-width:480px){
      .game-card{min-height:60px;padding:8px 4px;}
      .num-cima,.num-baixo{font-size:18px;}
      .res-number{font-size:22px;}
      .op-compound{font-size:11px;}
      .operador{font-size:11px;}
      .timer-wrap{font-size:26px;}
      .slot{width:110px;height:54px;}
    }
    @media(max-width:360px){
      .num-cima,.num-baixo{font-size:15px;}
      .res-number{font-size:18px;}
      .operador{font-size:10px;}
    }
  </style>
</head>

<script type="module">
import { requireAluno, renderSidebarAluno, clearSession } from "/js/auth.js";
import { db } from "/js/firebase-config.js";
import { ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ── Auth ──────────────────────────────────────────────────────
const sess = requireAluno("/index.html");
if (!sess) throw new Error("não autenticado");
renderSidebarAluno("sidebar", "jogos");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const { alunos, turma } = sess;
let nomeAluno = alunos[0];
const isDupla  = alunos.length === 2;
let parceiroDupla = isDupla ? alunos[1] : null;

function _makeUid(nome) { return (turma + '_' + nome).replace(/[.#$\[\]/\s]/g, '_'); }
let uid = _makeUid(nomeAluno);

document.getElementById("avatar-initials").textContent = nomeAluno[0].toUpperCase();

// ── Firebase ──────────────────────────────────────────────────
let niveisRef     = ref(db, `tabuada_niveis/${uid}`);
let rankingRef    = ref(db, `tabuada_ranking/${uid}`);
let sprintRankRef = ref(db, `tabuada_sprint_ranking/${uid}`);

async function carregarProgresso() {
  try {
    const snap = await get(niveisRef);
    if (snap.exists()) return snap.val();
  } catch(e) {}
  return { nivel_atual: 1, melhor_nivel: 1, ultima_partida: 0, total_partidas: 0 };
}

async function salvarProgresso(p, resultado, nivelJogado, acertosJogo, errosJogo, isReplay = false) {
  try {
    const ts = Date.now();
    if (isReplay) {
      // Não altera nivel_atual nem melhor_nivel — só contabiliza partida e histórico
      await update(niveisRef, { ultima_partida: ts, total_partidas: p.total_partidas });
    } else {
      await update(niveisRef, {
        nivel_atual:    p.nivel_atual,
        melhor_nivel:   p.melhor_nivel,
        ultima_partida: ts,
        total_partidas: p.total_partidas
      });
      await set(rankingRef, {
        nome:           nomeAluno,
        turma:          turma,
        nivel_atual:    p.nivel_atual,
        melhor_nivel:   p.melhor_nivel,
        ultima_partida: ts
      });
    }
    if (resultado) {
      const entry = {
        nivel:     nivelJogado,
        resultado: resultado,
        acertos:   acertosJogo || 0,
        erros:     errosJogo   || 0,
      };
      const t = { ...tipoAcertos };
      if (t.add || t.sub || t.mul || t.div) entry.tipos_acertos = t;
      await set(ref(db, `tabuada_niveis/${uid}/historico/${ts}`), entry);
    }
  } catch(e) { console.warn('[Tabuada] Erro ao salvar:', e); }
}


// ── Level config ──────────────────────────────────────────────
function getLevelConfig(lvl) {
  // Níveis 1-54: adição + subtração juntas, resultados crescem de 8 a 25
  if (lvl <= 54) {
    const t         = (lvl - 1) / 53;
    const pairs     = Math.round(2 + t * 6);   // 2 → 8
    let   secs      = Math.round(70 - t * 15); // 70 → 55s
    const maxResult = Math.round(8 + t * 17);  // 8 → 25
    const cols      = pairs <= 2 ? 2 : pairs <= 3 ? 3 : 4;
    if (lvl <= 30) secs = Math.round(secs / 2); // primeiras 30 fases com metade do tempo
    return { type:'mix_as', pairs, cols, secs, maxResult };
  }
  // Níveis 55-65: add+sub+mul; mínimo garantido de mul cresce de 1 até ~1/3 das questões
  if (lvl <= 65) {
    const t      = (lvl - 55) / 10; // 0 → 1
    const pairs  = Math.round(4 + t * 4);    // 4 → 8
    const secs   = Math.round(65 - t * 10);  // 65 → 55s
    const cols   = pairs <= 4 ? 3 : 4;
    const minMul = Math.max(1, Math.round(1 + t * (Math.floor(pairs / 3) - 1)));
    return { type:'mix_as', pairs, cols, secs, minMul, minDiv: 0 };
  }
  // Níveis 66+: todas as operações; div começa em 1 garantido e cresce junto com mul até ~1/4 cada
  const t      = Math.min(1, (lvl - 66) / 24); // 0→1 ao longo de 24 níveis
  const pairs  = Math.round(4 + t * 14);        // 4 → 18
  const secs   = Math.round(60 - t * 15);       // 60 → 45s
  const cols   = pairs <= 6 ? 4 : 6;
  const perOp  = Math.floor(pairs / 4);
  const minMul = Math.max(1, Math.round(1 + t * (perOp - 1)));
  const minDiv = Math.max(1, Math.round(1 + t * (perOp - 1)));
  return { type:'mix_as', pairs, cols, secs, minMul, minDiv };
}

// ── Helpers ───────────────────────────────────────────────────
function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function escH(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Op generator ──────────────────────────────────────────────
function tryGenOp(type, usedR, maxResult = 999) {
  let a, b, result, sym, label = null;
  for (let t = 0; t < 60; t++) {
    label = null;
    if (type === 'add') {
      if (maxResult < 50) {
        // Resultados limitados por maxResult (níveis 1-50)
        a = rnd(1, Math.min(maxResult - 1, 12));
        b = rnd(1, Math.min(12, maxResult - a));
        result = a + b;
        if (result > maxResult || usedR.has(result)) continue;
      } else {
        a = rnd(1, 9); b = rnd(1, 10 - a);
        result = a + b;
        if (result > 20 || usedR.has(result)) continue;
      }
      sym = '+';
    } else if (type === 'sub') {
      if (maxResult < 50) {
        // minuendo próximo ao resultado para evitar contas complexas nos primeiros níveis
        a = rnd(2, Math.min(maxResult + 1, 10));
        b = rnd(1, Math.min(a - 1, 9));
        result = a - b;
        if (result < 1 || result > maxResult || usedR.has(result)) continue;
      } else {
        a = rnd(4, 18); b = rnd(1, a - 1);
        result = a - b;
        if (result < 1 || usedR.has(result)) continue;
      }
      sym = '−';
    } else if (type === 'mul') {
      a = rnd(2, 9); b = rnd(2, 9);
      result = a * b;
      if (result > 81 || usedR.has(result)) continue;
      sym = '×';
    } else if (type === 'div') {
      b = rnd(2, 9); result = rnd(2, 11);
      if (usedR.has(result)) continue;
      a = b * result;
      sym = '÷';
    } else if (type === 'mix_as') {
      return tryGenOp(rnd(0, 1) === 0 ? 'add' : 'sub', usedR, maxResult);
    } else if (type === 'mix_asm_lite') {
      // mul com peso menor (20%) para introdução gradual
      const r = rnd(0, 4);
      return tryGenOp(r <= 1 ? 'add' : r <= 3 ? 'sub' : 'mul', usedR, maxResult);
    } else if (type === 'mix_asm') {
      return tryGenOp(['add','sub','mul'][rnd(0, 2)], usedR, maxResult);
    } else if (type === 'mix') {
      const types = ['add','sub','mul','div'];
      return tryGenOp(types[rnd(0, 3)], usedR, maxResult);
    } else {
      return null;
    }
    usedR.add(result);
    return { op: { sym, a, b, label }, result };
  }
  return null;
}

function generatePairs(type, count, maxResult = 999, minMul = 0, minDiv = 0) {
  const pairs = [];
  const usedR = new Set();
  for (let i = 0; i < minMul && pairs.length < count; i++) {
    const p = tryGenOp('mul', usedR);
    if (p) pairs.push(p);
  }
  for (let i = 0; i < minDiv && pairs.length < count; i++) {
    const p = tryGenOp('div', usedR);
    if (p) pairs.push(p);
  }
  for (let attempt = 0; attempt < 600 && pairs.length < count; attempt++) {
    const p = tryGenOp(type, usedR, maxResult) || tryGenOp('add', usedR, maxResult);
    if (p) pairs.push(p);
  }
  return pairs;
}

    minHeight: '0',
    zIndex: '100',
    pointerEvents: 'none',
    margin: '0',
    boxSizing: 'border-box',
  });
  document.body.appendChild(clone);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    clone.style.transition = 'left .28s ease, top .28s ease, width .28s ease, height .28s ease';
    clone.style.left   = slotRect.left   + 'px';
    clone.style.top    = slotRect.top    + 'px';
    clone.style.width  = slotRect.width  + 'px';
    clone.style.height = slotRect.height + 'px';

function flyBack(info, el) {
  const { clone, origRect } = info;
  clone.style.transition = 'left .28s ease, top .28s ease, width .28s ease, height .28s ease';
  clone.style.left   = origRect.left   + 'px';
  clone.style.top    = origRect.top    + 'px';
  clone.style.width  = origRect.width  + 'px';

// ── Audio (Web Audio API) ─────────────────────────────────────
let _audioCtx = null;
function _getCtx() {
  if (!_audioCtx) {
    try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return _audioCtx;
}
function _beep(freq, dur, type = 'sine', vol = 0.22, delay = 0) {
  const ctx = _getCtx(); if (!ctx) return;
  try {
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t); osc.stop(t + dur + .01);
  } catch(e) {}
}
function resumeAudio() { const ctx = _getCtx(); if (ctx?.state === 'suspended') ctx.resume(); }
function somAcerto()   { _beep(660, .1,'sine',.2); _beep(880,.13,'sine',.2,.1); }
function somErro()     { _beep(180,.2,'sawtooth',.12); }

      ${_isSprint
        ? `<div class="nivel-badge">⚡ Sprint</div>`
        : `<div class="nivel-badge"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>Nível ${nivelAtual}</div>`}
    </div>
    ${_isSprint
      ? `<div style="font-size:12px;color:var(--text-muted)">⚡ <strong style="color:var(--blue)">${_sprintPairsOk}</strong> acerto${_sprintPairsOk !== 1 ? 's' : ''}</div>`
      : `<div style="font-size:12px;color:var(--text-muted)">Melhor: <strong style="color:var(--blue)">${melhorNivel}</strong></div>`}
  </div>

  ${_isSprint ? '' : miniRankingHtml()}

  ${_isSprint ? `
  <div class="sprint-bar">
    <div>
      <div class="sprint-timer" id="sprint-timer">03:00</div>
      <div class="sprint-label">Sprint</div>
    </div>
    <div class="sprint-stats">
      <div class="sprint-stat"><div class="sprint-stat-val" id="sprint-lvs">${_sprintLevels}</div><div class="sprint-stat-lbl">Concluídos</div></div>
      <div class="sprint-stat"><div class="sprint-stat-val" id="sprint-ok">${_sprintPairsOk}</div><div class="sprint-stat-lbl">Acertos</div></div>
      <div class="sprint-stat"><div class="sprint-stat-val" id="sprint-err">${_sprintErrTotal}</div><div class="sprint-stat-lbl">Erros</div></div>
    </div>
  </div>` : `
  <div class="timer-wrap" id="timer-display">
    <svg viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61 1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
    <span id="timer-text">${String(Math.floor(timerTotal/60)).padStart(2,'0')}:${String(timerTotal%60).padStart(2,'0')}</span>
  </div>
  <div class="timer-bar-bg">
    <div class="timer-bar" id="timer-bar" style="width:100%"></div>
  </div>`}

  <div class="pairs-bar-bg" id="pairs-dots">${dotsHtml}</div>

  <div class="status-msg" id="status-msg"></div>
  <div id="combo-badge" style="text-align:center;min-height:22px;margin-bottom:6px;margin-top:-6px"></div>

  <div class="game-grid" id="game-grid"
       style="grid-template-columns:repeat(${cols},1fr)"></div>

  <div class="slots-wrap">
    <div class="slot" id="slot-op">operação</div>
    <span class="slot-eq">=</span>
    <div class="slot" id="slot-res">resultado</div>
  </div>

  <div class="game-controls">
    <button class="btn btn-ghost" onclick="reiniciarNivel()">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      Reiniciar
    </button>
    ${_isSprint ? `<button class="btn btn-ghost" onclick="endSprint(true)" style="color:var(--red);border-color:rgba(226,75,74,.3)">⚡ Encerrar Sprint</button>` : ''}
  </div>
</div>`;

  // Populate grid
  const grid = document.getElementById("game-grid");
  cards.forEach((card, idx) => {
    const el = document.createElement("div");
    el.className = `game-card type-${card.kind}`;
    el.dataset.pairId = card.pairId;
    el.dataset.kind   = card.kind;
    el.style.cssText  = `animation:fadeInUp .28s ease both;animation-delay:${(idx * 0.025).toFixed(2)}s`;
    el.innerHTML      = card.kind === 'op'
      ? opCardHtml(card.op)
      : `<div class="res-number">${card.result}</div>`;
    el.addEventListener("click", () => onCardClick(el, card));
    grid.appendChild(el);
  });

  // Clicar no slot devolve a carta ao lugar de origem
  document.getElementById('slot-op')?.addEventListener('click',  deselectCard);
  document.getElementById('slot-res')?.addEventListener('click', deselectCard);

  if (_isSprint) {
    if (!_sprintStarted) {
      _sprintNivelIni = nivelAtual;
      _sprintStarted = true;
      startSprintTimer();
    } else {
      updateSprintDisplay();
    }
  } else {
    startTimer();
  }
}

// ── Timer ─────────────────────────────────────────────────────
function startTimer() {
  updateTimerUI();
  timerInterval = setInterval(() => {
    if (gameOver) return;
    timerLeft = Math.max(0, timerLeft - 1);
    updateTimerUI();
    if (timerLeft === 0) { clearInterval(timerInterval); timerInterval = null; onTimerEnd(); }
  }, 1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function updateTimerUI() {
  const pct  = timerTotal > 0 ? timerLeft / timerTotal : 0;
  const min  = Math.floor(timerLeft / 60);
  const sec  = timerLeft % 60;
  const txt  = document.getElementById("timer-text");
  const wrap = document.getElementById("timer-display");
  const bar  = document.getElementById("timer-bar");
  if (!txt) return;
  txt.textContent = `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  if (wrap) wrap.className = `timer-wrap${timerLeft <= 10 ? ' warn' : ''}`;
  if (bar) {
    bar.style.width = `${pct * 100}%`;
    bar.className   = `timer-bar${pct < .2 ? ' danger' : pct < .4 ? ' warn' : ''}`;
  }
}

// ── Card click ────────────────────────────────────────────────
function setStatus(msg, color) {
  const el = document.getElementById("status-msg");
  if (!el) return;
  el.textContent = msg;
  el.style.color = color || 'var(--text-muted)';
}

function clearSlots() {
  const slotOp  = document.getElementById("slot-op");
  const slotRes = document.getElementById("slot-res");
  if (slotOp)  { slotOp.innerHTML  = "operação";  slotOp.classList.remove("filled"); }
  if (slotRes) { slotRes.innerHTML = "resultado"; slotRes.classList.remove("filled"); }
}

function fillSlot(card) {
  if (card.kind === 'op') {
    const slotOp = document.getElementById("slot-op");
    if (slotOp) { slotOp.innerHTML = ''; slotOp.classList.add("filled"); }
  } else {
    const slotRes = document.getElementById("slot-res");
    if (slotRes) { slotRes.innerHTML = ''; slotRes.classList.add("filled"); }
  }
}

function deselectCard() {
  if (!selectedCard) return;
  const { clone, origRect } = selectedCard.flyInfo;
  const el = selectedCard.el;
  clone.style.transition = 'left .28s ease, top .28s ease, width .28s ease, height .28s ease';
  clone.style.left   = origRect.left   + 'px';
  clone.style.top    = origRect.top    + 'px';
  clone.style.width  = origRect.width  + 'px';
  clone.style.height = origRect.height + 'px';
  setTimeout(() => {
    clone.remove();
    el.style.visibility = '';
    el.style.pointerEvents = '';
  }, 280);
  selectedCard = null;
  clearSlots();
  setStatus("");
}

function onCardClick(el, card) {
  if (gameOver) return;
  if (el.style.visibility === 'hidden') return;
  resumeAudio();

  // Toggle: clicar no mesmo card deseleciona
  if (selectedCard && selectedCard.el === el) {
    deselectCard();
    return;
  }

  // Primeiro clique
  if (!selectedCard) {
    const flyInfo = launchCard(el, card);
    selectedCard = { el, pairId: card.pairId, kind: card.kind, op: card.op, result: card.result, flyInfo };
    fillSlot(card);
    setStatus("Selecione o par →", 'var(--blue-dark)');
    return;
  }

  // Segundo clique: verificar par
  const first = selectedCard;
  const flyInfo2 = launchCard(el, card);
  fillSlot(card);

  if (first.pairId === card.pairId && first.kind !== card.kind) {
    // ✅ Correto
    [first.flyInfo.clone, flyInfo2.clone].forEach(c => c.classList.add('matched-flash'));

    const dot = document.getElementById(`dot-${card.pairId}`);
    if (dot) dot.classList.add('done');

    setTimeout(() => {
      [first.flyInfo.clone, flyInfo2.clone].forEach(c => {
        c.style.transition = 'opacity .28s, transform .28s';
        c.style.opacity = '0';
        c.style.transform = 'scale(0.5)';
        setTimeout(() => c.remove(), 300);
      });
    }, 200);

    acertos++;
    comboCount++;
    somAcerto();
    showComboPopup(el);
    if (_isSprint) { _sprintPairsOk++; updateSprintDisplay(); }
    const tipo = symToTipo((first.kind === 'op' ? first.op : card.op)?.sym);
    if (tipo) tipoAcertos[tipo]++;
    selectedCard = null;
    removedCount++;
    setTimeout(() => { clearSlots(); setStatus(""); }, 650);
    if (removedCount >= totalPairs) setTimeout(onGameWin, 500);

  } else {
    // ❌ Errado — zera selectedCard imediatamente para evitar race condition
    erros++;
    const _tipoErr = symToTipo((first.kind === 'op' ? first.op : card.op)?.sym);
    if (_tipoErr) tipoErros[_tipoErr]++;
    comboCount = 0;
    somErro();
    const _badge = document.getElementById('combo-badge');
    if (_badge) _badge.innerHTML = '';
    if (_isSprint) { _sprintErrTotal++; updateSprintDisplay(); }
    setStatus("Errou! Tente outra combinação. ❌", 'var(--red)');
    selectedCard = null;
    flyBack(first.flyInfo, first.el);
    flyBack(flyInfo2, el);
    setTimeout(() => {
      clearSlots();
      setTimeout(() => setStatus(""), 800);
    }, 600);
  }
}

// ── Win ───────────────────────────────────────────────────────
async function onGameWin() {
  gameOver = true;
  stopTimer();

  const nivelJogado = nivelAtual;
  somVitoria();

  if (_isSprint) {
    _sprintLevels++;
    nivelAtual++;  // avança dificuldade local apenas — não salva no Firebase
    progresso.total_partidas = (progresso.total_partidas || 0) + 1;
    await salvarProgresso(progresso, 'completou', nivelJogado, acertos, erros, true);
    document.getElementById("lov-emoji").textContent = erros === 0 ? '⭐' : '✅';
    document.getElementById("lov-title").textContent = `+${acertos} acerto${acertos !== 1 ? 's' : ''}!`;
    document.getElementById("lov-sub").textContent   = `Total: ${_sprintPairsOk} · próxima rodada em 1s…`;
    document.getElementById("lov-new").textContent   = '';
    document.getElementById("lov-new").style.color   = 'var(--blue)';
    document.getElementById("lov-btn").textContent   = 'Avançar →';
    document.querySelector('.level-card').style.animation = 'levelUpPop .35s';
    document.getElementById("level-overlay").style.display = 'flex';
    _sprintWinTimeout = setTimeout(() => {
      _sprintWinTimeout = null;
      if (_sprintEnded) return;
      document.getElementById("level-overlay").style.display = 'none';
      buildGame();
    }, 1500);
    return;
  }

  if (_isReplay) {
    progresso.total_partidas = (progresso.total_partidas || 0) + 1;
    await salvarProgresso(progresso, 'completou', nivelJogado, acertos, erros, true);
    _registrarSessao(nivelJogado, 'completou');
    nivelAtual = nivelJogado + 1; // avança nível local da sessão de prática
    document.getElementById("lov-emoji").textContent = erros === 0 ? '⭐' : '✅';
    document.getElementById("lov-title").textContent = erros === 0 ? 'Perfeito!' : 'Nível concluído!';
    document.getElementById("lov-sub").textContent   = `Nível ${nivelJogado} · ${acertos} acerto${acertos !== 1 ? 's' : ''}${erros > 0 ? ` · ${erros} erro${erros > 1 ? 's' : ''}` : ''}`;
    document.getElementById("lov-new").textContent   = `→ Nível ${nivelAtual} (prática)`;
    document.getElementById("lov-new").style.color   = 'var(--blue)';
    document.getElementById("lov-btn").textContent   = 'Continuar →';
    document.querySelector('.level-card').style.animation = 'levelUpPop .45s';
    document.getElementById("level-overlay").style.display = 'flex';
    return;
  }

  const eraLider    = rankingAll[0]?.nome === nomeAluno && rankingAll[0]?.turma === turma;
  const melhorAnterior = melhorNivel;
  const novoNivel  = nivelAtual + 1;
  const novoMelhor = Math.max(melhorNivel, novoNivel);

  progresso.nivel_atual    = novoNivel;
  progresso.melhor_nivel   = novoMelhor;
  progresso.total_partidas = (progresso.total_partidas || 0) + 1;

  nivelAtual  = novoNivel;
  melhorNivel = novoMelhor;

  await salvarProgresso(progresso, 'completou', nivelJogado, acertos, erros);
  _registrarSessao(nivelJogado, 'completou');

  const isNewRecord = novoNivel > melhorAnterior;

  // Mostra overlay imediatamente com informações já conhecidas
  const isEstrela = erros === 0;
  if (isEstrela) lancarConfete(50);
  document.getElementById("lov-emoji").textContent = isEstrela ? '⭐' : '🎉';
  document.getElementById("lov-title").textContent = isEstrela ? '⭐ Nível com estrela!' : 'Avançou de nível!';
  document.getElementById("lov-sub").textContent   = isEstrela
    ? `Perfeito! Sem erros! ${isNewRecord ? '🌟 Novo recorde pessoal!' : 'Continue assim!'}`
    : `${erros} erro${erros !== 1 ? 's' : ''} — sem estrela desta vez. ${isNewRecord ? '🌟 Novo recorde!' : 'Continue avançando!'}`;
  document.getElementById("lov-new").textContent   = `→ Nível ${novoNivel}`;
  document.getElementById("lov-new").style.color   = isEstrela ? 'var(--gold)' : 'var(--blue)';
  document.getElementById("lov-btn").textContent   = 'Continuar →';
  document.querySelector('.level-card').style.animation = 'levelUpPop .45s';
  document.getElementById("level-overlay").style.display = 'flex';

  // Atualiza ranking em background — se virou líder, atualiza overlay
  reloadRanking().then(() => {
    const eLider = rankingAll[0]?.nome === nomeAluno && rankingAll[0]?.turma === turma;
    if (eLider && !eraLider) {
      if (!isEstrela) lancarConfete(80);
      document.getElementById("lov-emoji").textContent = '🏆';
      document.getElementById("lov-title").textContent = '🥇 Você é o novo líder!';
      document.getElementById("lov-sub").textContent   =
        `${isEstrela ? '⭐ Com estrela! ' : ''}Primeiro lugar no ranking geral!`;
    }
  });
}

// ── Timer end ─────────────────────────────────────────────────
async function onTimerEnd() {
  gameOver = true;
  somDerrota();

  const nivelJogado = nivelAtual;

  progresso.total_partidas = (progresso.total_partidas || 0) + 1;
  const isReplayDerrota = _isReplay;
  await salvarProgresso(progresso, 'tempo_esgotado', nivelJogado, acertos, erros, isReplayDerrota || false);
  _registrarSessao(nivelJogado, 'tempo_esgotado');
  if (!isReplayDerrota) reloadRanking();

  const frases = [
    `Você acertou ${acertos} par${acertos !== 1 ? 'es' : ''}. Tente de novo! 💪`,
    'Quase lá! Mais uma tentativa 🚀',
    'Na próxima você passa! 🎯',
    'Continue tentando, você consegue! ⭐',
    'Não desista — o tempo vai sobrar! ⏱️',
  ];
  const frase = frases[Math.floor(Math.random() * frases.length)];
  const nivelExibir = isReplayDerrota ? _nivelReal : nivelAtual;

  document.getElementById("lov-emoji").textContent = '⏰';
  document.getElementById("lov-title").textContent = 'Tempo esgotado!';
  document.getElementById("lov-sub").textContent   = frase;
  document.getElementById("lov-new").textContent   = `Nível ${nivelExibir} — tente de novo`;
  document.getElementById("lov-new").style.color   = 'var(--orange)';
  document.getElementById("lov-btn").textContent   = 'Tentar de novo →';
  document.querySelector('.level-card').style.animation = 'levelDownPop .35s ease';
  document.getElementById("level-overlay").style.display = 'flex';
}

// ── Public functions ──────────────────────────────────────────
window.endSprint = (manual) => endSprint(manual);

window.toggleAvatarMenu = function() {
  document.getElementById('avatar-menu').classList.toggle('open');
};
document.addEventListener('click', function(e) {
  if (!e.target.closest('.avatar-wrap')) {
    document.getElementById('avatar-menu')?.classList.remove('open');
  }
});

window.fecharOverlay = function() {
  if (_isSprint && _sprintEnded) {
    window.location.href = '/aluno/jogos.html';
    return;
  }
  if (_sprintWinTimeout) { clearTimeout(_sprintWinTimeout); _sprintWinTimeout = null; }
  document.getElementById("level-overlay").style.display = 'none';
  buildGame();
};

window.reiniciarNivel = function() {
  if (_sprintEnded) return;
  stopTimer();
  buildGame();
};


// ── Start ─────────────────────────────────────────────────────
buildGame();
</script>
