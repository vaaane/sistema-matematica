<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎮 Tabuada — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    /* ── Timer ── */
    .timer-wrap{display:flex;align-items:center;justify-content:center;gap:8px;font-size:32px;font-weight:800;margin-bottom:10px;color:var(--text);transition:color .3s;}
    .timer-wrap svg{width:30px;height:30px;fill:currentColor;}
    .timer-wrap.warn{color:var(--red);}
    .timer-bar-bg{height:7px;background:var(--border);border-radius:4px;margin-bottom:18px;overflow:hidden;}
    .timer-bar{height:100%;border-radius:4px;background:var(--blue);transition:width 1s linear,background .4s;}
    .timer-bar.warn{background:var(--orange);}
    .timer-bar.danger{background:var(--red);}

    /* ── Level badge ── */
    .nivel-badge{display:inline-flex;align-items:center;gap:6px;background:var(--blue-pale);border:1.5px solid rgba(127,119,221,0.3);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:700;color:var(--blue-dark);}
    .nivel-badge svg{width:13px;height:13px;fill:currentColor;}

    /* ── Game grid ── */
    .game-grid{display:grid;gap:7px;margin-bottom:18px;position:relative;overflow:hidden;}

    /* ── Game card ── */
    .game-card{
      position:static;
      background:var(--card);border:1.5px solid var(--border);border-radius:11px;
      padding:6px 4px;cursor:pointer;
      transition:border-color .14s,background .14s;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      height:var(--game-card-h,68px);min-height:0;overflow:hidden;
      user-select:none;-webkit-tap-highlight-color:transparent;
    }
    .game-card.compact .res-number{font-size:18px;}
    .game-card.compact .num-cima,.game-card.compact .num-baixo{font-size:16px;}
    .game-card.compact .op-compound{font-size:11px;}
    .game-card.compact .operador{font-size:12px;}
    .game-card:hover{border-color:var(--blue);background:var(--blue-pale);}
    .game-card.selected{border:2.5px solid var(--blue);background:var(--blue-pale);box-shadow:inset 0 0 0 2px rgba(47,158,220,.18);}
    .game-card.error{border-color:var(--red)!important;background:var(--red-pale)!important;animation:shake .4s;}
    .game-card.matched-flash{border-color:var(--green)!important;background:var(--green-pale)!important;pointer-events:none;}
    .game-card.removed{pointer-events:none;animation:cardOut .4s forwards;}

    /* ── Operação: operador + fração como unidade centralizada no card ── */
    .op-wrap{ display:flex;align-items:center;gap:4px; }
    .operador{ font-size:clamp(9px,2.2vw,14px);font-weight:900;color:var(--text);line-height:1;flex-shrink:0; }
    .fracao{ display:flex;flex-direction:column;align-items:center; }
    .num-cima,.num-baixo{ font-size:clamp(12px,3.5vw,22px);font-weight:800;line-height:1.1;color:var(--text);min-width:16px;text-align:center; }
    .traco{ width:100%;height:2px;background:var(--text);border-radius:1px;margin:1px 0; }
    /* Expressão composta (nível 16+) */
    .op-compound{font-size:clamp(10px,2.8vw,13px);font-weight:800;color:var(--text);text-align:center;line-height:1.4;letter-spacing:-.3px;padding:0 3px;}
    /* Número resultado */
    .res-number{font-size:clamp(14px,4.5vw,28px);font-weight:800;color:var(--text);line-height:1;}

    /* ── Slots ── */
    .slots-wrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
    .slot{width:128px;height:60px;border:2px dashed var(--border);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text-muted);background:var(--bg);transition:all .2s;text-align:center;padding:4px;}
    .slot.filled{border-style:solid;border-color:var(--blue);background:var(--blue-pale);color:var(--text);cursor:pointer;}
    .slot.filled:hover{border-color:var(--orange);}
    .slot.filled .slot-ph{display:none;}
    .slot-eq{font-size:24px;font-weight:800;color:var(--text-muted);}

    /* ── Controls ── */
    .game-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

    /* ── Status msg ── */
    .status-msg{text-align:center;font-size:13px;color:var(--text-muted);margin-bottom:12px;min-height:18px;transition:all .2s;}

    /* ── Animations ── */
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
    @keyframes cardOut{0%{opacity:1}100%{opacity:0;visibility:hidden}}
    @keyframes levelUpPop{0%{opacity:0;transform:scale(.45) rotate(-8deg)}70%{transform:scale(1.12) rotate(1.5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
    @keyframes levelDownPop{0%{opacity:0;transform:scale(.88) translateY(8px)}65%{transform:scale(1.02) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideUp{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes combo-float{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}60%{opacity:1;transform:translateX(-50%) translateY(-30px) scale(1.15)}100%{opacity:0;transform:translateX(-50%) translateY(-52px) scale(.9)}}
    .combo-pop{position:fixed;pointer-events:none;z-index:150;font-weight:800;font-size:15px;font-family:'Inter',sans-serif;animation:combo-float .85s ease forwards;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.35);}
    .combo-pop.combo-big{font-size:21px;animation-duration:1.05s;}
    .combo-pop.combo-huge{font-size:28px;animation-duration:1.3s;}
    @keyframes combo-badge-pop{0%{transform:scale(1.3);opacity:.6}100%{transform:scale(1);opacity:1}}
    .combo-badge-inner{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:800;padding:3px 12px;border-radius:20px;animation:combo-badge-pop .2s;}
    .combo-c2{background:rgba(34,197,94,.1);color:#22C55E;border:1px solid rgba(34,197,94,.25);}
    .combo-c3{background:rgba(249,115,22,.1);color:#f97316;border:1px solid rgba(249,115,22,.25);}
    .combo-c4{background:rgba(250,184,0,.1);color:#FAB800;border:1px solid rgba(250,184,0,.28);}
    .combo-c5{background:rgba(250,184,0,.18);color:#FAB800;border:1px solid rgba(250,184,0,.45);font-size:15px;}

    /* ── Level overlay ── */
    .level-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
    .level-card{background:var(--card);border-radius:22px;padding:40px 44px;text-align:center;animation:levelUpPop .45s;box-shadow:0 24px 64px rgba(0,0,0,.35);max-width:320px;width:92vw;}
    .level-emoji{font-size:68px;line-height:1;margin-bottom:14px;}
    .level-title{font-size:24px;font-weight:800;margin-bottom:6px;}
    .level-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.5;}
    .level-new{font-size:19px;font-weight:700;color:var(--blue);margin-bottom:24px;}

    /* ── Back link (inside content) ── */
    .link-back{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--text-muted);text-decoration:none;transition:color .14s;padding:2px 0;}
    .link-back:hover{color:var(--text);}
    .link-back svg{width:13px;height:13px;fill:currentColor;flex-shrink:0;}

    /* ── Progress bar (pairs left) ── */
    .pairs-bar-bg{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;justify-content:center;}
    .pair-dot{width:12px;height:12px;border-radius:50%;background:var(--border);transition:background .3s;}
    .pair-dot.done{background:var(--green);}

    /* ── Confete ── */
    @keyframes confete-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(115vh) rotate(740deg);opacity:0}}
    .confete-wrap{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden;}
    .confete-particle{position:absolute;top:-12px;border-radius:3px;animation:confete-fall linear forwards;}

    /* ── Chefão ── */
    @keyframes chefao-pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}}
    @keyframes chefao-badge-pulse{0%,100%{box-shadow:0 0 8px rgba(239,68,68,.5)}50%{box-shadow:0 0 18px rgba(239,68,68,.9),0 0 32px rgba(239,68,68,.3)}}
    @keyframes chefao-modal-in{from{opacity:0;transform:scale(.8) rotate(-4deg)}to{opacity:1;transform:scale(1) rotate(0)}}
    .nivel-badge.chefao{background:linear-gradient(135deg,rgba(239,68,68,.18),rgba(249,115,22,.12));border-color:rgba(239,68,68,.5);color:#EF4444;animation:chefao-badge-pulse 1.4s infinite;}
    .nivel-badge.chefao svg{fill:#EF4444;}
    .timer-wrap.chefao{color:#EF4444!important;}
    .timer-wrap.chefao svg{fill:#EF4444!important;}
    .timer-bar.chefao{background:linear-gradient(90deg,#EF4444,#F97316)!important;}
    .game-grid.chefao-grid{border:1.5px solid rgba(239,68,68,.3);border-radius:10px;padding:8px;background:rgba(239,68,68,.03);box-shadow:0 0 24px rgba(239,68,68,.12);}
    .chefao-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
    .chefao-modal-card{background:linear-gradient(135deg,#1a0505,#2d0a0a);border:2px solid rgba(239,68,68,.5);border-radius:22px;padding:38px 40px;text-align:center;max-width:340px;width:92vw;animation:chefao-modal-in .4s ease both;box-shadow:0 24px 64px rgba(239,68,68,.3);}
    .chefao-modal-icon{font-size:72px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 0 16px rgba(239,68,68,.6));}
    .chefao-modal-title{font-size:26px;font-weight:800;color:#EF4444;letter-spacing:1px;margin-bottom:4px;}
    .chefao-modal-sub{font-size:14px;color:#F87171;margin-bottom:18px;font-weight:600;}
    .chefao-modal-stats{display:flex;gap:10px;justify-content:center;margin-bottom:20px;}
    .chefao-modal-stat{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:8px 14px;font-size:12px;color:#FCA5A5;font-weight:700;}
    .chefao-modal-desc{font-size:12px;color:#7f4444;margin-bottom:22px;line-height:1.6;}
    .btn-enfrentar{width:100%;padding:14px;background:linear-gradient(135deg,#DC2626,#B91C1C);border:none;border-radius:13px;color:#fff;font-size:17px;font-weight:800;cursor:pointer;letter-spacing:1px;animation:chefao-pulse 1.6s infinite;font-family:'Inter',sans-serif;}
    .btn-enfrentar:hover{background:linear-gradient(135deg,#EF4444,#DC2626);}

    /* ── Chefão Difícil (roxo) ── */
    @keyframes chefao-dificil-pulse{0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,.4)}50%{box-shadow:0 0 0 6px rgba(139,92,246,0)}}
    @keyframes chefao-dificil-badge{0%,100%{box-shadow:0 0 8px rgba(139,92,246,.5)}50%{box-shadow:0 0 18px rgba(139,92,246,.9),0 0 32px rgba(139,92,246,.3)}}
    .nivel-badge.chefao-dificil{background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(167,139,250,.12));border-color:rgba(139,92,246,.5);color:#A78BFA;animation:chefao-dificil-badge 1.4s infinite;}
    .nivel-badge.chefao-dificil svg{fill:#A78BFA;}
    .timer-wrap.chefao-dificil{color:#A78BFA!important;}
    .timer-wrap.chefao-dificil svg{fill:#A78BFA!important;}
    .timer-bar.chefao-dificil{background:linear-gradient(90deg,#7C3AED,#A78BFA)!important;}
    .game-grid.chefao-dificil-grid{border:1.5px solid rgba(139,92,246,.3);border-radius:10px;padding:8px;background:rgba(139,92,246,.03);box-shadow:0 0 24px rgba(139,92,246,.12);}
    .chefao-modal-card.dificil{background:linear-gradient(135deg,#0d0514,#1a0a2e);border-color:rgba(139,92,246,.5);box-shadow:0 24px 64px rgba(139,92,246,.3);}
    .chefao-modal-card.dificil .chefao-modal-title{color:#A78BFA;}
    .chefao-modal-card.dificil .chefao-modal-sub{color:#C4B5FD;}
    .chefao-modal-card.dificil .chefao-modal-stat{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.3);color:#DDD6FE;}
    .chefao-modal-card.dificil .chefao-modal-desc{color:#6b4a7f;}
    .chefao-modal-card.dificil .chefao-modal-icon{filter:drop-shadow(0 0 16px rgba(139,92,246,.6));}
    .chefao-modal-card.dificil .btn-enfrentar{background:linear-gradient(135deg,#7C3AED,#5B21B6);animation:chefao-dificil-pulse 1.6s infinite;}
    .chefao-modal-card.dificil .btn-enfrentar:hover{background:linear-gradient(135deg,#8B5CF6,#7C3AED);}

    /* ── Chefão Grande (azul escuro) ── */
    @keyframes chefao-grande-pulse{0%,100%{box-shadow:0 0 0 0 rgba(30,64,175,.4)}50%{box-shadow:0 0 0 6px rgba(30,64,175,0)}}
    @keyframes chefao-grande-badge{0%,100%{box-shadow:0 0 8px rgba(59,130,246,.5)}50%{box-shadow:0 0 18px rgba(59,130,246,.9),0 0 32px rgba(59,130,246,.3)}}
    .nivel-badge.chefao-grande{background:linear-gradient(135deg,rgba(30,64,175,.18),rgba(59,130,246,.12));border-color:rgba(59,130,246,.5);color:#60A5FA;animation:chefao-grande-badge 1.4s infinite;}
    .nivel-badge.chefao-grande svg{fill:#60A5FA;}
    .timer-wrap.chefao-grande{color:#60A5FA!important;}
    .timer-wrap.chefao-grande svg{fill:#60A5FA!important;}
    .timer-bar.chefao-grande{background:linear-gradient(90deg,#1E40AF,#3B82F6)!important;}
    .game-grid.chefao-grande-grid{border:1.5px solid rgba(59,130,246,.3);border-radius:10px;padding:8px;background:rgba(59,130,246,.03);box-shadow:0 0 24px rgba(59,130,246,.12);}
    .chefao-modal-card.grande{background:linear-gradient(135deg,#020d1a,#0a1f3e);border-color:rgba(59,130,246,.5);box-shadow:0 24px 64px rgba(30,64,175,.3);}
    .chefao-modal-card.grande .chefao-modal-title{color:#60A5FA;}
    .chefao-modal-card.grande .chefao-modal-sub{color:#93C5FD;}
    .chefao-modal-card.grande .chefao-modal-stat{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.3);color:#BFDBFE;}
    .chefao-modal-card.grande .chefao-modal-desc{color:#3a5275;}
    .chefao-modal-card.grande .chefao-modal-icon{filter:drop-shadow(0 0 16px rgba(59,130,246,.6));}
    .chefao-modal-card.grande .btn-enfrentar{background:linear-gradient(135deg,#1D4ED8,#1E40AF);animation:chefao-grande-pulse 1.6s infinite;}
    .chefao-modal-card.grande .btn-enfrentar:hover{background:linear-gradient(135deg,#3B82F6,#2563EB);}

    /* ── Mini ranking ── */
    .mini-rank-wrap{margin-bottom:14px;}
    .mini-rank-leader{display:flex;align-items:center;gap:8px;background:rgba(234,179,8,.07);border:1px solid rgba(234,179,8,.25);border-radius:11px;padding:10px 14px;margin-bottom:6px;}
    .mini-rank-leader-icon{font-size:22px;line-height:1;flex-shrink:0;}
    .mini-rank-leader-text{flex:1;min-width:0;}
    .mini-rank-leader-title{font-size:13px;font-weight:700;color:#eab308;line-height:1.2;}
    .mini-rank-leader-sub{font-size:11px;color:rgba(234,179,8,.65);margin-top:2px;}
    .mini-rank-bar{display:flex;gap:6px;flex-wrap:wrap;}
    .mini-rank-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;}
    .mini-rank-pill.geral{background:rgba(234,179,8,.08);border:0.5px solid rgba(234,179,8,.2);color:#eab308;}
    .mini-rank-pill.turma{background:rgba(127,119,221,.08);border:0.5px solid rgba(127,119,221,.2);color:#c4b5fd;}

    /* ── Combo seguidos ── */
    .combo-seguidos{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;transition:all .2s;}
    .combo-seguidos.baixo{color:var(--text-muted);background:transparent;}
    .combo-seguidos.alto{color:#f97316;background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.25);}
    .combo-seguidos.maximo{color:#FAB800;background:rgba(250,184,0,.12);border:1px solid rgba(250,184,0,.35);}
    .combo-record-flash{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#FAB800,#f97316);color:#fff;font-size:13px;font-weight:800;padding:7px 18px;border-radius:30px;z-index:400;pointer-events:none;box-shadow:0 4px 20px rgba(250,184,0,.45);animation:recordFlash .8s ease forwards;}
    @keyframes recordFlash{0%{opacity:0;transform:translateX(-50%) translateY(-8px) scale(.9)}20%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.05)}80%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-6px) scale(.95)}}

    /* ── Sprint ── */
    .sprint-bar{display:flex;align-items:center;gap:14px;background:rgba(127,119,221,.06);border:0.5px solid rgba(127,119,221,.2);border-radius:11px;padding:12px 16px;margin-bottom:14px;}
    .sprint-timer{font-size:30px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;min-width:62px;line-height:1;}
    .sprint-timer.warn{color:var(--orange);}
    .sprint-timer.danger{color:var(--red);}
    .sprint-label{font-size:9px;color:var(--text-muted);text-align:center;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}
    .sprint-stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
    .sprint-stat{text-align:center;padding:6px 4px;background:rgba(255,255,255,.03);border-radius:8px;}
    .sprint-stat-val{font-size:18px;font-weight:800;color:var(--text);line-height:1;}
    .sprint-stat-lbl{font-size:9px;color:var(--text-muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em;}

    /* ── Modal dupla ── */
    .dupla-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
    .dupla-modal{background:var(--card);border-radius:22px;padding:32px 28px;max-width:360px;width:92vw;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.35);}
    .dupla-title{font-size:20px;font-weight:800;margin-bottom:4px;}
    .dupla-sub{font-size:13px;color:var(--text-muted);margin-bottom:22px;}
    .dupla-btn{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:13px;background:var(--bg);cursor:pointer;margin-bottom:10px;text-align:left;display:flex;align-items:center;gap:12px;transition:border-color .15s,background .15s;font-family:inherit;}
    .dupla-btn:last-child{margin-bottom:0;}
    .dupla-btn:hover{border-color:#7F77DD;background:rgba(127,119,221,.07);}
    .dupla-btn-avatar{width:40px;height:40px;border-radius:50%;background:#7F77DD;color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .dupla-btn-name{font-size:15px;font-weight:700;color:var(--text);line-height:1.2;}
    .dupla-btn-nivel{font-size:12px;color:var(--text-muted);margin-top:2px;}
    .dupla-footer{font-size:11px;color:var(--text-muted);margin-top:18px;line-height:1.5;}

    /* ── Desktop compacto ── */
    @media(min-width:769px){
      .timer-wrap{font-size:24px;margin-bottom:8px;}
      .timer-wrap svg{width:22px;height:22px;}
      .nivel-badge{font-size:11px;padding:4px 10px;}
    }

    /* ── Responsive ── */
    @media(max-width:480px){
      .game-card{padding:5px 3px;}
      .timer-wrap{font-size:26px;}
      .slot{width:110px;height:54px;}
    }
    @media(max-width:360px){
      .slot{width:94px;height:50px;}
      .slot-eq{font-size:20px;}
    }

    /* ── Fullscreen game — CSS Grid de 5 linhas ── */
    html,body{overflow:hidden;height:100%;}
    /* iOS Safari: dvh descontam a barra do browser; vh não desconta */
    .layout{min-height:100vh;min-height:100dvh;}
    .main{overflow:hidden;min-height:0!important;height:100vh;height:100dvh;}
    #content{flex:1!important;min-height:0!important;overflow:hidden!important;display:flex!important;flex-direction:column!important;padding:0!important;}
    /* .tb-wrap: Grid de 5 linhas — info | timer/líderes | status | 1fr cards | slots */

<script type="module">
import { getSession, renderSidebarAluno, renderSidebarProfessor, clearSession, isModoTeste } from "/js/auth.js";
import { db } from "/js/firebase-config.js";
import { ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ── Auth ──────────────────────────────────────────────────────
const sess = getSession();
const _isProfMode = sess?.modo === 'professor';
const _isModoTesteAtivo = !_isProfMode && isModoTeste();
if (!_isProfMode && (!sess || sess.modo !== 'aluno')) { window.location.href = '/index.html'; throw new Error(); }


if (_isProfMode) {
  renderSidebarProfessor("sidebar", "jogos");
} else {
  renderSidebarAluno("sidebar", "jogos");
}
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const _profUid = 'professora';
const alunos   = _isProfMode ? ['Professora'] : sess.alunos;
const turma    = _isProfMode ? '' : sess.turma;
let nomeAluno  = alunos[0];
const isDupla  = !_isProfMode && alunos.length === 2;
let parceiroDupla = isDupla ? alunos[1] : null;

function _makeUid(nome) { return (turma + '_' + nome).replace(/[.#$\[\]/\s]/g, '_'); }
let uid = _isProfMode ? _profUid : _makeUid(nomeAluno);

document.getElementById("avatar-initials").textContent = _isProfMode ? 'P' : nomeAluno[0].toUpperCase();

// ── Firebase ──────────────────────────────────────────────────
let niveisRef     = ref(db, _isProfMode ? `professor_tabuada_niveis/${uid}` : _isModoTesteAtivo ? `modo_teste_historico/PROFESSOR_TESTE/tabuada_niveis` : `tabuada_niveis/${uid}`);
let rankingRef    = (_isProfMode || _isModoTesteAtivo) ? null : ref(db, `tabuada_ranking/${uid}`);
let sprintRankRef = (_isProfMode || _isModoTesteAtivo) ? null : ref(db, `tabuada_sprint_ranking/${uid}`);

// Configurações globais do jogo (lidas do Firebase, aplicadas em getLevelConfig)
let tabuadaConfig = { tempo_base: 40, dificuldade_multiplicador: 5 };
try {
  const cfgSnap = await get(ref(db, 'tabuada_config/global'));
  if (cfgSnap.exists()) tabuadaConfig = { ...tabuadaConfig, ...cfgSnap.val() };
} catch(e) { console.warn('[Tabuada] Config não carregada:', e); }

async function carregarProgresso() {
  try {
    const snap = await get(niveisRef);
    if (snap.exists()) return snap.val();
  } catch(e) {}
  return { nivel_atual: 1, melhor_nivel: 1, ultima_partida: 0, total_partidas: 0 };
}

async function salvarProgresso(p, resultado, nivelJogado, acertosJogo, errosJogo, isReplay = false, segsRestantes = null) {
  try {
    const ts = Date.now();
    const novoMaiorCombo = Math.max(p.maior_combo || 0, comboSessao);
    if (isReplay) {
      await update(niveisRef, { ultima_partida: ts, total_partidas: p.total_partidas });
    } else {
      await update(niveisRef, {
        nivel_atual:    p.nivel_atual,
        melhor_nivel:   p.melhor_nivel,
        ultima_partida: ts,
        total_partidas: p.total_partidas,
        maior_combo:    novoMaiorCombo,
      });
      if (rankingRef) await set(rankingRef, {
        nome:           nomeAluno,
        turma:          turma,
        nivel_atual:    p.nivel_atual,
        melhor_nivel:   p.melhor_nivel,
        ultima_partida: ts,
        maior_combo:    novoMaiorCombo,
        total_partidas: p.total_partidas,
      });
    }
    if (resultado) {
      const entry = {
        nivel:               nivelJogado,
        resultado:           resultado,
        acertos:             acertosJogo || 0,
        erros:               errosJogo   || 0,
        maior_combo_sessao:  comboSessao,
      };
      if (segsRestantes !== null) entry.segundos_restantes = segsRestantes;
      const t = { ...tipoAcertos };
      if (t.add || t.sub || t.mul || t.div) entry.tipos_acertos = t;
      const _niveisBase = _isProfMode ? `professor_tabuada_niveis/${uid}` : _isModoTesteAtivo ? `modo_teste_historico/PROFESSOR_TESTE/tabuada_niveis` : `tabuada_niveis/${uid}`;
      await set(ref(db, `${_niveisBase}/historico/${ts}`), entry);
    }
  } catch(e) { console.warn('[Tabuada] Erro ao salvar:', e); }
}


// ── Level config ──────────────────────────────────────────────
function isChefao(lvl) { return lvl >= 130 && lvl % 10 === 0; }

function getTipoChefao(lvl) {
  if (!isChefao(lvl)) return null;
  const ciclo = Math.floor((lvl - 130) / 10) % 3;
  return ciclo === 0 ? 'rapido' : ciclo === 1 ? 'dificil' : 'grande';
}

function getLevelConfig(lvl) {
  const cfg = _getLevelConfigBase(lvl);
  // Override de tempo via URL ?secs= (professor testando nível específico)
  if (_secsOverride && (_isProfMode || _isModoTesteAtivo)) {
    cfg.secs = Math.max(5, _secsOverride);
    return cfg;
  }
  // Overrides pontuais por nível
  if (lvl === 240) cfg.secs += 8;
  if (lvl === 250 || lvl === 260) cfg.secs = 35;
  if (lvl >= 270 && lvl <= 279) cfg.secs -= 5;
  if (lvl === 280) cfg.secs = 35;
  if (lvl >= 281 && lvl <= 289) cfg.secs -= 10;
  if (lvl === 300) cfg.secs -= 15;
  // Aplicar offset de tempo configurado pela professora (padrão 40 = neutro)
  const tempoOffset = (tabuadaConfig.tempo_base || 40) - 40;
  if (tempoOffset !== 0) {
    cfg.secs = Math.max(15, Math.min(120, cfg.secs + tempoOffset));
  }
  return cfg;
}

function _getLevelConfigBase(lvl) {
  // Níveis 81-120: dificuldade congelada no nível 80, +40s de tempo
  if (lvl > 80 && lvl <= 120) { const cfg = _getLevelConfigBase(80); return { ...cfg, secs: cfg.secs + 40 }; }
  // Níveis 1-54: adição + subtração juntas, resultados crescem de 8 a 25
  if (lvl <= 54) {
    const t         = (lvl - 1) / 53;
    const pairs     = Math.round(2 + t * 6);   // 2 → 8
    let   secs      = Math.round(70 - t * 15); // 70 → 55s
    const maxResult = Math.round(8 + t * 17);  // 8 → 25
    const cols      = pairs <= 2 ? 2 : pairs <= 3 ? 3 : 4;
    if (lvl <= 30) secs = Math.round(secs / 2); // primeiras 30 fases com metade do tempo
    return { type:'mix_as', pairs, cols, secs, maxResult };
  }
  // Níveis 55-65: add+sub+mul; mínimo garantido de mul cresce de 1 até ~1/3 das questões
  if (lvl <= 65) {
    const t      = (lvl - 55) / 10; // 0 → 1
    const pairs  = Math.round(4 + t * 4);    // 4 → 8
    const secs   = Math.round(65 - t * 10);  // 65 → 55s
    const cols   = pairs <= 4 ? 3 : 4;
    const minMul = Math.max(1, Math.round(1 + t * (Math.floor(pairs / 3) - 1)));
    return { type:'mix_as', pairs, cols, secs, minMul, minDiv: 0 };
  }
  // Níveis 66-121: todas as operações; div cresce junto com mul até ~1/4 cada
  if (lvl <= 121) {
    const t      = Math.min(1, (lvl - 66) / 24); // 0→1 ao longo de 24 níveis, congela em 90+
    const pairs  = Math.round(4 + t * 14);        // 4 → 18
    const secs   = Math.round(60 - t * 15);       // 60 → 45s
    const cols   = pairs <= 6 ? 4 : 6;
    const perOp  = Math.floor(pairs / 4);
    const minMul = Math.max(1, Math.round(1 + t * (perOp - 1)));
    const minDiv = Math.max(1, Math.round(1 + t * (perOp - 1)));
    return { type:'mix_as', pairs, cols, secs, minMul, minDiv };
  }
  // Níveis 122-129: mesma dificuldade do 121 mas +20s (respiro antes do chefão)
  // tempoBase = nível 121 + 20s; calculado dinamicamente para manter coerência
  const TEMPO_BASE_129 = _getLevelConfigBase(121).secs + 20; // 65s
  const TEMPO_BASE_200 = TEMPO_BASE_129 - 20;               // 45s — base para níveis 200+
  if (lvl <= 129) {
    // 12p×2=24 ÷ 6cols = 4 linhas (desktop 6×4); mobile usa 4 cols → 4×6
    return { type:'mix_as', pairs:12, cols:6, secs:TEMPO_BASE_129, minMul:4, minDiv:4 };
  }
  // Níveis 130+: chefões variados em ciclo de 3 tipos (rápido/difícil/grande)
  const n = Math.floor((lvl - 130) / 10);
  if (lvl % 10 === 0) {
    const tipo   = getTipoChefao(lvl);
    const minMul = Math.min(5 + n, 7);
    const minDiv = Math.min(5 + n, 7);
    if (tipo === 'rapido') {
      // ⚡ Rápido: 12p×2=24 | desktop 6×4, mobile 4×6, tempo 45s
      return { type:'mix_as', pairs:12, cols:6, secs: Math.max(20, TEMPO_BASE_129 - 20), minMul, minDiv, ehChefao:true, tipoChefao:'rapido' };
    } else if (tipo === 'dificil') {
      // 🧮 Difícil: 12p×2=24 | desktop 6×4, mobile 4×6, ops pesadas
      const secsD = lvl >= 200 ? TEMPO_BASE_200 : TEMPO_BASE_129;
      return { type:'mix_as', pairs:12, cols:6, secs: secsD, minMul: Math.min(6+n,8), minDiv: Math.min(6+n,8), ehChefao:true, tipoChefao:'dificil', pesado:true };
    } else {
      // 📦 Grande: 18p×2=36 desktop (6×6) | 12p×2=24 mobile (4×6)
      // Progressão: grandeIdx 0=normal, ímpar=tempo-10s, par≥2=pesado
      const grandeIdx         = Math.floor((lvl - 150) / 30);
      const grandeTempoReduz  = grandeIdx % 2 === 1;
      const grandePesado      = grandeIdx >= 2 && grandeIdx % 2 === 0;
      const _tBase            = lvl > 200 ? TEMPO_BASE_200 : TEMPO_BASE_129;
      const grandeTime        = grandeTempoReduz
        ? Math.max(20, _tBase - 10)   // 55s / 35s após 200
        : Math.min(120, _tBase + 5);  // 70s / 50s após 200
      return { type:'mix_as', pairs:18, cols:6, secs: grandeTime, minMul, minDiv,
        pesado: grandePesado, ehChefao:true, tipoChefao:'grande' };
    }
  } else {
    // Pós-chefão: 131 respiro (65s), 132-139 pressão do rápido (45s), demais 65s / 45s após 200
    const secs   = (lvl >= 132 && lvl <= 139) ? Math.max(20, TEMPO_BASE_129 - 20) : (lvl > 200 ? TEMPO_BASE_200 : TEMPO_BASE_129);
    const minMul = Math.min(4 + n, 6);
    const minDiv = Math.min(4 + n, 6);
    // 12p×2=24 ÷ 6cols = 4 linhas (desktop 6×4)
    return { type:'mix_as', pairs:12, cols:6, secs, minMul, minDiv };
  }
}

// ── Helpers ───────────────────────────────────────────────────
function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function escH(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Op generator ──────────────────────────────────────────────
function tryGenOp(type, usedR, maxResult = 999, pesado = false) {
  let a, b, result, sym, label = null;
  for (let t = 0; t < 60; t++) {
    label = null;
    if (type === 'add') {
      if (maxResult < 50) {
        // Resultados limitados por maxResult (níveis 1-50)
        a = rnd(1, Math.min(maxResult - 1, 12));
        b = rnd(1, Math.min(12, maxResult - a));
        result = a + b;
        if (result > maxResult || usedR.has(result)) continue;
      } else {
        a = rnd(1, 9); b = rnd(1, 10 - a);
        result = a + b;
        if (result > 20 || usedR.has(result)) continue;
      }
      sym = '+';
    } else if (type === 'sub') {
      if (maxResult < 50) {
        // minuendo próximo ao resultado para evitar contas complexas nos primeiros níveis
        a = rnd(2, Math.min(maxResult + 1, 10));
        b = rnd(1, Math.min(a - 1, 9));
        result = a - b;
        if (result < 1 || result > maxResult || usedR.has(result)) continue;
      } else {
        a = rnd(4, 18); b = rnd(1, a - 1);
        result = a - b;
        if (result < 1 || usedR.has(result)) continue;
      }
      sym = '−';
    } else if (type === 'mul') {
      if (pesado) { a = rnd(4, 10); b = rnd(4, 10); }
      else        { a = rnd(2, 9);  b = rnd(2, 9); }
      result = a * b;
      if (result > (pesado ? 100 : 81) || usedR.has(result)) continue;
      sym = '×';
    } else if (type === 'div') {
      if (pesado) { b = rnd(4, 10); result = rnd(4, 12); }
      else        { b = rnd(2, 9);  result = rnd(2, 11); }
      if (usedR.has(result)) continue;
      a = b * result;
      sym = '÷';
    } else if (type === 'mix_as') {
      return tryGenOp(rnd(0, 1) === 0 ? 'add' : 'sub', usedR, maxResult, pesado);
    } else if (type === 'mix_asm_lite') {
      const r = rnd(0, 4);
      return tryGenOp(r <= 1 ? 'add' : r <= 3 ? 'sub' : 'mul', usedR, maxResult, pesado);
    } else if (type === 'mix_asm') {
      return tryGenOp(['add','sub','mul'][rnd(0, 2)], usedR, maxResult, pesado);
    } else if (type === 'mix') {
      const types = ['add','sub','mul','div'];
      return tryGenOp(types[rnd(0, 3)], usedR, maxResult, pesado);
    } else {
      return null;
    }
    usedR.add(result);
    return { op: { sym, a, b, label }, result };
  }
  return null;
}

function generatePairs(type, count, maxResult = 999, minMul = 0, minDiv = 0, pesado = false) {
  const pairs = [];
  const usedR = new Set();
  for (let i = 0; i < minMul && pairs.length < count; i++) {
    const p = tryGenOp('mul', usedR, maxResult, pesado);
    if (p) pairs.push(p);
  }
  for (let i = 0; i < minDiv && pairs.length < count; i++) {
    const p = tryGenOp('div', usedR, maxResult, pesado);
    if (p) pairs.push(p);
  }
  for (let attempt = 0; attempt < 600 && pairs.length < count; attempt++) {
    const p = tryGenOp(type, usedR, maxResult, pesado) || tryGenOp('add', usedR, maxResult, pesado);
    if (p) pairs.push(p);
  }
  return pairs;
}

// ── Render op HTML ────────────────────────────────────────────
function opCardHtml(op) {
  if (op.label) {
    return `<div class="op-compound">${escH(op.label)}</div>`;
  }
  const traco = op.sym === '÷' ? '<div class="traco"></div>' : '';
  return `<div class="op-wrap"><span class="operador">${op.sym}</span><div class="fracao"><span class="num-cima">${op.a}</span>${traco}<span class="num-baixo">${op.b}</span></div></div>`;
}

// ── Card flight animation ─────────────────────────────────────
function launchCard(el, card) {
  const gridRect = el.getBoundingClientRect();
  const slotId   = card.kind === 'op' ? 'slot-op' : 'slot-res';

  el.style.visibility = 'hidden';
  el.style.pointerEvents = 'none';

  const clone = document.createElement('div');
  clone.className = 'game-card selected fly-clone';
  clone.innerHTML = el.innerHTML;
  Object.assign(clone.style, {
    position: 'fixed',
    left: gridRect.left + 'px',
    top: gridRect.top + 'px',
    width: gridRect.width + 'px',
    height: gridRect.height + 'px',
    minHeight: '0',
    zIndex: '100',
    pointerEvents: 'none',
    margin: '0',
    boxSizing: 'border-box',
  });
  document.body.appendChild(clone);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    // Relê a posição do slot dentro do rAF para garantir que seja atual
    const slot     = document.getElementById(slotId);
    if (!slot) return;
    const slotRect = slot.getBoundingClientRect();
    clone.style.transition = 'left .28s ease, top .28s ease, width .28s ease, height .28s ease';
    clone.style.left   = slotRect.left   + 'px';
    clone.style.top    = slotRect.top    + 'px';
    clone.style.width  = slotRect.width  + 'px';
    clone.style.height = slotRect.height + 'px';
  }));
  return { clone, origRect: { left: gridRect.left, top: gridRect.top, width: gridRect.width, height: gridRect.height } };
}

function flyBack(info, el) {
  const { clone } = info;
  // Relê a posição atual do elemento (corrige deslocamento por scroll)
  const rect = el.getBoundingClientRect();
  clone.style.transition = 'left .28s ease, top .28s ease, width .28s ease, height .28s ease';
  clone.style.left   = rect.left   + 'px';
  clone.style.top    = rect.top    + 'px';
  clone.style.width  = rect.width  + 'px';
  clone.style.height = rect.height + 'px';
  setTimeout(() => {
    clone.remove();
    el.style.visibility = '';
    el.style.pointerEvents = '';
    el.classList.add('error');
    setTimeout(() => el.classList.remove('error'), 400);
  }, 280);
}

// ── Layout adaptativo: colunas e altura dos cards ─────────────
function calcGameLayout(cardCount) {
  const vw    = window.innerWidth;
  const GAP   = 5;
  const MIN_W = 40;
  const contW = Math.min(vw - 32, 630);

  // Escolher número de colunas que cria grid mais próximo de quadrado
  let bestC = 4, bestScore = Infinity;
  for (let c = 2; c <= 10; c++) {
    const cW = (contW - (c - 1) * GAP) / c;
    if (cW < MIN_W) continue;
    const rows = Math.ceil(cardCount / c);
    const score = Math.abs(c / rows - 1.3); // grid ligeiramente mais largo que alto
    if (score < bestScore) { bestScore = score; bestC = c; }
  }

  // Estimar altura dos cards para detectar modo compacto
  const topbarH = document.querySelector('.topbar')?.getBoundingClientRect().height || 62;
  const OVERHEAD = 265; // topbar + header-nivel + líderes + timer + barra + dots + status + combo + slots
  const gridH = Math.max(60, window.innerHeight - topbarH - OVERHEAD);
  const rows  = Math.ceil(cardCount / bestC);
  const estCardH = (gridH - (rows - 1) * GAP) / rows;
  return { cols: bestC, compact: estCardH < 52 };
}

// ── Audio (Web Audio API) ─────────────────────────────────────
let _audioCtx = null;
function _getCtx() {
  if (!_audioCtx) {
    try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return _audioCtx;
}
function _beep(freq, dur, type = 'sine', vol = 0.22, delay = 0) {
  const ctx = _getCtx(); if (!ctx) return;
  try {
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t); osc.stop(t + dur + .01);
  } catch(e) {}
}
function resumeAudio() { const ctx = _getCtx(); if (ctx?.state === 'suspended') ctx.resume(); }
function somAcerto()   { _beep(660, .1,'sine',.2); _beep(880,.13,'sine',.2,.1); }
function somErro()     { _beep(180,.2,'sawtooth',.12); }
function somVitoria()  { [523,659,784,1047].forEach((f,i) => _beep(f,.18,'sine',.28,i*.11)); }

  el.textContent = `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  el.className   = `sprint-timer${_sprintLeft <= 30 ? ' danger' : _sprintLeft <= 60 ? ' warn' : ''}`;
  const lvs = document.getElementById('sprint-lvs');
  const ok  = document.getElementById('sprint-ok');
  const err = document.getElementById('sprint-err');
  if (lvs) lvs.textContent = _sprintLevels;
  if (ok)  ok.textContent  = _sprintPairsOk;
  if (err) err.textContent = _sprintErrTotal;
}

async function salvarSprintRanking(acertos) {
  if (!sprintRankRef) return;
  try {
    const snap = await get(sprintRankRef);
    const atual = snap.exists() ? (snap.val().melhor_acertos || 0) : 0;
    if (acertos > atual) {
      await set(sprintRankRef, { nome: nomeAluno, turma, melhor_acertos: acertos, ultima_sprint: Date.now() });
    }
  } catch(e) { console.warn('[Sprint] Erro ao salvar ranking:', e); }
}

async function endSprint(manual = false) {
  if (_sprintEnded) return;
  _sprintEnded = true;
  gameOver = true;
  stopTimer();
  if (_sprintInt) { clearInterval(_sprintInt); _sprintInt = null; }
  if (!manual) somDerrota(); else somVitoria();
  if (_sprintPairsOk > 0) salvarSprintRanking(_sprintPairsOk);
  _registrarSessao(nivelAtual, manual ? 'completou' : 'tempo_esgotado', _sprintPairsOk, _sprintErrTotal);
  const total = _sprintPairsOk + _sprintErrTotal;
  const acc   = total > 0 ? Math.round(_sprintPairsOk / total * 100) : 100;
  document.getElementById("lov-emoji").textContent = _sprintLevels >= 5 ? '🏆' : _sprintLevels >= 2 ? '⭐' : '🎮';
  document.getElementById("lov-title").textContent = manual ? 'Sprint encerrado!' : '⏰ Tempo esgotado!';
  document.getElementById("lov-sub").textContent   =
    `${_sprintLevels} nível${_sprintLevels !== 1 ? 'is' : ''} concluído${_sprintLevels !== 1 ? 's' : ''} · ${_sprintPairsOk} acertos · ${acc}% precisão`;
  document.getElementById("lov-new").textContent   =
    _sprintPairsOk > 0 ? `${_sprintPairsOk} acerto${_sprintPairsOk !== 1 ? 's' : ''} em ${_sprintLevels} rodada${_sprintLevels !== 1 ? 's' : ''}` : 'Nenhum acerto';
  document.getElementById("lov-new").style.color   = 'var(--blue)';
  document.getElementById("lov-btn").textContent   = 'Voltar →';
  document.querySelector('.level-card').style.animation = manual ? 'levelUpPop .35s' : 'levelDownPop .35s ease';
  document.getElementById("level-overlay").style.display = 'flex';
}

// ── Build game ────────────────────────────────────────────────
const _shownBossModals = new Set(); // evita re-exibir modal no mesmo nível

function buildGame(skipBossModal = false) {
  if (!skipBossModal && isChefao(nivelAtual) && !_isSprint && !_isReplay) {
    if (!_shownBossModals.has(nivelAtual)) {
      _shownBossModals.add(nivelAtual);
      mostrarModalChefao(nivelAtual, () => _buildGameInternal());
      return;
    }
  }
  _buildGameInternal();
}

function _buildGameInternal() {
  stopTimer();
  _atualizarPresenca();
  // Limpa clones de voo e confetes de partidas anteriores
  document.querySelectorAll('.fly-clone, .confete-wrap').forEach(c => c.remove());
  const cfg = getLevelConfig(nivelAtual);
  ehChefaoAtual   = !!cfg.ehChefao;
  tipoChefaoAtual = cfg.tipoChefao || null;
  timerTotal = cfg.secs;
  timerLeft  = cfg.secs;
  _timerOvertime = 0;
  selectedCard = null;
  removedCount = 0;
  gameOver    = false;
  acertos = 0; erros = 0; comboCount = 0;
  tipoAcertos = { add:0, sub:0, mul:0, div:0 };
  tipoErros   = { add:0, sub:0, mul:0, div:0 };
  _animating  = false;

  // ── 1. Colunas — desktop: cfg.cols (geralmente 6), mobile (≤768px): 4
  const _topbarH = document.querySelector('.topbar')?.getBoundingClientRect().height || 62;
  const _isMobile  = window.innerWidth <= 768;
  const _desktopCols = cfg.cols || 6; // máx desktop para este nível
  // Níveis pequenos (cols 2/3) mantêm seu layout; demais: mobile força 4
  const cols = _isMobile ? Math.min(4, _desktopCols) : _desktopCols;

  // ── 2. Pares: Grande desktop=18p, todos os outros=máx 12p
  // (24 cards normal/rápido/difícil | 36 cards grande desktop | 24 cards grande mobile)
  const _targetPairs = (tipoChefaoAtual === 'grande' && !_isMobile)
    ? cfg.pairs           // 18 pares no desktop grande
    : Math.min(cfg.pairs, 12); // máx 12 para todos os demais
  const pairs = generatePairs(cfg.type, _targetPairs, cfg.maxResult, cfg.minMul || 0, cfg.minDiv || 0, cfg.pesado || false);
  if (pairs.length < _targetPairs) {
    const usedResults = new Set(pairs.map(p => p.result));
    for (let i = pairs.length; i < _targetPairs; i++) {
      const extra = tryGenOp('add', usedResults, cfg.maxResult, cfg.pesado || false);
      if (extra) pairs.push(extra); else break;
    }
  }
  if (pairs.length > _targetPairs) pairs.splice(_targetPairs);

  // ── 3. Garantir grid sem buracos: (pares × 2) % cols === 0 SEMPRE
  const _gridFactor = cols % 2 === 0 ? cols / 2 : cols;
  const _validPares = Math.max(_gridFactor, Math.floor(pairs.length / _gridFactor) * _gridFactor);
  if (pairs.length > _validPares) pairs.splice(_validPares);
  console.log(`[Tabuada] Nv${nivelAtual} (${ehChefaoAtual ? tipoChefaoAtual||'chefao' : 'normal'}) ${_isMobile?'mobile':'desktop'}: ${pairs.length}p × 2 = ${pairs.length*2} cards ÷ ${cols} cols = ${pairs.length*2/cols} linhas`);

  // ── 4. Build cards (pares e cols já garantidamente válidos)
  const cards = [];
  pairs.forEach((pair, i) => {
    cards.push({ kind:'op',     pairId:i, op:pair.op, result:pair.result });
    cards.push({ kind:'result', pairId:i, op:pair.op, result:pair.result });
  });
  shuffle(cards);

  updateNivelDisplay();
  totalPairs = pairs.length;

  // isCompact: linhas exatas (sem Math.ceil pois divisibilidade está garantida)
  const _gridRows  = pairs.length * 2 / cols;
  const _gridH     = Math.max(60, window.innerHeight - _topbarH - 200);
  const isCompact  = _gridRows > 0 ? ((_gridH - (_gridRows - 1) * 5) / _gridRows) < 52 : false;

  // Pairs dots
  const dotsHtml = Array.from({length: pairs.length}, (_,i) =>
    `<div class="pair-dot" id="dot-${i}"></div>`).join('');

  // Pré-computa badge e grid class baseados no tipo de chefão
  const _tc = tipoChefaoAtual;
  const _nivelBadgeHtml = _isSprint
    ? `<div class="nivel-badge">⚡ Sprint</div>`
    : ehChefaoAtual
    ? (()=>{
        const xCls = _tc === 'dificil' ? ' chefao-dificil' : _tc === 'grande' ? ' chefao-grande' : '';
        const icon = _tc === 'rapido' ? '⚡' : _tc === 'dificil' ? '🧮' : _tc === 'grande' ? '📦' : '👹';
        const nome = _tc === 'rapido' ? 'CHEFÃO RÁPIDO' : _tc === 'dificil' ? 'CHEFÃO DIFÍCIL' : _tc === 'grande' ? 'CHEFÃO GRANDE' : 'CHEFÃO';
        return `<div class="nivel-badge chefao${xCls}">${icon} ${nome} · Nível ${nivelAtual}</div>`;
      })()
    : `<div class="nivel-badge"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>Nível ${nivelAtual}</div>`;
  const _gridClass = `game-grid${ehChefaoAtual ? (_tc === 'dificil' ? ' chefao-dificil-grid' : _tc === 'grande' ? ' chefao-grande-grid' : ' chefao-grid') : ''}`;

  // Mostrar botão Reiniciar no header
  const _hdrRein = document.getElementById('btn-reiniciar-hdr');
  if (_hdrRein) _hdrRein.style.display = 'inline-flex';

  const content = document.getElementById("content");
  content.innerHTML = `
<div class="tb-wrap">

  <!-- L1: badge de nível + combo seguidos -->
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px">
    <div style="display:flex;align-items:center;gap:10px">
      ${_nivelBadgeHtml}
      <span id="combo-seguidos" class="combo-seguidos baixo" style="display:none"></span>
    </div>
    ${_isSprint ? `<div style="font-size:12px;color:var(--text-muted)">⚡ <strong style="color:var(--blue)">${_sprintPairsOk}</strong> acerto${_sprintPairsOk !== 1 ? 's' : ''}</div>` : ''}
  </div>

  <!-- L2: líderes + timer (normal) · sprint-bar (sprint) -->
  <div>
    ${_isSprint ? `
    <div class="sprint-bar">
      <div>
        <div class="sprint-timer" id="sprint-timer">03:00</div>
        <div class="sprint-label">Sprint</div>
      </div>
      <div class="sprint-stats">
        <div class="sprint-stat"><div class="sprint-stat-val" id="sprint-lvs">${_sprintLevels}</div><div class="sprint-stat-lbl">Concluídos</div></div>
        <div class="sprint-stat"><div class="sprint-stat-val" id="sprint-ok">${_sprintPairsOk}</div><div class="sprint-stat-lbl">Acertos</div></div>
        <div class="sprint-stat"><div class="sprint-stat-val" id="sprint-err">${_sprintErrTotal}</div><div class="sprint-stat-lbl">Erros</div></div>
      </div>
    </div>` : `
    <div id="leaders-ingame" style="margin-bottom:4px;line-height:1.5">${_buildLeadersHtml()}</div>
    <div class="timer-wrap" id="timer-display">
      <svg viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61 1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
      <span id="timer-text">${String(Math.floor(timerTotal/60)).padStart(2,'0')}:${String(timerTotal%60).padStart(2,'0')}</span>
    </div>
    <div class="timer-bar-bg">
      <div class="timer-bar" id="timer-bar" style="width:100%"></div>
    </div>`}
  </div>

  <!-- L3: pontos de pares + status + combo badge -->
  <div>
    <div class="pairs-bar-bg" id="pairs-dots">${dotsHtml}</div>
    <div class="status-msg" id="status-msg"></div>
    <div id="combo-badge" style="text-align:center;min-height:20px;margin-top:-2px"></div>
  </div>

  <!-- L4 (1fr): grid de cards — nunca extrapola -->
  <div class="${_gridClass}" id="game-grid"
       style="grid-template-columns:repeat(${cols},1fr)"></div>

  <!-- L5 (auto): slots — sempre visíveis, garantidos pelo CSS Grid -->
  <div class="slots-wrap">
    <div class="slot" id="slot-op"><span class="slot-ph">operação</span></div>
    <span class="slot-eq">=</span>
    <div class="slot" id="slot-res"><span class="slot-ph">resultado</span></div>
  </div>

  ${_isSprint ? `<div class="game-controls" style="text-align:center;padding:4px 0"><button class="btn btn-ghost" onclick="endSprint(true)" style="color:var(--red);border-color:rgba(226,75,74,.3)">⚡ Encerrar Sprint</button></div>` : ''}
</div>`;

  // Populate grid
  const grid = document.getElementById("game-grid");
  cards.forEach((card, idx) => {
    const el = document.createElement("div");
    el.className = `game-card type-${card.kind}${isCompact ? ' compact' : ''}`;
    el.dataset.pairId = card.pairId;
    el.dataset.kind   = card.kind;
    el.style.cssText  = `animation:fadeInUp .28s ease both;animation-delay:${(idx * 0.025).toFixed(2)}s`;
    el.innerHTML      = card.kind === 'op'
      ? opCardHtml(card.op)
      : `<div class="res-number">${card.result}</div>`;
    el.addEventListener("click", () => onCardClick(el, card));
    grid.appendChild(el);
  });

  // Clicar no slot devolve a carta ao lugar de origem
  document.getElementById('slot-op')?.addEventListener('click',  deselectCard);
  document.getElementById('slot-res')?.addEventListener('click', deselectCard);

  // ── Orientation change: reflow de colunas ao girar a tela ──────
  if (_orientHandler) { window.removeEventListener('resize', _orientHandler); }
  { // IIFE para capturar _desktopCols no closure sem vazar variável
    const _dc = _desktopCols;
    let _cc   = cols;
    _orientHandler = () => {
      clearTimeout(_orientDebounce);
      _orientDebounce = setTimeout(() => {
        if (gameOver) return;
        const nowMobile = window.innerWidth <= 768;
        const newCols   = nowMobile ? Math.min(4, _dc) : _dc;
        if (newCols === _cc) return;
        _cc = newCols;
        const g = document.getElementById('game-grid');
        if (g) g.style.gridTemplateColumns = `repeat(${newCols}, 1fr)`;
      }, 200);
    };
    window.addEventListener('resize', _orientHandler);
  }

  if (_isSprint) {
    if (!_sprintStarted) {
      _sprintNivelIni = nivelAtual;
      _sprintStarted = true;
      startSprintTimer();
    } else {
      updateSprintDisplay();
    }
  } else {
    startTimer();
  }
}

// ── Timer ─────────────────────────────────────────────────────
function startTimer() {
  updateTimerUI();
  timerInterval = setInterval(() => {
    if (gameOver) return;
    if (timerLeft > 0) {
      timerLeft--;
      updateTimerUI();
      if (timerLeft === 0 && !(_isProfMode || _isModoTesteAtivo)) {
        clearInterval(timerInterval); timerInterval = null; onTimerEnd();
      }
    } else if (_isProfMode || _isModoTesteAtivo) {
      _timerOvertime++;
      updateTimerUI();
    }
  }, 1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function updateTimerUI() {
  const isOvertime = timerLeft === 0 && _timerOvertime > 0;
  const pct  = isOvertime ? 0 : (timerTotal > 0 ? timerLeft / timerTotal : 0);
  const secs = isOvertime ? _timerOvertime : timerLeft;
  const min  = Math.floor(secs / 60);
  const sec  = secs % 60;
  const txt  = document.getElementById("timer-text");
  const wrap = document.getElementById("timer-display");
  const bar  = document.getElementById("timer-bar");
  if (!txt) return;
  txt.textContent = isOvertime
    ? `-${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
    : `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  const _timerTypeCls = isOvertime ? ' warn'
    : ehChefaoAtual
    ? (tipoChefaoAtual === 'dificil' ? ' chefao-dificil' : tipoChefaoAtual === 'grande' ? ' chefao-grande' : ' chefao')
    : (timerLeft <= 10 ? ' warn' : '');
  const _barTypeCls = isOvertime ? ' danger'
    : ehChefaoAtual
    ? (tipoChefaoAtual === 'dificil' ? ' chefao-dificil' : tipoChefaoAtual === 'grande' ? ' chefao-grande' : ' chefao')
    : (pct < .2 ? ' danger' : pct < .4 ? ' warn' : '');
  if (wrap) wrap.className = `timer-wrap${_timerTypeCls}`;
  if (bar) {
    bar.style.width = `${pct * 100}%`;
    bar.className   = `timer-bar${_barTypeCls}`;
  }
}

// ── Card click ────────────────────────────────────────────────
function setStatus(msg, color) {
  const el = document.getElementById("status-msg");
  if (!el) return;
  el.textContent = msg;
  el.style.color = color || 'var(--text-muted)';
}

function clearSlots() {
  document.getElementById("slot-op")?.classList.remove("filled");
  document.getElementById("slot-res")?.classList.remove("filled");
}

function fillSlot(card) {
  const slot = document.getElementById(card.kind === 'op' ? 'slot-op' : 'slot-res');
  slot?.classList.add("filled");
}

function deselectCard() {
  if (!selectedCard) return;
  const { clone, origRect } = selectedCard.flyInfo;
  const el = selectedCard.el;
  clone.style.transition = 'left .28s ease, top .28s ease, width .28s ease, height .28s ease';
  clone.style.left   = origRect.left   + 'px';
  clone.style.top    = origRect.top    + 'px';
  clone.style.width  = origRect.width  + 'px';
  clone.style.height = origRect.height + 'px';
  setTimeout(() => {
    clone.remove();
    el.style.visibility = '';
    el.style.pointerEvents = '';
  }, 280);
  selectedCard = null;
  clearSlots();
  setStatus("");
}

function onCardClick(el, card) {
  if (gameOver) return;
  if (_animating) return;
  if (el.style.visibility === 'hidden') return;
  resumeAudio();

  // Toggle: clicar no mesmo card deseleciona
  if (selectedCard && selectedCard.el === el) {
    deselectCard();
    return;
  }

  // Primeiro clique
  if (!selectedCard) {
    const flyInfo = launchCard(el, card);
    selectedCard = { el, pairId: card.pairId, kind: card.kind, op: card.op, result: card.result, flyInfo };
    fillSlot(card);
    setStatus("Selecione o par →", 'var(--blue-dark)');
    return;
  }

  // Segundo clique: verificar par
  const first = selectedCard;
  const flyInfo2 = launchCard(el, card);
  fillSlot(card);

  if (first.pairId === card.pairId && first.kind !== card.kind) {
    // ✅ Correto
    [first.flyInfo.clone, flyInfo2.clone].forEach(c => c.classList.add('matched-flash'));

    const dot = document.getElementById(`dot-${card.pairId}`);
    if (dot) dot.classList.add('done');

    setTimeout(() => {
      [first.flyInfo.clone, flyInfo2.clone].forEach(c => {
        c.style.transition = 'opacity .28s, transform .28s';
        c.style.opacity = '0';
        c.style.transform = 'scale(0.5)';
        setTimeout(() => c.remove(), 300);
      });
    }, 200);

    acertos++;
    comboCount++;
    comboSessao = Math.max(comboSessao, comboCount);
    if (comboCount > _maiorComboSalvo && comboCount >= 3) {
      _maiorComboSalvo = comboCount;
      flashRecorde();
    }
    somAcerto();
    showComboPopup(el);
    updateComboDisplay();
    if (_isSprint) { _sprintPairsOk++; updateSprintDisplay(); }
    const tipo = symToTipo((first.kind === 'op' ? first.op : card.op)?.sym);
    if (tipo) tipoAcertos[tipo]++;
    selectedCard = null;
    removedCount++;
    setTimeout(() => { clearSlots(); setStatus(""); }, 650);
    if (removedCount >= totalPairs) setTimeout(onGameWin, 500);

  } else {
    // ❌ Errado
    erros++;
    const _tipoErr = symToTipo((first.kind === 'op' ? first.op : card.op)?.sym);
    if (_tipoErr) tipoErros[_tipoErr]++;
    if (comboCount >= 5) setStatus(`💔 Sequência de ${comboCount} quebrada! ❌`, 'var(--orange)');
    else setStatus("Errou! Tente outra combinação. ❌", 'var(--red)');
    comboCount = 0;
    updateComboDisplay();
    somErro();
    const _badge = document.getElementById('combo-badge');
    if (_badge) _badge.innerHTML = '';
    if (_isSprint) { _sprintErrTotal++; updateSprintDisplay(); }
    selectedCard = null;
    _animating = true;  // bloqueia novos clicks enquanto clones voltam
    flyBack(first.flyInfo, first.el);
    flyBack(flyInfo2, el);
    setTimeout(() => {
      _animating = false;
      clearSlots();
      setTimeout(() => setStatus(""), 800);
    }, 600);
  }
}

// ── Win ───────────────────────────────────────────────────────
async function onGameWin() {
  gameOver = true;
  stopTimer();

  const nivelJogado = nivelAtual;
  const _segsWin = _isSprint ? null : (_timerOvertime > 0 ? -_timerOvertime : timerLeft);
  const _overtimeStr = _timerOvertime > 0 ? ` · ⏱ +${_timerOvertime}s acima do limite` : '';
  somVitoria();

  if (_isSprint) {
    _sprintLevels++;
    nivelAtual++;  // avança dificuldade local apenas — não salva no Firebase
    progresso.total_partidas = (progresso.total_partidas || 0) + 1;
    await salvarProgresso(progresso, 'completou', nivelJogado, acertos, erros, true);
    document.getElementById("lov-emoji").textContent = erros === 0 ? '⭐' : '✅';
    document.getElementById("lov-title").textContent = `+${acertos} acerto${acertos !== 1 ? 's' : ''}!`;
    document.getElementById("lov-sub").textContent   = `Total: ${_sprintPairsOk} · próxima rodada em 1s…`;
    document.getElementById("lov-new").textContent   = '';
    document.getElementById("lov-new").style.color   = 'var(--blue)';
    document.getElementById("lov-btn").textContent   = 'Avançar →';
    document.querySelector('.level-card').style.animation = 'levelUpPop .35s';
    document.getElementById("level-overlay").style.display = 'flex';
    _sprintWinTimeout = setTimeout(() => {
      _sprintWinTimeout = null;
      if (_sprintEnded) return;
      document.getElementById("level-overlay").style.display = 'none';
      buildGame();
    }, 1500);
    return;
  }

  if (_isReplay) {
    progresso.total_partidas = (progresso.total_partidas || 0) + 1;
    await salvarProgresso(progresso, 'completou', nivelJogado, acertos, erros, true, _segsWin);
    _registrarSessao(nivelJogado, 'completou');
    nivelAtual = nivelJogado + 1; // avança nível local da sessão de prática
    document.getElementById("lov-emoji").textContent = erros === 0 ? '⭐' : '✅';
    document.getElementById("lov-title").textContent = erros === 0 ? 'Perfeito!' : 'Nível concluído!';
    document.getElementById("lov-sub").textContent   = `Nível ${nivelJogado} · ${acertos} acerto${acertos !== 1 ? 's' : ''}${erros > 0 ? ` · ${erros} erro${erros > 1 ? 's' : ''}` : ''}${_overtimeStr}`;
    document.getElementById("lov-new").textContent   = `→ Nível ${nivelAtual} (prática)`;
    document.getElementById("lov-new").style.color   = 'var(--blue)';
    document.getElementById("lov-btn").textContent   = 'Continuar →';
    document.querySelector('.level-card').style.animation = 'levelUpPop .45s';
    document.getElementById("level-overlay").style.display = 'flex';
    return;
  }

  const eraLider    = rankingAll[0]?.nome === nomeAluno && rankingAll[0]?.turma === turma;
  const melhorAnterior = melhorNivel;
  const novoNivel  = nivelAtual + 1;
  const novoMelhor = Math.max(melhorNivel, novoNivel);

  progresso.nivel_atual    = novoNivel;
  progresso.melhor_nivel   = novoMelhor;
  progresso.total_partidas = (progresso.total_partidas || 0) + 1;

  nivelAtual  = novoNivel;
  melhorNivel = novoMelhor;

  await salvarProgresso(progresso, 'completou', nivelJogado, acertos, erros, false, _segsWin);
  _registrarSessao(nivelJogado, 'completou');

  const isNewRecord = novoNivel > melhorAnterior;

  // Mostra overlay imediatamente com informações já conhecidas
  const isEstrela = erros === 0;
  const foiChefao = isChefao(nivelJogado);
  const _tcWin    = foiChefao ? tipoChefaoAtual : null;
  const _bIco     = _tcWin === 'rapido' ? '⚡' : _tcWin === 'dificil' ? '🧮' : _tcWin === 'grande' ? '📦' : '👹';
  const _bNome    = _tcWin === 'rapido' ? 'Chefão Rápido' : _tcWin === 'dificil' ? 'Chefão Difícil' : _tcWin === 'grande' ? 'Chefão Grande' : 'Chefão';
  const _bCor     = _tcWin === 'dificil' ? '#A78BFA' : _tcWin === 'grande' ? '#60A5FA' : '#EF4444';
  if (foiChefao) { lancarConfeteChefao(120); }
  else if (isEstrela) lancarConfete(50);
  document.getElementById("lov-emoji").textContent = foiChefao ? _bIco : (isEstrela ? '⭐' : '🎉');
  document.getElementById("lov-title").textContent = foiChefao
    ? `${_bIco} ${_bNome} derrotado!`
    : (isEstrela ? '⭐ Nível com estrela!' : 'Avançou de nível!');
  document.getElementById("lov-sub").textContent   = foiChefao
    ? `Nível ${nivelJogado} conquistado! ${isEstrela ? '⭐ Sem erros!' : ''} ${isNewRecord ? '🌟 Novo recorde pessoal!' : 'Continue avançando!'}${_overtimeStr}`
    : (isEstrela
      ? `Perfeito! Sem erros! ${isNewRecord ? '🌟 Novo recorde pessoal!' : 'Continue assim!'}${_overtimeStr}`
      : `${erros} erro${erros !== 1 ? 's' : ''} — sem estrela desta vez. ${isNewRecord ? '🌟 Novo recorde!' : 'Continue avançando!'}${_overtimeStr}`);
  document.getElementById("lov-new").textContent   = `→ Nível ${novoNivel}`;
  document.getElementById("lov-new").style.color   = foiChefao ? _bCor : (isEstrela ? 'var(--gold)' : 'var(--blue)');
  document.getElementById("lov-btn").textContent   = 'Continuar →';
  document.querySelector('.level-card').style.animation = 'levelUpPop .45s';
  document.getElementById("level-overlay").style.display = 'flex';

  // Atualiza ranking em background — se virou líder, atualiza overlay
  reloadRanking().then(() => {
    const eLider = rankingAll[0]?.nome === nomeAluno && rankingAll[0]?.turma === turma;
    if (eLider && !eraLider) {
      if (!isEstrela) lancarConfete(80);
      document.getElementById("lov-emoji").textContent = '🏆';
      document.getElementById("lov-title").textContent = '🥇 Você é o novo líder!';
      document.getElementById("lov-sub").textContent   =
        `${isEstrela ? '⭐ Com estrela! ' : ''}Primeiro lugar no ranking geral!`;
    }
  });
}

// ── Timer end ─────────────────────────────────────────────────
async function onTimerEnd() {
  gameOver   = true;
  _animating = false;  // cancela qualquer lock de erro pendente
  somDerrota();

  const nivelJogado = nivelAtual;

  progresso.total_partidas = (progresso.total_partidas || 0) + 1;
  const isReplayDerrota = _isReplay;
  await salvarProgresso(progresso, 'tempo_esgotado', nivelJogado, acertos, erros, isReplayDerrota || false);
  _registrarSessao(nivelJogado, 'tempo_esgotado');
  if (!isReplayDerrota) reloadRanking();

  const foiChefao = isChefao(nivelJogado);
  const _tcLose   = foiChefao ? tipoChefaoAtual : null;
  const _bIcoL    = _tcLose === 'rapido' ? '⚡' : _tcLose === 'dificil' ? '🧮' : _tcLose === 'grande' ? '📦' : '👹';
  const _bNomeL   = _tcLose === 'rapido' ? 'Chefão Rápido' : _tcLose === 'dificil' ? 'Chefão Difícil' : _tcLose === 'grande' ? 'Chefão Grande' : 'Chefão';
  const _bCorL    = _tcLose === 'dificil' ? '#A78BFA' : _tcLose === 'grande' ? '#60A5FA' : '#EF4444';
  const frases = foiChefao
    ? [`${_bIcoL} O ${_bNomeL} venceu dessa vez... Tente novamente!`,
       `${_bIcoL} Quase! O ${_bNomeL} ainda está de pé — revanche! ⚔️`,
       `${_bIcoL} Não desista! Você vai derrotá-lo! 💪`]
    : [`Você acertou ${acertos} par${acertos !== 1 ? 'es' : ''}. Tente de novo! 💪`,
       'Quase lá! Mais uma tentativa 🚀',
       'Na próxima você passa! 🎯',
       'Continue tentando, você consegue! ⭐',
       'Não desista — o tempo vai sobrar! ⏱️'];
  const frase = frases[Math.floor(Math.random() * frases.length)];
  const nivelExibir = isReplayDerrota ? _nivelReal : nivelAtual;

  document.getElementById("lov-emoji").textContent = foiChefao ? _bIcoL : '⏰';
  document.getElementById("lov-title").textContent = foiChefao ? `${_bIcoL} O ${_bNomeL} resistiu!` : 'Tempo esgotado!';
  document.getElementById("lov-sub").textContent   = frase;
  document.getElementById("lov-new").textContent   = foiChefao
    ? `${_bNomeL} · Nível ${nivelExibir} — revanche!`
    : `Nível ${nivelExibir} — tente de novo`;
  document.getElementById("lov-new").style.color   = foiChefao ? _bCorL : 'var(--orange)';
  document.getElementById("lov-btn").textContent   = foiChefao ? '⚔️ Revanche! →' : 'Tentar de novo →';
  document.querySelector('.level-card').style.animation = 'levelDownPop .35s ease';
  document.getElementById("level-overlay").style.display = 'flex';
}

// ── Public functions ──────────────────────────────────────────
window.endSprint = (manual) => endSprint(manual);

window.toggleAvatarMenu = function() {
  document.getElementById('avatar-menu').classList.toggle('open');
};
document.addEventListener('click', function(e) {
  if (!e.target.closest('.avatar-wrap')) {
    document.getElementById('avatar-menu')?.classList.remove('open');
  }
});

window.fecharOverlay = function() {
  if (_isSprint && _sprintEnded) {
    window.location.href = _isProfMode ? '/professor/jogos.html' : '/aluno/jogos.html';
    return;
  }
  if (_sprintWinTimeout) { clearTimeout(_sprintWinTimeout); _sprintWinTimeout = null; }
  document.getElementById("level-overlay").style.display = 'none';
  buildGame();
};

window.reiniciarNivel = function() {
  if (_sprintEnded) return;
  stopTimer();
  buildGame(true); // skipBossModal: já está no nível, não repetir o modal
};


// ── Modo professor ────────────────────────────────────────────
if (_isProfMode) {
  document.getElementById('prof-banner').style.display = 'flex';
  document.getElementById('menu-config')?.style.setProperty('display', 'none');
  document.getElementById('avatar-initials')?.classList.replace('avatar-orange', 'avatar-blue');
  const topR = document.querySelector('.topbar-right');
  if (topR) {
    const sel = document.createElement('div');
    sel.style.cssText = 'display:flex;align-items:center;gap:5px;margin-right:6px';
    sel.innerHTML = `<input type="number" id="prof-nivel-inp" min="1" max="50" value="${nivelAtual}" style="width:52px;padding:4px 6px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-weight:700;background:var(--bg);color:var(--text);text-align:center"><button onclick="profIr()" style="padding:4px 10px;background:var(--blue-pale);border:1.5px solid rgba(127,119,221,.3);border-radius:8px;font-size:12px;font-weight:700;color:var(--blue-dark);cursor:pointer">Ir</button>`;
    topR.prepend(sel);
  }
}
window.profIr = function() {
  const v = Math.max(1, Math.min(50, parseInt(document.getElementById('prof-nivel-inp')?.value) || 1));
  window.location.href = `/aluno/tabuada.html?nivel=${v}`;
};

// ── Start ─────────────────────────────────────────────────────
buildGame();
</script>
</body>
</html>
