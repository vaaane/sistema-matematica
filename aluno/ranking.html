<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ranking — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .tab-nav{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:20px;}
    .tab-nav button{flex:1;padding:9px;border:none;border-radius:9px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);background:transparent;transition:all .2s;}
    .tab-nav button.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(47,158,220,.3);}
    .rank-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);}
    .rank-row:last-child{border-bottom:none;}
    .rank-row.destaque{background:linear-gradient(135deg,var(--blue-pale),#fff);border-left:3px solid var(--blue);}
    .rank-pos{font-size:14px;font-weight:800;width:28px;text-align:center;flex-shrink:0;}
    .rank-nome{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .rank-sub{font-size:11px;color:var(--text-muted);margin-top:1px;}
    .rank-pts{font-size:14px;font-weight:800;color:var(--gold);flex-shrink:0;text-align:right;}
    .rank-pts-label{font-size:10px;font-weight:400;color:var(--text-muted);}
    .ativ-sel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
    .ativ-btn{padding:6px 14px;border:1.5px solid var(--border);border-radius:20px;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:all .2s;}
    .ativ-btn.active{border-color:var(--blue);background:var(--blue);color:#fff;}
    .rank-section-title{font-size:12px;font-weight:700;color:var(--text-muted);letter-spacing:.4px;text-transform:uppercase;margin:0 0 6px;display:flex;align-items:center;gap:8px;}
    .live-tag{font-size:10px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.4);color:#16A34A;border-radius:10px;padding:1px 7px;font-weight:700;}
    .podium-wrap{display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:12px 8px 0;margin-bottom:16px;}
    .podium-spot{display:flex;flex-direction:column;align-items:center;flex:1;max-width:120px;}
    .podium-trophy{font-size:28px;margin-bottom:2px;}
    .podium-name{font-size:11px;font-weight:700;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;margin-bottom:2px;}
    .podium-pts{font-size:11px;color:var(--gold);font-weight:800;margin-bottom:5px;}
    .podium-stand{display:flex;align-items:center;justify-content:center;width:100%;border-radius:6px 6px 0 0;font-size:15px;font-weight:800;color:white;}
    .podium-me-ring{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px;}
    @media(max-width:640px){.grid-2{grid-template-columns:1fr!important}}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Ranking</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
      <div class="topbar-right"><div class="avatar avatar-orange" id="avatar-initials">?</div></div>
    </div>
    <div class="content" id="content">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div>
    </div>
  </div>
</div>
<script type="module">
import { LISTA_ATIVIDADES } from "/js/constants.js";
import { getResultados, listenRankingAtividade } from "/js/db.js";
import { requireAluno, renderSidebarAluno, clearSession } from "/js/auth.js";

const sess = requireAluno("/index.html");
if (!sess) throw new Error();
renderSidebarAluno("sidebar", "ranking");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const { alunos, turma } = sess;
document.getElementById("topbar-sub").textContent = `Turma ${turma}`;
document.getElementById("avatar-initials").textContent = alunos[0][0].toUpperCase();

const todos = await getResultados();

// ── Avg-based ranking ────────────────────────────────────────
function buildRankingMedia(lista) {
  const melhor = {};
  for (const r of lista) {
    if (!r.concluido || !r.aluno) continue;
    if (!melhor[r.aluno]) melhor[r.aluno] = { aluno: r.aluno, turma: r.turma || '?', porAtiv: {}, sessoes: 0 };
    const bruta = r.pontuacao_bruta || r.pontuacao || 0;
    const prev = melhor[r.aluno].porAtiv[r.atividade] || 0;
    if (bruta > prev) melhor[r.aluno].porAtiv[r.atividade] = bruta;
    melhor[r.aluno].sessoes++;
  }
  return Object.values(melhor).map(a => {
    const vals = Object.values(a.porAtiv);
    const media = vals.length ? Math.round(vals.reduce((s, v) => s + v, 0) / vals.length) : 0;
    return { aluno: a.aluno, turma: a.turma, media, atividades: vals.length, sessoes: a.sessoes };
  }).sort((a, b) => b.media - a.media);
}

const rankAll   = buildRankingMedia(todos);
const rankTurma = rankAll.filter(r => r.turma === turma);

// ── Posição do aluno ─────────────────────────────────────────
function posicaoAluno(nome) {
  const posGeral = (rankAll.findIndex(r => r.aluno === nome) + 1) || '—';
  const posTurma = (rankTurma.findIndex(r => r.aluno === nome) + 1) || '—';
  return { posGeral, posTurma };
}

// ── Podium (top 3) ───────────────────────────────────────────
function renderPodium(top3) {
  if (!top3.length) return '';
  const [p1, p2, p3] = [top3[0], top3[1], top3[2]];
  const spot = (p, pos, standH, standBg) => {
    if (!p) return `<div class="podium-spot" style="max-width:110px"></div>`;
    const trophy = ['🥇','🥈','🥉'][pos - 1];
    const isMe = alunos.includes(p.aluno);
    return `<div class="podium-spot${isMe ? ' podium-me-ring' : ''}" style="max-width:110px">
      <div class="podium-trophy">${trophy}</div>
      <div class="podium-name">${p.aluno}</div>
      <div class="podium-pts">${p.pts}</div>
      <div class="podium-stand" style="height:${standH}px;background:${standBg}">${pos}</div>
    </div>`;
  };
  return `<div class="podium-wrap">
    ${spot(p2, 2, 54, 'linear-gradient(135deg,#9CA3AF,#6B7280)')}
    ${spot(p1, 1, 76, 'linear-gradient(135deg,#F59E0B,#D97706)')}
    ${spot(p3, 3, 38, 'linear-gradient(135deg,#CD7C54,#92400E)')}
  </div>`;
}

// ── Activity listener management ─────────────────────────────
let tabAtual  = 'geral';
let ativSel   = LISTA_ATIVIDADES[0]?.nome || '';
let unsubAtiv = null;

function abrirAtividade(nome) {
  ativSel = nome;
  document.querySelectorAll('.ativ-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.ativ === nome));
  if (unsubAtiv) { unsubAtiv(); unsubAtiv = null; }
  const elTurma  = document.getElementById('rank-ativ-turma');
  const elGeral  = document.getElementById('rank-ativ-geral');
  const elPodium = document.getElementById('ativ-podium');
  if (!elTurma || !elGeral) return;
  elTurma.innerHTML = '<div style="text-align:center;padding:16px;color:var(--text-muted);font-size:13px">Aguardando…</div>';
  elGeral.innerHTML = '';
  if (elPodium) elPodium.innerHTML = '';
  unsubAtiv = listenRankingAtividade(nome, ranking => {
    const listaTurma = ranking.filter(r => r.turma === turma).slice(0, 10);
    const listaGeral = ranking.slice(0, 10);
    renderAtivTurma(listaTurma, elTurma);
    renderAtivGeral(listaGeral, elGeral);
    if (elPodium) {
      const top3 = ranking.slice(0, 3).map(r => ({
        aluno: r.aluno,
        pts: r.pontuacao_bruta || r.pontuacao || 0,
      }));
      elPodium.innerHTML = renderPodium(top3);
    }
  });
}

function renderAtivTurma(lista, el) {
  if (!lista.length) {
    el.innerHTML = '<p style="font-size:13px;color:var(--text-muted);padding:10px 16px">Nenhum resultado da sua turma ainda.</p>';
    return;
  }
  let lastPos = 1;
  el.innerHTML = lista.map((r, i) => {
    const pts = r.pontuacao_bruta || r.pontuacao || 0;
    if (i === 0) lastPos = 1;
    else if (pts !== (lista[i-1].pontuacao_bruta || lista[i-1].pontuacao || 0)) lastPos = i + 1;
    const pos = lastPos;
    const medal = pos <= 3 ? ['🥇','🥈','🥉'][pos-1] : pos;
    const dest = alunos.includes(r.aluno);
    const atrasoTag = r.com_abatimento ? ' <span style="font-size:10px;color:#D97706" title="Entregue com atraso">⏰</span>' : '';
    return `<div class="rank-row${dest ? ' destaque' : ''}">
      <div class="rank-pos">${medal}</div>
      <div style="flex:1;min-width:0"><div class="rank-nome">${r.aluno}${dest ? ' ★' : ''}${atrasoTag}</div></div>
      <div class="rank-pts">${pts}</div>
    </div>`;
  }).join('');
}

function renderAtivGeral(lista, el) {
  if (!lista.length) { el.innerHTML = '<p style="font-size:13px;color:var(--text-muted);padding:10px 16px">Sem resultados ainda.</p>'; return; }
  let lastPos = 1;
  el.innerHTML = lista.map((r, i) => {
    const pts = r.pontuacao_bruta || r.pontuacao || 0;
    if (i === 0) lastPos = 1;
    else if (pts !== (lista[i-1].pontuacao_bruta || lista[i-1].pontuacao || 0)) lastPos = i + 1;
    const pos = lastPos;
    const medal = pos <= 3 ? ['🥇','🥈','🥉'][pos-1] : pos;
    const dest = alunos.includes(r.aluno);
    const atrasoTag = r.com_abatimento ? ' <span style="font-size:10px;color:#D97706" title="Entregue com atraso">⏰</span>' : '';
    return `<div class="rank-row${dest ? ' destaque' : ''}">
      <div class="rank-pos">${medal}</div>
      <div style="flex:1;min-width:0">
        <div class="rank-nome">${r.aluno}${dest ? ' ★' : ''}${atrasoTag}</div>
        <div class="rank-sub">Turma ${r.turma}</div>
      </div>
      <div class="rank-pts">${pts}</div>
    </div>`;
  }).join('');
}

window.mudarTab = function(tab) {
  tabAtual = tab;
  document.getElementById('tab-geral')?.classList.toggle('active', tab === 'geral');
  document.getElementById('tab-turma')?.classList.toggle('active', tab === 'turma');
  document.getElementById('tab-ativ')?.classList.toggle('active', tab === 'ativ');
  document.getElementById('panel-geral').style.display  = tab === 'geral'  ? '' : 'none';
  document.getElementById('panel-turma').style.display  = tab === 'turma'  ? '' : 'none';
  document.getElementById('panel-ativ').style.display   = tab === 'ativ'   ? '' : 'none';
  if (tab === 'ativ') { abrirAtividade(ativSel); }
  if (tab !== 'ativ' && unsubAtiv) { unsubAtiv(); unsubAtiv = null; }
};

// ── Build rows ───────────────────────────────────────────────
let _gPos = 1;
const geralRows = rankAll.length
  ? rankAll.map((r, i) => {
      if (i === 0) _gPos = 1;
      else if (r.media !== rankAll[i-1].media) _gPos = i + 1;
      const pos = _gPos;
      const medal = pos <= 3 ? ['🥇','🥈','🥉'][pos-1] : pos;
      const dest = alunos.includes(r.aluno);
      return `<div class="rank-row${dest ? ' destaque' : ''}">
        <div class="rank-pos">${medal}</div>
        <div style="flex:1;min-width:0">
          <div class="rank-nome">${r.aluno}${dest ? ' ★' : ''}</div>
          <div class="rank-sub">Turma ${r.turma} · ${r.atividades} ativ. · ${r.sessoes} sess.</div>
        </div>
        <div class="rank-pts">${r.media}<div class="rank-pts-label">média</div></div>
      </div>`;
    }).join('')
  : '<p style="font-size:13px;color:var(--text-muted);padding:16px">Nenhum resultado registrado ainda.</p>';

let _tPos = 1;
const turmaRows = rankTurma.length
  ? rankTurma.slice(0, 10).map((r, i) => {
      if (i === 0) _tPos = 1;
      else if (r.media !== rankTurma[i-1].media) _tPos = i + 1;
      const pos = _tPos;
      const medal = pos <= 3 ? ['🥇','🥈','🥉'][pos-1] : pos;
      const dest = alunos.includes(r.aluno);
      return `<div class="rank-row${dest ? ' destaque' : ''}">
        <div class="rank-pos">${medal}</div>
        <div style="flex:1;min-width:0">
          <div class="rank-nome">${r.aluno}${dest ? ' ★' : ''}</div>
          <div class="rank-sub">${r.atividades} ativ. · ${r.sessoes} sess.</div>
        </div>
        <div class="rank-pts">${r.media}<div class="rank-pts-label">média</div></div>
      </div>`;
    }).join('')
  : '<p style="font-size:13px;color:var(--text-muted);padding:16px">Nenhum resultado da sua turma ainda.</p>';

const geralTop3  = rankAll.slice(0,3).map(r => ({ aluno: r.aluno, pts: r.media }));
const turmaTop3  = rankTurma.slice(0,3).map(r => ({ aluno: r.aluno, pts: r.media }));

const ativBtns = LISTA_ATIVIDADES.map(a =>
  `<button class="ativ-btn${a.nome === ativSel ? ' active' : ''}" data-ativ="${a.nome}">${a.nome}</button>`
).join('');

// ── Position strip ───────────────────────────────────────────
const posStrip = alunos.map(nome => {
  const p = posicaoAluno(nome);
  return `<div style="display:flex;align-items:center;gap:12px;padding:8px 0">
    <div style="font-size:13px;font-weight:700">${nome}</div>
    <div style="display:flex;gap:16px">
      <div style="text-align:center">
        <div style="font-size:18px;font-weight:800;color:var(--blue)">${p.posGeral === '—' ? '—' : '#'+p.posGeral}</div>
        <div style="font-size:10px;color:var(--text-muted)">Geral</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:18px;font-weight:800;color:var(--orange)">${p.posTurma === '—' ? '—' : '#'+p.posTurma}</div>
        <div style="font-size:10px;color:var(--text-muted)">Turma</div>
      </div>
    </div>
  </div>`;
}).join('<div style="width:1px;background:var(--border);margin:0 8px"></div>');

document.getElementById('content').innerHTML = `
  <div class="card" style="margin-bottom:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px">
    ${posStrip}
  </div>

  <div class="tab-nav">
    <button id="tab-geral" class="active" onclick="mudarTab('geral')">🏆 Geral</button>
    <button id="tab-turma"                onclick="mudarTab('turma')">🏫 Turma</button>
    <button id="tab-ativ"                 onclick="mudarTab('ativ')">📚 Por Atividade</button>
  </div>

  <div id="panel-geral">
    ${renderPodium(geralTop3)}
    <div class="card" style="padding:0">${geralRows}</div>
  </div>

  <div id="panel-turma" style="display:none">
    ${renderPodium(turmaTop3)}
    <div class="card" style="padding:0">${turmaRows}</div>
  </div>

  <div id="panel-ativ" style="display:none">
    <div class="ativ-sel" id="ativ-sel">${ativBtns}</div>
    <div id="ativ-podium"></div>
    <div class="grid-2" style="align-items:start">
      <div>
        <div class="rank-section-title">Sua Turma (Top 10) <span class="live-tag">ao vivo</span></div>
        <div class="card" style="padding:0" id="rank-ativ-turma"></div>
      </div>
      <div>
        <div class="rank-section-title">Top 10 Geral</div>
        <div class="card" style="padding:0" id="rank-ativ-geral"></div>
      </div>
    </div>
  </div>`;

document.querySelectorAll('.ativ-btn').forEach(b => {
  b.addEventListener('click', () => abrirAtividade(b.dataset.ativ));
});

window.addEventListener('beforeunload', () => { if (unsubAtiv) unsubAtiv(); });
</script>
</body>
</html>
