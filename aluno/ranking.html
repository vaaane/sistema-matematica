<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ranking — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    /* ── Tabs ── */
    .rnk-tabs{display:flex;gap:3px;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px;}
    .rnk-tab{flex:1;padding:9px 4px;border:none;border-radius:9px;font-family:'Inter',sans-serif;font-size:clamp(10px,2.2vw,12px);font-weight:600;cursor:pointer;color:var(--text-muted);background:transparent;transition:all .2s;white-space:nowrap;line-height:1.2;}
    .rnk-tab.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(47,158,220,.3);}
    /* ── Scope toggle ── */
    .rnk-scope{display:flex;gap:6px;margin-bottom:14px;}
    .rnk-scope-btn{padding:6px 18px;border:1.5px solid var(--border);border-radius:20px;background:var(--bg);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:all .15s;}
    .rnk-scope-btn.active{border-color:var(--blue);background:var(--blue);color:#fff;}
    /* ── Aluno card ── */
    .rnk-aluno-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:12px 16px;margin-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
    .rnk-aluno-name{font-size:14px;font-weight:800;flex-shrink:0;margin-right:2px;}
    .rnk-pill{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:14px;white-space:nowrap;}
    .rnk-pill.blue{background:rgba(47,158,220,.1);color:var(--blue);}
    .rnk-pill.purple{background:rgba(139,92,246,.1);color:#7C3AED;}
    .rnk-pill.green{background:rgba(34,197,94,.1);color:#16A34A;}
    .rnk-pill.orange{background:rgba(249,115,22,.1);color:var(--orange);}
    /* ── Podium ── */
    .podium-section{margin-bottom:14px;}
    /* Desktop: flex, align-items:flex-end, DOM order: 2º 1º 3º */
    .podium-outer{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:28px 4px 0;}
    .podium-spot{display:flex;flex-direction:column;align-items:center;flex:1;max-width:145px;position:relative;}
    .podium-spot.p1{max-width:175px;}
    /* Mobile: 1st full-width top, 2nd/3rd below */
    @media(max-width:580px){
      .podium-outer{flex-wrap:wrap;padding:10px 4px 0;gap:8px;}
      .podium-spot{max-width:none!important;flex:none;}
      .podium-spot.p1{width:100%;order:-1;margin-bottom:4px;}
      .podium-spot.p2,.podium-spot.p3{width:calc(50% - 4px);}
    }
    .podium-crown{font-size:clamp(13px,3.5vw,20px);line-height:1;margin-bottom:2px;filter:drop-shadow(0 0 6px rgba(255,200,0,.8));}
    .podium-trophy{font-size:clamp(22px,5vw,40px);line-height:1;margin-bottom:3px;}
    .podium-spot.p1 .podium-trophy{font-size:clamp(28px,6vw,52px);}
    .podium-name{font-size:clamp(10px,2.4vw,13px);font-weight:800;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px;margin-bottom:2px;}
    .podium-spot.p1 .podium-name{font-size:clamp(11px,2.8vw,14px);}
    .podium-turma{font-size:10px;color:var(--text-muted);text-align:center;margin-bottom:3px;}
    .podium-score{font-size:clamp(10px,2.3vw,13px);font-weight:800;text-align:center;margin-bottom:6px;line-height:1.3;}
    .podium-stand{display:flex;align-items:center;justify-content:center;width:100%;border-radius:6px 6px 0 0;font-size:clamp(14px,3.5vw,19px);font-weight:800;color:#fff;}
    .podium-spot.p1 .podium-stand{font-size:clamp(16px,4vw,22px);}
    .podium-spot.g1{background:rgba(245,158,11,.09);border-radius:12px;padding:8px 5px;}
    .podium-spot.g2{background:rgba(156,163,175,.07);border-radius:10px;padding:5px 3px;}
    .podium-spot.g3{background:rgba(180,83,9,.07);border-radius:10px;padding:5px 3px;}
    @keyframes gold-glow{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 22px rgba(245,158,11,.55)}}
    .podium-spot.g1{animation:gold-glow 2.5s ease-in-out infinite;}
    .podium-spot.me-border{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:8px;}
    /* ── Rank list ── */
    .rnk-card{background:var(--card);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;}
    .rnk-row{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);}
    .rnk-row:last-child{border-bottom:none;}
    .rnk-row.me{background:linear-gradient(135deg,var(--blue-pale),transparent);border-left:3px solid var(--blue);}
    .rnk-pos{font-size:clamp(10px,2.5vw,13px);font-weight:800;min-width:clamp(18px,5vw,26px);text-align:center;flex-shrink:0;color:var(--text-muted);}
    .rnk-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
    .rnk-info{flex:1;min-width:0;}
    .rnk-name{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .rnk-sub{font-size:10px;color:var(--text-muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .rnk-right{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex-shrink:0;}
    .rnk-score{font-size:clamp(11px,2.8vw,14px);font-weight:800;}
    .rnk-score-sub{font-size:9px;color:var(--text-muted);}
    .rnk-delta{font-size:10px;font-weight:700;}
    .rnk-delta.up{color:var(--green);}
    .rnk-delta.dn{color:var(--red);}
    .rnk-delta.eq{color:var(--text-muted);}
    /* ── Activity selector ── */
    .rnk-ativ-wrap{margin-bottom:12px;}
    .rnk-ativ-wrap select{width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;}
    /* ── Confetti ── */
    @keyframes confete-rank-fall{0%{opacity:1;transform:translateY(0) rotate(0deg)}75%{opacity:.9}100%{opacity:0;transform:translateY(110vh) rotate(560deg) scale(.4)}}
    .confete-rank{position:absolute;top:-10px;width:7px;height:9px;border-radius:2px;opacity:0;pointer-events:none;animation:confete-rank-fall var(--dur,2s) var(--delay,0s) ease-in 1 forwards;}
    @media(max-width:400px){
      .rnk-tab{font-size:9px;padding:7px 2px;}
      .rnk-scope-btn{padding:5px 12px;font-size:11px;}
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Ranking</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
      <div class="topbar-right">
        <div class="avatar-wrap" onclick="window.location.href='/aluno/perfil.html'">
          <div class="avatar" id="topbar-avatar-circle" style="overflow:hidden;padding:0"></div>
        </div>
      </div>
    </div>
    <div class="content" id="content">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div>
    </div>
  </div>
</div>

<script>(()=>{const t=localStorage.getItem('tema');if(t==='escuro')document.documentElement.setAttribute('data-theme','dark');})()</script>
<script type="module">
import { LISTA_ATIVIDADES } from "/js/constants.js";
import { getResultados, getAlunoPreferencia } from "/js/db.js";
import { requireAluno, renderSidebarAluno, clearSession } from "/js/auth.js";
import { db } from "/js/firebase-config.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { saveRankPos, applyTopRankVisuals } from "/js/toprank.js";
import { initTopNotif } from "/js/topnotif.js";
import { initAvBanner } from "/js/avaliacao_banner.js";

const sess = requireAluno("/index.html");
if (!sess) throw new Error();
renderSidebarAluno("sidebar", "ranking");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const { alunos, turma } = sess;
initAvBanner(turma, alunos[0]);

getAlunoPreferencia(turma, alunos[0], 'tema').then(t => {
  if (t && t !== localStorage.getItem('tema')) {
    localStorage.setItem('tema', t);
    document.documentElement.setAttribute('data-theme', t === 'escuro' ? 'dark' : '');
  }
});
getAlunoPreferencia(turma, alunos[0], 'robotica').then(r => {
  localStorage.setItem('sm_pref_robotica', r ? '1' : '0');
}).catch(() => {});

document.getElementById("topbar-sub").textContent = `Turma ${turma}`;
(async () => { try {
  const { getPerfil } = await import('/js/db.js');
  const { avatarHtml, avatarConfigDefault } = await import('/js/gamificacao.js');
  const _aUid = (turma + '_' + alunos[0]).replace(/[.#$[\]/\s]/g, '_');
  const _p = await getPerfil(_aUid);
  const _c = document.getElementById('topbar-avatar-circle');
  if (_c) _c.innerHTML = avatarHtml(_p.avatar || avatarConfigDefault(), alunos[0], '100%');
} catch(_) {} })();

(async () => { try {
  const { iniciarNotifDuelo } = await import('/js/duelo_notif.js');
  const { getPerfil } = await import('/js/db.js');
  const _uid = (turma + '_' + alunos[0]).replace(/[.#$[\]/\s]/g, '_');
  const _p = await getPerfil(_uid).catch(() => ({}));
  const _apelido = _p?.apelido_ativo || alunos[0];
  if (_p?.duelos_disponivel !== false) iniciarNotifDuelo(_uid, _apelido);
} catch(e) { console.warn('[DueloNotif]', e); } })();

(async () => { try {
  const { initDueloAvail } = await import('/js/duelo_avail.js');
  await initDueloAvail((turma + '_' + alunos[0]).replace(/[.#$[\]/\s]/g, '_'));
} catch(e) {} })();

// ── Helpers ───────────────────────────────────────────────────
function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const isMob = () => window.innerWidth <= 480;
const AV_COLORS = ['#7F77DD','#2F9EDC','#22C55E','#F59E0B','#EF4444','#8B5CF6','#EC4899','#14B8A6'];
function avColor(n) { let h=0; for(const c of (n||'?')) h=(h*31+c.charCodeAt(0))&0xffff; return AV_COLORS[h%AV_COLORS.length]; }

function abreviarNome(nome) {
  const p = nome.trim().split(/\s+/);
  if (p.length <= 1) return nome;
  return p[0] + ' ' + p.slice(1).map(x => x[0]+'.').join(' ');
}
function displayNome(nome, mobile) {
  return escH(mobile ? abreviarNome(nome) : nome);
}

function stdPos(lista, scoreFn) {
  let p=0, n=0, last=null;
  return lista.map(item => {
    n++;
    const v = scoreFn(item);
    if (v !== last) { p=n; last=v; }
    return p;
  });
}

// ── Load data ─────────────────────────────────────────────────
const todos = (await getResultados()).filter(r => !r.modo_teste && r.aluno !== 'PROFESSOR_TESTE');
const [rankSnap, niveisSnap] = await Promise.all([
  get(ref(db, 'tabuada_ranking')).catch(() => null),
  get(ref(db, 'tabuada_niveis')).catch(() => null),
]);

// ── Tabuada ranking ───────────────────────────────────────────
const tabAll = [];
if (rankSnap?.exists()) {
  rankSnap.forEach(c => { const v=c.val(); if(v?.nome) tabAll.push({...v, _key:c.key}); });
  tabAll.sort((a,b) => (b.melhor_nivel||0)-(a.melhor_nivel||0)||(b.total_partidas||0)-(a.total_partidas||0)||(a.nome||'').localeCompare(b.nome||''));
}
if (niveisSnap?.exists()) {
  niveisSnap.forEach(c => {
    const nd=c.val(); if(!nd?.nome) return;
    const r=tabAll.find(x=>x._key===c.key);
    if(r&&nd.total_partidas) r.total_partidas=nd.total_partidas;
  });
}

// Delta desde ontem via historico
const ontemISO = new Date(Date.now()-86400000).toISOString().slice(0,10);
const deltaMap = {};
if (niveisSnap?.exists()) {
  niveisSnap.forEach(c => {
    const nd=c.val(); if(!nd?.historico) return;
    const entries=Object.entries(nd.historico)
      .map(([ts,v])=>({ts:Number(ts),...v})).filter(e=>e.nivel).sort((a,b)=>a.ts-b.ts);
    let best=0;
    for(const e of entries) {
      if(new Date(e.ts).toISOString().slice(0,10)<=ontemISO) best=Math.max(best,e.nivel);
    }
    const r=tabAll.find(x=>x._key===c.key);
    if(r) deltaMap[c.key]=(r.melhor_nivel||0)-best;
  });
}
const tabTurma    = tabAll.filter(r=>r.turma===turma);
const tabAllPos   = stdPos(tabAll,   r=>r.melhor_nivel||0);
const tabTurmaPos = stdPos(tabTurma, r=>r.melhor_nivel||0);

// ── F1 / F2 rankings ─────────────────────────────────────────
const avResults = todos.filter(r=>r.concluido&&r.aluno&&r.modo==='avaliacao_plus'&&r.atividade!=='Atividade 4 - Geometria');
const f1Map={}, f2Map={};
for(const r of avResults) {
  const al=r.aluno, at=r.atividade, t=r.turma||'?';
  if(!f1Map[al]) f1Map[al]={aluno:al,turma:t,ativs:{}};
  if(!f2Map[al]) f2Map[al]={aluno:al,turma:t,ativs:{}};
  f1Map[al].ativs[at]=Math.max(f1Map[al].ativs[at]||0, r.nota_quiz??0);
  f2Map[al].ativs[at]=Math.max(f2Map[al].ativs[at]||0, r.pontuacao??0);
}
const rankF1All = Object.values(f1Map).map(a=>{
  const vals=Object.values(a.ativs);
  return {aluno:a.aluno,turma:a.turma,total:vals.reduce((s,v)=>s+v,0),numAtiv:vals.length,maxF1:vals.length*10};
}).sort((a,b)=>b.total-a.total||a.aluno.localeCompare(b.aluno));

const rankF2All = Object.values(f2Map).map(a=>{
  const vals=Object.values(a.ativs);
  return {aluno:a.aluno,turma:a.turma,total:vals.reduce((s,v)=>s+v,0)};
}).sort((a,b)=>b.total-a.total||a.aluno.localeCompare(b.aluno));

const rankF1Turma = rankF1All.filter(r=>r.turma===turma);
const rankF2Turma = rankF2All.filter(r=>r.turma===turma);
const f1AllPos    = stdPos(rankF1All,   r=>r.total);
const f2AllPos    = stdPos(rankF2All,   r=>r.total);
const f1TurmaPos  = stdPos(rankF1Turma, r=>r.total);
const f2TurmaPos  = stdPos(rankF2Turma, r=>r.total);

// ── Torneio rankings ──────────────────────────────────────────
const torneioResults = todos.filter(r => r.concluido && r.aluno && r.tipo === 'torneio');
const torneioAtivsList = [...new Set(torneioResults.map(r => r.atividade))].sort();
const rankTorneioAll = {}, rankTorneioTurma = {};
for (const at of torneioAtivsList) {
  const byAl = {};
  for (const r of torneioResults.filter(x => x.atividade === at)) {
    const al = r.aluno, t = r.turma || '?';
    if (!byAl[al]) byAl[al] = { aluno: al, turma: t, pts: 0, posicao: null };
    if ((r.pontuacao||0) > byAl[al].pts) {
      byAl[al].pts = r.pontuacao || 0;
      byAl[al].posicao = r.posicao;
    }
  }
  const sorted = Object.values(byAl).sort((a,b) => b.pts - a.pts || a.aluno.localeCompare(b.aluno));
  rankTorneioAll[at] = sorted;
  rankTorneioTurma[at] = sorted.filter(r => r.turma === turma);
}

// ── Activity rankings ─────────────────────────────────────────
const ativsList = [...new Set(avResults.map(r=>r.atividade))].sort();
const allAtivsList = [...ativsList, ...torneioAtivsList.filter(a => !ativsList.includes(a))];
const rankAtivAll={}, rankAtivTurma={};
for(const at of ativsList) {
  const byAl={};
  for(const r of avResults.filter(x=>x.atividade===at)) {
    const al=r.aluno, t=r.turma||'?';
    if(!byAl[al]) byAl[al]={aluno:al,turma:t,f1:0,f2:0};
    byAl[al].f1=Math.max(byAl[al].f1, r.nota_quiz??0);
    byAl[al].f2=Math.max(byAl[al].f2, r.pontuacao??0);
  }
  const sorted=Object.values(byAl).sort((a,b)=>b.f1-a.f1||b.f2-a.f2||a.aluno.localeCompare(b.aluno));
  rankAtivAll[at]=sorted;
  rankAtivTurma[at]=sorted.filter(r=>r.turma===turma);
}

// ── Rank positions (toprank) ──────────────────────────────────
saveRankPos(alunos, rankF1All.map(r=>({aluno:r.aluno,total:r.total})));
applyTopRankVisuals();
initTopNotif({mode:'aluno', alunoNome:alunos[0]});

// ── My positions ──────────────────────────────────────────────
function myPos(lista, posArr) {
  const idx=lista.findIndex(r=>(r.aluno||r.nome)===alunos[0]&&(r.turma||'?')===turma);
  return idx>=0 ? posArr[idx] : null;
}
const myTab  = myPos(tabAll,    tabAllPos);
const myTabT = myPos(tabTurma,  tabTurmaPos);
const myF1   = myPos(rankF1All, f1AllPos);
const myF1T  = myPos(rankF1Turma, f1TurmaPos);
const myF2   = myPos(rankF2All, f2AllPos);
const myF2T  = myPos(rankF2Turma, f2TurmaPos);

// ── State ─────────────────────────────────────────────────────
let activeTab='tabuada', activeScope='geral', activeAtiv=allAtivsList[0]||'';
let _confettiDone=false;

function getActiveData() {
  switch(activeTab) {
    case 'tabuada': return activeScope==='geral'?{list:tabAll,pos:tabAllPos}:{list:tabTurma,pos:tabTurmaPos};
    case 'f1':  return activeScope==='geral'?{list:rankF1All,pos:f1AllPos}:{list:rankF1Turma,pos:f1TurmaPos};
    case 'f2':  return activeScope==='geral'?{list:rankF2All,pos:f2AllPos}:{list:rankF2Turma,pos:f2TurmaPos};
    case 'ativ':{
      if (torneioAtivsList.includes(activeAtiv)) {
        const l = activeScope==='geral' ? (rankTorneioAll[activeAtiv]||[]) : (rankTorneioTurma[activeAtiv]||[]);
        return { list: l, pos: stdPos(l, r => r.pts) };
      }
      const l=activeScope==='geral'?(rankAtivAll[activeAtiv]||[]):(rankAtivTurma[activeAtiv]||[]);
      return {list:l, pos:stdPos(l,r=>r.f1)};
    }
  }
  return {list:[],pos:[]};
}

// ── Score display ─────────────────────────────────────────────
function scoreRow(item, tab) {
  switch(tab) {
    case 'tabuada': return `<div class="rnk-score" style="color:var(--blue)">Nv ${item.melhor_nivel||1}</div>`;
    case 'f1':  return `<div class="rnk-score" style="color:#7C3AED">${(item.total??0).toFixed(1)}<span class="rnk-score-sub"> / ${item.maxF1||0}</span></div>`;
    case 'f2':  return `<div class="rnk-score" style="color:var(--green)">${item.total??0}<span class="rnk-score-sub"> pts</span></div>`;
    case 'ativ':
      if (item.pts !== undefined && item.f1 === undefined) {
        const pm = item.posicao ? (item.posicao<=3?['🥇','🥈','🥉'][item.posicao-1]:`#${item.posicao}º`) : '';
        return `<div class="rnk-score" style="color:var(--gold)">${item.pts}<span class="rnk-score-sub"> pts</span>${pm?`<div style="font-size:9px;color:#92400E">${pm}</div>`:''}</div>`;
      }
      return `<div class="rnk-score" style="color:#7C3AED">${(item.f1??0).toFixed(1)}<span class="rnk-score-sub">/10</span><div style="font-size:10px;color:var(--green);font-weight:700">${item.f2??0}pts F2</div></div>`;
  }
  return '';
}
function scorePodium(item, tab) {
  switch(tab) {
    case 'tabuada': return `Nv ${item.melhor_nivel||1}`;
    case 'f1':  return `${(item.total??0).toFixed(1)} / ${item.maxF1||0}`;
    case 'f2':  return `${item.total??0} pts`;
    case 'ativ':
      if (item.pts !== undefined && item.f1 === undefined) return `${item.pts} pts`;
      return `${(item.f1??0).toFixed(1)} / 10`;
  }
  return '';
}
function scoreColor(tab) {
  return tab==='tabuada'?'var(--blue)':tab==='f2'?'var(--green)':'#7C3AED';
}

// ── Podium ────────────────────────────────────────────────────
function renderPodium(lista, posArr) {
  if(!lista.length) return `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px">Sem dados ainda.</div>`;
  const mobile=isMob();

  // Build top-3 groups
  const groups=[];
  let gi=0;
  while(gi<lista.length&&groups.length<3) {
    const pos=posArr[gi];
    let gj=gi+1;
    while(gj<lista.length&&posArr[gj]===pos) gj++;
    groups.push({pos,students:lista.slice(gi,gj)});
    gi=gj;
  }

  const TROPHIES=['🥇','🥈','🥉'];
  const COLORS  =['#F59E0B','#9CA3AF','#CD853F'];
  const STANDS  =[
    {h:mobile?60:80, bg:'linear-gradient(135deg,#F59E0B,#D97706)'},
    {h:mobile?44:56, bg:'linear-gradient(135deg,#9CA3AF,#6B7280)'},
    {h:mobile?32:40, bg:'linear-gradient(135deg,#CD853F,#92400E)'},
  ];

  const spot=(slotIdx)=>{
    const g=groups[slotIdx];
    if(!g) return `<div class="podium-spot p${slotIdx+1}"></div>`;
    const st=STANDS[slotIdx];
    const isMe=g.students.some(s=>(s.aluno||s.nome)===alunos[0]&&(s.turma||'?')===turma);
    const names=g.students.map(s=>displayNome(s.aluno||s.nome||'?', mobile));
    const nameStr=names.length===1?names[0]:names.join(' & ');
    const turmaStr=activeScope==='geral'&&g.students[0]?.turma
      ?`<div class="podium-turma">Turma ${escH(g.students[0].turma)}</div>`:'' ;

    // Confetti for #1 me (once)
    let confetti='';
    if(isMe&&slotIdx===0&&!_confettiDone) {
      _confettiDone=true;
      const cols=['#F59E0B','#3B82F6','#EF4444','#22C55E','#8B5CF6'];
      confetti=`<div style="position:absolute;top:0;left:50%;pointer-events:none;width:0;overflow:visible">`+
        cols.map((c,i)=>{
          const cx=(i%2===0?-1:1)*(8+i*6);
          const dur=(1.5+i*.28).toFixed(2), del=(i*.38).toFixed(2);
          return `<div class="confete-rank" style="background:${c};left:${cx}px;--dur:${dur}s;--delay:${del}s"></div>`;
        }).join('')+`</div>`;
    }
    const crown=slotIdx===0?`<div class="podium-crown">👑</div>`:'';

    return `<div class="podium-spot p${slotIdx+1} g${slotIdx+1}${isMe?' me-border':''}">
      ${confetti}${crown}
      <div class="podium-trophy">${TROPHIES[slotIdx]}</div>
      <div class="podium-name" title="${g.students.map(s=>s.aluno||s.nome).join(' & ')}">${nameStr}</div>
      ${turmaStr}
      <div class="podium-score" style="color:${COLORS[slotIdx]}">${scorePodium(g.students[0],activeTab)}</div>
      <div class="podium-stand" style="height:${st.h}px;background:${st.bg}">${g.pos}</div>
    </div>`;
  };

  // Desktop DOM order: 2nd, 1st, 3rd (flex align-items:flex-end makes 1st tallest look right)
  // Mobile: CSS order:-1 on .p1 pulls 1st to top
  return `<div class="podium-outer">${spot(1)}${spot(0)}${spot(2)}</div>`;
}

// ── List (4th+) ───────────────────────────────────────────────
function renderList(lista, posArr) {
  const mobile=isMob();
  // Rows from 4th place; always include "me" even if in podium position (shows context)
  const meIdx=lista.findIndex(r=>(r.aluno||r.nome)===alunos[0]&&(r.turma||'?')===turma);
  const showSet=new Set();
  lista.forEach((_,i)=>{ if(posArr[i]>=4) showSet.add(i); });
  // If me is in 4+ already it's included; if me is in podium, don't duplicate
  const rows=lista.filter((_,i)=>showSet.has(i));
  if(!rows.length) return '';

  const html=rows.map(r=>{
    const i=lista.indexOf(r);
    const pos=posArr[i];
    const nome=r.aluno||r.nome||'?';
    const isMe=nome===alunos[0]&&(r.turma||'?')===turma;
    const posColor=pos===1?'var(--gold)':pos===2?'#9CA3AF':pos===3?'#CD853F':'var(--text-muted)';

    let deltaHtml='';
    if(activeTab==='tabuada'&&r._key) {
      const d=deltaMap[r._key];
      if(d!=null) {
        const cls=d>0?'up':d<0?'dn':'eq';
        const txt=d>0?`↑${d}`:d<0?`↓${Math.abs(d)}`:'→';
        deltaHtml=`<span class="rnk-delta ${cls}">${txt}</span>`;
      }
    }

    const subLine=activeScope==='geral'
      ?`Turma ${escH(r.turma||'?')}${activeTab==='tabuada'?` · ${r.total_partidas||0} part.`:''}`
      :(activeTab==='tabuada'?`${r.total_partidas||0} partidas`:'');

    return `<div class="rnk-row${isMe?' me':''}">
      <span class="rnk-pos" style="color:${posColor}">${pos}</span>
      <div class="rnk-av" style="background:${avColor(nome)};color:#fff">${nome[0].toUpperCase()}</div>
      <div class="rnk-info">
        <div class="rnk-name">${displayNome(nome,mobile)}${isMe?' ★':''}</div>
        ${subLine?`<div class="rnk-sub">${subLine}</div>`:''}
      </div>
      <div class="rnk-right">${scoreRow(r,activeTab)}${deltaHtml}</div>
    </div>`;
  }).join('');

  return `<div class="rnk-card">${html}</div>`;
}

// ── Aluno card ────────────────────────────────────────────────
function renderAlunoCard() {
  const el=document.getElementById('aluno-card');
  if(!el) return;
  const pills=[];
  if(myTab)  pills.push(`<span class="rnk-pill blue">🎮 #${myTab} Tabuada</span>`);
  if(myTabT) pills.push(`<span class="rnk-pill orange">🏫 #${myTabT} Tab. ${escH(turma)}</span>`);
  if(myF1)   pills.push(`<span class="rnk-pill purple">📝 #${myF1} F1 Geral</span>`);
  if(myF1T)  pills.push(`<span class="rnk-pill orange">🏫 #${myF1T} F1 ${escH(turma)}</span>`);
  if(myF2)   pills.push(`<span class="rnk-pill green">📊 #${myF2} F2 Geral</span>`);
  if(myF2T)  pills.push(`<span class="rnk-pill orange">🏫 #${myF2T} F2 ${escH(turma)}</span>`);

  el.innerHTML=`<div class="rnk-aluno-name">${escH(alunos[0])}</div>`+
    (pills.length?pills.join(''):`<span style="font-size:12px;color:var(--text-muted)">Sem avaliações realizadas ainda.</span>`);
}

// ── Render ────────────────────────────────────────────────────
function render() {
  const {list,pos}=getActiveData();
  document.getElementById('podium-section').innerHTML=renderPodium(list,pos);
  document.getElementById('list-section').innerHTML=renderList(list,pos);
  document.querySelectorAll('.rnk-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));
  document.querySelectorAll('.rnk-scope-btn').forEach(b=>b.classList.toggle('active',b.dataset.scope===activeScope));
  const as=document.getElementById('ativ-select');
  if(as) as.style.display=activeTab==='ativ'?'':'none';
  renderAlunoCard();
}

// ── Build static structure ────────────────────────────────────
document.getElementById('content').innerHTML=`
  <div id="aluno-card" class="rnk-aluno-card">
    <div style="color:var(--text-muted);font-size:13px">Calculando…</div>
  </div>
  <div class="rnk-tabs">
    <button class="rnk-tab" data-tab="tabuada" onclick="mudarTab('tabuada')">🎮 Tabuada</button>
    <button class="rnk-tab" data-tab="f1"      onclick="mudarTab('f1')">📝 Fase 1</button>
    <button class="rnk-tab" data-tab="f2"      onclick="mudarTab('f2')">📝 Fase 2</button>
    <button class="rnk-tab" data-tab="ativ"    onclick="mudarTab('ativ')">📚 Atividade</button>
  </div>
  <div class="rnk-scope">
    <button class="rnk-scope-btn" data-scope="geral"  onclick="mudarScope('geral')">Geral</button>
    <button class="rnk-scope-btn" data-scope="turma"  onclick="mudarScope('turma')">🏫 ${escH(turma)}</button>
  </div>
  <div id="ativ-select" class="rnk-ativ-wrap" style="display:none">
    <select onchange="mudarAtiv(this.value)">
      ${allAtivsList.map(a=>`<option value="${escH(a)}">${escH(a)}</option>`).join('')}
    </select>
  </div>
  <div id="podium-section" class="podium-section"></div>
  <div id="list-section"></div>
`;

// ── Window functions ──────────────────────────────────────────
window.mudarTab   = t => { activeTab=t;   render(); };
window.mudarScope = s => { activeScope=s; render(); };
window.mudarAtiv  = a => { activeAtiv=a;  render(); };

render();
</script>
</body>
</html>
