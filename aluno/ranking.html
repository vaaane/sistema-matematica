<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ranking — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .tab-nav{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:20px;}
    .tab-nav button{flex:1;padding:9px;border:none;border-radius:9px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);background:transparent;transition:all .2s;}
    .tab-nav button.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(47,158,220,.3);}
    .rank-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);}
    .rank-row:last-child{border-bottom:none;}
    .rank-row.destaque{background:linear-gradient(135deg,var(--blue-pale),transparent);border-left:3px solid var(--blue);}
    .rank-row.rank-gold{background:linear-gradient(135deg,rgba(245,158,11,.12),transparent);}
    .rank-row.rank-silver{background:linear-gradient(135deg,rgba(156,163,175,.1),transparent);}
    .rank-row.rank-bronze{background:linear-gradient(135deg,rgba(180,83,9,.1),transparent);}
    .rank-pos{font-size:14px;font-weight:800;width:28px;text-align:center;flex-shrink:0;}
    .rank-nome{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .rank-sub{font-size:11px;color:var(--text-muted);margin-top:1px;}
    .rank-pts{font-size:14px;font-weight:800;color:var(--gold);flex-shrink:0;text-align:right;}
    .rank-pts-label{font-size:10px;font-weight:400;color:var(--text-muted);}
    .ativ-sel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
    .ativ-btn{padding:6px 14px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:all .2s;}
    .ativ-btn.active{border-color:var(--blue);background:var(--blue);color:#fff;}
    .rank-section-title{font-size:12px;font-weight:700;color:var(--text-muted);letter-spacing:.4px;text-transform:uppercase;margin:0 0 6px;display:flex;align-items:center;gap:8px;}
    .live-tag{font-size:10px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.4);color:#16A34A;border-radius:10px;padding:1px 7px;font-weight:700;}
    /* Pódio */
    .podium-wrap{display:flex;align-items:flex-end;justify-content:center;gap:8px;padding:16px 8px 0;margin-bottom:8px;}
    .podium-spot{display:flex;flex-direction:column;align-items:center;flex:1;max-width:120px;position:relative;}
    .podium-trophy{font-size:30px;margin-bottom:3px;}
    .podium-name{font-size:11px;font-weight:800;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;margin-bottom:2px;}
    .podium-turma{font-size:10px;color:var(--text-muted);margin-bottom:3px;text-align:center;}
    .podium-pts{font-size:12px;font-weight:800;margin-bottom:6px;}
    .podium-stand{display:flex;align-items:center;justify-content:center;width:100%;border-radius:6px 6px 0 0;font-size:16px;font-weight:800;color:white;}
    .podium-you{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px;padding:2px;}
    /* diff de pontos */
    .podium-diff{font-size:10px;color:var(--text-muted);text-align:center;margin-bottom:10px;}
    @media(max-width:640px){.grid-2{grid-template-columns:1fr!important}}
    @media(max-width:480px){
      .pos-strip-wrap{flex-direction:column;gap:6px}
      .pos-strip-sep{display:none}
      .pos-strip-item{padding:6px 0}
      .pos-rank-num{font-size:26px!important}
      .rank-section-title{font-size:11px}
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Ranking</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
      <div class="topbar-right"><div class="avatar avatar-orange" id="avatar-initials">?</div></div>
    </div>
    <div class="content" id="content">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div>
    </div>
  </div>
</div>
<script>(()=>{const t=localStorage.getItem('tema');if(t==='escuro')document.documentElement.setAttribute('data-theme','dark');})()</script>
<script type="module">
import { LISTA_ATIVIDADES } from "/js/constants.js";
import { getResultados, listenRankingAtividade, getAlunoPreferencia } from "/js/db.js";
import { requireAluno, renderSidebarAluno, clearSession } from "/js/auth.js";
import { saveRankPos, applyTopRankVisuals } from "/js/toprank.js";
import { initTopNotif } from "/js/topnotif.js";

const sess = requireAluno("/index.html");
if (!sess) throw new Error();
renderSidebarAluno("sidebar", "ranking");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const { alunos, turma } = sess;

// Sync tema do Firebase (não-bloqueante)
getAlunoPreferencia(turma, alunos[0], 'tema').then(t => {
  if (t && t !== localStorage.getItem('tema')) {
    localStorage.setItem('tema', t);
    document.documentElement.setAttribute('data-theme', t === 'escuro' ? 'dark' : '');
  }
});
document.getElementById("topbar-sub").textContent = `Turma ${turma}`;
document.getElementById("avatar-initials").textContent = alunos[0][0].toUpperCase();

const todos = await getResultados();

// ── Ranking por total ─────────────────────────────────────────
function buildRankingMedia(lista) {
  const melhor = {};
  for (const r of lista) {
    if (!r.concluido || !r.aluno) continue;
    if (!melhor[r.aluno]) melhor[r.aluno] = {
      aluno: r.aluno, turma: r.turma || '?', porAtiv: {}, sessoes: 0,
      melhorSessao: 0, primeiroTs: Infinity
    };
    const bruta = r.pontuacao_bruta || r.pontuacao || 0;
    const prev = melhor[r.aluno].porAtiv[r.atividade] || 0;
    if (bruta > prev) melhor[r.aluno].porAtiv[r.atividade] = bruta;
    if (bruta > melhor[r.aluno].melhorSessao) melhor[r.aluno].melhorSessao = bruta;
    const ts = r.criadoEm || 0;
    if (ts && ts < melhor[r.aluno].primeiroTs) melhor[r.aluno].primeiroTs = ts;
    melhor[r.aluno].sessoes++;
  }
  const result = Object.values(melhor).map(a => {
    const vals = Object.values(a.porAtiv);
    const total = vals.reduce((s, v) => s + v, 0);
    const media = vals.length ? Math.round(total / vals.length) : 0;
    return {
      aluno: a.aluno, turma: a.turma, total, media, atividades: vals.length, sessoes: a.sessoes,
      melhorSessao: a.melhorSessao, primeiroTs: a.primeiroTs === Infinity ? 0 : a.primeiroTs
    };
  }).sort((a, b) => {
    if (b.total !== a.total) return b.total - a.total;
    if (b.melhorSessao !== a.melhorSessao) return b.melhorSessao - a.melhorSessao;
    return (a.primeiroTs || 0) - (b.primeiroTs || 0);
  });
  // Anotação de grupos em empate
  let gi = 0;
  while (gi < result.length) {
    let gj = gi + 1;
    while (gj < result.length && result[gj].total === result[gi].total) gj++;
    if (gj - gi > 1) {
      const g = result.slice(gi, gj);
      const criterion = g.some(x => x.melhorSessao !== g[0].melhorSessao) ? 'melhor sessão' : 'data de jogo';
      for (let k = gi; k < gj; k++) result[k].tieInfo = criterion;
    }
    gi = gj;
  }
  return result;
}

// ── Tiebreak para ranking por atividade ───────────────────────
function applyAtivTiebreak(ranking) {
  const sorted = [...ranking].sort((a, b) => {
    const ap = a.pontuacao_bruta || a.pontuacao || 0;
    const bp = b.pontuacao_bruta || b.pontuacao || 0;
    if (bp !== ap) return bp - ap;
    return (a.criadoEm || 0) - (b.criadoEm || 0);
  });
  let i = 0;
  while (i < sorted.length) {
    let j = i + 1;
    const iP = sorted[i].pontuacao_bruta || sorted[i].pontuacao || 0;
    while (j < sorted.length && (sorted[j].pontuacao_bruta || sorted[j].pontuacao || 0) === iP) j++;
    if (j - i > 1) for (let k = i; k < j; k++) sorted[k].tieInfo = 'data de jogo';
    i = j;
  }
  return sorted;
}

const rankAll   = buildRankingMedia(todos);
const rankTurma = rankAll.filter(r => r.turma === turma);
saveRankPos(alunos, rankAll);
applyTopRankVisuals();
initTopNotif({ mode: 'aluno' });

// ── Posição ───────────────────────────────────────────────────
function posicaoAluno(nome) {
  const posGeral = (rankAll.findIndex(r => r.aluno === nome) + 1) || '—';
  const posTurma = (rankTurma.findIndex(r => r.aluno === nome) + 1) || '—';
  return { posGeral, posTurma };
}

// ── Animações de destaque ─────────────────────────────────────
function confettiHTML() {
  const colors = ['#F59E0B','#3B82F6','#EF4444','#22C55E','#8B5CF6','#EC4899'];
  return `<div style="position:absolute;top:0;left:50%;pointer-events:none;width:0;height:0;overflow:visible">
    ${colors.map((c, i) => {
      const cx = (i % 2 === 0 ? -1 : 1) * (10 + i * 6);
      const delay = (i * 0.35).toFixed(2);
      const dur   = (1.8 + i * 0.15).toFixed(2);
      return `<div class="confetti-p" style="background:${c};--cx:${cx}px;--cd:${dur}s;--delay:${delay}s;left:${cx}px"></div>`;
    }).join('')}
  </div>`;
}

function sparklesHTML() {
  return `<div style="position:absolute;top:-6px;right:2px;pointer-events:none">
    ${['✨','⭐','✨'].map((s, i) => {
      const rights = [0, 16, 8], tops = [0, 4, -4];
      return `<span class="sparkle-p" style="right:${rights[i]}px;top:${tops[i]}px;--sd:${1.8+i*0.5}s;--delay:${i*0.4}s">${s}</span>`;
    }).join('')}
  </div>`;
}

// ── Pódio ─────────────────────────────────────────────────────
function renderPodium(top3, { showTurma = true, size = 'medium' } = {}) {
  if (!top3.length) return '';
  const [p1, p2, p3] = [top3[0], top3[1], top3[2]];
  const STAND_HEIGHTS = { large: [130,88,60], medium: [90,62,44], small: [50,34,22] };
  const hs = STAND_HEIGHTS[size] || STAND_HEIGHTS.medium;
  const STANDS = [
    { h: hs[0], bg: 'linear-gradient(135deg,#F59E0B,#D97706)', glow: 'glow-gold' },
    { h: hs[1], bg: 'linear-gradient(135deg,#9CA3AF,#6B7280)', glow: 'glow-silver' },
    { h: hs[2], bg: 'linear-gradient(135deg,#CD853F,#92400E)', glow: 'glow-bronze' },
  ];
  const ptsArr   = top3.map(p => p.pts !== undefined ? p.pts : (p.total || p.media || 0));
  const maxW     = size === 'large' ? '140px' : size === 'small' ? '88px' : '120px';
  const nameFs   = size === 'large' ? '13px'  : size === 'small' ? '10px' : '11px';
  const trophyFs = size === 'large' ? '38px'  : size === 'small' ? '22px' : '30px';
  const ptsFs    = size === 'large' ? '15px'  : size === 'small' ? '10px' : '12px';
  const standFs  = size === 'large' ? '20px'  : size === 'small' ? '11px' : '16px';
  const crownSz  = size === 'large' ? '24px'  : '15px';
  const crownTp  = size === 'large' ? '-28px' : '-18px';
  const wrapGap  = size === 'large' ? '12px'  : size === 'small' ? '5px' : '8px';
  const wrapPad  = size === 'large' ? '28px 8px 0' : size === 'small' ? '6px 4px 0' : '16px 8px 0';

  const spot = (p, pos) => {
    if (!p) return `<div class="podium-spot" style="max-width:${maxW}"></div>`;
    const st = STANDS[pos - 1];
    const trophy = ['🥇','🥈','🥉'][pos - 1];
    const isMe = alunos.includes(p.aluno);
    const youTag = isMe ? ' ★' : '';
    let decoration = '';
    if (isMe && pos === 1) decoration = confettiHTML();
    if (isMe && pos === 2) decoration = sparklesHTML();
    const glowStyle = isMe && pos <= 2 ? `color:${pos===1?'#F59E0B':'#9CA3AF'};text-shadow:0 0 8px currentColor;` : '';
    const mainPts = p.pts !== undefined ? p.pts : (p.total || 0);
    const subPts  = p.pts !== undefined ? null : (p.media != null ? `méd. ${p.media}pts` : null);
    return `<div class="podium-spot ${st.glow}${isMe ? ' podium-you' : ''}" style="max-width:${maxW}">
      ${decoration}
      <div class="podium-trophy" style="font-size:${trophyFs}">${pos === 1 ? `<span class="crown-anim" style="font-size:${crownSz};position:absolute;top:${crownTp}">👑</span>` : ''}${trophy}</div>
      <div class="podium-name" style="${glowStyle}font-size:${nameFs}">${p.aluno}${youTag}</div>
      ${showTurma && p.turma ? `<div class="podium-turma">Turma ${p.turma}</div>` : ''}
      <div class="podium-pts" style="font-size:${ptsFs};color:${['#F59E0B','#9CA3AF','#CD853F'][pos-1]};text-align:center">${mainPts}${subPts ? `<div style="font-size:9px;font-weight:500;opacity:.75;margin-top:1px">${subPts}</div>` : ''}</div>
      <div class="podium-stand" style="height:${st.h}px;background:${st.bg};font-size:${standFs}">${pos}</div>
    </div>`;
  };

  // Diferença de pontos
  const diffsHtml = () => {
    const rows = top3.map((p, i) => {
      if (i === 0) return `<div style="flex:1;max-width:120px;text-align:center"><span style="font-size:10px;color:var(--gold);font-weight:700">🏆 líder</span></div>`;
      const diff = ptsArr[0] - ptsArr[i];
      return `<div style="flex:1;max-width:120px;text-align:center"><span class="podium-diff">${diff > 0 ? `${diff} pts atrás` : 'empate'}</span></div>`;
    });
    return `<div style="display:flex;justify-content:center;gap:8px;margin-bottom:4px">${[rows[1]||'',rows[0],rows[2]||''].join('')}</div>`;
  };

  return `<div class="podium-wrap" style="gap:${wrapGap};padding:${wrapPad}">
    ${spot(p2, 2)}
    ${spot(p1, 1)}
    ${spot(p3, 3)}
  </div>
  ${top3.length >= 2 ? diffsHtml() : ''}`;
}

// ── Listener de atividade ─────────────────────────────────────
let tabAtual  = 'geral';
let ativSel   = LISTA_ATIVIDADES[0]?.nome || '';
let unsubAtiv = null;

function abrirAtividade(nome) {
  ativSel = nome;
  document.querySelectorAll('.ativ-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.ativ === nome));
  if (unsubAtiv) { unsubAtiv(); unsubAtiv = null; }
  const elTurma = document.getElementById('rank-ativ-turma');
  const elGeral = document.getElementById('rank-ativ-geral');
  if (!elTurma || !elGeral) return;
  elTurma.innerHTML = '<div style="text-align:center;padding:16px;color:var(--text-muted);font-size:13px">Aguardando…</div>';
  elGeral.innerHTML = '';
  unsubAtiv = listenRankingAtividade(nome, ranking => {
    const sorted = applyAtivTiebreak(ranking);
    const listaTurma = sorted.filter(r => r.turma === turma).slice(0, 10);
    const listaGeral = sorted.slice(0, 10);
    renderAtivTurma(listaTurma, elTurma);
    renderAtivGeral(listaGeral, elGeral);
  });
}

// Atividade: rows com cores top 3
function rowAtiv(r, pos, dest, showTurma) {
  const pts = r.pontuacao_bruta || r.pontuacao || 0;
  const medal = pos <= 3 ? ['🥇','🥈','🥉'][pos-1] : pos;
  const colorClass = pos === 1 ? 'rank-gold' : pos === 2 ? 'rank-silver' : pos === 3 ? 'rank-bronze' : '';
  const atrasoTag = r.com_abatimento ? ' <span style="font-size:10px;color:#D97706">⏰</span>' : '';
  const tieSub = r.tieInfo ? `<div class="rank-sub" style="color:#D97706;font-size:10px">${pos}º · desempate por ${r.tieInfo}</div>` : '';
  return `<div class="rank-row ${colorClass}${dest ? ' destaque' : ''}">
    <div class="rank-pos">${medal}</div>
    <div style="flex:1;min-width:0">
      <div class="rank-nome">${r.aluno}${dest ? ' ★' : ''}${atrasoTag}</div>
      ${tieSub}
      ${showTurma ? `<div class="rank-sub">Turma ${r.turma}</div>` : ''}
    </div>
    <div class="rank-pts">${pts}</div>
  </div>`;
}

function renderAtivTurma(lista, el) {
  if (!lista.length) {
    el.innerHTML = '<p style="font-size:13px;color:var(--text-muted);padding:10px 16px">Nenhum resultado da sua turma ainda.</p>';
    return;
  }
  el.innerHTML = lista.map((r, i) => rowAtiv(r, i + 1, alunos.includes(r.aluno), false)).join('');
}

function renderAtivGeral(lista, el) {
  if (!lista.length) { el.innerHTML = '<p style="font-size:13px;color:var(--text-muted);padding:10px 16px">Sem resultados ainda.</p>'; return; }
  el.innerHTML = lista.map((r, i) => rowAtiv(r, i + 1, alunos.includes(r.aluno), true)).join('');
}

window.mudarTab = function(tab) {
  tabAtual = tab;
  ['geral','turma','ativ'].forEach(t => {
    document.getElementById(`tab-${t}`)?.classList.toggle('active', tab === t);
    document.getElementById(`panel-${t}`).style.display = tab === t ? '' : 'none';
  });
  if (tab === 'ativ') { abrirAtividade(ativSel); }
  if (tab !== 'ativ' && unsubAtiv) { unsubAtiv(); unsubAtiv = null; }
};

// ── Construir linhas ──────────────────────────────────────────
function buildRows(lista, showTurma) {
  if (!lista.length) return '<p style="font-size:13px;color:var(--text-muted);padding:16px">Nenhum resultado ainda.</p>';
  return lista.map((r, i) => {
    const pos = i + 1;
    const medal = pos <= 3 ? ['🥇','🥈','🥉'][pos-1] : pos;
    const dest = alunos.includes(r.aluno);
    const colorClass = pos === 1 ? 'rank-gold' : pos === 2 ? 'rank-silver' : pos === 3 ? 'rank-bronze' : '';
    const tieSub = r.tieInfo ? `<div class="rank-sub" style="color:#D97706;font-size:10px">${pos}º · desempate por ${r.tieInfo}</div>` : '';
    return `<div class="rank-row ${colorClass}${dest ? ' destaque' : ''}">
      <div class="rank-pos">${medal}</div>
      <div style="flex:1;min-width:0">
        <div class="rank-nome">${r.aluno}${dest ? ' ★' : ''}</div>
        ${tieSub}
        <div class="rank-sub">${showTurma ? `Turma ${r.turma} · ` : ''}${r.atividades} ativ. · ${r.sessoes} sess.</div>
      </div>
      <div class="rank-pts">${r.total}<div class="rank-pts-label">total</div><div class="rank-pts-label">méd. ${r.media}</div></div>
    </div>`;
  }).join('');
}

const geralRows = buildRows(rankAll, true);
const turmaRows = buildRows(rankTurma.slice(0, 10), false);

const geralTop3 = rankAll.slice(0, 3).map(r => ({ aluno: r.aluno, total: r.total, media: r.media, turma: r.turma }));
const turmaTop3 = rankTurma.slice(0, 3).map(r => ({ aluno: r.aluno, total: r.total, media: r.media, turma: r.turma }));

const ativBtns = LISTA_ATIVIDADES.map(a =>
  `<button class="ativ-btn${a.nome === ativSel ? ' active' : ''}" data-ativ="${a.nome}">${a.nome}</button>`
).join('');

// ── Faixa de posição ──────────────────────────────────────────
const posStrip = alunos.map(nome => {
  const p  = posicaoAluno(nome);
  const pg = p.posGeral, pt = p.posTurma;
  const pgColor  = pg !== '—' && pg <= 3 ? ['#F59E0B','#9CA3AF','#CD853F'][pg-1] : 'var(--blue)';
  const pgBadge  = pg !== '—' && pg <= 3 ? `<div style="font-size:13px;line-height:1;margin-bottom:3px">${['🥇','🥈','🥉'][pg-1]}</div>` : '';
  const ptBadge  = pt === 1 ? `<div style="font-size:13px;line-height:1;margin-bottom:3px">👑</div>` : '';
  return `<div class="pos-strip-item" style="display:flex;align-items:center;gap:16px;padding:8px 0">
    <div style="font-size:13px;font-weight:700;min-width:0;flex:1">${nome}</div>
    <div style="display:flex;gap:22px;flex-shrink:0">
      <div style="text-align:center">
        ${pgBadge}
        <div class="pos-rank-num" style="font-size:38px;font-weight:900;color:${pgColor};line-height:1">${pg === '—' ? '—' : '#'+pg}</div>
        <div style="font-size:11px;font-weight:600;color:var(--text-muted);margin-top:3px">Geral</div>
      </div>
      <div style="text-align:center">
        ${ptBadge}
        <div class="pos-rank-num" style="font-size:38px;font-weight:900;color:var(--orange);line-height:1">${pt === '—' ? '—' : '#'+pt}</div>
        <div style="font-size:11px;font-weight:600;color:var(--text-muted);margin-top:3px">Turma</div>
      </div>
    </div>
  </div>`;
}).join('<div style="width:1px;background:var(--border);margin:0 12px;align-self:stretch" class="pos-strip-sep"></div>');

const isMobile = window.innerWidth <= 480;

document.getElementById('content').innerHTML = `
  <div class="card pos-strip-wrap" style="margin-bottom:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px">
    ${posStrip}
  </div>

  <div class="tab-nav">
    <button id="tab-geral" class="active" onclick="mudarTab('geral')">🏆 Geral</button>
    <button id="tab-turma"                onclick="mudarTab('turma')">🏫 Turma</button>
    <button id="tab-ativ"                 onclick="mudarTab('ativ')">📚 Por Atividade</button>
  </div>

  <div id="panel-geral">
    ${renderPodium(geralTop3, { showTurma: true, size: isMobile ? 'medium' : 'large' })}
    <div class="card" style="padding:0">${geralRows}</div>
  </div>

  <div id="panel-turma" style="display:none">
    ${renderPodium(turmaTop3, { showTurma: false, size: 'small' })}
    <div class="card" style="padding:0">${turmaRows}</div>
  </div>

  <div id="panel-ativ" style="display:none">
    <div class="ativ-sel" id="ativ-sel">${ativBtns}</div>
    <div class="grid-2" style="align-items:start">
      <div>
        <div class="rank-section-title">Sua Turma (Top 10) <span class="live-tag">ao vivo</span></div>
        <div class="card" style="padding:0" id="rank-ativ-turma"></div>
      </div>
      <div>
        <div class="rank-section-title">Top 10 Geral</div>
        <div class="card" style="padding:0" id="rank-ativ-geral"></div>
      </div>
    </div>
  </div>`;

document.querySelectorAll('.ativ-btn').forEach(b => {
  b.addEventListener('click', () => abrirAtividade(b.dataset.ativ));
});

window.addEventListener('beforeunload', () => { if (unsubAtiv) unsubAtiv(); });
</script>
</body>
</html>
