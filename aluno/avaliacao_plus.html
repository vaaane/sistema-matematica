window.aceitarDificilF2 = function() {
  if (popupDifTimer) { clearInterval(popupDifTimer); popupDifTimer = null; }
  document.getElementById("popup-dificil")?.remove();
  if (st.finalizado) return;
  const q = gerarQuestaoF2(3);
  st.questaoAtual = q; st.questaoInicioTs = Date.now();
  st.questaoRegistrada = false; st.tentativaQ = 0;
  st.modoAjuda = false; st.ajudaUsada = false; st.ehBonus = true;
  renderQuestaoF2(); iniciarTimerF2(q.timer);
};

window.recusarDificilF2 = function() {
  if (popupDifTimer) { clearInterval(popupDifTimer); popupDifTimer = null; }
  document.getElementById("popup-dificil")?.remove();
  if (!st.finalizado) { st.questaoHist = []; proximaF2(); }
};

// ── F2: Usar ajuda ────────────────────────────────────────────
window.usarAjuda = function() {
  if (!st || st.ajudas <= 0 || st.modoAjuda || st.processando || st.finalizado) return;
  st.ajudas--;
  st.ajudaUsada = true;
  st.modoAjuda  = true;
  st.ajudasUsadasTotal = (st.ajudasUsadasTotal || 0) + 1;
  const el = document.getElementById("area-resposta");
  if (el) el.innerHTML = areaRespostaF2HTML();
  document.getElementById("btn-ajuda")?.remove();
  renderHUDF2();
  mostrarFeedback("info", "🎯 Ajuda ativada! Pontuação completa — escolha a correta!");
};

// ── Timer sessão (wall-clock) ──────────────────────────────────
function iniciarSessaoTimer() {
  clearInterval(st.sessaoInterval);
  st.sessaoInterval = setInterval(() => {
    st.sessaoRestante = Math.max(0, Math.ceil((st.sessaoFim - Date.now()) / 1000));
    const sEl = document.getElementById("hud-sessao");
    if (sEl) { sEl.textContent = `⏳ ${formatTempo(st.sessaoRestante)}`; sEl.className = "hud-sessao"+(st.sessaoRestante<=60?" urgente":""); }
    const gEl = document.getElementById("hud-global-disp");
    if (gEl && controle) gEl.textContent = `Global: ${formatTempo(Math.ceil(globalRestanteMs(controle)/1000))}`;
    // Alarme gradual nos últimos 60s (só na Fase 2 para não atrapalhar F1)
    if (st.fase === 2) {
      if (st.sessaoRestante === 60) { beep(600, 80); setTimeout(() => beep(600, 80), 200); }
      else if (st.sessaoRestante === 30) { beep(700, 80); setTimeout(() => beep(700, 80), 150); setTimeout(() => beep(700, 80), 300); }
      else if (st.sessaoRestante <= 10 && st.sessaoRestante > 0) beep(800 + (10-st.sessaoRestante)*20, 60);
    }
    if (st.sessaoRestante <= 0) {
      clearInterval(st.sessaoInterval);
      if (st.transicao) return;
      if (st.fase === 1) encerrarFase1('tempo');
      else encerrarSessao('tempo');
    }
  }, 1000);
}

// ── Encerrar sessão (F2 ou sessão encerrada em F1) ─────────────
async function encerrarSessao(motivo) {
  if (!st || st.finalizado) return;
  st.finalizado = true;
  clearInterval(st.timerInterval);
  clearInterval(st.sessaoInterval);
  document.getElementById("transicao-f1")?.remove();

  if (st.questaoAtual && !st.questaoRegistrada) {
    st.questoesDetalhes.push({
      fase: st.fase,
      enunciado: st.questaoAtual.enunciado,
      resposta_correta: st.questaoAtual.resposta + (st.questaoAtual.unidade ? ' '+st.questaoAtual.unidade : ''),
      resposta_aluno: '',
      resultado: 'nao_respondida',
      tentativas_count: st.questaoHist.length,
      dificuldade: st.questaoAtual.dif,
      tentativas: [...st.questaoHist],
      acertou: false, pontosGanhos: 0,
    });
  }

  // F1: fill tempo_ms if not already
  if (!st.f1.tempo_ms) st.f1.tempo_ms = Date.now() - st.f1.inicioMs;
  if (!st.f1.nota_quiz) st.f1.nota_quiz = parseFloat(((st.f1.pontos / F1_MAX_PTS) * 10).toFixed(2));

  // Bônus fim de sessão: +20pts se tempo, sem penalidade e ≥3 respondidas F2
  let bonusFim = 0;
  if (motivo === 'tempo' && st.semPenalidade && st.respondidas >= 3) {
    bonusFim = 20;
    st.saldo += bonusFim;
  }

  const t = Math.round(Date.now()/1000 - st.inicioTs);
  let percentualFim = statusInfo.percentual ?? 100;
  try { const s = await getAtividadeStatus(turma, liberada.atividade); percentualFim = s.percentual ?? 100; } catch(e) {}

  const f2bruta   = st.saldo; // já inclui bonusFim
  const f2aplicado = f2bruta > 0 ? Math.max(1, Math.floor(f2bruta * percentualFim / 100)) : 0;
  const naoRespondidas = st.questoesDetalhes.filter(q => q.resultado === 'nao_respondida').length;

  const dados = {
    pontuacao_bruta: f2bruta, pontuacao: f2aplicado,
    percentual_nota: percentualFim, com_abatimento: percentualFim < 100,
    acertos: st.acertos, erros: st.erros, respondidas: st.respondidas,
    modo: "avaliacao_plus",
    pontos_fase1: st.f1.pontos, nota_quiz: st.f1.nota_quiz,
    tempo_fase1_ms: st.f1.tempo_ms,
    fase1_concluida: st.f1.idx >= F1_TOTAL,
    bonus_fim: bonusFim, sem_penalidade: st.semPenalidade,
    acertos_rapidos: st.acertosRapidos, combo_max: st.comboMax,
    acertos_dificeis: st.acertosDificeis, ajudas_usadas: st.ajudasUsadasTotal || 0,
    nao_respondidas: naoRespondidas,
    tempo: `${t}s`, ts_inicio: st.inicioTs, data: dataAgora(), concluido: true,
  };

  for (const al of alunos) {
    const rid = st.resultadoIds[al];
    if (rid) {
      try { await updateResultado(rid, { ...dados, aluno: al, turma, atividade: liberada.atividade, ...(isTeste ? { modo_teste: true } : {}) }); } catch(e) {}
      if (st.questoesDetalhes.length) saveDetalhes(rid, st.questoesDetalhes).catch(()=>{});
    }
  }

  // Atualizar controle: melhor pontuação
  const melhorAtual = controle.melhor_pontuacao || 0;
  const melhorNqAtual = controle.melhor_nota_quiz || 0;
  const upd = {};
  if (f2aplicado > melhorAtual) upd.melhor_pontuacao = f2aplicado;
  if (f2bruta > (controle.melhor_bruta||0)) upd.melhor_bruta = f2bruta;
  if (st.f1.nota_quiz > melhorNqAtual) upd.melhor_nota_quiz = st.f1.nota_quiz;
  if (!isTeste && Object.keys(upd).length) { try { await update(controleRef, upd); controle = {...controle,...upd}; } catch(e) {} }

  const novoMelhorF2 = f2aplicado > melhorAtual;
  if (novoMelhorF2 && f2aplicado > 0) lancarConfete();

  mostrarResultado(motivo, f2aplicado, f2bruta, novoMelhorF2, bonusFim);
}

// ── Tela de resultado / entre tentativas ───────────────────────
function mostrarResultado(motivo, f2aplicado, f2bruta, novoMelhor, bonusFim = 0) {
  const tentUsadas    = controle.tentativas_realizadas || 1;
  const tentRestantes = MAX_TENTATIVAS - tentUsadas;
  const gRestMs       = globalRestanteMs(controle);
  const podeNovar     = isTeste || (tentRestantes > 0 && gRestMs >= MIN_PARA_TENTATIVA_MS);
  const melhorExibida = controle.melhor_pontuacao || f2aplicado;
  const taxa = st.respondidas > 0 ? Math.round(st.acertos / st.respondidas * 100) : 0;

  const badges = [];
  if (st.acertosRapidos > 0) badges.push(`<span class="fim-badge veloz">⚡ ${st.acertosRapidos} rápidos</span>`);
  if (st.semPenalidade && st.respondidas > 0) badges.push(`<span class="fim-badge limpo">🔥 Sem penalidades</span>`);
  if ((st.acertosDificeis || 0) > 0) badges.push(`<span class="fim-badge bonus-rei">🏆 ${st.acertosDificeis} bônus</span>`);
  if (bonusFim > 0) badges.push(`<span class="fim-badge bonus-fim">⭐ +${bonusFim} bônus fim!</span>`);

  const bonusLabel = bonusFim > 0 ? ` · <span style="color:#4ADE80">+${bonusFim} bônus!</span>` : '';

  const ov = document.createElement("div");
  ov.className = "resultado-overlay";
  ov.innerHTML = `
    <div class="resultado-card">
      <div class="res-icon">${motivo==='tempo'?'⏰':motivo==='manual'?'🏁':'⏰'}</div>
      <div class="res-saldo${novoMelhor?' record':''}">${f2aplicado}</div>
      <div class="res-lbl">pontos Fase 2${statusInfo.percentual<100?' · '+statusInfo.percentual+'%':''}${bonusLabel}</div>
      ${novoMelhor?`<div class="res-melhor">🎉 Novo recorde pessoal!</div>`
        : melhorExibida>0?`<div style="font-size:12px;color:#3a3a68;margin-bottom:12px">Melhor F2: ${melhorExibida} pts</div>`:''}
      <div class="res-f1-block">
        <strong>📊 Fase 1</strong><br>
        Pontos: <strong style="color:#FAB800">${fmtPts(st.f1.pontos)} / ${F1_MAX_PTS}</strong> &nbsp;·&nbsp;
        Nota quiz: <strong style="color:#FAB800">${st.f1.nota_quiz?.toFixed(1)??0} / 10</strong><br>
        Acertos: ${st.f1.acertos}/${F1_TOTAL}
      </div>
      <div class="res-stats">
        <div class="res-s"><div class="res-sv" style="color:#4ADE80">${st.acertos}</div><div class="res-sl">Acertos F2</div></div>
        <div class="res-s"><div class="res-sv" style="color:#F87171">${st.erros}</div><div class="res-sl">Erros F2</div></div>
        <div class="res-s"><div class="res-sv" style="color:#60A5FA">${taxa}%</div><div class="res-sl">Taxa F2</div></div>
      </div>
      ${badges.length ? `<div class="fim-badges">${badges.join('')}</div>` : ''}
      <div class="res-stats" style="margin-top:8px">
        <div class="res-s"><div class="res-sv" style="color:#60A5FA">${st.acertosRapidos}</div><div class="res-sl">Rápidos ⚡</div></div>
        <div class="res-s"><div class="res-sv" style="color:#A855F7">${st.ajudasUsadasTotal||0}</div><div class="res-sl">Ajudas 🎯</div></div>
        <div class="res-s"><div class="res-sv" style="color:#5050a0">${st.comboMax}</div><div class="res-sl">Combo máx</div></div>
      </div>
      <div class="res-prox-info">
        <strong>Tentativas usadas:</strong> ${tentUsadas} / ${MAX_TENTATIVAS}<br>
        <strong>Tempo global restante:</strong> ${gRestMs>0?formatTempoLongo(gRestMs):'Esgotado'}
        ${!podeNovar&&tentRestantes>0?`<br><span style="color:#F87171">Tempo insuficiente para nova tentativa.</span>`:''}
      </div>
      ${podeNovar?`<button class="btn-nova-tent" onclick="iniciarNovaTentativa()">▶ NOVA TENTATIVA (${tentRestantes} restante${tentRestantes!==1?'s':''})</button>`:''}
      <a class="btn-voltar-res" href="/aluno/atividades.html">← Voltar para atividades</a>
    </div>`;
  document.body.appendChild(ov);
}

// ── Iniciar nova tentativa ─────────────────────────────────────
window.iniciarNovaTentativa = async function() {
  document.querySelector(".resultado-overlay")?.remove();
  if (!isTeste) {
    const snap = await get(controleRef);
    controle = snap.exists() ? snap.val() : controle;
  }

  const gRestMs = isTeste ? DURACAO_GLOBAL_MS : globalRestanteMs(controle);
  if (!isTeste && gRestMs < MIN_PARA_TENTATIVA_MS) { mostrarBloqueada('tempo', controle); return; }
  if (!isTeste && (controle.tentativas_realizadas||0) >= MAX_TENTATIVAS) { mostrarBloqueada('tentativas', controle); return; }

  const novaTent = isTeste ? 1 : (controle.tentativas_realizadas||0) + 1;
  if (!isTeste) await update(controleRef, { tentativas_realizadas: novaTent });
  controle.tentativas_realizadas = novaTent;

  const duracaoSessao = Math.min(DURACAO_SESSAO_S, Math.floor(gRestMs/1000));
  st = novoEstado(duracaoSessao);

  const agora = dataAgora();
  for (const al of alunos) {
    st.resultadoIds[al] = await addResultado({
      aluno: al, turma, atividade: liberada.atividade,
      modo: "avaliacao_plus", concluido: false,
      pontuacao: 0, data: agora, ts_inicio: st.inicioTs, tentativa_num: novaTent,
      ...(isTeste ? { modo_teste: true } : {}),
    });
  }

  iniciarSessaoTimer();
  // Iniciar Fase 1
  st.f1.inicioMs = Date.now();
  st.questaoAtual = st.f1.questoes[0];
  st.questaoInicioTs = Date.now();
  st.questaoRegistrada = false;
  renderQuestaoF1();
};

// ── Tela bloqueada ─────────────────────────────────────────────
function mostrarBloqueada(motivo, ctrl) {
  document.body.classList.add('arcade-mode');
  const titulo = motivo==='tentativas' ? 'Avaliação Encerrada' : 'Tempo Esgotado';
  const sub    = motivo==='tentativas'
    ? 'Você já utilizou todas as tentativas disponíveis.'
    : 'O tempo global de 30 minutos foi esgotado.';
  const melhor = ctrl?.melhor_pontuacao || 0;
  const tentUsadas = ctrl?.tentativas_realizadas || 0;

  document.getElementById("content").innerHTML = `
    <div class="bloqueada-wrap">
      <div class="bloqueada-icon">${motivo==='tentativas'?'🔒':'⏰'}</div>
      <div class="bloqueada-title">${titulo}</div>
      <div class="bloqueada-sub">${sub}</div>
      <div class="bloqueada-stats">
        <div class="bloqueada-stat">
          <div class="bloqueada-stat-val">${melhor}</div>
          <div class="bloqueada-stat-lbl">Melhor resultado</div>
        </div>
        <div class="bloqueada-stat">
          <div class="bloqueada-stat-val">${tentUsadas} / ${MAX_TENTATIVAS}</div>
          <div class="bloqueada-stat-lbl">Tentativas usadas</div>
        </div>
      </div>
      <a href="/aluno/atividades.html" class="btn btn-blue" style="text-decoration:none;padding:14px 36px;font-size:14px">← Voltar para atividades</a>
    </div>`;
}

// ── Tela pré-jogo ──────────────────────────────────────────────
function mostrarPreJogo(ctrl) {
  document.body.classList.add('arcade-mode');
  const tentUsadas   = ctrl?.tentativas_realizadas || 0;
  const tentRestantes = MAX_TENTATIVAS - tentUsadas;
  const gRestMs      = ctrl ? globalRestanteMs(ctrl) : DURACAO_GLOBAL_MS;
  const melhor       = ctrl?.melhor_pontuacao || 0;
  const melhorNq     = ctrl?.melhor_nota_quiz || 0;

  document.getElementById("content").innerHTML = `
    <div class="pre-wrap">
      <div class="pre-title">AVALIAÇÃO+</div>
      <div class="pre-sub">${liberada.atividade.toUpperCase()} · TURMA ${turma}</div>
      <div class="pre-info-grid">
        <div class="pre-info-box">
          <div class="pre-info-val">${tentRestantes}</div>
          <div class="pre-info-lbl">Tentativas</div>
        </div>
        <div class="pre-info-box">
          <div class="pre-info-val" style="font-size:15px">${formatTempo(Math.max(0,Math.ceil(gRestMs/1000)))}</div>
          <div class="pre-info-lbl">Tempo global</div>
        </div>
        <div class="pre-info-box">
          <div class="pre-info-val">${DURACAO_SESSAO_S/60}min</div>
          <div class="pre-info-lbl">Por sessão</div>
        </div>
      </div>
      ${melhorNq>0||melhor>0
        ? `<div class="pre-melhor">🏆 quiz ${melhorNq.toFixed(1)}/10 · F2 ${melhor}pts</div><div class="pre-melhor-lbl">Suas melhores marcas</div>`
        : `<div class="pre-melhor-lbl" style="margin-bottom:22px">Primeira tentativa — boa sorte!</div>`}
      <div class="pre-regras">
        <strong>Fase 1 — Quiz (8 questões)</strong><br>
        • 5 fáceis → 2 médias → 1 difícil · sem timer por questão<br>
        • Valores base: Fácil <strong>1pt</strong> · Média <strong>2pt</strong> · Difícil <strong>3pt</strong> · Máx <strong>12pt</strong><br>
        • 3 tentativas por questão: 1ª ×1,0 · 2ª ×0,75 · 3ª ×0,50<br>
        • Errou as 3 → <strong>0pt</strong> nessa questão · avança para a próxima<br>
        • Você sempre responde todas as 8 questões
        <div class="phase-block">
          <strong>Fase 2 — Livre (tempo restante da sessão)</strong><br>
          • Questões aleatórias com timer por questão<br>
          • Fácil: <strong>4pt · 10s</strong> &nbsp; Médio: <strong>8pt · 40s</strong><br>
          • Errou/pulou → penalidade −50% base
        </div>
        <div class="phase-block">
          <strong>Cronômetro global de 30 min — não para entre tentativas</strong><br>
          • Sessão de <strong>8 min</strong> compartilhados entre as duas fases<br>
          • Máximo de <strong>3 tentativas</strong> · vale a <strong>melhor</strong> delas
        </div>
      </div>
      <button class="btn-iniciar" onclick="iniciarJogo()">▶ INICIAR!</button>
    </div>`;
}

// ── Iniciar jogo ───────────────────────────────────────────────
window.iniciarJogo = async function() {
  const btn = document.querySelector('.btn-iniciar');
  if (btn) btn.disabled = true;
  document.getElementById("content").innerHTML =
    `<div style="text-align:center;padding:50px;color:#2a2a50;font-family:'Orbitron',monospace;font-size:12px;letter-spacing:3px">CARREGANDO…</div>`;

  if (!controle) {
    controle = { inicio_global: Date.now(), tentativas_realizadas: 1, melhor_pontuacao: 0, melhor_bruta: 0, melhor_nota_quiz: 0 };
    if (!isTeste) await set(controleRef, { ...controle });
  } else {
    const novaTent = (controle.tentativas_realizadas||0) + 1;
    if (!isTeste) await update(controleRef, { tentativas_realizadas: novaTent });
    controle.tentativas_realizadas = novaTent;
  }

  const gRestMs = globalRestanteMs(controle);
  const duracaoSessao = Math.min(DURACAO_SESSAO_S, Math.floor(gRestMs/1000));
  if (duracaoSessao <= 0) { mostrarBloqueada('tempo', controle); return; }

  st = novoEstado(duracaoSessao);

  const agora = dataAgora();
  for (const al of alunos) {
    st.resultadoIds[al] = await addResultado({
      aluno: al, turma, atividade: liberada.atividade,
      modo: "avaliacao_plus", concluido: false,
      pontuacao: 0, data: agora, ts_inicio: st.inicioTs, tentativa_num: controle.tentativas_realizadas,
      ...(isTeste ? { modo_teste: true } : {}),
    });
  }

  iniciarSessaoTimer();
  // Iniciar Fase 1
  st.f1.inicioMs = Date.now();
  st.questaoAtual = st.f1.questoes[0];
  st.questaoInicioTs = Date.now();
  st.questaoRegistrada = false;
  renderQuestaoF1();
};

// ── Encerrar manual ────────────────────────────────────────────
window.pedirEncerrar = function() {
  if (!st || st.finalizado || st.transicao) return;
  document.getElementById("encerrar-modal")?.remove();
  const info = st.fase === 1
    ? `Fase 1 em andamento · Pontos: <strong style="color:#FAB800">${fmtPts(st.f1.pontos)}</strong>`
    : `Fase 2 · Pontuação: <strong style="color:#FAB800">${st.saldo} pts</strong>`;
  const ov = document.createElement("div");
  ov.id = "encerrar-modal";
  ov.className = "encerrar-modal-ov";
  ov.innerHTML = `
    <div class="encerrar-modal-card">
      <div style="font-size:20px;margin-bottom:8px">🏁 Encerrar sessão?</div>
      <div style="font-size:13px;color:#9999dd;margin-bottom:16px">${info}</div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-red" style="flex:1;justify-content:center" onclick="confirmarEncerrar()">Encerrar</button>
        <button class="btn" style="flex:1;justify-content:center;background:#1a1a3a;color:#9999dd;border-color:#3a3a6a" onclick="cancelarEncerrar()">Cancelar</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
};

window.confirmarEncerrar = function() {
  document.getElementById("encerrar-modal")?.remove();
  if (!st || st.finalizado) return;
  clearInterval(st.timerInterval);
  if (st.fase === 1) encerrarFase1('manual');
  else encerrarSessao('manual');
};

window.cancelarEncerrar = function() {
  document.getElementById("encerrar-modal")?.remove();
};

window.addEventListener("beforeunload", () => {
  if (st) { clearInterval(st.timerInterval); clearInterval(st.sessaoInterval); }
});

// ── Init ───────────────────────────────────────────────────────
const controleSnap = isTeste ? null : await get(controleRef);
controle = controleSnap?.exists() ? controleSnap.val() : null;

if (controle) {
  const gRestMs = globalRestanteMs(controle);
  if ((controle.tentativas_realizadas||0) >= MAX_TENTATIVAS) mostrarBloqueada('tentativas', controle);
  else if (gRestMs < MIN_PARA_TENTATIVA_MS) mostrarBloqueada('tempo', controle);
  else mostrarPreJogo(controle);
} else {
  mostrarPreJogo(null);
}
</script>
</body>
</html>
