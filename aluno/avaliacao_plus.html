      <div class="pre-info-grid">
        <div class="pre-info-box">
          <div class="pre-info-val">${tentRestantes}</div>
          <div class="pre-info-lbl">Tentativas</div>
        </div>
        <div class="pre-info-box">
          <div class="pre-info-val" style="font-size:15px">${formatTempo(Math.max(0,Math.ceil(gRestMs/1000)))}</div>
          <div class="pre-info-lbl">Tempo global</div>
        </div>
        <div class="pre-info-box">
          <div class="pre-info-val">${DURACAO_SESSAO_S/60}min</div>
          <div class="pre-info-lbl">Por sessão</div>
        </div>
      </div>
      ${melhorNq>0||melhor>0
        ? `<div class="pre-melhor">🏆 quiz ${melhorNq.toFixed(1)}/10 · F2 ${melhor}pts</div><div class="pre-melhor-lbl">Suas melhores marcas</div>`
        : `<div class="pre-melhor-lbl" style="margin-bottom:22px">Primeira tentativa — boa sorte!</div>`}
      <div class="pre-regras">
        <strong>Fase 1 — Quiz (8 questões)</strong><br>
        • 2 fáceis (Área de triângulo) · 4 médias (Pitágoras, divisão de área, multiplicação m², área composta) · 1 difícil<br>
        • Pontuação: Fácil <strong>1pt</strong> · Média <strong>1pt</strong> · Difícil <strong>3pt</strong> · Máx <strong>10pt</strong><br>
        • Você escolhe a ordem pelo mapa — responda em qualquer sequência<br>
        • 3 tentativas por questão: 1ª ×1,0 · 2ª ×0,75 · 3ª ×0,50<br>
        • Questão não respondida = <strong>0pt</strong> · timer individual por questão
        <div class="phase-block">
          <strong>Fase 2 — Livre (tempo restante da sessão)</strong><br>
          • Fácil: <strong>4pt · 10s</strong> &nbsp; Médio: <strong>8pt · 40s</strong><br>
          • 3 tentativas por questão · 1ª ×1,0 · 2ª ×0,75 · 3ª ×0,50<br>
          • Errou as 3 ou timer esgotou → penalidade <strong>−50%</strong> da base<br>
          • Acerto rápido (1ª tent., sem ajuda, tempo &lt; 50% do timer) → <strong>+1–2pt bônus ⚡</strong><br>
          • A cada 3 acertos rápidos → <strong>+1 ajuda 🎯</strong> (máx 3)<br>
          • Ajuda: converte para múltipla escolha sem desconto de pontos<br>
          • A cada 10 acertos rápidos → <strong>🏆 questão bônus</strong> (Difícil · 24pt · 90s · sem penalidade)<br>
          • Terminou sem penalidade e ≥3 respondidas → <strong>+20pt bônus fim</strong>
        </div>
        <div class="phase-block">
          <strong>Cronômetro global de 25 min — não para entre tentativas</strong><br>
          • Máximo de <strong>3 tentativas</strong> · a melhor nota é registrada automaticamente<br>
          • Nota final = pontos obtidos (máx 10) · sem conversão de escala<br>
          • Se o tempo acabar durante uma tentativa: encerra e salva normalmente
        </div>
      </div>
      <button class="btn-iniciar" onclick="iniciarJogo()">▶ INICIAR!</button>
    </div>`;
}

// ── Iniciar jogo ───────────────────────────────────────────────
window.iniciarJogo = async function() {
  tentativasHist = [];  // histórico limpo para esta sessão de página
  const btn = document.querySelector('.btn-iniciar');
  if (btn) btn.disabled = true;

  // ── Re-verificar bloqueio ao clicar "Iniciar" (estado pode ter mudado) ──
  const _bloqueadosClick = await verificarBloqueio();
  if (_bloqueadosClick.length > 0) {
    if (btn) btn.disabled = false;
    mostrarModalBloqueio(_bloqueadosClick);
    return;
  }

  document.getElementById("content").innerHTML =
    `<div style="text-align:center;padding:50px;color:#2a2a50;font-family:'Orbitron',monospace;font-size:12px;letter-spacing:3px">CARREGANDO…</div>`;

  // Próxima tentativa lida do Firebase (fonte única de verdade)
  const _tentNum = isTeste ? 1 : await _getProximaTentativa();

  if (!controle) {
    controle = { inicio_global: Date.now(), tentativas_realizadas: _tentNum,
                 melhor_pontuacao: 0, melhor_bruta: 0, melhor_nota_quiz: 0 };
    if (!isTeste) await Promise.all(controleRefs.map(r => set(r, { ...controle })));
  } else {
    if (!isTeste) await Promise.all(controleRefs.map(r =>
      update(r, { tentativas_realizadas: _tentNum })));
    controle.tentativas_realizadas = _tentNum;
  }

  // ── Sincronizar avaliacoes_sessoes (sem apagar dados existentes) ──
  await sincronizarSessaoRefs(_tentNum, controle.inicio_global);

  _warned10 = false;
  const duracaoSessao = DURACAO_SESSAO_S; // sempre 8 min fixos por tentativa

  st = novoEstado(duracaoSessao);

  const agora = dataAgora();
  for (const al of alunos) {
    st.resultadoIds[al] = await addResultado({
      aluno: al, turma, atividade: liberada.atividade,
      modo: "avaliacao_plus", concluido: false,
      pontuacao: 0, data: agora, ts_inicio: st.inicioTs,
      tentativa_num: _tentNum,
      ...(isTeste ? { modo_teste: true } : {}),
    });
  }
  await _registrarInicioTentativa(_tentNum);

  iniciarSessaoTimer();
  if (!isTeste) (async () => { try {
    const { atualizarPresenca } = await import('/js/presenca.js');
    await atualizarPresenca({ status: 'indisponivel', pagina: 'avaliacao' });
  } catch(_) {} })();
  // Iniciar Fase 1
  st.f1.inicioMs = Date.now();
  st.questaoAtual = st.f1.questoes[0];
  st.questaoInicioTs = Date.now();
  st.questaoRegistrada = false;
  renderQuestaoF1();
};

// ── Encerrar manual ────────────────────────────────────────────
window.pedirEncerrar = function() {
  if (!st || st.finalizado || st.transicao) return;
  document.getElementById("encerrar-modal")?.remove();
  const info = st.fase === 1
    ? `Fase 1 em andamento · Pontos: <strong style="color:#FAB800">${fmtPts(st.f1.pontos)}</strong>`
    : `Fase 2 · Pontuação: <strong style="color:#FAB800">${st.saldo} pts</strong>`;
  const ov = document.createElement("div");
  ov.id = "encerrar-modal";
  ov.className = "encerrar-modal-ov";
  ov.innerHTML = `
    <div class="encerrar-modal-card">
      <div style="font-size:20px;margin-bottom:8px">🏁 Encerrar sessão?</div>
      <div style="font-size:13px;color:#9999dd;margin-bottom:16px">${info}</div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-red" style="flex:1;justify-content:center" onclick="confirmarEncerrar()">Encerrar</button>
        <button class="btn" style="flex:1;justify-content:center;background:#1a1a3a;color:#9999dd;border-color:#3a3a6a" onclick="cancelarEncerrar()">Cancelar</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
};

window.confirmarEncerrar = function() {
  document.getElementById("encerrar-modal")?.remove();
  if (!st || st.finalizado) return;
  clearInterval(st.timerInterval);
  if (st.fase === 1) encerrarFase1('manual');
  else encerrarSessao('manual');
};

window.cancelarEncerrar = function() {
  document.getElementById("encerrar-modal")?.remove();
};

// ── Interceptar navegação durante sessão ──────────────────────
function _alertaSairQuiz(e) {
  if (!st || st.finalizado) return;
  e.preventDefault();
  e.returnValue = '';
}
window.addEventListener('beforeunload', (e) => {
  if (st && !st.finalizado) { e.preventDefault(); e.returnValue = ''; }
  if (st) { clearInterval(st.timerInterval); clearInterval(st.sessaoInterval); }
});

function mostrarModalSair(href) {
  document.getElementById('sair-quiz-modal')?.remove();
  navegacaoPendente = href;
  const info = !st ? '' : st.fase === 1
    ? `Fase 1 · Pontos: <strong style="color:#FAB800">${fmtPts(st.f1.pontos)}</strong>`
    : `Fase 2 · Pontuação: <strong style="color:#FAB800">${st.saldo} pts</strong>`;
  const ov = document.createElement('div');
  ov.id = 'sair-quiz-modal';
  ov.className = 'encerrar-modal-ov';
  ov.innerHTML = `
    <div class="encerrar-modal-card">
      <div style="font-size:20px;margin-bottom:8px">⚠️ Sair da atividade?</div>
      <div style="font-size:13px;color:#9999dd;margin-bottom:6px;line-height:1.6">A atividade será encerrada e as respostas salvas.</div>
      <div style="font-size:12px;color:#6060a0;margin-bottom:18px">${info}</div>
      <button onclick="confirmarSairQuiz()" style="width:100%;padding:13px;background:linear-gradient(135deg,#DC2626,#B91C1C);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Orbitron',monospace;letter-spacing:1px;margin-bottom:10px">Salvar e sair</button>
      <button onclick="fecharModalSair()" style="width:100%;padding:10px;background:transparent;border:1.5px solid #2a2a50;border-radius:10px;color:#5a5a90;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif">Continuar</button>
    </div>`;
  document.body.appendChild(ov);
}

window.fecharModalSair = function() {
  document.getElementById('sair-quiz-modal')?.remove();
  navegacaoPendente = null;
};

window.confirmarSairQuiz = async function() {
  document.getElementById('sair-quiz-modal')?.remove();
  if (st && !st.finalizado) {
    clearInterval(st.timerInterval);
    clearInterval(st.sessaoInterval);
    await encerrarSessao('manual');
  }
  if (navegacaoPendente) window.location.href = navegacaoPendente;
};

document.addEventListener('click', function(e) {
  if (!st || st.finalizado) return;
  const link = e.target.closest('a[href]');
  if (!link) return;
  const href = link.getAttribute('href');
  if (!href || href.startsWith('#') || href.startsWith('javascript')) return;
  e.preventDefault();
  e.stopPropagation();
  mostrarModalSair(link.href);
}, true);

// ── Verificação de bloqueio via avaliacoes_sessoes ────────────
async function verificarBloqueio() {
  if (isTeste || !sessaoRefs.length) return [];
  const snaps = await Promise.all(sessaoRefs.map(r => get(r).catch(() => null)));
  const bloqueados = [];
  for (let i = 0; i < snaps.length; i++) {
    if (!snaps[i]?.exists()) continue;
    const d = snaps[i].val();
    const tentativas  = d.tentativas_usadas || 0;
    const decorrido   = Date.now() - (d.inicio || Date.now());
    if (tentativas >= MAX_TENTATIVAS || decorrido >= DURACAO_GLOBAL_MS) {
      const motivo = tentativas >= MAX_TENTATIVAS ? 'tentativas' : 'tempo';
      bloqueados.push({ nome: alunos[i], motivo });
    }
  }
  return bloqueados;
}

function mostrarModalBloqueio(bloqueados) {
  document.getElementById('bloqueio-modal')?.remove();
  const _esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const nomes = bloqueados.map(b => `<strong style="color:#F87171">${_esc(b.nome)}</strong>`).join(' e ');
  const plural = bloqueados.length > 1;
  const texto  = `${nomes} já ${plural ? 'realizaram' : 'realizou'} esta atividade e ${plural ? 'esgotaram suas' : 'esgotou suas'} tentativas/tempo disponível. Para continuar, faça login com outro aluno.`;
  const ov = document.createElement('div');
  ov.id = 'bloqueio-modal';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)';
  ov.innerHTML = `
    <div style="background:#0d0d28;border:2px solid rgba(239,68,68,.5);border-radius:20px;padding:32px 28px;max-width:380px;width:100%;text-align:center;box-shadow:0 0 60px rgba(239,68,68,.25)">
      <div style="font-size:52px;margin-bottom:10px">⚠️</div>
      <div style="font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:#F87171;margin-bottom:12px;letter-spacing:1px">Atividade já realizada</div>
      <div style="font-size:13px;color:#9999cc;margin-bottom:24px;line-height:1.7">${texto}</div>
      <button onclick="window.sair()" style="width:100%;padding:13px;background:linear-gradient(135deg,#DC2626,#B91C1C);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Orbitron',monospace;letter-spacing:1px;margin-bottom:10px">🔄 Fazer novo login</button>
      <button onclick="document.getElementById('bloqueio-modal').remove()" style="width:100%;padding:10px;background:transparent;border:1.5px solid #2a2a50;border-radius:10px;color:#5a5a90;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif">Cancelar</button>
    </div>`;
  document.body.appendChild(ov);
}

// Sincroniza avaliacoes_sessoes para TODOS os alunos da sessão (só escrita, nunca apaga)
async function sincronizarSessaoRefs(tentativas, inicio) {
  if (isTeste || !sessaoRefs.length) return;
  await Promise.all(sessaoRefs.map(async r => {
    const snap = await get(r).catch(() => null);
    if (!snap?.exists()) await set(r, { inicio, tentativas_usadas: tentativas });
    else await update(r, { tentativas_usadas: tentativas });
  }));
}

// ── Init ───────────────────────────────────────────────────────
// Lê controle de TODOS os alunos e usa o que tiver mais tentativas
// (evita que aluno em dupla burle o limite usando outra dupla depois)
if (!isTeste) {
  const snaps = await Promise.all(controleRefs.map(r => get(r).catch(() => null)));
  for (let i = 0; i < snaps.length; i++) {
    if (!snaps[i]?.exists()) continue;
    const val = snaps[i].val();
    if (!controle || (val.tentativas_realizadas||0) > (controle.tentativas_realizadas||0)) {
      controle = val;
      controleRef = controleRefs[i];
    }
  }
}

// Verificar bloqueio via avaliacoes_sessoes (tem prioridade — mostra modal específico)
const _bloqueadosInit = await verificarBloqueio();
if (_bloqueadosInit.length > 0) {
  mostrarModalBloqueio(_bloqueadosInit);
} else if (controle && (controle.tentativas_realizadas||0) >= MAX_TENTATIVAS) {
  mostrarBloqueada('tentativas', controle);
} else {
  mostrarPreJogo(controle || null);
}
</script>
