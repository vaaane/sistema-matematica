<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Competição — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    body{-webkit-user-select:none;user-select:none;-ms-user-select:none;}
    input,button{-webkit-user-select:auto;user-select:auto;}

    .comp-hud{display:flex;align-items:center;gap:16px;padding:12px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;flex-wrap:wrap;}
    .hud-lives{display:flex;gap:4px;align-items:center;}
    .vida{font-size:22px;transition:all .25s;}
    .vida.lost{opacity:.18;transform:scale(.8);}
    .hud-sep{color:var(--border);font-size:18px;}
    .hud-pts{font-size:24px;font-weight:800;color:var(--gold);}
    .hud-pts-lbl{font-size:11px;color:var(--text-muted);margin-top:-2px;}
    .hud-q{margin-left:auto;font-size:12px;color:var(--text-muted);font-weight:600;}

    .timer-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
    .timer-track{flex:1;height:10px;background:var(--border);border-radius:5px;overflow:hidden;}
    .timer-fill{height:100%;border-radius:5px;background:#22C55E;transition:width .95s linear,background .3s;}
    .timer-txt{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;min-width:36px;text-align:right;color:var(--text);}
    .timer-txt.urgente{color:var(--red);}

    .comp-layout{display:grid;grid-template-columns:1fr 220px;gap:18px;align-items:start;}
    @media(max-width:700px){.comp-layout{grid-template-columns:1fr}.ranking-card{display:none!important}}

    .question-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 24px 18px;}
    .q-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:14px;}
    .q-badge.facil{background:#DCFCE7;color:#15803D;}
    .q-badge.media{background:#FEF9C3;color:#854D0E;}
    .q-badge.dificil{background:#FEE2E2;color:#B91C1C;}
    .q-text{font-size:19px;font-weight:700;line-height:1.5;margin-bottom:20px;cursor:default;pointer-events:none;}
    .answer-area{display:flex;gap:10px;margin-bottom:12px;}
    .answer-area .input{flex:1;font-size:16px;}
    .mc-grid{display:grid;gap:8px;margin-bottom:12px;}
    .mc-btn{padding:12px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);font-size:14px;font-weight:600;cursor:pointer;transition:background .12s,border-color .12s;font-family:'Inter',sans-serif;text-align:left;}
    .mc-btn:hover:not(:disabled){background:var(--blue-pale);border-color:var(--blue);}
    .mc-btn.correto{background:#F0FDF4!important;border-color:#22C55E!important;color:#15803D!important;}
    .mc-btn.errado{background:#FEF2F2!important;border-color:#EF4444!important;color:#B91C1C!important;}
    .mc-btn:disabled{cursor:default;}
    #feedback{min-height:38px;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;font-size:14px;font-weight:600;transition:all .2s;margin-top:4px;}
    #feedback.ok{background:#F0FDF4;color:#15803D;border:1px solid #BBF7D0;}
    #feedback.err{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;}
    #feedback.hidden{opacity:0;min-height:0;padding:0;border:none;}

    .ranking-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;position:sticky;top:80px;}
    .rank-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
    .rank-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;margin-bottom:3px;}
    .rank-row.eu{background:var(--blue-pale);border:1px solid #BAE6FD;}
    .rank-pos{font-size:13px;font-weight:700;width:22px;text-align:center;flex-shrink:0;}
    .rank-info{flex:1;overflow:hidden;}
    .rank-nome{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .rank-turma{font-size:10px;color:var(--text-muted);}
    .rank-pts{font-size:13px;font-weight:800;color:var(--gold);flex-shrink:0;}

    .fim-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:1000;}
    .fim-card{background:#fff;border-radius:16px;padding:36px 28px;text-align:center;max-width:380px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3);}
    .fim-icon{font-size:52px;margin-bottom:12px;}
    .fim-pts{font-size:52px;font-weight:800;color:var(--gold);line-height:1;}
    .fim-pts-lbl{color:var(--text-muted);font-size:13px;margin-bottom:20px;}
    .fim-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
    .fim-stat{background:var(--bg);border-radius:8px;padding:10px 6px;}
    .fim-stat-val{font-size:20px;font-weight:800;}
    .fim-stat-lbl{font-size:10px;color:var(--text-muted);margin-top:2px;}
    .hint-unidade{font-size:12px;color:var(--text-muted);margin-bottom:6px;}
    .q-tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;margin-bottom:10px;margin-right:4px;}
    .q-tag.figuras{background:#EDE9FE;color:#6D28D9;}
    .q-tag.perimetro{background:#DBEAFE;color:#1D4ED8;}
    .q-tag.area{background:#DCFCE7;color:#15803D;}
  </style>
</head>
<body oncontextmenu="return false">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title" id="topbar-title">Competição</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-ghost" style="color:var(--red);border-color:#FECACA;font-size:13px" onclick="pedirEncerrar()">Encerrar</button>
      </div>
    </div>
    <div class="content" id="content">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">Iniciando…</div>
    </div>
  </div>
</div>

<script>(()=>{const t=localStorage.getItem("tema");if(t==="escuro")document.documentElement.setAttribute("data-theme","dark");})()</script>
<script type="module">
import { respostasEquivalentes, dataAgora } from "/js/constants.js";
import { addResultado, updateResultado, getLiberadasParaTurma, listenRankingAtividade, getAtividadeStatus, addConquista, hasConquista } from "/js/db.js";
import { requireAluno, renderSidebarAluno, clearSession } from "/js/auth.js";
import { initAvBanner } from "/js/avaliacao_banner.js";

// ── Bloquear cópia de texto ──────────────────────────────────
document.addEventListener('keydown', e => {
  const tag = e.target.tagName.toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if ((e.ctrlKey || e.metaKey) && ['c','a','x','u','s'].includes(e.key.toLowerCase())) e.preventDefault();
});

// ── Auth ─────────────────────────────────────────────────────
const sess = requireAluno();
if (!sess) throw new Error();
renderSidebarAluno("sidebar", "atividades");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };
const { alunos, turma } = sess;
initAvBanner(turma, alunos[0]);

// ── Verificar liberação ───────────────────────────────────────
const nomeAtivParam = new URLSearchParams(window.location.search).get("ativ");
if (!nomeAtivParam) { window.location.href = "/aluno/atividades.html"; throw new Error(); }
const liberadas = await getLiberadasParaTurma(turma);
const liberada = liberadas.find(l => l.atividade === nomeAtivParam);
if (!liberada) {
  alert("Esta atividade não está mais liberada para sua turma.");
  window.location.href = "/aluno/atividades.html"; throw new Error();
}

// Verificar status manual da atividade
const statusInfoComp = await getAtividadeStatus(turma, liberada.atividade);
if (statusInfoComp.status === 'encerrada') {
  alert("Atividade encerrada pela professora.");
  window.location.href = "/aluno/atividades.html"; throw new Error();
}
if (statusInfoComp.status !== 'ativa') {
  if (!confirm(`Atenção: esta atividade vale ${statusInfoComp.percentual}% da nota agora. Deseja continuar?`)) {
    window.location.href = "/aluno/atividades.html"; throw new Error();
  }
}

document.getElementById("topbar-title").textContent = liberada.atividade;
const pctLabelComp = statusInfoComp.percentual < 100 ? ` · ⏰ ${statusInfoComp.percentual}%` : '';
document.getElementById("topbar-sub").textContent = `Turma ${turma} · Competição ao vivo${pctLabelComp}`;

// ── Carregar templates ────────────────────────────────────────
const resp = await fetch("/dados/questoes_competicao.json");
const templates = await resp.json();

// ── Utilitários ───────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function avaliarExpr(expr, vars) {
  try {
    return new Function(...Object.keys(vars), `"use strict";return(${expr})`)(...Object.values(vars));
  } catch(e) { return null; }
}

function gerarQuestao() {
  const CICLO = [1, 1, 2, 1, 2, 1, 3, 1, 2]; // 5 fáceis · 3 médias · 1 difícil por rodada
  const dif = CICLO[st.cicloIdx % CICLO.length];
  st.cicloIdx++;
  if (st.poolIdx[dif] >= st.pools[dif].length) {
    st.pools[dif] = shuffle(templates.filter(t => t.dificuldade === dif));
    st.poolIdx[dif] = 0;
  }
  const t = st.pools[dif][st.poolIdx[dif]++];

  let vars = {}, resposta, opcoes = t.opcoes ? [...t.opcoes] : null;

  if (t.conjuntos) {
    const c = t.conjuntos[Math.floor(Math.random() * t.conjuntos.length)];
    vars = { ...c };
    resposta = String(c.resposta);
    if (c.opcoes) opcoes = [...c.opcoes];
  } else {
    for (const [k, v] of Object.entries(t.variaveis)) {
      vars[k] = Array.isArray(v) ? v[Math.floor(Math.random() * v.length)]
                                 : v.min + Math.floor(Math.random() * (v.max - v.min + 1));
    }
    resposta = String(avaliarExpr(t.resposta_expr, vars));
  }

  let enunciado = t.enunciado;
  for (const [k, v] of Object.entries(vars)) enunciado = enunciado.replaceAll(`{${k}}`, v);

  return { enunciado, resposta, opcoes, tipo: t.tipo, pontos: t.pontos, timer: t.timer, dificuldade: t.dificuldade, unidade: t.unidade || '', tag: t.tag || '' };
}

function beep(freq, dur) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur / 1000);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + dur / 1000);
  } catch(e) {}
}

function getMedal(i) { return ['🥇','🥈','🥉'][i] || String(i + 1); }

// ── Estado ────────────────────────────────────────────────────
const st = {
  // Sequência intercalada: Fácil → Média → Difícil → Fácil → …
  cicloIdx: 0,
  pools: {
    1: shuffle(templates.filter(t => t.dificuldade === 1)),
    2: shuffle(templates.filter(t => t.dificuldade === 2)),
    3: shuffle(templates.filter(t => t.dificuldade === 3)),
  },
  poolIdx: { 1: 0, 2: 0, 3: 0 },
  pontuacao: 0, acertos: 0, erros: 0, respondidas: 0,
  comboAtual: 0, comboMax: 0,
  vidas: 3, finalizado: false, processando: false,
  inicioTs: Date.now() / 1000,
  resultadoIds: {},
  timerInterval: null, timerRestante: 0,
  questaoAtual: null,
};

// ── Registro inicial no Firebase ──────────────────────────────
const agora = dataAgora();
for (const al of alunos) {
  const id = await addResultado({
    aluno: al, turma, atividade: liberada.atividade,
    modo: "competicao", concluido: false,
    pontuacao: 0, acertos: 0, erros: 0, respondidas: 0,
    vidas: 3, tempo: "0s", data: agora,
  });
  st.resultadoIds[al] = id;
}

// ── Checkpoint (a cada 3 acertos) ────────────────────────────
async function checkpoint() {
  const t = Math.round(Date.now() / 1000 - st.inicioTs);
  for (const al of alunos) {
    updateResultado(st.resultadoIds[al], {
      pontuacao: st.pontuacao, acertos: st.acertos,
      erros: st.erros, respondidas: st.respondidas,
      vidas: st.vidas, tempo: `${t}s`,
    }).catch(() => {});
  }
}

// ── Ranking ao vivo ───────────────────────────────────────────
let unsubRanking = () => {};
unsubRanking = listenRankingAtividade(liberada.atividade, ranking => {
  renderRanking(ranking);
});
window.addEventListener("beforeunload", () => unsubRanking());

function renderRanking(ranking) {
  const el = document.getElementById("ranking-list");
  if (!el) return;
  if (!ranking.length) {
    el.innerHTML = '<div style="font-size:12px;color:var(--text-muted);padding:6px 0">Nenhum resultado ainda.</div>';
    return;
  }
  el.innerHTML = ranking.map((r, i) => {
    const eu = alunos.includes(r.aluno);
    return `<div class="rank-row${eu?' eu':''}">
      <div class="rank-pos">${getMedal(i)}</div>
      <div class="rank-info">
        <div class="rank-nome">${r.aluno}${eu?' ★':''}</div>
        <div class="rank-turma">${r.turma}${r.concluido?'':' · ⚡'}</div>
      </div>
      <div class="rank-pts">${r.pontuacao}</div>
    </div>`;
  }).join('');
}

// ── Render HUD ────────────────────────────────────────────────
function renderHUD() {
  const vidasEl = document.getElementById("hud-lives");
  if (vidasEl) {
    vidasEl.innerHTML = [0,1,2].map(i => `<span class="vida${i >= st.vidas ? ' lost' : ''}">❤️</span>`).join('');
  }
  const ptsEl = document.getElementById("hud-pts");
  if (ptsEl) ptsEl.textContent = st.pontuacao;
  const qEl = document.getElementById("hud-q");
  if (qEl) qEl.textContent = `Q${st.respondidas + 1}`;
}

// ── Timer ─────────────────────────────────────────────────────
function iniciarTimer(segundos) {
  clearInterval(st.timerInterval);
  st.timerRestante = segundos;
  atualizarTimer();
  st.timerInterval = setInterval(() => {
    st.timerRestante = Math.max(0, st.timerRestante - 1);
    atualizarTimer();
    if (st.timerRestante <= 0) {
      clearInterval(st.timerInterval);
      tempoEsgotado();
    }
  }, 1000);
}

function atualizarTimer() {
  const fill = document.getElementById("timer-fill");
  const txt = document.getElementById("timer-txt");
  if (!fill || !st.questaoAtual) return;
  const pct = (st.timerRestante / st.questaoAtual.timer) * 100;
  fill.style.width = pct + "%";
  fill.style.background = pct > 50 ? "#22C55E" : pct > 25 ? "#F59E0B" : "#EF4444";
  if (txt) {
    txt.textContent = st.timerRestante + "s";
    txt.className = "timer-txt" + (pct <= 25 ? " urgente" : "");
  }
}

// ── Próxima questão ───────────────────────────────────────────
function proxima() {
  if (st.finalizado) return;
  st.questaoAtual = gerarQuestao();
  renderQuestao();
  iniciarTimer(st.questaoAtual.timer);
}

// ── Render questão ────────────────────────────────────────────
function renderQuestao() {
  const q = st.questaoAtual;
  const nivelMap = {1:["Fácil","facil","●"],2:["Média","media","◆"],3:["Difícil","dificil","■"]};
  const [nivel, cls, dot] = nivelMap[q.dificuldade] || nivelMap[1];

  const inputArea = q.tipo === "multipla_escolha"
    ? `<div class="mc-grid" id="mc-grid" style="grid-template-columns:${q.opcoes.length <= 2 ? '1fr 1fr' : q.opcoes.length === 3 ? '1fr' : '1fr 1fr'}">
        ${q.opcoes.map((op, i) => `<button class="mc-btn" id="mc-${i}" onclick="responderMC('${op.replace(/'/g,"\\'")}',${i})">${op}</button>`).join('')}
       </div>`
    : `${q.unidade ? `<div class="hint-unidade">Resposta em ${q.unidade} — apenas o número.</div>` : ''}
       <div class="answer-area">
         <input type="text" id="resp-input" class="input" inputmode="decimal" placeholder="Digite sua resposta…" autocomplete="off" autofocus onkeydown="if(event.key==='Enter')responderNum()"/>
         <button class="btn btn-blue" id="btn-resp" onclick="responderNum()">
           <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
           OK
         </button>
       </div>`;

  document.getElementById("content").innerHTML = `
    <div class="comp-hud">
      <div class="hud-lives" id="hud-lives"></div>
      <div class="hud-sep">·</div>
      <div>
        <div class="hud-pts" id="hud-pts">${st.pontuacao}</div>
        <div class="hud-pts-lbl">pontos</div>
      </div>
      <div class="hud-q" id="hud-q">Q${st.respondidas + 1}</div>
    </div>
    <div class="timer-wrap">
      <div class="timer-track"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
      <span class="timer-txt" id="timer-txt">${q.timer}s</span>
    </div>
    <div class="comp-layout">
      <div>
        <div class="question-card">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">
            <span class="q-badge ${cls}" style="margin-bottom:0">${dot} ${nivel} · +${q.pontos} pt${q.pontos > 1 ? 's' : ''}</span>
            ${q.tag ? `<span class="q-tag ${q.tag === 'figuras planas' ? 'figuras' : q.tag === 'perímetro' ? 'perimetro' : 'area'}">${q.tag === 'figuras planas' ? 'Figuras Planas' : q.tag === 'perímetro' ? 'Perímetro' : 'Área'}</span>` : ''}
          </div>
          <div class="q-text" id="q-text">${q.enunciado}</div>
          ${inputArea}
          <div id="feedback" class="hidden"></div>
        </div>
      </div>
      <div class="ranking-card">
        <div class="rank-title">
          <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:var(--gold)"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          Ranking ao Vivo
        </div>
        <div id="ranking-list"><div style="font-size:12px;color:var(--text-muted)">Carregando…</div></div>
      </div>
    </div>`;

  renderHUD();
  document.getElementById("resp-input")?.focus();
}

// ── Responder ─────────────────────────────────────────────────
window.responderMC = function(opcao, idx) {
  if (st.processando || st.finalizado) return;
  // Disable all MC buttons
  document.querySelectorAll(".mc-btn").forEach(b => b.disabled = true);
  processar(opcao, idx);
};

window.responderNum = function() {
  if (st.processando || st.finalizado) return;
  const inp = document.getElementById("resp-input");
  const val = inp ? inp.value.trim() : "";
  if (!val) { mostrarFeedback("err", "⚠️ Digite uma resposta."); return; }
  const btn = document.getElementById("btn-resp");
  if (btn) btn.disabled = true;
  if (inp) inp.disabled = true;
  processar(val, null);
};

function processar(resposta, mcIdx) {
  st.processando = true;
  clearInterval(st.timerInterval);
  const q = st.questaoAtual;
  const correto = respostasEquivalentes(resposta, q.resposta);

  st.respondidas++;

  if (correto) {
    st.pontuacao += q.pontos;
    st.acertos++;
    st.comboAtual++;
    if (st.comboAtual > st.comboMax) st.comboMax = st.comboAtual;
    beep(1000, 150);
    mostrarFeedback("ok", `✅ Correto! +${q.pontos} pt${q.pontos > 1 ? 's' : ''}`);
    if (mcIdx !== null) {
      const btn = document.getElementById(`mc-${mcIdx}`);
      if (btn) btn.classList.add("correto");
    }
    if (st.acertos % 3 === 0) checkpoint();
  } else {
    st.vidas--;
    st.erros++;
    st.comboAtual = 0;
    beep(400, 300);
    const respostaStr = q.resposta + (q.unidade ? " " + q.unidade : "");
    mostrarFeedback("err", `❌ Resposta: ${respostaStr} · −1 vida`);
    if (mcIdx !== null) {
      const btn = document.getElementById(`mc-${mcIdx}`);
      if (btn) btn.classList.add("errado");
      // Highlight correct answer
      q.opcoes.forEach((op, i) => {
        if (respostasEquivalentes(op, q.resposta)) {
          const b = document.getElementById(`mc-${i}`);
          if (b) b.classList.add("correto");
        }
      });
    }
  }

  renderHUD();

  if (st.vidas <= 0) {
    setTimeout(() => encerrarJogo(false), 2000);
  } else {
    setTimeout(() => { st.processando = false; proxima(); }, correto ? 1400 : 2000);
  }
}

function tempoEsgotado() {
  if (st.processando || st.finalizado) return;
  st.processando = true;
  const q = st.questaoAtual;
  st.vidas--;
  st.erros++;
  st.comboAtual = 0;
  st.respondidas++;
  beep(300, 400);
  const respostaStr = q.resposta + (q.unidade ? " " + q.unidade : "");
  mostrarFeedback("err", `⏱ Tempo! Resposta: ${respostaStr} · −1 vida`);
  // Disable inputs
  document.querySelectorAll(".mc-btn").forEach(b => b.disabled = true);
  const btn = document.getElementById("btn-resp");
  const inp = document.getElementById("resp-input");
  if (btn) btn.disabled = true;
  if (inp) inp.disabled = true;
  renderHUD();
  if (st.vidas <= 0) {
    setTimeout(() => encerrarJogo(false), 2000);
  } else {
    setTimeout(() => { st.processando = false; proxima(); }, 2000);
  }
}

function mostrarFeedback(tipo, msg) {
  const el = document.getElementById("feedback");
  if (el) { el.className = tipo; el.textContent = msg; }
}

// ── Encerrar ──────────────────────────────────────────────────
window.pedirEncerrar = function() {
  if (st.finalizado) return;
  if (!confirm(`Encerrar agora? Sua pontuação atual de ${st.pontuacao} pts será salva.`)) return;
  encerrarJogo(true);
};

async function encerrarJogo(voluntario) {
  if (st.finalizado) return;
  st.finalizado = true;
  clearInterval(st.timerInterval);
  unsubRanking();

  const tempo = Math.round(Date.now() / 1000 - st.inicioTs);
  let percentualNota = 100;
  try {
    const stFim = await getAtividadeStatus(turma, liberada.atividade);
    percentualNota = stFim.percentual ?? 100;
  } catch(e) {}
  const pontuacaoAplicada = st.pontuacao > 0 ? Math.max(1, Math.floor(st.pontuacao * percentualNota / 100)) : 0;

  const dados = {
    pontuacao_bruta: st.pontuacao, pontuacao: pontuacaoAplicada,
    percentual_nota: percentualNota, com_abatimento: percentualNota < 100,
    acertos: st.acertos, erros: st.erros, combo_max: st.comboMax,
    respondidas: st.respondidas, vidas_restantes: st.vidas,
    tempo: `${tempo}s`, concluido: true, modo: "competicao",
    encerrado_voluntariamente: voluntario, data: dataAgora(),
  };

  try {
    for (const al of alunos) {
      await updateResultado(st.resultadoIds[al], { ...dados, aluno: al, turma, atividade: liberada.atividade });
    }
    // Conquistas
    for (const al of alunos) {
      if (st.erros === 0 && st.acertos > 0 && !await hasConquista(al, 'sem_penalidades', liberada.atividade))
        await addConquista({ aluno: al, turma, atividade: liberada.atividade, tipo: 'sem_penalidades', data: dataAgora() });
      if (st.comboMax >= 5 && !await hasConquista(al, 'combo_maximo', liberada.atividade))
        await addConquista({ aluno: al, turma, atividade: liberada.atividade, tipo: 'combo_maximo', combo: st.comboMax, data: dataAgora() });
    }
  } catch(e) { console.error("encerrarJogo:", e); }

  mostrarFim(voluntario);
}

function mostrarFim(voluntario) {
  const taxa = st.respondidas > 0 ? Math.round(st.acertos / st.respondidas * 100) : 0;
  const overlay = document.createElement("div");
  overlay.className = "fim-overlay";
  overlay.innerHTML = `
    <div class="fim-card">
      <div class="fim-icon">${st.vidas <= 0 ? '💀' : '🏆'}</div>
      <div class="fim-pts">${st.pontuacao}</div>
      <div class="fim-pts-lbl">pontos${st.vidas <= 0 ? ' · Sem vidas!' : ' · Encerrado'}</div>
      <div class="fim-stats">
        <div class="fim-stat"><div class="fim-stat-val" style="color:var(--green)">${st.acertos}</div><div class="fim-stat-lbl">Acertos</div></div>
        <div class="fim-stat"><div class="fim-stat-val" style="color:var(--red)">${st.erros}</div><div class="fim-stat-lbl">Erros</div></div>
        <div class="fim-stat"><div class="fim-stat-val" style="color:var(--blue)">${taxa}%</div><div class="fim-stat-lbl">Taxa</div></div>
      </div>
      <a href="/aluno/atividades.html" class="btn btn-blue" style="width:100%;justify-content:center">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Voltar às atividades
      </a>
    </div>`;
  document.body.appendChild(overlay);
}

// ── Iniciar ───────────────────────────────────────────────────
proxima();
</script>
