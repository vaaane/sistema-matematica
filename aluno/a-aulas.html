<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>document.documentElement.setAttribute("data-theme","dark");</script>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#15102a">
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minhas Aulas — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
<style>
  /* Seletor de bimestre */
  .bim-tabs{display:flex;gap:6px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:5px}
  .bim-tab{width:40px;height:34px;border-radius:9px;font-size:14px;font-weight:700;color:var(--text-muted);cursor:pointer;border:none;background:transparent;display:flex;align-items:center;justify-content:center;transition:.15s}
  .bim-tab:hover:not(.active){background:rgba(255,255,255,.05);color:var(--text)}
  .bim-tab.active{background:var(--purple);color:#fff}

  /* ── Stat-cards ── */
  .stats-top{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .scard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 22px;display:flex;align-items:center;gap:16px}
  .sc-ico{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .sc-ico svg{width:24px;height:24px}
  .sc-ico.roxo{background:rgba(155,48,255,.13)} .sc-ico.roxo svg{fill:var(--purple)}
  .sc-ico.verde{background:rgba(34,197,94,.13)} .sc-ico.verde svg{fill:var(--green)}
  .sc-ico.laranja{background:rgba(240,165,0,.13)} .sc-ico.laranja svg{fill:var(--gold)}
  .sc-num{font-size:34px;font-weight:800;line-height:1;color:var(--text);letter-spacing:-.5px}
  .sc-lbl{font-size:14px;font-weight:600;color:var(--text);margin-top:6px}
  .sc-sub{font-size:12.5px;color:var(--text-muted);margin-top:3px}
  .sc-sub.g{color:var(--green)}.sc-sub.r{color:#f87171}
  .sc-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.07);margin-top:10px;overflow:hidden;max-width:150px}
  .sc-bar span{display:block;height:100%;border-radius:999px;background:var(--green)}
  .scard.prog{gap:18px}
  .donut{width:70px;height:70px;flex-shrink:0}
  .donut text{font-weight:800;fill:var(--text)}
  .prog-r .elogio{font-size:13px;color:var(--text-muted);margin-top:4px}

  /* ── Barra de filtros ── */
  .filtros{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px;flex-wrap:wrap}
  .filtro-tabs{display:flex;gap:8px;flex-wrap:wrap}
  .f-tab{padding:9px 18px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--text-muted);cursor:pointer;border:none;background:rgba(255,255,255,.035);display:inline-flex;align-items:center;gap:8px;transition:.15s}
  .f-tab:hover:not(.on){background:rgba(255,255,255,.06);color:var(--text)}
  .f-tab.on{background:var(--purple);color:#fff}
  .f-tab .cnt{font-size:11.5px;font-weight:700;min-width:21px;height:21px;padding:0 6px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.09);color:var(--text)}
  .f-tab.on .cnt{background:rgba(0,0,0,.2);color:#fff}
  .filtro-right{display:flex;align-items:center;gap:10px}
  .ord-lbl{font-size:13px;color:var(--text-muted)}
  .ord-sel{padding:9px 13px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer}
  .ord-sel option{background:var(--card);color:var(--text)}

  /* ── Cabeçalho de seção ── */
  .sec-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin:24px 0 10px;color:var(--text-muted)}
  .sec-h svg{width:16px;height:16px;fill:currentColor;opacity:.7}
  .sec-h .n{font-weight:500;font-size:13px;opacity:.8}

  /* ── Linha de aula ── */
  .aulas-bloco{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .aula-item{border-bottom:1px solid rgba(255,255,255,.045)}
  .aula-item:last-child{border-bottom:none}
  .aula{padding:14px 20px;display:grid;grid-template-columns:44px 92px minmax(0,1fr) auto;align-items:center;gap:16px;position:relative;transition:background .13s}
  .aula:hover{background:rgba(255,255,255,.018)}
  .aula::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);opacity:.7}
  .aula.completo{--acc:var(--green)}
  .aula.parcial{--acc:var(--gold)}
  .aula.sem{--acc:var(--text-muted)}
  .aula-num{font-size:15px;font-weight:700;color:var(--text-muted);width:44px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.035)}
  .aula.completo .aula-num{color:var(--green);background:rgba(34,197,94,.1)}
  .aula-tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:4px 0;border-radius:6px;text-align:center;width:88px;background:rgba(255,255,255,.05);color:var(--text-muted)}
  .aula-nome{font-weight:500;font-size:14.5px;color:var(--text);line-height:1.35;min-width:0}
  .aula-meta{display:grid;grid-template-columns:70px 130px 130px;align-items:center;gap:14px}
  .aula-data{font-size:13px;color:var(--text-muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .aula-data svg{width:14px;height:14px;fill:var(--text-muted);opacity:.6;flex-shrink:0}
  .aula-status{font-size:12.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
  .aula-status .dot{width:7px;height:7px;border-radius:999px;flex-shrink:0}
  .aula-status.completo{color:var(--green)}.aula-status.completo .dot{background:var(--green)}
  .aula-status.parcial{color:var(--gold)}.aula-status.parcial .dot{background:var(--gold)}
  .aula-status.sem{color:var(--text-muted)}.aula-status.sem .dot{background:var(--text-muted)}
  .aula-btn{border:1px solid var(--border);border-radius:9px;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:rgba(255,255,255,.03);color:var(--text);transition:.15s;width:100%}
  .aula-btn svg{width:13px;height:13px;fill:currentColor;opacity:.8;transition:transform .2s}
  .aula-btn:not(.off):hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
  .aula-btn.off{color:var(--text-muted);cursor:default;opacity:.6}
  .aula-item.aberto .aula-btn .chev{transform:rotate(180deg)}

  /* ── Painel expansível ── */
  .painel{display:none;background:#12121f;border-top:2px solid var(--acc,var(--purple));box-shadow:inset 0 8px 14px -10px rgba(0,0,0,.6)}
  .aula-item.aberto .painel{display:block}
  .aula-item.aberto{box-shadow:0 0 0 1px var(--acc);border-radius:12px;background:rgba(255,255,255,.015);position:relative;z-index:1}
  .aula-item.aberto .aula{background:rgba(255,255,255,.03)}
  .aula-item.completo{--acc:var(--green)}.aula-item.parcial{--acc:var(--gold)}.aula-item.sem{--acc:var(--text-muted)}
  .painel-head{display:flex;align-items:center;gap:9px;padding:12px 22px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border)}
  .painel-head svg{width:15px;height:15px;fill:var(--text-muted);opacity:.7}
  .painel-head .abrir{margin-left:auto;font-size:11.5px;color:#4c96ff;font-weight:600;text-decoration:none;text-transform:none;letter-spacing:0}
  .painel-inner{padding:26px 24px 30px}
  .painel .carregando{text-align:center;color:var(--text-muted);padding:44px 20px}
  .painel .erro{text-align:center;color:var(--text-muted);padding:34px 20px}
  .painel .erro a{color:var(--purple);font-weight:600}
  .painel .au{max-width:720px;margin:0 auto}
  .painel .au-hero{padding:18px 20px;margin-bottom:18px}
  .painel .au-hero-title{font-size:22px}
  .painel .au-hero-logo{display:none}

  /* ── Dica ── */
  .dica{margin-top:24px;background:rgba(155,48,255,.055);border:1px solid rgba(155,48,255,.16);border-radius:14px;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .dica-txt{font-size:13.5px;color:var(--text-muted);display:flex;align-items:center;gap:10px}
  .dica-txt b{color:var(--purple)}
  .dica-txt svg{width:18px;height:18px;fill:var(--purple);opacity:.85;flex-shrink:0}
  .dica .btn-mini{border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);border-radius:9px;padding:8px 15px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.15s}
  .dica .btn-mini:hover{background:rgba(255,255,255,.08)}
  .dica .btn-mini svg{width:14px;height:14px;fill:currentColor;opacity:.8}

  .vazio{text-align:center;color:var(--text-muted);padding:40px 20px;background:var(--card);border:1px solid var(--border);border-radius:14px}

  @media(max-width:1200px){
    .aula{grid-template-columns:44px 92px minmax(0,1fr)}
    .aula-meta{grid-column:1/-1;grid-template-columns:70px 130px 1fr;margin-top:6px;padding-left:60px}
  }
  @media(max-width:1100px){ .stats-top{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:820px){
    .stats-top{grid-template-columns:1fr}
    .aula{grid-template-columns:44px 1fr;padding:14px 16px}
    .aula-tag{grid-row:1}
    .aula-nome{grid-column:1/-1}
    .aula-meta{grid-template-columns:1fr 1fr;padding-left:0;gap:10px}
    .aula-btn{grid-column:1/-1}
    .painel{padding:0 16px 16px}
    .filtro-right .ord-lbl{display:none}
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left" style="display:flex;align-items:center;gap:14px">
        <div class="sc-ico roxo" style="width:48px;height:48px;border-radius:13px">
          <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:var(--purple)"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1z"/></svg>
        </div>
        <div>
          <div class="topbar-title" style="font-size:24px">Minhas Aulas</div>
          <div class="topbar-sub" id="topbar-sub">Carregando…</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="bim-tabs" id="bimTabs"></div>
      </div>
    </div>

    <div class="content">
      <div class="stats-top" id="statsTop"></div>

      <div class="filtros">
        <div class="filtro-tabs" id="filtroTabs"></div>
        <div class="filtro-right">
          <span class="ord-lbl">Ordenar por:</span>
          <select class="ord-sel" id="ordSel">
            <option value="recentes">Mais recentes</option>
            <option value="antigas">Mais antigas</option>
            <option value="numero">Número da aula</option>
          </select>
        </div>
      </div>

      <div id="lista"><div class="vazio">Carregando…</div></div>

      <div class="dica">
        <div class="dica-txt">
          <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>
          <span><b>Dica:</b> Mantenha o caderno em dia! Vistos completos aumentam seus pontos e seu desempenho.</span>
        </div>
        <a class="btn-mini" href="/aluno/a-ranking.html"><svg viewBox="0 0 24 24"><path d="M7 4V2h10v2h3v2c0 2.5-1.8 4.6-4.2 4.9A5 5 0 0 1 13 13.9V16h3v2H8v-2h3v-2.1a5 5 0 0 1-2.8-3C5.8 10.6 4 8.5 4 6V4h3zM6 6c0 1.3.8 2.4 2 2.8V6H6zm12 0h-2v2.8c1.2-.4 2-1.5 2-2.8z"/></svg> Ver ranking</a>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { bimestreAtual } from "/js/constants.js";
import { montarSeletorBimestre } from "/js/bimestre-seletor.js";
import { requireAluno, renderSidebarAluno } from "/js/auth.js";
import { db } from "/js/firebase-config.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const sess = requireAluno();
renderSidebarAluno("sidebar", "aulas");

const turma = sess?.turma || "";
const alunos = Array.isArray(sess?.alunos) ? sess.alunos : [];
const nome = sess?.nome || alunos[0] || "";
let bimestre = bimestreAtual();
let filtro = "todas";
let ordem = "recentes";
let aulas = [];
const carregados = {};

const ICO = {
  cal:`<svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H5V9h14v10zM5 7V5h14v2H5z"/></svg>`,
  clock:`<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 11h-1a1 1 0 0 1-1-1V7a1 1 0 0 1 2 0v4h1a1 1 0 0 1 0 2z"/></svg>`,
  check:`<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.2 14.2-4-4 1.4-1.4 2.6 2.6 5.6-5.6L18.4 9l-7 7z"/></svg>`,
  checkSm:`<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>`,
  minus:`<svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg>`,
  chev:`<svg class="chev" viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>`,
  book:`<svg viewBox="0 0 24 24"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1z"/></svg>`,
  book2:`<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>`,
};

const fmtData = iso => { if(!iso) return ""; const [,m,d]=iso.split("-"); return `${d}/${m}`; };
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function tipoDe(n){ n=norm(n); if(/(teoria|teorica)/.test(n))return"teorica"; if(/(exerc|lista|problema|atividade|revis|questo)/.test(n))return"exercicios"; return""; }
function estadoDe(m){ return m===1?"completo":m===2?"parcial":"sem"; }

function renderTabs(){
  montarSeletorBimestre('bimTabs', { mostrarTodos:true, onChange:(b)=>{ bimestre=b; carregar(); } });
}

async function carregar(){
  renderTabs();
  document.getElementById("topbar-sub").textContent = `Turma ${turma} • ${bimestre}º bimestre`;
  document.getElementById("lista").innerHTML = `<div class="vazio">Carregando…</div>`;
  document.getElementById("statsTop").innerHTML = "";

  aulas = [];
  try{
    const snap = await get(ref(db, `vistos/${turma}/${bimestre}`));
    if (snap.exists()) {
      const bloco = snap.val();
      const ativs = bloco.atividades || {};
      const marcas = bloco.marcas || {};
      aulas = Object.entries(ativs).map(([id,a])=>{
        const marca = (marcas[id] && marcas[id][nome]) || 0;
        return {
          id, nome:a.nome||"(aula)", data:a.data||"", conteudo:a.conteudo||"", obs:a.obs||"",
          ordem:a.ordem||0, materialRef:a.materialRef||"", materialTitulo:a.materialTitulo||"",
          tipo:tipoDe(a.nome||""), marca, estado:estadoDe(marca),
        };
      }).sort((x,y)=>(x.ordem-y.ordem)||(x.data<y.data?-1:1));
      aulas.forEach((a,i)=>{ a.num = String(i+1).padStart(2,"0"); });
    }
  }catch(e){ console.error(e); }
  render();
}

function ordenar(arr){
  const c = [...arr];
  const byDataDesc = (a,b)=> (a.data<b.data?1:a.data>b.data?-1:0);
  const byDataAsc  = (a,b)=> (a.data<b.data?-1:a.data>b.data?1:0);
  const byNum      = (a,b)=> (+a.num - +b.num);
  const base = ordem==="recentes"?byDataDesc : ordem==="antigas"?byDataAsc : byNum;
  c.sort(base);
  return c;
}

function render(){
  const total = aulas.length;
  const completo = aulas.filter(a=>a.estado==="completo").length;
  const parcial  = aulas.filter(a=>a.estado==="parcial").length;
  const sem      = aulas.filter(a=>a.estado==="sem").length;
  const pct = total ? Math.round(100*completo/total) : 0;
  const elogio = pct>=80?"Excelente!":pct>=50?"Muito bom!":pct>=25?"Continue assim!":"Vamos começar!";

  const R=29, Cc=2*Math.PI*R, off=Cc*(1-pct/100);
  document.getElementById("statsTop").innerHTML = `
    <div class="scard">
      <div class="sc-ico roxo">${ICO.book}</div>
      <div><div class="sc-num">${total}</div><div class="sc-lbl">Aulas no bimestre</div><div class="sc-sub">Total disponíveis</div></div>
    </div>
    <div class="scard">
      <div class="sc-ico verde">${ICO.checkSm}</div>
      <div style="flex:1"><div class="sc-num">${completo}</div><div class="sc-lbl">Vistos completos</div>
      <div class="sc-sub g">${pct}% do total</div><div class="sc-bar"><span style="width:${pct}%"></span></div></div>
    </div>
    <div class="scard">
      <div class="sc-ico laranja">${ICO.clock}</div>
      <div><div class="sc-num">${sem+parcial}</div><div class="sc-lbl">Vistos pendentes</div>
      ${parcial?`<div class="sc-sub r">${parcial} parcial${parcial>1?"is":""}</div>`:`<div class="sc-sub">${sem} sem visto</div>`}</div>
    </div>
    <div class="scard prog">
      <svg class="donut" viewBox="0 0 70 70">
        <circle cx="35" cy="35" r="${R}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/>
        <circle cx="35" cy="35" r="${R}" fill="none" stroke="var(--purple)" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="${Cc.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 35 35)"/>
        <text x="35" y="40" text-anchor="middle" font-size="16">${pct}%</text>
      </svg>
      <div class="prog-r"><div class="sc-lbl">Progresso do bimestre</div><div class="elogio">${elogio}</div></div>
    </div>`;

  const tabs = [["todas","Todas",total],["completo","Visto completo",completo],["parcial","Visto parcial",parcial],["sem","Sem visto",sem]];
  document.getElementById("filtroTabs").innerHTML = tabs.map(([k,l,c])=>
    `<button class="f-tab ${k===filtro?"on":""}" data-f="${k}">${l}<span class="cnt">${c}</span></button>`).join("");
  document.querySelectorAll(".f-tab").forEach(b=>b.onclick=()=>{ filtro=b.dataset.f; render(); });

  const lista = document.getElementById("lista");
  if(!total){
    lista.innerHTML = `<div class="vazio">Nenhuma aula registrada neste bimestre ainda.<br>Quando a professora lançar aulas nos vistos, elas aparecem aqui.</div>`;
    return;
  }

  const secoes = [
    ["completo","Visto completo",ICO.check],
    ["parcial","Visto parcial",ICO.minus],
    ["sem","Sem visto",ICO.clock],
  ];
  let html = "";
  secoes.forEach(([est,label,ico])=>{
    if(filtro!=="todas" && filtro!==est) return;
    const arr = ordenar(aulas.filter(a=>a.estado===est));
    if(!arr.length) return;
    html += `<div class="sec-h">${ico}${label} <span class="n">(${arr.length})</span></div><div class="aulas-bloco">${arr.map(linha).join("")}</div>`;
  });
  if(!html) html = `<div class="vazio">Nenhuma aula nesse filtro.</div>`;
  lista.innerHTML = html;

  lista.querySelectorAll(".aula-btn[data-i]").forEach(btn=>btn.onclick=()=>toggleAula(btn.dataset.i));
}

function tagHTML(a){
  const l = a.tipo==="teorica" ? "Teoria" : a.tipo==="exercicios" ? "Exercícios" : "";
  return l ? `<span class="aula-tag">${l}</span>` : `<span class="aula-tag" style="visibility:hidden">-</span>`;
}
function statusHTML(a){
  const map = { completo:["completo","Visto completo"], parcial:["parcial","Visto parcial"], sem:["sem","Sem visto"] };
  const [cls,txt] = map[a.estado];
  return `<span class="aula-status ${cls}"><span class="dot"></span>${txt}</span>`;
}
function btnHTML(a){
  if(!a.materialRef) return `<button class="aula-btn off">Sem material</button>`;
  return `<button class="aula-btn" data-i="${a.id}">Ver conteúdo ${ICO.chev}</button>`;
}

function linha(a){
  return `
    <div class="aula-item ${a.estado}" id="item-${a.id}">
      <div class="aula ${a.estado}">
        <div class="aula-num">${a.num}</div>
        ${tagHTML(a)}
        <div class="aula-nome">${a.nome}</div>
        <div class="aula-meta">
          <span class="aula-data">${a.data?ICO.cal+fmtData(a.data):""}</span>
          ${statusHTML(a)}
          ${btnHTML(a)}
        </div>
      </div>
      <div class="painel" id="painel-${a.id}"></div>
    </div>`;
}

// ── Expandir / carregar conteúdo inline ──
function extrairMiolo(htmlText){
  const doc = new DOMParser().parseFromString(htmlText, "text/html");
  const au = doc.querySelector(".au") || doc.querySelector(".content") || doc.body;
  au.querySelectorAll(".sidebar, .topbar, script").forEach(el=>el.remove());
  let css = "";
  doc.querySelectorAll("style").forEach(s=>{ css += s.textContent + "\n"; });
  return (css?`<style>${css}</style>`:"") + au.outerHTML;
}

async function toggleAula(id){
  const item = document.getElementById("item-"+id);
  if(!item) return;
  const abrindo = !item.classList.contains("aberto");
  document.querySelectorAll(".aula-item.aberto").forEach(el=>{ if(el!==item) el.classList.remove("aberto"); });
  item.classList.toggle("aberto", abrindo);
  if(!abrindo) return;

  const a = aulas.find(x=>x.id===id);
  const painel = document.getElementById("painel-"+id);
  if(painel.dataset.loaded === "1"){ return; }

  painel.innerHTML = `<div class="painel-inner"><div class="carregando">Carregando conteúdo…</div></div>`;
  try{
    let html = carregados[a.materialRef];
    if(html === undefined){
      const r = await fetch(a.materialRef, {cache:"no-cache"});
      if(!r.ok) throw new Error(r.status);
      html = await r.text();
      carregados[a.materialRef] = html;
    }
    painel.innerHTML = `
      <div class="painel-head">
        ${ICO.book2}Conteúdo da aula
        <a class="abrir" href="${a.materialRef}" target="_blank">abrir em nova aba ↗</a>
      </div>
      <div class="painel-inner">${extrairMiolo(html)}</div>`;
    painel.dataset.loaded = "1";
    painel.querySelectorAll(".au-nav a").forEach(el=>{
      el.addEventListener("click",e=>{ const t=painel.querySelector(el.getAttribute("href")); if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth",block:"start"});} });
    });
    item.scrollIntoView({behavior:"smooth", block:"nearest"});
  }catch(e){
    console.error(e);
    painel.innerHTML = `<div class="painel-inner"><div class="erro">Não foi possível carregar o material.<br><a href="${a.materialRef}" target="_blank">Abrir em nova aba</a></div></div>`;
  }
}

document.getElementById("ordSel").addEventListener("change", e=>{ ordem=e.target.value; render(); });

carregar();
</script>
