<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>document.documentElement.setAttribute("data-theme","dark");</script>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#15102a">
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minhas Aulas — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
<style>
  :root{
    --card-sel:#242437;
    --sheet:#f7f5fc; --sheet-line:#e7e1f4; --ink:#221b3d; --ink-soft:#59527a;
    --lilac:#efeafc; --lilac-b:#dcd0f5; --mint:#eef8f1; --mint-b:#c9e9d5; --purple2:#7c3aed;
  }
  /* seletor de bimestre: estilo vem do componente /js/bimestre-seletor.js (padrão do site) */

  /* resumo compacto */
  .stat-compact{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px 16px;margin-bottom:20px}
  .donut{width:60px;height:60px;flex-shrink:0}
  .donut text{font-weight:800;fill:var(--text)}
  .sc-right{flex:1;min-width:0}
  .sc-big{font-size:16px;font-weight:800}.sc-big b{color:var(--green)}
  .sc-sub{font-size:12.5px;color:var(--text-muted);margin-top:5px}
  .sc-sub .p{color:var(--gold);font-weight:700}

  /* filtros: as 3 abas em 1 linha; "Ordenar por" na linha de baixo */
  .filtros{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
  .filtro-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .filtro-tabs::-webkit-scrollbar{display:none}
  .filtro-right{display:flex;align-items:center;gap:10px}
  .f-tab{white-space:nowrap;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text-muted);border:1px solid var(--border);background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .f-tab .cnt{font-size:12px;font-weight:700;color:var(--text-muted);opacity:.65}
  .f-tab.on{background:rgba(155,48,255,.12);border-color:rgba(155,48,255,.45);color:#c79bff}
  .f-tab.on .cnt{color:#c79bff;opacity:.9}
  .ord-lbl{font-size:13px;color:var(--text-muted)}
  .ord-sel{padding:9px 13px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer}
  .ord-sel option{background:var(--card);color:var(--text)}

  /* cabeçalho de seção (discreto) */
  .sec-h{display:flex;align-items:center;gap:10px;margin:8px 2px 12px}
  .sec-h .ico{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
  .sec-h .ico svg{width:19px;height:19px;fill:var(--text-muted)}
  .sec-h .t{font-size:15px;font-weight:700}
  .sec-h .t .n{font-size:13px;color:var(--text-muted);font-weight:500}

  /* cards de aula (base neutra) */
  .aulas-bloco{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
  .aula-item{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:.15s}
  .aula{padding:12px 14px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;cursor:pointer}
  .ring{position:relative;width:40px;height:40px}
  .ring svg{position:absolute;inset:0}
  .ring svg circle{stroke:rgba(255,255,255,.18)}
  .ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--text-muted)}
  .aula-main{min-width:0}
  .headline{display:flex;align-items:center;gap:9px;flex-wrap:wrap;row-gap:4px}
  .aula-tag{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid var(--border);color:var(--text-muted);background:transparent}
  .aula-nome{font-size:14.5px;font-weight:700;line-height:1.25;flex:1 1 auto;min-width:0;color:var(--text)}
  .aula-meta{display:flex;align-items:center;gap:10px;margin-top:5px;flex-wrap:wrap}
  .aula-data{font-size:11.5px;color:var(--text-muted);display:inline-flex;align-items:center;gap:5px}
  .aula-data svg{width:12px;height:12px;fill:currentColor;opacity:.65}
  .aula-status{font-size:11.5px;font-weight:600;color:var(--text-muted);display:inline-flex;align-items:center;gap:5px}
  .aula-status svg{width:13px;height:13px;fill:currentColor}
  .aula-status.completo{color:#63c98a} .aula-status.parcial{color:var(--gold)} .aula-status.sem{color:var(--text-muted)}
  .aula-btn{align-self:center;border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:11.5px;font-weight:600;background:transparent;color:var(--text-muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-family:inherit;cursor:pointer}
  .aula-btn svg{width:13px;height:13px;fill:currentColor;opacity:.8;transition:transform .2s}
  .aula-btn.off{opacity:.5;cursor:default}
  .aula-btn .t-oc{display:none}

  /* aula SELECIONADA (destaque roxo) */
  .aula-item.aberto{background:var(--card-sel);border-color:rgba(155,48,255,.45);border-left:3px solid var(--purple);box-shadow:0 0 0 1px rgba(155,48,255,.18),0 12px 26px rgba(0,0,0,.4)}
  .aula-item.aberto .ring svg circle{stroke:var(--purple)}
  .aula-item.aberto .ring .num{color:#fff}
  .aula-item.aberto .aula-nome{color:#fff}
  .aula-item.aberto .aula-btn{border-color:rgba(155,48,255,.55);color:#c79bff}
  .aula-item.aberto .aula-btn svg{transform:rotate(180deg)}
  .aula-item.aberto .aula-btn .t-ver{display:none}
  .aula-item.aberto .aula-btn .t-oc{display:inline}

  /* painel = folha clara */
  .painel{display:none;padding:10px}
  .aula-item.aberto .painel{display:block}
  .sheet{background:var(--sheet);border-radius:12px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .sheet-head{display:flex;align-items:center;justify-content:center;gap:9px;padding:12px;background:var(--lilac);font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--purple2);border-bottom:1px solid var(--sheet-line);position:relative}
  .sheet-head svg{width:16px;height:16px;fill:var(--purple2)}
  .sheet-head .abrir{position:absolute;right:12px;font-size:11px;font-weight:600;color:var(--purple2);text-transform:none;letter-spacing:0;text-decoration:none;opacity:.8}
  .sheet-body{padding:18px 16px}
  .painel .carregando,.painel .erro{text-align:center;color:var(--text-muted);padding:34px 20px}
  .painel .erro a{color:var(--purple);font-weight:600}

  /* recolorir o conteúdo injetado para a folha clara */
  .content-light{color:var(--ink)}
  .content-light .au{max-width:none;margin:0}
  .content-light .au-hero{background:transparent;border:0;border-bottom:1px solid var(--sheet-line);border-radius:0;padding:0 0 12px;margin:0 0 14px;text-align:left}
  .content-light .au-hero::after{display:none}
  .content-light .au-hero-logo{display:none}
  .content-light .au-hero-eyebrow{color:#a06a00}
  .content-light .au-hero-title{color:var(--ink);font-size:22px}
  .content-light .au-hero-meta{justify-content:flex-start}
  .content-light .au-nav{display:none}
  .content-light .au-meta{background:#fff;border-color:#e4dcf5;color:#5a4d7a}
  .content-light .au-meta.gold{color:#8a5e00;background:#fdf2d6;border-color:#f0cf84}
  .content-light .au-sec{margin-bottom:20px}
  .content-light .au-sec-head{border-color:var(--sheet-line)}
  .content-light .au-sec-num{background:#fff;color:var(--purple2);border:2px solid rgba(124,58,237,.45)}
  .content-light .au-sec-title{color:var(--ink)}
  .content-light .au-p{color:#3a3455}
  .content-light .au-p b,.content-light .au-p strong{color:var(--ink)}
  .content-light .au-def{background:var(--lilac);border-color:var(--lilac-b);border-left-color:var(--purple)}
  .content-light .au-def-label{color:var(--purple2)}
  .content-light .au-def-body{color:#3a3455}
  .content-light .au-def-body b{color:var(--ink)}
  .content-light .au-formula{background:var(--lilac);border-color:var(--lilac-b)}
  .content-light .au-formula-main{color:var(--ink)}
  .content-light .au-formula-note{color:var(--ink-soft)}
  .content-light .au-fmini{background:#fff;border-color:#e4dcf5}
  .content-light .au-fmini-name{color:var(--ink-soft)}
  .content-light .au-fmini-eq{color:var(--ink)}
  .content-light .au-ex{background:#fff;border-color:#e4dcf5}
  .content-light .au-ex-head{color:#137a3e}
  .content-light .au-ex-prob{color:var(--ink);border-color:#e0d6f7}
  .content-light .au-steps li{color:#3a3455}
  .content-light .au-steps li::before{color:var(--purple2);background:var(--lilac);border-color:var(--lilac-b)}
  .content-light .au-steps b{color:var(--ink)}
  .content-light .au-res{background:var(--mint);border-color:var(--mint-b);color:#137a3e}
  .content-light .au-tip{background:#eaf4fb;border-color:#cbe3f3;color:#2b6a92}
  .content-light .au-warn{background:#fdf6e6;border-color:#f0dcae;color:#8a5e00}
  .content-light .au-tip b,.content-light .au-warn b{color:var(--ink)}
  .content-light .au-rel{background:#fff;border-color:#e4dcf5}
  .content-light .au-rel-title{color:var(--ink)}
  .content-light .au-rel-item{background:var(--sheet);border-color:#e4dcf5;color:#3a3455}
  .content-light .au-rel-item span{color:var(--purple2)}
  .content-light .au-note{color:#8b8398}
  .content-light .ex{background:#fff;border-color:#e4dcf5}
  .content-light .ex-stmt{color:#2f2a48}
  .content-light .ex-alt{background:var(--sheet);border-color:#e4dcf5;color:#3a3455}
  .content-light .ex-answer-in{background:var(--mint);border-color:var(--mint-b)}
  .content-light .ex-answer-in p{color:#3a3455}

  .dica{margin-top:24px;background:rgba(155,48,255,.055);border:1px solid rgba(155,48,255,.16);border-radius:14px;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .dica-txt{font-size:13.5px;color:var(--text-muted);display:flex;align-items:center;gap:10px}
  .dica-txt b{color:var(--purple)} .dica-txt svg{width:18px;height:18px;fill:var(--purple);opacity:.85;flex-shrink:0}
  .dica .btn-mini{border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);border-radius:9px;padding:8px 15px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
  .dica .btn-mini svg{width:14px;height:14px;fill:currentColor;opacity:.8}

  .vazio{text-align:center;color:var(--text-muted);padding:40px 20px;background:var(--card);border:1px solid var(--border);border-radius:14px}

  @media(max-width:560px){
    .aula{grid-template-columns:40px minmax(0,1fr);gap:11px}
    .aula-btn{grid-column:1/-1;margin-top:4px;justify-content:center}
    .filtro-bar .ord-lbl{display:none}
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left" style="display:flex;align-items:center;gap:14px">
        <div class="sc-ico roxo" style="width:48px;height:48px;border-radius:13px">
          <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:var(--purple)"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1z"/></svg>
        </div>
        <div>
          <div class="topbar-title">Minhas Aulas</div>
          <div class="topbar-sub" id="topbar-sub">Carregando…</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="bim-tabs" id="bimTabs"></div>
      </div>
    </div>

    <div class="content">
      <div class="stats-top" id="statsTop"></div>

      <div class="filtros">
        <div class="filtro-tabs" id="filtroTabs"></div>
        <div class="filtro-right">
          <span class="ord-lbl">Ordenar por:</span>
          <select class="ord-sel" id="ordSel">
            <option value="recentes">Mais recentes</option>
            <option value="antigas">Mais antigas</option>
            <option value="numero">Número da aula</option>
          </select>
        </div>
      </div>

      <div id="lista"><div class="vazio">Carregando…</div></div>

      <div class="dica">
        <div class="dica-txt">
          <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>
          <span><b>Dica:</b> Mantenha o caderno em dia! Vistos completos aumentam seus pontos e seu desempenho.</span>
        </div>
        <a class="btn-mini" href="/aluno/a-ranking.html"><svg viewBox="0 0 24 24"><path d="M7 4V2h10v2h3v2c0 2.5-1.8 4.6-4.2 4.9A5 5 0 0 1 13 13.9V16h3v2H8v-2h3v-2.1a5 5 0 0 1-2.8-3C5.8 10.6 4 8.5 4 6V4h3zM6 6c0 1.3.8 2.4 2 2.8V6H6zm12 0h-2v2.8c1.2-.4 2-1.5 2-2.8z"/></svg> Ver ranking</a>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { bimestreAtual } from "/js/constants.js";
import { montarSeletorBimestre } from "/js/bimestre-seletor.js";
import { requireAluno, renderSidebarAluno } from "/js/auth.js";
import { db } from "/js/firebase-config.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const sess = requireAluno();
renderSidebarAluno("sidebar", "aulas");

const turma = sess?.turma || "";
const alunos = Array.isArray(sess?.alunos) ? sess.alunos : [];
const nome = sess?.nome || alunos[0] || "";
let bimestre = bimestreAtual();
let filtro = "todas";
let ordem = "recentes";
let aulas = [];
const carregados = {};

const ICO = {
  cal:`<svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H5V9h14v10zM5 7V5h14v2H5z"/></svg>`,
  clock:`<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 11h-1a1 1 0 0 1-1-1V7a1 1 0 0 1 2 0v4h1a1 1 0 0 1 0 2z"/></svg>`,
  check:`<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.2 14.2-4-4 1.4-1.4 2.6 2.6 5.6-5.6L18.4 9l-7 7z"/></svg>`,
  checkSm:`<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>`,
  minus:`<svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg>`,
  chev:`<svg class="chev" viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>`,
  book:`<svg viewBox="0 0 24 24"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1z"/></svg>`,
  book2:`<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>`,
};

const fmtData = iso => { if(!iso) return ""; const [,m,d]=iso.split("-"); return `${d}/${m}`; };
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function tipoDe(n){ n=norm(n); if(/(teoria|teorica)/.test(n))return"teorica"; if(/(exerc|lista|problema|atividade|revis|questo)/.test(n))return"exercicios"; return""; }
function estadoDe(m){ return m===1?"completo":m===2?"parcial":"sem"; }

function renderTabs(){
  montarSeletorBimestre('bimTabs', { mostrarTodos:true, onChange:(b)=>{ bimestre=b; carregar(); } });
}

async function carregar(){
  renderTabs();
  document.getElementById("topbar-sub").textContent = `Turma ${turma} • ${bimestre}º bimestre`;
  document.getElementById("lista").innerHTML = `<div class="vazio">Carregando…</div>`;
  document.getElementById("statsTop").innerHTML = "";

  aulas = [];
  try{
    const snap = await get(ref(db, `vistos/${turma}/${bimestre}`));
    if (snap.exists()) {
      const bloco = snap.val();
      const ativs = bloco.atividades || {};
      const marcas = bloco.marcas || {};
      aulas = Object.entries(ativs).map(([id,a])=>{
        const marca = (marcas[id] && marcas[id][nome]) || 0;
        return {
          id, nome:a.nome||"(aula)", data:a.data||"", conteudo:a.conteudo||"", obs:a.obs||"",
          ordem:a.ordem||0, materialRef:a.materialRef||"", materialTitulo:a.materialTitulo||"",
          tipo:tipoDe(a.nome||""), marca, estado:estadoDe(marca),
        };
      }).sort((x,y)=>(x.ordem-y.ordem)||(x.data<y.data?-1:1));
      aulas.forEach((a,i)=>{ a.num = String(a.ordem || (i+1)).padStart(2,"0"); });
    }
  }catch(e){ console.error(e); }
  render();
}

function ordenar(arr){
  const c = [...arr];
  const byDataDesc = (a,b)=> (a.data<b.data?1:a.data>b.data?-1:0);
  const byDataAsc  = (a,b)=> (a.data<b.data?-1:a.data>b.data?1:0);
  const byNum      = (a,b)=> (+a.num - +b.num);
  const base = ordem==="recentes"?byDataDesc : ordem==="antigas"?byDataAsc : byNum;
  c.sort(base);
  return c;
}

function render(){
  const total    = aulas.length;
  const completo = aulas.filter(a=>a.estado==="completo").length;
  const parcial  = aulas.filter(a=>a.estado==="parcial").length;
  const sem      = aulas.filter(a=>a.estado==="sem").length;
  const comVisto = completo + parcial;
  const pend     = parcial + sem;
  const pct      = total ? Math.round(100*completo/total) : 0;

  const R=24, Cc=2*Math.PI*R, off=Cc*(1-pct/100);
  const partes = [];
  if(parcial) partes.push(`${parcial} parcial${parcial>1?"is":""}`);
  if(sem)     partes.push(`${sem} sem visto`);
  document.getElementById("statsTop").innerHTML = `
    <div class="stat-compact">
      <svg class="donut" viewBox="0 0 60 60">
        <circle cx="30" cy="30" r="${R}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/>
        <circle cx="30" cy="30" r="${R}" fill="none" stroke="var(--green)" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="${Cc.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 30 30)"/>
        <text x="30" y="35" text-anchor="middle" font-size="15">${pct}%</text>
      </svg>
      <div class="sc-right">
        <div class="sc-big"><b>${completo}</b> de ${total} vistos completos</div>
        <div class="sc-sub">${pend?`<span class="p">${pend} pendente${pend>1?"s":""}</span>${partes.length?" · "+partes.join(", "):""}`:"Tudo em dia! 🎉"}</div>
      </div>
    </div>`;

  const tabs = [["todas","Todas",total],["com","Com visto",comVisto],["sem","Sem visto",sem]];
  document.getElementById("filtroTabs").innerHTML = tabs.map(([k,l,c])=>
    `<button class="f-tab ${k===filtro?"on":""}" data-f="${k}">${l} <span class="cnt">${c}</span></button>`).join("");
  document.querySelectorAll(".f-tab").forEach(b=>b.onclick=()=>{ filtro=b.dataset.f; render(); });

  const lista = document.getElementById("lista");
  if(!total){
    lista.innerHTML = `<div class="vazio">Nenhuma aula registrada neste bimestre ainda.<br>Quando a professora lançar aulas nos vistos, elas aparecem aqui.</div>`;
    return;
  }

  const grupos = [
    ["com","Com visto", a=>a.estado!=="sem", ICO.check],
    ["sem","Sem visto", a=>a.estado==="sem", ICO.clock],
  ];
  let html = "";
  grupos.forEach(([grp,label,filtroFn,ico])=>{
    if(filtro!=="todas" && filtro!==grp) return;
    const arr = ordenar(aulas.filter(filtroFn));
    if(!arr.length) return;
    html += `<div class="sec-h"><div class="ico">${ico}</div>
      <div class="t">${label} <span class="n">(${arr.length})</span></div></div>
      <div class="aulas-bloco">${arr.map(linha).join("")}</div>`;
  });
  if(!html) html = `<div class="vazio">Nenhuma aula nesse filtro.</div>`;
  lista.innerHTML = html;

  lista.querySelectorAll(".aula[data-i]").forEach(el=>el.onclick=()=>toggleAula(el.dataset.i));
}

function tagHTML(a){
  const l = a.tipo==="teorica" ? "Teoria" : a.tipo==="exercicios" ? "Exercícios" : "";
  return l ? `<span class="aula-tag">${l}</span>` : "";
}
function statusHTML(a){
  const map = {
    completo:["completo","Visto completo",ICO.checkSm],
    parcial :["parcial","Visto parcial",ICO.minus],
    sem     :["sem","Sem visto",ICO.clock],
  };
  const [cls,txt,ic] = map[a.estado];
  return `<span class="aula-status ${cls}">${ic}${txt}</span>`;
}
function btnHTML(a){
  if(!a.materialRef) return `<button class="aula-btn off" disabled>Sem material</button>`;
  return `<button class="aula-btn"><span class="t-ver">Ver conteúdo</span><span class="t-oc">Ocultar conteúdo</span> ${ICO.chev}</button>`;
}
function linha(a){
  return `
    <div class="aula-item ${a.estado}" id="item-${a.id}">
      <div class="aula" data-i="${a.id}">
        <div class="ring">
          <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17.5" fill="none" stroke-width="2.5"/></svg>
          <div class="num">${a.num}</div>
        </div>
        <div class="aula-main">
          <div class="headline">${tagHTML(a)}<span class="aula-nome">${a.nome}</span></div>
          <div class="aula-meta">
            <span class="aula-data">${ICO.cal}${a.data?fmtData(a.data):"—"}</span>
            ${statusHTML(a)}
          </div>
        </div>
        ${btnHTML(a)}
      </div>
      <div class="painel" id="painel-${a.id}"></div>
    </div>`;
}

// ── Expandir / carregar conteúdo inline ──
function extrairMiolo(htmlText){
  const doc = new DOMParser().parseFromString(htmlText, "text/html");
  const au = doc.querySelector(".au") || doc.querySelector(".content") || doc.body;
  au.querySelectorAll(".sidebar, .topbar, script").forEach(el=>el.remove());
  let css = "";
  doc.querySelectorAll("style").forEach(s=>{ css += s.textContent + "\n"; });
  return (css?`<style>${css}</style>`:"") + au.outerHTML;
}

async function toggleAula(id){
  const item = document.getElementById("item-"+id);
  if(!item) return;
  const abrindo = !item.classList.contains("aberto");
  document.querySelectorAll(".aula-item.aberto").forEach(el=>{ if(el!==item) el.classList.remove("aberto"); });
  item.classList.toggle("aberto", abrindo);
  if(!abrindo) return;

  const a = aulas.find(x=>x.id===id);
  const painel = document.getElementById("painel-"+id);
  if(painel.dataset.loaded === "1"){ return; }

  painel.innerHTML = `<div class="painel-inner"><div class="carregando">Carregando conteúdo…</div></div>`;
  try{
    let html = carregados[a.materialRef];
    if(html === undefined){
      const r = await fetch(a.materialRef, {cache:"no-cache"});
      if(!r.ok) throw new Error(r.status);
      html = await r.text();
      carregados[a.materialRef] = html;
    }
    painel.innerHTML = `
      <div class="sheet">
        <div class="sheet-head">${ICO.book2}Conteúdo da aula
          <a class="abrir" href="${a.materialRef}" target="_blank">abrir ↗</a></div>
        <div class="sheet-body content-light">${extrairMiolo(html)}</div>
      </div>`;
    painel.dataset.loaded = "1";
    painel.querySelectorAll(".au-nav a").forEach(el=>{
      el.addEventListener("click",e=>{ const t=painel.querySelector(el.getAttribute("href")); if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth",block:"start"});} });
    });
    item.scrollIntoView({behavior:"smooth", block:"nearest"});
  }catch(e){
    console.error(e);
    painel.innerHTML = `<div class="painel-inner"><div class="erro">Não foi possível carregar o material.<br><a href="${a.materialRef}" target="_blank">Abrir em nova aba</a></div></div>`;
  }
}

document.getElementById("ordSel").addEventListener("change", e=>{ ordem=e.target.value; render(); });

carregar();
</script>
