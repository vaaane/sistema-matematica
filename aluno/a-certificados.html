<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>document.documentElement.setAttribute("data-theme","dark");</script>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#15102a">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meus Certificados</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/main.css"/>
<style>
  .cert-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px; margin-top: 16px;
  }
  .cert-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; position: relative;
    overflow: hidden; transition: border-color .2s;
  }
  .cert-card.desbloqueado {
    border-color: rgba(201,168,76,.35);
    background: rgba(201,168,76,.03); cursor: pointer;
  }
  .cert-card.desbloqueado:hover { border-color: rgba(201,168,76,.6); }
  .cert-card.bloqueado { opacity: .45; cursor: default; }
  .cert-card::before { content: ''; position: absolute; inset: 0; pointer-events: none; }
  .cert-card.desbloqueado::before { background: radial-gradient(ellipse at 0% 0%, rgba(201,168,76,.08) 0%, transparent 60%); }

  .cert-icon {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; margin-bottom: 14px; flex-shrink: 0;
  }
  .cert-card.desbloqueado .cert-icon {
    background: linear-gradient(135deg, #f7e98e, #c9a84c);
    box-shadow: 0 0 20px rgba(245,158,11,.35);
  }
  .cert-card.bloqueado .cert-icon { background: var(--card2); border: 1px solid var(--border); }

  .cert-nome { font-size: 15px; font-weight: 800; margin-bottom: 4px; color: var(--text); }
  .cert-card.desbloqueado .cert-nome { color: #c9a84c; }
  .cert-desc { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
  .cert-data { font-size: 10px; color: rgba(201,168,76,.7); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }

  .cert-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, #c9a84c, #f7e98e);
    color: #1a0f00; border-radius: 8px; padding: 8px 16px;
    font-size: 12px; font-weight: 800; text-decoration: none;
    letter-spacing: .5px; transition: opacity .15s;
  }
  .cert-btn:hover { opacity: .85; }
  .cert-lock { display: inline-flex; align-items: center; gap: 6px; background: var(--card2); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 8px 16px; font-size: 12px; font-weight: 600; }
  .cert-requisito { font-size: 11px; color: var(--muted); margin-top: 8px; }

  .certs-header {
    background: #1a1a2e !important; border: 1px solid rgba(255,255,255,0.07) !important;
    border-radius: 16px; padding: 24px; margin-bottom: 24px;
    display: flex; align-items: center; gap: 16px;
  }
  .certs-header-icon {
    width: 52px; height: 52px; border-radius: 14px;
    background: linear-gradient(135deg, #c9a84c, #f7e98e);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0;
  }

  .certs-secao { font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin: 24px 0 0; }
  .cert-card.desbloqueado[style*="--cc"] { border-color: color-mix(in srgb, var(--cc) 40%, transparent); background: color-mix(in srgb, var(--cc) 5%, transparent); }
  .cert-icon-novo { background: radial-gradient(circle at 35% 30%, #fff, var(--cc)) !important; box-shadow: 0 0 20px color-mix(in srgb, var(--cc) 45%, transparent) !important; }
  .cert-btn-novo { background: var(--cc); color: #0d0f1a; }
  .cert-card.lenda { border: 2px solid #ffd700; box-shadow: 0 0 24px rgba(255,215,0,.25); }

  @media(max-width:500px) { .cert-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">🎓 Meus Certificados</div>
        <div class="topbar-sub">Conquistas que viraram diploma</div>
      </div>
      <div class="topbar-right">
        <div id="topbar-avatar-circle" class="avatar-circle" style="width:36px;height:36px;cursor:pointer" onclick="window.location.href='/aluno/perfil.html'"></div>
      </div>
    </div>
    <div class="content">
      <div style="max-width:760px;margin:0 auto;padding:24px 16px 60px">
        <div id="certs-content">
          <div style="text-align:center;padding:60px;color:var(--muted)">Carregando…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { requireAluno, renderSidebarAluno, clearSession, iniciarNotifDueloGlobal } from '/js/auth.js';
import { db } from '/js/firebase-config.js';
import { ref, get } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
import { TIPOS_CERT, ORDEM_TIPOS, certificadosDoAluno, urlCertificado, urlCertificados } from '/js/certificados.js';

const sess = requireAluno('/index.html');
const { alunos, turma } = sess;
const uid = (turma + '_' + alunos[0]).replace(/[.#$[\]/\s]/g, '_');

renderSidebarAluno('sidebar', 'certificados');
window.sair = () => { clearSession(); window.location.href = '/index.html'; };

(async () => { try {
  const { iniciarPresenca, encerrarPresenca } = await import('/js/presenca.js');
  const _dispSnap = await get(ref(db, `perfis/${uid}/duelos_disponivel`));
  const _disp = _dispSnap.val() !== false;
  await iniciarPresenca(uid, { nome: alunos[0], turma, status: _disp ? 'disponivel' : 'indisponivel', pagina: 'navegando' });
  window.addEventListener('beforeunload', () => encerrarPresenca());
  const { initDueloAvail } = await import('/js/duelo_avail.js');
  await initDueloAvail(uid);
} catch(e) {} })();
iniciarNotifDueloGlobal();

(async () => { try {
  const { getPerfil } = await import('/js/db.js');
  const { avatarUrl, avatarConfigDefault } = await import('/js/gamificacao.js');
  const _p = await getPerfil(uid);
  const _c = document.getElementById('topbar-avatar-circle');
  if (_c) {
    const url   = avatarUrl(_p?.avatar || avatarConfigDefault());
    const letra = (alunos[0] || '?')[0].toUpperCase();
    _c.innerHTML = `<div style="width:100%;height:100%;position:relative;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#7F77DD,#00d4ff)"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;z-index:0">${letra}</span><img src="${url}" alt="" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:1;border-radius:50%" onerror="this.style.display='none'"></div>`;
  }
} catch(_) {} })();

const [conquSnap, negSnap, novos] = await Promise.all([
  get(ref(db, `conquistas/${uid}`)).catch(() => null),
  get(ref(db, `tabuada_negativos_niveis/${uid}`)).catch(() => null),
  certificadosDoAluno(turma, alunos[0]).catch(e => { console.warn('[certificados]', e); return []; }),   // 🎓 PROMPT-278
]);
const conqus    = conquSnap?.exists() ? conquSnap.val() : {};
const temBase   = conqus['tabuada_300']?.conquistado === true;
const tsBase    = conqus['tabuada_300']?.ts;
const dataBase  = tsBase ? new Date(tsBase).toLocaleDateString('pt-BR', { day:'numeric', month:'long', year:'numeric' }) : null;

const negDados  = negSnap?.exists() ? negSnap.val() : {};
const temNeg    = (negDados.melhor_nivel || 0) >= 50 || !!negDados.concluiu_50_em;
const tsNeg     = negDados.concluiu_50_em || null;
const dataNeg   = tsNeg ? new Date(tsNeg).toLocaleDateString('pt-BR', { day:'numeric', month:'long', year:'numeric' }) : null;

const escH = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dataLonga = (ts) => ts ? new Date(ts).toLocaleDateString('pt-BR', { day:'numeric', month:'long', year:'numeric' }) : '';
const semTags = (h) => String(h).replace(/<\/?strong>/g, '');

// 🎓 PROMPT-278: os certificados do 3º e 4º bimestre (um por conquista e por bimestre — js/certificados.js)
const ordemNovos = [...novos].sort((a, b) => b.bim - a.bim || ORDEM_TIPOS.indexOf(a.tipo) - ORDEM_TIPOS.indexOf(b.tipo));
const cardNovo = (c) => {
  const t = TIPOS_CERT[c.tipo], lenda = c.tipo === 'revisao_lenda', url = urlCertificado(c);
  return `<div class="cert-card desbloqueado${lenda ? ' lenda' : ''}" style="--cc:${t.cor}" onclick="window.open('${url}','_blank')">
    <div class="cert-icon cert-icon-novo">${t.icon}</div>
    <div class="cert-nome" style="color:${t.cor}">${escH(t.nome)} · ${c.bim}º bim</div>
    <div class="cert-desc">${semTags(t.conquista(c.bim))} e ${semTags(t.impacto(c.qtd))}.</div>
    ${c.ts ? `<div class="cert-data" style="color:${t.cor}">✅ Conquistado em ${dataLonga(c.ts)}</div>` : ''}
    <a class="cert-btn cert-btn-novo" href="${url}" target="_blank" onclick="event.stopPropagation()">🎓 Ver e baixar</a>
  </div>`;
};
// o que ainda dá para conquistar no 4º bimestre
const tem = (tipo, bim) => novos.some(c => c.tipo === tipo && c.bim === bim);
const faltam = [
  !tem('tabuada', 4)  && ['🧮', 'Tabuada 300 · 4º bim', 'Chegue ao nível 300 da Tabuada no 4º bimestre.'],
  !tem('negativa', 4) && ['➖', 'Negativa 150 · 4º bim', 'Chegue ao nível 150 da Tabuada Negativa no 4º bimestre.'],
  !tem('escalada', 4) && ['🧗', 'Escalada completa · 4º bim', 'Complete os 200 níveis da Escalada Algébrica no 4º bimestre.'],
  !tem('revisao_mestre', 4) && !tem('revisao_lenda', 4) && ['🏆', 'Mestre da Revisão', 'Conquiste as 26 insígnias do Jogo de Revisão.'],
  !tem('revisao_lenda', 4) && ['🌟', 'Lenda da Revisão', 'Conquiste as 26 insígnias douradas do Jogo de Revisão.'],
].filter(Boolean);
const cardBloq = ([icon, nome, req]) => `<div class="cert-card bloqueado">
    <div class="cert-icon">${icon}</div>
    <div class="cert-nome">${nome}</div>
    <div class="cert-desc">${req}</div>
    <div><div class="cert-lock">🔒 Bloqueado</div></div>
  </div>`;

const cardTabuadaAntigo = temBase ? `
      <div class="cert-card desbloqueado" onclick="window.location.href='/aluno/diploma_tabuada.html'">
        <div class="cert-icon">🏆</div>
        <div class="cert-nome">Mestre da Tabuada</div>
        <div class="cert-desc">Concluiu todos os 300 níveis do programa de Cálculo Mental, resolvendo mais de 3.100 operações matemáticas.</div>
        ${dataBase ? `<div class="cert-data">✅ Conquistado em ${dataBase}</div>` : ''}
        <a class="cert-btn" href="/aluno/diploma_tabuada.html" onclick="event.stopPropagation()">🎓 Ver diploma</a>
      </div>` : '';
const cardNegAntigo = temNeg ? `
      <div class="cert-card desbloqueado" onclick="window.location.href='/aluno/diploma_negativos.html'">
        <div class="cert-icon">⚡</div>
        <div class="cert-nome" style="color:#7F77DD">Mestre dos Negativos</div>
        <div class="cert-desc">Concluiu todos os 50 níveis da Tabuada de Números Negativos, dominando adição, subtração, multiplicação, divisão e potências.</div>
        ${dataNeg ? `<div class="cert-data" style="color:rgba(127,119,221,.7)">✅ Conquistado em ${dataNeg}</div>` : ''}
        <a class="cert-btn" href="/aluno/diploma_negativos.html" onclick="event.stopPropagation()" style="background:linear-gradient(135deg,#7F77DD,#a99ff0);color:#fff">⚡ Ver diploma</a>
      </div>` : '';

const totalConquistados = novos.length + (temBase ? 1 : 0) + (temNeg ? 1 : 0);
document.getElementById('certs-content').innerHTML = `
    <div class="certs-header">
      <div class="certs-header-icon">🎓</div>
      <div>
        <div style="font-size:28px;font-weight:900;color:#c9a84c;font-family:'Cinzel',serif;line-height:1">${totalConquistados}</div>
        <div style="font-size:12px;color:#6b7280;margin-top:2px">${totalConquistados ? `certificado${totalConquistados > 1 ? 's' : ''} conquistado${totalConquistados > 1 ? 's' : ''} 🏆` : 'Nenhum certificado ainda — continue jogando!'}</div>
      </div>
      ${novos.length > 1 ? `<a class="cert-btn" style="margin-left:auto" href="${urlCertificados(ordemNovos)}" target="_blank">🖨️ Baixar todos</a>` : ''}
    </div>
    <div class="certs-secao">🏅 3º e 4º bimestre</div>
    <div class="cert-grid">
      ${ordemNovos.map(cardNovo).join('')}
      ${faltam.map(cardBloq).join('')}
    </div>
    ${cardTabuadaAntigo || cardNegAntigo ? `<div class="certs-secao">📜 Certificados anteriores</div>
    <div class="cert-grid">${cardTabuadaAntigo}${cardNegAntigo}</div>` : ''}`;
</script>
</body>
</html>
