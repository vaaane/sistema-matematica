<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Competição+ — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    body{-webkit-user-select:none;user-select:none;}
    input,button{-webkit-user-select:auto;user-select:auto;}

    /* ── ARCADE DARK THEME ───────────────────────────────────── */
    body.arcade-mode{background:#07071a;}
    body.arcade-mode::after{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);
    }
    body.arcade-mode .sidebar{background:#0c0c22;border-right:1px solid #1e1e3a;}
    body.arcade-mode .sidebar .nav-item{color:#4a4a80;}
    body.arcade-mode .sidebar .nav-item.active,
    body.arcade-mode .sidebar .nav-item:hover{background:#1a1a3a;color:#9999dd;}
    body.arcade-mode .sidebar-logo,
    body.arcade-mode .sidebar .sidebar-section-label{color:#3a3a7a!important;}
    body.arcade-mode .main{background:#09091f;}
    body.arcade-mode .topbar{background:#0c0c22;border-bottom:1px solid #1e1e3a;}
    body.arcade-mode .topbar-title{
      font-family:'Orbitron',monospace;font-size:13px;letter-spacing:2px;color:#b0b0ff;
      text-shadow:0 0 10px rgba(150,150,255,.3);
    }
    body.arcade-mode .topbar-sub{color:#3a3a60;}

    /* ── KEYFRAMES ───────────────────────────────────────────── */
    @keyframes shake{
      0%,100%{transform:translateX(0)}10%{transform:translateX(-7px)}
      30%{transform:translateX(7px)}50%{transform:translateX(-4px)}
      70%{transform:translateX(4px)}90%{transform:translateX(-2px)}
    }
    @keyframes danger-pulse{
      0%,100%{color:#EF4444;text-shadow:0 0 16px rgba(239,68,68,.8)}
      50%{color:#ff8888;text-shadow:0 0 30px rgba(239,68,68,.4)}
    }
    @keyframes glow-record{
      0%,100%{text-shadow:0 0 14px rgba(250,184,0,.5)}
      50%{text-shadow:0 0 55px rgba(250,184,0,1),0 0 90px rgba(255,200,0,.6)}
    }
    @keyframes saldo-up{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
    @keyframes saldo-dn{0%,100%{transform:scale(1)}50%{transform:scale(.86)}}
    @keyframes urgente-blink{
      0%,100%{color:#EF4444;border-color:#EF4444;background:rgba(239,68,68,.12)}
      50%{color:#ff9999;border-color:#ff7777;background:rgba(239,68,68,.06)}
    }
    @keyframes float-up{
      0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
      20%{transform:translateX(-50%) translateY(-14px) scale(1.22)}
      70%{opacity:1}
      100%{opacity:0;transform:translateX(-50%) translateY(-90px) scale(.55)}
    }
    @keyframes float-dn{
      0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
      100%{opacity:0;transform:translateX(-50%) translateY(48px) scale(.65)}
    }
    @keyframes title-glow{
      0%,100%{text-shadow:0 0 20px rgba(160,160,255,.3)}
      50%{text-shadow:0 0 50px rgba(160,160,255,.75),0 0 95px rgba(100,100,255,.3)}
    }
    @keyframes btn-pulse{
      0%,100%{box-shadow:0 0 28px rgba(80,80,255,.5),inset 0 1px 0 rgba(255,255,255,.18)}
      50%{box-shadow:0 0 58px rgba(80,80,255,.85),0 0 95px rgba(60,60,200,.3),inset 0 1px 0 rgba(255,255,255,.18)}
    }
    @keyframes blink-g{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes notif-in{from{opacity:0;transform:translateX(-50%) scale(.7)}to{opacity:1;transform:translateX(-50%) scale(1)}}
    @keyframes ajuda-glow{0%,100%{box-shadow:0 0 5px rgba(168,85,247,.2)}50%{box-shadow:0 0 20px rgba(168,85,247,.65)}}
    @keyframes popup-dramatic{
      0%{opacity:0;transform:scale(.3) rotate(-12deg)}
      60%{transform:scale(1.08) rotate(2deg)}
      100%{opacity:1;transform:scale(1) rotate(0deg)}
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes banner-in{from{opacity:0;transform:translateX(55px)}to{opacity:1;transform:translateX(0)}}
    @keyframes banner-out{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(55px)}}
    @keyframes slide-in-left{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
    @keyframes slide-in-right{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
    @keyframes slide-in-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
    @keyframes rank-hl-up{0%,100%{background:transparent}50%{background:rgba(34,197,94,.18)}}
    @keyframes rank-hl-dn{0%,100%{background:transparent}50%{background:rgba(239,68,68,.14)}}
    @keyframes confete-fall{
      0%{transform:translateY(0) rotate(0deg);opacity:1}
      100%{transform:translateY(115vh) rotate(740deg);opacity:0}
    }
    @keyframes fim-record-glow{
      0%,100%{text-shadow:0 0 22px rgba(250,184,0,.5)}
      50%{text-shadow:0 0 65px rgba(250,184,0,1),0 0 110px rgba(255,200,0,.55)}
    }

    /* ── HUD ─────────────────────────────────────────────────── */
    .hud{
      display:flex;align-items:center;gap:14px;padding:12px 18px;
      background:linear-gradient(135deg,#0d0d28,#13133a);
      border:1px solid #262650;border-radius:var(--radius);margin-bottom:10px;
      flex-wrap:wrap;position:relative;
      box-shadow:0 0 32px rgba(60,60,200,.14),inset 0 1px 0 rgba(255,255,255,.05);
    }
    .hud-saldo-wrap{display:flex;flex-direction:column;align-items:center;min-width:64px;}
    .hud-saldo{
      font-family:'Orbitron',monospace;font-size:38px;font-weight:900;
      color:#FAB800;line-height:1;text-shadow:0 0 14px rgba(250,184,0,.5);
      transition:color .3s,text-shadow .3s;
    }
    .hud-saldo.danger{animation:danger-pulse 1s infinite;}
    .hud-saldo.record-flash{animation:glow-record .9s ease 3;}
    .hud-saldo.up{animation:saldo-up .3s ease;}
    .hud-saldo.dn{animation:saldo-dn .3s ease;color:#EF4444!important;}
    .hud-saldo-lbl{font-size:9px;color:#333365;letter-spacing:1px;font-weight:700;text-transform:uppercase;margin-top:2px;}
    .hud-sep{color:#1a1a40;font-size:24px;}
    .hud-mid{display:flex;flex-direction:column;gap:5px;}
    .hud-speed{font-size:12px;font-weight:700;color:#60A5FA;}
    .hud-speed span{font-family:'Orbitron',monospace;font-size:15px;}
    .hud-helps{display:flex;gap:5px;align-items:center;}
    .hud-help-icon{font-size:17px;transition:opacity .25s,filter .25s;}
    .hud-help-icon.empty{opacity:.2;filter:grayscale(1);}
    .hud-melhor{font-size:10px;color:#252550;white-space:nowrap;}
    .hud-records{
      display:flex;flex-wrap:wrap;gap:2px 16px;
      padding:3px 18px 8px;font-size:10px;font-weight:600;color:#383868;
    }
    .hud-records span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
    .hud-global{
      margin-left:auto;font-family:'Orbitron',monospace;font-size:17px;font-weight:700;
      color:#4a4a90;background:rgba(0,0,0,.35);padding:7px 13px;border-radius:9px;
      border:1px solid #252550;transition:all .3s;
    }
    .hud-global.urgente{animation:urgente-blink .8s infinite;}

    /* ── TIMER QUESTÃO ───────────────────────────────────────── */
    .timer-wrap{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
    .timer-track{
      flex:1;height:9px;background:rgba(255,255,255,.06);border-radius:6px;
      overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5);position:relative;
    }
    .timer-fill{
      height:100%;border-radius:6px;background:#22C55E;
      transition:width .95s linear,background .4s;
    }
    @keyframes gold-shimmer{
      0%,100%{box-shadow:0 0 8px rgba(250,184,0,.5);}
      50%{box-shadow:0 0 22px rgba(250,184,0,.95),0 0 40px rgba(250,184,0,.35);}
    }
    .timer-fill.dourado{animation:gold-shimmer 1.2s ease infinite;}
    .timer-mark50{
      position:absolute;left:50%;top:0;width:2px;height:100%;
      background:rgba(250,184,0,.55);pointer-events:none;z-index:2;
    }
    .timer-txt{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:#44447a;min-width:34px;text-align:right;}
    .timer-txt.urgente{color:#EF4444!important;}

    /* ── TENTATIVAS ──────────────────────────────────────────── */
    .tent-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
    .tent-dot{width:12px;height:12px;border-radius:50%;transition:background .3s,box-shadow .3s;}
    .tent-dot.ativa{background:#A855F7;box-shadow:0 0 8px rgba(168,85,247,.7);}
    .tent-dot.usada{background:#1c1c35;}
    .tent-lbl{font-size:11px;color:#363660;font-weight:600;}

    /* ── QUESTÃO CARD ────────────────────────────────────────── */
    .question-card{
      background:linear-gradient(135deg,#0d0d28,#131335);
      border:1.5px solid #262653;border-radius:var(--radius);
      box-shadow:0 0 30px rgba(50,50,180,.14),inset 0 1px 0 rgba(255,255,255,.04);
      padding:22px 22px 16px;
    }
    .question-card.shake{animation:shake .5s ease;}
    .q-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
    .q-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:16px;font-size:11px;font-weight:700;}
    .q-badge.facil{background:rgba(34,197,94,.15);color:#4ADE80;border:1px solid rgba(34,197,94,.25);}
    .q-badge.media{background:rgba(234,179,8,.15);color:#FDE047;border:1px solid rgba(234,179,8,.25);}
    .q-badge.dificil{background:rgba(239,68,68,.15);color:#F87171;border:1px solid rgba(239,68,68,.25);}
    .q-valor{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:#A855F7;}
    .q-text{font-size:18px;font-weight:700;line-height:1.6;color:#dddeff;margin-bottom:16px;pointer-events:none;}
    .q-unidade{font-size:12px;color:#40408a;margin-bottom:8px;}
    .answer-area{display:flex;gap:10px;margin-bottom:8px;}
    .answer-area .input{flex:1;font-size:15px;background:#0b0b22;border-color:#2e2e55;color:#dddeff;}
    .answer-area .input:focus{border-color:#6060cc;background:#0f0f2c;}
    .mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:8px;}
    .mc-btn{
      padding:12px 14px;border-radius:10px;border:1.5px solid #24244a;
      background:rgba(255,255,255,.04);font-size:14px;font-weight:600;
      cursor:pointer;color:#b0b0e0;font-family:'Inter',sans-serif;
      text-align:left;transition:background .12s,border-color .12s,transform .1s;
    }
    .mc-btn:hover:not(:disabled){background:rgba(100,100,255,.14);border-color:#5050aa;transform:scale(1.02);}
    .mc-btn.correto{background:rgba(34,197,94,.2)!important;border-color:#22C55E!important;color:#4ADE80!important;}
    .mc-btn.errado{background:rgba(239,68,68,.2)!important;border-color:#EF4444!important;color:#F87171!important;}
    .mc-btn:disabled{cursor:default;}
    #feedback{
      min-height:34px;display:flex;align-items:center;gap:8px;padding:8px 14px;
      border-radius:10px;font-size:13px;font-weight:600;transition:all .2s;margin-top:5px;
    }
    #feedback.ok{background:rgba(34,197,94,.12);border:1px solid #16803D;color:#4ADE80;}
    #feedback.err{background:rgba(239,68,68,.12);border:1px solid #DC2626;color:#F87171;}
    #feedback.warn{background:rgba(234,179,8,.12);border:1px solid #B45309;color:#FDE047;}
    #feedback.info{background:rgba(96,165,250,.12);border:1px solid #2563EB;color:#93C5FD;}
    #feedback.hidden{opacity:0;min-height:0;padding:0;border:none;}

    /* ── BOTÃO AJUDA ─────────────────────────────────────────── */
    .btn-ajuda{
      background:rgba(168,85,247,.12);border:1.5px solid rgba(168,85,247,.45);color:#C084FC;
      border-radius:10px;padding:9px 16px;font-family:'Inter',sans-serif;font-size:13px;
      font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
      transition:background .15s,border-color .15s;margin-top:10px;
      animation:ajuda-glow 2.2s ease infinite;
    }
    .btn-ajuda:hover:not(:disabled){background:rgba(168,85,247,.22);border-color:rgba(168,85,247,.8);}
    .btn-ajuda:disabled{opacity:.3;cursor:not-allowed;}
    .ajuda-badge{
      background:#A855F7;color:#fff;border-radius:8px;font-size:10px;
      font-weight:800;padding:2px 7px;font-family:'Orbitron',monospace;
    }
    .btn-pular{
      background:transparent;border:1px solid #1c1c38;color:#363660;border-radius:8px;
      padding:7px 13px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;
      transition:border-color .15s;margin-top:8px;margin-left:8px;
    }
    .btn-pular:hover{border-color:#363660;color:#6060a0;}

    /* ── FLOAT PONTOS ────────────────────────────────────────── */
    .float-pts{
      position:fixed;font-family:'Orbitron',monospace;font-weight:900;font-size:26px;
      pointer-events:none;z-index:900;
    }
    .float-pts.g{color:#FAB800;text-shadow:0 0 14px rgba(250,184,0,.7);animation:float-up 1.4s ease forwards;}
    .float-pts.p{color:#EF4444;text-shadow:0 0 14px rgba(239,68,68,.7);font-size:20px;animation:float-dn 1s ease forwards;}
    .float-pts.s{color:#60A5FA;font-size:13px;text-shadow:0 0 8px rgba(96,165,250,.6);animation:float-up 1.4s ease .18s forwards;}

    /* ── LAYOUT ──────────────────────────────────────────────── */
    .game-layout{display:grid;grid-template-columns:1fr 210px;gap:16px;align-items:start;}
    @media(max-width:768px){.game-layout{grid-template-columns:1fr}.rank-card{display:none!important}}

    /* ── RANKING LATERAL ─────────────────────────────────────── */
    .rank-card{
      background:linear-gradient(180deg,#0c0c24,#0a0a1e);
      border:1px solid #202048;border-radius:var(--radius);
      padding:14px;position:sticky;top:80px;
      box-shadow:0 0 22px rgba(20,20,80,.3);
    }
    .rank-fab{
      display:none;position:fixed;bottom:20px;right:20px;
      width:50px;height:50px;border-radius:50%;
      background:linear-gradient(135deg,#3B82F6,#1D4ED8);
      border:2px solid #60A5FA;font-size:22px;cursor:pointer;
      box-shadow:0 4px 18px rgba(59,130,246,.55);z-index:100;
      align-items:center;justify-content:center;transition:transform .15s;
    }
    .rank-fab:active{transform:scale(.88);}
    @media(max-width:768px){body.arcade-mode .rank-fab{display:flex;}}
    .rank-modal-ov{
      display:none;position:fixed;inset:0;z-index:200;
      background:rgba(0,0,20,.65);align-items:flex-end;
    }
    .rank-modal-ov.open{display:flex;}
    .rank-modal-sheet{
      width:100%;background:linear-gradient(180deg,#0d0d28,#080818);
      border-radius:18px 18px 0 0;border-top:1px solid #303060;
      padding:20px 16px 32px;max-height:70vh;overflow-y:auto;
      animation:slide-up .25s ease;
    }
    @keyframes slide-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .rank-modal-hdr{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#4040a0;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
    .rank-modal-close{font-size:20px;cursor:pointer;color:#4040a0;padding:0 4px;background:none;border:none;line-height:1;}
    .rank-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#2a2a58;margin-bottom:10px;}
    .rank-row{
      display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:8px;
      margin-bottom:3px;transition:background .5s;
    }
    .rank-row.eu{background:rgba(80,80,200,.2);border:1px solid #383890;}
    .rank-row.subiu{animation:rank-hl-up .9s ease;}
    .rank-row.desceu{animation:rank-hl-dn .9s ease;}
    .rank-pos{font-size:13px;font-weight:700;width:20px;text-align:center;flex-shrink:0;}
    .rank-nome{flex:1;font-size:11px;font-weight:700;color:#9090d0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .rank-pts{font-size:12px;font-weight:800;color:#FAB800;flex-shrink:0;font-family:'Orbitron',monospace;}
    .rank-sep{border-top:1px solid #181832;margin:5px 0;}
    .rank-ativo{font-size:9px;color:#22C55E;font-weight:700;animation:blink-g 1.4s ease infinite;}

    /* ── PRÉ-JOGO ────────────────────────────────────────────── */
    .pre-wrap{display:flex;flex-direction:column;align-items:center;padding:30px 16px 28px;text-align:center;}
    .pre-title{
      font-family:'Orbitron',monospace;font-size:30px;font-weight:900;color:#c0c0ff;
      letter-spacing:3px;animation:title-glow 2.5s ease infinite;margin-bottom:4px;
    }
    .pre-sub{font-size:12px;color:#3a3a78;margin-bottom:20px;letter-spacing:1.5px;font-weight:700;}
    .pre-timer{font-family:'Orbitron',monospace;font-size:13px;color:#3a3a70;margin-bottom:18px;letter-spacing:2px;}

    /* Pódio */
    .podio{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin-bottom:24px;}
    .podio-item{display:flex;flex-direction:column;align-items:center;gap:3px;}
    .podio-item:nth-child(1){animation:slide-in-left .5s ease .1s both}
    .podio-item:nth-child(2){animation:slide-in-up .5s ease .35s both}
    .podio-item:nth-child(3){animation:slide-in-right .5s ease .2s both}
    .podio-medal{font-size:30px;margin-bottom:2px;}
    .podio-nome{
      font-size:11px;font-weight:700;color:#8080cc;
      max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .podio-pts{font-family:'Orbitron',monospace;font-size:13px;font-weight:900;color:#FAB800;margin-bottom:5px;}
    .podio-plinth{border-radius:6px 6px 0 0;width:84px;}
    .podio-plinth.p1{height:64px;background:linear-gradient(180deg,#4a3800,#251c00);border:1px solid #7a5a00;border-bottom:none;}
    .podio-plinth.p2{height:46px;background:linear-gradient(180deg,#303038,#1c1c24);border:1px solid #5a5a68;border-bottom:none;}
    .podio-plinth.p3{height:34px;background:linear-gradient(180deg,#382010,#1e1008);border:1px solid #684020;border-bottom:none;}

    .pre-melhor{font-family:'Orbitron',monospace;font-size:22px;color:#FAB800;margin-bottom:2px;}
    .pre-melhor-lbl{font-size:11px;color:#3a3a70;margin-bottom:22px;}
    .pre-regras{
      background:#0a0a22;border:1px solid #1c1c3c;border-radius:14px;
      padding:16px 20px;max-width:420px;text-align:left;margin-bottom:26px;
      font-size:12px;color:#4a4a80;line-height:1.8;
    }
    .pre-regras strong{color:#7a7ac0;}
    .btn-iniciar{
      font-family:'Orbitron',monospace;font-size:17px;font-weight:700;letter-spacing:2px;
      padding:16px 58px;border-radius:14px;border:none;
      background:linear-gradient(135deg,#3a3acc,#6060ff);color:#fff;cursor:pointer;
      animation:btn-pulse 2s ease infinite;transition:transform .14s;
    }
    .btn-iniciar:hover{transform:scale(1.06);}

    /* ── FIM ─────────────────────────────────────────────────── */
    .fim-overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;
      align-items:center;justify-content:center;z-index:1000;padding:16px;overflow-y:auto;
    }
    .fim-card{
      background:linear-gradient(135deg,#0e0e2e,#18184a);border:2px solid #3a3a72;
      border-radius:22px;padding:28px 24px;text-align:center;max-width:420px;width:100%;
      box-shadow:0 0 70px rgba(60,60,200,.35);position:relative;
      animation:fadeUp .35s ease;
    }
    .fim-icon{font-size:50px;margin-bottom:8px;}
    .fim-saldo{
      font-family:'Orbitron',monospace;font-size:60px;font-weight:900;color:#FAB800;
      line-height:1;text-shadow:0 0 22px rgba(250,184,0,.5);margin-bottom:4px;
    }
    .fim-saldo.record{animation:fim-record-glow 1s ease infinite;}
    .fim-lbl{color:#3a3a68;font-size:12px;margin-bottom:8px;}
    .fim-rec{font-size:14px;font-weight:800;color:#22C55E;margin-bottom:14px;letter-spacing:.5px;}
    .fim-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
    .fim-s{background:rgba(255,255,255,.05);border-radius:11px;padding:11px 4px;border:1px solid rgba(255,255,255,.06);}
    .fim-sv{font-family:'Orbitron',monospace;font-size:16px;font-weight:800;}
    .fim-sl{font-size:10px;color:#303055;margin-top:3px;}
    .fim-badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0;}

<script>(()=>{const t=localStorage.getItem("tema");if(t==="escuro")document.documentElement.setAttribute("data-theme","dark");})()</script>
<script type="module">
import { respostasEquivalentes, dataAgora } from "/js/constants.js";
import { addResultado, updateResultado, saveDetalhes, getLiberadasParaTurma, listenRankingAtividade, getBestResultado, getResultadosByAluno, getAtividadeStatus } from "/js/db.js";
import { requireAluno, renderSidebarAluno, clearSession } from "/js/auth.js";

document.addEventListener('keydown', e => {
  const tag = e.target.tagName.toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if ((e.ctrlKey||e.metaKey) && ['c','a','x','u','s'].includes(e.key.toLowerCase())) e.preventDefault();
});

const sess = requireAluno();
if (!sess) throw new Error();
renderSidebarAluno("sidebar", "atividades");
window.sair = () => { document.body.classList.remove('arcade-mode'); clearSession(); window.location.href = "/index.html"; };
const { alunos, turma } = sess;

const nomeAtiv = new URLSearchParams(window.location.search).get("ativ");
if (!nomeAtiv) { window.location.href = "/aluno/atividades.html"; throw new Error(); }
const liberadas = await getLiberadasParaTurma(turma);
const liberada  = liberadas.find(l => l.atividade === nomeAtiv);
if (!liberada) { alert("Atividade não está mais liberada."); window.location.href = "/aluno/atividades.html"; throw new Error(); }

// Verificar status manual da atividade
const statusInfoPlus = await getAtividadeStatus(turma, liberada.atividade);
if (statusInfoPlus.status === 'encerrada') {
  alert("Atividade encerrada pela professora.");
  window.location.href = "/aluno/atividades.html"; throw new Error();
}
if (statusInfoPlus.status !== 'ativa') {
  if (!confirm(`Atenção: esta atividade vale ${statusInfoPlus.percentual}% da nota agora. Deseja continuar?`)) {
    window.location.href = "/aluno/atividades.html"; throw new Error();
  }
}

document.getElementById("topbar-title").textContent = liberada.atividade;
const pctLabelPlus = statusInfoPlus.percentual < 100 ? ` · ⏰ ${statusInfoPlus.percentual}%` : '';
document.getElementById("topbar-sub").textContent   = `Turma ${turma} · Competição+${pctLabelPlus}`;

const raw = await fetch("/dados/questoes_competicao.json").then(r => r.json());
function temRespostaNum(t) {
  if (t.tipo === 'numerica') return true;
  if (t.conjuntos) return !isNaN(parseFloat(String(t.conjuntos[0]?.resposta ?? '')));
  return false;
}
const templates = raw.filter(temRespostaNum);
const faceis   = templates.filter(t => t.dificuldade === 1);
const medias   = templates.filter(t => t.dificuldade === 2);
const dificeis = templates.filter(t => t.dificuldade === 3);

const PONTOS = { 1: 4, 2: 8, 3: 24 };
const TIMERS = { 1: 10, 2: 40, 3: 90 };

const _melhores = await Promise.all(alunos.map(al => getBestResultado(al, turma, liberada.atividade)));
let melhorPts = Math.max(0, ..._melhores.map(r => r?.pontuacao_bruta || r?.pontuacao || 0));

let latestRanking = [];
let prevMeuPos = -1;
let rankModo = 0; // 0 = turma, 1 = geral
let popupDifTimer = null;

const unsub = listenRankingAtividade(liberada.atividade, r => {
  latestRanking = r;
  renderRanking(r);
});
window.addEventListener("beforeunload", () => { unsub(); if (st) clearInterval(st.globalInterval); });

// ── Utilitários ───────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function avaliar(expr, vars) {
  try { return new Function(...Object.keys(vars), `"use strict";return(${expr})`)(...Object.values(vars)); }
  catch(e) { return null; }
}
function beep(freq, dur) {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.frequency.value = freq;
    g.gain.setValueAtTime(.22, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + dur/1000);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + dur/1000);
  } catch(e) {}
}
function formatGlobal(s) { return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
function getMedal(i) { return ['🥇','🥈','🥉'][i] || String(i+1); }

// ── Gerar questão ─────────────────────────────────────────────
function gerarQuestao(forceDif) {
  for (let attempt = 0; attempt <= 30; attempt++) {
    const dif = forceDif ?? (Math.random() < 0.65 ? 1 : 2);
    const pool = st.pools[dif];
    if (st.poolIdx[dif] >= pool.length) { st.pools[dif] = shuffle(pool); st.poolIdx[dif] = 0; }
    const t = pool[st.poolIdx[dif]++];

    let vars = {}, resposta = '', unidade = t.unidade || '';
    if (t.conjuntos) {
      const c = t.conjuntos[Math.floor(Math.random()*t.conjuntos.length)];
      vars = {...c}; resposta = String(c.resposta);
      if (c.unidade) unidade = c.unidade;
    } else {
      for (const [k,v] of Object.entries(t.variaveis||{})) {
        vars[k] = Array.isArray(v) ? v[Math.floor(Math.random()*v.length)]
                                   : v.min + Math.floor(Math.random()*(v.max-v.min+1));
      }
      resposta = String(avaliar(t.resposta_expr, vars) ?? '?');
    }
    let enunciado = t.enunciado;
    for (const [k,v] of Object.entries(vars)) enunciado = enunciado.replaceAll(`{${k}}`, v);

    const comboKey = enunciado + ':' + resposta;
    if (attempt === 30 || !st.seenCombos.has(comboKey)) {
      st.seenCombos.add(comboKey);
      return { enunciado, resposta, unidade, dif, pontos: PONTOS[dif], timer: t.timer ?? TIMERS[dif], bonus: false };
    }
  }
}

function gerarDistratores(resp, n=3) {
  const num = parseFloat(resp);
  if (isNaN(num)) return ['1','2','3'].slice(0,n);
  const cands = new Set();
  [num+1,num-1,num+2,num-2,num+3,num-3,Math.round(num*2),Math.round(num/2),
   Math.round(num*1.5),Math.round(num*.75),num+5,num-5]
    .forEach(v => { if (v!==num && v>0 && Number.isFinite(v)) cands.add(Math.round(v)); });
  return shuffle([...cands]).slice(0,n).map(String);
}

function valorAtual() {
  const fatores = [1.0, 0.75, 0.5];
  const v = Math.floor(st.questaoAtual.pontos * fatores[st.tentativaAtual]);
  return Math.max(1, v);
}

// ── Estado ────────────────────────────────────────────────────
let st = null;
function novoEstado() {
  return {
    saldo: 10, acertos: 0, erros: 0, respondidas: 0,
    tentativaAtual: 0,
    ajudas: 0, acertosRapidos: 0, acertosDificeis: 0,
    ajudasUsadasTotal: 0, semPenalidade: true,
    modoAjuda: false, ajudaUsada: false, ehBonus: false,
    questaoAtual: null,
    timerInterval: null, timerRestante: 0,
    globalInterval: null, globalRestante: 7*60,
    finalizado: false, processando: false,
    resultadoIds: {}, inicioTs: Date.now()/1000,
    questoesDetalhes: [], questaoHist: [],
    pools: { 1: shuffle([...faceis]), 2: shuffle([...medias]), 3: shuffle([...dificeis]) },
    poolIdx: { 1:0, 2:0, 3:0 },
    seenCombos: new Set(),
  };
}

// ── HUD ───────────────────────────────────────────────────────
function renderHUD() {
  // Saldo
  const sdEl = document.getElementById("hud-saldo");
  if (sdEl) {
    sdEl.textContent = st.saldo;
    if (st.saldo < 5 && !st.finalizado) sdEl.classList.add('danger');
    else sdEl.classList.remove('danger');
  }
  // Speed counter
  const spEl = document.getElementById("hud-speed");
  if (spEl) spEl.textContent = `${st.acertosRapidos % 5}/5`;
  // Help icons
  const ajEl = document.getElementById("hud-ajuda");
  if (ajEl) ajEl.innerHTML = [0,1,2].map(i =>
    `<span class="hud-help-icon${i < st.ajudas ? '' : ' empty'}">🎯</span>`
  ).join('');
  // Personal best
  const mbEl = document.getElementById("hud-melhor");
  if (mbEl) mbEl.textContent = melhorPts > 0 ? `Melhor: ${melhorPts}` : '';
  // Global timer
  const gEl = document.getElementById("hud-global");
  if (gEl) { gEl.textContent = `⏳ ${formatGlobal(st.globalRestante)}`; gEl.className = "hud-global" + (st.globalRestante <= 60 ? " urgente" : ""); }
  // Dots
  const dots = document.querySelectorAll('.tent-dot');
  const lbl  = document.querySelector('.tent-lbl');
  const rem  = 3 - st.tentativaAtual;
  dots.forEach((d,i) => d.className = `tent-dot ${i < rem ? 'ativa' : 'usada'}`);
  if (lbl) lbl.textContent = `${rem} tentativa${rem!==1?'s':''} restante${rem!==1?'s':''}`;
  // Valor atual da questão
  const valEl = document.querySelector('.q-valor');
  if (valEl) { const v=valorAtual(); valEl.textContent = `+${v} pt${v>1?'s':''}`; }
  // Records
  const recEl = document.getElementById("hud-records");
  if (recEl) recEl.innerHTML = getRecordsHTML();
}

function flashSaldo(tipo) {
  const el = document.getElementById("hud-saldo");
  if (!el) return;
  el.classList.remove('up','dn'); void el.offsetWidth;
  el.classList.add(tipo);
  setTimeout(() => el.classList.remove(tipo), 380);
}

// ── Área de resposta ──────────────────────────────────────────
function areaRespostaHTML() {
  const q = st.questaoAtual;
  if (st.modoAjuda) {
    const all = shuffle([q.resposta, ...gerarDistratores(q.resposta)]);
    return `<div class="mc-grid">
      ${all.map((op,i) => `<button class="mc-btn" id="mc-${i}" onclick="responderMC('${op.replace(/'/g,"\\'")}',${i})">${op}</button>`).join('')}
    </div>`;
  }
  return `<div class="answer-area">
      <input type="text" id="resp-input" class="input" inputmode="decimal"
        placeholder="Digite a resposta…" autocomplete="off"
        onkeydown="if(event.key==='Enter')responderNum()"/>
      <button class="btn btn-blue" id="btn-resp" onclick="responderNum()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>OK
      </button>
    </div>`;
}

function atualizarAreaResposta() {
  const el = document.getElementById("area-resposta");
  if (el) el.innerHTML = areaRespostaHTML();
  if (st.modoAjuda) {
    document.getElementById("btn-ajuda")?.remove();
    const valEl = document.querySelector('.q-valor');
    if (valEl) { const v=valorAtual(); valEl.textContent = `+${v} pt${v>1?'s':''}`; }
  }
}

// ── Render questão ────────────────────────────────────────────
function renderQuestao() {
  const q   = st.questaoAtual;
  const difMap = { 1:['Fácil','facil'], 2:['Média','media'], 3:['Difícil','dificil'] };
  const [difLbl, difCls] = difMap[q.dif] || difMap[1];
  const v = valorAtual();
  const penalidadeTxt = !st.ehBonus ? `−${Math.floor(q.pontos/2)}pt` : 'sem pena';
  const helpsHTML = [0,1,2].map(i => `<span class="hud-help-icon${i < st.ajudas ? '' : ' empty'}">🎯</span>`).join('');

  document.getElementById("content").innerHTML = `
    <div class="hud">
      <div class="hud-saldo-wrap">
        <div class="hud-saldo${st.saldo < 5 ? ' danger' : ''}" id="hud-saldo">${st.saldo}</div>
        <div class="hud-saldo-lbl">pontos</div>
      </div>
      <div class="hud-sep">·</div>
      <div class="hud-mid">
        <div class="hud-speed">⚡ <span id="hud-speed">${st.acertosRapidos%5}/5</span> rápidos</div>
        <div class="hud-helps" id="hud-ajuda">${helpsHTML}</div>
      </div>
      <div class="hud-melhor" id="hud-melhor">${melhorPts>0?`Melhor: ${melhorPts}`:''}</div>
      <div class="hud-global${st.globalRestante<=60?' urgente':''}" id="hud-global">⏳ ${formatGlobal(st.globalRestante)}</div>
    </div>
    <div class="hud-records" id="hud-records">${getRecordsHTML()}</div>
    <div class="timer-wrap">
      <div class="timer-track"><div class="timer-fill" id="timer-fill" style="width:100%"></div><div class="timer-mark50"></div></div>
      <span class="timer-txt" id="timer-txt">${q.timer}s</span>
    </div>
    <div class="tent-row">
      ${[0,1,2].map(i=>`<div class="tent-dot ${i<(3-st.tentativaAtual)?'ativa':'usada'}"></div>`).join('')}
      <span class="tent-lbl">${3-st.tentativaAtual} tentativa${(3-st.tentativaAtual)!==1?'s':''} restante${(3-st.tentativaAtual)!==1?'s':''}</span>
    </div>
    <div class="game-layout">
      <div>
        <div class="question-card">
          <div class="q-meta">
            <span class="q-badge ${difCls}">● ${difLbl}</span>
            <span class="q-valor">+${v} pt${v>1?'s':''}</span>
            ${st.ehBonus?`<span style="font-size:11px;font-weight:700;color:#FDE047">🏆 BÔNUS · sem penalidade</span>`:''}
          </div>
          <div class="q-text">${q.enunciado}</div>
          <div id="area-resposta">${areaRespostaHTML()}</div>
          <div id="feedback" class="hidden"></div>
          ${!st.modoAjuda && st.ajudas>0 ? `
          <button class="btn-ajuda" id="btn-ajuda" onclick="usarAjuda()">
            🎯 Usar ajuda <span class="ajuda-badge">${st.ajudas}</span>
          </button>` : ''}
          <button class="btn-pular" onclick="pularQuestao()">${st.ehBonus?'Recusar bônus':`Pular (${penalidadeTxt})`}</button>
        </div>
      </div>
      <div class="rank-card">
        <div class="rank-title">⭐ Ranking ao vivo</div>
        <div id="ranking-list"><div style="font-size:11px;color:#2a2a50">Carregando…</div></div>
      </div>
    </div>`;

  renderRanking(latestRanking);
  if (!st.modoAjuda) document.getElementById("resp-input")?.focus();
}

function mostrarFeedback(tipo, msg) {
  const el = document.getElementById("feedback");
  if (el) { el.className = tipo; el.innerHTML = msg; }
}

// ── Ranking ───────────────────────────────────────────────────
function switchRankMode() {
  rankModo = 1 - rankModo;
  const el = document.getElementById("ranking-list");
  if (!el) return;
  el.style.transition = 'opacity .3s ease';
  el.style.opacity = '0';
  setTimeout(() => { renderRanking(latestRanking); el.style.opacity = '1'; }, 320);
}

function getRecordsHTML() {
  const recTurma = latestRanking.find(r => r.turma === turma);
  const recGeral = latestRanking[0];
  return [
    melhorPts > 0 ? `<span>⭐ Seu recorde: ${melhorPts} pts</span>` : '',
    recTurma ? `<span>🏫 Turma: ${recTurma.pontuacao} pts — ${recTurma.aluno}</span>` : '',
    recGeral ? `<span>🌎 Geral: ${recGeral.pontuacao} pts — ${recGeral.aluno} (${recGeral.turma})</span>` : '',
  ].filter(Boolean).join('');
}

function mostrarBannerRank(tipo, texto) {
  document.querySelector('.banner-rank')?.remove();
  const d = document.createElement("div");
  d.className = `banner-rank ${tipo}`;
  d.textContent = texto;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3400);
}

function renderRanking(ranking) {
  const el = document.getElementById("ranking-list");
  const elModal = document.getElementById("ranking-list-modal");
  if (!ranking.length) {
    const emptyHTML = '<div style="font-size:11px;color:#2a2a50;padding:4px 0">Aguardando resultados…</div>';
    if (el) el.innerHTML = emptyHTML;
    if (elModal) elModal.innerHTML = emptyHTML;
    return;
  }
  const meu = ranking.findIndex(r => alunos.includes(r.aluno));

  if (st && !st.finalizado && Object.keys(st.resultadoIds).length && meu >= 0 && prevMeuPos >= 0 && meu !== prevMeuPos) {
    if (meu < prevMeuPos) mostrarBannerRank('up', `↑ Você subiu para o ${meu+1}º lugar!`);
    else mostrarBannerRank('dn', `⚠️ ${ranking[meu-1]?.aluno || 'Alguém'} acabou de te passar!`);
  }
  if (meu >= 0) prevMeuPos = meu;
  if (!el) return;

  const titleEl = document.querySelector('.rank-title');
  let lista, euIdx;
  if (rankModo === 0) {
    lista = ranking.filter(r => r.turma === turma).slice(0, 3);
    euIdx = lista.findIndex(r => alunos.includes(r.aluno));
    if (titleEl) titleEl.textContent = `🏫 Turma ${turma}`;
  } else {
    lista = ranking.slice(0, 3);
    euIdx = lista.findIndex(r => alunos.includes(r.aluno));
    if (titleEl) titleEl.textContent = '🌎 Ranking Geral';
  }

  let html = lista.map((r, i) => {
    const eu = alunos.includes(r.aluno);
    return `<div class="rank-row${eu?' eu':''}">
      <div class="rank-pos">${getMedal(i)}</div>
      <div style="flex:1;overflow:hidden">
        <div class="rank-nome">${r.aluno}${eu?' ★':''}</div>
        ${rankModo === 1 && r.turma ? `<div style="font-size:9px;color:#303060;margin-top:1px">${r.turma}</div>` : ''}
        ${!r.concluido?`<div class="rank-ativo">⚡ jogando</div>`:''}
      </div>
      <div class="rank-pts">${r.pontuacao}</div>
    </div>`;
  }).join('');

  if (euIdx < 0) {
    if (rankModo === 0) {
      const rankTurma = ranking.filter(r => r.turma === turma);
      const meuT = rankTurma.findIndex(r => alunos.includes(r.aluno));
      if (meuT >= 0) {
        const r = rankTurma[meuT];
        html += `<div class="rank-sep"></div>
        <div class="rank-row eu">
          <div class="rank-pos">${meuT+1}</div>
          <div style="flex:1;overflow:hidden"><div class="rank-nome">${r.aluno} ★</div></div>
          <div class="rank-pts">${r.pontuacao}</div>
        </div>`;
      }
    } else if (meu >= 0) {
      const r = ranking[meu];
      html += `<div class="rank-sep"></div>
      <div class="rank-row eu">
        <div class="rank-pos">${meu+1}</div>
        <div style="flex:1;overflow:hidden">
          <div class="rank-nome">${r.aluno} ★</div>
          ${r.turma?`<div style="font-size:9px;color:#303060;margin-top:1px">${r.turma}</div>`:''}
        </div>
        <div class="rank-pts">${r.pontuacao}</div>
      </div>`;
    }
  }
  if (el) el.innerHTML = html;
  if (elModal) {
    const titleModal = document.getElementById("rank-modal-title");
    if (titleModal) titleModal.textContent = rankModo === 0 ? `🏫 Turma ${turma}` : '🌎 Ranking Geral';
    elModal.innerHTML = html;
  }
}

window.abrirRankModal = function() {
  document.getElementById("rank-modal-ov")?.classList.add("open");
  renderRanking(latestRanking);
};

window.fecharRankModal = function(e) {
  if (!e || e.target === document.getElementById("rank-modal-ov")) {
    document.getElementById("rank-modal-ov")?.classList.remove("open");
  }
};

// ── Timer por questão ─────────────────────────────────────────
function iniciarTimer(seg) {
  clearInterval(st.timerInterval);
  st.timerRestante = seg;
  atualizarTimerUI();
  st.timerInterval = setInterval(() => {
    st.timerRestante = Math.max(0, st.timerRestante - 1);
    atualizarTimerUI();
    if (st.timerRestante <= 0) { clearInterval(st.timerInterval); timerExpirou(); }
  }, 1000);
}

function atualizarTimerUI() {
  const q   = st.questaoAtual;
  const pct = q ? (st.timerRestante / q.timer) * 100 : 100;
  const fill = document.getElementById("timer-fill");
  const txt  = document.getElementById("timer-txt");
  const mark = document.querySelector(".timer-mark50");
  if (fill) {
    fill.style.width = pct + "%";
    const t = st.tentativaAtual;
    if (t === 0) {
      // 1ª tentativa: dourado nos primeiros 50%, azul depois
      if (pct > 50) {
        fill.style.background = '#FAB800';
        fill.style.boxShadow  = '';
        fill.classList.add('dourado');
      } else {
        fill.classList.remove('dourado');
        fill.style.background = '#3B82F6';
        fill.style.boxShadow  = '0 0 8px rgba(59,130,246,.5)';
      }
    } else if (t === 1) {
      // 2ª tentativa: toda âmbar
      fill.classList.remove('dourado');
      fill.style.background = '#F59E0B';
      fill.style.boxShadow  = 'none';
    } else {
      // 3ª tentativa: toda vermelha
      fill.classList.remove('dourado');
      fill.style.background = '#EF4444';
      fill.style.boxShadow  = 'none';
    }
  }
  if (mark) mark.style.opacity = st.tentativaAtual === 0 ? '1' : '0';
  if (txt) { txt.textContent = st.timerRestante+"s"; txt.className = "timer-txt"+(st.tentativaAtual>=2||pct<=25?" urgente":""); }
}

function timerExpirou() {
  if (st.processando || st.finalizado) return;
  st.processando = true;
  st.tentativaAtual++;
  const q = st.questaoAtual;
  st.questaoHist.push({ resposta: '(tempo)', correto: false, tempoUsado: q.timer });
  document.querySelectorAll(".mc-btn").forEach(b => b.disabled = true);
  const btn = document.getElementById("btn-resp"); if (btn) btn.disabled = true;
  const inp = document.getElementById("resp-input"); if (inp) inp.disabled = true;

  if (st.tentativaAtual >= 3) {
    st.erros++; st.respondidas++;
    if (st.respondidas % 3 === 0) { checkpoint(); switchRankMode(); }
    document.querySelectorAll('.mc-btn').forEach(b => {
      if (respostasEquivalentes(b.textContent, q.resposta)) b.classList.add('correto');
    });
    registrarQuestao(false, -Math.floor(q.pontos * 0.5), false, 0);
    mostrarFeedback("warn", `⏱ Tempo! Resposta: ${q.resposta}${q.unidade?' '+q.unidade:''}`);
    aplicarPenalidade(q, true);
  } else {
    mostrarFeedback("err", `⏱ Tempo esgotado! ${3-st.tentativaAtual} tentativa${(3-st.tentativaAtual)>1?'s':''} restante${(3-st.tentativaAtual)>1?'s':''}.`);
    beep(350, 300);
    renderHUD();
    setTimeout(() => {
      if (st.finalizado) return;
      mostrarFeedback("hidden", "");
      st.processando = false;
      atualizarAreaResposta();
      iniciarTimer(st.questaoAtual.timer);
      if (!st.modoAjuda) document.getElementById("resp-input")?.focus();
    }, 1400);
  }
}

// ── Timer global (7 minutos) ──────────────────────────────────
function iniciarGlobalTimer() {
  clearInterval(st.globalInterval);
  st.globalInterval = setInterval(() => {
    st.globalRestante = Math.max(0, st.globalRestante - 1);
    const el = document.getElementById("hud-global");
    if (el) { el.textContent = `⏳ ${formatGlobal(st.globalRestante)}`; el.className = "hud-global"+(st.globalRestante<=60?" urgente":""); }
    if (st.globalRestante <= 0) { clearInterval(st.globalInterval); encerrarSessao('tempo'); }
  }, 1000);
}

// ── Responder ─────────────────────────────────────────────────
window.responderNum = function() {
  if (st.processando || st.finalizado) return;
  const inp = document.getElementById("resp-input");
  const val = inp ? inp.value.trim() : "";
  if (!val) { mostrarFeedback("info", "⚠️ Digite a resposta."); return; }
  const btn = document.getElementById("btn-resp"); if (btn) btn.disabled = true;
  if (inp) inp.disabled = true;
  processar(val, null);
};

window.responderMC = function(op, idx) {
  if (st.processando || st.finalizado) return;
  document.querySelectorAll(".mc-btn").forEach(b => b.disabled = true);
  processar(op, idx);
};

// ── Processar resposta ────────────────────────────────────────
function processar(resposta, mcIdx) {
  st.processando = true;
  clearInterval(st.timerInterval);
  const q       = st.questaoAtual;
  const correto = respostasEquivalentes(resposta, q.resposta);
  const tempoUsado = q.timer - st.timerRestante;
  st.questaoHist.push({ resposta, correto, tempoUsado });

  if (correto) {
    st.respondidas++; st.acertos++;
    let pts = valorAtual();
    const rapido   = !st.ajudaUsada && tempoUsado < q.timer * 0.5;
    const speedPts = rapido ? (q.dif === 1 ? 1 : 2) : 0;
    pts += speedPts;

    st.saldo += pts;
    if (rapido) {
      st.acertosRapidos++;
      if (st.acertosRapidos > 0 && st.acertosRapidos % 3 === 0) {
        st.ajudas = Math.min(3, st.ajudas + 1);
        setTimeout(() => mostrarNotif(`🎯 +1 ajuda! ${st.acertosRapidos} rápidos!`), 200);
      }
    }
    if (q.dif === 3) {
      st.acertosDificeis++;
      if (!st.ajudaUsada) {
        st.ajudas = Math.min(3, st.ajudas + 1);
        setTimeout(() => mostrarNotif('🎯 +1 ajuda por questão bônus!'), 250);
      }
    }

    if (mcIdx !== null) document.getElementById(`mc-${mcIdx}`)?.classList.add('correto');

    let feedMsg = `✅ Correto! +${pts} pt${pts>1?'s':''}`;
    if (speedPts > 0) feedMsg += ` <span style="color:#60A5FA">⚡ +${speedPts} veloz!</span>`;
    mostrarFeedback("ok", feedMsg);
    floatPts(pts - speedPts, 'g');
    if (speedPts > 0) setTimeout(() => floatPts2(`⚡ +${speedPts}pt veloz!`), 200);
    beep(1000, 150);
    flashSaldo('up');

    // Novo recorde pessoal durante o jogo
    if (st.saldo > melhorPts) {
      const sdEl = document.getElementById("hud-saldo");
      if (sdEl) { sdEl.classList.add('record-flash'); setTimeout(() => sdEl.classList.remove('record-flash'), 3000); }
    }

    renderHUD();
    registrarQuestao(true, pts, rapido, speedPts);
    if (st.respondidas % 3 === 0) { checkpoint(); switchRankMode(); }

    const oferta = rapido && st.acertosRapidos > 0 && st.acertosRapidos % 5 === 0;

    setTimeout(() => {
      if (st.finalizado) return;
      st.processando = false;
      if (oferta) mostrarOfertaDificil();
      else proxima();
    }, 1400);

  } else {
    st.tentativaAtual++;

    // Shake na questão
    const card = document.querySelector('.question-card');
    if (card) { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); setTimeout(() => card.classList.remove('shake'), 550); }

    if (mcIdx !== null) {
      document.getElementById(`mc-${mcIdx}`)?.classList.add('errado');
    }

    if (st.tentativaAtual >= 3) {
      document.querySelectorAll('.mc-btn').forEach(b => {
        if (respostasEquivalentes(b.textContent, q.resposta)) b.classList.add('correto');
      });
      st.erros++; st.respondidas++;
      if (st.respondidas % 3 === 0) { checkpoint(); switchRankMode(); }
      if (st.ehBonus) {
        registrarQuestao(false, 0, false, 0);
        mostrarFeedback("info", `Não foi! Resposta: ${q.resposta}${q.unidade?' '+q.unidade:''} · Sem penalidade.`);
        beep(400, 250);
        setTimeout(() => { if (!st.finalizado) { st.processando = false; proxima(); } }, 2000);
      } else {
        registrarQuestao(false, -Math.floor(q.pontos * 0.5), false, 0);
        aplicarPenalidade(q, false);
      }
    } else {
      mostrarFeedback("err", `❌ Errado! ${3-st.tentativaAtual} tentativa${(3-st.tentativaAtual)>1?'s':''} restante${(3-st.tentativaAtual)>1?'s':''}.`);
      beep(400, 280);
      renderHUD();
      setTimeout(() => {
        if (st.finalizado) return;
        mostrarFeedback("hidden", "");
        st.processando = false;
        atualizarAreaResposta();
        iniciarTimer(q.timer);
        if (!st.modoAjuda) document.getElementById("resp-input")?.focus();
      }, 1400);
    }
  }
}

function aplicarPenalidade(q, deTempo) {
  const pen = Math.floor(q.pontos * 0.5);
  st.saldo = Math.max(0, st.saldo - pen);
  st.semPenalidade = false;
  floatPts(pen, 'p');
  flashSaldo('dn');
  beep(250, 350);
  const resp = q.resposta + (q.unidade ? ' '+q.unidade : '');
  mostrarFeedback("warn", `⚠️ ${deTempo?'Tempo! ':''} Resposta: ${resp} · −${pen} pt${pen>1?'s':''}`);
  renderHUD();
  if (st.saldo <= 0) {
    setTimeout(() => encerrarSessao('saldo'), 2000);
  } else {
    setTimeout(() => { if (!st.finalizado) { st.processando = false; proxima(); } }, 2200);
  }
}

// ── Registrar questão concluída ───────────────────────────────
function registrarQuestao(acertou, pontosGanhos, velocidade, speedPts) {
  const q = st.questaoAtual;
  st.questoesDetalhes.push({
    enunciado: q.enunciado,
    resposta_correta: q.resposta + (q.unidade ? ' ' + q.unidade : ''),
    dificuldade: q.dif,
    ehBonus: !!st.ehBonus,
    tentativas: [...st.questaoHist],
    acertou,
    pontosGanhos,
    usouAjuda: !!st.ajudaUsada,
    velocidade,
    speedPts,
  });
  st.questaoHist = [];
}

function mostrarRespostaAnterior(q) {
  document.querySelector('.banner-resp-ant')?.remove();
  const d = document.createElement("div");
  d.className = "banner-resp-ant";
  d.textContent = `✓ Resposta: ${q.resposta}${q.unidade ? ' ' + q.unidade : ''}`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1500);
}

// ── Ajuda ─────────────────────────────────────────────────────
window.usarAjuda = function() {
  if (!st || st.ajudas <= 0 || st.modoAjuda || st.processando || st.finalizado) return;
  st.ajudas--;
  st.ajudaUsada = true;
  st.modoAjuda  = true;
  st.ajudasUsadasTotal = (st.ajudasUsadasTotal||0) + 1;
  atualizarAreaResposta();
  renderHUD();
  mostrarFeedback("info", "🎯 Ajuda ativada! Pontuação completa — escolha a correta!");
};

window.pularQuestao = function() {
  if (!st || st.processando || st.finalizado) return;
  clearInterval(st.timerInterval);
  const q = st.questaoAtual;
  st.questaoHist.push({ resposta: '(pulou)', correto: false, tempoUsado: q.timer - st.timerRestante });
  if (st.ehBonus) {
    registrarQuestao(false, 0, false, 0);
    st.processando = true;
    mostrarFeedback("info", "Questão bônus recusada.");
    setTimeout(() => { if (!st.finalizado) { st.processando = false; proxima(); } }, 900);
    return;
  }
  st.erros++; st.respondidas++;
  if (st.respondidas % 3 === 0) { checkpoint(); switchRankMode(); }
  registrarQuestao(false, -Math.floor(q.pontos * 0.5), false, 0);
  aplicarPenalidade(q, false);
};

// ── Próxima questão ───────────────────────────────────────────
function proxima() {
  if (st.finalizado) return;
  if (st.questaoAtual) mostrarRespostaAnterior(st.questaoAtual);
  st.tentativaAtual = 0;
  st.modoAjuda = false;
  st.ajudaUsada = false;
  st.ehBonus = false;
  st.questaoAtual = gerarQuestao();
  renderQuestao();
  iniciarTimer(st.questaoAtual.timer);
}

// ── Popup questão difícil (com timer de 5s) ───────────────────
function mostrarOfertaDificil() {
  const ov = document.createElement("div");
  ov.className = "popup-ov";
  ov.id = "popup-dificil";
  ov.innerHTML = `
    <div class="popup-card">
      <div class="popup-icon">🏆</div>
      <div class="popup-titulo">QUESTÃO BÔNUS!</div>
      <div class="popup-desc">
        Você está em chamas! ⚡<br>
        Vale <strong>24 pts</strong> + 1 ajuda.<br>
        Sem penalidade se errar. Aceita?
      </div>
      <div class="popup-timer-track">
        <div class="popup-timer-fill" id="popup-tfill" style="width:100%"></div>
      </div>
      <button class="popup-btn-a" onclick="aceitarDificil()">✅ Aceitar o desafio!</button>
      <button class="popup-btn-r" onclick="recusarDificil()">Não, próxima questão</button>
    </div>`;
  document.body.appendChild(ov);

  let tLeft = 5;
  popupDifTimer = setInterval(() => {
    tLeft--;
    const fill = document.getElementById("popup-tfill");
    if (fill) fill.style.width = (tLeft / 5 * 100) + "%";
    if (tLeft <= 0) {
      clearInterval(popupDifTimer); popupDifTimer = null;
      recusarDificil();
    }
  }, 1000);
}

window.aceitarDificil = function() {
  if (popupDifTimer) { clearInterval(popupDifTimer); popupDifTimer = null; }
  document.getElementById("popup-dificil")?.remove();
  if (st.finalizado) return;
  st.questaoAtual = gerarQuestao(3);
  st.questaoAtual.bonus = true;
  st.tentativaAtual = 0;
  st.modoAjuda = false;
  st.ajudaUsada = false;
  st.ehBonus = true;
  renderQuestao();
  iniciarTimer(st.questaoAtual.timer);
};

window.recusarDificil = function() {
  if (popupDifTimer) { clearInterval(popupDifTimer); popupDifTimer = null; }
  document.getElementById("popup-dificil")?.remove();
  if (!st.finalizado) proxima();
};

// ── Notificações e floats ─────────────────────────────────────
function mostrarNotif(msg) {
  const old = document.querySelector('.notif'); if (old) old.remove();
  const d = document.createElement("div");
  d.className = "notif"; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2800);
}

function floatPts(pts, tipo) {
  const d = document.createElement("div");
  d.className = `float-pts ${tipo}`;
  d.textContent = tipo === 'p' ? `−${pts}` : `+${pts}`;
  d.style.cssText = `left:50%;top:42%;`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1450);
}

function floatPts2(texto) {
  const d = document.createElement("div");
  d.className = 'float-pts s';
  d.textContent = texto;
  d.style.cssText = `left:50%;top:50%;`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1600);
}

function lancarConfete(n = 70) {
  const wrap = document.createElement("div");
  wrap.className = "confete-wrap";
  document.body.appendChild(wrap);
  const colors = ['#FAB800','#22C55E','#60A5FA','#A855F7','#F87171','#FDE047','#4ADE80','#FF6B9D'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement("div");
    p.className = "confete-particle";
    const w = 6 + Math.random() * 8;
    p.style.cssText = `left:${Math.random()*100}%;width:${w}px;height:${w*1.6}px;`
      + `background:${colors[Math.floor(Math.random()*colors.length)]};`
      + `animation-duration:${2.5 + Math.random()*3}s;animation-delay:${Math.random()*1.8}s;`;
    wrap.appendChild(p);
  }
  setTimeout(() => wrap.remove(), 7000);
}


// ── Checkpoint Firebase ───────────────────────────────────────
async function checkpoint() {
  if (!Object.keys(st.resultadoIds).length) return;
  const t = Math.round(Date.now()/1000 - st.inicioTs);
  for (const al of alunos) {
    if (st.resultadoIds[al]) {
      updateResultado(st.resultadoIds[al], {
        pontuacao: st.saldo, acertos: st.acertos, erros: st.erros,
        respondidas: st.respondidas, tempo: `${t}s`,
      }).catch(()=>{});
    }
  }
}

// ── Encerrar sessão ───────────────────────────────────────────
async function encerrarSessao(motivo) {
  if (!st || st.finalizado) return;
  st.finalizado = true;
  clearInterval(st.timerInterval);
  clearInterval(st.globalInterval);

  let bonusFim = 0;
  if (motivo === 'tempo' && st.semPenalidade && st.respondidas > 0) {
    bonusFim = 20;
    st.saldo += bonusFim;
  }

  const t = Math.round(Date.now()/1000 - st.inicioTs);
  let percentualNotaPlus = 100;
  try {
    const stFimPlus = await getAtividadeStatus(turma, liberada.atividade);
    percentualNotaPlus = stFimPlus.percentual ?? 100;
  } catch(e) {}
  const saldoAplicado = st.saldo > 0 ? Math.max(1, Math.floor(st.saldo * percentualNotaPlus / 100)) : 0;

  const dados = {
    pontuacao_bruta: st.saldo, pontuacao: saldoAplicado,
    percentual_nota: percentualNotaPlus, com_abatimento: percentualNotaPlus < 100,
    acertos: st.acertos, erros: st.erros,
    respondidas: st.respondidas, ajudas_usadas: st.ajudasUsadasTotal||0,
    acertos_rapidos: st.acertosRapidos, acertos_dificeis: st.acertosDificeis||0,
    sem_penalidade: st.semPenalidade,
    bonus_fim: bonusFim, modo: "competicao_plus",
    tempo: `${t}s`, ts_inicio: st.inicioTs, data: dataAgora(), concluido: true,
  };
  for (const al of alunos) {
    const rid = st.resultadoIds[al];
    if (rid) {
      try { await updateResultado(rid, { ...dados, aluno: al, turma, atividade: liberada.atividade }); }
      catch(e) { console.error("encerrar:", e); }
      if (st.questoesDetalhes.length > 0) {
        saveDetalhes(rid, st.questoesDetalhes).catch(() => {});
      }
    }
  }

  const novoMelhor = st.saldo > melhorPts;
  if (novoMelhor) melhorPts = st.saldo;
  mostrarFim(motivo, novoMelhor, bonusFim);
}

function mostrarFim(motivo, novoMelhor, bonusFim) {
  const icone = motivo==='saldo' ? '💀' : motivo==='manual' ? '🏁' : '⏰';
  const taxa  = st.respondidas>0 ? Math.round(st.acertos/st.respondidas*100) : 0;

  // Confete se top 3
  const meuPos = latestRanking.findIndex(r => alunos.includes(r.aluno));
  if (meuPos >= 0 && meuPos < 3) lancarConfete(80);

  // Plaquinhas
  const badges = [];
  if (st.acertosRapidos > 0)
    badges.push(`<span class="fim-badge veloz">⚡ ${st.acertosRapidos} rápidos</span>`);
  if (st.semPenalidade && st.respondidas > 0)
    badges.push(`<span class="fim-badge limpo">🔥 Sem penalidades</span>`);
  if ((st.acertosDificeis||0) > 0)
    badges.push(`<span class="fim-badge bonus-rei">🏆 ${st.acertosDificeis} bônus</span>`);

  const ov = document.createElement("div");
  ov.className = "fim-overlay";
  ov.innerHTML = `
    <div class="fim-card">
      <div class="fim-icon">${icone}</div>
      <div class="fim-saldo${novoMelhor?' record':''}">${st.saldo}</div>
      <div class="fim-lbl">pontos${motivo==='saldo'?' · Saldo zerado':''}${bonusFim>0?' · +'+bonusFim+' bônus sem penalidade!':''}</div>
      ${novoMelhor
        ? `<div class="fim-rec">🎉 Novo recorde pessoal!</div>`
        : melhorPts>0 ? `<div style="font-size:11px;color:#2a2a50;margin-bottom:12px">Melhor anterior: ${melhorPts} pts</div>` : ''}
      <div class="fim-stats">
        <div class="fim-s"><div class="fim-sv" style="color:#4ADE80">${st.acertos}</div><div class="fim-sl">Acertos</div></div>
        <div class="fim-s"><div class="fim-sv" style="color:#F87171">${st.erros}</div><div class="fim-sl">Erros</div></div>
        <div class="fim-s"><div class="fim-sv" style="color:#60A5FA">${taxa}%</div><div class="fim-sl">Taxa</div></div>
      </div>
      <div class="fim-stats">
        <div class="fim-s"><div class="fim-sv" style="color:#60A5FA">${st.acertosRapidos}</div><div class="fim-sl">Rápidos ⚡</div></div>
        <div class="fim-s"><div class="fim-sv" style="color:#A855F7">${st.ajudasUsadasTotal||0}</div><div class="fim-sl">Ajudas</div></div>
        <div class="fim-s"><div class="fim-sv" style="color:#5050a0">${st.respondidas}</div><div class="fim-sl">Questões</div></div>
      </div>
      ${badges.length ? `<div class="fim-badges">${badges.join('')}</div>` : ''}
      ${motivo==='saldo'&&st.globalRestante>0
        ? `<button class="btn-restart" onclick="reiniciar()">▶ JOGAR NOVAMENTE (${formatGlobal(st.globalRestante)})</button>` : ''}
      ${motivo==='tempo'
        ? `<button class="btn-restart" onclick="reiniciar()">▶ NOVA SESSÃO</button>` : ''}
      ${motivo==='manual'
        ? `<button class="btn-restart" onclick="reiniciar()">▶ JOGAR NOVAMENTE</button>` : ''}
      <button class="btn-voltar" onclick="window.location.href='/aluno/atividades.html'">← Voltar</button>
    </div>`;
  document.body.appendChild(ov);
}

// ── Reiniciar ─────────────────────────────────────────────────
window.reiniciar = async function() {
  document.querySelector(".fim-overlay")?.remove();
  const restante = st ? st.globalRestante : 7*60;
  const iniciouGlobal = st && st.globalRestante < 7*60;

  st = novoEstado();
  if (iniciouGlobal && restante > 0) st.globalRestante = restante;
  document.body.classList.add('arcade-mode');

  const agora = dataAgora();
  for (const al of alunos) {
    st.resultadoIds[al] = await addResultado({
      aluno: al, turma, atividade: liberada.atividade,
      modo: "competicao_plus", concluido: false,
      pontuacao: 10, acertos: 0, erros: 0, respondidas: 0,
      ts_inicio: st.inicioTs, data: agora,
    });
  }

  iniciarGlobalTimer();
  proxima();
};

window.pedirEncerrar = function() {
  if (!st || st.finalizado) return;
  document.getElementById("encerrar-modal")?.remove();
  const ov = document.createElement("div");
  ov.id = "encerrar-modal";
  ov.className = "encerrar-modal-ov";
  ov.innerHTML = `
    <div class="encerrar-modal-card">
      <div style="font-size:20px;margin-bottom:8px">🏁 Encerrar sessão?</div>
      <div style="font-size:13px;color:#9999dd;margin-bottom:16px">Pontuação atual: <strong style="color:#FAB800">${st.saldo} pts</strong></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-red" style="flex:1;justify-content:center" onclick="confirmarEncerrar()">Encerrar</button>
        <button class="btn" style="flex:1;justify-content:center;background:#1a1a3a;color:#9999dd;border-color:#3a3a6a" onclick="cancelarEncerrar()">Cancelar</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
};

window.confirmarEncerrar = function() {
  document.getElementById("encerrar-modal")?.remove();
  if (!st || st.finalizado) return;
  clearInterval(st.timerInterval);
  encerrarSessao('manual');
};

window.cancelarEncerrar = function() {
  document.getElementById("encerrar-modal")?.remove();
};

// ── Pré-jogo com pódio ────────────────────────────────────────
function mostrarPreJogo() {
  document.body.classList.add('arcade-mode');

  const top3 = latestRanking.slice(0, 3);
  let podioHTML = '';
  if (top3.length >= 2) {
    // Ordem visual: 2º (esq), 1º (centro), 3º (dir)
    const ordem = [top3[1], top3[0], top3[2]].filter(Boolean);
    const plinths = ['p2','p1','p3'];
    podioHTML = `<div class="podio">${ordem.map((r,i) => `
      <div class="podio-item">
        <div class="podio-medal">${getMedal(i===0?1:i===1?0:2)}</div>
        <div class="podio-nome">${r.aluno}</div>
        <div style="font-size:9px;color:#4a4a80;margin:-2px 0 3px">${r.turma||''}</div>
        <div class="podio-pts">${r.pontuacao}</div>
        <div class="podio-plinth ${plinths[i]}"></div>
      </div>`).join('')}
    </div>`;
  } else if (top3.length === 1) {
    podioHTML = `<div class="podio">
      <div class="podio-item">
        <div class="podio-medal">🥇</div>
        <div class="podio-nome">${top3[0].aluno}</div>
        <div style="font-size:9px;color:#4a4a80;margin:-2px 0 3px">${top3[0].turma||''}</div>
        <div class="podio-pts">${top3[0].pontuacao}</div>
        <div class="podio-plinth p1"></div>
      </div>
    </div>`;
  }

  document.getElementById("content").innerHTML = `
    <div class="pre-wrap">
      <div class="pre-title">COMPETIÇÃO+</div>
      <div class="pre-sub">${liberada.atividade.toUpperCase()} · TURMA ${turma}</div>
      ${podioHTML}
      <div class="pre-timer">⏳ 7:00 disponíveis</div>
      ${melhorPts>0
        ? `<div class="pre-melhor">🏆 ${melhorPts} pts</div><div class="pre-melhor-lbl">Sua melhor — tente superar!</div>`
        : `<div class="pre-melhor-lbl">Primeira tentativa — boa sorte!</div>`}
      <div class="pre-regras">
        <strong>Como funciona:</strong><br>
        • Começa com <strong>10 pt</strong> de saldo<br>
        • Fácil: <strong>4 pt · 10 s</strong> &nbsp; Médio: <strong>8 pt · 40 s</strong><br>
        • 3 tentativas: 100% → 75% → 50% do valor<br>
        • Esgotou ou pulou → <strong>penalidade</strong> (−50% base)<br>
        • Saldo zero = fim de sessão<br>
        • ⚡ Resposta rápida (&lt;50% do timer) → bônus de pontos<br>
        • A cada <strong>5 rápidos</strong> → questão bônus de 24 pts 🏆<br>
        • A cada <strong>3 rápidos</strong> → +1 🎯 ajuda (máx. 3, pontuação completa!)<br>
        • 7 min no total · Sem penalidades → +20 pt ao fim<br>
        • Jogue quantas vezes quiser · últimas 3 tentativas salvas
      </div>
      <button class="btn-iniciar" onclick="iniciarJogo()">▶ JOGAR!</button>
    </div>`;
}

// ── Iniciar jogo ──────────────────────────────────────────────
window.iniciarJogo = async function() {
  st = novoEstado();
  document.getElementById("content").innerHTML =
    `<div style="text-align:center;padding:50px;color:#2a2a50;font-family:'Orbitron',monospace;font-size:12px;letter-spacing:3px">CARREGANDO…</div>`;

  for (const al of alunos) {
    st.resultadoIds[al] = await addResultado({
      aluno: al, turma, atividade: liberada.atividade,
      modo: "competicao_plus", concluido: false,
      pontuacao: 10, acertos: 0, erros: 0, respondidas: 0,
      ts_inicio: st.inicioTs, data: dataAgora(),
    });
  }

  iniciarGlobalTimer();
  proxima();
};

mostrarPreJogo();
</script>
<button class="rank-fab" onclick="abrirRankModal()" aria-label="Ver ranking">🏆</button>
<div class="rank-modal-ov" id="rank-modal-ov" onclick="fecharRankModal(event)">
  <div class="rank-modal-sheet" id="rank-modal-sheet">
    <div class="rank-modal-hdr">
      <span id="rank-modal-title">⭐ Ranking ao vivo</span>
      <button class="rank-modal-close" onclick="fecharRankModal()">✕</button>
    </div>
    <div id="ranking-list-modal"><div style="font-size:11px;color:#2a2a50">Aguardando…</div></div>
  </div>
</div>
</body>
</html>
