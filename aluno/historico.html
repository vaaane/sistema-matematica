<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Histórico — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .q-rev{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;border:1px solid var(--border);margin-top:6px;font-size:12px;}
    .q-rev.ok{background:#F0FDF4;border-color:#BBF7D0;}
    .q-rev.err{background:#FEF2F2;border-color:#FECACA;}
    .aluno-section{margin-bottom:24px;}
    .aluno-title{font-size:13px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}

    /* ── Evolução ─────────────────────────────────────────────── */
    .evolucao-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#F8FAFC;border-radius:8px;margin-bottom:8px;border:1px solid var(--border);}
    .evolucao-label{font-size:10px;font-weight:700;color:var(--text-muted);flex-shrink:0;}

    /* ── Abatimento ───────────────────────────────────────────── */
    .badge-atraso{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:#FFEDD5;color:#9A3412;border:1px solid #FED7AA;}

    /* ── Competição+ questões ─────────────────────────────────── */
    .plus-q-wrap{margin-top:6px;}
    .plus-q-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:7px;border:1px solid var(--border);margin-top:6px;font-size:12px;cursor:pointer;transition:background .12s;}
    .plus-q-row:hover{filter:brightness(.97);}
    .plus-q-row.ok{background:#F0FDF4;border-color:#BBF7D0;}
    .plus-q-row.err{background:#FEF2F2;border-color:#FECACA;}
    .plus-q-row.nr{background:#F9FAFB;border-color:#E5E7EB;}
    .plus-q-row.bonus{border-color:#FDE68A;background:#FFFBEB;}
    .plus-q-num{font-size:10px;font-weight:700;color:var(--text-muted);width:24px;flex-shrink:0;padding-top:1px;}
    .plus-q-enun{flex:1;line-height:1.4;}
    .plus-q-pts{font-weight:700;font-size:11px;white-space:nowrap;}
    .plus-q-detail{display:none;padding:6px 0 2px;font-size:11px;border-top:1px solid rgba(0,0,0,.07);margin-top:5px;color:var(--text-muted);}
    .plus-tent-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px;}
    .plus-tent-ans{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;}
    .plus-tent-ans.ok{background:#DCFCE7;color:#166534;}
    .plus-tent-ans.err{background:#FEE2E2;color:#991B1B;}
    .plus-tent-ans.time{background:#F3F4F6;color:#6B7280;}

    /* ── Tooltip conquistas ───────────────────────────────────── */
    .conq-tip{position:fixed;background:#1E293B;color:#F1F5F9;padding:8px 12px;border-radius:10px;font-size:12px;pointer-events:none;z-index:9999;max-width:220px;box-shadow:0 4px 16px rgba(0,0,0,.35);opacity:0;transition:opacity .15s;}
    .conq-tip.show{opacity:1;}
    .conq-tip-nome{font-weight:700;font-size:13px;margin-bottom:2px;}
    .conq-tip-desc{font-size:11px;opacity:.8;}

    /* ── Pills ────────────────────────────────────────────────── */
    .pill{padding:5px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:all .15s;}
    .pill.on{border-color:var(--blue);background:var(--blue);color:#fff;}

    /* ── Avaliação+ fases ─────────────────────────────────────── */
    .hist-mode-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;margin-left:6px;vertical-align:middle;}
    .hist-mode-badge.avplus{background:#F5F3FF;color:#7C3AED;}
    .fase-sep-bar{display:flex;align-items:center;gap:6px;margin:12px 0 8px}
    .fase-sep-bar::before,.fase-sep-bar::after{content:'';flex:1;height:1px;background:var(--border)}
    .fase-sep-label{font-size:10px;font-weight:700;color:var(--text-muted);white-space:nowrap;padding:2px 8px;border:1px solid var(--border);border-radius:10px;letter-spacing:.5px;background:var(--card)}

    /* ── Formato acompanhamento ───────────────────────────────── */
    .ativ-summary{border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
    .ativ-summary-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg);cursor:pointer;transition:background .15s;}
    .ativ-summary-head:hover{background:#f0f0f0;}
    .ativ-summary-body{padding:12px 16px 14px;border-top:1px solid var(--border);}
    .ativ-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;}
    @media(max-width:640px){.ativ-metrics{grid-template-columns:repeat(2,1fr);}}
    .metric-box{background:var(--bg);border-radius:8px;padding:10px 6px;text-align:center;border:1px solid var(--border);}
    .metric-val{font-size:18px;font-weight:800;line-height:1;}
    .metric-lbl{font-size:10px;color:var(--text-muted);margin-top:3px;}
    .tent-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);margin-bottom:6px;background:var(--card);cursor:pointer;transition:background .15s;}
    .tent-row:hover{background:#fafafa;}
    .tent-info-wrap{flex:1;}
    .tent-date{font-size:11px;color:var(--text-muted);}
    .tent-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
    .tent-detail-body{padding:8px 12px 12px;border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;background:#FAFAFA;margin-top:-6px;margin-bottom:6px;}
    .tent-row.melhor{border-color:#F59E0B;border-width:1.5px;background:linear-gradient(to right,#FFFDE7,var(--card));}
    .mode-tabs{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:14px;}
    .mode-tab{padding:7px 12px;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);background:transparent;transition:all .2s;}
    .mode-tab.on{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(47,158,220,.3);}

    @media(max-width:480px){
      .q-rev{font-size:11px;padding:6px 8px;gap:6px}
      .plus-q-row{font-size:11px;padding:6px 8px;gap:6px}
      .evolucao-bar{padding:6px 8px;gap:6px}
      .ativ-summary-head{padding:10px 12px;gap:8px}
      .ativ-summary-body{padding:10px 12px 12px}
    }

    /* ── Badge "Conta para nota" ─────────────────────────────── */
    .badge-nota-melhor{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;background:linear-gradient(90deg,#FEF9C3,#FDE68A);border:1px solid #FCD34D;color:#854D0E;}

    /* ── Tema escuro: fundos claros fixos → versão escura ─────── */
    [data-theme="dark"] .q-rev.ok  {background:rgba(22,163,74,.15);border-color:rgba(34,197,94,.35);color:var(--text);}
    [data-theme="dark"] .q-rev.err {background:rgba(220,38,38,.15);border-color:rgba(248,113,113,.35);color:var(--text);}
    [data-theme="dark"] .badge-nota-melhor{background:rgba(245,158,11,.2);border-color:rgba(252,211,77,.4);color:#FCD34D;}
    [data-theme="dark"] .tent-row.melhor{background:rgba(245,158,11,.08);border-color:#F59E0B;}
    [data-theme="dark"] .plus-q-row.ok  {background:rgba(22,163,74,.15);border-color:rgba(34,197,94,.35);}
    [data-theme="dark"] .plus-q-row.err {background:rgba(220,38,38,.15);border-color:rgba(248,113,113,.35);}
    [data-theme="dark"] .plus-q-row.nr  {background:#1e293b;border-color:#334155;}
    [data-theme="dark"] .plus-q-row.bonus{background:rgba(245,158,11,.15);border-color:rgba(252,211,77,.35);}
    [data-theme="dark"] .tent-detail-body{background:#1e293b;}
    [data-theme="dark"] .evolucao-bar   {background:#1e293b;}
    [data-theme="dark"] .ativ-summary-head:hover{background:#1e293b;}
    [data-theme="dark"] .tent-row:hover {background:#1e293b;}
    [data-theme="dark"] .plus-tent-ans.ok  {background:rgba(22,163,74,.25);color:#86efac;}
    [data-theme="dark"] .plus-tent-ans.err {background:rgba(220,38,38,.25);color:#fca5a5;}
    [data-theme="dark"] .plus-tent-ans.time{background:#1e293b;color:#94a3b8;}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Histórico</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
      <div class="topbar-right"><div class="avatar avatar-orange" id="avatar-initials">?</div></div>
    </div>
    <div class="content" id="content">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div>
    </div>
  </div>
</div>
<script>(()=>{const t=localStorage.getItem('tema');if(t==='escuro')document.documentElement.setAttribute('data-theme','dark');})()</script>
<script type="module">
import { getResultadosByAluno, getDetalhes, getAlunoPreferencia, getConquistasByAluno, getAllAtividadeStatus } from "/js/db.js";
import { requireAluno, renderSidebarAluno, clearSession } from "/js/auth.js";
import { applyTopRankVisuals } from "/js/toprank.js";
import { initAvBanner } from "/js/avaliacao_banner.js";

const sess = requireAluno();
if (!sess) throw new Error();
renderSidebarAluno("sidebar", "historico");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const { alunos, turma } = sess;
initAvBanner(turma, alunos[0]);
let conquistasBySessao = {};
document.getElementById("topbar-sub").textContent = `Turma ${turma}`;
document.getElementById("avatar-initials").textContent = alunos[0][0].toUpperCase();
applyTopRankVisuals();

getAlunoPreferencia(turma, alunos[0], 'tema').then(t => {
  if (t && t !== localStorage.getItem('tema')) {
    localStorage.setItem('tema', t);
    document.documentElement.setAttribute('data-theme', t === 'escuro' ? 'dark' : '');
  }
});

getAlunoPreferencia(turma, alunos[0], 'robotica').then(isRob => {
  if (!isRob) return;
  const nav = document.querySelector('#sidebar .sidebar-nav');
  if (!nav) return;
  const div = document.createElement('div'); div.className = 'nav-divider'; nav.appendChild(div);
  const a = document.createElement('a');
  a.className = 'nav-item active-orange'; a.href = '/aluno/robotica.html';
  a.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 9V7c0-1.1-.9-2-2-2h-3c0-1.66-1.34-3-3-3S9 3.34 9 5H6c-1.1 0-2 .9-2 2v2c-1.66 0-3 1.34-3 3s1.34 3 3 3v4c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4c1.66 0 3-1.34 3-3s-1.34-3-3-3zm-2 10H6V7h12v12zm-9-6c-.83 0-1.5-.67-1.5-1.5S8.17 10 9 10s1.5.67 1.5 1.5S9.83 13 9 13zm6 0c-.83 0-1.5-.67-1.5-1.5S14.17 10 15 10s1.5.67 1.5 1.5S15.83 13 15 13z"/></svg>🤖 Robótica`;
  nav.appendChild(a);
});

window.showSessTooltip = function(e, info) {
  let tip = document.getElementById('sess-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'sess-tip';
    tip.style.cssText = 'position:fixed;background:#1E293B;color:#F1F5F9;padding:7px 12px;border-radius:9px;font-size:11px;font-weight:600;pointer-events:none;z-index:9999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.35);transition:opacity .15s';
    document.body.appendChild(tip);
    document.addEventListener('click', ev => { if (ev.target.tagName !== 'circle') tip.style.opacity='0'; });
  }
  tip.textContent = info;
  tip.style.opacity = '1';
  tip.style.left = `${Math.min(e.clientX + 12, window.innerWidth - 220)}px`;
  tip.style.top  = `${Math.max(e.clientY - 46, 8)}px`;
  e.stopPropagation();
};

function renderEvolucaoSVG(regs) {
  const pts = regs.map(r => r.pontuacao_bruta || r.pontuacao || 0);
  if (pts.length < 2) return '';
  const first = pts[0], last = pts[pts.length - 1];
  const trendColor = last > first ? '#16A34A' : last < first ? '#DC2626' : '#6B7280';
  const trendIcon  = last > first ? '↑' : last < first ? '↓' : '→';
  const trendDesc  = last > first ? 'Melhorou' : last < first ? 'Piorou' : 'Estável';
  const W = 240, H = window.innerWidth <= 480 ? 38 : 56, mL = 8, mR = 8, mT = window.innerWidth <= 480 ? 8 : 14, mB = 6;
  const iW = W - mL - mR, iH = H - mT - mB;
  const maxV = Math.max(...pts, 1);
  const n = pts.length;
  const xP = i => mL + (n > 1 ? (i / (n - 1)) * iW : iW / 2);
  const yP = v => mT + iH - Math.min((v / maxV) * iH, iH);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:240px;height:${H}px;flex-shrink:0;cursor:pointer">`;
  if (n > 1) svg += `<polyline points="${pts.map((v, i) => `${xP(i)},${yP(v)}`).join(' ')}" fill="none" stroke="${trendColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach((v, i) => {
    const r = regs[i];
    const ac = r.acertos || 0, er = r.erros || 0;
    const taxa = (ac + er) > 0 ? Math.round(ac / (ac + er) * 100) : 0;
    const info = `${r.data || 'Sessão '+(i+1)} — ${v}pts | ✅${ac} ❌${er} | ${taxa}%`;
    svg += `<circle cx="${xP(i)}" cy="${yP(v)}" r="5" fill="${trendColor}" stroke="white" stroke-width="1.5"
      style="cursor:pointer" onclick="showSessTooltip(event,'${info.replace(/'/g, '&#39;')}')"
      onmouseover="this.setAttribute('r','7')" onmouseout="this.setAttribute('r','5')"/>`;
    svg += `<text x="${xP(i)}" y="${yP(v) - 8}" text-anchor="middle" font-size="8" fill="${trendColor}" font-weight="700" pointer-events="none">${v}</text>`;
  });
  svg += `</svg>`;
  return `<div class="evolucao-bar">
    <span class="evolucao-label">${regs.length} sessões</span>
    ${svg}
    <div style="text-align:center;flex-shrink:0;min-width:36px">
      <div style="font-size:22px;font-weight:800;color:${trendColor};line-height:1">${trendIcon}</div>
      <div style="font-size:9px;color:var(--text-muted)">${trendDesc}</div>
    </div>
  </div>`;
}

function renderPlusQuestao(q, i, mostrarRespostas) {
  const resultado = q.resultado ?? null;
  const isNR = resultado === 'nao_respondida';
  const isOk = resultado === 'acerto' || (resultado === null && !!q.acertou);
  const rowCls = isNR ? 'nr' : isOk ? 'ok' : 'err';
  const icon   = isNR ? '⏸' : isOk ? '✅' : '❌';
  const ptsVal = q.pontosGanhos ?? 0;
  const ptsClass = ptsVal > 0 ? 'color:var(--green)' : ptsVal < 0 ? 'color:var(--red)' : 'color:var(--text-muted)';
  const ptsTxt   = ptsVal > 0 ? `+${ptsVal}` : String(ptsVal);
  const badges = [];
  if (q.bonus_velocidade ?? q.velocidade) badges.push('<span style="color:#3B82F6;font-size:10px">⚡ rápido</span>');
  if (q.usou_ajuda ?? q.usouAjuda)        badges.push('<span style="color:#A855F7;font-size:10px">🎯 ajuda</span>');
  if (q.ehBonus)                           badges.push('<span style="color:#F59E0B;font-size:10px">🏆 bônus</span>');
  const tempoMs  = q.tempo_resposta_ms ?? null;
  const tempoTxt = isNR ? 'não respondida' : tempoMs != null ? `${Math.round(tempoMs / 1000)}s` : null;
  const tentativas = (q.tentativas ?? []).map(t => {
    const isTime = t.resposta === '(tempo)' || t.resposta === '(pulou)';
    const cls = t.correto ? 'ok' : isTime ? 'time' : 'err';
    const tempo = !isTime && t.tempoUsado != null ? ` · ${t.tempoUsado}s` : '';
    return `<span class="plus-tent-ans ${cls}">${t.correto ? '✓ ' : ''}${t.resposta || '—'}${tempo}</span>`;
  }).join('');
  const enun = q.enunciado ?? q.pergunta ?? '—';
  const suaResp = q.resposta_aluno ?? (() => {
    const ts = q.tentativas ?? [];
    const certa = ts.find(t => t.correto);
    const ultima = ts[ts.length - 1];
    return (certa ?? ultima)?.resposta ?? '—';
  })();
  let detailHTML = '';
  if (!isNR && mostrarRespostas) {
    detailHTML += `<div><strong>Sua resposta:</strong> <span style="${isOk?'color:var(--green)':'color:var(--red)'};font-weight:700">${suaResp}</span></div>`;
    detailHTML += `<div style="margin-top:3px"><strong>Resposta correta:</strong> ${q.resposta_correta ?? '—'}</div>`;
    detailHTML += `<div style="margin-top:3px"><strong>Pontos:</strong> <span style="${ptsClass};font-weight:700">${ptsTxt}</span></div>`;
  }
  if (tempoTxt) detailHTML += `<div style="margin-top:3px"><strong>Tempo:</strong> ${tempoTxt}</div>`;
  if (tentativas) detailHTML += `<div class="plus-tent-row" style="margin-top:4px">${tentativas}</div>`;
  return `<div class="plus-q-row ${rowCls}${q.ehBonus ? ' bonus' : ''}"
    onclick="const d=this.querySelector('.plus-q-detail');d.style.display=d.style.display==='block'?'none':'block'">
    <span class="plus-q-num">Q${i+1}</span>
    <div class="plus-q-enun">
      <div>${enun}</div>
      ${badges.length ? `<div style="margin-top:3px;display:flex;gap:6px;flex-wrap:wrap">${badges.join('')}</div>` : ''}
      <div class="plus-q-detail">${detailHTML || '<span style="color:var(--text-muted);font-size:11px">Clique para ver detalhes.</span>'}</div>
    </div>
    <div style="display:flex;align-items:center;gap:5px;flex-shrink:0">
      ${tempoTxt && !isNR ? `<span style="font-size:10px;color:var(--text-muted)">${tempoTxt}</span>` : ''}
      <span>${icon}</span>
    </div>
  </div>`;
}

function renderAbatimento(r) {
  if (!r.com_abatimento || !r.percentual_nota || r.percentual_nota >= 100) return '';
  const bruta = r.pontuacao_bruta || r.pontuacao || 0;
  const aplic = r.pontuacao || 0;
  return `<span class="badge-atraso">⏰ ${bruta} pts bruta → ${aplic} pts (${r.percentual_nota}%)</span>`;
}

function formatMs(ms) {
  if (!ms || ms <= 0) return '—';
  const s = Math.round(ms / 1000);
  return `${Math.floor(s/60)}m${String(s%60).padStart(2,'0')}s`;
}

const CONQUISTAS_POSICIONAIS = new Set(['lider_turma','elite']);

let _conqTip = null;
function getConqTip() {
  if (!_conqTip) {
    _conqTip = document.createElement('div');
    _conqTip.className = 'conq-tip';
    _conqTip.innerHTML = '<div class="conq-tip-nome"></div><div class="conq-tip-desc"></div>';
    document.body.appendChild(_conqTip);
  }
  return _conqTip;
}
function showConqTip(x, y, nome, desc) {
  const tip = getConqTip();
  tip.querySelector('.conq-tip-nome').textContent = nome;
  tip.querySelector('.conq-tip-desc').textContent = desc;
  tip.style.left = `${Math.min(x + 12, window.innerWidth - 230)}px`;
  tip.style.top  = `${Math.max(y - 60, 8)}px`;
  tip.classList.add('show');
}
function hideConqTip() { if (_conqTip) _conqTip.classList.remove('show'); }

function renderConquistasBadges(sessaoId, r) {
  const pctSessao = r?.percentual ?? 100;
  const cs = (conquistasBySessao[sessaoId] || []).filter(c => {
    const t = c.tipo || c.id;
    if (t === 'recorde_pessoal') return false;
    if ((t === 'lider_turma' || t === 'elite') && pctSessao > 75) return false;
    return true;
  });
  if (!cs.length) return '';
  return `<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
    <span style="font-size:10px;color:var(--text-muted);font-weight:600;flex-shrink:0">Conquistas:</span>
    ${cs.map(c => {
      const nome = c.nome || c.tipo;
      const desc = c.descricao || c.desc || '';
      return `<span class="badge" style="background:rgba(168,85,247,.1);border-color:rgba(168,85,247,.4);color:#7C3AED;cursor:default"
        data-nome="${nome.replace(/"/g,'&quot;')}" data-desc="${desc.replace(/"/g,'&quot;')}">${c.icon || '🏆'} ${nome}</span>`;
    }).join('')}
  </div>`;
}

window.filtrarHistorico = function(uid, ativNome) {
  document.querySelectorAll(`[data-ativ-sec="${uid}"]`).forEach(el => {
    el.style.display = (!ativNome || el.dataset.ativ === ativNome) ? '' : 'none';
  });
  document.querySelectorAll(`#hist-pills-${uid} .pill`).forEach(p =>
    p.classList.toggle('on', p.dataset.ativ === ativNome));
};

// ── Formato acompanhamento ─────────────────────────────────────

function renderHistMetrics(regs) {
  const modoSet  = new Set(regs.map(r => r.modo || 'classico'));
  const isAvOnly = modoSet.size === 1 && modoSet.has('avaliacao_plus');
  const isComp   = modoSet.has('competicao_plus');
  const totalAc  = regs.reduce((a, r) => a + (r.acertos || 0), 0);
  const totalErr = regs.reduce((a, r) => a + (r.erros   || 0), 0);
  const taxa     = (totalAc + totalErr) > 0 ? Math.round(totalAc / (totalAc + totalErr) * 100) : 0;

  if (isAvOnly) {
    const melhorNQ  = Math.max(0, ...regs.map(r => r.nota_quiz ?? 0));
    const melhorPts = Math.max(0, ...regs.map(r => r.pontuacao  ?? 0));
    return `<div class="ativ-metrics">
      <div class="metric-box"><div class="metric-val" style="color:#7C3AED">${melhorNQ.toFixed(1)}</div><div class="metric-lbl">Melhor nota</div></div>
      <div class="metric-box"><div class="metric-val" style="color:var(--gold)">⭐ ${melhorPts}</div><div class="metric-lbl">Melhor pts</div></div>
      <div class="metric-box"><div class="metric-val" style="color:var(--blue)">${regs.length}/3</div><div class="metric-lbl">Tentativas</div></div>
      <div class="metric-box"><div class="metric-val" style="color:var(--green)">${taxa}%</div><div class="metric-lbl">Taxa acerto</div></div>
    </div>`;
  }
  if (isComp) {
    const melhorPts = Math.max(0, ...regs.map(r => r.pontuacao || 0));
    const rapMax    = Math.max(0, ...regs.map(r => r.acertos_rapidos || 0));
    const difMax    = Math.max(0, ...regs.map(r => r.acertos_dificeis || 0));
    return `<div class="ativ-metrics">
      <div class="metric-box"><div class="metric-val" style="color:var(--gold)">⭐ ${melhorPts}</div><div class="metric-lbl">Melhor saldo</div></div>
      <div class="metric-box"><div class="metric-val" style="color:var(--blue)">${regs.length}</div><div class="metric-lbl">Sessões</div></div>
      <div class="metric-box"><div class="metric-val" style="color:#60A5FA">${rapMax > 0 ? rapMax : '—'}</div><div class="metric-lbl">⚡ Veloz (max)</div></div>
      <div class="metric-box"><div class="metric-val" style="color:var(--green)">${taxa}%</div><div class="metric-lbl">Taxa acerto</div></div>
    </div>`;
  }
  // classico
  const melhorPts = Math.max(0, ...regs.map(r => r.pontuacao_bruta || r.pontuacao || 0));
  const comboMax  = Math.max(0, ...regs.map(r => r.combo_max || 0));
  return `<div class="ativ-metrics">
    <div class="metric-box"><div class="metric-val" style="color:var(--gold)">⭐ ${melhorPts}</div><div class="metric-lbl">Melhor pts</div></div>
    <div class="metric-box"><div class="metric-val" style="color:var(--blue)">${regs.length}</div><div class="metric-lbl">Tentativas</div></div>
    <div class="metric-box"><div class="metric-val" style="color:var(--orange)">${comboMax > 0 ? '×'+comboMax : '—'}</div><div class="metric-lbl">Combo máx</div></div>
    <div class="metric-box"><div class="metric-val" style="color:var(--green)">${taxa}%</div><div class="metric-lbl">Taxa acerto</div></div>
  </div>`;
}

function renderSessaoRow(r, isBest, idx, total) {
  const modo   = r.modo || 'classico';
  const isPlus = modo === 'competicao_plus';
  const isAvP  = modo === 'avaliacao_plus';
  const uid2   = `htent-${r.id}`;
  const tot2   = (r.acertos || 0) + (r.erros || 0);
  const taxa   = tot2 > 0 ? Math.round((r.acertos || 0) / tot2 * 100) : 0;
  const bruta  = r.pontuacao_bruta || r.pontuacao || 0;
  const tempoS = r.tempo_medio_ms > 0 ? Math.round(r.tempo_medio_ms / 1000) : 0;
  const label  = idx === 0 ? '→ Mais recente' : `${isAvP ? 'Tentativa' : isPlus ? 'Sessão' : 'Tentativa'} ${total - idx}`;

  let badges = '';
  if (isAvP) {
    badges = `
      <span class="badge" style="background:#F5F3FF;color:#7C3AED;font-weight:700">📝 ${typeof r.nota_quiz === 'number' ? r.nota_quiz.toFixed(1) : '—'}/10</span>
      <span class="badge badge-gold">⭐ ${r.pontuacao || 0} pts</span>
      ${r.tentativa_num ? `<span class="badge badge-blue">Tentativa ${r.tentativa_num}</span>` : ''}
      <span class="badge badge-green">✅ ${r.acertos || 0}</span>
      <span class="badge badge-red">❌ ${r.erros || 0}</span>
      <span class="badge badge-blue">📊 ${taxa}%</span>`;
  } else if (isPlus) {
    badges = `
      <span class="badge badge-gold">⭐ ${bruta} pts</span>
      <span class="badge badge-green">✅ ${r.acertos || 0}</span>
      <span class="badge badge-red">❌ ${r.erros || 0}</span>
      ${(r.nao_respondidas || 0) > 0 ? `<span class="badge" style="background:#F3F4F6;color:#6B7280">⏸ ${r.nao_respondidas}</span>` : ''}
      <span class="badge badge-blue">📊 ${taxa}%</span>
      ${(r.acertos_rapidos || 0) > 0 ? `<span class="badge" style="background:#EFF6FF;color:#1D4ED8">⚡${r.acertos_rapidos}</span>` : ''}
      ${(r.acertos_dificeis || 0) > 0 ? `<span class="badge badge-gold">🏆${r.acertos_dificeis}</span>` : ''}
      ${(r.ajudas_usadas || 0) > 0 ? `<span class="badge" style="background:#F5F3FF;color:#6D28D9">🎯${r.ajudas_usadas}</span>` : ''}
      ${r.sem_penalidade ? `<span class="badge" style="background:#F0FDF4;color:#16A34A">🔥 Limpo</span>` : ''}
      ${tempoS > 0 ? `<span class="badge" style="background:#F0F9FF;color:#0369A1">⏱ ${tempoS}s/q</span>` : ''}`;
  } else {
    badges = `
      <span class="badge badge-gold">⭐ ${bruta} pts${r.com_abatimento ? ' (bruta)' : ''}</span>
      ${renderAbatimento(r)}
      <span class="badge badge-green">✅ ${r.acertos || 0}</span>
      <span class="badge badge-red">❌ ${r.erros || 0}</span>
      <span class="badge badge-blue">📊 ${taxa}%</span>
      ${(r.combo_max || 0) > 1 ? `<span class="badge badge-orange">🔥×${r.combo_max}</span>` : ''}`;
  }

  const cq = renderConquistasBadges(r.id, r);

  return `<div>
    <div class="tent-row${isBest ? ' melhor' : ''}" onclick="toggleHistTent('${uid2}','${r.id}','${modo}')">
      <div class="tent-info-wrap">
        <div style="font-size:13px;font-weight:600">${label}</div>
        <div class="tent-date">${r.data || ''}</div>
        ${isBest ? `<div style="margin-bottom:5px"><span class="badge-nota-melhor">🏆 Conta para nota</span></div>` : ''}
        <div class="tent-badges">${badges}</div>
        ${cq ? `<div style="margin-top:6px">${cq}</div>` : ''}
      </div>
      <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:var(--text-muted);flex-shrink:0" id="hchev2-${uid2}"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
    </div>
    <div class="tent-detail-body" id="${uid2}" style="display:none" data-loaded="false">
      <p style="font-size:12px;color:var(--text-muted)">Carregando…</p>
    </div>
  </div>`;
}

function renderModoBlock(modoRegs, modoLabel) {
  const sortedChron = [...modoRegs].sort((a, b) => (a.criadoEm || 0) - (b.criadoEm || 0));
  const sortedDesc  = [...modoRegs].sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));
  const bestId = modoRegs.reduce((best, r) => (r.pontuacao || 0) > (best.pontuacao || 0) ? r : best, modoRegs[0])?.id;
  const labelSess = modoLabel === 'avaliacao_plus' ? 'Tentativas de Avaliação+' : modoLabel === 'competicao_plus' ? 'Sessões' : 'Tentativas';
  let s = renderHistMetrics(modoRegs);
  if (sortedChron.length >= 2) s += renderEvolucaoSVG(sortedChron);
  s += `<div style="font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase;margin:10px 0 6px">${labelSess}</div>`;
  sortedDesc.forEach((r, i) => { s += renderSessaoRow(r, r.id === bestId, i, sortedDesc.length); });
  return s;
}

window.toggleHistAtiv = function(uid) {
  const body = document.getElementById(`hbody-${uid}`);
  const chev = document.getElementById(`hchev-${uid}`);
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (chev) chev.style.transform = open ? '' : 'rotate(180deg)';
};

window.mostrarHistModo = function(aUID, modo) {
  const compEl = document.getElementById(`hmc-${aUID}`);
  const avEl   = document.getElementById(`hma-${aUID}`);
  if (compEl) compEl.style.display = modo === 'comp' ? '' : 'none';
  if (avEl)   avEl.style.display   = modo === 'avaliacao_plus' ? '' : 'none';
  document.querySelectorAll(`.mhtab-${aUID}`).forEach(b =>
    b.classList.toggle('on', b.dataset.modo === modo));
};

window.toggleHistTent = async function(uid, resultadoId, modo) {
  const body = document.getElementById(uid);
  const chev = document.getElementById(`hchev2-${uid}`);
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (chev) chev.style.transform = open ? '' : 'rotate(180deg)';
  if (open || body.dataset.loaded === 'true') return;
  body.dataset.loaded = 'true';

  const questoes = await getDetalhes(resultadoId);
  if (!questoes || !questoes.length) {
    body.innerHTML = '<p style="font-size:12px;color:var(--text-muted)">Detalhes não disponíveis.</p>';
    return;
  }
  const r = todos.find(x => x.id === resultadoId);
  const statusInfo = statusMap?.[`${r?.turma}|${r?.atividade}`];
  const mostrarR = !statusInfo || statusInfo.status !== 'ativa' || (statusInfo.percentual ?? 100) < 100;

  if (modo === 'avaliacao_plus') {
    const f1Qs  = questoes.filter(q => q.fase === 1);
    const f2Qs  = questoes.filter(q => q.fase === 2);
    const f1nq  = r?.nota_quiz != null ? r.nota_quiz.toFixed(1) : '—';
    const f1pts = r?.pontos_fase1 != null ? r.pontos_fase1 : '—';
    const f1cred = r?.credito_final != null ? (Number.isInteger(r.credito_final) ? r.credito_final : r.credito_final.toFixed(2)) : null;
    const f1t   = r?.tempo_fase1_ms ? formatMs(r.tempo_fase1_ms) : null;
    const f2rap  = r?.acertos_rapidos || 0;
    const f2combo= r?.combo_max || 0;
    const f2aj   = r?.ajudas_usadas || 0;
    const f2nr   = f2Qs.filter(q => q.resultado === 'nao_respondida').length;
    const f2ac   = f2Qs.filter(q => q.resultado === 'acerto' || (q.resultado == null && q.acertou)).length;
    const f2err  = f2Qs.filter(q => q.resultado === 'erro'   || (q.resultado == null && !q.acertou)).length;
    body.innerHTML = `
      <div style="margin-bottom:10px">
        <div style="font-size:11px;font-weight:700;color:#7C3AED;background:#F5F3FF;padding:5px 10px;border-radius:7px;margin-bottom:6px;display:inline-block">📖 Fase 1 — Quiz</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">
          <span class="badge" style="background:#F5F3FF;color:#7C3AED;font-weight:700">📝 ${f1nq}/10</span>
          <span class="badge badge-gold">${f1pts}/12 pts</span>
          ${f1t ? `<span class="badge badge-blue">⏱ ${f1t}</span>` : ''}
          ${f1cred != null ? `<span class="badge badge-green">Crédito final: ${f1cred}</span>` : ''}
        </div>
        ${f1Qs.length ? `<div class="plus-q-wrap">${f1Qs.map((q,i) => renderPlusQuestao(q, i, mostrarR)).join('')}</div>` : '<p style="font-size:11px;color:var(--text-muted)">Detalhes F1 não disponíveis.</p>'}
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin:8px 0">
        <div style="flex:1;height:1px;background:var(--border)"></div>
        <span style="font-size:10px;color:var(--text-muted);font-weight:700;padding:2px 8px;border:1px solid var(--border);border-radius:10px">FASE 2</span>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:700;color:#1D4ED8;background:#EFF6FF;padding:5px 10px;border-radius:7px;margin-bottom:6px;display:inline-block">⚔️ Fase 2 — Ranking</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">
          <span class="badge badge-green">✅ ${f2ac}</span>
          <span class="badge badge-red">❌ ${f2err}</span>
          ${f2nr > 0 ? `<span class="badge" style="background:#F3F4F6;color:#6B7280">⏸ ${f2nr}</span>` : ''}
          ${f2rap > 0 ? `<span class="badge" style="background:#EFF6FF;color:#1D4ED8">⚡ ${f2rap} rápidos</span>` : ''}
          ${f2combo > 1 ? `<span class="badge badge-orange">🔥 combo ×${f2combo}</span>` : ''}
          ${f2aj > 0 ? `<span class="badge" style="background:#F5F3FF;color:#6D28D9">🎯 ${f2aj} ajudas</span>` : ''}
        </div>
        ${f2Qs.length ? `<div class="plus-q-wrap">${f2Qs.map((q,i) => renderPlusQuestao(q, i, mostrarR)).join('')}</div>` : '<p style="font-size:11px;color:var(--text-muted)">Detalhes F2 não disponíveis.</p>'}
      </div>`;
  } else if (modo === 'competicao_plus') {
    const nrCount = questoes.filter(q => q.resultado === 'nao_respondida').length;
    const acertos = questoes.filter(q => q.resultado === 'acerto' || (q.resultado == null && q.acertou)).length;
    const erros   = questoes.filter(q => q.resultado === 'erro'   || (q.resultado == null && !q.acertou)).length;
    const comTempo = questoes.filter(q => q.resultado !== 'nao_respondida' && q.tempo_resposta_ms != null);
    const avgS    = comTempo.length ? Math.round(comTempo.reduce((s, q) => s + q.tempo_resposta_ms, 0) / comTempo.length / 1000) : null;
    body.innerHTML = `
      <div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:8px">
        ✅ ${acertos} | ❌ ${erros}${nrCount > 0 ? ` | ⏸ ${nrCount}` : ''} ${avgS != null ? `· ⏱ ${avgS}s/questão` : ''}
      </div>
      <div class="plus-q-wrap">${questoes.map((q, i) => renderPlusQuestao(q, i, mostrarR)).join('')}</div>`;
  } else {
    body.innerHTML = questoes.map((q, i) => {
      const enun = q.enunciado || q.pergunta || '—';
      const rA   = q.resposta_aluno || '—';
      const rC   = (q.resposta_correta && q.resposta_correta !== 'undefined') ? q.resposta_correta : '—';
      const pts  = q.pontos != null ? (q.pontos > 0 ? `+${q.pontos}` : String(q.pontos)) : null;
      const extras = [q.velocidade ? '⚡' : '', q.usouAjuda ? '🎯' : ''].filter(Boolean).join(' ');
      return `<div class="q-rev ${q.acertou ? 'ok' : 'err'}">
        <span style="font-size:10px;font-weight:700;color:var(--text-muted);width:24px">Q${i+1}</span>
        <div style="flex:1">
          <div>${enun}</div>
          <div style="margin-top:3px;font-size:11px">
            <span style="${q.acertou?'color:var(--green)':'color:var(--red)'};font-weight:700">${rA}</span>
            ${!q.acertou ? `<span style="color:var(--text-muted);margin-left:6px">✓ ${rC}</span>` : ''}
            ${pts ? `<span style="${q.acertou?'color:var(--green)':'color:var(--red)'};font-weight:700;margin-left:6px">${pts}pt</span>` : ''}
            ${extras ? `<span style="margin-left:6px">${extras}</span>` : ''}
          </div>
        </div>
        <span>${q.acertou ? '✅' : '❌'}</span>
      </div>`;
    }).join('');
  }
};

// ── Dados ──────────────────────────────────────────────────────
const [todosRaw, statusMap, allConquisTaskRaw] = await Promise.all([
  Promise.all(alunos.map(a => getResultadosByAluno(a))).then(r => r.flat()),
  getAllAtividadeStatus(),
  Promise.all(alunos.map(a => getConquistasByAluno(a))),
]);
const todos = todosRaw.filter(r => !r.modo_teste);
const allConquistas = allConquisTaskRaw.flat();
for (const c of allConquistas) {
  if (c.sessaoId) {
    if (!conquistasBySessao[c.sessaoId]) conquistasBySessao[c.sessaoId] = [];
    conquistasBySessao[c.sessaoId].push(c);
  }
}

const content = document.getElementById("content");
let html = '';

for (const aluno of alunos) {
  const regs = todos.filter(r => r.aluno === aluno && r.concluido && !r.modo_teste)
    .sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));

  const uid = aluno.replace(/\s+/g, '_');
  html += `<div class="aluno-section">
    <div class="aluno-title">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      ${aluno}
    </div>`;

  if (!regs.length) {
    html += `<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21L13 13.04V8h-1z"/></svg><p>Nenhuma atividade realizada ainda.</p></div>`;
  } else {
    const byAtiv = {};
    for (const r of regs) {
      if (!byAtiv[r.atividade]) byAtiv[r.atividade] = [];
      byAtiv[r.atividade].push(r);
    }

    const atividades = Object.keys(byAtiv);
    if (atividades.length > 1) {
      html += `<div id="hist-pills-${uid}" style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">
        <button class="pill on" data-ativ="" onclick="filtrarHistorico('${uid}','')">Todas</button>
        ${atividades.map(n => `<button class="pill" data-ativ="${n.replace(/"/g,'&quot;')}" onclick="filtrarHistorico('${uid}','${n.replace(/'/g,"\\'")}')">${n}</button>`).join('')}
      </div>`;
    }

    for (const [atividade, ativRegs] of Object.entries(byAtiv)) {
      const modoSet  = new Set(ativRegs.map(r => r.modo || 'classico'));
      const hasComp  = modoSet.has('competicao_plus');
      const hasAv    = modoSet.has('avaliacao_plus');
      const multiModo = hasComp && hasAv;
      const aUID    = uid + '__' + atividade.replace(/\W/g, '_');
      const ativUID = uid + '_' + atividade.replace(/\W/g, '_');

      const allPts = Math.max(0, ...ativRegs.map(r => r.pontuacao || 0));
      const totAc  = ativRegs.reduce((a, r) => a + (r.acertos || 0), 0);
      const totErr = ativRegs.reduce((a, r) => a + (r.erros   || 0), 0);
      const taxa   = (totAc + totErr) > 0 ? Math.round(totAc / (totAc + totErr) * 100) : 0;

      html += `<div class="ativ-summary" data-ativ-sec="${uid}" data-ativ="${atividade.replace(/"/g,'&quot;')}">
        <div class="ativ-summary-head" onclick="toggleHistAtiv('${ativUID}')">
          <div style="flex:1;font-size:14px;font-weight:700">${atividade}</div>
          <span class="badge badge-gold">⭐ ${allPts} pts</span>
          <span class="badge badge-blue">${ativRegs.length} sess.</span>
          <span class="badge badge-green">${taxa}%</span>
          <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:var(--text-muted);flex-shrink:0" id="hchev-${ativUID}"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
        </div>
        <div class="ativ-summary-body" id="hbody-${ativUID}" style="display:none">`;

      if (multiModo) {
        const compRegs = ativRegs.filter(r => (r.modo || 'classico') !== 'avaliacao_plus');
        const avRegs   = ativRegs.filter(r => (r.modo || 'classico') === 'avaliacao_plus');
        html += `<div class="mode-tabs">
          <button class="mode-tab on mhtab-${aUID}" data-modo="comp" onclick="mostrarHistModo('${aUID}','comp')">⚔️ Competição+</button>
          <button class="mode-tab mhtab-${aUID}" data-modo="avaliacao_plus" onclick="mostrarHistModo('${aUID}','avaliacao_plus')">📝 Avaliação+</button>
        </div>
        <div id="hmc-${aUID}">${renderModoBlock(compRegs, 'competicao_plus')}</div>
        <div id="hma-${aUID}" style="display:none">${renderModoBlock(avRegs, 'avaliacao_plus')}</div>`;
      } else {
        html += renderModoBlock(ativRegs, [...modoSet][0] || 'classico');
      }

      html += `</div></div>`;
    }
  }
  html += '</div>';
}

content.innerHTML = html;

// Tooltip event delegation para conquista badges
let _touchConqTip;
content.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-nome]');
  if (el) showConqTip(e.clientX, e.clientY, el.dataset.nome, el.dataset.desc || '');
});
content.addEventListener('mousemove', e => {
  if (!_conqTip?.classList.contains('show')) return;
  const el = e.target.closest('[data-nome]');
  if (el) {
    _conqTip.style.left = `${Math.min(e.clientX + 12, window.innerWidth - 230)}px`;
    _conqTip.style.top  = `${Math.max(e.clientY - 60, 8)}px`;
  }
});
content.addEventListener('mouseout', e => {
  if (e.target.closest('[data-nome]') && !e.relatedTarget?.closest('[data-nome]')) hideConqTip();
});
content.addEventListener('touchstart', e => {
  const el = e.target.closest('[data-nome]');
  if (!el) return;
  const t = e.touches[0];
  _touchConqTip = setTimeout(() => showConqTip(t.clientX, t.clientY, el.dataset.nome, el.dataset.desc || ''), 400);
}, {passive: true});
content.addEventListener('touchend', () => { clearTimeout(_touchConqTip); setTimeout(hideConqTip, 2500); }, {passive: true});
content.addEventListener('touchcancel', () => clearTimeout(_touchConqTip), {passive: true});

</script>
</body>
</html>
