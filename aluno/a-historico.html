<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>document.documentElement.setAttribute("data-theme","dark");</script>

    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#15102a">
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Histórico — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    /* ── Variáveis do protótipo (escopo .hc) ── */
    .hc{
      --hc-bg:#11111f;--hc-bg2:#1a1a2e;--hc-bg3:#222238;
      --hc-purple:#7c5cfc;--hc-pl:#9b7ffe;
      --hc-cyan:#00d4ff;--hc-orange:#ff7b2e;--hc-gold:#ffd700;
      --hc-green:#00e676;--hc-red:#ff4444;
      --hc-text:#e8eaf6;--hc-muted:#8892b0;
      --hc-border:rgba(124,92,252,0.15);
      background:transparent;color:var(--hc-text);
      font-family:'Inter',sans-serif;
    }

    /* Filtros */
    .hc-filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;max-width:100%;overflow:hidden;}
    .hc-fbtn{padding:6px 16px;border-radius:20px;border:1px solid var(--hc-border);background:transparent;color:var(--hc-muted);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
    .hc-fbtn.on{background:rgba(124,92,252,0.2);border-color:var(--hc-purple);color:var(--hc-pl);}

    /* Entry card */
    .entry{background:var(--hc-bg2);border:1px solid var(--hc-border);border-radius:16px;overflow:hidden;margin-bottom:12px;transition:border-color .2s;animation:hcFU .3s ease both;}
    .entry:hover{border-color:rgba(124,92,252,0.3);}
    @keyframes hcFU{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    .entry-header{padding:14px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;overflow:hidden;min-width:0;}
    .entry-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
    .entry-icon.atividade{background:rgba(124,92,252,0.15);border:1px solid rgba(124,92,252,0.3);}
    .entry-icon.torneio{background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.3);}

    .entry-info{flex:1;min-width:0;}
    .entry-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--hc-text);}
    .entry-meta{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap;}
    .hc-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
    .hc-tag.avp{background:rgba(255,123,46,0.15);color:var(--hc-orange);border:1px solid rgba(255,123,46,0.3);}
    .hc-tag.tn{background:rgba(255,215,0,0.12);color:var(--hc-gold);border:1px solid rgba(255,215,0,0.25);}
    .hc-tag.cls{background:rgba(0,212,255,0.1);color:var(--hc-cyan);border:1px solid rgba(0,212,255,0.2);}
    .entry-date{font-size:11px;color:var(--hc-muted);}

    .entry-score{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;}
    .score-main{font-family:'Orbitron',monospace;font-size:18px;font-weight:700;}
    .score-main.green{color:var(--hc-green);}
    .score-main.orange{color:var(--hc-orange);}
    .score-main.red{color:var(--hc-red);}
    .score-main.gold{color:var(--hc-gold);}
    .score-label{font-size:10px;color:var(--hc-muted);}
    .hc-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px;}
    .hc-stat{background:var(--hc-bg);border:1px solid var(--hc-border);border-radius:12px;padding:12px 8px;text-align:center;}
    .hc-stat .v{font-family:'Orbitron',monospace;font-size:20px;font-weight:700;color:var(--hc-text);line-height:1;}
    .hc-stat .l{font-size:10px;color:var(--hc-muted);margin-top:5px;text-transform:uppercase;letter-spacing:.5px;}
    .hc-rec{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
    .hc-rec-item{display:flex;align-items:center;gap:10px;background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.22);border-radius:12px;padding:10px 12px;}
    .hc-rec-ic{font-size:18px;flex-shrink:0;}
    .hc-rec-lbl{font-size:11px;color:var(--hc-muted);text-transform:uppercase;letter-spacing:.5px;}
    .hc-rec-val{font-size:13px;color:var(--hc-text);font-weight:600;margin-top:2px;}
    .hc-rev-title{font-size:12px;font-weight:700;color:var(--hc-muted);text-transform:uppercase;letter-spacing:1px;margin:4px 0 10px;}
    @media(max-width:560px){.hc-stats{grid-template-columns:repeat(3,1fr);}}
    @media(max-width:380px){.hc-stats{grid-template-columns:repeat(2,1fr);}}
    .chevron{color:var(--hc-muted);font-size:12px;margin-left:4px;transition:transform .2s;flex-shrink:0;}
    .entry.open .chevron{transform:rotate(180deg);}

    .entry-body{border-top:1px solid var(--hc-border);display:none;}
    .entry.open .entry-body{display:block;}

    /* Tentativas — botões clicáveis */
    .tentativas-section{padding:14px 18px;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--hc-border);}
    .tentativas-label{font-size:11px;color:var(--hc-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
    .tentativas-row{display:flex;gap:8px;flex-wrap:wrap;}
    .selected-indicator{font-size:10px;color:var(--hc-pl);margin-top:8px;font-weight:600;}

    .tent-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 16px;border-radius:12px;border:1.5px solid;cursor:pointer;transition:all .2s;min-width:90px;position:relative;}
    .tent-btn.ok{background:rgba(0,230,118,0.06);border-color:rgba(0,230,118,0.25);}
    .tent-btn.ok:hover{background:rgba(0,230,118,0.12);border-color:rgba(0,230,118,0.5);}
    .tent-btn.ok.selected{background:rgba(0,230,118,0.18);border-color:var(--hc-green);box-shadow:0 0 12px rgba(0,230,118,0.2);}
    .tent-btn.fail{background:rgba(255,123,46,0.06);border-color:rgba(255,123,46,0.25);}
    .tent-btn.fail:hover{background:rgba(255,123,46,0.12);border-color:rgba(255,123,46,0.5);}
    .tent-btn.fail.selected{background:rgba(255,123,46,0.18);border-color:var(--hc-orange);box-shadow:0 0 12px rgba(255,123,46,0.2);}
    .tent-btn.empty{background:rgba(255,255,255,0.02);border-color:rgba(255,255,255,0.08);cursor:default;opacity:.45;}
    .tent-btn.chosen-mark::after{content:'⭐';position:absolute;top:-8px;right:-4px;font-size:12px;}
    .tent-label{font-size:10px;color:var(--hc-muted);text-transform:uppercase;letter-spacing:.5px;}
    .tent-nota{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;}
    .tent-btn.ok   .tent-nota{color:var(--hc-green);}
    .tent-btn.fail .tent-nota{color:var(--hc-orange);}
    .tent-btn.empty .tent-nota{color:var(--hc-muted);}
    .tent-time{font-size:10px;color:var(--hc-muted);}
    .tent-hint{font-size:9px;color:rgba(155,127,254,0.7);margin-top:2px;}

    /* Fases — cards expansíveis */
    .fases-section{padding:14px 18px;}
    .fases-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .fase-card{border-radius:12px;border:1.5px solid;overflow:hidden;cursor:pointer;transition:all .2s;}
    .fase-card.f1{background:rgba(124,92,252,0.06);border-color:rgba(124,92,252,0.25);}
    .fase-card.f1:hover{background:rgba(124,92,252,0.1);border-color:rgba(124,92,252,0.5);}
    .fase-card.f1.open{border-color:var(--hc-purple);}
    .fase-card.f2{background:rgba(0,212,255,0.06);border-color:rgba(0,212,255,0.2);}
    .fase-card.f2:hover{background:rgba(0,212,255,0.1);border-color:rgba(0,212,255,0.4);}
    .fase-card.f2.open{border-color:var(--hc-cyan);}
    .fase-card-header{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;}
    .fase-card-left{display:flex;align-items:center;gap:8px;}
    .fase-card-left h3{font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--hc-muted);margin:0;}
    .fase-card-right{display:flex;align-items:center;gap:8px;}
    .fase-nota{font-family:'Orbitron',monospace;font-size:18px;font-weight:700;}
    .fase-nota.f1{color:var(--hc-pl);}
    .fase-nota.f2{color:var(--hc-cyan);}
    .fase-nota-s{font-size:11px;color:var(--hc-muted);}
    .fase-chevron{font-size:10px;color:var(--hc-muted);transition:transform .2s;}
    .fase-card.open .fase-chevron{transform:rotate(180deg);}
    .fase-card-body{display:none;border-top:1px solid;padding:12px 14px;}
    .fase-card.f1 .fase-card-body{border-color:rgba(124,92,252,0.2);}
    .fase-card.f2 .fase-card-body{border-color:rgba(0,212,255,0.15);}
    .fase-card.open .fase-card-body{display:block;}

    /* Questões */
    .q-list{display:flex;flex-direction:column;gap:6px;}
    .q-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;background:rgba(255,255,255,0.03);border-radius:8px;border-left:3px solid transparent;}
    .q-item.ok{background:rgba(0,230,118,0.08);border-left-color:var(--hc-green);}
    .q-item.no{background:rgba(255,68,68,0.08);border-left-color:var(--hc-red);}
    .q-item.nr{background:rgba(255,215,0,0.06);border-left-color:var(--hc-gold);}
    .q-num{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;color:var(--hc-muted);min-width:22px;padding-top:1px;flex-shrink:0;}
    .q-text{font-size:12px;color:var(--hc-text);flex:1;line-height:1.5;}
    .q-resp{font-size:11px;color:var(--hc-muted);margin-top:2px;}
    .q-status{font-size:14px;flex-shrink:0;}

    /* Fase 2 stats */
    .f2-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .f2-stat{background:rgba(255,255,255,0.03);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;}
    .f2-stat .lbl{font-size:11px;color:var(--hc-muted);}
    .f2-stat .val{font-size:12px;font-weight:600;color:var(--hc-text);}
    .f2-stat .val.green{color:var(--hc-green);}
    .f2-stat .val.orange{color:var(--hc-orange);}

    /* Torneio */
    .torneio-body{padding:14px 18px;}
    .torneio-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
    .t-stat{background:var(--hc-bg3);border-radius:10px;padding:10px;text-align:center;}
    .t-stat .val{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;line-height:1;}
    .t-stat .lbl{font-size:10px;color:var(--hc-muted);margin-top:3px;}
    .t-stat:nth-child(1) .val{color:var(--hc-gold);}
    .t-stat:nth-child(2) .val{color:var(--hc-pl);}
    .t-stat:nth-child(3) .val{color:var(--hc-green);}
    .t-stat:nth-child(4) .val{color:var(--hc-orange);}
    .torneio-extras{display:flex;gap:16px;font-size:12px;color:var(--hc-muted);flex-wrap:wrap;}

    /* Skeleton */
    .hc-sk{height:72px;border-radius:16px;margin-bottom:12px;background:linear-gradient(90deg,#1a1a2e 25%,#222238 50%,#1a1a2e 75%);background-size:200% 100%;animation:hcSk 1.4s infinite;}
    @keyframes hcSk{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .hc-empty{text-align:center;padding:60px 20px;color:var(--hc-muted);font-size:14px;}
    .hc-empty div{font-size:40px;margin-bottom:12px;}

    /* Questões F2 loading */
    .q-loading{font-size:12px;color:var(--hc-muted);padding:8px 0;}

    @media(max-width:480px){
      .torneio-stats{grid-template-columns:repeat(2,1fr);}
      .fases-row{grid-template-columns:1fr;}
      .tentativas-row{gap:6px;}
      .tent-btn{min-width:70px;padding:8px 10px;}
      .entry-score{flex-shrink:1;}
      .score-main{font-size:15px;}
      .score-label{font-size:9px;white-space:nowrap;}
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">📋 Histórico</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
      <div class="topbar-right">
        <div class="avatar-wrap" onclick="window.location.href='/aluno/perfil.html'">
          <div class="avatar" id="topbar-avatar-circle" style="overflow:hidden;padding:0"></div>
        </div>
      </div>
    </div>
    <div class="content hc" id="content-wrap">
      <div class="hc-filters" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button class="hc-fbtn on" onclick="setFiltro(this,'tudo')">🗂️ Tudo</button>
        <button class="hc-fbtn"    onclick="setFiltro(this,'atividade')">📝 Atividades</button>
        <button class="hc-fbtn"    onclick="setFiltro(this,'torneio')">🏆 Torneios</button>
        <div id="bimTabs" style="margin-left:auto"></div>
      </div>
      <div id="entries">
        <div class="hc-sk"></div>
        <div class="hc-sk" style="animation-delay:.1s"></div>
        <div class="hc-sk" style="animation-delay:.2s"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { db } from "/js/firebase-config.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { requireAluno, renderSidebarAluno, clearSession, isModoTeste, injetarFaixaDuelo, iniciarNotifDueloGlobal } from "/js/auth.js";
import { getResultadosByAluno, getResultados, getDetalhes, getHistoricoTeste, getAlunoPreferencia } from "/js/db.js";
import { bimestreAtual, bimestreDeData } from "/js/constants.js";
import { montarSeletorBimestre, bimestreSelecionado } from "/js/bimestre-seletor.js";
import { applyTopRankVisuals } from "/js/toprank.js";


const sess = requireAluno();
if (!sess) throw new Error();
const { alunos, turma } = sess;
// bimestre selecionado no histórico (via ?bim= ou o atual) + pílulas padrão
const _bimHist = bimestreSelecionado();
montarSeletorBimestre('bimTabs', { mostrarTodos:true });   // 1-4 sempre, recarrega ?bim=
const alunoNome = alunos[0];
  console.log('[historico] alunoNome:', JSON.stringify(alunoNome), '| turma:', turma);
const sessionUid = (turma + '_' + alunoNome).replace(/[.#$[\]/\s]/g, '_');

function avKey(s) { return btoa(unescape(encodeURIComponent(s))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_'); }

renderSidebarAluno("sidebar", "historico");
injetarFaixaDuelo();
window.sair = () => { clearSession(); window.location.href = "/index.html"; };
document.getElementById("topbar-sub").textContent = isModoTeste() ? '🧪 Modo Teste' : `Turma ${turma} · ${_bimHist}º bimestre`;
(async () => { try {
  const { getPerfil } = await import('/js/db.js');
  const { avatarUrl: _avUrl, avatarConfigDefault: _avDef } = await import('/js/gamificacao.js');
  const _p = await getPerfil(sessionUid);
  const _c = document.getElementById('topbar-avatar-circle');
  if (_c) {
    const _url   = _avUrl(_p.avatar || _avDef());
    const _letra = (alunoNome || '?')[0].toUpperCase();
    _c.innerHTML = `<div style="width:100%;height:100%;position:relative;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#7F77DD,#00d4ff)"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;z-index:0">${_letra}</span><img src="${_url}" alt="" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:1;border-radius:50%" onerror="this.style.display='none'"></div>`;
  }
} catch(_) {} })();

iniciarNotifDueloGlobal();

(async () => { try {
  const { iniciarPresenca, encerrarPresenca } = await import('/js/presenca.js');
  const _dispSnap = await get(ref(db, `perfis/${sessionUid}/duelos_disponivel`));
  const _disp = _dispSnap.val() !== false;
  await iniciarPresenca(sessionUid, { nome: alunoNome, turma, status: _disp ? 'disponivel' : 'indisponivel', pagina: 'navegando' });
  window.addEventListener('beforeunload', () => encerrarPresenca());
  const { initDueloAvail } = await import('/js/duelo_avail.js');
  await initDueloAvail(sessionUid);
} catch(e) {} })();

applyTopRankVisuals();

getAlunoPreferencia(turma, alunoNome, 'robotica').then(v => {
  if (v) localStorage.setItem('sm_pref_robotica', '1');
}).catch(() => {});

// ── Helpers ─────────────────────────────────────────────────
function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtTs(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtMs(ms) {
  if (!ms || ms <= 0) return null;
  const s = Math.round(ms / 1000);
  return `${Math.floor(s/60)}m${String(s%60).padStart(2,'0')}s`;
}
function notaColor(n) {
  if (n == null) return '';
  return n >= 7 ? 'green' : n >= 4 ? 'orange' : 'red';
}

// ── Agrupamento avaliação+ ───────────────────────────────────
const ATIVIDADES_OCULTAS = new Set(['Atividade 4 - Geometria']);
const MODOS_IGNORAR      = new Set(['tabuada', 'tabuada_speed', 'treino']);

function diaDe(ts) {
  // Derivar YYYY-MM-DD do timestamp para agrupar por dia
  if (!ts) return 'sem-data';
  const d = new Date(ts);
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function chaveSessao(r) {
  if (r.sessao_id) return r.sessao_id;
  if (r.inicio_sessao) return String(r.inicio_sessao);
  // Usar criadoEm (server timestamp) — mais confiável que r.data (string formatada pelo cliente)
  return `${r.aluno}|${r.atividade}|${diaDe(r.criadoEm)}`;
}

function agruparAvP(regs) {
  const map = new Map();
  for (const r of regs) {
    const k = chaveSessao(r);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  }
  return [...map.values()].map(tents => {
    tents.sort((a, b) => (a.tentativa_num || 1) - (b.tentativa_num || 1) || (a.criadoEm || 0) - (b.criadoEm || 0));
    const first = tents[0];
    const ts = first.inicio_sessao || first.criadoEm || 0;
    return { atividade: first.atividade, tentativas: tents, _ts: ts };
  });
}

// ── Carregar dados ───────────────────────────────────────────
let avpSessoes = [], ativSimples = [], tornItems = [], tentativasOficiais = {};
let testeHistSnap = null;
let _recordes = {}; // atividade -> { turmaMax, turmaNomes[], geralMax, geralNomes[] }

try {
  let todosRegs = [];

  if (isModoTeste()) {
    [todosRegs, testeHistSnap] = await Promise.all([
      getHistoricoTeste('atividades').catch(() => []),
      get(ref(db, `modo_teste_historico/${sessionUid}/torneios`)).catch(() => null),
    ]);
  } else {
    todosRegs = await getResultadosByAluno(alunoNome, turma).catch(() => []);
    todosRegs = todosRegs.filter(r => !r.modo_teste && r.turma === turma);
    // filtra pelo bimestre selecionado, derivando a data de criadoEm
    todosRegs = todosRegs.filter(r => {
      const ts = r.criadoEm || 0;
      if (!ts) return _bimHist === bimestreAtual(); // sem data: só no bimestre atual
      const iso = new Date(ts).toISOString().slice(0, 10);
      return bimestreDeData(iso) === _bimHist;
    });
  }

  // Avaliação+: agrupar por sessão (sem filtro de concluido — inclui T1 parcial)
  avpSessoes = agruparAvP(
    todosRegs.filter(r => r.modo === 'avaliacao_plus' && !ATIVIDADES_OCULTAS.has(r.atividade))
  );

  // Tentativas oficiais (avaliação+)
  if (!isModoTeste()) {
    const avAtivs = [...new Set(todosRegs.filter(r => r.modo === 'avaliacao_plus').map(r => r.atividade))];
    await Promise.all(avAtivs.map(async ativ => {
      try {
        const k    = avKey(turma + '|' + ativ);
        const snap = await get(ref(db, `avaliacao_controle/${k}/${avKey(alunoNome)}`));
        if (snap.exists()) {
          const v = snap.val();
          if (v.tentativa_escolhida != null) tentativasOficiais[ativ] = v.tentativa_escolhida;
        }
      } catch(e) {}
    }));
  }

  // Atividades simples (classico, competicao+)
  ativSimples = todosRegs.filter(r =>
    (r.concluido || r.acertos != null) &&
    r.modo !== 'avaliacao_plus' &&
    r.tipo !== 'torneio' &&
    !ATIVIDADES_OCULTAS.has(r.atividade) &&
    !MODOS_IGNORAR.has(r.modo)
  );

  // Recordes por atividade (maior nota da turma e de todas as salas, com nomes)
  if (!isModoTeste()) { try { _recordes = await construirRecordes(turma); } catch(_) { _recordes = {}; } }

  // Torneios
  if (!isModoTeste()) {
    const tornRegs = todosRegs.filter(r => r.concluido && r.tipo === 'torneio');
    const tornIds  = [...new Set(tornRegs.map(r => r.torneio_id).filter(Boolean))];
    const sessData = {};
    await Promise.all(tornIds.map(async tid => {
      try {
        const snap = await get(ref(db, `torneios/${tid}/sessoes/${sessionUid}`));
        if (snap.exists()) sessData[tid] = snap.val();
      } catch(e) {}
    }));
    tornItems = tornRegs.map(r => ({ ...r, _sess: sessData[r.torneio_id] || null, _ts: r.criadoEm || 0 }));
  } else if (testeHistSnap?.exists()) {
    testeHistSnap.forEach(c => tornItems.push({ ...c.val(), _ts: parseInt(c.key), _isTeste: true }));
  }

} catch(e) {
  console.error('[historico] Erro ao carregar:', e);
  document.getElementById('entries').innerHTML = `<div class="hc-empty">
    <div>⚠️</div>Erro ao carregar histórico.<br>
    <button onclick="location.reload()" style="margin-top:12px;padding:6px 16px;border-radius:8px;border:1px solid rgba(124,92,252,0.4);background:rgba(124,92,252,0.15);color:#9b7ffe;cursor:pointer;font-family:Inter,sans-serif;">Tentar novamente</button>
  </div>`;
}

// ── Lista unificada ordenada ─────────────────────────────────
const allItems = [
  ...avpSessoes.map(s  => ({ _tipo: 'avp',     _ts: s._ts,                _res: s })),
  ...ativSimples.map(r => ({ _tipo: 'ativ',    _ts: r.criadoEm || 0,      _res: r })),
  ...tornItems.map(r   => ({ _tipo: 'torneio', _ts: r._ts || r.criadoEm || 0, _res: r })),
].sort((a, b) => b._ts - a._ts);

// ── Dados de tentativas por entry (para selecionarTent) ───────
const _tentData = {}; // entryId → [{id, tentNum, nota, duracao, expirou, f2p, f2ac, f2er, f2cb, f2rap}]

// ── Render: item de questão ───────────────────────────────────
function renderQuestaoItem(q, i) {
  const enun = escH(q.enunciado || q.pergunta || '—');
  const ok   = q.resultado === 'acerto' || (q.resultado == null && !!q.acertou);
  const nr   = q.resultado === 'nao_respondida';
  const rA   = q.resposta_aluno || '—';
  const rC   = q.resposta_correta && q.resposta_correta !== 'undefined' ? q.resposta_correta : null;
  return `<div class="q-item ${nr ? 'nr' : ok ? 'ok' : 'no'}">
    <span class="q-num">Q${i+1}</span>
    <div class="q-text">
      ${enun}
      ${!ok && rC ? `<div class="q-resp">✓ correto: <strong>${escH(rC)}</strong>${rA !== '—' ? ` · sua resposta: ${escH(rA)}` : ''}</div>` : ''}
    </div>
    <span class="q-status">${nr ? '⏸' : ok ? '✅' : '❌'}</span>
  </div>`;
}

// ── Render: f2 body ───────────────────────────────────────────
function renderF2Body(d) {
  const rows = [
    ['Acertos', d.f2ac, d.f2ac > 0 ? 'green' : ''],
    ['Erros',   d.f2er, d.f2er > 0 ? 'orange' : ''],
    d.f2cb > 1 ? ['Combo máx.', `🔥 ×${d.f2cb}`, ''] : null,
    d.f2rap > 0 ? ['Veloz (máx)', `+${d.f2rap}`, 'green'] : null,
  ].filter(Boolean);
  return `<div class="f2-stats">${rows.map(([l,v,c]) =>
    `<div class="f2-stat"><span class="lbl">${l}</span><span class="val${c?' '+c:''}">${v}</span></div>`
  ).join('')}</div>`;
}

// ── Render: card avaliação+ ───────────────────────────────────
function renderAvP(sessao) {
  const tentEsc = tentativasOficiais[sessao.atividade] ?? null;
  const byNum   = {};
  for (const r of sessao.tentativas) byNum[r.tentativa_num || 1] = r;

  const melhor  = sessao.tentativas.reduce((b, r) => (r.nota_quiz ?? 0) > (b.nota_quiz ?? 0) ? r : b, sessao.tentativas[0]);
  const nqBest  = melhor?.nota_quiz ?? null;
  const nCol    = notaColor(nqBest);
  const ts      = sessao._ts;
  const cred    = (tentEsc != null ? byNum[tentEsc] : melhor)?.credito_final ?? null;
  const credStr = cred != null ? (Number.isInteger(cred) ? cred : Number(cred).toFixed(2)) : null;

  const entryId = `avp-${sessao.atividade.replace(/\W/g,'_')}-${ts}`;

  // Guardar metadados para selecionarTent
  _tentData[entryId] = sessao.tentativas.map(r => ({
    id:       r.id,
    tentNum:  r.tentativa_num || 1,
    nota:     r.nota_quiz ?? null,
    duracao:  fmtMs(r.tempo_fase1_ms) || '',
    expirou:  r.expirou_tempo || false,
    f2p:      r.pontuacao      || 0,
    f2ac:     r.acertos        || 0,
    f2er:     r.erros          || 0,
    f2cb:     r.combo_max      || 0,
    f2rap:    r.acertos_rapidos || 0,
  }));

  // índice inicial: tentativa escolhida ou melhor
  const initNum = tentEsc ?? melhor?.tentativa_num ?? 1;
  const initIdx = _tentData[entryId].findIndex(d => d.tentNum === initNum);

  // Botões de tentativa
  const tentBtns = [1, 2, 3].map(num => {
    const r = byNum[num];
    if (!r) return `<div class="tent-btn empty">
      <span class="tent-label">T${num}</span>
      <span class="tent-nota">—</span>
      <span class="tent-time">—</span>
    </div>`;
    const idx      = _tentData[entryId].findIndex(d => d.tentNum === num);
    const nq       = r.nota_quiz != null ? r.nota_quiz.toFixed(1) : '?';
    const isOk     = (r.nota_quiz ?? 0) >= 5;
    const isChosen = tentEsc === num;
    const exp      = r.expirou_tempo ? ' ⏱' : '';
    const dur      = fmtMs(r.tempo_fase1_ms) || '';
    return `<div class="tent-btn ${isOk ? 'ok' : 'fail'}${isChosen ? ' chosen-mark' : ''}"
      data-entry="${entryId}" data-tent-idx="${idx}">
      <span class="tent-label">T${num}</span>
      <span class="tent-nota">${nq}</span>
      <span class="tent-time">${dur}${exp}</span>
      <span class="tent-hint">👆 Ver detalhes</span>
    </div>`;
  }).join('');

  // Nota inicial para o header do card
  const initData = _tentData[entryId][initIdx >= 0 ? initIdx : 0];
  const f1NotaInicial = initData?.nota != null ? initData.nota.toFixed(1) : '—';
  const f2PtsInicial  = initData?.f2p ?? 0;

  return `<div class="entry" data-tipo="atividade" id="${entryId}" data-init-idx="${initIdx >= 0 ? initIdx : 0}">
    <div class="entry-header" data-entry="${entryId}" data-tipo-entry="avp">
      <div class="entry-icon atividade">📝</div>
      <div class="entry-info">
        <div class="entry-title">${escH(sessao.atividade)}</div>
        <div class="entry-meta">
          <span class="hc-tag avp">📋 Avaliação+</span>
          <span class="entry-date">${fmtTs(ts)}</span>
          ${credStr ? `<span class="entry-date">total: ${credStr}</span>` : ''}
        </div>
      </div>
      <div class="entry-score">
        <span class="score-main ${nCol}" id="${entryId}-score">${nqBest != null ? nqBest.toFixed(1) : '—'}</span>
        <span class="score-label">/ 10 pts F1</span>
      </div>
      <span class="chevron">▼</span>
    </div>
    <div class="entry-body">
      <div class="tentativas-section">
        <div class="tentativas-label">Tentativas — clique para ver detalhes</div>
        <div class="tentativas-row" id="${entryId}-tents">${tentBtns}</div>
        <div class="selected-indicator" id="${entryId}-sel"></div>
      </div>
      <div class="fases-section">
        <div class="fases-row">
          <div class="fase-card f1" data-fase="${entryId}-f1">
            <div class="fase-card-header" data-toggle-fase="${entryId}-f1">
              <div class="fase-card-left"><span>📝</span><h3>Fase 1 · Quiz</h3></div>
              <div class="fase-card-right">
                <span class="fase-nota f1" id="${entryId}-f1-nota">${f1NotaInicial}<span class="fase-nota-s">/10</span></span>
                <span class="fase-chevron">▼</span>
              </div>
            </div>
            <div class="fase-card-body" id="${entryId}-f1-body">
              <p style="font-size:12px;color:var(--hc-muted)">Selecione uma tentativa…</p>
            </div>
          </div>
          <div class="fase-card f2" data-fase="${entryId}-f2">
            <div class="fase-card-header" data-toggle-fase="${entryId}-f2">
              <div class="fase-card-left"><span>🎮</span><h3>Fase 2 · Livre</h3></div>
              <div class="fase-card-right">
                <span class="fase-nota f2" id="${entryId}-f2-nota">${f2PtsInicial}<span class="fase-nota-s"> pts</span></span>
                <span class="fase-chevron">▼</span>
              </div>
            </div>
            <div class="fase-card-body" id="${entryId}-f2-body">
              ${initData ? renderF2Body(initData) : ''}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

// ── Recordes por atividade (turma atual + todas as salas) ──────
async function construirRecordes(turmaAtual){
  const todos = await getResultados().catch(() => []);
  const rec = {};
  for (const r of todos){
    if (!r.concluido || r.modo_teste || !r.atividade) continue;
    const p = r.pontuacao_bruta || r.pontuacao || 0;
    const e = rec[r.atividade] = rec[r.atividade] || { turmaMax:-1, turmaNomes:[], geralMax:-1, geralNomes:[] };
    if (p > e.geralMax){ e.geralMax = p; e.geralNomes = [{ nome:r.aluno, turma:r.turma }]; }
    else if (p === e.geralMax && !e.geralNomes.some(x => x.nome === r.aluno)) e.geralNomes.push({ nome:r.aluno, turma:r.turma });
    if (r.turma === turmaAtual){
      if (p > e.turmaMax){ e.turmaMax = p; e.turmaNomes = [r.aluno]; }
      else if (p === e.turmaMax && !e.turmaNomes.includes(r.aluno)) e.turmaNomes.push(r.aluno);
    }
  }
  return rec;
}

// ── Render: card atividade simples ────────────────────────────
function renderAtivSimples(r) {
  const modo  = r.modo || 'classico';
  const isEq  = modo === 'equacoes_plus';
  const isC   = modo === 'competicao_plus';
  const pts   = r.pontuacao_bruta || r.pontuacao || 0;
  const acertos = r.acertos || 0, erros = r.erros || 0;
  const totalQ  = r.total || (acertos + erros) || 0;
  const taxa    = totalQ > 0 ? Math.round(acertos / totalQ * 100) : 0;
  const NOTA_MAX = 1.5;
  const fmt2   = n => n.toFixed(2).replace('.', ',');
  const nota15 = Math.round((pts / 10) * NOTA_MAX * 100) / 100;
  const notaVal = isEq ? fmt2(nota15) : String(pts);
  const notaLbl = isEq ? 'de 1,5' : 'pts';
  const escalar = v => isEq ? `${fmt2(Math.round((Math.max(0,v) / 10) * NOTA_MAX * 100) / 100)} de 1,5` : `${Math.max(0,v)} pts`;
  const entryId = `ativ-${r.id}`;
  const tag = isC ? `<span class="hc-tag cls">⚔️ Competição+</span>` : `<span class="hc-tag cls">📝 ${escH(modo)}</span>`;
  const parceiro = r.alunos?.[1] || r.parceiro_nome || r.dupla_de || '';
  const parceiroTag = parceiro ? `<span style="opacity:.5;font-size:10px">👥 + ${escH(parceiro)}</span>` : '';

  const nomes = (arr, comTurma) => {
    if (!arr || !arr.length) return '—';
    const show = arr.slice(0,5).map(x => comTurma
      ? `${escH(x.nome)} <span style="opacity:.6">(${escH(x.turma||'?')})</span>`
      : escH(x)).join(', ');
    return show + (arr.length > 5 ? ` <span style="opacity:.6">+${arr.length-5}</span>` : '');
  };
  const rec = (_recordes || {})[r.atividade];
  const recHtml = rec ? `
    <div class="hc-rec">
      <div class="hc-rec-item">
        <span class="hc-rec-ic">🏆</span>
        <div><div class="hc-rec-lbl">Maior nota da turma ${escH(r.turma || '')}</div>
        <div class="hc-rec-val">${escalar(rec.turmaMax)} · ${nomes(rec.turmaNomes, false)}</div></div>
      </div>
      <div class="hc-rec-item">
        <span class="hc-rec-ic">🌎</span>
        <div><div class="hc-rec-lbl">Maior nota de todas as salas</div>
        <div class="hc-rec-val">${escalar(rec.geralMax)} · ${nomes(rec.geralNomes, true)}</div></div>
      </div>
    </div>` : '';

  return `<div class="entry" data-tipo="atividade" id="${entryId}">
    <div class="entry-header" data-entry="${entryId}" data-tipo-entry="ativ" data-ids="${r.id}" data-tent-esc="">
      <div class="entry-icon atividade">📝</div>
      <div class="entry-info">
        <div class="entry-title">${escH(r.atividade || '—')}</div>
        <div class="entry-meta">
          ${tag}
          ${parceiroTag}
          <span class="entry-date">${r.data || fmtTs(r.criadoEm)}</span>
          <span class="entry-date">✅${acertos} ❌${erros} · ${taxa}%</span>
        </div>
      </div>
      <div class="entry-score">
        <span class="score-main ${pts > 0 ? (isEq ? 'green' : 'orange') : ''}">${notaVal}</span>
        <span class="score-label">${notaLbl}</span>
      </div>
      <span class="chevron">▼</span>
    </div>
    <div class="entry-body">
      <div style="padding:14px 18px;">
        <div class="hc-stats">
          <div class="hc-stat"><div class="v">${totalQ}</div><div class="l">Questões</div></div>
          <div class="hc-stat"><div class="v" style="color:var(--hc-green)">${acertos}</div><div class="l">Acertos</div></div>
          <div class="hc-stat"><div class="v" style="color:var(--hc-red)">${erros}</div><div class="l">Erros</div></div>
          <div class="hc-stat"><div class="v" style="color:var(--hc-cyan)">${taxa}%</div><div class="l">Aproveitamento</div></div>
          <div class="hc-stat"><div class="v" style="color:var(--hc-gold)">${notaVal}</div><div class="l">Nota ${isEq ? '/ 1,5' : '(pts)'}</div></div>
        </div>
        ${recHtml}
        <div class="hc-rev-title">Revisão das questões</div>
        <div id="q-${entryId}" class="q-list">
          <p style="font-size:12px;color:var(--hc-muted)">Abrindo…</p>
        </div>
      </div>
    </div>
  </div>`;
}

// ── Event delegation ─────────────────────────────────────────
const _questoesCache = {};

async function carregarQuestoesF1(entryId, tentIdx) {
  const tents   = _tentData[entryId];
  if (!tents || tentIdx < 0 || tentIdx >= tents.length) return;
  const d       = tents[tentIdx];
  const f1Body  = document.getElementById(`${entryId}-f1-body`);
  const f1Nota  = document.getElementById(`${entryId}-f1-nota`);
  if (!f1Body) return;

  // Atualizar nota F1 no card header
  const notaStr = d.nota != null ? d.nota.toFixed(1) : '—';
  if (f1Nota) f1Nota.innerHTML = `${notaStr}<span class="fase-nota-s">/10</span>`;

  // Atualizar F2 nota + body
  const f2Nota = document.getElementById(`${entryId}-f2-nota`);
  const f2Body = document.getElementById(`${entryId}-f2-body`);
  if (f2Nota) f2Nota.innerHTML = `${d.f2p}<span class="fase-nota-s"> pts</span>`;
  if (f2Body) f2Body.innerHTML = renderF2Body(d);

  // Indicador de seleção
  const sel = document.getElementById(`${entryId}-sel`);
  if (sel) sel.textContent = `Visualizando: T${d.tentNum} · ${notaStr}/10`;

  // Carregar questões F1
  if (!_questoesCache[d.id]) {
    f1Body.innerHTML = '<p style="font-size:12px;color:var(--hc-muted)">Carregando questões…</p>';
    _questoesCache[d.id] = await getDetalhes(d.id).catch(() => []);
  }
  const questoes = _questoesCache[d.id] || [];
  const f1Qs = questoes.filter(q => q.fase === 1);
  if (f1Qs.length) {
    f1Body.innerHTML = `<div class="q-list">${f1Qs.map((q,i) => renderQuestaoItem(q,i)).join('')}</div>`;
  } else {
    f1Body.innerHTML = '<p style="font-size:12px;color:var(--hc-muted)">Questões não disponíveis.</p>';
  }

  // Fases permanecem fechadas — o aluno clica manualmente para expandir
}

document.getElementById('entries').addEventListener('click', async function(e) {
  // 1. Tent-btn click (não propagar para entry-header)
  const tentBtn = e.target.closest('.tent-btn:not(.empty)');
  if (tentBtn) {
    const entryId = tentBtn.dataset.entry;
    const tentIdx = parseInt(tentBtn.dataset.tentIdx, 10);
    // Marcar como selected
    const tentsRow = document.getElementById(`${entryId}-tents`);
    if (tentsRow) {
      tentsRow.querySelectorAll('.tent-btn:not(.empty)').forEach((b,i) => {
        b.classList.toggle('selected', i === tentIdx);
      });
    }
    await carregarQuestoesF1(entryId, tentIdx);
    return;
  }

  // 2. Fase-card header click
  const faseHeader = e.target.closest('[data-toggle-fase]');
  if (faseHeader) {
    const faseId = faseHeader.dataset.toggleFase;
    const faseEl = document.querySelector(`[data-fase="${faseId}"]`);
    if (faseEl) faseEl.classList.toggle('open');
    return;
  }

  // 3. Entry header click
  const header = e.target.closest('[data-tipo-entry]');
  if (!header) return;
  const entryId = header.dataset.entry;
  const tipo    = header.dataset.tipoEntry;
  const el      = document.getElementById(entryId);
  if (!el) return;
  el.classList.toggle('open');
  if (!el.classList.contains('open')) return;

  // Auto-selecionar tentativa inicial ao abrir
  if (tipo === 'avp') {
    const initIdx = parseInt(el.dataset.initIdx || '0', 10);
    const tentsRow = document.getElementById(`${entryId}-tents`);
    if (tentsRow) {
      const btns = tentsRow.querySelectorAll('.tent-btn:not(.empty)');
      btns.forEach((b, i) => b.classList.toggle('selected', i === initIdx));
    }
    await carregarQuestoesF1(entryId, initIdx);
  } else if (tipo === 'ativ') {
    // Atividade simples: carregar questões lazy
    const dataStr = header.dataset.ids || '';
    if (!dataStr || _questoesCache[dataStr] != null) return;
    _questoesCache[dataStr] = await getDetalhes(dataStr).catch(() => []);
    const questoes = _questoesCache[dataStr] || [];
    const qEl = document.getElementById(`q-${entryId}`);
    if (!qEl) return;
    if (!questoes.length) { qEl.innerHTML = ''; return; }
    qEl.innerHTML = `<div class="q-list">${questoes.map((q,i) => renderQuestaoItem(q,i)).join('')}</div>`;
  }
  // torneio: sem ação extra
});

// ── Filtro ───────────────────────────────────────────────────
window.setFiltro = function(btn, tipo) {
  document.querySelectorAll('.hc-fbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('#entries .entry').forEach(el => {
    el.style.display = (tipo === 'tudo' || el.dataset.tipo === tipo) ? '' : 'none';
  });
};

// ── Render ───────────────────────────────────────────────────
try {
  const entriesEl = document.getElementById('entries');
  if (!allItems.length) {
    const msg = isModoTeste()
      ? '🧪 Nenhum teste realizado ainda.'
      : 'Nenhuma atividade ou torneio no histórico ainda.';
    entriesEl.innerHTML = `<div class="hc-empty"><div>📋</div>${msg}</div>`;
  } else {
    entriesEl.innerHTML = allItems.map(item => {
      if (item._tipo === 'avp')     return renderAvP(item._res);
      if (item._tipo === 'ativ')    return renderAtivSimples(item._res);
      if (item._tipo === 'torneio') return renderTorneio(item._res);
      return '';
    }).join('');
  }
} catch(e) {
  console.error('[historico] Erro ao renderizar:', e);
  document.getElementById('entries').innerHTML = `<div class="hc-empty">
    <div>⚠️</div>Erro ao renderizar: ${escH(e?.message || String(e))}<br>
    <button onclick="location.reload()" style="margin-top:12px;padding:6px 16px;border-radius:8px;border:1px solid rgba(124,92,252,0.4);background:rgba(124,92,252,0.15);color:#9b7ffe;cursor:pointer;font-family:Inter,sans-serif;">Recarregar</button>
  </div>`;
}

</script>
</body>
</html>
