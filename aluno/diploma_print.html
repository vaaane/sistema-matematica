<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#15102a">
<meta charset="UTF-8"/>
<title>Diploma — Imprimir</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:0}

  .diploma{
    width:100%;height:100%;position:relative;
    display:flex;flex-direction:column;
    background:#fff;
  }

  /* ═══ BANNER TOPO — cor muda por tier ═══ */
  .banner{
    padding:16px 36px 12px;display:flex;align-items:center;justify-content:space-between;
    position:relative;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .tier-base     .banner{background:linear-gradient(135deg,#3a2810 0%,#6b4f1d 50%,#8a6a2e 100%)}
  .tier-ouro     .banner{background:linear-gradient(135deg,#78350f 0%,#92400e 50%,#b45309 100%)}
  .tier-diamante .banner{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#4338ca 100%)}
  .banner::after{
    content:'';position:absolute;bottom:0;left:0;right:0;height:4px;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .tier-base     .banner::after{background:linear-gradient(90deg,#c9a84c,#f7e98e,#c9a84c)}
  .tier-ouro     .banner::after{background:linear-gradient(90deg,#f59e0b,#fde68a,#f59e0b)}
  .tier-diamante .banner::after{background:linear-gradient(90deg,#6366f1,#a5b4fc,#6366f1)}

  .banner-left{display:flex;align-items:center;gap:14px}
  .banner-logo img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(255,255,255,.3))}
  .banner-escola{font-family:'Cinzel',serif;font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#fff}
  .banner-unidade{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:2px}
  .banner-badge{
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
    border-radius:10px;padding:7px 16px;
  }
  .banner-badge-icon{font-size:20px}
  .banner-badge-text{font-family:'Cinzel',serif;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
  .tier-base     .banner-badge-text{color:#f7e98e}
  .tier-ouro     .banner-badge-text{color:#fde68a}
  .tier-diamante .banner-badge-text{color:#c4b5fd}

  /* ═══ CORPO ═══ */
  .corpo{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:12px 50px 10px;position:relative;text-align:center;
  }

  /* Borda dupla */
  .borda-ext{position:absolute;inset:6px 14px;pointer-events:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .borda-int{position:absolute;inset:11px 19px;pointer-events:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tier-base     .borda-ext{border:2.5px solid #c9a84c}  .tier-base     .borda-int{border:1px solid rgba(201,168,76,.3)}
  .tier-ouro     .borda-ext{border:2.5px solid #f59e0b}  .tier-ouro     .borda-int{border:1px solid rgba(245,158,11,.35)}
  .tier-diamante .borda-ext{border:2.5px solid #6366f1}  .tier-diamante .borda-int{border:1px solid rgba(99,102,241,.3)}

  .canto{position:absolute;font-size:22px;line-height:1;z-index:2}
  .canto.tl{top:7px;left:16px}.canto.tr{top:7px;right:16px;transform:scaleX(-1)}
  .canto.bl{bottom:7px;left:16px;transform:scaleY(-1)}.canto.br{bottom:7px;right:16px;transform:scale(-1)}
  .tier-base     .canto{color:#c9a84c}
  .tier-ouro     .canto{color:#f59e0b}
  .tier-diamante .canto{color:#6366f1}

  /* Textos */
  .titulo{font-family:'Cinzel',serif;font-size:26px;font-weight:900;letter-spacing:3px;text-transform:uppercase;line-height:1.15;margin-bottom:2px}
  .tier-base     .titulo{color:#3a2810}
  .tier-ouro     .titulo{color:#78350f}
  .tier-diamante .titulo{color:#1e1b4b}

  .divider{display:flex;align-items:center;gap:12px;margin:6px 0 8px;width:100%;max-width:400px}
  .divider::before,.divider::after{content:'';flex:1;height:2px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tier-base     .divider::before,.tier-base     .divider::after{background:linear-gradient(90deg,transparent,#c9a84c)}
  .tier-ouro     .divider::before,.tier-ouro     .divider::after{background:linear-gradient(90deg,transparent,#f59e0b)}
  .tier-diamante .divider::before,.tier-diamante .divider::after{background:linear-gradient(90deg,transparent,#6366f1)}
  .divider::after{background-direction:rtl}
  .tier-base     .divider::after{background:linear-gradient(90deg,#c9a84c,transparent)}
  .tier-ouro     .divider::after{background:linear-gradient(90deg,#f59e0b,transparent)}
  .tier-diamante .divider::after{background:linear-gradient(90deg,#6366f1,transparent)}
  .divider span{font-size:16px}
  .tier-base     .divider span{color:#c9a84c}
  .tier-ouro     .divider span{color:#f59e0b}
  .tier-diamante .divider span{color:#6366f1}

  .certifica{font-family:'Playfair Display',serif;font-size:12px;font-style:italic;margin-bottom:6px}
  .tier-base     .certifica{color:#8a6a2e}
  .tier-ouro     .certifica{color:#92400e}
  .tier-diamante .certifica{color:#4338ca}

  .nome{font-family:'Cinzel',serif;font-size:28px;font-weight:700;margin-bottom:3px;line-height:1.2}
  .tier-base     .nome{color:#1a0f00}
  .tier-ouro     .nome{color:#1a0800}
  .tier-diamante .nome{color:#1e1b4b}

  .turma{font-size:11px;font-family:'Playfair Display',serif;font-style:italic;margin-bottom:10px}
  .tier-base     .turma{color:#8a6a2e}
  .tier-ouro     .turma{color:#92400e}
  .tier-diamante .turma{color:#4338ca}

  .texto{font-family:'Playfair Display',serif;font-size:12px;line-height:1.7;margin-bottom:10px;max-width:500px}
  .tier-base     .texto{color:#3a2810}  .tier-base     .texto strong{color:#1a0f00}
  .tier-ouro     .texto{color:#3a1800}  .tier-ouro     .texto strong{color:#78350f}
  .tier-diamante .texto{color:#1e1b4b}  .tier-diamante .texto strong{color:#3730a3}

  /* Medalha */
  .medalha-wrap{margin-bottom:8px;display:inline-flex;flex-direction:column;align-items:center}
  .medalha-circulo{
    width:56px;height:56px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;margin-bottom:4px;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .tier-base     .medalha-circulo{background:linear-gradient(135deg,#f7e98e,#c9a84c);border:3px solid #8a6a2e}
  .tier-ouro     .medalha-circulo{background:linear-gradient(135deg,#fde68a,#f59e0b);border:3px solid #92400e}
  .tier-diamante .medalha-circulo{background:linear-gradient(135deg,#c4b5fd,#6366f1);border:3px solid #3730a3}
  .medalha-symbol{font-size:28px;line-height:1}
  .medalha-txt{font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;text-transform:uppercase}
  .tier-base     .medalha-txt{color:#8a6a2e}
  .tier-ouro     .medalha-txt{color:#92400e}
  .tier-diamante .medalha-txt{color:#3730a3}

  /* Stats */
  .stats{display:flex;justify-content:center;margin-bottom:4px}
  .stat{display:flex;flex-direction:column;align-items:center;padding:6px 16px;position:relative}
  .stat+.stat::before{content:'';position:absolute;left:0;top:20%;height:60%;width:1px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tier-base     .stat+.stat::before{background:rgba(201,168,76,.3)}
  .tier-ouro     .stat+.stat::before{background:rgba(245,158,11,.35)}
  .tier-diamante .stat+.stat::before{background:rgba(99,102,241,.35)}
  .stat-val{font-family:'Cinzel',serif;font-size:16px;font-weight:700}
  .stat-lbl{font-size:8px;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
  .tier-base     .stat-val,.tier-base     .stat-lbl{color:#8a6a2e}
  .tier-ouro     .stat-val,.tier-ouro     .stat-lbl{color:#92400e}
  .tier-diamante .stat-val,.tier-diamante .stat-lbl{color:#3730a3}

  .divider2{height:1.5px;margin-bottom:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tier-base     .divider2{background:linear-gradient(90deg,transparent,#c9a84c 30%,#c9a84c 70%,transparent)}
  .tier-ouro     .divider2{background:linear-gradient(90deg,transparent,#f59e0b 30%,#f59e0b 70%,transparent)}
  .tier-diamante .divider2{background:linear-gradient(90deg,transparent,#6366f1 30%,#6366f1 70%,transparent)}

  /* Assinatura com espaço */
  .assinatura{display:flex;justify-content:center}
  .assin-bloco{display:flex;flex-direction:column;align-items:center}
  .assin-espaco{height:40px}
  .assin-linha{width:220px;height:1.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tier-base     .assin-linha{background:linear-gradient(90deg,transparent,#5a4020,transparent)}
  .tier-ouro     .assin-linha{background:linear-gradient(90deg,transparent,#78350f,transparent)}
  .tier-diamante .assin-linha{background:linear-gradient(90deg,transparent,#3730a3,transparent)}
  .assin-nome{font-size:10px;font-weight:700;margin-top:3px}
  .assin-cargo{font-size:9px}
  .tier-base     .assin-nome{color:#3a2810} .tier-base     .assin-cargo{color:#8a6a2e}
  .tier-ouro     .assin-nome{color:#3a1800} .tier-ouro     .assin-cargo{color:#92400e}
  .tier-diamante .assin-nome{color:#1e1b4b} .tier-diamante .assin-cargo{color:#4338ca}

  .data{font-size:10px;margin-top:6px;font-family:'Playfair Display',serif;font-style:italic}
  .tier-base     .data{color:#a08040}
  .tier-ouro     .data{color:#b45309}
  .tier-diamante .data{color:#4338ca}

  /* Rodapé — faixa por tier */
  .rodape{height:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tier-base     .rodape{background:linear-gradient(90deg,#3a2810,#c9a84c,#3a2810)}
  .tier-ouro     .rodape{background:linear-gradient(90deg,#78350f,#f59e0b,#78350f)}
  .tier-diamante .rodape{background:linear-gradient(90deg,#1e1b4b,#6366f1,#1e1b4b)}

  .no-print{display:block}
  @media print{
    @page{size:A4 landscape;margin:0}
    html,body{width:297mm;height:210mm;overflow:hidden;background:#fff!important}
    .no-print{display:none!important}
    .diploma{width:297mm!important;height:210mm!important}
  }
</style>
</head>
<body>

<div class="no-print" style="position:fixed;top:12px;left:12px;z-index:999;display:flex;gap:8px">
  <button onclick="window.close()" style="background:#1a1a2e;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer">← Fechar</button>
  <button onclick="imprimirLandscape()" id="btn-imp" style="border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer">🖨️ Imprimir</button>
</div>
<div class="no-print" id="dica" style="position:fixed;top:56px;left:12px;z-index:999;border-radius:8px;padding:8px 14px;font-size:12px;max-width:340px;line-height:1.5">
  💡 Impressão em <strong>Paisagem</strong> · Couché Fosco 180-230g · Desative margens do navegador
</div>

<div class="diploma" id="diploma-wrap">
  <div class="banner">
    <div class="banner-left">
      <div class="banner-logo"><img src="/logo_fundotransparente.png" alt="eMatemática"/></div>
      <div>
        <div class="banner-escola">Centro Educacional São Bartolomeu</div>
        <div class="banner-unidade">São Sebastião · Distrito Federal</div>
      </div>
    </div>
    <div class="banner-badge">
      <span class="banner-badge-icon" id="bp-badge-icon">🏆</span>
      <span class="banner-badge-text" id="bp-badge-text">Tabuada 300</span>
    </div>
  </div>

  <div class="corpo">
    <div class="borda-ext"></div>
    <div class="borda-int"></div>
    <div class="canto tl">❧</div><div class="canto tr">❧</div>
    <div class="canto bl">❧</div><div class="canto br">❧</div>

    <div class="titulo" id="dp-titulo">Diploma de Excelência</div>
    <div class="divider"><span id="div-sym">✦</span></div>

    <div class="certifica">Certificamos que o(a) aluno(a)</div>
    <div class="nome" id="dp-nome">—</div>
    <div class="turma" id="dp-turma">—</div>
    <div class="texto" id="dp-texto">—</div>

    <div class="medalha-wrap">
      <div class="medalha-circulo"><span class="medalha-symbol" id="dp-medal-sym">★</span></div>
      <div class="medalha-txt" id="dp-medal-txt">Nível 300 Concluído</div>
    </div>

    <div class="stats" id="dp-stats"></div>
    <div class="divider2"></div>

    <div class="assinatura">
      <div class="assin-bloco">
        <div class="assin-espaco"></div>
        <div class="assin-linha"></div>
        <div class="assin-nome">Vanessa Oliveira</div>
        <div class="assin-cargo">Professora de Matemática</div>
      </div>
    </div>
    <div class="data" id="dp-data">—</div>
  </div>

  <div class="rodape"></div>
</div>

<script type="module">
import { requireAluno, getSession } from '/js/auth.js';
import { db } from '/js/firebase-config.js';
import { ref, get } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
import { getNomeCompleto } from '/js/nomes_completos.js';

const _params   = new URLSearchParams(location.search);
const _modelo   = _params.get('modelo') === '1';
const _uidParam = _params.get('uid');

let alunos, turma, uid;
if (_modelo) {
  turma = 'Modelo'; alunos = ['Aluno(a) Exemplo']; uid = '';
} else if (_uidParam) {
  uid = _uidParam;
  const _i = _uidParam.indexOf('_');
  turma = _params.get('turma') || (_i > -1 ? _uidParam.slice(0, _i) : '');
  const _nome = _params.get('nome') || (_i > -1 ? _uidParam.slice(_i + 1).replace(/_/g, ' ') : _uidParam);
  alunos = [_nome];
} else {
  const sess = requireAluno('/index.html');
  if (!sess) throw new Error('não autenticado');
  ({ alunos, turma } = sess);
  uid = (turma + '_' + alunos[0]).replace(/[.#$[\]/\s]/g, '_');
}

let tier     = _params.get('tier')    || sessionStorage.getItem('diploma_tier') || 'base';
let acertos  = parseInt(_params.get('acertos') || sessionStorage.getItem('diploma_acertos') || '0');
let tsConq   = parseInt(_params.get('ts')      || sessionStorage.getItem('diploma_tsConquista') || '0') || null;

if (_modelo) {
  tier = _params.get('tier') || 'base';
  acertos = 3403;
  tsConq = Date.now();
} else if (!acertos && uid) {
  try {
    const [c300, cO, cD, hist] = await Promise.all([
      get(ref(db, `conquistas/${uid}/tabuada_300`)),
      get(ref(db, `conquistas/${uid}/tabuada_ouro`)),
      get(ref(db, `conquistas/${uid}/tabuada_diamante`)),
      get(ref(db, `tabuada_niveis/${uid}/historico`)),
    ]);
    const temO = cO.exists() && cO.val().conquistado === true;
    const temD = cD.exists() && cD.val().conquistado === true;
    tier   = temD ? 'diamante' : temO ? 'ouro' : 'base';
    tsConq = c300.exists() ? c300.val().ts : null;
    if (hist.exists()) Object.values(hist.val()).forEach(e => { acertos += (e.acertos||0); });
  } catch(e) {}
}

function fmtNum(n) { return n.toLocaleString('pt-BR'); }
const opsStr = acertos > 0 ? fmtNum(acertos) : 'mais de 3.100';
const nomeCompleto = getNomeCompleto(turma, alunos[0]);
const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const now = new Date();
const dataConquista = tsConq ? new Date(tsConq).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}) : null;

document.body.classList.add(`tier-${tier}`);
document.getElementById('diploma-wrap').classList.add(`tier-${tier}`);

const cfg = {
  base: {
    titulo: 'Diploma de Excelência',
    medalSym: '★', medalTxt: 'Nível 300 Concluído', divSym: '✦',
    badgeIcon: '🏆', badgeText: 'Tabuada 300',
    texto: `concluiu com êxito todos os <strong>300 níveis</strong> do programa de Cálculo Mental da disciplina de <strong>Matemática</strong>, demonstrando dedicação, persistência e domínio das operações fundamentais, com a resolução de <strong>${opsStr} operações matemáticas</strong>.`,
    stats: [['300','Níveis concluídos'],[opsStr,'Operações resolvidas'],[dataConquista,'Data da conquista']],
    btnBg:'#c9a84c', btnColor:'#1a0f00', dicaBg:'rgba(201,168,76,.12)', dicaBorder:'rgba(201,168,76,.3)', dicaColor:'#8a6a2e',
  },
  ouro: {
    titulo: 'Diploma de Ouro',
    medalSym: '★', medalTxt: '300 Níveis com Estrela', divSym: '✦',
    badgeIcon: '⭐', badgeText: 'Ouro · 300',
    texto: `concluiu com maestria todos os <strong>300 níveis</strong> do programa de Cálculo Mental da disciplina de <strong>Matemática</strong>, completando cada nível <strong>sem cometer erros</strong> pelo menos uma vez, com a resolução de <strong>${opsStr} operações matemáticas</strong>.`,
    stats: [['300','Níveis ⭐'],[opsStr,'Operações resolvidas'],[dataConquista,'Conquista']],
    btnBg:'#f59e0b', btnColor:'#1a0f00', dicaBg:'rgba(245,158,11,.12)', dicaBorder:'rgba(245,158,11,.3)', dicaColor:'#92400e',
  },
  diamante: {
    titulo: 'Diploma de Maestria',
    medalSym: '◆', medalTxt: 'Maestria Total · 300 Níveis', divSym: '❋',
    badgeIcon: '💎', badgeText: 'Diamante · 300',
    texto: `atingiu a <strong>Maestria Total</strong> nos <strong>300 níveis</strong> do programa de Cálculo Mental da disciplina de <strong>Matemática</strong>, completando cada nível com <strong>3 vezes perfeito</strong>, com a resolução de <strong>${opsStr} operações matemáticas</strong>.`,
    stats: [['300','Níveis 💎'],[opsStr,'Operações resolvidas'],[dataConquista,'Conquista']],
    btnBg:'#6366f1', btnColor:'#fff', dicaBg:'rgba(99,102,241,.08)', dicaBorder:'rgba(99,102,241,.3)', dicaColor:'#3730a3',
  },
};
const t = cfg[tier];

document.getElementById('dp-titulo').textContent    = t.titulo;
document.getElementById('dp-nome').textContent      = nomeCompleto;
document.getElementById('dp-turma').textContent     = `Turma ${turma} · Ano letivo de ${now.getFullYear()}`;
document.getElementById('dp-texto').innerHTML       = t.texto;
document.getElementById('dp-medal-sym').textContent = t.medalSym;
document.getElementById('dp-medal-txt').textContent = t.medalTxt;
document.getElementById('div-sym').textContent      = t.divSym;
document.getElementById('bp-badge-icon').textContent= t.badgeIcon;
document.getElementById('bp-badge-text').textContent= t.badgeText;
document.getElementById('dp-data').textContent      = `São Sebastião, DF · ${meses[now.getMonth()]} de ${now.getFullYear()}`;

document.getElementById('dp-stats').innerHTML = t.stats
  .filter(([v]) => v)
  .map(([val,lbl]) => `<div class="stat"><div class="stat-val">${val}</div><div class="stat-lbl">${lbl}</div></div>`)
  .join('');

const btnImp = document.getElementById('btn-imp');
const dica   = document.getElementById('dica');
btnImp.style.background = t.btnBg;
btnImp.style.color      = t.btnColor;
dica.style.background   = t.dicaBg;
dica.style.border       = `1px solid ${t.dicaBorder}`;
dica.style.color        = t.dicaColor;
</script>

<script>
function imprimirLandscape(){const s=document.createElement('style');s.id='__ls';s.textContent=`@page{size:297mm 210mm landscape!important;margin:0!important;}@media print{html,body{width:297mm!important;height:210mm!important;}.diploma{width:297mm!important;height:210mm!important;}}`;document.head.appendChild(s);window.print();setTimeout(()=>{const e=document.getElementById('__ls');if(e)e.remove()},2e3)}
</script>
</body></html>
