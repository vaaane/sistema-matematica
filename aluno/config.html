<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#6c00d4">
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Configurações — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .pin-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .pin-field input{text-align:center;letter-spacing:6px;font-size:22px;font-weight:700;}
    @media(max-width:480px){.pin-row{grid-template-columns:1fr;}}
    .toggle-switch{position:relative;width:48px;height:26px;flex-shrink:0;}
    .toggle-switch input{opacity:0;width:0;height:0;position:absolute;}
    .toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:13px;cursor:pointer;transition:background .25s;}
    .toggle-slider::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .25s;}
    input:checked + .toggle-slider{background:var(--blue);}
    input:checked + .toggle-slider::before{transform:translateX(22px);}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Configurações</div>
        <div class="topbar-sub">Trocar senha de acesso</div>
      </div>
    </div>
    <div class="content">
      <div id="flash-wrap"></div>
      <div style="max-width:520px">

        <div class="card" id="card-tema" style="margin-bottom:16px">
          <div class="card-title" style="margin-bottom:16px">
            <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
            Aparência
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
            <div style="display:flex;align-items:center;gap:10px">
              <span id="tema-icon" style="font-size:24px;line-height:1;flex-shrink:0">☀️</span>
              <div>
                <div style="font-size:14px;font-weight:600">Modo escuro</div>
                <div style="font-size:12px;color:var(--text-muted);margin-top:2px">Reduz o brilho da tela</div>
              </div>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="chk-tema" onchange="alternarTema(this.checked)"/>
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

        <div class="card" id="card-senha">
          <div class="card-title" style="margin-bottom:20px">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            Trocar Senha
          </div>

          <div class="field" id="sel-aluno-wrap" style="display:none">
            <label class="field-label">Aluno</label>
            <select id="sel-aluno" class="input"></select>
          </div>

          <div class="field">
            <label class="field-label">Senha atual (4 dígitos)</label>
            <input type="password" class="input pin-field" id="inp-atual"
                   inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off"/>
          </div>
          <div class="pin-row">
            <div class="field">
              <label class="field-label">Nova senha</label>
              <input type="password" class="input pin-field" id="inp-nova"
                     inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off"/>
            </div>
            <div class="field">
              <label class="field-label">Confirmar nova senha</label>
              <input type="password" class="input pin-field" id="inp-confirma"
                     inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off"/>
            </div>
          </div>
          <button class="btn btn-orange" style="width:100%;justify-content:center;margin-top:8px"
                  onclick="trocarSenha()">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            Salvar nova senha
          </button>
        </div>

        <p style="margin-top:10px;font-size:11px;color:var(--text-muted);line-height:1.5;padding:0 4px;opacity:.7;">
          🔒 Senha: 4 dígitos numéricos. Se esquecer, peça ao professor para resetar.
        </p>

      </div>
    </div>
  </div>
</div>

<script>(()=>{const t=localStorage.getItem('tema');if(t==='escuro')document.documentElement.setAttribute('data-theme','dark');})()</script>
<script type="module">
import { requireAluno, renderSidebarAluno, clearSession, hashSenha, iniciarNotifDueloGlobal } from "/js/auth.js";
import { getSenhaAluno, setSenhaAluno, saveAlunoPreferencia, getAlunoPreferencia } from "/js/db.js";
import { applyTopRankVisuals } from "/js/toprank.js";
import { initAvBanner } from "/js/avaliacao_banner.js";

const sess = requireAluno("/index.html");
if (!sess) throw new Error("não autenticado");
renderSidebarAluno("sidebar", "config");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };
applyTopRankVisuals();

const { alunos, turma } = sess;
(async () => { try {
  const _uid = (turma + '_' + alunos[0]).replace(/[.#$[\]/\s]/g, '_');
  const { db: _db } = await import('/js/firebase-config.js');
  const { ref: _ref, get: _get } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
  const { iniciarPresenca, encerrarPresenca } = await import('/js/presenca.js');
  const _dispSnap = await _get(_ref(_db, `perfis/${_uid}/duelos_disponivel`));
  const _disp = _dispSnap.val() !== false;
  await iniciarPresenca(_uid, { nome: alunos[0], turma, status: _disp ? 'disponivel' : 'indisponivel', pagina: 'navegando' });
  window.addEventListener('beforeunload', () => encerrarPresenca());
  const { initDueloAvail } = await import('/js/duelo_avail.js');
  await initDueloAvail(_uid);
} catch(e) {} })();
iniciarNotifDueloGlobal();
initAvBanner(turma, alunos[0]);

// ── Tema ──────────────────────────────────────────
const chkTema = document.getElementById('chk-tema');
const temaIcon = document.getElementById('tema-icon');

function atualizarIconeTema(escuro) {
  if (temaIcon) temaIcon.textContent = escuro ? '🌙' : '☀️';
}

const temaLocal = localStorage.getItem('tema') === 'escuro';
chkTema.checked = temaLocal;
atualizarIconeTema(temaLocal);

// Sincroniza com Firebase (não-bloqueante)
getAlunoPreferencia(turma, alunos[0], 'tema').then(temaSalvo => {
  if (temaSalvo && temaSalvo !== localStorage.getItem('tema')) {
    const escuro = temaSalvo === 'escuro';
    localStorage.setItem('tema', temaSalvo);
    document.documentElement.setAttribute('data-theme', escuro ? 'dark' : '');
    chkTema.checked = escuro;
    atualizarIconeTema(escuro);
  }
});

getAlunoPreferencia(turma, alunos[0], 'robotica').then(isRob => {
  localStorage.setItem('sm_pref_robotica', isRob ? '1' : '0');
}).catch(() => {});

window.alternarTema = function(ativo) {
  const tema = ativo ? 'escuro' : 'claro';
  localStorage.setItem('tema', tema);
  document.documentElement.setAttribute('data-theme', ativo ? 'dark' : '');
  atualizarIconeTema(ativo);
  for (const nome of alunos) saveAlunoPreferencia(turma, nome, 'tema', tema).catch(() => {});
};

// Seletor de aluno (quando 2 estão logados)
const selWrap = document.getElementById("sel-aluno-wrap");
const sel     = document.getElementById("sel-aluno");
if (alunos.length > 1) {
  selWrap.style.display = "";
  alunos.forEach(n => { sel.innerHTML += `<option value="${n}">${n}</option>`; });
}

function nomeAtivo() { return alunos.length > 1 ? sel.value : alunos[0]; }

function flash(msg, tipo = "success") {
  const w = document.getElementById("flash-wrap");
  w.innerHTML = `<div class="alert alert-${tipo}">${msg}</div>`;
  setTimeout(() => { w.innerHTML = ""; }, 5000);
}

window.trocarSenha = async function() {
  const nome     = nomeAtivo();
  const atual    = document.getElementById("inp-atual").value;
  const nova     = document.getElementById("inp-nova").value;
  const confirma = document.getElementById("inp-confirma").value;

  if (!atual || !nova || !confirma) return flash("Preencha todos os campos.", "error");
  if (!/^\d{4}$/.test(nova))        return flash("A nova senha deve ter exatamente 4 dígitos numéricos.", "error");
  if (nova !== confirma)             return flash("As senhas não coincidem.", "error");

  const btn = document.querySelector("[onclick='trocarSenha()']");
  btn.disabled = true; btn.textContent = "Verificando…";

  try {
    const [hashAtual, rec] = await Promise.all([
      hashSenha(turma, nome, atual),
      getSenhaAluno(turma, nome),
    ]);

    if (!rec)               return flash("Senha não cadastrada. Peça ao professor.", "error");
    if (rec.hash !== hashAtual) return flash("Senha atual incorreta, tente novamente.", "error");

    const hashNova = await hashSenha(turma, nome, nova);
    await setSenhaAluno(turma, nome, hashNova, btoa(nova));

    flash(`✅ Senha de ${nome} alterada com sucesso!`);
    document.getElementById("inp-atual").value   = "";
    document.getElementById("inp-nova").value    = "";
    document.getElementById("inp-confirma").value = "";
  } catch(e) {
    flash("Erro ao salvar senha. Tente novamente.", "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> Salvar nova senha`;
  }
};
</script>
</body>
</html>
