<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Robótica — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .rob-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
    .rob-card:hover{border-color:var(--blue);box-shadow:var(--shadow);}
    .rob-card.done{border-color:#BBF7D0;}
    .rob-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:26px;}
    .rob-info{flex:1;min-width:0;}
    .rob-info h3{font-size:15px;font-weight:700;margin-bottom:2px;}
    .rob-info p{font-size:12px;color:var(--text-muted);}
    .rob-badge{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;flex-shrink:0;}
    .rob-badge.done{background:#DCFCE7;color:#16A34A;}
    .rob-badge.todo{background:var(--blue-pale);color:var(--blue-dark);}
    /* História de tentativas */
    .hist-wrap{border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);overflow:hidden;margin-bottom:14px;}
    .hist-toggle{display:flex;align-items:center;gap:8px;padding:10px 18px;font-size:12px;font-weight:600;color:var(--text-muted);cursor:pointer;background:var(--bg);transition:background .12s;user-select:none;}
    .hist-toggle:hover{background:#F1F5F9;}
    .hist-toggle svg{width:16px;height:16px;fill:var(--text-muted);transition:transform .2s;flex-shrink:0;}
    .hist-toggle.open svg{transform:rotate(180deg);}
    .hist-body{display:none;background:var(--bg);}
    .tent-item{border-top:1px solid var(--border);}
    .tent-hdr{display:flex;align-items:center;gap:8px;padding:9px 18px;cursor:pointer;font-size:12px;transition:background .12s;}
    .tent-hdr:hover{background:#F8FAFC;}
    .tent-hdr svg{width:14px;height:14px;fill:var(--text-muted);margin-left:auto;transition:transform .2s;flex-shrink:0;}
    .tent-hdr.open svg{transform:rotate(180deg);}
    .tent-detail{display:none;padding:10px 18px 14px;border-top:1px dashed var(--border);}
    .tent-q{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:7px;font-size:11px;margin-bottom:5px;line-height:1.4;}
    .tent-q.ok{background:#F0FDF4;border:1px solid #BBF7D0;}
    .tent-q.err{background:#FEF2F2;border:1px solid #FECACA;}
    .tent-q.skip{background:#F8FAFC;border:1px dashed var(--border);color:var(--text-muted);}
    /* Progress bar */
    .quiz-pbar{height:8px;background:var(--border);border-radius:4px;margin-bottom:20px;overflow:hidden;}
    .quiz-pbar-fill{height:100%;background:var(--blue);border-radius:4px;transition:width .4s;}
    /* Category badge */
    .q-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:14px;}
    .q-badge.facil{background:#DCFCE7;color:#15803D;}
    .q-badge.medio{background:#FEF9C3;color:#854D0E;}
    .q-badge.dificil{background:#FEE2E2;color:#B91C1C;}
    /* Question */
    .quiz-q{font-size:20px;font-weight:700;line-height:1.4;margin-bottom:22px;}
    .quiz-opcoes-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
    .quiz-opcao{padding:10px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);font-size:14px;font-weight:600;cursor:pointer;text-align:left;transition:background .12s,border-color .12s;width:100%;display:block;font-family:'Inter',sans-serif;}
    .quiz-opcao:hover:not([disabled]){border-color:var(--blue);background:var(--blue-pale);}
    .quiz-opcao.correta{border-color:var(--green)!important;background:#F0FDF4!important;color:#15803D!important;font-weight:700;}
    .quiz-opcao.errada{border-color:var(--red)!important;background:#FEF2F2!important;color:#B91C1C!important;}
    .quiz-opcao.neutra{opacity:.45;}
    .vf-wrap{display:flex;gap:12px;margin-bottom:16px;}
    .vf-btn{flex:1;padding:14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;background:var(--card);font-family:'Inter',sans-serif;}
    .vf-btn:hover:not([disabled]){border-color:var(--blue);background:var(--blue-pale);}
    .vf-btn.correta{border-color:var(--green)!important;background:#F0FDF4!important;color:#15803D!important;}
    .vf-btn.errada{border-color:var(--red)!important;background:#FEF2F2!important;color:#B91C1C!important;}
    .num-wrap{display:flex;gap:10px;margin-bottom:16px;align-items:center;}
    .num-input{flex:1;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;background:var(--card);color:var(--text);}
    .num-input:focus{outline:none;border-color:var(--blue);}
    .quiz-fb{padding:12px 16px;border-radius:10px;font-size:14px;font-weight:600;margin-bottom:14px;display:none;}
    .quiz-fb.ok{background:#F0FDF4;color:#15803D;border:1px solid #BBF7D0;}
    .quiz-fb.err{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;}
    /* Summary */
    .summ-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
    .summ-stat{display:flex;align-items:center;gap:12px;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);}
    .summ-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
    /* Comparação */
    .comp-q{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;font-size:12px;margin-bottom:4px;}
    .comp-q.melhora{background:#DCFCE7;border:1px solid #BBF7D0;}
    .comp-q.piora{background:#FEE2E2;border:1px solid #FECACA;}
    .comp-q.manteve-err{background:#FFF7ED;border:1px solid #FED7AA;}
    /* Modal encerrar */
    .enc-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;}
    .enc-box{background:var(--card);border-radius:var(--radius);padding:28px 24px;max-width:380px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.2);}
    #quiz-wrap,#summary-wrap{display:none;}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">🤖 Robótica</div>
        <div class="topbar-sub" id="topbar-sub">Carregando…</div>
      </div>
    </div>
    <div class="content">

      <div id="list-wrap">
        <div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div>
      </div>

      <div id="quiz-wrap">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
          <button class="btn btn-outline" id="btn-voltar" style="padding:8px 16px;font-size:13px;">← Voltar</button>
          <div style="flex:1;min-width:0;">
            <div style="font-size:14px;font-weight:700;" id="quiz-titulo"></div>
            <div style="font-size:12px;color:var(--text-muted);" id="quiz-prog-text"></div>
          </div>
          <button class="btn btn-outline" id="btn-encerrar" onclick="pedirEncerrar()" style="padding:8px 14px;font-size:13px;color:var(--red);border-color:var(--red);flex-shrink:0;">⛔ Encerrar</button>
        </div>
        <div class="quiz-pbar"><div class="quiz-pbar-fill" id="quiz-bar"></div></div>
        <div style="background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 28px 20px;">
          <div id="quiz-enunciado"></div>
          <div id="quiz-opcoes"></div>
          <div class="quiz-fb" id="quiz-fb"></div>
          <button class="btn" id="btn-proxima" style="display:none;width:100%;">Próxima →</button>
        </div>
      </div>

      <div id="summary-wrap">
        <div style="text-align:center;margin-bottom:24px;">
          <div style="font-size:52px;margin-bottom:8px;" id="summ-emoji"></div>
          <div style="font-size:22px;font-weight:800;" id="summ-titulo"></div>
          <div style="font-size:14px;color:var(--text-muted);margin-top:4px;" id="summ-sub"></div>
        </div>
        <div class="summ-grid">
          <div class="summ-stat">
            <div class="summ-icon" style="background:#DCFCE7;">✅</div>
            <div><div style="font-size:26px;font-weight:800;color:var(--green);" id="summ-acertos"></div><div style="font-size:12px;color:var(--text-muted);">acertos</div></div>
          </div>
          <div class="summ-stat">
            <div class="summ-icon" style="background:#FEE2E2;">❌</div>
            <div><div style="font-size:26px;font-weight:800;color:var(--red);" id="summ-erros"></div><div style="font-size:12px;color:var(--text-muted);">erros</div></div>
          </div>
        </div>
        <div id="summ-comparacao" style="margin-bottom:16px;"></div>
        <div id="summ-analise" style="margin-bottom:16px;"></div>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-outline" id="btn-refazer" style="flex:1;">↺ Refazer</button>
          <button class="btn" id="btn-voltar-lista" style="flex:1;">← Lista</button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal encerrar -->
<div id="modal-encerrar" class="enc-overlay" style="display:none;" onclick="if(event.target===this)fecharEncerrar()">
  <div class="enc-box">
    <div style="font-size:17px;font-weight:800;margin-bottom:10px;">⛔ Encerrar atividade?</div>
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:22px;line-height:1.6;">As questões não respondidas até agora não serão contabilizadas como acerto.</div>
    <div style="display:flex;gap:10px;">
      <button class="btn" onclick="confirmarEncerrar()" style="flex:1;background:#DC2626;border-color:#DC2626;">Encerrar</button>
      <button class="btn btn-outline" onclick="fecharEncerrar()" style="flex:1;">Continuar</button>
    </div>
  </div>
</div>

<script>(()=>{const t=localStorage.getItem('tema');if(t==='escuro')document.documentElement.setAttribute('data-theme','dark');})()</script>
<script type="module">
import { getAlunoPreferencia, saveRoboticaTentativa, getRoboticaTentativasAluno } from "/js/db.js";
import { requireAluno, renderSidebarAluno, clearSession } from "/js/auth.js";
import { initAvBanner } from "/js/avaliacao_banner.js";

const sess = requireAluno("/index.html");
if (!sess) throw new Error("não autenticado");
const { alunos, turma } = sess;
const aluno = alunos[0];
initAvBanner(turma, aluno);

window.sair = () => { clearSession(); window.location.href = "/index.html"; };
renderSidebarAluno("sidebar", "robotica");

const isRob = await getAlunoPreferencia(turma, aluno, 'robotica');
if (!isRob) { window.location.href = '/aluno/menu.html'; throw new Error("sem acesso"); }

(function() {
  const nav = document.querySelector('#sidebar .sidebar-nav');
  if (!nav) return;
  const div = document.createElement('div'); div.className = 'nav-divider'; nav.appendChild(div);
  const a = document.createElement('a');
  a.className = 'nav-item active-orange'; a.href = '/aluno/robotica.html';
  a.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 9V7c0-1.1-.9-2-2-2h-3c0-1.66-1.34-3-3-3S9 3.34 9 5H6c-1.1 0-2 .9-2 2v2c-1.66 0-3 1.34-3 3s1.34 3 3 3v4c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4c1.66 0 3-1.34 3-3s-1.34-3-3-3zm-2 10H6V7h12v12zm-9-6c-.83 0-1.5-.67-1.5-1.5S8.17 10 9 10s1.5.67 1.5 1.5S9.83 13 9 13zm6 0c-.83 0-1.5-.67-1.5-1.5S14.17 10 15 10s1.5.67 1.5 1.5S15.83 13 15 13z"/></svg>🤖 Robótica`;
  nav.appendChild(a);
})();

document.getElementById('topbar-sub').textContent = `Olá, ${aluno}!`;

const ATIVIDADES = [
  { n:1, label:"Atividade 1", desc:"Hardware básico e blocos fundamentais",  emoji:"🔌", bg:"#EBF6FD" },
  { n:2, label:"Atividade 2", desc:"Aprofundamento de hardware e operadores", emoji:"⚡", bg:"#F5F3FF" },
  { n:3, label:"Atividade 3", desc:"Operadores avançados, se/então e lógica", emoji:"🧠", bg:"#DCFCE7" },
];

let questoes = [];
let atividadeAtual = null;
let qIdx = 0;
let respostas = {};
let tentativasDB = [];
let questoesMap = {}; // id → questão completa (todas as atividades)

const listWrap  = document.getElementById('list-wrap');
const quizWrap  = document.getElementById('quiz-wrap');
const summWrap  = document.getElementById('summary-wrap');

// ── Carrega todas as questões para exibir histórico ───────────────────────
async function carregarQuestoesMap() {
  const results = await Promise.allSettled(
    [1,2,3].map(n => fetch(`/dados/robotica/atividade_${n}.json`).then(r => r.json()))
  );
  for (const r of results) {
    if (r.status === 'fulfilled') for (const q of r.value.questoes) questoesMap[q.id] = q;
  }
}

async function carregarLista() {
  try {
    tentativasDB = await getRoboticaTentativasAluno(turma, aluno);
  } catch(e) {
    console.error('[Robótica] carregarLista:', e);
    tentativasDB = [];
  }
  renderLista();
}

function getTentativasPorAtiv(n) {
  return tentativasDB.filter(t => t.atividade == n); // == para tolerar string/number
}

function formatData(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}

// ── Renderiza detalhe de questões de uma tentativa ──────────────────────────
function renderQuestoesDetalhe(tent) {
  const ativN = tent.atividade;
  const atResps = tent.respostas || {};
  // Todas as questões da atividade nesta ordem
  const todasQs = Object.values(questoesMap).filter(q => {
    // identifica por prefixo ou por atividade — precisamos saber a qual atividade pertence
    // Usamos os índices carregados no fetch; como questoesMap tem todas, filtramos pelas respondidas
    // e pelas da atividade correta. Mas questoesMap não guarda n. Então usamos apenas as respondidas
    // + qualquer questão encontrada.
    return true; // fallback: usa respondidas
  });

  // questoes da atividade específica
  const qsAtiv = [1,2,3].reduce((acc, n) => {
    if (n == ativN) {
      // Filtramos questoesMap pelas questões que têm ID no respostas OU pela atividade
      // Usamos uma abordagem: pegar todas as IDs respondidas e buscar no map
    }
    return acc;
  }, null);

  // Pega questões respondidas da tentativa, na ordem das IDs
  const respondidosIds = Object.keys(atResps);
  const naoRespondidosIds = [];

  // Busca questoes da atividade a partir do questoesMap (prefixo não é confiável)
  // Melhor: usar fetch de atividade_N.json em cache (não temos aqui)
  // Então: mostra só as respondidas + indica total

  const rows = respondidosIds.map((qid, i) => {
    const r = atResps[qid];
    const q = questoesMap[qid];
    const enunciado = q ? q.enunciado : `Questão ${qid}`;
    const correta = q ? q.resposta : '—';
    const ac = r?.acertou;
    const rdada = r?.resposta_dada ?? '—';
    const cls = (ac === null || ac === undefined) ? 'skip' : ac ? 'ok' : 'err';
    return `<div class="tent-q ${cls}">
      <span style="font-size:10px;font-weight:700;color:var(--text-muted);width:20px;flex-shrink:0;padding-top:1px;">${i+1}.</span>
      <div style="flex:1;min-width:0;">
        <div style="font-size:11px;white-space:pre-wrap;margin-bottom:3px;">${enunciado}</div>
        <div style="font-size:10px;">
          <span style="font-weight:700;color:${ac ? 'var(--green)' : ac === false ? 'var(--red)' : 'var(--text-muted)'};">
            ${rdada === null || rdada === undefined || rdada === '' ? 'Não respondida' : 'Resposta: ' + rdada}
          </span>
          ${!ac && correta !== '—' ? `<span style="color:var(--text-muted);margin-left:8px;">✓ Correta: ${correta}</span>` : ''}
        </div>
      </div>
      <span style="font-size:14px;flex-shrink:0;">${ac ? '✅' : ac === false ? '❌' : '—'}</span>
    </div>`;
  }).join('');

  const naoResp = (tent.total || 0) - respondidosIds.length;
  const naoRespHtml = naoResp > 0
    ? `<div style="font-size:11px;color:var(--text-muted);margin-top:6px;padding:6px 8px;background:var(--bg);border-radius:6px;border:1px dashed var(--border);">
        ${naoResp} questão(ões) não respondida(s)
       </div>`
    : '';

  return rows + naoRespHtml;
}

// ── Renderiza lista de atividades ─────────────────────────────────────────
function renderLista() {
  listWrap.innerHTML = ATIVIDADES.map(a => {
    const tents = getTentativasPorAtiv(a.n).slice().reverse(); // mais recente primeiro
    const done = tents.length > 0;
    const melhor = done ? Math.max(...tents.map(t => t.acertos || 0)) : 0;
    const total  = done ? (tents[0].total || 0) : 0;
    const melhorPct = total > 0 ? Math.round(melhor / total * 100) : 0;

    const histHtml = done ? `
      <div class="hist-wrap">
        <div class="hist-toggle" id="hist-toggle-${a.n}" onclick="toggleHistAtiv(${a.n}, event)">
          <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21L13 13.04V8h-1z"/></svg>
          <span>${tents.length} tentativa${tents.length > 1 ? 's' : ''} · melhor: <strong style="color:var(--green)">${melhor}/${total} (${melhorPct}%)</strong></span>
          <svg viewBox="0 0 24 24" style="margin-left:auto;"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
        </div>
        <div class="hist-body" id="hist-body-${a.n}">
          ${tents.map((t, i) => {
            const pct = t.total > 0 ? Math.round((t.acertos || 0) / t.total * 100) : 0;
            const pctColor = pct >= 80 ? 'var(--green)' : pct >= 60 ? '#F59E0B' : 'var(--red)';
            const data = formatData(t.completadoEm);
            const tentIdx = tents.length - i; // 1ª, 2ª, etc (mais recente = última)
            const parcialBadge = t.parcial ? '<span style="font-size:10px;background:#FEF9C3;color:#854D0E;padding:1px 6px;border-radius:10px;margin-left:6px;">parcial</span>' : '';
            return `<div class="tent-item">
              <div class="tent-hdr" id="tent-hdr-${t.id}" onclick="toggleTentDetalhe('${t.id}', ${a.n}, event)">
                <span style="font-weight:700;color:var(--text-muted);font-size:11px;width:22px;flex-shrink:0;">${tentIdx}ª</span>
                <span style="font-weight:800;font-size:13px;color:${pctColor}">${t.acertos || 0}/${t.total || 0}</span>
                <span style="font-size:12px;color:var(--text-muted);">${pct}%</span>
                ${parcialBadge}
                <span style="font-size:11px;color:var(--text-muted);margin-left:auto;">${data}</span>
                <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
              </div>
              <div class="tent-detail" id="tent-detail-${t.id}"></div>
            </div>`;
          }).join('')}
        </div>
      </div>` : '';

    return `<div>
      <div class="rob-card${done ? ' done' : ''}" onclick="iniciarAtividade(${a.n})" style="border-radius:${done ? 'var(--radius) var(--radius) 0 0' : 'var(--radius)'};">
        <div class="rob-icon" style="background:${a.bg};">${a.emoji}</div>
        <div class="rob-info" style="min-width:0;">
          <h3>${a.label}</h3>
          <p>${a.desc}</p>
        </div>
        <span class="rob-badge ${done ? 'done' : 'todo'}" style="align-self:flex-start;">${done ? 'Refazer' : 'Iniciar'}</span>
      </div>
      ${histHtml}
      ${!done ? '<div style="margin-bottom:14px;"></div>' : ''}
    </div>`;
  }).join('');
}

window.toggleHistAtiv = function(n, e) {
  e?.stopPropagation();
  const toggle = document.getElementById(`hist-toggle-${n}`);
  const body   = document.getElementById(`hist-body-${n}`);
  if (!toggle || !body) return;
  const open = body.style.display === 'block';
  body.style.display = open ? 'none' : 'block';
  toggle.classList.toggle('open', !open);
};

window.toggleTentDetalhe = function(id, ativN, e) {
  e?.stopPropagation();
  const hdr    = document.getElementById(`tent-hdr-${id}`);
  const detail = document.getElementById(`tent-detail-${id}`);
  if (!detail) return;
  const open = detail.style.display === 'block';
  detail.style.display = open ? 'none' : 'block';
  hdr?.classList.toggle('open', !open);
  if (!open && !detail.dataset.loaded) {
    detail.dataset.loaded = 'true';
    const tent = tentativasDB.find(t => t.id === id);
    if (tent) detail.innerHTML = renderQuestoesDetalhe(tent);
    else detail.innerHTML = '<div style="font-size:12px;color:var(--text-muted);padding:4px 0;">Detalhes não disponíveis.</div>';
  }
};

// ── Iniciar atividade ─────────────────────────────────────────────────────
window.iniciarAtividade = async (n) => {
  atividadeAtual = n;
  qIdx = 0;
  respostas = {};
  const data = await fetch(`/dados/robotica/atividade_${n}.json`).then(r => r.json());
  questoes = data.questoes;
  listWrap.style.display  = 'none';
  summWrap.style.display  = 'none';
  quizWrap.style.display  = 'block';
  document.getElementById('quiz-titulo').textContent = `Atividade ${n}`;
  renderQuestao();
};

function renderQuestao() {
  const q = questoes[qIdx];
  document.getElementById('quiz-prog-text').textContent = `Questão ${qIdx + 1} de ${questoes.length}`;
  document.getElementById('quiz-bar').style.width = `${(qIdx / questoes.length) * 100}%`;

  const dif = q.dificuldade || '';
  const badgeCls = dif === 'facil' ? 'facil' : dif === 'medio' ? 'medio' : dif === 'dificil' ? 'dificil' : '';
  const badgeLabel = q.categoria || (dif ? dif.charAt(0).toUpperCase() + dif.slice(1) : '');
  const badge = badgeCls
    ? `<div class="q-badge ${badgeCls}">${badgeLabel}</div>`
    : (badgeLabel ? `<div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">${badgeLabel}</div>` : '');
  document.getElementById('quiz-enunciado').innerHTML = badge + `<div class="quiz-q" style="white-space:pre-wrap">${q.enunciado}</div>`;

  document.getElementById('quiz-fb').style.display = 'none';
  document.getElementById('btn-proxima').style.display = 'none';

  const div = document.getElementById('quiz-opcoes');
  if (q.tipo === 'multipla_escolha') {
    div.innerHTML = `<div class="quiz-opcoes-grid">${q.opcoes.map(o =>
      `<button class="quiz-opcao" data-letra="${o[0]}" onclick="responder('${o[0]}')">${o}</button>`
    ).join('')}</div>`;
  } else if (q.tipo === 'verdadeiro_falso') {
    div.innerHTML = `<div class="vf-wrap">
      <button class="vf-btn" onclick="responderVF('Verdadeiro')">✓ Verdadeiro</button>
      <button class="vf-btn" onclick="responderVF('Falso')">✗ Falso</button>
    </div>`;
  } else if (q.tipo === 'numerica') {
    div.innerHTML = `<div class="num-wrap">
      <input class="num-input" id="num-resp" type="text" placeholder="Sua resposta…" onkeydown="if(event.key==='Enter')responderNum()"/>
      <button class="btn" onclick="responderNum()">OK</button>
    </div>`;
    setTimeout(() => document.getElementById('num-resp')?.focus(), 80);
  }
}

function travar() {
  document.querySelectorAll('.quiz-opcao,.vf-btn').forEach(b => b.setAttribute('disabled','1'));
  const ni = document.getElementById('num-resp');
  if (ni) ni.disabled = true;
}

function mostrarFeedback(acertou, q) {
  travar();
  const fb = document.getElementById('quiz-fb');
  fb.style.display = 'block';
  if (q.tipo === 'multipla_escolha') {
    document.querySelectorAll('.quiz-opcao').forEach(b => {
      if (b.dataset.letra === q.resposta) b.classList.add('correta');
      else if (!acertou && b.classList.contains('selecionada')) b.classList.add('errada');
      else b.classList.add('neutra');
    });
  } else if (q.tipo === 'verdadeiro_falso') {
    const cor = q.resposta.startsWith('Verdadeiro') ? 'Verdadeiro' : 'Falso';
    document.querySelectorAll('.vf-btn').forEach(b => {
      const val = b.textContent.includes('Verdadeiro') ? 'Verdadeiro' : 'Falso';
      if (val === cor) b.classList.add('correta');
      else if (!acertou) b.classList.add('errada');
    });
  }
  if (acertou) {
    fb.className = 'quiz-fb ok';
    fb.textContent = '✓ Correto!';
  } else {
    const resp = q.resposta.length > 60 ? q.resposta.substring(0, 60) + '…' : q.resposta;
    fb.className = 'quiz-fb err';
    fb.textContent = `✗ Errado. Resposta correta: ${resp}`;
  }
  document.getElementById('btn-proxima').textContent = qIdx === questoes.length - 1 ? 'Concluir ✓' : 'Próxima →';
  document.getElementById('btn-proxima').style.display = 'block';
}

window.responder = (letra) => {
  const q = questoes[qIdx];
  const acertou = letra === q.resposta;
  respostas[q.id] = { acertou, resposta_dada: letra };
  document.querySelectorAll('.quiz-opcao').forEach(b => { if (b.dataset.letra === letra) b.classList.add('selecionada'); });
  mostrarFeedback(acertou, q);
};
window.responderVF = (val) => {
  const q = questoes[qIdx];
  const cor = q.resposta.startsWith('Verdadeiro') ? 'Verdadeiro' : 'Falso';
  const acertou = val === cor;
  respostas[q.id] = { acertou, resposta_dada: val };
  mostrarFeedback(acertou, q);
};
window.responderNum = () => {
  const q = questoes[qIdx];
  const inp = document.getElementById('num-resp');
  if (!inp || !inp.value.trim()) return;
  const dado = inp.value.trim();
  const acertou = dado === q.resposta ||
    (!isNaN(parseFloat(dado)) && !isNaN(parseFloat(q.resposta)) && Math.abs(parseFloat(dado) - parseFloat(q.resposta)) < 1e-9);
  respostas[q.id] = { acertou, resposta_dada: dado };
  inp.style.borderColor = acertou ? 'var(--green)' : 'var(--red)';
  inp.style.background  = acertou ? '#F0FDF4' : '#FEF2F2';
  mostrarFeedback(acertou, q);
};

document.getElementById('btn-proxima').addEventListener('click', async () => {
  qIdx++;
  if (qIdx >= questoes.length) await finalizarAtividade(false);
  else renderQuestao();
});
document.getElementById('btn-voltar').addEventListener('click', () => {
  quizWrap.style.display = 'none';
  listWrap.style.display = 'block';
});

// ── Modal encerrar ────────────────────────────────────────────────────────
window.pedirEncerrar = function() {
  document.getElementById('modal-encerrar').style.display = 'flex';
};
window.fecharEncerrar = function() {
  document.getElementById('modal-encerrar').style.display = 'none';
};
window.confirmarEncerrar = async function() {
  document.getElementById('modal-encerrar').style.display = 'none';
  await finalizarAtividade(true);
};

// ── Finalizar (normal ou parcial) ─────────────────────────────────────────
async function finalizarAtividade(parcial = false) {
  const acertos = Object.values(respostas).filter(r => r.acertou).length;
  const erros   = Object.values(respostas).filter(r => !r.acertou).length;
  const respondidas = Object.keys(respostas).length;

  const tentAntes = getTentativasPorAtiv(atividadeAtual);
  const ultimaAnt = tentAntes.length > 0 ? tentAntes[tentAntes.length - 1] : null;

  let saveError = null;
  let saveOk = false;
  console.log('[Robótica] Salvando tentativa…', { turma, aluno, atividade: atividadeAtual, acertos, total: questoes.length });
  try {
    await saveRoboticaTentativa(turma, aluno, atividadeAtual, {
      acertos, erros, total: questoes.length, respondidas, parcial: parcial || false, respostas
    });
    saveOk = true;
    console.log('[Robótica] Tentativa salva com sucesso no Firebase.');
  } catch(e) {
    saveError = (e?.message || String(e) || 'erro desconhecido');
    console.error('[Robótica] SAVE FALHOU:', e);
    alert('⚠️ Robótica: erro ao salvar!\n\n' + saveError + '\n\nTurma: ' + turma + '\nAluno: ' + aluno + '\n\nVerifique as regras do Firebase Realtime Database.');
  }
  try {
    tentativasDB = await getRoboticaTentativasAluno(turma, aluno);
  } catch(e) {
    console.error('[Robótica] LEITURA FALHOU:', e);
  }

  quizWrap.style.display  = 'none';
  summWrap.style.display  = 'block';
  document.getElementById('quiz-bar').style.width = '100%';

  const totalQ = questoes.length;
  const pct = respondidas > 0 ? Math.round(acertos / totalQ * 100) : 0;
  document.getElementById('summ-emoji').textContent = pct >= 80 ? '🎉' : pct >= 60 ? '👍' : '📚';
  document.getElementById('summ-titulo').textContent = pct >= 80 ? 'Ótimo trabalho!' : pct >= 60 ? 'Bom esforço!' : 'Continue praticando!';
  document.getElementById('summ-acertos').textContent = acertos;
  document.getElementById('summ-erros').textContent = erros;

  if (parcial) {
    const naoresp = totalQ - respondidas;
    document.getElementById('summ-sub').textContent =
      `Atividade ${atividadeAtual} — Encerrado · ${respondidas}/${totalQ} respondidas · ${naoresp} pulada(s)`;
  } else {
    document.getElementById('summ-sub').textContent =
      `Atividade ${atividadeAtual} — ${pct}% de aproveitamento`;
  }

  // Comparação com tentativa anterior
  if (ultimaAnt && ultimaAnt.respostas) {
    const melhorou = [], piorou = [], aindarErrado = [];
    for (const q of questoes) {
      const antes = ultimaAnt.respostas[q.id];
      const agora = respostas[q.id];
      if (!antes || !agora) continue;
      if (!antes.acertou && agora.acertou)        melhorou.push(q);
      else if (antes.acertou && !agora.acertou)   piorou.push(q);
      else if (!antes.acertou && !agora.acertou)  aindarErrado.push(q);
    }
    const diff = acertos - (ultimaAnt.acertos || 0);
    const diffHtml = diff > 0
      ? `<span style="color:var(--green);font-weight:800;">+${diff} ↑ melhora</span>`
      : diff < 0
      ? `<span style="color:var(--red);font-weight:800;">${diff} ↓ regrediu</span>`
      : `<span style="color:var(--text-muted);font-weight:700;">= sem mudança</span>`;

    let compHtml = `<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;">
      <div style="font-size:13px;font-weight:700;margin-bottom:10px;">Comparação com tentativa anterior: ${diffHtml}</div>`;
    if (melhorou.length) {
      compHtml += `<div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:4px;">✓ Agora acertou (${melhorou.length}):</div>`;
      compHtml += melhorou.map(q => `<div class="comp-q melhora">✗→✓ <span style="font-weight:600;">[${q.id}]</span> <span>${q.enunciado.replace(/\n/g,' ').substring(0, 60)}${q.enunciado.length > 60 ? '…' : ''}</span></div>`).join('');
    }
    if (piorou.length) {
      compHtml += `<div style="font-size:12px;font-weight:700;color:var(--red);margin-top:8px;margin-bottom:4px;">✗ Passou a errar (${piorou.length}):</div>`;
      compHtml += piorou.map(q => `<div class="comp-q piora">✓→✗ <span style="font-weight:600;">[${q.id}]</span> <span>${q.enunciado.replace(/\n/g,' ').substring(0, 60)}${q.enunciado.length > 60 ? '…' : ''}</span></div>`).join('');
    }
    if (aindarErrado.length) {
      compHtml += `<div style="font-size:12px;font-weight:700;color:#F59E0B;margin-top:8px;margin-bottom:4px;">Ainda errado (${aindarErrado.length}):</div>`;
      compHtml += aindarErrado.slice(0, 5).map(q => `<div class="comp-q manteve-err">✗✗ <span style="font-weight:600;">[${q.id}]</span> <span>${q.enunciado.replace(/\n/g,' ').substring(0, 60)}${q.enunciado.length > 60 ? '…' : ''}</span></div>`).join('');
      if (aindarErrado.length > 5) compHtml += `<div style="font-size:11px;color:var(--text-muted);padding:4px 12px;">+ ${aindarErrado.length - 5} outras</div>`;
    }
    compHtml += '</div>';
    document.getElementById('summ-comparacao').innerHTML = compHtml;
  } else {
    document.getElementById('summ-comparacao').innerHTML = '';
  }

  // Análise completa por questão
  document.getElementById('summ-analise').innerHTML = `<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;">
    <div style="font-size:13px;font-weight:700;margin-bottom:10px;">📋 Análise por questão</div>
    ${questoes.map((q, i) => {
      const resp = respostas[q.id];
      if (!resp) {
        // Não respondida (encerramento parcial)
        return `<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;border:1px dashed var(--border);background:var(--bg);margin-bottom:6px;opacity:.7;">
          <span style="font-size:10px;font-weight:700;color:var(--text-muted);width:24px;flex-shrink:0;padding-top:2px;">Q${i+1}</span>
          <div style="flex:1;min-width:0;">
            ${q.categoria ? `<div style="font-size:10px;font-weight:700;color:var(--text-muted);margin-bottom:2px;">${q.categoria}</div>` : ''}
            <div style="font-size:12px;white-space:pre-wrap;margin-bottom:4px;">${q.enunciado}</div>
            <div style="font-size:11px;color:var(--text-muted);">Não respondida · ✓ Correta: ${q.resposta}</div>
          </div>
          <span style="font-size:16px;flex-shrink:0;">—</span>
        </div>`;
      }
      const ac = resp.acertou;
      const rdada = resp.resposta_dada ?? '—';
      return `<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid ${ac ? '#BBF7D0' : '#FECACA'};background:${ac ? '#F0FDF4' : '#FEF2F2'};margin-bottom:6px;">
        <span style="font-size:10px;font-weight:700;color:var(--text-muted);width:24px;flex-shrink:0;padding-top:2px;">Q${i+1}</span>
        <div style="flex:1;min-width:0;">
          ${q.categoria ? `<div style="font-size:10px;font-weight:700;color:var(--text-muted);margin-bottom:2px;">${q.categoria}</div>` : ''}
          <div style="font-size:12px;white-space:pre-wrap;margin-bottom:4px;">${q.enunciado}</div>
          <div style="font-size:11px;">
            <span style="font-weight:600;color:${ac ? 'var(--green)' : 'var(--red)'};">Sua resposta: ${rdada}</span>
            ${!ac ? `<span style="color:var(--text-muted);margin-left:10px;">✓ Correta: ${q.resposta}</span>` : ''}
          </div>
        </div>
        <span style="font-size:16px;flex-shrink:0;">${ac ? '✅' : '❌'}</span>
      </div>`;
    }).join('')}
  </div>`;

  const saveStatusHtml = saveError
    ? `<div style="background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:12px;margin:10px 0;font-size:13px;color:#B91C1C;font-weight:600;">
        ⚠️ Erro ao salvar resultado! O professor não verá esta tentativa.<br>
        <span style="font-weight:400;font-size:12px;">${saveError}</span>
       </div>`
    : saveOk
    ? `<div style="background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:12px;color:#15803D;font-weight:600;">
        ✅ Resultado salvo com sucesso!
       </div>`
    : '';
  if (saveStatusHtml) {
    document.getElementById('summ-analise').insertAdjacentHTML('afterend', saveStatusHtml);
  }
}

document.getElementById('btn-refazer').addEventListener('click', () => {
  summWrap.style.display = 'none';
  iniciarAtividade(atividadeAtual);
});
document.getElementById('btn-voltar-lista').addEventListener('click', () => {
  summWrap.style.display = 'none';
  listWrap.style.display = 'block';
  renderLista();
});

await carregarQuestoesMap();
await carregarLista();
</script>
</body>
</html>
