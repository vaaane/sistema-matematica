<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#15102a">
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notas — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .bim-select{padding:7px 12px;background:var(--card);border:1.5px solid var(--border);border-radius:9px;color:var(--text);font-weight:600;font-family:inherit;cursor:pointer;font-size:12.5px}

    .grid-boletim{display:grid;grid-template-columns:1fr 300px;grid-template-areas:"main total";gap:18px;align-items:start;margin-bottom:22px}
    .gb-main{grid-area:main;min-width:0}
    .gb-total{grid-area:total;min-width:0}
    @media(max-width:760px){.grid-boletim{grid-template-columns:1fr;grid-template-areas:"total" "main"}}

    .item-row{padding:10px 0;border-bottom:1px solid var(--border)}
    .item-row:last-child{border-bottom:none}
    .item-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;gap:8px}
    .item-label{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
    .item-auto-tag{font-size:9px;font-weight:700;color:var(--purple);background:var(--purple-pale);border-radius:10px;padding:1px 6px;white-space:nowrap}
    .item-val{font-size:13px;font-weight:800;color:var(--text);white-space:nowrap}
    .item-val .max{font-weight:500;color:var(--text-muted)}
    .bar-bg{height:7px;border-radius:5px;background:var(--bg);overflow:hidden}
    .bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--purple-dark),var(--purple))}

    .subtotal-row{display:flex;align-items:center;justify-content:space-between;padding-top:12px;margin-top:4px;border-top:1.5px dashed var(--border)}
    .subtotal-row .lbl{font-size:12px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
    .subtotal-row .val{font-size:16px;font-weight:800}
    .cap-note{font-size:11px;color:var(--orange);margin-top:6px;display:flex;align-items:center;gap:5px}

    .extra-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
    .extra-item:last-child{border-bottom:none}
    .extra-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
    .extra-dot.on{background:var(--green-pale);color:#15803D}
    .extra-dot.off{background:var(--bg);color:var(--text-muted)}
    .extra-lbl{flex:1;font-size:12.5px;font-weight:600}
    .extra-lbl.off{color:var(--text-muted);font-weight:500}
    .extra-pts{font-size:12px;font-weight:800;color:var(--green)}
    .extra-pts.off{color:var(--text-muted);font-weight:600}

    .total-card{background:linear-gradient(135deg,#1a1040,#15102a);border:2px solid rgba(250,184,0,.35);border-radius:18px;padding:24px 20px;text-align:center;position:relative;overflow:hidden}
    .total-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top,rgba(250,184,0,.1) 0%,transparent 60%);pointer-events:none}
    .total-eyebrow{font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:rgba(250,184,0,.7);margin-bottom:6px}
    .total-num{font-family:'Playfair Display',serif;font-size:46px;font-weight:800;color:var(--gold);line-height:1;text-shadow:0 0 20px rgba(250,184,0,.35)}
    .total-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:4px}
    .total-msg{margin-top:14px;font-size:12.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.06);border-radius:10px;padding:9px 12px;line-height:1.45}

    .bonus-total-row{display:flex;align-items:center;justify-content:space-between;padding-top:10px;margin-top:6px;border-top:1.5px dashed var(--border)}
    .bonus-total-row .lbl{font-size:12px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
    .bonus-total-row .val{font-size:15px;font-weight:800;color:var(--green)}

    .aluno-label{font-size:12px;font-weight:700;color:var(--text-muted);margin:0 0 8px;display:flex;align-items:center;gap:6px}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Notas</div>
        <div class="topbar-sub">Seu boletim — acompanhe como está cada atividade</div>
      </div>
      <div class="topbar-right">
        <select class="bim-select" id="bimSel">
          <option value="2">2º Bimestre</option>
          <option value="1" disabled>1º Bimestre (em breve)</option>
        </select>
      </div>
    </div>
    <div class="content" id="content">
      <div class="empty-state"><p>Carregando…</p></div>
    </div>
  </div>
</div>

<script type="module">
import { requireAluno, renderSidebarAluno, clearSession, getSession } from "/js/auth.js";
import { CAMPOS_NOTA, EXTRAS_AUTO, EXTRAS_MANUAL, CADERNO_EXTRA, EXTRA_RANK_ATIV4, montarBoletim, fmtNota, mensagemPorNota } from "/js/notas.js";

requireAluno();
renderSidebarAluno("sidebar", "notas");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const sess = getSession();
const turma  = sess?.turma || "";
const alunos = sess?.alunos || [];

function barraHtml(boletim) {
  return CAMPOS_NOTA.map(c => {
    const v = parseFloat(boletim.registro[c.key]) || 0;
    const pct = c.max > 0 ? Math.min(100, Math.round(v / c.max * 100)) : 0;
    const autoTag = c.key === "triangulos" ? `<span class="item-auto-tag">🔄 Atividade 5 fase 1</span>`
                  : c.key === "ativ4"      ? `<span class="item-auto-tag">🔄 Atividade 4</span>`
                  : "";
    return `
      <div class="item-row">
        <div class="item-head">
          <span class="item-label">${c.label} ${autoTag}</span>
          <span class="item-val">${fmtNota(v)}<span class="max"> / ${c.max}</span></span>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>`;
  }).join("");
}

function extrasHtml(boletim) {
  const autoRows = EXTRAS_AUTO.map(e => {
    const on = boletim.auto[e.key];
    return `
      <div class="extra-item">
        <span class="extra-dot ${on ? "on" : "off"}">${on ? "✓" : "·"}</span>
        <span class="extra-lbl${on ? "" : " off"}">${e.label}</span>
        <span class="extra-pts${on ? "" : " off"}">+${fmtNota(e.valor)}</span>
      </div>`;
  }).join("");
  const cadRow = (() => {
    const on = boletim.cadExtraAtivo;
    return `
      <div class="extra-item">
        <span class="extra-dot ${on ? "on" : "off"}">${on ? "✓" : "·"}</span>
        <span class="extra-lbl${on ? "" : " off"}">${CADERNO_EXTRA.label}</span>
        <span class="extra-pts${on ? "" : " off"}">+${fmtNota(CADERNO_EXTRA.valor)}</span>
      </div>`;
  })();
  const manualRows = EXTRAS_MANUAL.map(e => {
    const on = !!boletim.registro.extras?.[e.key];
    return `
      <div class="extra-item">
        <span class="extra-dot ${on ? "on" : "off"}">${on ? "✓" : "·"}</span>
        <span class="extra-lbl${on ? "" : " off"}">${e.label}</span>
        <span class="extra-pts${on ? "" : " off"}">+${fmtNota(e.valor)}</span>
      </div>`;
  }).join("");
  const ativ4Row = (() => {
    const pos = boletim.ativ4Info?.posicao ?? 0;
    const bonus = boletim.ativ4Info?.bonusRank ?? 0;
    const on = bonus > 0;
    const descPos = pos > 0 ? `${pos}º lugar` : "sem bônus de ranking";
    return `
      <div class="extra-item">
        <span class="extra-dot ${on ? "on" : "off"}">${on ? "✓" : "·"}</span>
        <span class="extra-lbl${on ? "" : " off"}">${EXTRA_RANK_ATIV4.label}<br><small style="font-weight:400;color:var(--text-muted)">${descPos}</small></span>
        <span class="extra-pts${on ? "" : " off"}">${on ? `+${fmtNota(bonus)}` : "—"}</span>
      </div>`;
  })();
  return autoRows + cadRow + ativ4Row + manualRows;
}

function boletimHtml(nome, boletim) {
  const mostrarNomeLabel = alunos.length > 1
    ? `<div class="aluno-label"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>${nome}</div>`
    : "";
  const capNote = boletim.subtotal > 10
    ? `<div class="cap-note">⚠️ passou do máximo — a nota das atividades trava em <b>10</b> (os bônus abaixo somam por fora)</div>`
    : "";

  return `
    ${mostrarNomeLabel}
    <div class="grid-boletim">
      <div class="gb-main">
        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            Atividades do bimestre
          </div>
          ${barraHtml(boletim)}
          <div class="subtotal-row">
            <span class="lbl">Subtotal</span>
            <span class="val">${fmtNota(boletim.subtotal)} / 10</span>
          </div>
          ${capNote}
        </div>

        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm6 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1z"/></svg>
            Pontos extras conquistados
          </div>
          ${extrasHtml(boletim)}
          <div class="bonus-total-row">
            <span class="lbl">Bônus total</span>
            <span class="val">+${fmtNota(boletim.bonus)}</span>
          </div>
        </div>
      </div>

      <div class="gb-total">
        <div class="total-card">
          <div class="total-eyebrow">${document.getElementById("bimSel").selectedOptions[0].textContent}</div>
          <div class="total-num">${fmtNota(boletim.total)}</div>
          <div class="total-sub">${fmtNota(boletim.subtotalCapado)} das atividades + ${fmtNota(boletim.bonus)} de bônus</div>
          <div class="total-msg">${mensagemPorNota(boletim.total)}</div>
        </div>
      </div>
    </div>`;
}

function vazioHtml() {
  return `
    <div class="empty-state">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      <p>Suas notas deste bimestre ainda não foram disponibilizadas pelo professor.<br>Volte aqui mais perto do fim do bimestre.</p>
    </div>`;
}

async function carregar() {
  const content = document.getElementById("content");
  if (!turma || !alunos.length) { content.innerHTML = vazioHtml(); return; }

  const boletins = await Promise.all(alunos.map(nome => montarBoletim(turma, nome)));
  const blocos = alunos.map((nome, i) => boletins[i] ? boletimHtml(nome, boletins[i]) : `${alunos.length>1 ? `<div class="aluno-label">${nome}</div>` : ""}${vazioHtml()}`);

  if (boletins.every(b => !b)) { content.innerHTML = vazioHtml(); return; }
  content.innerHTML = blocos.join("<div style='height:8px'></div>");
}

carregar();
</script>
</body>
</html>
