<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#15102a">
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notas — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    /* card base */
    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px;border:1px solid var(--border)}
    .card:last-child{margin-bottom:0}
    .card-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--text)}
    .card-title svg{width:15px;height:15px;fill:currentColor}

    /* bimestre select */
    .bim-select{padding:7px 12px;background:var(--card);border:1.5px solid var(--border);border-radius:9px;color:var(--text);font-weight:600;font-family:inherit;cursor:pointer;font-size:12.5px}

    /* topbar mobile: select fica abaixo, título não quebra */
    .topbar-left{min-width:0;flex:1}
    .topbar-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .topbar-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media(max-width:600px){
      .topbar{flex-wrap:wrap;gap:6px}
      .topbar-right{width:100%;order:2}
      .bim-select{width:100%}
      .topbar-sub{display:none}
    }

    /* aviso de em andamento */
    .andamento-aviso{display:flex;align-items:center;gap:10px;background:rgba(240,165,0,.08);border:1.5px solid rgba(240,165,0,.3);border-radius:12px;padding:11px 16px;margin-bottom:16px;font-size:12.5px;color:rgba(255,255,255,.8);font-weight:600}
    .andamento-aviso svg{width:16px;height:16px;fill:var(--gold);flex-shrink:0}

    /* ── ESTADO 2: Em andamento ── */
    .summary-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
    .sum-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:flex;flex-direction:column;gap:4px}
    .sum-icon{font-size:22px;flex-shrink:0}
    .sum-label{font-size:10.5px;font-weight:600;color:var(--text-muted);margin-bottom:3px}
    .sum-val{font-size:22px;font-weight:800;line-height:1}
    .sum-sub{font-size:10px;color:var(--text-muted);margin-top:3px}

    .potencial-banner{background:linear-gradient(135deg,#1c1040,#15102a);border:1.5px solid rgba(240,165,0,.4);border-radius:var(--radius);padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden}
    .potencial-banner::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at left,rgba(240,165,0,.08) 0%,transparent 60%);pointer-events:none}
    .potencial-banner.zero{border-color:rgba(34,197,94,.35);background:linear-gradient(135deg,#0c1f14,#11111f)}
    .potencial-banner.zero::before{background:radial-gradient(ellipse at left,rgba(34,197,94,.07) 0%,transparent 60%)}
    .pot-icon{font-size:24px;flex-shrink:0}
    .pot-body{flex:1;min-width:0}
    .pot-titulo{font-size:13.5px;font-weight:800;color:var(--gold);margin-bottom:3px}
    .pot-titulo.green{color:var(--green)}
    .pot-desc{font-size:11.5px;color:rgba(255,255,255,.65);line-height:1.45}
    .pot-desc b{color:#fff}
    .pot-pts{font-size:28px;font-weight:800;color:var(--gold);flex-shrink:0;text-shadow:0 0 16px rgba(240,165,0,.4)}
    .pot-pts.green{color:var(--green);text-shadow:0 0 16px rgba(34,197,94,.3)}
    .pot-arrow{font-size:16px;color:rgba(240,165,0,.6);flex-shrink:0}

    .sec-label{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--text-muted);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
    .sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

    .prog-list{display:flex;flex-direction:column;gap:8px}
    .prog-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:14px}
    .prog-row.done{border-color:rgba(34,197,94,.2)}
    .prog-row.partial{border-color:rgba(240,165,0,.2)}
    .prog-row.locked{opacity:.6}
    .prog-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
    .prog-icon.green{background:var(--green-pale)}
    .prog-icon.orange{background:var(--orange-pale)}
    .prog-icon.purple{background:var(--purple-pale)}
    .prog-icon.gold{background:var(--gold-pale)}
    .prog-icon.grey{background:rgba(255,255,255,.05)}
    .prog-body{flex:1;min-width:0}
    .prog-title{font-size:13px;font-weight:700;margin-bottom:1px}
    .prog-desc{font-size:11px;color:var(--text-muted);line-height:1.4}
    .prog-desc b{color:var(--text)}
    .pbar-wrap{margin-top:7px;display:flex;align-items:center;gap:8px}
    .pbar-bg{flex:1;height:6px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}
    .pbar-fill{height:100%;border-radius:5px}
    .pbar-fill.green{background:linear-gradient(90deg,#16a34a,#22C55E)}
    .pbar-fill.orange{background:linear-gradient(90deg,#c98900,#f0a500)}
    .pbar-fill.purple{background:linear-gradient(90deg,var(--purple-dark),var(--purple))}
    .pbar-label{font-size:10.5px;font-weight:700;white-space:nowrap;color:var(--text-muted)}
    .prog-right{text-align:right;flex-shrink:0;min-width:60px}
    .pts{font-size:16px;font-weight:800}
    .pts.green{color:#15803D}
    .pts.gold{color:var(--gold)}
    .pts.muted{color:var(--text-muted);font-size:13px;font-weight:600}
    .pts-sub{font-size:10px;color:var(--text-muted);margin-top:1px}
    .badge-lock{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-size:10.5px;font-weight:600;color:var(--text-muted)}

    /* ── ESTADO 3: Meu Rendimento ── */
    .rendimento-header{background:linear-gradient(135deg,#1a1040,#15102a);border:2px solid rgba(250,184,0,.35);border-radius:18px;padding:22px 28px;margin-bottom:18px;position:relative;overflow:hidden;display:flex;align-items:center;gap:28px}
    .rendimento-header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top left,rgba(250,184,0,.12) 0%,transparent 55%);pointer-events:none}
    .rend-num{font-family:'Playfair Display',serif;font-size:60px;font-weight:800;color:var(--gold);line-height:1;flex-shrink:0;text-shadow:0 0 28px rgba(250,184,0,.4)}
    .rend-info{flex:1;min-width:0}
    .rend-eyebrow{font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:rgba(250,184,0,.7);margin-bottom:4px}
    .rend-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:4px}
    .rend-msg{margin-top:10px;font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.07);border-radius:10px;padding:8px 12px;line-height:1.45;display:inline-block}

    .item-row{padding:10px 0;border-bottom:1px solid var(--border)}
    .item-row:last-child{border-bottom:none}
    .item-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;gap:8px}
    .item-label{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
    .item-auto-tag{font-size:9px;font-weight:700;color:var(--purple);background:var(--purple-pale);border-radius:10px;padding:1px 6px;white-space:nowrap}
    .item-val{font-size:13px;font-weight:800;color:var(--text);white-space:nowrap}
    .item-val .max{font-weight:500;color:var(--text-muted)}
    .bar-bg{height:7px;border-radius:5px;background:var(--bg);overflow:hidden}
    .bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--purple-dark),var(--purple))}

    .subtotal-row{display:flex;align-items:center;justify-content:space-between;padding-top:12px;margin-top:4px;border-top:1.5px dashed var(--border)}
    .subtotal-row .lbl{font-size:12px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
    .subtotal-row .val{font-size:16px;font-weight:800}
    .cap-note{font-size:11px;color:var(--orange);margin-top:6px;display:flex;align-items:center;gap:5px}

    .extra-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
    .extra-item:last-child{border-bottom:none}
    .extra-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
    .extra-dot.on{background:var(--green-pale);color:#15803D}
    .extra-dot.off{background:var(--bg);color:var(--text-muted)}
    .extra-lbl{flex:1;font-size:12.5px;font-weight:600}
    .extra-lbl.off{color:var(--text-muted);font-weight:500}
    .extra-pts{font-size:12px;font-weight:800;color:var(--green)}
    .extra-pts.off{color:var(--text-muted);font-weight:600}
    .bonus-total-row{display:flex;align-items:center;justify-content:space-between;padding-top:10px;margin-top:6px;border-top:1.5px dashed var(--border)}
    .bonus-total-row .lbl{font-size:12px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
    .bonus-total-row .val{font-size:15px;font-weight:800;color:var(--green)}

    @media(max-width:600px){.summary-bar{grid-template-columns:1fr}.rendimento-header{flex-direction:column;text-align:center}.rend-num{font-size:52px}}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title" id="page-title">Notas</div>
        <div class="topbar-sub" id="page-sub">Acompanhe seu desempenho no bimestre</div>
      </div>
      <div class="topbar-right">
        <select class="bim-select" id="bimSel">
          <option value="2">2º Bimestre</option>
          <option value="1" disabled>1º Bimestre (em breve)</option>
        </select>
      </div>
    </div>
    <div class="content" id="content">
      <div class="empty-state"><p>Carregando…</p></div>
    </div>
  </div>
</div>

<script type="module">
import { requireAluno, renderSidebarAluno, clearSession, getSession } from "/js/auth.js";
import {
  CAMPOS_NOTA, EXTRAS_AUTO, EXTRAS_MANUAL, CADERNO_EXTRA, EXTRA_RANK_ATIV4, EXTRA_NIVEL_PERFIL,
  BIMESTRE, setBimestre, camposAtivos, bonusAtivo, fmtNota, mensagemPorNota, montarBoletim, notasLiberadas,
} from "/js/notas.js";
import { BIMESTRES, bimestreAtual } from "/js/constants.js";

requireAluno();
renderSidebarAluno("sidebar", "notas");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const sess  = getSession();
const turma = sess?.turma || "";
const nome  = sess?.alunos?.[0] || "";
const fmt   = fmtNota;

// ── detecta se todas as notas manuais foram lançadas ──────────
function todasLancadas(boletim) {
  // considera "encerrado" quando os campos MANUAIS ativos do bimestre foram lançados
  const chaves = camposAtivos().filter(c => !c.auto && c.key !== "participacao").map(c => c.key);
  return chaves.every(k => {
    const v = boletim.registro[k];
    return v !== null && v !== undefined && v !== "";
  });
}

// ── ESTADO 2: Em Andamento ────────────────────────────────────
function renderAndamento(boletim) {
  const bonusOn = bonusAtivo();
  const campos  = camposAtivos();
  document.getElementById("page-title").textContent = "Notas";
  document.getElementById("page-sub").textContent   = `Em andamento — ${BIMESTRE}º Bimestre`;

  const { registro, lancados, progresso, auto, ativ4Info, ativ5Pts } = boletim;

  // números vêm do montarBoletim (respeitam campos do bimestre e congelamento)
  const base  = boletim.subtotalCapado;
  const bonus = boletim.bonus;
  const total = boletim.total;

  const temCaderno = campos.some(c => c.key === "caderno");
  const cadExtra   = temCaderno && lancados.caderno && (parseFloat(registro.caderno)||0) > CADERNO_EXTRA.limiar;
  const nivelPerf  = boletim.nivelPerfil || 1;

  // pontos já lançados (informativo)
  let maxLancado = 0;
  campos.forEach(c => {
    if (c.key === "ativ4")           maxLancado += 0.5;
    else if (c.key === "triangulos") maxLancado += (ativ5Pts != null ? 1 : 0);
    else if (c.key === "participacao") maxLancado += 0.5;
    else if (lancados[c.key])        maxLancado += c.max;
  });
  maxLancado = Math.min(maxLancado, 10);

  function rowAtiv(a) {
    if (a.key === "ativ4") {
      const fez = ativ4Info.fez;
      return `<div class="prog-row ${fez?"done":"locked"}">
        <div class="prog-icon ${fez?"green":"grey"}">${fez?"✅":"✗"}</div>
        <div class="prog-body"><div class="prog-title">${a.label}</div>
          <div class="prog-desc">${fez?`Você participou${ativ4Info.posicao>0?` · ${ativ4Info.posicao}º lugar no geral`:""}` : "Você não participou — nota 0,0"}</div></div>
        <div class="prog-right"><div class="pts ${fez?"green":"muted"}">${fez?fmt(0.5):"0,0"}</div><div class="pts-sub">de 0,5</div></div>
      </div>`;
    }
    if (a.key === "triangulos") {
      const v = ativ5Pts != null ? Math.min(1, ativ5Pts/10) : null;
      return `<div class="prog-row ${v!=null?"done":"locked"}">
        <div class="prog-icon ${v!=null?"green":"grey"}">${v!=null?"✅":"✗"}</div>
        <div class="prog-body"><div class="prog-title">${a.label}</div>
          <div class="prog-desc">${v!=null?"Sua melhor nota na fase 1":"Você não jogou — nota 0,0"}</div></div>
        <div class="prog-right"><div class="pts ${v!=null?"green":"muted"}">${v!=null?fmt(v):"0,0"}</div><div class="pts-sub">de 1,0</div></div>
      </div>`;
    }
    const foiLancado = lancados[a.key];
    const v = foiLancado ? (parseFloat(registro[a.key])||0) : null;
    if (foiLancado) {
      const cadExtraTag = a.key==="caderno"&&cadExtra ? ` · Caderno Extra 🎉` : "";
      return `<div class="prog-row done">
        <div class="prog-icon green">✅</div>
        <div class="prog-body"><div class="prog-title">${a.label}</div>
          <div class="prog-desc">Nota lançada${cadExtraTag}</div></div>
        <div class="prog-right"><div class="pts green">${fmt(v)}${a.key==="caderno"&&cadExtra?`<span style="font-size:10px"> +0,5</span>`:""}</div><div class="pts-sub">de ${fmt(a.max)}</div></div>
      </div>`;
    }
    return `<div class="prog-row locked">
      <div class="prog-icon grey">🔒</div>
      <div class="prog-body"><div class="prog-title">${a.label}</div>
        <div class="prog-desc">Aguardando lançamento pela professora</div></div>
      <div class="prog-right"><div class="badge-lock">até ${fmt(a.max)} pts</div></div>
    </div>`;
  }

  // ── blocos de bônus só quando o bimestre tem bônus ativo ──
  let summaryBonusCard = "", extrasSecoes = "";
  if (bonusOn) {
    function rowTabuada(ex) {
      const on  = auto[ex.key];
      const atual = ex.campo==="melhorTabuada" ? progresso.melhorTabuada : progresso.melhorNeg;
      const pct = Math.min(100, Math.round(atual/ex.max*100));
      const cor = on ? "green" : ex.campo==="melhorTabuada" ? "orange" : "purple";
      return `<div class="prog-row ${on?"done":"partial"}">
        <div class="prog-icon ${cor}">${on?"⚡":"🎯"}</div>
        <div class="prog-body"><div class="prog-title">${ex.label}</div>
          <div class="prog-desc">${on?`Meta batida! Nível ${atual}`:`Faltam <b>${ex.max-atual} níveis</b> — continue jogando!`}</div>
          <div class="pbar-wrap"><div class="pbar-bg"><div class="pbar-fill ${cor}" style="width:${pct}%"></div></div>
          <span class="pbar-label" style="${on?"color:var(--green)":""}">${atual}/${ex.max}${on?" ✓":""}</span></div>
        </div>
        <div class="prog-right"><div class="pts ${on?"green":"muted"}">+${fmt(ex.valor)}</div><div class="pts-sub">${on?"conquistado":"disponível"}</div></div>
      </div>`;
    }
    const nivelPerfilRow = `<div class="prog-row done">
      <div class="prog-icon purple">⭐</div>
      <div class="prog-body"><div class="prog-title">${EXTRA_NIVEL_PERFIL.label}</div>
        <div class="prog-desc">Nível ${nivelPerf} × 0,1</div></div>
      <div class="prog-right"><div class="pts" style="color:var(--purple)">+${fmtNota(Math.round(nivelPerf*0.1*10)/10)}</div><div class="pts-sub">conquistado</div></div>
    </div>`;
    const rankRow = (!ativ4Info.fez || (ativ4Info.bonusRank||0)===0) ? "" : `<div class="prog-row done">
      <div class="prog-icon gold">🏆</div>
      <div class="prog-body"><div class="prog-title">Atividade 4 — Ranking</div>
        <div class="prog-desc"><b style="color:var(--gold)">${ativ4Info.posicao||0}º lugar</b> no geral</div></div>
      <div class="prog-right"><div class="pts gold">+${fmt(ativ4Info.bonusRank||0)}</div><div class="pts-sub">bônus ranking</div></div>
    </div>`;
    const cadExtraRow = !temCaderno ? "" : (!lancados.caderno ? `<div class="prog-row locked">
      <div class="prog-icon grey">📒</div>
      <div class="prog-body"><div class="prog-title">Caderno Extra</div>
        <div class="prog-desc">Calculado quando a professora lançar o caderno (precisa &gt; 1,8)</div></div>
      <div class="prog-right"><div class="pts muted">+0,5</div><div class="pts-sub">possível</div></div>
    </div>` : `<div class="prog-row ${cadExtra?"done":"locked"}">
      <div class="prog-icon ${cadExtra?"green":"grey"}">📒</div>
      <div class="prog-body"><div class="prog-title">Caderno Extra</div>
        <div class="prog-desc">${cadExtra?"Conquistado! Caderno acima de 1,8":`Caderno: ${fmt(parseFloat(registro.caderno)||0)} (precisa > 1,8)`}</div></div>
      <div class="prog-right"><div class="pts ${cadExtra?"green":"muted"}">+0,5</div><div class="pts-sub">${cadExtra?"conquistado":"não atingido"}</div></div>
    </div>`);

    let potencial = 0;
    if (!auto.t300)    potencial += 0.5;
    if (!auto.tneg50)  potencial += 0.5;
    if (!auto.tneg150) potencial += 0.5;
    const banner = potencial > 0
      ? `<div class="potencial-banner"><div class="pot-icon">🚀</div>
          <div class="pot-body"><div class="pot-titulo">Você ainda pode ganhar mais pontos!</div>
          <div class="pot-desc">${[
            !auto.t300    ? `<b>Tabuada nv.300</b> (+0,5): ${progresso.melhorTabuada}/300` : "",
            !auto.tneg50  ? `<b>Tab. Negativa nv.50</b> (+0,5): ${progresso.melhorNeg}/50` : "",
            !auto.tneg150 ? `<b>Tab. Negativa nv.150</b> (+0,5): ${progresso.melhorNeg}/150` : "",
          ].filter(Boolean).join(" · ")}</div></div>
          <div class="pot-pts">+${fmt(potencial)}</div></div>`
      : `<div class="potencial-banner zero"><div class="pot-icon">🎉</div>
          <div class="pot-body"><div class="pot-titulo green">Você conquistou todos os bônus disponíveis!</div>
          <div class="pot-desc">Incrível — tabuada e negativa: tudo certo.</div></div>
          <div class="pot-pts green">100%</div></div>`;

    summaryBonusCard = `<div class="sum-card">
        <div class="sum-label">🎁 Bônus extras</div>
        <div class="sum-val" style="color:var(--purple)">+${fmt(bonus)}</div>
        <div style="font-size:10.5px;color:var(--text-muted)">${potencial>0?`+${fmt(potencial)} ainda alcançáveis`:"todos conquistados ✓"}</div>
      </div>`;
    extrasSecoes = `${banner}
    <div class="sec-label">⚡ Extras — tabuada e ranking</div>
    <div class="prog-list">${EXTRAS_AUTO.map(rowTabuada).join("")}${nivelPerfilRow}${rankRow}</div>
    <div class="sec-label">🎁 Extras — caderno</div>
    <div class="prog-list">${cadExtraRow}</div>`;
  }

  return `
    <div class="andamento-aviso">
      <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
      Notas em andamento — esta <b style="color:var(--gold)">não é a nota final</b>, algumas atividades ainda não foram lançadas
    </div>
    <div class="summary-bar">
      <div class="sum-card">
        <div class="sum-label">📋 Das atividades</div>
        <div class="sum-val" style="color:var(--text)">${fmt(base)}<span style="font-size:13px;font-weight:600;color:var(--text-muted)"> / 10</span></div>
        <div style="font-size:10.5px;color:var(--text-muted)">${fmt(maxLancado)} pts já lançados</div>
      </div>
      ${summaryBonusCard}
      <div class="sum-card" style="background:linear-gradient(135deg,#1a1040,#15102a);border-color:rgba(108,0,212,.35)">
        <div class="sum-label" style="color:rgba(200,170,255,.7)">= Nota atual</div>
        <div style="font-size:32px;font-weight:800;color:var(--purple);line-height:1">${fmt(total)}</div>
        <div style="font-size:10.5px;color:rgba(200,170,255,.5)">${bonusOn?`${fmt(base)} + ${fmt(bonus)} bônus`:"só atividades"}</div>
      </div>
    </div>
    <div class="sec-label">📋 Atividades avaliadas</div>
    <div class="prog-list">${campos.map(rowAtiv).join("")}</div>
    ${extrasSecoes}`;
}

// ── ESTADO 3: Meu Rendimento ──────────────────────────────────
function renderRendimento(boletim) {
  const bonusOn = bonusAtivo();
  document.getElementById("page-title").textContent = "Meu Rendimento";
  document.getElementById("page-sub").textContent   = `${BIMESTRE}º Bimestre — notas encerradas`;

  const { registro, progresso, auto, subtotal, subtotalCapado, bonus, total, ativ4Info } = boletim;
  const cadExtra = (parseFloat(registro.caderno)||0) > CADERNO_EXTRA.limiar;
  const capNote  = subtotal > 10
    ? `<div class="cap-note">⚠️ Soma das atividades chegou a ${fmtNota(subtotal)} — trava em 10 antes dos bônus</div>` : "";

  function barraItem(c) {
    const raw = registro[c.key];
    const isAuto = c.key==="ativ4" || c.key==="triangulos";
    const naoParticipou = isAuto && (raw===null||raw===undefined);
    const v   = naoParticipou ? 0 : (parseFloat(raw)||0);
    const pct = naoParticipou ? 0 : Math.min(100, Math.round(v/c.max*100));
    const tag = c.key==="triangulos" ? `<span class="item-auto-tag">🔄 Ativ.5 fase1</span>`
              : c.key==="ativ4"      ? `<span class="item-auto-tag">🔄 Ativ.4</span>` : "";
    let valHtml;
    if (naoParticipou) valHtml = `<span style="font-size:11px;font-weight:600;color:var(--text-muted)">não participou — 0,0</span>`;
    else valHtml = `${fmtNota(v)}<span class="max"> / ${c.max}</span>`;
    const cadExtraTag = c.key==="caderno" && cadExtra ? ` <span style="font-size:10px;color:var(--green)">+0,5</span>` : "";
    return `<div class="item-row">
      <div class="item-head">
        <span class="item-label">${c.label} ${tag}</span>
        <span class="item-val">${valHtml}${cadExtraTag}</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%${naoParticipou?";opacity:.2":""}"></div></div>
    </div>`;
  }

  function extraItem(label, on, valor, sub) {
    return `<div class="extra-item">
      <span class="extra-dot ${on?"on":"off"}">${on?"✓":"·"}</span>
      <span class="extra-lbl${on?"":" off"}">${label}${sub?`<br><small style="font-weight:400;color:var(--text-muted)">${sub}</small>`:""}</span>
      <span class="extra-pts${on?"":" off"}">+${fmtNota(valor)}</span>
    </div>`;
  }

  const extras = [
    ...EXTRAS_AUTO.map(e => extraItem(e.label, !!auto[e.key], e.valor)),
    ...(ativ4Info.bonusRank>0 ? [extraItem(EXTRA_RANK_ATIV4.label, true, ativ4Info.bonusRank, `${ativ4Info.posicao}º lugar no geral`)] : []),
    extraItem(CADERNO_EXTRA.label, cadExtra, CADERNO_EXTRA.valor),
    extraItem(EXTRA_NIVEL_PERFIL.label, true, Math.round(((boletim.nivelPerfil||1) * 0.1) * 10) / 10, `Nível ${boletim.nivelPerfil||1} × 0,1`),
  ].join("");

  return `
    <div class="rendimento-header">
      <div class="rend-num">${fmtNota(total)}</div>
      <div class="rend-info">
        <div class="rend-eyebrow">${BIMESTRE}º Bimestre · Meu Rendimento</div>
        <div class="rend-sub">${fmtNota(subtotalCapado)} das atividades + ${fmtNota(bonus)} de bônus</div>
        <div class="rend-msg">${mensagemPorNota(total)}</div>
      </div>
    </div>
    <div class="summary-bar" style="margin-bottom:18px">
      <div class="sum-card">
        <div class="sum-label">📋 Das atividades</div>
        <div class="sum-val" style="color:var(--text)">${fmtNota(subtotalCapado)}<span style="font-size:13px;font-weight:600;color:var(--text-muted)"> / 10</span></div>
        <div style="font-size:10.5px;color:var(--text-muted)">subtotal das atividades</div>
      </div>
      ${bonusOn ? `<div class="sum-card">
        <div class="sum-label">🎁 Bônus extras</div>
        <div class="sum-val" style="color:var(--purple)">+${fmtNota(bonus)}</div>
        <div style="font-size:10.5px;color:var(--text-muted)">tabuada, ranking e perfil</div>
      </div>` : ""}
      <div class="sum-card" style="background:linear-gradient(135deg,#1a1040,#15102a);border-color:rgba(108,0,212,.35)">
        <div class="sum-label" style="color:rgba(200,170,255,.7)">= Nota final</div>
        <div style="font-size:32px;font-weight:800;color:var(--purple);line-height:1">${fmtNota(total)}</div>
        <div style="font-size:10.5px;color:rgba(200,170,255,.5)">${fmtNota(subtotalCapado)} + ${fmtNota(bonus)} bônus</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>Atividades do bimestre</div>
      ${camposAtivos().map(barraItem).join("")}
      <div class="subtotal-row"><span class="lbl">Subtotal</span><span class="val">${fmtNota(subtotal)} / 10</span></div>
      ${capNote}
    </div>
    ${bonusOn ? `<div class="card">
      <div class="card-title"><svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm6 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1z"/></svg>Pontos extras conquistados</div>
      ${extras}
      <div class="bonus-total-row"><span class="lbl">Bônus total</span><span class="val">+${fmtNota(bonus)}</span></div>
    </div>` : ""}`;
}

// ── main ──────────────────────────────────────────────────────
async function carregar() {
  const content = document.getElementById("content");
  const bimSel  = document.getElementById("bimSel");
  if (!turma || !nome) { content.innerHTML = `<div class="empty-state"><p>Sessão não encontrada.</p></div>`; if (bimSel) bimSel.style.display = "none"; return; }

  // descobre quais bimestres já foram liberados para esta turma
  const liberados = [];
  for (const b of BIMESTRES) {
    setBimestre(String(b.n));
    try { if (await notasLiberadas(turma)) liberados.push(b.n); } catch (e) {}
  }
  if (!liberados.length) {
    if (bimSel) bimSel.style.display = "none";
    content.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      <p>Suas notas ainda não foram disponibilizadas pela professora.<br>Volte aqui mais perto do fim do bimestre.</p></div>`;
    return;
  }

  // popula e liga o seletor (só aparece se houver mais de um liberado)
  bimSel.innerHTML = liberados.map(n => `<option value="${n}">${n}º Bimestre</option>`).join("");
  bimSel.style.display = liberados.length > 1 ? "" : "none";
  const corrente  = bimestreAtual();
  const escolhido = liberados.includes(corrente) ? corrente : liberados[liberados.length - 1];
  bimSel.value = String(escolhido);
  bimSel.onchange = () => mostrarBimestre(+bimSel.value);
  await mostrarBimestre(escolhido);
}

async function mostrarBimestre(n) {
  setBimestre(String(n));
  const content = document.getElementById("content");
  content.innerHTML = `<div class="empty-state"><p>Carregando…</p></div>`;
  const boletim = await montarBoletim(turma, nome);
  if (!boletim) { content.innerHTML = `<div class="empty-state"><p>As notas foram disponibilizadas e serão lançadas em breve.</p></div>`; return; }
  content.innerHTML = todasLancadas(boletim) ? renderRendimento(boletim) : renderAndamento(boletim);
}

carregar();
</script>
