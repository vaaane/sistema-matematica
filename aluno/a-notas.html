<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#15102a">
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notas — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    /* card base */
    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px;border:1px solid var(--border)}
    .card:last-child{margin-bottom:0}
    .card-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--text)}
    .card-title svg{width:15px;height:15px;fill:currentColor}

    /* bimestre select */
    .bim-select{padding:7px 12px;background:var(--card);border:1.5px solid var(--border);border-radius:9px;color:var(--text);font-weight:600;font-family:inherit;cursor:pointer;font-size:12.5px}

    /* topbar mobile: select fica abaixo, título não quebra */
    .topbar-left{min-width:0;flex:1}
    .topbar-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .topbar-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media(max-width:600px){
      .topbar{flex-wrap:wrap;gap:6px}
      .topbar-right{width:100%;order:2}
      .bim-select{width:100%}
      .topbar-sub{display:none}
    }

    /* aviso de em andamento */
    .andamento-aviso{display:flex;align-items:center;gap:10px;background:rgba(240,165,0,.08);border:1.5px solid rgba(240,165,0,.3);border-radius:12px;padding:11px 16px;margin-bottom:16px;font-size:12.5px;color:rgba(255,255,255,.8);font-weight:600}
    .andamento-aviso svg{width:16px;height:16px;fill:var(--gold);flex-shrink:0}

    /* ── ESTADO 2: Em andamento ── */
    .summary-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
    .sum-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:flex;flex-direction:column;gap:4px}
    .sum-icon{font-size:22px;flex-shrink:0}
    .sum-label{font-size:10.5px;font-weight:600;color:var(--text-muted);margin-bottom:3px}
    .sum-val{font-size:22px;font-weight:800;line-height:1}
    .sum-sub{font-size:10px;color:var(--text-muted);margin-top:3px}

    .potencial-banner{background:linear-gradient(135deg,#1c1040,#15102a);border:1.5px solid rgba(240,165,0,.4);border-radius:var(--radius);padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden}
    .potencial-banner::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at left,rgba(240,165,0,.08) 0%,transparent 60%);pointer-events:none}
    .potencial-banner.zero{border-color:rgba(34,197,94,.35);background:linear-gradient(135deg,#0c1f14,#11111f)}
    .potencial-banner.zero::before{background:radial-gradient(ellipse at left,rgba(34,197,94,.07) 0%,transparent 60%)}
    .pot-icon{font-size:24px;flex-shrink:0}
    .pot-body{flex:1;min-width:0}
    .pot-titulo{font-size:13.5px;font-weight:800;color:var(--gold);margin-bottom:3px}
    .pot-titulo.green{color:var(--green)}
    .pot-desc{font-size:11.5px;color:rgba(255,255,255,.65);line-height:1.45}
    .pot-desc b{color:#fff}
    .pot-pts{font-size:28px;font-weight:800;color:var(--gold);flex-shrink:0;text-shadow:0 0 16px rgba(240,165,0,.4)}
    .pot-pts.green{color:var(--green);text-shadow:0 0 16px rgba(34,197,94,.3)}
    .pot-arrow{font-size:16px;color:rgba(240,165,0,.6);flex-shrink:0}

    .sec-label{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--text-muted);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
    .sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

    .prog-list{display:flex;flex-direction:column;gap:8px}
    .prog-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:14px}
    .prog-row.done{border-color:rgba(34,197,94,.2)}
    .prog-row.partial{border-color:rgba(240,165,0,.2)}
    .prog-row.locked{opacity:.6}
    .prog-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .prog-icon svg{width:19px;height:19px;fill:currentColor}
    .prog-icon.green{background:var(--green-pale);color:#22C55E}
    .prog-icon.orange{background:var(--orange-pale);color:var(--orange)}
    .prog-icon.purple{background:var(--purple-pale);color:#b26bff}
    .prog-icon.gold{background:var(--gold-pale);color:var(--gold)}
    .prog-icon.grey{background:rgba(255,255,255,.05);color:var(--text-muted)}
    .prog-body{flex:1;min-width:0}
    .prog-title{font-size:13px;font-weight:700;margin-bottom:1px}
    .prog-desc{font-size:11px;color:var(--text-muted);line-height:1.4}
    .prog-desc b{color:var(--text)}
    .pbar-wrap{margin-top:7px;display:flex;align-items:center;gap:8px}
    .pbar-bg{flex:1;height:6px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}
    .pbar-fill{height:100%;border-radius:5px}
    .pbar-fill.green{background:linear-gradient(90deg,#16a34a,#22C55E)}
    .pbar-fill.orange{background:linear-gradient(90deg,#c98900,#f0a500)}
    .pbar-fill.purple{background:linear-gradient(90deg,var(--purple-dark),var(--purple))}
    .pbar-label{font-size:10.5px;font-weight:700;white-space:nowrap;color:var(--text-muted)}
    .prog-right{text-align:right;flex-shrink:0;min-width:60px}
    .pts{font-size:16px;font-weight:800}
    .pts.green{color:#15803D}
    .pts.gold{color:var(--gold)}
    .pts.muted{color:var(--text-muted);font-size:13px;font-weight:600}
    .pts-sub{font-size:10px;color:var(--text-muted);margin-top:1px}
    .badge-lock{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-size:10.5px;font-weight:600;color:var(--text-muted)}

    /* ── ESTADO 3: Meu Rendimento (layout do print) ── */
    /* hero */
    .rend-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:26px;background:linear-gradient(135deg,#20123f 0%,#181234 55%,#140f28 100%);border:1.5px solid rgba(155,48,255,.28);border-radius:20px;padding:22px 28px;margin-bottom:16px}
    .rend-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 55% 100% at 10% 45%,rgba(155,48,255,.18),transparent 60%);pointer-events:none}
    .rh-left{position:relative;z-index:1;flex-shrink:0}
    .rh-eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
    .rh-numwrap{display:flex;align-items:center;gap:12px}
    .rh-num{font-family:'Playfair Display',serif;font-weight:800;font-size:58px;line-height:.92;color:var(--gold);text-shadow:0 0 26px rgba(240,165,0,.35)}
    .rh-trophy{width:46px;height:46px;fill:none;stroke:rgba(240,165,0,.55);stroke-width:1.5;flex-shrink:0}
    .rh-divider{width:1px;align-self:stretch;background:rgba(255,255,255,.1);flex-shrink:0;position:relative;z-index:1;margin:2px 0}
    .rh-mid{position:relative;z-index:1;flex-shrink:0;min-width:0}
    .rh-bim{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
    .rh-breakdown{font-size:15px;font-weight:600;color:rgba(255,255,255,.92);margin-bottom:13px}
    .rh-msg{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:#fff;background:rgba(34,197,94,.13);border:1px solid rgba(34,197,94,.3);border-radius:11px;padding:9px 15px}
    .rh-msg .star{color:var(--gold);font-size:15px;line-height:1}
    .rh-chart{position:relative;z-index:1;flex:1;min-width:120px;align-self:stretch;min-height:96px}
    .rh-chart svg{position:absolute;inset:0;width:100%;height:100%}

    /* três cards resumo */
    .rend-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
    .rs-card{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px}
    .rs-icon{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .rs-icon svg{width:26px;height:26px}
    .rs-icon.blue{background:rgba(96,120,255,.14)}  .rs-icon.blue svg{fill:#7c93ff}
    .rs-icon.green{background:rgba(34,197,94,.14)}   .rs-icon.green svg{fill:#22C55E}
    .rs-icon.purple{background:rgba(155,48,255,.16)} .rs-icon.purple svg{fill:#b26bff}
    .rs-body{min-width:0}
    .rs-label{font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:3px}
    .rs-val{font-size:30px;font-weight:800;line-height:1;color:var(--text)}
    .rs-val .rs-max{font-size:15px;font-weight:600;color:var(--text-muted)}
    .rs-val.green{color:#22C55E}.rs-val.purple{color:var(--purple)}
    .rs-sub{font-size:11.5px;color:var(--text-muted);margin-top:5px}

    /* duas colunas */
    .rend-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
    .rend-cols .card{margin-bottom:0}
    .card-title-lg{font-size:15px;font-weight:800}
    .card-title-lg svg{width:17px;height:17px;fill:var(--purple)}

    /* tag pill do item */
    .item-tag{font-size:9.5px;font-weight:800;color:var(--purple);background:rgba(155,48,255,.16);border-radius:6px;padding:2px 7px;white-space:nowrap;text-transform:none;letter-spacing:0}

    /* rodapé */
    .rend-updated{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:20px;font-size:12px;color:var(--text-muted)}
    .rend-updated svg{width:14px;height:14px;fill:var(--text-muted)}

    .item-row{padding:10px 0;border-bottom:1px solid var(--border)}
    .item-row:last-child{border-bottom:none}
    .item-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;gap:8px}
    .item-label{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
    .item-auto-tag{font-size:9px;font-weight:700;color:var(--purple);background:var(--purple-pale);border-radius:10px;padding:1px 6px;white-space:nowrap}
    .item-val{font-size:13px;font-weight:800;color:var(--text);white-space:nowrap}
    .item-val .max{font-weight:500;color:var(--text-muted)}
    .bar-bg{height:7px;border-radius:5px;background:var(--bg);overflow:hidden}
    .bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--purple-dark),var(--purple))}

    .subtotal-row{display:flex;align-items:center;justify-content:space-between;padding-top:13px;margin-top:6px;border-top:1px solid var(--border)}
    .subtotal-row .lbl{font-size:12px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
    .subtotal-row .val{font-size:16px;font-weight:800;color:var(--purple)}
    .cap-note{font-size:11px;color:var(--orange);margin-top:6px;display:flex;align-items:center;gap:5px}

    .extra-item{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--border)}
    .extra-item:last-child{border-bottom:none}
    .extra-dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
    .extra-dot.on{background:#1e9e52;color:#fff}
    .extra-dot.off{background:transparent;border:1.5px solid var(--border);color:var(--text-muted);font-size:9px}
    .extra-lbl{flex:1;font-size:13.5px;font-weight:600}
    .extra-lbl.off{color:var(--text-muted);font-weight:500}
    .extra-pts{font-size:13px;font-weight:800;color:var(--green)}
    .extra-pts.off{color:var(--text-muted);font-weight:600}
    .bonus-total-row{display:flex;align-items:center;justify-content:space-between;padding-top:13px;margin-top:6px;border-top:1px solid var(--border)}
    .bonus-total-row .lbl{font-size:12px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
    .bonus-total-row .val{font-size:15px;font-weight:800;color:var(--green)}

    @media(max-width:900px){.rend-cols{grid-template-columns:1fr}}
    @media(max-width:600px){
      .summary-bar{grid-template-columns:1fr}
      .rend-summary{grid-template-columns:1fr}
      .rend-hero{flex-wrap:wrap;gap:16px}
      .rh-divider{display:none}
      .rh-num{font-size:50px}
      .rh-chart{flex-basis:100%;order:5;min-height:64px}
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title" id="page-title">Notas</div>
        <div class="topbar-sub" id="page-sub">Acompanhe seu desempenho no bimestre</div>
      </div>
      <div class="topbar-right">
        <div id="bimSel"></div>
      </div>
    </div>
    <div class="content" id="content">
      <div class="empty-state"><p>Carregando…</p></div>
    </div>
  </div>
</div>

<script type="module">
import { requireAluno, renderSidebarAluno, clearSession, getSession } from "/js/auth.js";
import {
  CAMPOS_NOTA, EXTRAS_AUTO, EXTRAS_MANUAL, CADERNO_EXTRA, EXTRA_RANK_ATIV4, EXTRA_NIVEL_PERFIL,
  BIMESTRE, setBimestre, camposAtivos, bonusAtivo, fmtNota, mensagemPorNota, montarBoletim, notasLiberadas,
} from "/js/notas.js";
import { BIMESTRES, bimestreAtual } from "/js/constants.js";
import { montarSeletorBimestre } from "/js/bimestre-seletor.js";

requireAluno();
renderSidebarAluno("sidebar", "notas");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const sess  = getSession();
const turma = sess?.turma || "";
const nome  = sess?.alunos?.[0] || "";
const fmt   = fmtNota;

// ── detecta se todas as notas manuais foram lançadas ──────────
function todasLancadas(boletim) {
  // considera "encerrado" quando os campos MANUAIS ativos do bimestre foram lançados
  const chaves = camposAtivos().filter(c => !c.auto && c.key !== "participacao").map(c => c.key);
  return chaves.every(k => {
    const v = boletim.registro[k];
    return v !== null && v !== undefined && v !== "";
  });
}

// ── Ícones SVG (sem emoji, para renderizar igual em qualquer navegador) ──
const IC = {
  grid:    `<svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></svg>`,          // tabuada
  negativo:`<svg viewBox="0 0 24 24"><path d="M11 4h2v4h4v2h-4v4h-2v-4H7V8h4zM7 18h10v2H7z"/></svg>`,               // ±
  estrela: `<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`,
  trofeu:  `<svg viewBox="0 0 24 24"><path d="M18 4h3v3a4 4 0 0 1-4 4h-.4A5 5 0 0 1 13 13.9V17h3v2H8v-2h3v-3.1A5 5 0 0 1 7.4 11H7a4 4 0 0 1-4-4V4h3V3h12v1zm0 2v3a2 2 0 0 0 2-2V6h-2zM4 6v1a2 2 0 0 0 2 2V6H4z"/></svg>`,
  livro:   `<svg viewBox="0 0 24 24"><path d="M6 2h13a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 16a1 1 0 0 0 0 2h12v-2H6z"/></svg>`,
  prova:   `<svg viewBox="0 0 24 24"><path d="M9 2h6v2h3a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3V2zm2 2v1h2V4h-2zm-.3 13.4l5-5-1.4-1.4-3.6 3.6-1.6-1.6-1.4 1.4 3 3z"/></svg>`,
  lampada: `<svg viewBox="0 0 24 24"><path d="M9 21h6v-1H9zm3-19a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>`,
  formas:  `<svg viewBox="0 0 24 24"><path d="M3 4h7v7H3zM17.5 3a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zM12 13l5 8H7z"/></svg>`,
  triangulo:`<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/></svg>`,
  mao:     `<svg viewBox="0 0 24 24"><path d="M13 2a1.5 1.5 0 0 0-1.5 1.5V10h-1V4.5a1.5 1.5 0 0 0-3 0V10h-1V6.5a1.5 1.5 0 0 0-3 0V14a8 8 0 0 0 8 8 6 6 0 0 0 6-6V8.5a1.5 1.5 0 0 0-3 0V10h-1V3.5A1.5 1.5 0 0 0 13 2z"/></svg>`,
};
const ICON_ATIV = { provaMulti:IC.prova, projeto:IC.lampada, caderno:IC.livro, ativ4:IC.formas, triangulos:IC.triangulo, participacao:IC.mao };
const ICON_EXTRA = { t150:IC.grid, t300:IC.grid, tneg50:IC.negativo, tneg150:IC.negativo };

// ── Bloco "Atividades do bimestre" no estilo cartão-com-ícone (DOIS estados) ──
function blocoAtividadesIcones(boletim, encerrado) {
  const { registro, lancados, ativ4Info } = boletim;
  function row(c) {
    const isAuto = c.key==="ativ4" || c.key==="triangulos";
    const tag = c.key==="triangulos" ? `<span class="item-tag">Ativ. 5</span><span class="item-tag">Fase 1</span>`
              : c.key==="ativ4"      ? `<span class="item-tag">Ativ. 4</span>` : "";
    let v = 0, done = false, valBig, desc;
    if (isAuto) {
      const raw = registro[c.key];
      const naoPart = raw === null || raw === undefined;
      v = naoPart ? 0 : (parseFloat(raw)||0);
      done = !naoPart;
      valBig = naoPart ? "0,0" : fmtNota(v);
      desc = naoPart ? "não participou"
                     : (c.key==="ativ4" ? (ativ4Info && ativ4Info.posicao>0 ? `Participou · ${ativ4Info.posicao}º no geral` : "Você participou")
                                        : "Melhor nota na fase 1");
    } else {
      const foi = lancados ? !!lancados[c.key] : true;
      v = foi ? (parseFloat(registro[c.key])||0) : 0;
      done = foi;
      valBig = foi ? fmtNota(v) : "—";
      desc = foi ? "Nota lançada" : "Aguardando lançamento";
    }
    return `<div class="prog-row ${done?"done":"locked"}">
      <div class="prog-icon ${done?"green":"grey"}">${ICON_ATIV[c.key]||IC.prova}</div>
      <div class="prog-body"><div class="prog-title">${c.label} ${tag}</div>
        <div class="prog-desc">${desc}</div>
      </div>
      <div class="prog-right"><div class="pts ${done?"":"muted"}">${valBig}</div><div class="pts-sub">de ${fmtNota(c.max)}</div></div>
    </div>`;
  }
  return `<div class="prog-list">${camposAtivos().map(row).join("")}</div>`;
}

// ── Bloco "Pontos extras" no estilo cartão-com-ícone (DOIS estados) ──
// encerrado=true → rendimento (notas fechadas); false → em andamento
function blocoExtrasIcones(boletim, encerrado) {
  const { auto, progresso, ativ4Info, registro } = boletim;
  const nivelPerf   = boletim.nivelPerfil || 1;
  const temCaderno  = camposAtivos().some(c => c.key === "caderno");
  const cadernoLanc = boletim.lancados ? !!boletim.lancados.caderno : true;   // rendimento sempre lançado
  const cadExtra    = cadernoLanc && (parseFloat(registro.caderno)||0) > CADERNO_EXTRA.limiar;

  function rowTabuada(ex) {
    const on    = auto[ex.key];
    const atual = ex.campo==="melhorTabuada" ? progresso.melhorTabuada : progresso.melhorNeg;
    const pct   = Math.min(100, Math.round(atual/ex.max*100));
    const cor   = on ? "green" : ex.campo==="melhorTabuada" ? "orange" : "purple";
    const desc  = on ? `Meta batida! Nível ${atual}`
                     : encerrado ? `Chegou ao nível ${atual} de ${ex.max}`
                                 : `Faltam <b>${ex.max-atual} níveis</b> — continue jogando!`;
    const subTx = on ? "conquistado" : (encerrado ? "não atingido" : "disponível");
    return `<div class="prog-row ${on?"done":"partial"}">
      <div class="prog-icon ${cor}">${ICON_EXTRA[ex.key]||IC.grid}</div>
      <div class="prog-body"><div class="prog-title">${ex.label}</div>
        <div class="prog-desc">${desc}</div>
        <div class="pbar-wrap"><div class="pbar-bg"><div class="pbar-fill ${cor}" style="width:${pct}%"></div></div>
        <span class="pbar-label" style="${on?"color:var(--green)":""}">${atual}/${ex.max}${on?" ✓":""}</span></div>
      </div>
      <div class="prog-right"><div class="pts ${on?"green":"muted"}">+${fmtNota(ex.valor)}</div><div class="pts-sub">${subTx}</div></div>
    </div>`;
  }
  const nivelPerfilRow = `<div class="prog-row done">
    <div class="prog-icon purple">${IC.estrela}</div>
    <div class="prog-body"><div class="prog-title">${EXTRA_NIVEL_PERFIL.label}</div>

  </div>`;
  const rankRow = (!ativ4Info.fez || (ativ4Info.bonusRank||0)===0) ? "" : `<div class="prog-row done">
    <div class="prog-icon gold">${IC.trofeu}</div>
    <div class="prog-body"><div class="prog-title">Atividade 4 — Ranking</div>
      <div class="prog-desc"><b style="color:var(--gold)">${ativ4Info.posicao||0}º lugar</b> no geral</div></div>
    <div class="prog-right"><div class="pts gold">+${fmtNota(ativ4Info.bonusRank||0)}</div><div class="pts-sub">bônus ranking</div></div>
  </div>`;
  const cadExtraRow = !temCaderno ? "" : (!cadernoLanc ? `<div class="prog-row locked">
    <div class="prog-icon grey">${IC.livro}</div>
    <div class="prog-body"><div class="prog-title">Caderno Extra</div>
      <div class="prog-desc">Calculado quando a professora lançar o caderno (precisa &gt; 1,8)</div></div>
    <div class="prog-right"><div class="pts muted">+0,5</div><div class="pts-sub">possível</div></div>
  </div>` : `<div class="prog-row ${cadExtra?"done":"locked"}">

    <div class="prog-body"><div class="prog-title">Caderno Extra</div>
      <div class="prog-desc">${cadExtra?"Conquistado! Caderno acima de 1,8":`Caderno: ${fmtNota(parseFloat(registro.caderno)||0)} (precisa > 1,8)`}</div></div>
    <div class="prog-right"><div class="pts ${cadExtra?"green":"muted"}">+0,5</div><div class="pts-sub">${cadExtra?"conquistado":"não atingido"}</div></div>
  </div>`);

  return `

}

// ── main ──────────────────────────────────────────────────────
async function carregar() {
  const content = document.getElementById("content");
  const bimSel  = document.getElementById("bimSel");
  if (!turma || !nome) { content.innerHTML = `<div class="empty-state"><p>Sessão não encontrada.</p></div>`; if (bimSel) bimSel.style.display = "none"; return; }

  // descobre quais bimestres já foram liberados para esta turma
  const liberados = [];
  for (const b of BIMESTRES) {
    setBimestre(String(b.n));
    try { if (await notasLiberadas(turma)) liberados.push(b.n); } catch (e) {}
  }
  // sempre mostra as 4 pílulas (padrão do site); se nada liberado, o bimestre atual
  // é o selecionado e mostrarBimestre exibe a mensagem apropriada
  const corrente  = bimestreAtual();
  const escolhido = liberados.includes(corrente) ? corrente : (liberados.length ? liberados[liberados.length - 1] : corrente);
  if (bimSel) bimSel.style.display = "";
  montarSeletorBimestre('bimSel', { mostrarTodos:true, selecionado: escolhido, onChange: (n) => mostrarBimestre(n) });
  await mostrarBimestre(escolhido);
}

let viewToken = 0;

async function mostrarBimestre(n) {
  const token = ++viewToken;
  setBimestre(String(n));
  const content = document.getElementById("content");
  content.innerHTML = `<div class="empty-state"><p>Carregando…</p></div>`;
  const boletim = await montarBoletim(turma, nome);
  if (!boletim) { content.innerHTML = `<div class="empty-state"><p>As notas foram disponibilizadas e serão lançadas em breve.</p></div>`; return; }
  content.innerHTML = todasLancadas(boletim) ? renderRendimento(boletim) : renderAndamento(boletim);
  // gráfico de evolução (busca as notas dos outros bimestres em segundo plano)
  pintarGraficoHistorico(n, token);
}

// Busca a nota final/atual de cada bimestre liberado para desenhar a evolução.
// Roda depois do render principal e injeta o SVG no #rh-chart quando pronto.
async function pintarGraficoHistorico(atual, token) {
  const historico = [];
  for (const b of [1, 2, 3, 4]) {
    setBimestre(String(b));
    try {
      const bo = await montarBoletim(turma, nome);   // null se ainda não liberado
      historico.push({ n: b, total: bo ? bo.total : null });
    } catch (e) { historico.push({ n: b, total: null }); }
  }
  setBimestre(String(atual));                          // restaura o bimestre visualizado
  if (token !== viewToken) return;                     // usuário já trocou de bimestre
  const host = document.getElementById("rh-chart");
  if (host) host.innerHTML = svgEvolucao(historico, atual);
}

// Desenha o SVG da linha de evolução a partir dos pontos reais.
function svgEvolucao(historico, atual) {
  const pontos = historico.filter(p => p.total !== null && p.total !== undefined);
  const X = b => 10 + ((b - 1) / 3) * (290 - 10);      // 1º→esq, 4º→dir
  const Y = t => 86 - (Math.max(0, Math.min(10, t)) / 10) * (86 - 12);
  const glow = `<defs>
      <linearGradient id="rhFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9b30ff" stop-opacity=".28"/><stop offset="1" stop-color="#9b30ff" stop-opacity="0"/>
      </linearGradient>
      <filter id="rhGlow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>`;

  if (pontos.length === 0) {
    return `<svg viewBox="0 0 300 96" preserveAspectRatio="none" aria-hidden="true">${glow}</svg>`;
  }
  if (pontos.length === 1) {
    const p = pontos[0], x = X(p.n), y = Y(p.total);
    return `<svg viewBox="0 0 300 96" preserveAspectRatio="none" aria-hidden="true">${glow}
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="#b26bff" filter="url(#rhGlow)"/>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#fff"/></svg>`;
  }

  const coords = pontos.map(p => ({ b: p.n, x: X(p.n), y: Y(p.total) }));
  const linha  = coords.map((c, i) => `${i ? "L" : "M"}${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
  const area   = `M${coords[0].x.toFixed(1)},${coords[0].y.toFixed(1)} `
               + coords.slice(1).map(c => `L${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ")
               + ` L${coords[coords.length-1].x.toFixed(1)},96 L${coords[0].x.toFixed(1)},96 Z`;
  const dots = coords.map(c => {
    const cur = c.b === atual;
    return cur
      ? `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="6" fill="#b26bff" filter="url(#rhGlow)"/><circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.6" fill="#fff"/>`
      : `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.2" fill="#7a4bd0"/>`;
  }).join("");

  return `<svg viewBox="0 0 300 96" preserveAspectRatio="none" aria-hidden="true">${glow}
    <path d="${area}" fill="url(#rhFill)"/>
    <path d="${linha}" fill="none" stroke="#9b30ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#rhGlow)"/>
    ${dots}</svg>`;
}

carregar();
</script>
