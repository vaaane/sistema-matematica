<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>document.documentElement.setAttribute("data-theme","dark");</script>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#15102a">
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atividades — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    /* ── Dark theme para conteúdo .ac ── */
    .ac{
      --ac-bg:#11111f;--ac-bg2:#1a1a2e;--ac-bg3:#222238;
      --ac-purple:#7c5cfc;--ac-pl:#9b7ffe;
      --ac-gold:#ffd700;--ac-green:#00e676;--ac-orange:#ff7b2e;--ac-red:#ff4444;
      --ac-text:#e8eaf6;--ac-muted:#8892b0;
      --ac-border:rgba(124,92,252,0.15);
      background:transparent;color:var(--ac-text);
      font-family:'Inter',sans-serif;
    }

    /* Banner liberada */
    .ac-liberada-banner{background:linear-gradient(135deg,rgba(124,92,252,0.15),rgba(0,212,255,0.08));border:1.5px solid rgba(124,92,252,0.4);border-radius:16px;padding:20px 24px;margin-bottom:16px;position:relative;overflow:hidden;}
    .ac-liberada-banner::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:radial-gradient(circle,rgba(124,92,252,0.15),transparent 70%);pointer-events:none;}
    .ac-liberada-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(124,92,252,0.2);border:1px solid rgba(124,92,252,0.4);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--ac-pl);margin-bottom:10px;}
    .ac-dot{width:6px;height:6px;background:var(--ac-pl);border-radius:50%;animation:acPulse 1.5s infinite;}
    @keyframes acPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.4);}}
    .ac-liberada-nome{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;margin-bottom:6px;}
    .ac-liberada-meta{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
    .ac-liberada-meta span{font-size:12px;color:var(--ac-muted);}
    .ac-btn-iniciar{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--ac-purple),#5a3fd8);color:#fff;border:none;border-radius:12px;padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;box-shadow:0 4px 20px rgba(124,92,252,0.3);text-decoration:none;}
    .ac-btn-iniciar:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(124,92,252,0.4);}

    /* Aviso torneio discreto */
    .ac-torneio-aviso{background:rgba(255,215,0,0.06);border:1px solid rgba(255,215,0,0.2);border-radius:12px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .2s;}
    .ac-torneio-aviso:hover{background:rgba(255,215,0,0.1);border-color:rgba(255,215,0,0.35);}
    .ac-torneio-icon{font-size:18px;flex-shrink:0;}
    .ac-torneio-text{flex:1;}
    .ac-torneio-text strong{font-size:13px;color:var(--ac-gold);display:block;}
    .ac-torneio-text span{font-size:11px;color:var(--ac-muted);}
    .ac-torneio-arrow{color:var(--ac-gold);font-size:16px;}

    /* Título de seção */
    .ac-section-title{font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--ac-muted);margin-bottom:10px;margin-top:4px;}

    /* Lista de atividades */
    .ac-atividades-lista{display:flex;flex-direction:column;gap:8px;}
    .ac-atv-card{background:var(--ac-bg2);border:1px solid var(--ac-border);border-radius:14px;padding:14px 16px 14px 20px;display:flex;align-items:center;gap:14px;transition:all .2s;position:relative;overflow:hidden;}
    .ac-atv-card.clicavel{cursor:pointer;}
    .ac-atv-card.clicavel:hover{border-color:rgba(124,92,252,0.35);}
    .ac-atv-card.concluida{border-color:rgba(0,230,118,0.15);}
    .ac-atv-card.bloqueada{opacity:.5;}
    .ac-atv-card.em-breve{opacity:.55;}
    .ac-atv-card.disponivel{border-color:rgba(124,92,252,0.2);}

    /* Linha lateral de status */
    .ac-atv-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;}
    .ac-atv-card.concluida::before{background:var(--ac-green);}
    .ac-atv-card.disponivel::before{background:var(--ac-purple);}
    .ac-atv-card.bloqueada::before{background:rgba(255,255,255,0.07);}
    .ac-atv-card.em-breve::before{background:rgba(255,255,255,0.07);}

    /* Número da atividade */
    .ac-atv-num{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:11px;font-weight:700;flex-shrink:0;}
    .ac-atv-num.concluida{background:rgba(0,230,118,0.12);color:var(--ac-green);border:1px solid rgba(0,230,118,0.2);}
    .ac-atv-num.disponivel{background:rgba(124,92,252,0.15);color:var(--ac-pl);border:1px solid rgba(124,92,252,0.3);}
    .ac-atv-num.bloqueada,.ac-atv-num.em-breve{background:rgba(255,255,255,0.04);color:var(--ac-muted);border:1px solid rgba(255,255,255,0.07);}

    .ac-atv-info{flex:1;min-width:0;}
    .ac-atv-nome{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ac-text);}
    .ac-atv-detalhe{display:flex;gap:8px;margin-top:4px;align-items:center;flex-wrap:wrap;}
    .ac-atv-tag{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:500;}
    .ac-atv-tag.avaliacao{background:rgba(255,123,46,0.12);color:var(--ac-orange);}
    .ac-atv-tag.em-breve-t{background:rgba(255,255,255,0.06);color:var(--ac-muted);}
    .ac-atv-data{font-size:11px;color:var(--ac-muted);}

    .ac-atv-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
    .ac-atv-nota{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;text-align:right;line-height:1;}
    .ac-atv-nota.green{color:var(--ac-green);}
    .ac-atv-nota.orange{color:var(--ac-orange);}
    .ac-atv-nota.red{color:var(--ac-red);}
    .ac-atv-nota.muted{color:var(--ac-muted);font-size:13px;}
    .ac-atv-nota-label{font-size:10px;color:var(--ac-muted);text-align:right;margin-top:2px;}

    .ac-status-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:8px;white-space:nowrap;}
    .ac-status-badge.concluida{background:rgba(0,230,118,0.12);color:var(--ac-green);}
    .ac-status-badge.bloqueada{background:rgba(255,255,255,0.05);color:var(--ac-muted);}
    .ac-btn-disponivel{display:inline-flex;align-items:center;gap:6px;background:rgba(124,92,252,0.2);border:1px solid rgba(124,92,252,0.4);color:var(--ac-pl);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;text-decoration:none;transition:all .2s;font-family:'Inter',sans-serif;}
    .ac-btn-disponivel:hover{background:rgba(124,92,252,0.35);}
    .ac-btn-treino{display:inline-flex;align-items:center;gap:6px;background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.4);color:var(--ac-gold);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;text-decoration:none;transition:all .2s;font-family:'Inter',sans-serif;white-space:nowrap;}
    .ac-btn-treino:hover{background:rgba(255,215,0,0.22);}
    .ac-btn-treino.suave{background:transparent;border-color:rgba(255,215,0,0.22);color:rgba(240,165,0,0.65);font-weight:600;box-shadow:none;}
    .ac-btn-treino.suave:hover{background:rgba(255,215,0,0.10);color:var(--ac-gold);}

    @keyframes acFadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .ac-liberada-banner{animation:acFadeUp .3s ease both;}
    .ac-torneio-aviso{animation:acFadeUp .3s ease .05s both;}
    .ac-atv-card:nth-child(1){animation:acFadeUp .3s ease .1s both;}
    .ac-atv-card:nth-child(2){animation:acFadeUp .3s ease .15s both;}
    .ac-atv-card:nth-child(3){animation:acFadeUp .3s ease .2s both;}
    .ac-atv-card:nth-child(4){animation:acFadeUp .3s ease .25s both;}

    @media(max-width:560px){
      .ac-atv-card{padding:10px 12px 10px 14px;gap:10px;}
      .ac-atv-num{width:32px;height:32px;font-size:9px;}
      .ac-atv-nome{font-size:13px;}
      .ac-atv-right{gap:6px;}
      .ac-atv-nota{font-size:14px;}
      .ac-status-badge{font-size:10px;padding:3px 7px;}
      .ac-btn-disponivel{font-size:11px;padding:5px 10px;}
      .ac-liberada-meta{gap:8px;}
    }
    @media(max-width:400px){
      .ac-atv-card{flex-wrap:wrap;}
      .ac-atv-num{flex-shrink:0;}
      .ac-atv-info{flex:1;min-width:0;}
      .ac-atv-right{width:100%;justify-content:flex-end;border-top:1px solid var(--ac-border);padding-top:8px;margin-top:4px;}
    }
    /* Dupla */
    .ac-dupla-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.35);color:#00d4ff;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;margin-left:8px;}
    .ac-dupla-btn:hover{background:rgba(0,212,255,0.2);}
    .ac-dupla-panel{background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.25);border-radius:12px;padding:14px 16px;margin-top:12px;display:none;flex-direction:column;gap:10px;}
    .ac-dupla-panel.aberto{display:flex;}
    .ac-dupla-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;}
    .ac-dupla-select,.ac-dupla-pin{background:#11111f;border:1px solid rgba(0,212,255,0.3);border-radius:8px;padding:7px 10px;color:#e8eaf6;font-size:13px;font-family:'Inter',sans-serif;outline:none;}
    .ac-dupla-select{flex:1;min-width:120px;}
    .ac-dupla-pin{width:90px;letter-spacing:4px;}
    .ac-dupla-confirmar{background:linear-gradient(135deg,#00d4ff,#0090cc);color:#000;border:none;border-radius:8px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
    .ac-dupla-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,212,255,0.12);border:1px solid rgba(0,212,255,0.35);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;color:#00d4ff;margin-top:8px;}
    .ac-dupla-remove{background:none;border:none;color:rgba(0,212,255,.6);cursor:pointer;font-size:15px;line-height:1;padding:0 0 0 4px;}
    .ac-dupla-erro{font-size:12px;color:#ff4444;margin-top:4px;display:none;}
  .bim-tabs{display:flex;gap:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:3px}
  .bim-tab{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:700;color:var(--text-muted,#8a8aa8);cursor:pointer;border:none;background:transparent;font-family:'Inter',sans-serif}
  .bim-tab.active{background:#7c5cfc;color:#fff}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Atividades</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
      <div class="topbar-right">
        <div class="bim-tabs" id="bimTabs"></div>
        <div class="avatar-wrap" onclick="window.location.href='/aluno/perfil.html'">
          <div class="avatar" id="topbar-avatar-circle" style="overflow:hidden;padding:0"></div>
        </div>
      </div>
    </div>
    <div class="content" id="content">
      <div data-loading style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div>
    </div>
  </div>
</div>
<script type="module">
import { LISTA_ATIVIDADES, MAX_TENTATIVAS_ATIVIDADE, ALUNOS_POR_TURMA, bimestreAtual } from "/js/constants.js";
import { contarTentativas, getLiberadasParaTurma, getAlunoPreferencia, getResultados, getSenhaAluno } from "/js/db.js";
import { requireAluno, renderSidebarAluno, clearSession, isModoTeste, hashSenha, lerDuplaAtiva, injetarFaixaDuelo, iniciarNotifDueloGlobal } from "/js/auth.js";
import { applyTopRankVisuals } from "/js/toprank.js";
import { initAvBanner } from "/js/avaliacao_banner.js";
import { db } from "/js/firebase-config.js";
import { ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const sess = requireAluno();
if (!sess) throw new Error();
renderSidebarAluno("sidebar", "atividades");

// ── Bimestre ativo (via ?bim=N, padrão o corrente) e lista filtrada ──
const _pbim = parseInt(new URLSearchParams(location.search).get('bim'), 10);
const bimAtivo = (_pbim >= 1 && _pbim <= 4) ? _pbim : bimestreAtual();
const ATIVS_BIM = LISTA_ATIVIDADES.filter(a => (a.bim || 2) === bimAtivo);
(function(){
  const el = document.getElementById('bimTabs');
  if (!el) return;
  el.innerHTML = [1,2,3,4].map(b => `<button class="bim-tab ${b===bimAtivo?'active':''}" data-b="${b}">${b}º</button>`).join('');
  el.querySelectorAll('.bim-tab').forEach(bt => bt.onclick = () => {
    const u = new URL(location.href); u.searchParams.set('bim', bt.dataset.b); location.href = u.toString();
  });
})();
injetarFaixaDuelo();
window.sair = () => { import('/js/presenca.js').then(m => m.encerrarPresenca()); clearSession(); window.location.href = "/index.html"; };
applyTopRankVisuals();

const { alunos, turma } = sess;
initAvBanner(turma, alunos[0]);

getAlunoPreferencia(turma, alunos[0], 'robotica').then(isRob => {
  localStorage.setItem('sm_pref_robotica', isRob ? '1' : '0');
}).catch(() => {});
document.getElementById("topbar-sub").textContent = `Turma ${turma} · ${bimAtivo}º bimestre`;
(async () => { try {
  const { getPerfil } = await import('/js/db.js');
  const { avatarUrl: _avUrl, avatarConfigDefault: _avDef } = await import('/js/gamificacao.js');
  const _aUid = (turma + '_' + alunos[0]).replace(/[.#$[\]/\s]/g, '_');
  const _p = await getPerfil(_aUid);
  const _c = document.getElementById('topbar-avatar-circle');
  if (_c) {
    const _url   = _avUrl(_p.avatar || _avDef());
    const _letra = (alunos[0] || '?')[0].toUpperCase();
    _c.innerHTML = `<div style="width:100%;height:100%;position:relative;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#7F77DD,#00d4ff)"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;z-index:0">${_letra}</span><img src="${_url}" alt="" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:1;border-radius:50%" onerror="this.style.display='none'"></div>`;
  }
} catch(_) {} })();

(async () => { try {
  const _pUid = (turma + '_' + alunos[0]).replace(/[.#$\[\]/\s]/g, '_');
  const { iniciarPresenca, encerrarPresenca } = await import('/js/presenca.js');
  const { getPerfil } = await import('/js/db.js');
  const _perfil = await getPerfil(_pUid).catch(() => ({}));
  await iniciarPresenca(_pUid, {
    nome:    alunos[0],
    apelido: _perfil?.apelido_ativo || alunos[0],
    turma,
    status:  _perfil?.duelos_disponivel !== false ? 'disponivel' : 'indisponivel',
    pagina:  'atividades',
  });
  window.addEventListener('beforeunload', () => encerrarPresenca());
} catch(e) { console.warn('[Presença]', e); } })();

iniciarNotifDueloGlobal();

(async () => { try {
  const { initDueloAvail } = await import('/js/duelo_avail.js');
  await initDueloAvail((turma + '_' + alunos[0]).replace(/[.#$[\]/\s]/g, '_'));
} catch(e) {} })();

document.documentElement.setAttribute('data-theme','dark');
const content = document.getElementById("content");
content.classList.add('ac');

// Timeout: after 6s show retry if still loading
const loadTimeout = setTimeout(() => {
  if (content.querySelector('[data-loading]')) {
    content.innerHTML = `<div class="card" style="text-align:center;padding:40px">
      <p style="color:var(--text-muted);margin-bottom:16px;font-size:14px">Não foi possível carregar as atividades.</p>
      <button onclick="location.reload()" class="btn btn-blue">Tentar novamente</button>
    </div>`;
  }
}, 6000);

const liberadas = isModoTeste()
  ? ATIVS_BIM.map(a => ({ atividade: a.nome, modo: a.modo || 'classico', percentual: 100, status: 'ativa', criadoEm: null }))
  : await getLiberadasParaTurma(turma);
const liberadasMap = {};
for (const lib of liberadas) liberadasMap[lib.atividade] = lib;

// Identify classic (attempt-limited) activities
const classicAtivs = ATIVS_BIM.filter(ativ => {
  const _lib = liberadasMap[ativ.nome];
  const _modo = _lib?.modo || ativ.modo || 'classico';
  return _modo !== "competicao" && _modo !== "competicao_plus" && _modo !== "avaliacao_plus" && _modo !== "atividade_plus";
});

const bloqueios = {};

// Mark competition activities immediately (no limits)
for (const ativ of ATIVS_BIM) {
  if (!classicAtivs.includes(ativ)) {
    const _m = liberadasMap[ativ.nome]?.modo || ativ.modo || 'classico';
    bloqueios[ativ.nome] = { bloqueado: false, bloqueadoPor: [], minRest: 999, tentativas: {}, competicao: true, avaliacao: _m === 'avaliacao_plus' };
  }
}

// Fetch all attempt counts in parallel
if (classicAtivs.length && alunos.length) {
  const pairs = classicAtivs.flatMap(ativ => alunos.map(al => ({ ativ: ativ.nome, al })));
  const counts = await Promise.all(pairs.map(p => contarTentativas(p.al, p.ativ)));
  pairs.forEach(({ ativ, al }, idx) => {
    if (!bloqueios[ativ]) bloqueios[ativ] = { bloqueado: false, bloqueadoPor: [], minRest: 999, tentativas: {}, competicao: false };
    bloqueios[ativ].tentativas[al] = counts[idx];
  });
  for (const ativ of classicAtivs) {
    const tent = bloqueios[ativ.nome].tentativas;
    const bloqueadoPor = alunos.filter(al => (tent[al] || 0) >= MAX_TENTATIVAS_ATIVIDADE);
    const minRest = Math.max(0, MAX_TENTATIVAS_ATIVIDADE - Math.max(...alunos.map(al => tent[al] || 0)));
    bloqueios[ativ.nome].bloqueado    = bloqueadoPor.length > 0;
    bloqueios[ativ.nome].bloqueadoPor = bloqueadoPor;
    bloqueios[ativ.nome].minRest      = minRest;
  }
}

// Load avaliacao_plus controle data to know actual tentativas used
const MAX_TENT_AV = 3;
const MIN_TENT_AV_MS = 8 * 60 * 1000;
function avKey(s) {
  return btoa(unescape(encodeURIComponent(s))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
}
const controleAv = {};
const avPlusAtivs = ATIVS_BIM.filter(a => {
  const _m = liberadasMap[a.nome]?.modo || a.modo || 'classico';
  return _m === 'avaliacao_plus' && !!liberadasMap[a.nome];
});
if (avPlusAtivs.length && alunos.length) {
  await Promise.all(avPlusAtivs.map(async ativ => {
    try {
      const k = avKey(turma + '|' + ativ.nome);
      const snap = await get(ref(db, `avaliacao_controle/${k}/${avKey(alunos[0])}`));
      controleAv[ativ.nome] = snap.exists() ? snap.val() : null;
    } catch(e) {}
  }));
}
for (const ativ of avPlusAtivs) {
  const ctrl = controleAv[ativ.nome];
  const tentUsadas = ctrl?.tentativas_realizadas || 0;
  const gRestMs = ctrl ? Math.max(0, 30*60*1000 - (Date.now() - ctrl.inicio_global)) : 30*60*1000;
  bloqueios[ativ.nome].esgotada = tentUsadas >= MAX_TENT_AV || (!!ctrl && gRestMs < MIN_TENT_AV_MS);
  bloqueios[ativ.nome].tentUsadas = tentUsadas;
  bloqueios[ativ.nome].ctrl = ctrl;
}

clearTimeout(loadTimeout);

// ── Torneios ativos para esta turma ───────────────────────────
const torneiosAtivos = [];
if (!isModoTeste()) {
  const tSnap = await get(ref(db, 'torneios')).catch(() => null);
  if (tSnap?.exists()) {
    tSnap.forEach(c => {
      const v = c.val();
      if (['liberada','iniciado','pausado'].includes(v.status) && (v.turmas||[]).includes(turma)) {
        torneiosAtivos.push({ id: c.key, ...v });
      }
    });
  }
}

// Chamada da turma no bimestre ativo (para marcar "Faltou")
let chamadaTurma = {};
try {
  const _cs = await get(ref(db, `chamada/${turma}/${bimAtivo}`));
  chamadaTurma = _cs.exists() ? (_cs.val() || {}) : {};
} catch(_) { chamadaTurma = {}; }
function ymdLocal(ts){
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function faltouNaData(ymd){
  if (!ymd) return false;
  const v = (chamadaTurma[ymd] || {})[alunos[0]];
  return v === 'falta' || v === true;
}

const todosResultados = await getResultados();
const realizadaMap = {}, melhorNota = {}, melhorPts = {}, valorNotaMap = {};
for (const r of todosResultados) {
  if (!alunos.includes(r.aluno) || !r.concluido || r.modo_teste) continue;
  const prev = realizadaMap[r.atividade];
  if (!prev || (r.criadoEm || 0) > (prev.ts || 0)) realizadaMap[r.atividade] = { ts: r.criadoEm || 0 };
  const nq = r.nota_quiz ?? null;
  if (nq != null && (melhorNota[r.atividade] ?? -1) < nq) melhorNota[r.atividade] = nq;
  const pts = r.pontuacao || 0;
  if (pts > (melhorPts[r.atividade] ?? -1)) melhorPts[r.atividade] = pts;
  if (r.valor_nota != null) valorNotaMap[r.atividade] = Number(r.valor_nota);
}
function formatTs(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0')
    + ' às ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
}
function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ativNumStr(nome) { const m = nome.match(/\d+/); return m ? 'A'+m[0] : '?'; }
function notaColorCls(n) { if (n == null) return 'muted'; return n >= 7 ? 'green' : n >= 4 ? 'orange' : 'red'; }

// ── Aviso de torneio ativo (discreto) ────────────────────────
const tornAviso = torneiosAtivos.length ? `
  <div class="ac-torneio-aviso" onclick="location.href='/aluno/torneios.html'">
    <span class="ac-torneio-icon">🏆</span>
    <div class="ac-torneio-text">
      <strong>${escH(torneiosAtivos[0].nome || 'Torneio ativo')}</strong>
      <span>${torneiosAtivos[0].status === 'iniciado' ? 'Em andamento' : 'Aguardando início'} · Turma ${turma} · Ver em Torneios →</span>
    </div>
    <span class="ac-torneio-arrow">›</span>
  </div>` : '';

// Treino agora vive dentro do card da atividade (ver _btnTreino abaixo)
const treinoAviso = '';

// ── Banner da atividade liberada ──────────────────────────────
const liberadaParaBanner = ATIVS_BIM.find(ativ => {
  const lib = liberadasMap[ativ.nome];
  if (!lib || lib.status === 'encerrada') return false;
  if (realizadaMap[ativ.nome]) return false;          // já concluída → não é "disponível agora"
  const bloq = bloqueios[ativ.nome];
  return !bloq?.bloqueado && !bloq?.esgotada;
});

const bannerHtml = liberadaParaBanner ? (() => {
  const ativ  = liberadaParaBanner;
  const lib   = liberadasMap[ativ.nome];
  const modoEf = lib?.modo || ativ.modo || 'classico';
  const url   = modoEf === 'equacoes_plus'
    ? `/aluno/atividade_equacoes.html?ativ=${encodeURIComponent(ativ.nome)}`
    : modoEf === 'avaliacao_plus'
    ? `/aluno/avaliacao_plus.html?ativ=${encodeURIComponent(ativ.nome)}`
    : modoEf === 'atividade_plus'
    ? `/aluno/atividade_plus.html?ativ=${encodeURIComponent(ativ.nome)}`
    : modoEf === 'competicao_plus'
    ? `/aluno/competicao_plus.html?ativ=${encodeURIComponent(ativ.nome)}`
    : modoEf === 'competicao'
    ? `/aluno/competicao.html?ativ=${encodeURIComponent(ativ.nome)}`
    : `/aluno/jogar.html?ativ=${encodeURIComponent(ativ.nome)}`;
  const bloq = bloqueios[ativ.nome];
  const isAvP = modoEf === 'avaliacao_plus';
  const tentStr = isAvP
    ? `⏱ 25 min · ${bloq?.tentUsadas || 0}/3 tentativas usadas`
    : '';
  const _alunosDupla = (ALUNOS_POR_TURMA[turma] || []).filter(n => n !== alunos[0]);
  const _opsDupla = _alunosDupla.map(n => `<option value="${escH(n)}">${escH(n)}</option>`).join('');
  return `<div class="ac-liberada-banner" id="banner-liberada">
    <div class="ac-liberada-tag"><span class="ac-dot"></span> Disponível agora</div>
    <div class="ac-liberada-nome">${escH(ativ.nome)}</div>
    <div class="ac-liberada-meta">
      ${isAvP ? '<span>📋 Avaliação+</span>' : '<span>📝 Atividade</span>'}
      ${tentStr ? `<span>${tentStr}</span>` : ''}
      ${isAvP ? '<span>🏆 Vale 10 pts na Fase 1</span>' : '<span>🏆 Vale pontos no ranking</span>'}
    </div>
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">
      <button class="ac-btn-iniciar" id="btn-iniciar-ativ" onclick="iniciarAtividade('${url}')">▶ Iniciar agora</button>
      <button class="ac-dupla-btn" id="btn-dupla-toggle" onclick="togglePainelDupla()">👥 Jogar em Dupla</button>
    </div>
    <div class="ac-dupla-panel" id="painel-dupla">
      <div style="font-size:12px;color:#00d4ff;font-weight:600">Adicionar parceiro da turma ${escH(turma)}</div>
      <div class="ac-dupla-row">
        <select class="ac-dupla-select" id="dupla-select"><option value="">Selecionar colega...</option>${_opsDupla}</select>
        <input class="ac-dupla-pin" type="password" id="dupla-pin" maxlength="4" inputmode="numeric" placeholder="Senha">
        <button class="ac-dupla-confirmar" onclick="confirmarDupla()">Confirmar</button>
      </div>
      <div class="ac-dupla-erro" id="dupla-erro"></div>
    </div>
    <div id="dupla-badge-wrap"></div>
  </div>`;
})() : '';

// ── Cards de atividades ───────────────────────────────────────
const cardsHtml = ATIVS_BIM.map(ativ => {
  const lib         = liberadasMap[ativ.nome];
  const isLib       = !!lib;
  const isEncerrada = lib?.status === 'encerrada';
  const bloq        = bloqueios[ativ.nome];
  const foiRealizada = !!realizadaMap[ativ.nome];
  const lastTs       = realizadaMap[ativ.nome]?.ts;
  const modoEf      = lib?.modo || ativ.modo || 'classico';
  const isAvP       = modoEf === 'avaliacao_plus';
  const _valAtiv    = valorNotaMap[ativ.nome] ?? 1.5;
  const _ptsAtiv    = melhorPts[ativ.nome] ?? null;        // 0–10 (bruto)
  const _notaReal   = _ptsAtiv != null ? Math.round((_ptsAtiv / 10) * _valAtiv * 100) / 100 : null;
  const nota        = isAvP ? (melhorNota[ativ.nome] ?? null) : _notaReal;
  const _fmtN       = n => n.toFixed(2).replace('.', ',');
  const notaStr     = nota != null ? (isAvP ? nota.toFixed(1) : _fmtN(nota)) : null;
  const url = modoEf === 'equacoes_plus'
    ? `/aluno/atividade_equacoes.html?ativ=${encodeURIComponent(ativ.nome)}`
    : modoEf === 'avaliacao_plus'
    ? `/aluno/avaliacao_plus.html?ativ=${encodeURIComponent(ativ.nome)}`
    : modoEf === 'atividade_plus'
    ? `/aluno/atividade_plus.html?ativ=${encodeURIComponent(ativ.nome)}`
    : modoEf === 'competicao_plus'
    ? `/aluno/competicao_plus.html?ativ=${encodeURIComponent(ativ.nome)}`
    : modoEf === 'competicao'
    ? `/aluno/competicao.html?ativ=${encodeURIComponent(ativ.nome)}`
    : `/aluno/jogar.html?ativ=${encodeURIComponent(ativ.nome)}`;

  const _temTreino = modoEf === 'equacoes_plus';
  const _btnTreino = (_temTreino && !(isLib && !bloq?.esgotada && !bloq?.bloqueado && !isEncerrada && !foiRealizada))
    ? `<a href="/aluno/treino-equacoes.html" class="ac-btn-treino${foiRealizada ? ' suave' : ''}" onclick="event.stopPropagation()">🎯 Treinar</a>`
    : '';
  // Faltou = marcado falta na data em que a atividade foi liberada, e ainda não fez.
  const _libDate = lib?.criadoEm ? ymdLocal(lib.criadoEm) : null;
  const faltou   = !foiRealizada && faltouNaData(_libDate);
  const _indisponivel = isEncerrada || !isLib || bloq?.bloqueado || bloq?.esgotada;

  let statusCls, numCls, statusBadge;
  if (foiRealizada) {
    statusCls = 'concluida clicavel'; numCls = 'concluida';
    statusBadge = `<span class="ac-status-badge concluida">✅ Concluída</span>`;
  } else if (faltou && _indisponivel) {
    statusCls = 'bloqueada'; numCls = 'bloqueada';
    statusBadge = `<span class="ac-status-badge bloqueada">🚫 Faltou</span>`;
  } else if (isEncerrada) {
    statusCls = 'bloqueada'; numCls = 'bloqueada';
    statusBadge = `<span class="ac-status-badge bloqueada">⏰ Perdeu prazo</span>`;
  } else if (!isLib) {
    statusCls = 'bloqueada'; numCls = 'bloqueada';
    statusBadge = `<span class="ac-status-badge bloqueada">🔒 Não liberada</span>`;
  } else if (bloq?.esgotada || bloq?.bloqueado) {
    statusCls = 'bloqueada'; numCls = 'bloqueada';
    statusBadge = `<span class="ac-status-badge bloqueada">${bloq?.esgotada ? '✅ Esgotada' : '🔒 Bloqueada'}</span>`;
  } else {
    statusCls = 'disponivel clicavel'; numCls = 'disponivel';
    statusBadge = `<a href="${url}" class="ac-btn-disponivel">▶ Entrar</a>`;
  }

  const detalhe = foiRealizada && lastTs
    ? `<span class="ac-atv-data">✅ ${formatTs(lastTs)}</span>`
    : isAvP && (bloq?.tentUsadas || 0) > 0
    ? `<span class="ac-atv-data">📝 ${bloq.tentUsadas}/3 tentativas</span>`
    : '';

  const clickAttr = foiRealizada ? `onclick="location.href='/aluno/a-historico.html'"` : '';

  return `<div class="ac-atv-card ${statusCls}" ${clickAttr}>
    <div class="ac-atv-num ${numCls}">${ativNumStr(ativ.nome)}</div>
    <div class="ac-atv-info">
      <div class="ac-atv-nome">${escH(ativ.nome)}</div>
      <div class="ac-atv-detalhe">
        ${isAvP ? `<span class="ac-atv-tag avaliacao">📋 Avaliação+</span>` : ''}
        ${detalhe}
      </div>
    </div>
    <div class="ac-atv-right">
      ${notaStr ? `<div>
        <div class="ac-atv-nota ${notaColorCls(_ptsAtiv)}">${notaStr}</div>
        <div class="ac-atv-nota-label">${isAvP ? 'F1 / 10 pts' : 'de ' + _fmtN(_valAtiv)}</div>
      </div>` : ''}
      ${_btnTreino}
      ${statusBadge}
    </div>
  </div>`;
}).join('');

content.innerHTML = `
  ${bannerHtml}
  ${tornAviso}
  ${treinoAviso}
  <div class="ac-section-title">Todas as atividades</div>
  <div class="ac-atividades-lista">${cardsHtml || '<div class="card" style="text-align:center;padding:30px;color:var(--text-muted)">Nenhuma atividade no '+bimAtivo+'º bimestre por enquanto.</div>'}</div>`;

// Restaurar badge de dupla se já estava ativa
(function() {
  try {
    const d = JSON.parse(sessionStorage.getItem('sm_dupla_temp') || 'null');
    if (d?.nome) _mostrarBadgeDupla(d.nome);
  } catch(e) {}
})();

function togglePainelDupla() {
  const p = document.getElementById('painel-dupla');
  if (!p) return;
  const aberto = p.classList.toggle('aberto');
  document.getElementById('btn-dupla-toggle').textContent = aberto ? '✕ Cancelar' : '👥 Jogar em Dupla';
}

window.togglePainelDupla = togglePainelDupla;

window.confirmarDupla = async function() {
  const sel  = document.getElementById('dupla-select');
  const pin  = document.getElementById('dupla-pin');
  const erro = document.getElementById('dupla-erro');
  const nome = sel?.value;
  erro.style.display = 'none';
  if (!nome) { erro.textContent = 'Selecione um colega.'; erro.style.display = 'block'; return; }
  if (!pin?.value || !/^\d{4}$/.test(pin.value)) { erro.textContent = 'Digite a senha de 4 dígitos.'; erro.style.display = 'block'; return; }
  try {
    const [hash, rec] = await Promise.all([hashSenha(turma, nome, pin.value), getSenhaAluno(turma, nome)]);
    if (!rec) { erro.textContent = `Senha não cadastrada para ${nome}.`; erro.style.display = 'block'; return; }
    if (rec.hash !== hash) { erro.textContent = 'Senha incorreta.'; erro.style.display = 'block'; return; }
    sessionStorage.setItem('sm_dupla_temp', JSON.stringify({ nome, turma }));
    _mostrarBadgeDupla(nome);
    document.getElementById('painel-dupla')?.classList.remove('aberto');
    document.getElementById('btn-dupla-toggle').style.display = 'none';
  } catch(e) { erro.textContent = 'Erro ao verificar senha.'; erro.style.display = 'block'; }
};

window.removerDupla = function() {
  sessionStorage.removeItem('sm_dupla_temp');
  document.getElementById('dupla-badge-wrap').innerHTML = '';
  document.getElementById('btn-dupla-toggle').style.display = '';
  document.getElementById('btn-dupla-toggle').textContent = '👥 Jogar em Dupla';
};

function _mostrarBadgeDupla(nome) {
  const wrap = document.getElementById('dupla-badge-wrap');
  if (!wrap) return;
  wrap.innerHTML = `<div class="ac-dupla-badge">👥 ${escH(nome)} <button class="ac-dupla-remove" onclick="removerDupla()">✕</button></div>`;
}

window.iniciarAtividade = async function(url) {
  const _duplaAtiva = lerDuplaAtiva();
  if (_duplaAtiva) {
    try {
      localStorage.removeItem('sm_dupla_duelo');
      const { atualizarPresenca } = await import('/js/presenca.js');
      await atualizarPresenca({ parceiro_nome: null, parceiro_turma: null });
    } catch(_) {}
  }
  window.location.href = url;
};

</script>
</body>
</html>
