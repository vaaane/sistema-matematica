<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>document.documentElement.setAttribute("data-theme","dark");</script>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#15102a">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Diploma — Tabuada</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/main.css"/>
<style>
  :root {
    --bg:#0d0f1a; --card:#151828; --border:rgba(255,255,255,0.07);
    --text:#e8eaf0; --muted:#6b7280; --purple:#7F77DD;
  }
  html,body { background:var(--bg)!important; color:var(--text)!important; }
  .main { background:var(--bg)!important; }

  .dp-page { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }

  /* ── Intro card ── */
  .dp-intro {
    background: var(--card); border: 1px solid rgba(201,168,76,.2);
    border-radius: 20px; padding: 28px 24px; text-align: center;
    margin-bottom: 28px; position: relative; overflow: hidden;
  }
  .dp-intro::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,.1) 0%, transparent 65%);
  }
  .dp-intro-nome { font-family:'Cinzel',serif; font-size:26px; font-weight:700; color:var(--text); margin-bottom:4px; }
  .dp-intro-turma { font-size:13px; color:var(--muted); margin-bottom:6px; }
  .dp-intro-data  { font-size:11px; color:rgba(201,168,76,.7); margin-bottom:0; }

  /* ── Grid de 3 cards ── */
  .dp-grid {
    display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 20px;
  }
  @media(max-width:700px) { .dp-grid { grid-template-columns: 1fr; } }

  /* ── Diploma card ── */
  .dp-card {
    border-radius: 18px; padding: 28px 20px; text-align: center;
    position: relative; overflow: hidden; display: flex; flex-direction: column;
    transition: transform .15s, box-shadow .15s;
  }
  .dp-card:hover { transform: translateY(-2px); }
  .dp-card.locked { opacity: .38; pointer-events: none; }

  /* cores por tier */
  .dp-card.tier-base {
    background: var(--card); border: 1px solid rgba(201,168,76,.25);
  }
  .dp-card.tier-base::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,.1) 0%, transparent 65%);
  }
  .dp-card.tier-ouro {
    background: #100d02; border: 1.5px solid rgba(234,179,8,.5);
    box-shadow: 0 0 30px rgba(234,179,8,.1);
  }
  .dp-card.tier-ouro::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 0%, rgba(234,179,8,.15) 0%, transparent 60%);
  }
  .dp-card.tier-diamante {
    background: #07061a; border: 1.5px solid rgba(139,92,246,.5);
    box-shadow: 0 0 30px rgba(139,92,246,.12);
  }
  .dp-card.tier-diamante::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 0%, rgba(139,92,246,.15) 0%, transparent 60%);
  }

  /* medal */
  .dp-medal {
    width: 72px; height: 72px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-size:34px; margin: 0 auto 16px; border: 2.5px solid #c9a84c;
    position:relative; z-index:1;
  }
  .dp-medal.base     { background:linear-gradient(135deg,#f7e98e,#c9a84c,#f7e98e); animation:mp-b 2.5s ease-in-out infinite; }
  .dp-medal.ouro     { background:linear-gradient(135deg,#fffde7,#f59e0b,#fde68a); border-color:#f59e0b; animation:mp-o 2s ease-in-out infinite; }
  .dp-medal.diamante { background:linear-gradient(135deg,#ede9fe,#818cf8,#c4b5fd,#818cf8,#ede9fe); border-color:#818cf8; animation:mp-d 2s ease-in-out infinite; }
  @keyframes mp-b { 0%,100%{box-shadow:0 0 0 6px rgba(201,168,76,.1),0 0 24px rgba(245,158,11,.3)} 50%{box-shadow:0 0 0 10px rgba(201,168,76,.06),0 0 44px rgba(245,158,11,.55)} }
  @keyframes mp-o { 0%,100%{box-shadow:0 0 0 6px rgba(234,179,8,.1),0 0 28px rgba(234,179,8,.4)} 50%{box-shadow:0 0 0 10px rgba(234,179,8,.06),0 0 52px rgba(234,179,8,.7)} }
  @keyframes mp-d { 0%,100%{box-shadow:0 0 0 6px rgba(139,92,246,.1),0 0 28px rgba(139,92,246,.4)} 50%{box-shadow:0 0 0 10px rgba(139,92,246,.06),0 0 52px rgba(139,92,246,.7)} }

  .dp-tier-lbl { font-size:9px; font-weight:700; letter-spacing:3px; text-transform:uppercase; margin-bottom:8px; position:relative; z-index:1; }
  .tier-base     .dp-tier-lbl { color:#c9a84c; }
  .tier-ouro     .dp-tier-lbl { color:#f59e0b; }
  .tier-diamante .dp-tier-lbl { color:#a78bfa; }

  .dp-tier-nome { font-family:'Cinzel',serif; font-size:15px; font-weight:700; color:var(--text); margin-bottom:6px; position:relative; z-index:1; }

  .dp-tier-desc { font-size:11px; color:var(--muted); line-height:1.55; margin-bottom:16px; position:relative; z-index:1; flex:1; }

  /* stats */
  .dp-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; position:relative; z-index:1; }
  .dp-stat { border-radius:10px; padding:10px 6px; text-align:center; }
  .tier-base     .dp-stat { background:rgba(201,168,76,.07); border:1px solid rgba(201,168,76,.18); }
  .tier-ouro     .dp-stat { background:rgba(234,179,8,.08);  border:1px solid rgba(234,179,8,.25); }
  .tier-diamante .dp-stat { background:rgba(139,92,246,.08); border:1px solid rgba(139,92,246,.25); }
  .dp-stat-val { font-family:'Cinzel',serif; font-size:16px; font-weight:700; line-height:1; }
  .tier-base     .dp-stat-val { color:#c9a84c; }
  .tier-ouro     .dp-stat-val { color:#f59e0b; }
  .tier-diamante .dp-stat-val { color:#a78bfa; }
  .dp-stat-lbl { font-size:8px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-top:3px; }

  /* badge conquista (desbloqueado) */
  .dp-conquista-badge {
    font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    margin-bottom:12px; position:relative; z-index:1;
    display:inline-flex; align-items:center; gap:4px;
    border-radius:20px; padding:3px 10px;
  }
  .tier-base     .dp-conquista-badge { background:rgba(201,168,76,.12); color:#c9a84c; border:1px solid rgba(201,168,76,.3); }
  .tier-ouro     .dp-conquista-badge { background:rgba(234,179,8,.12);  color:#f59e0b; border:1px solid rgba(234,179,8,.35); }
  .tier-diamante .dp-conquista-badge { background:rgba(139,92,246,.12); color:#a78bfa; border:1px solid rgba(139,92,246,.35); }

  /* botão imprimir */
  .dp-btn {
    width:100%; padding:12px; font-size:13px; font-weight:800;
    border:none; border-radius:10px; cursor:pointer; font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:opacity .15s; position:relative; z-index:1; margin-top:auto;
  }
  .tier-base     .dp-btn { background:linear-gradient(135deg,#c9a84c,#f7e98e); color:#1a0f00; }
  .tier-ouro     .dp-btn { background:linear-gradient(135deg,#b45309,#f59e0b,#fde68a); color:#1a0f00; }
  .tier-diamante .dp-btn { background:linear-gradient(135deg,#4c1d95,#7c3aed,#c4b5fd); color:#fff; }
  .dp-btn:hover { opacity:.88; }

  /* lock overlay */
  .dp-lock-msg { font-size:11px; color:var(--muted); position:relative; z-index:1; margin-top:auto; padding-top:8px; }

  .btn-voltar { display:block; text-align:center; margin-top:8px; color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; background:none; border:1px solid var(--border); border-radius:10px; padding:10px; width:100%; font-family:'Inter',sans-serif; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">🎓 Diploma</div>
        <div class="topbar-sub">Tabuada · Nível 300</div>
      </div>
      <div class="topbar-right">
        <div id="topbar-avatar-circle" class="avatar-circle" style="width:36px;height:36px;cursor:pointer" onclick="window.location.href='/aluno/perfil.html'"></div>
      </div>
    </div>
    <div class="content">
      <div class="dp-page">
        <div id="dp-content">
          <div style="text-align:center;padding:60px;color:var(--muted)">Carregando…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { requireAluno, renderSidebarAluno, clearSession, getSession } from '/js/auth.js';
import { db } from '/js/firebase-config.js';
import { ref, get } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
import { getPerfil } from '/js/db.js';
import { avatarUrl, avatarConfigDefault } from '/js/gamificacao.js';
import { getNomeCompleto } from '/js/nomes_completos.js';

// ── Modo professor: ?uid=8H_Murillo (visualiza o diploma de um aluno) ──
const _params  = new URLSearchParams(location.search);
const _uidParam = _params.get('uid');
const _sessAtual = getSession();
const _modoProf = !!_uidParam && _sessAtual?.modo === 'professor';

let sess, alunos, turma, uid;
if (_modoProf) {
  // Deriva turma e nome do uid (formato "TURMA_Nome")
  uid = _uidParam;
  const _i = _uidParam.indexOf('_');
  turma  = _params.get('turma') || (_i > -1 ? _uidParam.slice(0, _i) : '');
  const _nome = _params.get('nome') || (_i > -1 ? _uidParam.slice(_i + 1).replace(/_/g, ' ') : _uidParam);
  alunos = [_nome];
  sess = { alunos, turma, modo: 'professor' };
} else {
  sess = requireAluno('/index.html');
  ({ alunos, turma } = sess);
  uid = (turma + '_' + alunos[0]).replace(/[.#$[\]/\s]/g, '_');
}
const nomeCompleto = getNomeCompleto(turma, alunos[0]);

if (!_modoProf) renderSidebarAluno('sidebar', 'jogos');
else { const _sb = document.getElementById('sidebar'); if (_sb) _sb.style.display = 'none'; }
window.sair = () => { clearSession(); window.location.href = '/index.html'; };

(async () => {

(async () => { try {
  const _p = await getPerfil(uid);
  const _c = document.getElementById('topbar-avatar-circle');
  if (_c) {
    const url   = avatarUrl(_p?.avatar || avatarConfigDefault());
    const letra = (alunos[0] || '?')[0].toUpperCase();
    _c.innerHTML = `<div style="width:100%;height:100%;position:relative;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#7F77DD,#00d4ff)"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;z-index:0">${letra}</span><img src="${url}" alt="" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:1;border-radius:50%" onerror="this.style.display='none'"></div>`;
  }
} catch(_) {} })();

const [conq300, conquOuro, conquDia, perfil, histSnap] = await Promise.all([
  get(ref(db, `conquistas/${uid}/tabuada_300`)),
  get(ref(db, `conquistas/${uid}/tabuada_ouro`)),
  get(ref(db, `conquistas/${uid}/tabuada_diamante`)),
  getPerfil(uid),
  get(ref(db, `tabuada_niveis/${uid}/historico`)),
]);

const tem300  = conq300.exists()  && conq300.val().conquistado  === true;
const temOuro = conquOuro.exists() && conquOuro.val().conquistado === true;
const temDia  = conquDia.exists()  && conquDia.val().conquistado  === true;

if (!tem300) {
  document.getElementById('dp-content').innerHTML = `
    <div style="text-align:center;padding:48px 20px;background:var(--card);border:1px solid var(--border);border-radius:20px">
      <div style="font-size:48px;margin-bottom:12px">🔒</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:8px">Diploma ainda não disponível</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:20px">Chegue ao nível 300 da tabuada para desbloquear este diploma.</div>
      <button onclick="window.location.href='/aluno/jogos.html'" style="background:var(--purple);color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer">Ir para a Tabuada →</button>
    </div>`;
  return;
}

const nomeAluno   = perfil?.apelido_ativo || alunos[0];
const tsBase      = conq300.val().ts;
const tsOuro      = temOuro ? conquOuro.val().ts : null;
const tsDia       = temDia  ? conquDia.val().ts  : null;
const fmt = ts => ts ? new Date(ts).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}) : null;
const dataBase = fmt(tsBase);
const dataOuro = fmt(tsOuro);
const dataDia  = fmt(tsDia);
const now = new Date();
const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

// Contar operações reais
let totalAcertos = 0, totalErros = 0;
if (histSnap.exists()) Object.values(histSnap.val()).forEach(e => { totalAcertos += (e.acertos||0); totalErros += (e.erros||0); });
function fmtNum(n) { return n.toLocaleString('pt-BR'); }
const opsStr = totalAcertos > 0 ? fmtNum(totalAcertos) : 'mais de 3.100';

// Salvar no sessionStorage para o diploma_print
function salvarPrint(tier, ts) {
  sessionStorage.setItem('diploma_tier', tier);
  sessionStorage.setItem('diploma_acertos', String(totalAcertos));
  sessionStorage.setItem('diploma_erros', String(totalErros));
  sessionStorage.setItem('diploma_tsConquista', String(ts || ''));
}

function cardHtml({ tier, emoji, label, nome, desc, conquistado, dataConq, ops, lockMsg }) {
  const z = `position:relative;z-index:1`;
  const conquBadge = conquistado && dataConq
    ? `<div class="dp-conquista-badge" style="${z}">✅ ${dataConq}</div>` : '';
  const statsHtml = `
    <div class="dp-stats">
      <div class="dp-stat"><div class="dp-stat-val">300</div><div class="dp-stat-lbl">Níveis</div></div>
      <div class="dp-stat"><div class="dp-stat-val">${ops}</div><div class="dp-stat-lbl">Operações</div></div>
    </div>`;
  const btn = conquistado
    ? `<button class="dp-btn" onclick="salvarEImprimir('${tier}')">🖨️ Imprimir diploma</button>`
    : `<div class="dp-lock-msg">🔒 ${lockMsg}</div>`;
  return `
    <div class="dp-card tier-${tier}${conquistado ? '' : ' locked'}">
      <div class="dp-medal ${tier}">${emoji}</div>
      <div class="dp-tier-lbl" style="${z}">${label}</div>
      <div class="dp-tier-nome" style="${z}">${nome}</div>
      <div class="dp-tier-desc" style="${z}">${desc}</div>
      ${conquBadge}
      ${conquistado ? statsHtml : ''}
      ${btn}
    </div>`;
}

window.salvarEImprimir = function(tier) {
  const ts = tier === 'base' ? tsBase : tier === 'ouro' ? tsOuro : tsDia;
  salvarPrint(tier, ts);
  // Passa tudo pela URL: sessionStorage não é herdado por abas abertas com target=_blank
  const qs = new URLSearchParams({
    uid, turma, nome: alunos[0],
    tier,
    acertos: String(totalAcertos),
    ts: String(ts || ''),
  });
  const a = document.createElement('a');
  a.href = '/aluno/diploma_print.html?' + qs.toString();
  a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
};

document.getElementById('dp-content').innerHTML = `
  <div class="dp-intro">
    <div style="font-size:36px;margin-bottom:10px">🏆</div>
    <div class="dp-intro-nome">${nomeAluno}</div>
    <div class="dp-intro-turma">Turma ${turma}</div>
    ${dataBase ? `<div class="dp-intro-data">Mestre da Tabuada · ${dataBase}</div>` : ''}
  </div>

  <div class="dp-grid">
    ${cardHtml({
      tier:'base', emoji:'🏆', label:'Diploma de Excelência', nome:'Nível 300',
      desc:'Concluiu todos os 300 níveis do programa de Cálculo Mental.',
      conquistado:true, dataConq:dataBase, ops:opsStr,
    })}
    ${cardHtml({
      tier:'ouro', emoji:'🥇', label:'Diploma de Ouro', nome:'Todos com Estrela',
      desc:'Completou todos os 300 níveis sem cometer erros pelo menos uma vez.',
      conquistado:temOuro, dataConq:dataOuro, ops:opsStr,
      lockMsg:'Complete todos os 300 níveis sem erros (pelo menos 1×)',
    })}
    ${cardHtml({
      tier:'diamante', emoji:'💎', label:'Diploma de Maestria', nome:'Maestria Total',
      desc:'Alcançou 3 completions perfeitas em cada um dos 300 níveis.',
      conquistado:temDia, dataConq:dataDia, ops:opsStr,
      lockMsg:'Complete todos os 300 níveis com 3× perfeito',
    })}
  </div>

  <button class="btn-voltar" onclick="window.history.back()">← Voltar</button>`;

})();
</script>
</body>
</html>
