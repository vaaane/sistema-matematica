<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>document.documentElement.setAttribute("data-theme","dark");</script>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#15102a">
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minha Ficha — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <link rel="stylesheet" href="/css/conteudo-aula.css"/>
<style>
  .bim-tabs{display:flex;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:11px;padding:4px;flex-wrap:nowrap}
  .bim-tab{flex:1;text-align:center;padding:7px 6px;border-radius:8px;font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer;border:none;background:transparent;font-family:'Inter',sans-serif;white-space:nowrap}
  .bim-tab.active{background:var(--purple);color:#fff;box-shadow:0 2px 8px rgba(108,0,212,.4)}


  /* ===== Resumo (cabeçalho da ficha) ===== */
  .resumo{background:linear-gradient(135deg,#20153f 0%,#181233 55%,#141026 100%);border:1.5px solid rgba(155,48,255,.28);border-radius:18px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .resumo-top{display:flex;align-items:center;gap:14px;flex-wrap:nowrap}
  .avatar{width:52px;height:52px;border-radius:15px;background:var(--purple-pale);color:#c79bff;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;flex-shrink:0;border:1px solid rgba(155,48,255,.35)}
  .who{flex:1;min-width:0}
  .who .nome{font-size:20px;font-weight:800;line-height:1.15;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .who .meta{font-size:12px;color:var(--text-muted);margin-top:4px}
  .resumo .ring{position:relative;width:88px;height:88px;flex-shrink:0}
  .resumo .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .resumo .ring .track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:9}
  .resumo .ring .prog{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)}
  .resumo .ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .resumo .ring .lbl .n{font-size:18px;font-weight:900;line-height:1}
  .resumo .ring .lbl .t{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;border-top:1px solid var(--border);padding-top:14px}
  .stat{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;transition:.15s;text-align:left;display:flex;align-items:center;gap:12px}
  .stat:hover{border-color:rgba(155,48,255,.4);background:rgba(155,48,255,.06)}
  .stat .v{font-size:20px;font-weight:900;line-height:1}
  .stat .l{font-size:10.5px;color:var(--text-muted);margin-top:4px}
  .stat.r .v{color:var(--red)} .stat.o .v{color:var(--gold)} .stat.b .v{color:#60a5fa} .stat.m .v{color:var(--text-muted)}
  .stat-ic{width:44px;height:44px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .stat-ic svg{width:24px;height:24px;fill:currentColor}
  .stat-ic.roxo{background:rgba(155,48,255,.14);color:#c79bff}
  .stat-ic.vermelho{background:rgba(239,68,68,.14);color:#f87171}
  .stat-ic.azul{background:rgba(96,165,250,.14);color:#8ec0ff}
  .stat-ic.dourado{background:rgba(240,165,0,.14);color:#f5c451}
  .stat-cap{font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin-bottom:3px;color:var(--text-muted)}
  .stat-cap.vermelho{color:#f87171} .stat-cap.azul{color:#8ec0ff}
  .stat-de{font-size:12px;font-weight:700;color:var(--text-muted)}
  .stat-sub{font-size:10px;color:var(--text-muted);margin-top:4px;line-height:1.3}
  .stat.destaque{background:rgba(239,68,68,.07);border-color:rgba(239,68,68,.4)}
  .stat-selo{margin-left:auto;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(239,68,68,.16);border:1px solid rgba(239,68,68,.4);border-radius:10px;padding:6px 12px;min-width:74px}
  /* números em Rajdhani (zero redondo, sem o "0" cortado do Orbitron) */
  .stat-selo{font-family:'Rajdhani','Inter',sans-serif;font-size:20px;font-weight:700;color:#f87171;line-height:1}
  .stat-selo small{font-family:'Inter',sans-serif;font-size:9px;font-weight:600;color:#f0a0a0;margin-top:3px;letter-spacing:.3px}
  .stat-selo.neutro{background:rgba(255,255,255,.05);border-color:var(--border);color:var(--text-muted)}
  .stat-selo.neutro small{color:var(--text-muted)}
  /* Faltas ocupa a linha inteira (selo cabe dentro, não estoura) */
  .stat.r.wide{grid-column:1 / -1}
  /* Card avaliativas do quiz */
  .stat.q .v{font-family:'Rajdhani','Inter',sans-serif;font-variant-numeric:tabular-nums}
  .stat.q .qt{font-size:13px;font-weight:700;color:var(--text-muted);margin-left:1px}
  .stat.q.pend{background:rgba(239,68,68,.07);border-color:rgba(239,68,68,.32)}
  .stat.q.pend .qv{color:var(--red)}
  .stat.q.pend .stat-ic{background:rgba(239,68,68,.14);color:#f87171}
  .stat.q.ok{background:rgba(34,197,94,.07);border-color:rgba(34,197,94,.3)}
  .stat.q.ok .qv{color:#63c98a}
  .stat.q.ok .stat-ic{background:rgba(34,197,94,.14);color:#63c98a}
  @media(max-width:768px){ .stat-ic{width:38px;height:38px;border-radius:10px} .stat-ic svg{width:20px;height:20px} }
  .ficha-nota{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.5;border-radius:11px;padding:11px 14px;margin-top:12px}
  .ficha-nota svg{width:17px;height:17px;flex-shrink:0;margin-top:1px}
  .ficha-nota.ouro{background:rgba(240,165,0,.08);border:1px solid rgba(240,165,0,.28);color:#d9c48a}
  .ficha-nota.ouro svg{fill:var(--gold)} .ficha-nota.ouro b{color:#f5c451}
  .ficha-nota.verde{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.28);color:#a7d8ba}
  .ficha-nota.verde svg{fill:#22C55E} .ficha-nota.verde b{color:#63c98a}
  .nota-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 8px;margin:0 -8px;border-bottom:1px solid var(--border);border-radius:9px;text-decoration:none;color:inherit;cursor:pointer;transition:.13s}
  .nota-left{flex:1;min-width:0}
  .nota-right{padding-top:1px}
  .nota-sub, .nsub{display:block;font-size:11px;line-height:1.35;margin-top:4px}
  .nsub.verde{color:var(--green)} .nsub.vermelho{color:var(--red)} .nsub.azul{color:#8ec0ff} .nsub.of{color:var(--text-muted)}
  .nota-val.cinza{color:var(--text-muted)}
  .tag2a{display:inline-flex;align-items:center;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:#8ec0ff;background:rgba(96,165,250,.14);border:1px solid rgba(96,165,250,.3);border-radius:5px;padding:1px 6px;margin-left:4px;vertical-align:middle}
  .nota-hint{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);margin:-2px 0 10px}
  .nota-hint svg{width:13px;height:13px;fill:var(--text-muted);flex-shrink:0;opacity:.8}
  .nota-row:last-of-type{border-bottom:none}
  .nota-row:hover{background:rgba(155,48,255,.07)}
  .nota-row:hover .nota-nome{color:#c79bff}
  .nota-row:hover .nota-chev{opacity:.9;transform:translateX(2px)}
  .nota-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .nota-chev{width:15px;height:15px;fill:none;stroke:var(--text-muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.4;transition:.15s}
  .nota-nome{font-size:13px;color:var(--text);line-height:1.3;transition:.13s;font-weight:500}
  .nota-val{font-family:'Rajdhani','Inter',sans-serif;font-size:17px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .nota-val small{font-family:'Inter',sans-serif;font-size:10.5px;opacity:.55;font-weight:500;letter-spacing:0}
  .nota-val.verde{color:#63c98a} .nota-val.ouro{color:#f5c451} .nota-val.vermelho{color:#f0837f}
  .nota-total{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(155,48,255,.1);border:1px solid rgba(155,48,255,.28);font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#c79bff}
  .nota-total b{font-family:'Rajdhani','Inter',sans-serif;font-size:19px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;text-transform:none}
  .nota-total small{font-family:'Inter',sans-serif;font-size:11px;opacity:.6;font-weight:500}
  .nota-vazia{font-size:12.5px;color:var(--text-muted);padding:10px 2px;text-align:center}
  /* Mini-cards de frequência (sem barra/percentuais) */
  .freq-mini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
  .freq-mcard{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .freq-mcard .fm-v{font-size:13px;font-weight:800;color:var(--text);line-height:1.2}
  .freq-mcard .fm-l{font-size:11px;color:var(--text-muted);line-height:1.25}
  .freq-mcard .fm-warn{font-size:10px;color:var(--text-muted);line-height:1.2;width:100%}
  .freq-mcard.alerta{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.32)}
  .freq-mcard.alerta .fm-v{color:#f0837f} .freq-mcard.alerta .fm-warn{color:#e59a97}
  .freq-mcard.ok .fm-v{color:#63c98a}
  @media(max-width:640px){.freq-mini{grid-template-columns:1fr}.freq-mcard .fm-warn{width:auto}}
  /* ===== Presença (faltas + atestado no mesmo card) ===== */
  .pres-sec+.pres-sec{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
  .pres-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;margin-bottom:10px}
  .pres-h .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .pres-h .c{margin-left:auto;font-size:11px;color:var(--text-muted);font-weight:700}
  @media(max-width:520px){
    .stats{grid-template-columns:1fr}
    .stat.r.wide{grid-column:auto}
    /* cards simples (valor + rótulo): lado a lado */
    .stat.m .stat-txt,.stat.o .stat-txt{display:flex;align-items:baseline;gap:9px}
    .stat.m .stat-txt .l,.stat.o .stat-txt .l{margin-top:0}
    /* Atestado e Quiz: cap+valor+rótulo numa linha horizontal */
    .stat.b .stat-txt,.stat.q .stat-txt{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
    .stat.b .stat-cap,.stat.q .stat-cap{order:2;margin-bottom:0}
    .stat.b .v,.stat.q .v{order:1}
    .stat.b .l,.stat.q .l{order:3;margin-top:0}
  }
  @media(max-width:400px){
    .resumo{padding:15px 15px}
    .resumo-top{gap:11px}
    .avatar{width:46px;height:46px;font-size:19px}
    .who .nome{font-size:18px}
    .resumo .ring{width:74px;height:74px}
    .resumo .ring .lbl .n{font-size:16px}
  }

  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start}
  @media(max-width:900px){
    .grid{display:flex;flex-direction:column}
    .grid > #c-ativ{order:2}
    .grid > .grid-side{order:1}
  }
  .card + .card{margin-top:14px}
  .card-title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;margin-bottom:14px}
  .card-title svg{width:18px;height:18px;fill:var(--purple)}
  .card-title .count{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--text-muted);background:rgba(255,255,255,.04);border:1px solid var(--border);padding:3px 9px;border-radius:20px}

  .filtros{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 12px}
  .filtros button{border:1px solid var(--border);background:transparent;color:var(--text-muted);font-weight:700;font-size:11.5px;padding:6px 12px;border-radius:20px;cursor:pointer}
  .filtros button.on{background:var(--purple-pale);border-color:var(--purple);color:#c79bff}
  .filtros button .fct{display:inline-block;font-size:10.5px;font-weight:800;opacity:.7;margin-left:2px}
  .filtros button.on .fct{opacity:1}

  /* linha de atividade — formato "Minhas Aulas" (anel + tag + visto + badge + botão) */
  .ativ-row{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;transition:.15s}
  .ativ-row:last-child{margin-bottom:0}
  .ativ{padding:12px 14px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center}
  .ativ-row.tem-mat .ativ{cursor:pointer}
  /* anel numerado (cor conforme estado de entrega) */
  .ring{position:relative;width:40px;height:40px;flex-shrink:0}
  .ring svg{position:absolute;inset:0}
  .ring svg circle{stroke:rgba(255,255,255,.18)}
  .ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--text-muted)}
  .ring.feita svg circle,.ring.atv svg circle{stroke:var(--green)} .ring.feita .num,.ring.atv .num{color:#63c98a}
  .ring.atraso svg circle,.ring.fa svg circle{stroke:var(--gold)} .ring.atraso .num,.ring.fa .num{color:var(--gold)}
  .ring.at svg circle{stroke:#60a5fa} .ring.at .num{color:#60a5fa}
  .ring.falta svg circle,.ring.nao svg circle{stroke:rgba(255,255,255,.18)} .ring.falta .num{color:#f88} 
  .ativ-main{min-width:0}
  .ativ-headline{display:flex;align-items:center;gap:9px;flex-wrap:wrap;row-gap:5px}
  .ativ-tag{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:6px;border:1px solid var(--border);color:var(--text-muted);background:transparent}
  .ativ-tag.teorica{background:rgba(155,48,255,.16);border-color:rgba(155,48,255,.4);color:#c79bff}
  .ativ-tag.exercicios{background:rgba(240,165,0,.16);border-color:rgba(240,165,0,.4);color:#f0a500}
  .ativ-tag.projeto{background:rgba(45,212,191,.16);border-color:rgba(45,212,191,.4);color:#5eead4}
  .ativ-nome{font-size:14px;font-weight:700;line-height:1.25;color:var(--text);min-width:0}
  .ativ-meta{display:flex;align-items:center;gap:10px;margin-top:5px;flex-wrap:wrap}
  .ativ-data{font-size:11.5px;color:var(--text-muted);display:inline-flex;align-items:center;gap:5px}
  .ativ-data svg{width:12px;height:12px;fill:currentColor;opacity:.65}
  .ativ-visto{font-size:11.5px;font-weight:600;color:var(--text-muted);display:inline-flex;align-items:center;gap:5px}
  .ativ-visto svg{width:13px;height:13px;fill:currentColor}
  .ativ-visto.completo{color:#63c98a} .ativ-visto.parcial{color:var(--gold)} .ativ-visto.sem{color:var(--text-muted)}
  .ativ-btn{align-self:center;border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:11.5px;font-weight:600;background:transparent;color:var(--text-muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-family:inherit;cursor:pointer;transition:.15s}
  .ativ-btn:hover:not(.off){color:#c79bff;border-color:rgba(155,48,255,.4)}
  .ativ-btn svg{width:13px;height:13px;fill:currentColor;opacity:.8;transition:transform .2s}
  .ativ-btn.off{opacity:.5;cursor:default}
  .ativ-btn .t-oc{display:none}
  .ativ-row.aberto{border-color:rgba(155,48,255,.45);border-left:3px solid var(--purple);box-shadow:0 0 0 1px rgba(155,48,255,.18),0 12px 26px rgba(0,0,0,.4)}
  .ativ-row.aberto .ring svg circle{stroke:var(--purple)} .ativ-row.aberto .ring .num{color:#fff}
  .ativ-row.aberto .ativ-nome{color:#fff}
  .ativ-row.aberto .ativ-btn{border-color:rgba(155,48,255,.55);color:#c79bff}
  .ativ-row.aberto .ativ-btn .chev{transform:rotate(180deg)}
  .ativ-row.aberto .ativ-btn .t-ver{display:none}
  .ativ-row.aberto .ativ-btn .t-oc{display:inline}
  @media(max-width:720px){
    .ativ{grid-template-columns:40px minmax(0,1fr) auto;gap:10px}
  }
  @media(max-width:520px){
    .ativ{grid-template-columns:40px minmax(0,1fr)}
    .ativ-btn{grid-column:1/-1;grid-row:auto;justify-content:center;margin-top:6px}
  }
  .st{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
  .st.feita{background:var(--green-pale);color:var(--green)}
  .st.atraso{background:var(--gold-pale);color:var(--gold)}
  .st.fa{background:var(--gold-pale);color:var(--gold);border:1.5px dashed var(--gold)}
  .st.at{background:rgba(59,130,246,.15);color:#60a5fa}
  .st.atv{background:var(--green-pale);color:var(--green);border:1.5px solid #60a5fa}
  .st.falta{background:var(--red-pale);color:var(--red)}
  .st.nao{background:rgba(255,255,255,.05);color:var(--text-muted)}
  .st svg{width:17px;height:17px;fill:currentColor}
  .ativ-body{flex:1;min-width:0}
  .ativ-nome{font-size:13.5px;font-weight:700}
  .ativ-data{font-size:11.5px;color:var(--text-muted);margin-top:1px}
  .badge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:7px;white-space:nowrap}
  .ativ-meta .badge{margin-left:2px}
  .badge.feita{background:var(--green-pale);color:var(--green)}
  .badge.atraso{background:var(--gold-pale);color:var(--gold)}
  .badge.fa{background:var(--gold-pale);color:var(--gold)}
  .badge.at{background:rgba(59,130,246,.15);color:#60a5fa}
  .badge.atv{background:var(--green-pale);color:var(--green)}
  .badge.falta{background:var(--red-pale);color:var(--red)}
  .badge.nao{background:rgba(255,255,255,.06);color:var(--text-muted)}

  .falta-dates{display:flex;flex-wrap:wrap;gap:8px}
  .falta-pill{display:flex;flex-direction:column;align-items:center;background:var(--red-pale);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:7px 12px;min-width:60px}
  .falta-pill .d{font-size:15px;font-weight:800;color:var(--red);line-height:1}
  .falta-pill .w{font-size:10px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
  .at-pill{display:flex;flex-direction:column;align-items:center;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);border-radius:10px;padding:7px 12px;min-width:60px}
  .at-pill .d{font-size:15px;font-weight:800;color:#60a5fa;line-height:1}
  .at-pill .w{font-size:10px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
  .atraso-pill{display:flex;flex-direction:column;align-items:center;background:var(--gold-pale);border:1px solid rgba(240,165,0,.35);border-radius:10px;padding:7px 12px;min-width:60px}
  .atraso-pill .d{font-size:15px;font-weight:800;color:var(--gold);line-height:1}
  .atraso-pill .w{font-size:10px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
  .vazio{font-size:12.5px;color:var(--text-muted);padding:6px 0}

  .oc{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--border);margin-left:5px}
  .oc:last-child{padding-bottom:2px;border-left-color:transparent}
  .oc::before{content:'';position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--purple)}
  .oc.neg::before{border-color:var(--red)} .oc.pos::before{border-color:var(--green)}

<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">📋 Minha Ficha</div>

      </div>

      </div>

      <div id="conteudo"><div class="vazio">Carregando…</div></div>
    </div>

</div>

<script type="module">
import { numeroChamada, BIMESTRES, bimestreAtual, dentroDoAtestado, normalizarAtestados, aulasNoDia, LISTA_ATIVIDADES } from "/js/constants.js";
import { requireAluno, renderSidebarAluno, clearSession } from "/js/auth.js";
import { indexarBiblioteca, resolverAula, tipoInfo } from "/js/biblioteca.js";
import { getResultadosByAluno, getLiberacoesHistoricoTodas } from "/js/db.js";
import { db } from "/js/firebase-config.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const sess = requireAluno();
renderSidebarAluno("sidebar", "ficha");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const escapeHtml = s => String(s??"").replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const aluno = (sess.alunos && sess.alunos[0]) || "";
const turma = sess.turma || "";
let bimestre = bimestreAtual();
if (![1,2,3,4].includes(bimestre)) bimestre = 3;
let filtro = "todas";

const POSITIVAS = ["Aluno se comportou", "Aluno foi participativo"];
const WD = ["dom","seg","ter","qua","qui","sex","sáb"];
const fmtDMY = iso => { if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
const fmtDM  = iso => { const [,m,d]=iso.split("-"); return `${d}/${m}`; };
const weekday = iso => { try{ return WD[new Date(iso+"T12:00:00").getDay()]; }catch(e){ return ""; } };
const iniciais = n => n.split(" ").filter(Boolean).slice(0,2).map(s=>s[0]).join("").toUpperCase();
const hhmm = ts => { const d=new Date(ts); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const dataDeTs = ts => { const d=new Date(ts); const o=d.getTimezoneOffset(); return new Date(d.getTime()-o*60000).toISOString().slice(0,10); };
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function tipoDe(n){ n=norm(n);
  if(/(teoria|teorica)/.test(n)) return "teorica";
  if(/(projeto|canudos|maquete|estruturas)/.test(n)) return "projeto";
  if(/(exerc|lista|problema|atividade|revis|questo)/.test(n)) return "exercicios";
  return ""; }
const TIPO_LABEL = { teorica:"Teoria", exercicios:"Exercícios", projeto:"Projeto" };
// estado do visto (marca do caderno) — independente do estado de entrega
function vistoDe(id){ const m=(marcas[id]||{})[aluno]||0; return m===1?"completo":m===2?"parcial":"sem"; }
const VISTO = {
  completo:["completo","Visto completo",'<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>'],
  parcial :["parcial","Visto parcial",'<svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg>'],
  sem     :["sem","Sem visto",'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 11h-1a1 1 0 0 1-1-1V7a1 1 0 0 1 2 0v4h1a1 1 0 0 1 0 2z"/></svg>'],
};
const ICO_CAL = '<svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H5V9h14v10zM5 7V5h14v2H5z"/></svg>';
const ICO_TOQUE = '<svg viewBox="0 0 24 24"><path d="M9 11.24V7.5a1.5 1.5 0 0 1 3 0v3.74a4 4 0 1 0-3 0zM10.5 4a3.5 3.5 0 0 0-1.5 6.66V7.5a1.5 1.5 0 0 1 3 0v3.16A3.5 3.5 0 0 0 10.5 4zm5.94 8.35-3.5-1.17V7.5a2.5 2.5 0 0 0-5 0v9.09l-2.03-.43a1.3 1.3 0 0 0-1.24 2.16l3.3 3.55c.47.5 1.13.79 1.82.79h5.66a2 2 0 0 0 1.98-1.7l.53-3.48a2 2 0 0 0-1.35-2.2z"/></svg>';


// Estados de atividade:
//  feita   ✓ (marca 1)          atraso A (marca 2)
//  fa      faltou, entregou depois (marca 3, vale ½)
//  atv     atestado + entregou depois (marca 4, integral)
//  at      atestado sem entrega (derivado: faltou + atestado, sem marca)
//  falta   faltou sem atestado  ·  nao  não feita
const LABEL = {
  feita:"Feita", atraso:"Atraso",
  fa:"Falta · entregou depois", atv:"Atestado · entregou depois",
  at:"Atestado médico", falta:"Falta", nao:"Não feita",
};
const ICON = {
  feita:'<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>',
  atraso:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 11H7v-2h4V6h2z"/></svg>',
  fa:'<span style="font-weight:800;font-size:12px">FA</span>',
  atv:'<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>',
  at:'<span style="font-weight:800;font-size:11px">AT</span>',
  falta:'<svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>',
  nao:'<svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14z"/></svg>',
};

let atividades = [];   // [{id,nome,data,ordem}]
let marcas = {};       // { atvId:{ aluno:0|1|2|3|4 } }
let chamada = {};      // { "YYYY-MM-DD": { aluno:true } }
let anotacoes = {};    // { aluno:[ {ts, ocorrencias:[], obs} ] }
let resultadosAluno = [];  // resultados de quiz do aluno (notas de atividade)
let libHistorico = [];     // liberacoes_historico (datas oficiais + 2ª chamada)
let atestados = [];    // [ {inicio,fim,ts,obs} ] do aluno logado
let nivelTab = 0, nivelNeg = 0;   // progresso nos jogos de tabuada

const temAtestado = data => dentroDoAtestado(data, atestados);
// estado bruto da chamada: "falta" | "atraso" | "" (compat: true antigo => "falta")
const estadoCham = (data, al) => { const v=(chamada[data]||{})[al]; return v===true?"falta":(v||""); };
// Falta "pura": faltou na chamada E não há atestado cobrindo o dia.
const faltou  = (data, al) => estadoCham(data, al)==="falta" && !temAtestado(data);
const atrasou = (data, al) => estadoCham(data, al)==="atraso" && !temAtestado(data);
const aulasDia = data => aulasNoDia(turma, data) || 1;

async function carregar(){
  document.getElementById("conteudo").innerHTML = `<div class="vazio">Carregando…</div>`;
  document.getElementById("bimTabs").innerHTML =
    [1,2,3,4].map(b=>`<button class="bim-tab ${b===bimestre?"active":""}" data-b="${b}">${b}º Bim</button>`).join("");
  document.querySelectorAll(".bim-tab").forEach(el=>el.onclick=()=>{ bimestre=+el.dataset.b; carregar(); });
  document.getElementById("topbar-sub").textContent = `Turma ${turma} · ${bimestre}º bimestre`;

  if (!aluno){
    document.getElementById("conteudo").innerHTML = `<div class="vazio">Não foi possível identificar o aluno da sessão. Faça login novamente.</div>`;
    return;
  }

  // (resolvedor de material/tipo centralizado em /js/biblioteca.js)

  try{
    const _uid = (turma + '_' + aluno).replace(/[.#$[\]/\s]/g, '_');
    const _bimN = bimestreAtual();
    const [sV, sC, sO, sA, sTab, sNeg, sBib] = await Promise.all([
      get(ref(db, `vistos/${turma}/${bimestre}`)),
      get(ref(db, `chamada/${turma}/${bimestre}`)),
      get(ref(db, `mapeamento_salas/${turma}/anotacoes`)),
      get(ref(db, `atestados/${turma}`)),
      get(ref(db, (_bimN <= 2 ? `tabuada_niveis/${_uid}` : `tabuada_niveis_b/${_bimN}/${_uid}`))).catch(()=>null),
      get(ref(db, (_bimN <= 2 ? `tabuada_negativos_niveis/${_uid}` : `tabuada_negativos_niveis_b/${_bimN}/${_uid}`))).catch(()=>null),
      get(ref(db, "biblioteca")),
    ]);
    const _bibMap = {};
    if (sBib && sBib.exists()) { const _bv=sBib.val(); for(const k in _bv){ _bibMap[k]={nome:_bv[k].nome||"", arquivo:_bv[k].arquivo||"", tipo:_bv[k].tipo||""}; } }
    const _bibIdx = indexarBiblioteca(_bibMap);
    nivelTab = sTab?.exists() ? (sTab.val().melhor_nivel || sTab.val().nivel_atual || 0) : 0;
    nivelNeg = sNeg?.exists() ? (sNeg.val().melhor_nivel || sNeg.val().nivel_atual || 0) : 0;
    const rv = sV.exists()?sV.val():{};
    atividades = Object.entries(rv.atividades||{})
      .map(([id,a])=>{ const _r=resolverAula({materialRef:a.materialRef||"", materialTitulo:a.materialTitulo||"", nome:a.nome||""}, _bibIdx); return {id, nome:_r.nome||a.nome||"(sem nome)", data:a.data||"", ordem:a.ordem||0, materialRef:_r.url, materialTitulo:_r.nome, tipo:_r.tipo}; })
      .sort((x,y)=> (x.ordem-y.ordem) || (x.data<y.data?-1:1));
    atividades.forEach((a,i)=>{ a.num = String(a.ordem || (i+1)).padStart(2,"0"); });
    marcas = rv.marcas||{};
    chamada = {};
    const rc = sC.exists()?sC.val():{};
    Object.entries(rc).forEach(([k,v])=>{ if(/^\d{4}-\d{2}-\d{2}$/.test(k)) chamada[k]=v||{}; });
    const rawAnot = sO.exists()?(sO.val()||{}):{};
    // mapeamento.html salva como { base64(nome): { nome, registros:[...] } }.
    anotacoes = {};
    Object.values(rawAnot).forEach(entry=>{ if(entry && entry.nome) anotacoes[entry.nome] = entry.registros || []; });
    atestados = (normalizarAtestados(sA.exists()?sA.val():{})[aluno]) || [];
    try { resultadosAluno = await getResultadosByAluno(aluno, turma); }
    catch(_) { resultadosAluno = []; }
    try { libHistorico = await getLiberacoesHistoricoTodas(); }
    catch(_) { libHistorico = []; }
  }catch(e){
    console.error(e);
    atividades=[]; marcas={}; chamada={}; anotacoes={}; atestados=[]; nivelTab=0; nivelNeg=0; resultadosAluno=[]; libHistorico=[];
    document.getElementById("conteudo").innerHTML = `<div class="vazio">Não foi possível carregar os dados agora. Tente novamente mais tarde.</div>`;
    return;
  }

  render();
}

function statusAtiv(atv){
  const v = (marcas[atv.id]||{})[aluno]||0;
  if (v===1) return "feita";
  if (v===2) return "atraso";
  if (v===3) return "fa";        // faltou, entregou depois (½)
  if (v===4) return "atv";       // atestado, entregou depois (integral)
  const faltouDia = atv.data && estadoCham(atv.data, aluno)==="falta";   // atraso NÃO conta como ausência
  if (faltouDia && temAtestado(atv.data)) return "at";   // atestado sem entrega
  if (faltou(atv.data, aluno)) return "falta";
  return "nao";
}

function faltasDoAluno(){
  return Object.keys(chamada).filter(d=>faltou(d, aluno)).sort();
}
function atrasosDoAluno(){
  return Object.keys(chamada).filter(d=>atrasou(d, aluno)).sort();
}
function atestadosDoAluno(){
  return Object.keys(chamada).filter(d=>estadoCham(d, aluno) && temAtestado(d)).sort();
}

function ocorrenciasDoAluno(){
  const bim = BIMESTRES.find(b=>b.n===bimestre);
  const ini = bim ? new Date(bim.inicio+"T00:00:00").getTime() : -Infinity;
  const fim = bim ? new Date(bim.fim+"T23:59:59").getTime() : Infinity;
  return (anotacoes[aluno]||[])
    .filter(r=> typeof r.ts!=="number" || (r.ts>=ini && r.ts<=fim))
    .slice().sort((a,b)=> (b.ts||0)-(a.ts||0));
}

function render(){
  const linhas = atividades.map(atv=>({...atv, st:statusAtiv(atv)}));
  // Entregas: feita/atraso/atv = 1 ponto; fa = ½.
  const cheias = linhas.filter(l=>l.st==="feita"||l.st==="atraso"||l.st==="atv").length;
  const meias  = linhas.filter(l=>l.st==="fa").length;
  const feitasNum = cheias + meias*0.5;
  const feitasTxt = Number.isInteger(feitasNum) ? String(feitasNum) : feitasNum.toFixed(1).replace(".", ",");
  const naoF   = linhas.filter(l=>l.st==="nao"||l.st==="falta").length;
  const faltas = faltasDoAluno();
  const atrasos = atrasosDoAluno();
  const atDias = atestadosDoAluno();
  const oc     = ocorrenciasDoAluno();
  // faltas em AULAS: cada dia de falta = todas as aulas do dia; cada atraso = 1 aula
  const faltasAulas = faltas.reduce((s,d)=>s+aulasDia(d),0);
  const atrasosAulas = atrasos.length; // 1 aula por atraso
  // Totais do bimestre até agora (dias/aulas com chamada lançada) e % de faltas
  const totalDias  = Object.keys(chamada).length;
  const totalAulas = Object.keys(chamada).reduce((s,d)=>s+aulasDia(d),0);
  const pctFaltas  = totalAulas ? Math.round((faltasAulas/totalAulas)*100) : 0;

  // anel de progresso das entregas (usa feitasNum/atividades já calculados acima)
  const totalAtv  = atividades.length;
  const pctEntreg = totalAtv ? feitasNum/totalAtv : 0;
  const ringCor   = pctEntreg>=.8 ? "var(--green)" : pctEntreg>=.5 ? "var(--gold)" : "var(--red)";
  const ringLen   = 2*Math.PI*42;
  const ringOff   = ringLen*(1-pctEntreg);

  // ── Card "Notas" — todas as avaliativas do bimestre, com estado por aluno ──
  const _fmt2 = n => n.toFixed(2).replace('.', ',');
  const _corNota = p => p>=7 ? 'verde' : p>=4 ? 'ouro' : 'vermelho';

  // melhor resultado (nota) por atividade, só do bimestre selecionado
  const notasAtiv = {};
  for (const r of resultadosAluno){
    if (!r.concluido || r.modo_teste || !r.atividade) continue;
    const a = (LISTA_ATIVIDADES||[]).find(x=>x.nome===r.atividade);
    if (!a || a.bim !== bimestre) continue;   // só avaliativas listadas do bimestre
    const _pts  = r.pontuacao_bruta ?? r.pontuacao ?? 0;
    const _vmax = r.valor_nota != null ? Number(r.valor_nota) : 1.5;
    const _real = Math.round((_pts/10)*_vmax*100)/100;
    const cur = notasAtiv[r.atividade];
    if (!cur || _real > cur.real) notasAtiv[r.atividade] = {
      real:_real, vmax:_vmax, pts:_pts, ts:r.criadoEm||0, id:r.id,
      libTipo: r.liberacao_tipo || "turma", libData: r.liberacao_data || ""
    };
  }

  // datas oficiais (liberações de turma) e 2ª chamada, a partir do histórico
  const _datasOficiais = (ativ) => [...new Set(
    (libHistorico||[])
      .filter(l => l.atividade===ativ && l.turma===turma && (l.tipo||"turma")==="turma" && l.data_aplicacao)
      .map(l => l.data_aplicacao)
  )].sort();
  const _seg2a = (ativ) => (libHistorico||[]).find(l =>
      l.atividade===ativ && l.turma===turma && l.tipo==="segunda_chamada"
      && Array.isArray(l.alunos) && l.alunos.includes(aluno));

  // classifica cada avaliativa do bimestre
  const avalDoBim = (LISTA_ATIVIDADES||[]).filter(a=>a && a.bim===bimestre);
  const _linhasAval = avalDoBim.map(a=>{
    const nome = a.nome;
    const nota = notasAtiv[nome] || null;
    const oficiais = _datasOficiais(nome);
    const seg = _seg2a(nome);
    const vmax = nota?.vmax ?? 1.5;
    if (nota){
      if (nota.libTipo === "segunda_chamada"){
        return {nome, estado:"feito_2a", real:nota.real, vmax, pts:nota.pts, id:nota.id,
                dataSeg: nota.libData || seg?.data_aplicacao || "", oficiais};
      }
      return {nome, estado:"feito", real:nota.real, vmax, pts:nota.pts, id:nota.id, oficiais};
    }
    const presenteEm = oficiais.find(d=>{ const e=estadoCham(d,aluno); return e==="presente"||e==="atraso"||e===""; });
    if (presenteEm) return {nome, estado:"presente", vmax, dataRef:presenteEm, oficiais};
    const atestEm = oficiais.find(d=> estadoCham(d,aluno)==="falta" && temAtestado(d));
    if (atestEm) return {nome, estado:"elegivel", vmax, dataRef:atestEm, oficiais};
    return {nome, estado:"faltou", vmax, dataRef:oficiais[0]||"", oficiais};
  });

  // total: só quem tem nota (feito/feito_2a). Elegível NÃO conta.
  const _somaReal = _linhasAval.filter(l=>l.estado==="feito"||l.estado==="feito_2a").reduce((s,l)=>s+l.real,0);
  const _somaMax  = _linhasAval.reduce((s,l)=>s+l.vmax,0);

  // avaliativas feitas / total (card do topo)
  const avalTotal  = avalDoBim.length;
  const avalFeitas = _linhasAval.filter(l=>l.estado==="feito"||l.estado==="feito_2a").length;
  const avalPend   = Math.max(0, avalTotal - avalFeitas);

  // helper para a linha de nota (data, sublinha, valor)
  const _ofLbl = (ofs) => ofs.length ? ofs.map(fmtDM).join(", ") : "";
  const _linhaHtml = (l) => {
    let sub = "", val = "", tag = "";
    if (l.estado === "feito"){
      sub = `<span class="nsub verde">✓ Realizada${l.oficiais.length?` em ${_ofLbl(l.oficiais)}`:""}</span>`;
      val = `<span class="nota-val ${_corNota(l.pts)}">${_fmt2(l.real)} <small>/ ${_fmt2(l.vmax)}</small></span>`;
    } else if (l.estado === "feito_2a"){
      tag = `<span class="tag2a">2ª chamada</span>`;
      sub = `<span class="nsub verde">✓ Feita em 2ª chamada${l.dataSeg?` (${fmtDM(l.dataSeg)})`:""}</span>`
          + (l.oficiais.length?`<span class="nsub of">Aplicação oficial: ${_ofLbl(l.oficiais)}</span>`:"");
      val = `<span class="nota-val ${_corNota(l.pts)}">${_fmt2(l.real)} <small>/ ${_fmt2(l.vmax)}</small></span>`;
    } else if (l.estado === "presente"){
      sub = `<span class="nsub vermelho">✕ Não realizada — presente no dia${l.dataRef?` (${fmtDM(l.dataRef)})`:""}</span>`;
      val = `<span class="nota-val vermelho">0,00 <small>/ ${_fmt2(l.vmax)}</small></span>`;
    } else if (l.estado === "faltou"){
      sub = `<span class="nsub vermelho">✕ Não realizada — faltou no dia${l.dataRef?` (${fmtDM(l.dataRef)})`:""}</span>`;
      val = `<span class="nota-val vermelho">0,00 <small>/ ${_fmt2(l.vmax)}</small></span>`;
    } else { // elegivel
      sub = `<span class="nsub azul">Elegível a 2ª chamada — faltou com atestado${l.dataRef?` (${fmtDM(l.dataRef)})`:""}. Procure o professor(a).</span>`;
      val = `<span class="nota-val cinza">— <small>/ ${_fmt2(l.vmax)}</small></span>`;
    }
    const href = `/aluno/a-historico.html?resultado=${encodeURIComponent(l.id||"")}&atividade=${encodeURIComponent(l.nome)}#ativ`;
    return `
      <a class="nota-row" href="${href}" title="Ver histórico desta atividade">
        <span class="nota-left">
          <span class="nota-nome">${escapeHtml(l.nome)} ${tag}</span>
          ${sub}
        </span>
        <span class="nota-right">
          ${val}
          <svg class="nota-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </a>`;
  };

  const notasHtml = `
    <div class="card" id="c-notas">
      <div class="card-title">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        Notas <span class="count">${_linhasAval.length}</span>
      </div>
      ${_linhasAval.length ? `<div class="nota-hint">${ICO_TOQUE}Toque numa nota para ver como foi feita</div>` : ""}
      ${_linhasAval.length
        ? _linhasAval.map(_linhaHtml).join("")
        : `<div class="nota-vazia">Nenhuma atividade avaliativa neste bimestre ainda.</div>`}
      ${_linhasAval.length ? `
        <div class="nota-total">
          <span>Total em atividades</span>
          <b>${_fmt2(_somaReal)} <small>/ ${_fmt2(_somaMax)}</small></b>
        </div>` : ""}
    </div>`;

  // ── Frequência: só mini-cards (sem barra, sem %, sem "aulas presentes") ──
  const presAulas = Math.max(0, totalAulas - faltasAulas);
  const pctPres   = totalAulas ? Math.round((presAulas/totalAulas)*100) : 0;
  const abaixoMin = totalAulas > 0 && pctPres < 75;
  const resumoFreqHtml = totalAulas ? `
    <div class="freq-mini">
      <div class="freq-mcard"><span class="fm-v">${faltas.length} de ${totalDias} dias</span><span class="fm-l">com falta</span></div>
      <div class="freq-mcard"><span class="fm-v">${faltasAulas} de ${totalAulas} aulas</span><span class="fm-l">perdidas</span></div>
      <div class="freq-mcard ${abaixoMin?'alerta':'ok'}">${abaixoMin
        ? `<span class="fm-v">⚠️ ${pctFaltas}% de ausência</span><span class="fm-warn">abaixo do mínimo (75% de presença)</span>`
        : `<span class="fm-v">✓ ${pctPres}% de presença</span><span class="fm-warn">dentro do mínimo</span>`}</div>
    </div>` : "";

  const rows = linhas.filter(l=> filtro==="todas" ? true
    : filtro==="feita" ? (l.st==="feita"||l.st==="atraso"||l.st==="fa"||l.st==="atv"||l.st==="at")
    : filtro==="nao" ? (l.st==="nao"||l.st==="falta")
    : true);
  // contadores por filtro (para os botões)
  const cntTodas = linhas.length;
  const cntFeita = linhas.filter(l=>l.st==="feita"||l.st==="atraso"||l.st==="fa"||l.st==="atv"||l.st==="at").length;
  const cntNao   = linhas.filter(l=>l.st==="nao"||l.st==="falta").length;

  const atvHtml = rows.length ? rows.map(r=>{
    const vst = vistoDe(r.id);
    const [vcls,vtxt,vic] = VISTO[vst];
    const tagHtml = r.tipo ? `<span class="ativ-tag ${r.tipo}">${TIPO_LABEL[r.tipo]||""}</span>` : "";
    return `
    <div class="ativ-row ${r.materialRef?"tem-mat":""}" id="ativ-row-${r.id}">
      <div class="ativ" ${r.materialRef?`data-i="${r.id}" onclick="toggleConteudo('${r.id}')"`:""}>
        <div class="ring ${r.st}">
          <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17.5" fill="none" stroke-width="2.5"/></svg>
          <div class="num">${r.num||""}</div>
        </div>
        <div class="ativ-main">
          <div class="ativ-headline">${tagHtml}<span class="ativ-nome">${r.nome}</span></div>
          <div class="ativ-meta">
            <span class="ativ-data">${ICO_CAL}${r.data?fmtDM(r.data):"—"}</span>
            <span class="ativ-visto ${vcls}">${vic}${vtxt}</span>
            <span class="badge ${r.st}">${LABEL[r.st]}</span>
          </div>
        </div>
        ${r.materialRef ? `<button class="ativ-btn" onclick="event.stopPropagation();toggleConteudo('${r.id}')">
          <span class="t-ver">Ver conteúdo</span><span class="t-oc">Ocultar</span>
          <svg class="chev" viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>
        </button>` : `<button class="ativ-btn off" disabled>Sem material</button>`}
      </div>
      ${r.materialRef ? `<div class="painel" id="painel-${r.id}" data-ref="${r.materialRef}" data-loaded="0"></div>` : ""}
    </div>`;}).join("") : `<div class="vazio">Nada neste filtro.</div>`;

  const faltasHtml = faltas.length ? faltas.map(d=>`
    <div class="falta-pill"><div class="d">${fmtDM(d)}</div><div class="w">${weekday(d)} · ${aulasDia(d)}a</div></div>`).join("")
    : `<div class="vazio">Sem faltas no bimestre. 🎉</div>`;

  const atrasosHtml = atrasos.length ? atrasos.map(d=>`
    <div class="atraso-pill"><div class="d">${fmtDM(d)}</div><div class="w">${weekday(d)}</div></div>`).join("")
    : `<div class="vazio">Sem atrasos no bimestre.</div>`;

  const atHtml = atDias.length ? atDias.map(d=>`
    <div class="at-pill"><div class="d">${fmtDM(d)}</div><div class="w">${weekday(d)}</div></div>`).join("")
    : `<div class="vazio">Nenhum dia com atestado neste bimestre.</div>`;

  const ocHtml = oc.length ? oc.map(o=>{
    const tags = (o.ocorrencias||[]);
    const neg = tags.some(t=>!POSITIVAS.includes(t));
    const cls = tags.length ? (neg?"neg":"pos") : "";
    const tagsHtml = tags.map(t=>`<span class="tag ${POSITIVAS.includes(t)?"pos":"neg"}">${t}</span>`).join("");
    const quando = typeof o.ts==="number" ? `${fmtDMY(dataDeTs(o.ts))} · ${hhmm(o.ts)}` : "";
    return `<div class="oc ${cls}">
      <div class="oc-data">${quando}</div>
      ${tagsHtml?`<div class="oc-tags">${tagsHtml}</div>`:""}
      ${o.obs?`<div class="oc-obs">${o.obs}</div>`:""}
    </div>`;
  }).join("") : `<div class="vazio">Sem ocorrências neste bimestre.</div>`;

  document.getElementById("conteudo").innerHTML = `
    <div class="resumo">
      <div class="resumo-top">
        <div class="avatar">${iniciais(aluno)}</div>
        <div class="who">
          <div class="nome">${aluno}</div>
          <div class="meta">Nº ${numeroChamada(turma,aluno)||"—"} · Turma ${turma} · ${bimestre}º Bimestre</div>
        </div>
        <div class="ring">
          <svg viewBox="0 0 96 96">
            <circle class="track" cx="48" cy="48" r="42"/>
            <circle class="prog" cx="48" cy="48" r="42" stroke="${ringCor}" stroke-dasharray="${ringLen.toFixed(1)}" stroke-dashoffset="${ringOff.toFixed(1)}"/>
          </svg>
          <div class="lbl"><div class="n" style="color:${ringCor}">${feitasTxt}/${atividades.length}</div><div class="t">entregues</div></div>
        </div>
      </div>
      <div class="stats">
        <div class="stat m" data-goto="c-ativ">
          <div class="stat-ic roxo"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg></div>
          <div class="stat-txt"><div class="v">${naoF}</div><div class="l">Atividades do caderno não feitas</div></div>
        </div>
        <div class="stat r wide${pctFaltas > 25 ? ' destaque' : ''}" data-goto="c-pres">
          <div class="stat-ic ${pctFaltas > 25 ? 'vermelho' : 'roxo'}"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></div>
          <div class="stat-txt">
            <div class="stat-cap${pctFaltas > 25 ? ' vermelho' : ''}">Faltas</div>
            <div class="v"${pctFaltas > 25 ? '' : ' style="color:var(--text)"'}>${faltasAulas} <span class="stat-de">/ ${totalAulas} aulas</span></div>
            ${totalAulas ? `<div class="stat-sub">${Math.max(0, totalAulas - faltasAulas)} aulas presentes · ${totalAulas ? Math.round(((totalAulas - faltasAulas)/totalAulas)*100) : 0}% de presença</div>` : ""}
          </div>
          ${totalAulas ? `<div class="stat-selo${pctFaltas > 25 ? '' : ' neutro'}">${pctFaltas}%<small>de ausência</small></div>` : ""}
        </div>
        <div class="stat b" data-goto="c-pres">
          <div class="stat-ic azul"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 15l-4-4 1.41-1.41L10 13.17l6.59-6.59L18 8l-8 8z"/></svg></div>
          <div class="stat-txt"><div class="stat-cap azul">Atestado</div><div class="v">${atDias.length}</div><div class="l">dia(s)</div></div>
        </div>
        <div class="stat o" data-goto="c-oc">
          <div class="stat-ic dourado"><svg viewBox="0 0 24 24"><path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/></svg></div>
          <div class="stat-txt"><div class="v">${oc.length}</div><div class="l">Ocorrências</div></div>
        </div>
        ${avalTotal ? `
        <div class="stat q ${avalPend ? 'pend' : 'ok'}" data-goto="c-notas">
          <div class="stat-ic"><svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></div>
          <div class="stat-txt"><div class="v"><span class="qv">${avalFeitas}</span><span class="qt">/${avalTotal}</span></div><div class="l">${avalPend ? `Avaliativa${avalPend>1?"s":""} do quiz não realizada${avalPend>1?"s":""}` : "Avaliativas do quiz · em dia"}</div></div>
        </div>` : ""}
      </div>
    </div>

    <div class="grid">
      <div class="card" id="c-ativ">
        <div class="card-title">
          <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5V9.2zM10.6 5h2.8v14h-2.8V5zm5.6 8H19v6h-2.8v-6z"/></svg>
          Atividades no Caderno <span class="count">${rows.length} de ${atividades.length}</span>
        </div>
        <div class="ficha-nota verde">
          <svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
          <span>Tendo <b>todos os vistos</b> do bimestre (completos ou meio, ½), o aluno ganha <b>+0,5 na média</b>. Os vistos podem ser mostrados à professora <b>ao longo de todo o bimestre</b>.</span>
        </div>
        <div class="filtros" id="filtros">
          <button class="${filtro==="todas"?"on":""}" data-f="todas">Todas <span class="fct">${cntTodas}</span></button>
          <button class="${filtro==="feita"?"on":""}" data-f="feita">Feitas <span class="fct">${cntFeita}</span></button>
          <button class="${filtro==="nao"?"on":""}" data-f="nao">Não feitas <span class="fct">${cntNao}</span></button>
        </div>
        <div>${atvHtml}</div>
      </div>

      <div class="grid-side">
        ${notasHtml}
        <div class="card" id="c-pres">
          <div class="card-title">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            Frequência no bimestre
          </div>
          ${resumoFreqHtml}
          <div class="pres-sec">
            <div class="pres-h"><span class="dot" style="background:var(--red)"></span>Faltas<span class="c">${faltas.length} dia(s) · ${faltasAulas} aula(s)</span></div>
            <div class="falta-dates">${faltasHtml}</div>
          </div>
          ${atrasos.length ? `<div class="pres-sec">
            <div class="pres-h"><span class="dot" style="background:var(--gold)"></span>Atrasos<span class="c">${atrasos.length} dia(s) · ${atrasosAulas} aula(s)</span></div>
            <div class="falta-dates">${atrasosHtml}</div>
          </div>` : ""}
          ${atDias.length ? `<div class="pres-sec">
            <div class="pres-h"><span class="dot" style="background:#60a5fa"></span>Atestado médico<span class="c">${atDias.length} dia(s)</span></div>
            <div class="falta-dates">${atHtml}</div>
          </div>` : ""}
        </div>
        <div class="card" id="c-oc">
          <div class="card-title">
            <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            Ocorrências <span class="count">${oc.length}</span>
          </div>
          <div>${ocHtml}</div>
        </div>

        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24"><path d="M17 4a7 7 0 0 0-5 2.1A7 7 0 0 0 2 11a7 7 0 0 0 7 7h6a7 7 0 0 0 0-14zM8 13H6v2H4v-2H2v-2h2V9h2v2h2v2zm5.5 1a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-3a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
            Jogos de Tabuada
          </div>
          <div class="jogo-prog">
            <div class="jp-top"><span class="jp-nome">🎯 Tabuada <span class="jp-bonus ${nivelTab>=300?"on":""}">+1,0</span></span><span class="jp-niv">Nível ${nivelTab} <span class="jp-max">/ 300</span></span></div>
            <div class="jp-bar"><div class="jp-fill" style="width:${Math.min(100, (nivelTab/300)*100).toFixed(1)}%;background:var(--purple)"></div></div>
            ${nivelTab>=300?'<div class="jp-done">✓ Concluiu toda a tabuada!</div>':''}
          </div>
          <div class="jogo-prog" style="margin-top:12px">
            <div class="jp-top"><span class="jp-nome">➖ Tabuada Negativa <span class="jp-bonus ${nivelNeg>=50?"on":""}">${nivelNeg>=150?"+1,0":"+0,5"}</span></span><span class="jp-niv">Nível ${nivelNeg} <span class="jp-max">/ 150</span></span></div>
            <div class="jp-bar jp-bar-marco" style="--marco:${(50/150*100).toFixed(1)}%"><div class="jp-fill" style="width:${Math.min(100, (nivelNeg/150)*100).toFixed(1)}%;background:var(--gold)"></div></div>
            ${nivelNeg>=150
              ? '<div class="jp-done">✓ Concluiu os negativos! +1,0 na média</div>'
              : nivelNeg>=50
                ? '<div class="jp-done" style="color:var(--gold)">✓ +0,5 garantido · chegue ao 150 para +1,0</div>'
                : '<div class="jp-note">Nível 50 vale +0,5 · nível 150 vale +1,0</div>'}
          </div>
          <div class="ficha-nota ouro">
            <svg viewBox="0 0 24 24"><path d="M12 2 9.2 8.6 2 9.2l5.5 4.7L5.8 21 12 17.3 18.2 21l-1.7-7.1L22 9.2l-7.2-.6z"/></svg>
            <span><b>Dica para a família:</b> concluir a <b>Tabuada</b> (nível 300) vale <b>+1,0</b> na média. Na <b>Tabuada Negativa</b>, chegar ao <b>nível 50</b> vale <b>+0,5</b> e ao <b>nível 150</b> vale <b>+1,0</b>. Incentivar a jogar ajuda na média do bimestre.</span>
          </div>
        </div>
      </div>
    </div>`;

  document.querySelectorAll("#filtros button").forEach(b=>b.onclick=()=>{ filtro=b.dataset.f; render(); });
  document.querySelectorAll("[data-goto]").forEach(el=>el.onclick=()=>{
    const t = document.getElementById(el.dataset.goto);
    if (t) t.scrollIntoView({ behavior:"smooth", block:"start" });
  });
}

// ── Conteúdo da aula embutido (accordion) ──
const _conteudoCache = {};
function extrairMiolo(htmlText){
  const doc = new DOMParser().parseFromString(htmlText, "text/html");
  const au = doc.querySelector(".au") || doc.querySelector(".content") || doc.body;
  au.querySelectorAll(".sidebar, .topbar, script").forEach(el=>el.remove());
  let css = "";
  doc.querySelectorAll("style").forEach(s=>{ css += s.textContent + "\n"; });
  return (css?`<style>${css}</style>`:"") + au.outerHTML;
}

window.toggleConteudo = async function(id){
  const row = document.getElementById("ativ-row-"+id);
  const painel = document.getElementById("painel-"+id);
  if(!row || !painel) return;

  const abrindo = !row.classList.contains("aberto");
  document.querySelectorAll(".ativ-row.aberto").forEach(el=>{ if(el!==row) el.classList.remove("aberto"); });
  row.classList.toggle("aberto", abrindo);
  if(!abrindo) return;

  if(painel.dataset.loaded === "1") return;
  const refUrl = painel.dataset.ref;
  painel.innerHTML = `<div class="carregando">Carregando conteúdo…</div>`;
  try{
    let html = _conteudoCache[refUrl];
    if(html === undefined){
      const r = await fetch(refUrl, {cache:"no-cache"});
      if(!r.ok) throw new Error(r.status);
      html = await r.text();
      _conteudoCache[refUrl] = html;
    }
    painel.innerHTML = `<div class="sheet"><div class="sheet-body content-light">${extrairMiolo(html)}</div></div>`;
    painel.dataset.loaded = "1";
    painel.querySelectorAll(".au-nav a").forEach(el=>{
      el.addEventListener("click", e=>{ const t=painel.querySelector(el.getAttribute("href")); if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth",block:"start"});} });
    });
    row.scrollIntoView({behavior:"smooth", block:"nearest"});
  }catch(e){
    console.error(e);
    painel.innerHTML = `<div class="erro">Não foi possível carregar o material. Tente novamente mais tarde.</div>`;
  }
};

carregar();
</script>
