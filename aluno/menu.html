<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Início — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .ativ-liberada{display:flex;align-items:center;gap:16px;padding:18px 20px;background:linear-gradient(135deg,#EBF6FD,#F0F9FF);border:1.5px solid #BAE6FD;border-radius:var(--radius);margin-bottom:8px;}
    .ativ-icon{width:48px;height:48px;border-radius:12px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .ativ-icon svg{width:26px;height:26px;fill:#fff;}
    .ativ-info{flex:1;}.ativ-info h3{font-size:15px;font-weight:700;}.ativ-info p{font-size:12px;color:var(--text-muted);margin-top:3px;}
    .ativ-vazia{display:flex;align-items:center;gap:12px;padding:18px 20px;background:var(--bg);border:1.5px dashed var(--border);border-radius:var(--radius);color:var(--text-muted);font-size:13px;}
    .ativ-vazia svg{width:22px;height:22px;fill:var(--border);flex-shrink:0;}
    .resumo-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,var(--orange-pale),transparent);border-bottom:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;}
    .resumo-header svg{width:15px;height:15px;fill:var(--orange);}
    .resumo-header span{font-size:13px;font-weight:700;}
    .resumo-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;}
    .hist-aluno-label{display:flex;align-items:center;gap:7px;margin:14px 0 8px;font-size:12px;font-weight:700;color:var(--text-muted);}
    .hist-aluno-label:first-child{margin-top:0;}
    .hist-aluno-label svg{width:13px;height:13px;fill:currentColor;}
    .hist-check{width:26px;height:26px;border-radius:50%;background:var(--green-pale);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .hist-check svg{width:13px;height:13px;fill:var(--green);}
    .ativ-chip{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:9px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:500;color:var(--text-muted);}
    .ativ-chip svg{width:16px;height:16px;fill:currentColor;flex-shrink:0;}
    .ativ-chip.liberada{border-color:#BAE6FD;background:var(--blue-pale);color:var(--blue-dark);}
    .ativ-chip.encerrada{border-color:var(--border);background:var(--bg);color:var(--text-muted);opacity:.6;text-decoration:line-through;}
    /* Top 3 cards */
    .top3-card{border-radius:12px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;position:relative;overflow:visible;}
    .top3-card:last-child{margin-bottom:0;}
    .top3-nome{font-size:15px;font-weight:800;color:#fff;line-height:1.2;}
    .top3-turma{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px;}
    .top3-pts{font-size:20px;font-weight:800;color:#fff;flex-shrink:0;text-align:right;line-height:1;}
    .top3-pts-label{font-size:10px;color:rgba(255,255,255,.7);}
    /* Banner */
    .banner-top3{border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:#fff;}
    @media(max-width:480px){
      .ativ-liberada{flex-wrap:wrap;gap:10px;padding:14px 14px}
      .ativ-liberada .ativ-info{width:100%}
      .ativ-liberada .btn{width:100%;min-height:52px;font-size:15px;justify-content:center}
      .ativ-liberada>span{margin-left:auto;font-size:12px}
      .mini-stats{grid-template-columns:repeat(3,1fr)}
      .mini-stat{padding:10px 4px}
      .mini-stat-value{font-size:17px}
      .top3-card{padding:11px 13px;gap:8px}
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title" id="topbar-title">Olá!</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
      <div class="topbar-right">
        <div class="avatar avatar-orange" id="avatar-initials">?</div>
      </div>
    </div>
    <div class="content" id="content">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div>
    </div>
  </div>
</div>

<script>(()=>{const t=localStorage.getItem('tema');if(t==='escuro')document.documentElement.setAttribute('data-theme','dark');})()</script>
<script type="module">
import { LISTA_ATIVIDADES } from "/js/constants.js";
import { getResultados, getLiberadasParaTurma, getAlunoPreferencia, getConquistasByAluno } from "/js/db.js";
import { requireAluno, renderSidebarAluno, clearSession } from "/js/auth.js";
import { saveRankPos, applyTopRankVisuals } from "/js/toprank.js";
import { initTopNotif } from "/js/topnotif.js";

const sess = requireAluno("/index.html");
if (!sess) throw new Error("não autenticado");

renderSidebarAluno("sidebar", "inicio");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const { alunos, turma } = sess;

// Robótica sidebar item (condicional)
getAlunoPreferencia(turma, alunos[0], 'robotica').then(isRob => {
  if (!isRob) return;
  const nav = document.querySelector('#sidebar .sidebar-nav');
  if (!nav) return;
  const div = document.createElement('div'); div.className = 'nav-divider'; nav.appendChild(div);
  const a = document.createElement('a');
  a.className = 'nav-item'; a.href = '/aluno/robotica.html';
  a.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 9V7c0-1.1-.9-2-2-2h-3c0-1.66-1.34-3-3-3S9 3.34 9 5H6c-1.1 0-2 .9-2 2v2c-1.66 0-3 1.34-3 3s1.34 3 3 3v4c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4c1.66 0 3-1.34 3-3s-1.34-3-3-3zm-2 10H6V7h12v12zm-9-6c-.83 0-1.5-.67-1.5-1.5S8.17 10 9 10s1.5.67 1.5 1.5S9.83 13 9 13zm6 0c-.83 0-1.5-.67-1.5-1.5S14.17 10 15 10s1.5.67 1.5 1.5S15.83 13 15 13z"/></svg>🤖 Robótica`;
  nav.appendChild(a);
}).catch(() => {});

// Sync tema do Firebase (não-bloqueante)
getAlunoPreferencia(turma, alunos[0], 'tema').then(t => {
  if (t && t !== localStorage.getItem('tema')) {
    localStorage.setItem('tema', t);
    document.documentElement.setAttribute('data-theme', t === 'escuro' ? 'dark' : '');
  }
});
document.getElementById("topbar-title").textContent = `Olá, ${alunos[0]}${alunos.length>1?' e '+alunos[1]:''}! 👋`;
document.getElementById("topbar-sub").textContent   = `Turma ${turma} · Bom trabalho hoje!`;
document.getElementById("avatar-initials").textContent = alunos[0][0].toUpperCase();

const [todos, liberadas, conquistasAluno] = await Promise.all([getResultados(), getLiberadasParaTurma(turma), getConquistasByAluno(alunos[0])]);

// ── Ranking (média por atividade) ─────────────────────────────
function buildRankingMedia(lista) {
  const melhor = {};
  for (const r of lista) {
    if (!r.concluido || !r.aluno) continue;
    if (!melhor[r.aluno]) melhor[r.aluno] = { aluno: r.aluno, turma: r.turma || '?', porAtiv: {} };
    const pts = r.pontuacao || 0;
    const prev = melhor[r.aluno].porAtiv[r.atividade] || 0;
    if (pts > prev) melhor[r.aluno].porAtiv[r.atividade] = pts;
  }
  return Object.values(melhor).map(a => {
    const vals = Object.values(a.porAtiv);
    const total = vals.reduce((s, v) => s + v, 0);
    const media = vals.length ? Math.round(total / vals.length) : 0;
    return { aluno: a.aluno, turma: a.turma, total, media };
  }).sort((a, b) => b.total - a.total);
}
const rankAll   = buildRankingMedia(todos);
const rankTurma = rankAll.filter(r => r.turma === turma);
const top3Geral = rankAll.slice(0, 9);
saveRankPos(alunos, rankAll);
applyTopRankVisuals();
initTopNotif({ mode: 'aluno', alunoNome: alunos[0] });

// ── Mini sparkline SVG ────────────────────────────────────────
function miniSparkline(nome, atividade) {
  const allSess = todos
    .filter(r => r.aluno === nome && r.concluido && r.atividade === atividade)
    .sort((a, b) => (a.criadoEm||0) - (b.criadoEm||0));
  if (allSess.length < 2) return '';
  const pts = allSess.map(r => r.pontuacao_bruta || r.pontuacao || 0);
  const maxV = Math.max(...pts, 1);
  const W = 56, H = 22, m = 2;
  const n = pts.length;
  const xP = i => m + (n > 1 ? (i / (n - 1)) * (W - 2*m) : (W - 2*m) / 2);
  const yP = v => m + (H - 2*m) - Math.min((v / maxV) * (H - 2*m), H - 2*m);
  const last = pts[pts.length - 1], first = pts[0];
  const color = last > first ? '#16A34A' : last < first ? '#DC2626' : '#6B7280';
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:56px;height:22px;flex-shrink:0;overflow:visible">`;
  if (n > 1) svg += `<polyline points="${pts.map((v,i) => `${xP(i)},${yP(v)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach((v, i) => { svg += `<circle cx="${xP(i)}" cy="${yP(v)}" r="2.5" fill="${color}"/>`; });
  svg += '</svg>';
  return svg;
}

// ── Tentativas esgotadas ──────────────────────────────────────
function tentativasEsgotadas(atividadeNome) {
  return alunos.some(nome =>
    todos.filter(r => r.aluno === nome && r.atividade === atividadeNome).length >= 2
  );
}

// ── Resumo por aluno ──────────────────────────────────────────
function resumoAluno(nome) {
  const regs = todos.filter(r => r.aluno === nome && r.concluido);
  const melhor = {};
  regs.forEach(r => { melhor[r.atividade] = Math.max(melhor[r.atividade]||0, r.pontuacao||0); });
  const vals     = Object.values(melhor);
  const totalPts = vals.reduce((s, v) => s + v, 0); // soma das melhores por atividade
  const acertos  = regs.reduce((a, r) => a + (r.acertos || 0), 0);
  const erros    = regs.reduce((a, r) => a + (r.erros   || 0), 0);
  const taxa     = (acertos + erros) > 0 ? Math.round(acertos / (acertos + erros) * 100) : 0;
  const posGeral = (rankAll.findIndex(r => r.aluno === nome) + 1) || '—';
  const posTurma = (rankTurma.findIndex(r => r.aluno === nome) + 1) || '—';
  return { totalPts, sessoes: regs.length, acertos, taxa, posGeral, posTurma, total_ativ: vals.length };
}

function ultimasAtividades(nome) {
  const all = todos.filter(r => r.aluno === nome && r.concluido);
  const bestByAtiv = {};
  for (const r of all) {
    const pts = r.pontuacao_bruta || r.pontuacao || 0;
    const prev = bestByAtiv[r.atividade];
    if (!prev || pts > (prev.pontuacao_bruta || prev.pontuacao || 0))
      bestByAtiv[r.atividade] = r;
  }
  return Object.values(bestByAtiv)
    .sort((a, b) => (b.pontuacao_bruta || b.pontuacao || 0) - (a.pontuacao_bruta || a.pontuacao || 0))
    .slice(0, 4);
}

// ── Banner (top 3 geral ou líder de turma) ───────────────────
const posGerais  = alunos.map(n => rankAll.findIndex(r => r.aluno === n) + 1).filter(p => p > 0);
const posTurmas  = alunos.map(n => rankTurma.findIndex(r => r.aluno === n) + 1).filter(p => p > 0);
const posGeralMin  = posGerais.length ? Math.min(...posGerais) : 99;
const posTurmaMin  = posTurmas.length ? Math.min(...posTurmas) : 99;

function bannerParticles() {
  return ['rgba(255,255,255,.55)','rgba(255,220,70,.55)','rgba(255,255,255,.38)','rgba(255,195,30,.48)','rgba(255,255,255,.45)'].map((c,i) => {
    const l=7+i*17, t=8+i*13, s=3+(i%3), d=(2.2+i*.55).toFixed(1), dl=(i*.62).toFixed(1);
    return `<div class="banner-particle" style="background:${c};left:${l}%;top:${t}%;width:${s}px;height:${s}px;--bp-dur:${d}s;--bp-delay:${dl}s"></div>`;
  }).join('');
}

const BANNER_BG = ['linear-gradient(135deg,#F59E0B,#D97706)','linear-gradient(135deg,#9CA3AF,#6B7280)','linear-gradient(135deg,#CD853F,#92400E)'];
let bannerHtml = '';
if (posGeralMin <= 3) {
  const icone = ['🥇','🥈','🥉'][posGeralMin - 1];
  bannerHtml = `<div class="banner-top3" style="background:${BANNER_BG[posGeralMin-1]};position:relative;overflow:hidden">
    ${bannerParticles()}
    <span class="crown-anim" style="font-size:30px;flex-shrink:0">${icone}</span>
    <div>
      <div style="font-size:15px;font-weight:800">Você está em ${posGeralMin}º lugar geral!</div>
      <div style="font-size:12px;opacity:.85;margin-top:2px;font-weight:400">Continue assim! 🔥</div>
    </div>
  </div>`;
} else if (posTurmaMin === 1) {
  bannerHtml = `<div class="banner-top3" style="background:linear-gradient(135deg,#3B82F6,#1D4ED8)">
    <span style="font-size:28px;flex-shrink:0">🏫</span>
    <div>
      <div style="font-size:15px;font-weight:800">Você lidera sua turma!</div>
      <div style="font-size:12px;opacity:.85;margin-top:2px;font-weight:400">Ótimo trabalho! 💪</div>
    </div>
  </div>`;
}

// ── Top 3 cards ───────────────────────────────────────────────
const TOP3_BG = [
  'linear-gradient(135deg,#F59E0B,#D97706)',
  'linear-gradient(135deg,#9CA3AF,#6B7280)',
  'linear-gradient(135deg,#CD853F,#92400E)',
];
// Group top3Geral into up to 3 distinct score positions
const top3Groups = [];
{ let gPos = 1, gi = 0;
  while (gi < top3Geral.length && top3Groups.length < 3) {
    const score = top3Geral[gi].total;
    let gj = gi + 1;
    while (gj < top3Geral.length && top3Geral[gj].total === score) gj++;
    top3Groups.push({ pos: gPos, students: top3Geral.slice(gi, gj), score });
    gPos += (gj - gi); gi = gj;
  }
}
const top3Html = top3Groups.length ? top3Groups.map((g, i) => {
  const glowClass = ['glow-gold','glow-silver','glow-bronze'][i];
  const trophy = ['🥇','🥈','🥉'][i];
  const crown = i === 0 ? `<span class="crown-anim" style="font-size:30px;position:absolute;top:-22px;left:50%;transform:translateX(-50%);filter:drop-shadow(0 2px 8px rgba(250,184,0,.6))">👑</span>` : '';
  const sparkles = i === 0 ? `<div style="position:absolute;top:5px;right:40px;display:flex;gap:3px;pointer-events:none">
    ${['✨','⭐','✨'].map((s,j)=>`<span class="sparkle-p" style="position:static;font-size:9px;--sd:${1.4+j*.4}s;--delay:${j*.3}s">${s}</span>`).join('')}
  </div>` : '';
  let namesHtml;
  if (g.students.length <= 1) {
    const p = g.students[0];
    const isMe = alunos.includes(p.aluno);
    namesHtml = `<div><div class="top3-nome">${p.aluno}${isMe ? ' ★' : ''}</div><div class="top3-turma">Turma ${p.turma}</div></div>`;
  } else {
    namesHtml = `<div style="display:flex;align-items:flex-start;gap:0;flex:1;min-width:0">${
      g.students.map((p, ni) => {
        const isMe = alunos.includes(p.aluno);
        const vsep = ni < g.students.length - 1
          ? `<div style="width:1px;background:rgba(255,255,255,.35);align-self:stretch;margin:0 8px;flex-shrink:0"></div>` : '';
        return `<div style="flex:1;min-width:0"><div class="top3-nome" style="font-size:13px">${p.aluno}${isMe ? ' ★' : ''}</div><div class="top3-turma">Turma ${p.turma}</div></div>${vsep}`;
      }).join('')
    }</div>`;
  }
  return `<div class="top3-card ${glowClass}" style="background:${TOP3_BG[i]};position:relative${i === 0 ? ';margin-top:22px' : ''}">
    ${crown}${sparkles}
    <div style="font-size:48px;flex-shrink:0">${trophy}</div>
    <div style="flex:1;min-width:0">${namesHtml}</div>
    <div style="text-align:right;flex-shrink:0;white-space:nowrap">
      <div class="top3-pts">${g.score}<span style="font-size:12px;font-weight:600;margin-left:2px">pts</span></div>
    </div>
  </div>`;
}).join('')
: '<p style="font-size:13px;color:var(--text-muted);padding:6px 0">Nenhum resultado ainda.</p>';

// ── Render ────────────────────────────────────────────────────
const liberadasAtivas = liberadas.filter(l => l.status !== 'encerrada');
const conteudo = document.getElementById("content");
conteudo.innerHTML = `
${bannerHtml}
<div class="grid-2">
  <div>
    <div class="card${liberadasAtivas.length ? ' card-pulse' : ''}">
      <div class="section-label" style="color:#F59E0B">
        <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
        Atividade Liberada
      </div>
      ${liberadasAtivas.length ? liberadasAtivas.map(lib => {
        const esgotado = tentativasEsgotadas(lib.atividade);
        return `<div class="ativ-liberada">
          <div class="ativ-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          <div class="ativ-info">
            <h3>${lib.atividade}</h3>
            <p>${Math.round(lib.percentual??100)}% da nota · ${lib.tempo_maximo ? Math.round(lib.tempo_maximo/60) : 7} min</p>
          </div>
          ${(() => {
            const ativDef = LISTA_ATIVIDADES.find(a => a.nome === lib.atividade);
            const modoEfetivo = lib.modo || ativDef?.modo || 'classico';
            const url = modoEfetivo === 'competicao_plus'
              ? `/aluno/competicao_plus.html?ativ=${encodeURIComponent(lib.atividade)}`
              : modoEfetivo === 'competicao'
              ? `/aluno/competicao.html?ativ=${encodeURIComponent(lib.atividade)}`
              : `/aluno/jogar.html?ativ=${encodeURIComponent(lib.atividade)}`;
            const ehComp = modoEfetivo === 'competicao' || modoEfetivo === 'competicao_plus';
            if (!ehComp && esgotado)
              return `<span style="font-size:12px;font-weight:600;color:var(--text-muted);white-space:nowrap">Tentativas<br>esgotadas</span>`;
            return `<a href="${url}" class="btn btn-blue">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Iniciar
            </a>`;
          })()}
        </div>`;
      }).join('') : `
      <div class="ativ-vazia">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        Nenhuma atividade liberada no momento. Aguarde o professor.
      </div>`}
    </div>

    <div class="card">
      <div class="section-label" style="color:var(--orange)">
        <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21L13 13.04V8h-1z"/></svg>
        Últimas Atividades Realizadas
      </div>
      ${alunos.map(a => {
        const hist = ultimasAtividades(a);
        return `<div class="hist-aluno-label">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>${a}
        </div>
        ${hist.length ? hist.map(r => `
          <div class="list-row" style="align-items:center">
            <div class="hist-check"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div style="flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.atividade}</div>
            ${miniSparkline(a, r.atividade)}
            <div style="font-size:13px;font-weight:700;color:var(--gold);flex-shrink:0">${r.pontuacao_bruta||r.pontuacao||0} pts</div>
          </div>`).join('') : '<p style="font-size:13px;color:var(--text-muted);padding:6px 0 10px">Nenhuma atividade realizada ainda.</p>'}`;
      }).join('')}
    </div>
  </div>

  <div>
    <div class="card" style="margin-bottom:14px">
      <div class="section-label" style="color:var(--blue)">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
        Resumo de Desempenho
      </div>
      ${alunos.map(a => {
        const r = resumoAluno(a);
        const geralColor = r.posGeral === 1 ? '#F59E0B' : r.posGeral === 2 ? '#9CA3AF' : r.posGeral === 3 ? '#CD853F' : 'var(--blue)';
        const turmaColor = r.posTurma === 1 ? '#F59E0B' : 'var(--orange)';
        const wrapStyle  = r.posGeral === 1 ? 'border-color:rgba(245,158,11,.4);background:linear-gradient(135deg,rgba(245,158,11,.07),transparent)' : '';
        const geralCrown = r.posGeral === 1 ? '<div style="font-size:10px;line-height:1;margin-bottom:1px">👑</div>' : '';
        const turmaCrown = r.posTurma === 1 ? '<div style="font-size:10px;line-height:1;margin-bottom:1px">👑</div>' : '';
        return `<div class="resumo-wrap" style="${wrapStyle}">
          <div class="resumo-header">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
            <span>${a}</span>
          </div>
          <div class="mini-stats">
            <div class="mini-stat"><div class="mini-stat-value" style="color:var(--gold);font-size:22px">${r.totalPts}</div><div class="mini-stat-label">Total pts</div></div>
            <div class="mini-stat"><div class="mini-stat-value" style="color:${turmaColor};font-size:22px">${turmaCrown}${r.posTurma === '—' ? '—' : '#'+r.posTurma}</div><div class="mini-stat-label">Na Turma</div></div>
            <div class="mini-stat"><div class="mini-stat-value" style="color:${geralColor};font-size:22px">${geralCrown}${r.posGeral === '—' ? '—' : '#'+r.posGeral}</div><div class="mini-stat-label">Geral</div></div>
            <div class="mini-stat"><div class="mini-stat-value" style="color:var(--green);font-size:22px">${r.sessoes}</div><div class="mini-stat-label">Sessões</div></div>
            <div class="mini-stat"><div class="mini-stat-value" style="color:var(--blue);font-size:22px">${r.acertos}</div><div class="mini-stat-label">✅ Acertos</div></div>
            <div class="mini-stat"><div class="mini-stat-value" style="color:var(--green);font-size:22px">${r.taxa}%</div><div class="mini-stat-label">📊 Taxa</div></div>
          </div>
        </div>`;
      }).join('')}
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="section-label" style="color:#F59E0B">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12V11c0 4.52-3.05 8.75-7 9.93-3.95-1.18-7-5.41-7-9.93V6.3l7-3.12z"/></svg>
        Top 3 Geral
      </div>
      ${top3Html}
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="section-label" style="color:#A855F7">
        <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm4.24 16L12 15.45 7.77 18l1.12-4.81-3.73-3.23 4.92-.42L12 5l1.92 4.53 4.92.42-3.73 3.23L16.23 18z"/></svg>
        Conquistas Recentes
      </div>
      ${(() => {
        const recentConquistas = conquistasAluno.slice(0, 3);
        return recentConquistas.length
          ? recentConquistas.map(c => `<div class="list-row">
              <div style="font-size:22px;flex-shrink:0">${c.icon || '🏆'}</div>
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:700">${c.nome || c.tipo}</div>
                <div style="font-size:11px;color:var(--text-muted)">${c.descricao || c.desc || ''} · ${c.atividade}</div>
              </div>
              <span style="font-size:11px;color:var(--text-muted);flex-shrink:0">${c.data || ''}</span>
            </div>`).join('')
            + (conquistasAluno.length > 3
              ? `<a href="/aluno/historico.html" class="btn btn-sm btn-ghost" style="width:100%;justify-content:center;margin-top:8px">Ver todas (${conquistasAluno.length})</a>`
              : '')
          : '<p style="font-size:13px;color:var(--text-muted);padding:4px 0 6px">Nenhuma conquista ainda.</p>';
      })()}
    </div>

    <div class="card">
      <div class="section-label">
        <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
        Atividades Disponíveis
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${LISTA_ATIVIDADES.map(a => {
          const lib = liberadas.find(l => l.atividade === a.nome);
          const encerrada = lib?.status === 'encerrada';
          const chipClass = encerrada ? ' encerrada' : lib ? ' liberada' : '';
          return `<div class="ativ-chip${chipClass}">
            <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
            ${a.nome}
            ${encerrada ? `<span class="badge badge-red" style="margin-left:auto">Encerrada</span>`
              : lib ? `<span class="badge badge-blue" style="margin-left:auto">${Math.round(lib.percentual??100)}%</span>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>
</div>`;
</script>
</body>
</html>
