<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Início — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  <style>
    .ativ-liberada{display:flex;align-items:center;gap:16px;padding:18px 20px;background:linear-gradient(135deg,#EBF6FD,#F0F9FF);border:1.5px solid #BAE6FD;border-radius:var(--radius);margin-bottom:8px;}
    .ativ-icon{width:48px;height:48px;border-radius:12px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .ativ-icon svg{width:26px;height:26px;fill:#fff;}
    .ativ-info{flex:1;}.ativ-info h3{font-size:15px;font-weight:700;}.ativ-info p{font-size:12px;color:var(--text-muted);margin-top:3px;}
    .ativ-vazia{display:flex;align-items:center;gap:12px;padding:18px 20px;background:var(--bg);border:1.5px dashed var(--border);border-radius:var(--radius);color:var(--text-muted);font-size:13px;}
    .ativ-vazia svg{width:22px;height:22px;fill:var(--border);flex-shrink:0;}
    .resumo-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,var(--orange-pale),transparent);border-bottom:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;}
    .resumo-header svg{width:15px;height:15px;fill:var(--orange);}
    .resumo-header span{font-size:13px;font-weight:700;}
    .resumo-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;}
    .hist-aluno-label{display:flex;align-items:center;gap:7px;margin:14px 0 8px;font-size:12px;font-weight:700;color:var(--text-muted);}
    .hist-aluno-label:first-child{margin-top:0;}
    .hist-aluno-label svg{width:13px;height:13px;fill:currentColor;}
    .hist-check{width:26px;height:26px;border-radius:50%;background:var(--green-pale);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .hist-check svg{width:13px;height:13px;fill:var(--green);}
    .ativ-chip{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:9px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:500;color:var(--text-muted);}
    .ativ-chip svg{width:16px;height:16px;fill:currentColor;flex-shrink:0;}
    .ativ-chip.liberada{border-color:#BAE6FD;background:var(--blue-pale);color:var(--blue-dark);}
    .ativ-chip.encerrada{border-color:var(--border);background:var(--bg);color:var(--text-muted);opacity:.6;text-decoration:line-through;}
    /* Top 3 cards */
    .top3-card{border-radius:12px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;position:relative;overflow:visible;}
    .top3-card:last-child{margin-bottom:0;}
    .top3-nome{font-size:13px;font-weight:800;color:#fff;line-height:1.2;}
    .top3-turma{font-size:10px;color:rgba(255,255,255,.75);margin-top:2px;}
    .top3-pts{font-size:16px;font-weight:800;color:#fff;flex-shrink:0;text-align:right;line-height:1;}
    .top3-pts-label{font-size:10px;color:rgba(255,255,255,.7);}
    /* Banner */
    .banner-top3{border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:#fff;}
    .conq-tip{position:fixed;background:#1E293B;color:#F1F5F9;padding:8px 12px;border-radius:10px;font-size:12px;pointer-events:none;z-index:9999;max-width:220px;box-shadow:0 4px 16px rgba(0,0,0,.35);opacity:0;transition:opacity .15s;}
    .conq-tip.show{opacity:1;}
    .conq-tip-nome{font-weight:700;font-size:13px;margin-bottom:2px;}
    .conq-tip-desc{font-size:11px;opacity:.8;}
    @keyframes fadeSlideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .pill{padding:5px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:all .15s;}
    .pill.on{border-color:var(--blue);background:var(--blue);color:#fff;}
    .game-card-link{transition:background .15s;}
    .game-card-link:hover{background:rgba(127,119,221,.07)!important;}
    [data-theme="dark"] .game-card-link:hover{background:rgba(127,119,221,.12)!important;}
    @media(max-width:480px){
      .ativ-liberada{flex-wrap:wrap;gap:10px;padding:14px 14px}
      .ativ-liberada .ativ-info{width:100%}
      .ativ-liberada .btn{width:100%;min-height:52px;font-size:15px;justify-content:center}
      .ativ-liberada>span{margin-left:auto;font-size:12px}
      .mini-stats{grid-template-columns:repeat(3,1fr)}
      .mini-stat{padding:10px 4px}
      .mini-stat-value{font-size:17px}
      .top3-card{padding:8px 10px;gap:7px}
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title" id="topbar-title">Olá!</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
      <div class="topbar-right">
        <div class="avatar-wrap">
          <div class="avatar avatar-orange" id="avatar-initials" onclick="toggleAvatarMenu()">?</div>
          <div class="avatar-menu" id="avatar-menu">
            <a href="/aluno/config.html" class="avatar-menu-item">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
              Configurações
            </a>
            <button class="avatar-menu-item avatar-menu-danger" onclick="sair()">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
              Sair
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="content" id="content">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div>
    </div>
  </div>
</div>

<script>(()=>{const t=localStorage.getItem('tema');if(t==='escuro')document.documentElement.setAttribute('data-theme','dark');})()</script>
<script type="module">
import { LISTA_ATIVIDADES } from "/js/constants.js";
import { getResultados, getLiberadasParaTurma, getAlunoPreferencia, getConquistasByAluno } from "/js/db.js";
import { CONQUISTAS } from "/js/conquistas.js";
import { requireAluno, renderSidebarAluno, clearSession } from "/js/auth.js";
import { saveRankPos, applyTopRankVisuals } from "/js/toprank.js";
import { initAvBanner } from "/js/avaliacao_banner.js";
import { initTopNotif } from "/js/topnotif.js";
import { db } from "/js/firebase-config.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const sess = requireAluno("/index.html");
if (!sess) throw new Error("não autenticado");

renderSidebarAluno("sidebar", "inicio");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const { alunos, turma } = sess;

// Robótica sidebar item (condicional) — atualiza cache localStorage para todas as páginas
getAlunoPreferencia(turma, alunos[0], 'robotica').then(isRob => {
  localStorage.setItem('sm_pref_robotica', isRob ? '1' : '0');
  if (!isRob) return;
  // Se já foi renderizado pelo auth.js via cache localStorage, não duplica
  if (document.querySelector('#sidebar a[href="/aluno/robotica.html"]')) return;
  const nav = document.querySelector('#sidebar .sidebar-nav');
  if (!nav) return;
  const div = document.createElement('div'); div.className = 'nav-divider'; nav.appendChild(div);
  const a = document.createElement('a');
  a.className = 'nav-item'; a.href = '/aluno/robotica.html';
  a.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 9V7c0-1.1-.9-2-2-2h-3c0-1.66-1.34-3-3-3S9 3.34 9 5H6c-1.1 0-2 .9-2 2v2c-1.66 0-3 1.34-3 3s1.34 3 3 3v4c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4c1.66 0 3-1.34 3-3s-1.34-3-3-3zm-2 10H6V7h12v12zm-9-6c-.83 0-1.5-.67-1.5-1.5S8.17 10 9 10s1.5.67 1.5 1.5S9.83 13 9 13zm6 0c-.83 0-1.5-.67-1.5-1.5S14.17 10 15 10s1.5.67 1.5 1.5S15.83 13 15 13z"/></svg>🤖 Robótica`;
  nav.appendChild(a);
}).catch(() => {});

// Sync tema do Firebase (não-bloqueante)
getAlunoPreferencia(turma, alunos[0], 'tema').then(t => {
  if (t && t !== localStorage.getItem('tema')) {
    localStorage.setItem('tema', t);
    document.documentElement.setAttribute('data-theme', t === 'escuro' ? 'dark' : '');
  }
});
document.getElementById("topbar-title").textContent = `Olá, ${alunos[0]}${alunos.length>1?' e '+alunos[1]:''}! 👋`;
document.getElementById("topbar-sub").textContent   = `Turma ${turma} · Bom trabalho hoje!`;
document.getElementById("avatar-initials").textContent = alunos[0][0].toUpperCase();

const tabuadaUid = (turma + '_' + alunos[0]).replace(/[.#$\[\]/\s]/g, '_');
const [todosRaw, liberadas, conquistasAluno, tabuadaSnap] = await Promise.all([
  getResultados(),
  getLiberadasParaTurma(turma),
  getConquistasByAluno(alunos[0]),
  get(ref(db, `tabuada_niveis/${tabuadaUid}`)).catch(() => null),
]);
const nivelTabuada = tabuadaSnap?.exists() ? (tabuadaSnap.val().melhor_nivel || tabuadaSnap.val().nivel_atual || 1) : 1;
const todos = todosRaw.filter(r => !r.modo_teste && r.aluno !== 'PROFESSOR_TESTE');
initAvBanner(turma, alunos[0], liberadas);

// ── Avaliação+ controle ───────────────────────────────────────
const DURACAO_GLOBAL_AV  = 30 * 60 * 1000;
const MIN_TENT_AV_MS     = 8 * 60 * 1000;
const MAX_TENT_AV        = 3;
function avKey(s) {
  return btoa(unescape(encodeURIComponent(s))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
}
const controleAv = {};
const avPlusLibs = liberadas.filter(l => l.modo === 'avaliacao_plus' && l.status !== 'encerrada');
if (avPlusLibs.length && alunos.length) {
  await Promise.all(avPlusLibs.map(async l => {
    try {
      const k = avKey(turma + '|' + l.atividade);
      const snap = await get(ref(db, `avaliacao_controle/${k}/${avKey(alunos[0])}`));
      controleAv[l.atividade] = snap.exists() ? snap.val() : null;
    } catch(e) {}
  }));
}

// ── Ranking (média por atividade) ─────────────────────────────
function buildRankingMedia(lista) {
  const melhor = {};
  for (const r of lista) {
    if (!r.concluido || !r.aluno) continue;
    if (!melhor[r.aluno]) melhor[r.aluno] = { aluno: r.aluno, turma: r.turma || '?', porAtiv: {} };
    const pts = r.pontuacao || 0;
    const prev = melhor[r.aluno].porAtiv[r.atividade] || 0;
    if (pts > prev) melhor[r.aluno].porAtiv[r.atividade] = pts;
  }
  return Object.values(melhor).map(a => {
    const vals = Object.values(a.porAtiv);
    const total = vals.reduce((s, v) => s + v, 0);
    const media = vals.length ? Math.round(total / vals.length) : 0;
    return { aluno: a.aluno, turma: a.turma, total, media };
  }).sort((a, b) => b.total - a.total);
}
const rankAll   = buildRankingMedia(todos);
const rankTurma = rankAll.filter(r => r.turma === turma);
const top3Geral = rankAll.slice(0, 9);
saveRankPos(alunos, rankAll);
applyTopRankVisuals();
initTopNotif({ mode: 'aluno', alunoNome: alunos[0] });

// ── Mini sparkline SVG ────────────────────────────────────────
function miniSparkline(nome, atividade) {
  const allSess = todos
    .filter(r => r.aluno === nome && r.concluido && r.atividade === atividade)
    .sort((a, b) => (a.criadoEm||0) - (b.criadoEm||0));
  if (allSess.length < 2) return '';
  const pts = allSess.map(r => r.pontuacao_bruta || r.pontuacao || 0);
  const maxV = Math.max(...pts, 1);
  const W = 56, H = 22, m = 2;
  const n = pts.length;
  const xP = i => m + (n > 1 ? (i / (n - 1)) * (W - 2*m) : (W - 2*m) / 2);
  const yP = v => m + (H - 2*m) - Math.min((v / maxV) * (H - 2*m), H - 2*m);
  const last = pts[pts.length - 1], first = pts[0];
  const color = last > first ? '#16A34A' : last < first ? '#DC2626' : '#6B7280';
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:56px;height:22px;flex-shrink:0;overflow:visible">`;
  if (n > 1) svg += `<polyline points="${pts.map((v,i) => `${xP(i)},${yP(v)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach((v, i) => { svg += `<circle cx="${xP(i)}" cy="${yP(v)}" r="2.5" fill="${color}"/>`; });
  svg += '</svg>';
  return svg;
}

// ── Tentativas esgotadas ──────────────────────────────────────
function tentativasEsgotadas(atividadeNome) {
  return alunos.some(nome =>
    todos.filter(r => r.aluno === nome && r.atividade === atividadeNome).length >= 2
  );
}

// ── Resumo por aluno ──────────────────────────────────────────
function resumoAluno(nome) {
  const regs = todos.filter(r => r.aluno === nome && r.concluido);
  const melhor = {};
  regs.forEach(r => { melhor[r.atividade] = Math.max(melhor[r.atividade]||0, r.pontuacao||0); });
  const vals     = Object.values(melhor);
  const totalPts = vals.reduce((s, v) => s + v, 0); // soma das melhores por atividade
  const acertos  = regs.reduce((a, r) => a + (r.acertos || 0), 0);
  const erros    = regs.reduce((a, r) => a + (r.erros   || 0), 0);
  const taxa     = (acertos + erros) > 0 ? Math.round(acertos / (acertos + erros) * 100) : 0;
  const posGeral = (rankAll.findIndex(r => r.aluno === nome) + 1) || '—';
  const posTurma = (rankTurma.findIndex(r => r.aluno === nome) + 1) || '—';
  return { totalPts, sessoes: regs.length, acertos, taxa, posGeral, posTurma, total_ativ: vals.length };
}

function ultimasAtividades(nome) {
  const all = todos.filter(r => r.aluno === nome && r.concluido);
  const bestByAtiv = {};
  for (const r of all) {
    const pts = r.pontuacao_bruta || r.pontuacao || 0;
    const prev = bestByAtiv[r.atividade];
    if (!prev || pts > (prev.pontuacao_bruta || prev.pontuacao || 0))
      bestByAtiv[r.atividade] = r;
  }
  return Object.values(bestByAtiv)
    .sort((a, b) => (b.pontuacao_bruta || b.pontuacao || 0) - (a.pontuacao_bruta || a.pontuacao || 0))
    .slice(0, 4);
}

// ── Banner (top 3 geral ou líder de turma) ───────────────────
const posGerais  = alunos.map(n => rankAll.findIndex(r => r.aluno === n) + 1).filter(p => p > 0);
const posTurmas  = alunos.map(n => rankTurma.findIndex(r => r.aluno === n) + 1).filter(p => p > 0);
const posGeralMin  = posGerais.length ? Math.min(...posGerais) : 99;
const posTurmaMin  = posTurmas.length ? Math.min(...posTurmas) : 99;

function bannerParticles() {
  return ['rgba(255,255,255,.55)','rgba(255,220,70,.55)','rgba(255,255,255,.38)','rgba(255,195,30,.48)','rgba(255,255,255,.45)'].map((c,i) => {
    const l=7+i*17, t=8+i*13, s=3+(i%3), d=(2.2+i*.55).toFixed(1), dl=(i*.62).toFixed(1);
    return `<div class="banner-particle" style="background:${c};left:${l}%;top:${t}%;width:${s}px;height:${s}px;--bp-dur:${d}s;--bp-delay:${dl}s"></div>`;
  }).join('');
}

const BANNER_BG = ['linear-gradient(135deg,#F59E0B,#D97706)','linear-gradient(135deg,#9CA3AF,#6B7280)','linear-gradient(135deg,#CD853F,#92400E)'];
let bannerHtml = '';
if (posGeralMin <= 3) {
  const icone = ['🥇','🥈','🥉'][posGeralMin - 1];
  bannerHtml = `<div class="banner-top3" style="background:${BANNER_BG[posGeralMin-1]};position:relative;overflow:hidden">
    ${bannerParticles()}
    <span class="crown-anim" style="font-size:30px;flex-shrink:0">${icone}</span>
    <div>
      <div style="font-size:15px;font-weight:800">Você está em ${posGeralMin}º lugar geral!</div>
      <div style="font-size:12px;opacity:.85;margin-top:2px;font-weight:400">Continue assim! 🔥</div>
    </div>
  </div>`;
} else if (posTurmaMin === 1) {
  bannerHtml = `<div class="banner-top3" style="background:linear-gradient(135deg,#3B82F6,#1D4ED8)">
    <span style="font-size:28px;flex-shrink:0">🏫</span>
    <div>
      <div style="font-size:15px;font-weight:800">Você lidera sua turma!</div>
      <div style="font-size:12px;opacity:.85;margin-top:2px;font-weight:400">Ótimo trabalho! 💪</div>
    </div>
  </div>`;
}

// ── Top 3 cards ───────────────────────────────────────────────
const TOP3_BG = [
  'linear-gradient(135deg,#F59E0B,#D97706)',
  'linear-gradient(135deg,#9CA3AF,#6B7280)',
  'linear-gradient(135deg,#CD853F,#92400E)',
];
// Group top3Geral into up to 3 distinct score positions
const top3Groups = [];
{ let gPos = 1, gi = 0;
  while (gi < top3Geral.length && top3Groups.length < 3) {
    const score = top3Geral[gi].total;
    let gj = gi + 1;
    while (gj < top3Geral.length && top3Geral[gj].total === score) gj++;
    top3Groups.push({ pos: gPos, students: top3Geral.slice(gi, gj), score });
    gPos += (gj - gi); gi = gj;
  }
}
const top3Html = top3Groups.length ? top3Groups.map((g, i) => {
  const glowClass = ['glow-gold','glow-silver','glow-bronze'][i];
  const trophy = ['🥇','🥈','🥉'][i];
  let namesHtml;
  if (g.students.length <= 1) {
    const p = g.students[0];
    const isMe = alunos.includes(p.aluno);
    namesHtml = `<div><div class="top3-nome">${p.aluno}${isMe ? ' ★' : ''}</div><div class="top3-turma">Turma ${p.turma}</div></div>`;
  } else {
    namesHtml = `<div style="display:flex;align-items:flex-start;gap:0;flex:1;min-width:0">${
      g.students.map((p, ni) => {
        const isMe = alunos.includes(p.aluno);
        const vsep = ni < g.students.length - 1
          ? `<div style="width:1px;background:rgba(255,255,255,.35);align-self:stretch;margin:0 8px;flex-shrink:0"></div>` : '';
        return `<div style="flex:1;min-width:0"><div class="top3-nome">${p.aluno}${isMe ? ' ★' : ''}</div><div class="top3-turma">Turma ${p.turma}</div></div>${vsep}`;
      }).join('')
    }</div>`;
  }
  // Score block: crown + sparkles centered above the pts number (1st only)
  const scoreBlock = i === 0
    ? `<div style="text-align:right;flex-shrink:0;position:relative;padding-top:14px;white-space:nowrap">

// ── Helpers ───────────────────────────────────────────────────
function formatHa(ts) {
  if (!ts) return '';
  const t = +ts;
  if (!t || isNaN(t) || t < 946684800000) return '';
  const min = Math.floor((Date.now() - t) / 60000);
  if (isNaN(min) || min < 0) return 'agora mesmo';
  if (min < 1) return 'agora mesmo';
  if (min < 60) return `há ${min}min`;
  const h = Math.floor(min / 60), m = min % 60;
  if (h < 24) return m > 0 ? `há ${h}h ${m}min` : `há ${h}h`;
  const d = Math.floor(h / 24);
  return d === 1 ? 'há 1 dia' : `há ${d} dias`;
}

function calcTimeSinceTop3(aluno, allResults) {
  const sessions = [...allResults]
    .filter(r => r.concluido && r.criadoEm)
    .sort((a, b) => a.criadoEm - b.criadoEm);
  const best = {};
  let firstEntry = null;
  for (const r of sessions) {
    if (!r.aluno) continue;
    if (!best[r.aluno]) best[r.aluno] = {};
    const pts = r.pontuacao || 0;
    if ((best[r.aluno][r.atividade] || 0) < pts) best[r.aluno][r.atividade] = pts;
    const totals = Object.entries(best)
      .map(([a, byAtiv]) => ({ aluno: a, total: Object.values(byAtiv).reduce((s, v) => s + v, 0) }))
      .sort((a, b) => b.total - a.total);
    let pos = 0, lastT = null, curRank = 0;
    for (const t of totals) {
      if (t.total !== lastT) { pos++; lastT = t.total; }
      if (t.aluno === aluno) curRank = pos;
    }
    if (curRank >= 1 && curRank <= 3) { if (!firstEntry) firstEntry = r.criadoEm; }
    else firstEntry = null;
  }
  return firstEntry;
}

function computeProximaMeta(aluno) {
  const idx = rankAll.findIndex(r => r.aluno === aluno);
  if (idx < 0) return null;
  const userTotal = rankAll[idx].total;
  let dPos = 0, lastT = null, userRank = 0;
  for (const r of rankAll) {
    if (r.total !== lastT) { dPos++; lastT = r.total; }
    if (r.aluno === aluno) userRank = dPos;
  }
  if (userRank === 1) {
    const below = rankAll.find(r => r.total < userTotal);
    if (!below) return '🏆 Você lidera sem concorrentes!';
    return `🏆 Você lidera com ${userTotal - below.total}pts de vantagem!`;
  }
  let aboveTotal = null;
  for (let i = idx - 1; i >= 0; i--) {
    if (rankAll[i].total > userTotal) { aboveTotal = rankAll[i].total; break; }
  }
  if (aboveTotal === null) return null;
  const gap = aboveTotal - userTotal;
  const below = rankAll.find(r => r.total < userTotal);
  if (below && (userTotal - below.total) <= 15) {
    return `Você está a ${gap}pts do ${userRank - 1}º lugar · ⚠️ ${below.aluno} está ${userTotal - below.total}pts atrás`;
  }
  return `Você está a ${gap}pts do ${userRank - 1}º lugar!`;
}

function getModoEfetivo(r) {

function renderHistSessoes(nome, filtroAtiv) {
  const all = todos.filter(r => r.aluno === nome && r.concluido);
  const makeRow = (r, labelOverride, showNomeAtiv) => {
    const mE = getModoEfetivo(r);
    const isAv = mE === 'avaliacao_plus';
    const isComp = mE === 'competicao_plus' || mE === 'competicao';
    const modeTag = isAv
      ? `<span class="badge" style="background:#F5F3FF;color:#7C3AED;font-size:10px">📝 Avaliação+</span>`
      : isComp
      ? `<span class="badge badge-gold" style="font-size:10px">⚔️ Competição+</span>`
      : '';
    const scoreHtml = isAv
      ? `<div style="text-align:right;flex-shrink:0">
          <div style="font-size:13px;font-weight:700;color:var(--gold)">${r.pontuacao || 0} pts</div>
          <div style="font-size:11px;font-weight:700;color:#7C3AED">${typeof r.nota_quiz === 'number' ? r.nota_quiz.toFixed(1) : '—'}</div>
        </div>`
      : `<span style="font-size:13px;font-weight:700;color:var(--gold);flex-shrink:0">${r.pontuacao_bruta || r.pontuacao || 0} pts</span>`;
    const label = labelOverride || (showNomeAtiv ? r.atividade : r.atividade);
    return `<div class="list-row" style="align-items:center">
      <div class="hist-check"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${label}</div>
        ${modeTag ? `<div style="margin-top:3px">${modeTag}</div>` : ''}
      </div>
      ${filtroAtiv ? miniSparkline(nome, r.atividade) : ''}
      ${scoreHtml}
    </div>`;
  };

  if (filtroAtiv) {
    const sessoes = all
      .filter(r => r.atividade === filtroAtiv)
      .sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0))
      .slice(0, 10);
    if (!sessoes.length) return '<p style="font-size:13px;color:var(--text-muted);padding:6px 0 10px">Nenhuma sessão encontrada.</p>';
    return sessoes.map((r, i) => makeRow(r, i === 0 ? '→ Mais recente' : `Sessão ${sessoes.length - i}`, false)).join('');
  } else {
    const bestByAtiv = {};
    for (const r of all) {
      const pts = r.pontuacao_bruta || r.pontuacao || 0;
      const prev = bestByAtiv[r.atividade];
      if (!prev || pts > (prev.pontuacao_bruta || prev.pontuacao || 0)) bestByAtiv[r.atividade] = r;
    }
    const rows = Object.values(bestByAtiv)
      .sort((a, b) => (b.pontuacao_bruta || b.pontuacao || 0) - (a.pontuacao_bruta || a.pontuacao || 0));
    if (!rows.length) return '<p style="font-size:13px;color:var(--text-muted);padding:6px 0 10px">Nenhuma atividade realizada ainda.</p>';
    return rows.map(r => makeRow(r, r.atividade, true)).join('');
  }
}

            <div class="mini-stat"><div class="mini-stat-value" style="color:var(--gold);font-size:22px">${r.totalPts}</div><div class="mini-stat-label">Total pts</div></div>
            <div class="mini-stat"><div class="mini-stat-value" style="color:${turmaColor};font-size:22px">${turmaCrown}${r.posTurma === '—' ? '—' : '#'+r.posTurma}</div><div class="mini-stat-label">Na Turma</div></div>
            <div class="mini-stat"><div class="mini-stat-value" style="color:${geralColor};font-size:22px">${geralCrown}${r.posGeral === '—' ? '—' : '#'+r.posGeral}</div><div class="mini-stat-label">Geral</div></div>
            <div class="mini-stat"><div class="mini-stat-value" style="color:var(--green);font-size:22px">${r.sessoes}</div><div class="mini-stat-label">Sessões</div></div>
            <div class="mini-stat"><div class="mini-stat-value" style="color:var(--blue);font-size:22px">${r.acertos}</div><div class="mini-stat-label">✅ Acertos</div></div>
            <div class="mini-stat"><div class="mini-stat-value" style="color:var(--green);font-size:22px">${r.taxa}%</div><div class="mini-stat-label">📊 Taxa</div></div>
          </div>
        </div>`;
      }).join('')}
    </div>
    ${proximaMetaHtml ? `<div style="font-size:12px;color:var(--text-muted);text-align:center;padding:2px 8px 10px;line-height:1.7">${proximaMetaHtml}</div>` : ''}

    <div class="card" style="margin-bottom:14px;overflow:visible">
      <div class="section-label" style="color:#F59E0B">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12V11c0 4.52-3.05 8.75-7 9.93-3.95-1.18-7-5.41-7-9.93V6.3l7-3.12z"/></svg>
        Top 3 Geral
      </div>
      ${top3Html}
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="section-label" style="color:#A855F7">
        <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm4.24 16L12 15.45 7.77 18l1.12-4.81-3.73-3.23 4.92-.42L12 5l1.92 4.53 4.92.42-3.73 3.23L16.23 18z"/></svg>
        Conquistas Recentes
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">Você tem <strong style="color:var(--text)">${contX}</strong> de <strong style="color:var(--text)">${CONQUISTAS_POSSIVEIS}</strong> conquistas possíveis</div>
      ${(() => {
        const recentConquistas = conquFiltradas.slice(0, 3);
        return recentConquistas.length
          ? recentConquistas.map((c, i) => `<div class="list-row" style="animation:fadeSlideIn .3s ease both;animation-delay:${(i * 0.1).toFixed(1)}s"
              data-nome="${(c.nome || c.tipo).replace(/"/g,'&quot;')}" data-desc="${(c.descricao || c.desc || '').replace(/"/g,'&quot;')}">
              <div style="font-size:22px;flex-shrink:0">${c.icon || '🏆'}</div>
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:700">${c.nome || c.tipo}</div>
                <div style="font-size:11px;color:var(--text-muted)">${c.descricao || c.desc || ''} · ${c.atividade}</div>
              </div>
              <span style="font-size:11px;color:var(--text-muted);flex-shrink:0">${c.data || ''}</span>
            </div>`).join('')
            + (conquFiltradas.length > 3
              ? `<a href="/aluno/historico.html" class="btn btn-sm btn-ghost" style="width:100%;justify-content:center;margin-top:8px">Ver todas (${conquFiltradas.length})</a>`
              : '')
          : '<p style="font-size:13px;color:var(--text-muted);padding:4px 0 6px">Nenhuma conquista ainda. Continue jogando! 🚀</p>';
      })()}
    </div>

  </div>
</div>`;

// Tooltip event delegation for conquista badges
let _conqTip = null;
function getConqTip() {
  if (!_conqTip) {
    _conqTip = document.createElement('div');
    _conqTip.className = 'conq-tip';
    _conqTip.innerHTML = '<div class="conq-tip-nome"></div><div class="conq-tip-desc"></div>';
    document.body.appendChild(_conqTip);
  }
  return _conqTip;
}
function showConqTip(x, y, nome, desc) {
  const tip = getConqTip();
  tip.querySelector('.conq-tip-nome').textContent = nome;
  tip.querySelector('.conq-tip-desc').textContent = desc;
  tip.style.left = `${Math.min(x + 12, window.innerWidth - 230)}px`;
  tip.style.top  = `${Math.max(y - 60, 8)}px`;
  tip.classList.add('show');
}
function hideConqTip() { if (_conqTip) _conqTip.classList.remove('show'); }
let _touchConqTip;
conteudo.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-nome]');
  if (el) showConqTip(e.clientX, e.clientY, el.dataset.nome, el.dataset.desc || '');
});
conteudo.addEventListener('mousemove', e => {
  if (!_conqTip?.classList.contains('show')) return;
  const el = e.target.closest('[data-nome]');
  if (el) {
    _conqTip.style.left = `${Math.min(e.clientX + 12, window.innerWidth - 230)}px`;
    _conqTip.style.top  = `${Math.max(e.clientY - 60, 8)}px`;
  }
});
conteudo.addEventListener('mouseout', e => {
  if (e.target.closest('[data-nome]') && !e.relatedTarget?.closest('[data-nome]')) hideConqTip();
});
conteudo.addEventListener('touchstart', e => {
  const el = e.target.closest('[data-nome]');
  if (!el) return;
  const t = e.touches[0];
  _touchConqTip = setTimeout(() => showConqTip(t.clientX, t.clientY, el.dataset.nome, el.dataset.desc || ''), 400);
}, {passive: true});
conteudo.addEventListener('touchend', () => { clearTimeout(_touchConqTip); setTimeout(hideConqTip, 2500); }, {passive: true});
conteudo.addEventListener('touchcancel', () => clearTimeout(_touchConqTip), {passive: true});

window.toggleAvatarMenu = function() {
  document.getElementById('avatar-menu').classList.toggle('open');
};
document.addEventListener('click', function(e) {
  if (!e.target.closest('.avatar-wrap')) {
    document.getElementById('avatar-menu')?.classList.remove('open');
  }
});
</script>
</body>
</html>
