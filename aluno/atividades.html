<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atividades — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .ativ-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;display:flex;align-items:center;gap:18px;transition:border-color .2s,box-shadow .2s;}
    .ativ-card.liberada{border-color:#BAE6FD;background:linear-gradient(135deg,#EBF6FD,#fff);}
    .ativ-card.bloqueada{opacity:.6;}
    .ativ-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
    .ativ-dot.blue{background:var(--blue);}
    .ativ-dot.green{background:var(--green);}
    .ativ-dot.orange{background:var(--orange);}
    .ativ-nome{font-size:15px;font-weight:700;flex:1;}
    .ativ-info-row{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap;}
    .tent-info{font-size:11px;color:var(--text-muted);}
    .tent-info.warn{color:var(--red);}
    @media(max-width:560px){
      .ativ-card{flex-wrap:wrap;gap:10px;padding:14px}
      .ativ-card>div[style*="flex:1"]{width:100%}
      .ativ-card>.btn{width:100%;min-height:50px;font-size:15px;justify-content:center}
      .ativ-card>.badge{margin-left:auto}
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Atividades</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
      <div class="topbar-right">
        <div class="avatar-wrap">
          <div class="avatar avatar-orange" id="avatar-initials" onclick="toggleAvatarMenu()">?</div>
          <div class="avatar-menu" id="avatar-menu">
            <a href="/aluno/config.html" class="avatar-menu-item">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
              Configurações
            </a>
            <button class="avatar-menu-item avatar-menu-danger" onclick="sair()">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
              Sair
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="content" id="content">
      <div data-loading style="text-align:center;padding:60px;color:var(--text-muted)">Carregando…</div>
    </div>
  </div>
</div>
<script>(()=>{const t=localStorage.getItem("tema");if(t==="escuro")document.documentElement.setAttribute("data-theme","dark");})()</script>
<script type="module">
import { LISTA_ATIVIDADES, MAX_TENTATIVAS_ATIVIDADE } from "/js/constants.js";
import { contarTentativas, getLiberadasParaTurma, getAlunoPreferencia, getResultados } from "/js/db.js";
import { requireAluno, renderSidebarAluno, clearSession } from "/js/auth.js";
import { applyTopRankVisuals } from "/js/toprank.js";
import { initAvBanner } from "/js/avaliacao_banner.js";
import { db } from "/js/firebase-config.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const sess = requireAluno();
if (!sess) throw new Error();
renderSidebarAluno("sidebar", "atividades");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };
applyTopRankVisuals();

const { alunos, turma } = sess;
initAvBanner(turma, alunos[0]);

getAlunoPreferencia(turma, alunos[0], 'tema').then(t => {
  if (t && t !== localStorage.getItem('tema')) {
    localStorage.setItem('tema', t);
    document.documentElement.setAttribute('data-theme', t === 'escuro' ? 'dark' : '');
  }
});

getAlunoPreferencia(turma, alunos[0], 'robotica').then(isRob => {
  localStorage.setItem('sm_pref_robotica', isRob ? '1' : '0');
}).catch(() => {});
document.getElementById("topbar-sub").textContent = `Turma ${turma}`;
document.getElementById("avatar-initials").textContent = alunos[0][0].toUpperCase();

const content = document.getElementById("content");

// Timeout: after 6s show retry if still loading
const loadTimeout = setTimeout(() => {
  if (content.querySelector('[data-loading]')) {
    content.innerHTML = `<div class="card" style="text-align:center;padding:40px">
      <p style="color:var(--text-muted);margin-bottom:16px;font-size:14px">Não foi possível carregar as atividades.</p>
      <button onclick="location.reload()" class="btn btn-blue">Tentar novamente</button>
    </div>`;
  }
}, 6000);

const liberadas = await getLiberadasParaTurma(turma);
const liberadasMap = {};
for (const lib of liberadas) liberadasMap[lib.atividade] = lib;

// Identify classic (attempt-limited) activities
const classicAtivs = LISTA_ATIVIDADES.filter(ativ => {
  const _lib = liberadasMap[ativ.nome];
  const _modo = _lib?.modo || ativ.modo || 'classico';
  return _modo !== "competicao" && _modo !== "competicao_plus" && _modo !== "avaliacao_plus";
});

const bloqueios = {};

// Mark competition activities immediately (no limits)
for (const ativ of LISTA_ATIVIDADES) {
  if (!classicAtivs.includes(ativ)) {
    const _m = liberadasMap[ativ.nome]?.modo || ativ.modo || 'classico';
    bloqueios[ativ.nome] = { bloqueado: false, bloqueadoPor: [], minRest: 999, tentativas: {}, competicao: true, avaliacao: _m === 'avaliacao_plus' };
  }
}

// Fetch all attempt counts in parallel
if (classicAtivs.length && alunos.length) {
  const pairs = classicAtivs.flatMap(ativ => alunos.map(al => ({ ativ: ativ.nome, al })));
  const counts = await Promise.all(pairs.map(p => contarTentativas(p.al, p.ativ)));
  pairs.forEach(({ ativ, al }, idx) => {
    if (!bloqueios[ativ]) bloqueios[ativ] = { bloqueado: false, bloqueadoPor: [], minRest: 999, tentativas: {}, competicao: false };
    bloqueios[ativ].tentativas[al] = counts[idx];
  });
  for (const ativ of classicAtivs) {
    const tent = bloqueios[ativ.nome].tentativas;
    const bloqueadoPor = alunos.filter(al => (tent[al] || 0) >= MAX_TENTATIVAS_ATIVIDADE);
    const minRest = Math.max(0, MAX_TENTATIVAS_ATIVIDADE - Math.max(...alunos.map(al => tent[al] || 0)));
    bloqueios[ativ.nome].bloqueado    = bloqueadoPor.length > 0;
    bloqueios[ativ.nome].bloqueadoPor = bloqueadoPor;
    bloqueios[ativ.nome].minRest      = minRest;
  }
}

// Load avaliacao_plus controle data to know actual tentativas used
const MAX_TENT_AV = 3;
const MIN_TENT_AV_MS = 8 * 60 * 1000;
function avKey(s) {
  return btoa(unescape(encodeURIComponent(s))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
}
const controleAv = {};
const avPlusAtivs = LISTA_ATIVIDADES.filter(a => {
  const _m = liberadasMap[a.nome]?.modo || a.modo || 'classico';
  return _m === 'avaliacao_plus' && !!liberadasMap[a.nome];
});
if (avPlusAtivs.length && alunos.length) {
  await Promise.all(avPlusAtivs.map(async ativ => {
    try {
      const k = avKey(turma + '|' + ativ.nome);
      const snap = await get(ref(db, `avaliacao_controle/${k}/${avKey(alunos[0])}`));
      controleAv[ativ.nome] = snap.exists() ? snap.val() : null;
    } catch(e) {}
  }));
}
for (const ativ of avPlusAtivs) {
  const ctrl = controleAv[ativ.nome];
  const tentUsadas = ctrl?.tentativas_realizadas || 0;
  const gRestMs = ctrl ? Math.max(0, 30*60*1000 - (Date.now() - ctrl.inicio_global)) : 30*60*1000;
  bloqueios[ativ.nome].esgotada = tentUsadas >= MAX_TENT_AV || (!!ctrl && gRestMs < MIN_TENT_AV_MS);
  bloqueios[ativ.nome].tentUsadas = tentUsadas;
  bloqueios[ativ.nome].ctrl = ctrl;
}

clearTimeout(loadTimeout);

const todosResultados = await getResultados();
const realizadaMap = {};
for (const r of todosResultados) {
  if (!alunos.includes(r.aluno) || !r.concluido || r.modo_teste) continue;
  const prev = realizadaMap[r.atividade];
  if (!prev || (r.criadoEm || 0) > (prev.ts || 0)) realizadaMap[r.atividade] = { ts: r.criadoEm || 0 };
}
function formatTs(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0')
    + ' às ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
}

content.innerHTML = `
<div class="card">
  <div class="card-header">
    <div class="card-title">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
      Atividades Disponíveis
    </div>
    ${liberadas.length ? `<span class="badge badge-blue">${liberadas.length} liberada(s)</span>` : ''}
  </div>

  ${liberadas.length ? `
  <div class="alert alert-info" style="margin-bottom:16px">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
    ${liberadas.map(l=>`<strong>${l.atividade}</strong> (${Math.round(l.percentual??100)}%${l.tempo_maximo ? ' · '+Math.round(l.tempo_maximo/60)+'min' : ''})`).join(' &nbsp;·&nbsp; ')} disponíve${liberadas.length>1?'is':'l'} agora.
  </div>` : `
  <div class="alert alert-warn" style="margin-bottom:16px">
    <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
    Nenhuma atividade liberada no momento. Aguarde o professor.
  </div>`}

  ${LISTA_ATIVIDADES.map(ativ => {
    const isLib       = !!liberadasMap[ativ.nome];
    const lib         = liberadasMap[ativ.nome];
    const bloq        = bloqueios[ativ.nome];
    const isEncerrada = lib?.status === 'encerrada';
    const foiRealizada = !!realizadaMap[ativ.nome];
    const lastTs       = realizadaMap[ativ.nome]?.ts;
    const classes      = `ativ-card${isLib&&!isEncerrada?' liberada':''}${(bloq.bloqueado||(isEncerrada&&!foiRealizada))?' bloqueada':''}`;

    const modoEfetivo = lib?.modo || ativ.modo || 'classico';
    const url = modoEfetivo === 'avaliacao_plus'
      ? `/aluno/avaliacao_plus.html?ativ=${encodeURIComponent(ativ.nome)}`
      : modoEfetivo === 'competicao_plus'
      ? `/aluno/competicao_plus.html?ativ=${encodeURIComponent(ativ.nome)}`
      : modoEfetivo === 'competicao'
      ? `/aluno/competicao.html?ativ=${encodeURIComponent(ativ.nome)}`
      : `/aluno/jogar.html?ativ=${encodeURIComponent(ativ.nome)}`;

    let botao = '';
    if (foiRealizada) {
      botao = `<span class="badge badge-green">✅ Concluída</span>`;
    } else if (isEncerrada) {
      botao = `<span class="badge" style="color:#B45309;background:#FEF3C7;border-color:#FDE68A">⏰ Perdeu o prazo</span>`;
    } else if (!isLib) {
      botao = `<span class="badge" style="color:var(--text-muted);background:var(--bg);border-color:var(--border)">🔒 Não liberada</span>`;
    } else if (!bloq.competicao && bloq.bloqueado) {
      botao = `<span class="badge badge-red">Bloqueada</span>`;
    } else {
      botao = `<a href="${url}" class="btn btn-blue">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>▶ Disponível
      </a>`;
    }

    const tsSpan = foiRealizada && lastTs
      ? `<span class="tent-info" style="color:var(--green)">✅ Realizada em ${formatTs(lastTs)}</span>`
      : '';
    const tentInfos = !isLib && !foiRealizada
      ? `<span class="tent-info">Aguarde a liberação pela professora</span>`
      : (isEncerrada && !foiRealizada)
      ? `<span class="tent-info" style="color:#B45309">Prazo encerrado · atividade não realizada</span>`
      : isEncerrada
      ? ''
      : bloq.avaliacao
      ? (() => {
          const ctrl = bloq.ctrl;
          const tentUsadas = bloq.tentUsadas || 0;
          let timerInfo = '';
          if (ctrl?.inicio_global) {
            const ini = new Date(ctrl.inicio_global);
            const fim = new Date(ctrl.inicio_global + 30*60*1000);
            const fH = d => d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
            timerInfo = ` · ⏱ ${fH(ini)}–${fH(fim)}`;
          }
          return `<span class="tent-info" style="color:#7C3AED">📝 Avaliação+ · ${tentUsadas}/${MAX_TENT_AV} tentativas${timerInfo}</span>`;
        })()
      : bloq.competicao
      ? `<span class="tent-info" style="color:var(--blue)">Modo competição · ao vivo</span>`
      : alunos.map(al => {
          const usado = bloq.tentativas[al] || 0;
          const rest  = Math.max(0, MAX_TENTATIVAS_ATIVIDADE - usado);
          return rest === 0
            ? `<span class="tent-info warn">${al}: bloqueado</span>`
            : `<span class="tent-info">${al}: ${rest} tent. restante(s)</span>`;
        }).join('<span style="color:var(--border);margin:0 4px">·</span>');

    return `<div class="${classes}">
      <div class="ativ-dot ${ativ.cor}"></div>
      <div style="flex:1">
        <div class="ativ-nome">${ativ.nome}</div>
        <div class="ativ-info-row" style="margin-top:5px">
          ${tentInfos}
          ${tsSpan}
          ${isLib && !isEncerrada && !foiRealizada ? `<span class="badge badge-blue">Disponível</span>` : ''}
        </div>
      </div>
      ${botao}
    </div>`;
  }).join('')}
</div>`;

window.toggleAvatarMenu = function() {
  document.getElementById('avatar-menu').classList.toggle('open');
};
document.addEventListener('click', function(e) {
  if (!e.target.closest('.avatar-wrap')) {
    document.getElementById('avatar-menu')?.classList.remove('open');
  }
});
</script>
</body>
</html>
