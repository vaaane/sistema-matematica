<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogo — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .game-progress{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:14px 18px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);}
    .gp-label{font-size:12px;color:var(--text-muted);flex-shrink:0;}
    .gp-bar{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden;}
    .gp-fill{height:100%;border-radius:4px;background:var(--blue);transition:width .4s;}
    .gp-pts{font-size:14px;font-weight:800;color:var(--gold);flex-shrink:0;}
    .game-layout{display:grid;grid-template-columns:220px 1fr;gap:18px;}
    .game-side{display:flex;flex-direction:column;gap:12px;}
    .side-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
    .side-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:6px;}
    .side-value{font-size:22px;font-weight:800;}
    .side-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
    .question-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 28px 20px;}
    .q-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:16px;}
    .q-badge.facil{background:#DCFCE7;color:#15803D;}
    .q-badge.media{background:#FEF9C3;color:#854D0E;}
    .q-badge.dificil{background:#FEE2E2;color:#B91C1C;}
    .q-text{font-size:20px;font-weight:700;line-height:1.4;margin-bottom:22px;}
    .answer-area{display:flex;gap:10px;margin-bottom:14px;}
    .answer-area .input{flex:1;font-size:16px;}
    .alts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
    .alt-btn{padding:10px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:background .12s,border-color .12s;font-family:'Inter',sans-serif;}
    .alt-btn:hover{background:var(--blue-pale);border-color:var(--blue);}
    #feedback{min-height:42px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;font-size:14px;font-weight:600;transition:all .2s;}
    #feedback.ok{background:#F0FDF4;color:#15803D;border:1px solid #BBF7D0;}
    #feedback.err{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;}
    #feedback.hidden{opacity:0;}
    .placar-row{display:flex;gap:12px;align-items:center;}
    .placar-sep{color:var(--border);font-size:20px;}
    .tent-dots{display:flex;gap:5px;margin-top:8px;}
    .tent-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--border);background:transparent;}
    .tent-dot.used{background:var(--red);border-color:var(--red);}
    .tent-dot.avail{background:var(--green);border-color:var(--green);}
    .timer-box{font-size:17px;font-weight:800;color:var(--blue);background:var(--blue-pale);border:1.5px solid #BAE6FD;padding:6px 14px;border-radius:8px;font-variant-numeric:tabular-nums;min-width:90px;text-align:center;}
    @media(max-width:700px){
      .game-layout{grid-template-columns:1fr}
      .game-side{flex-direction:row;flex-wrap:wrap}
      .side-card{flex:1;min-width:100px}
      .encerrar-desktop{display:none!important}
      .encerrar-mobile{display:flex!important}
      .q-text{font-size:16px;margin-bottom:16px}
      .question-card{padding:16px 16px 14px}
      .answer-area{flex-wrap:wrap}
      .answer-area .input{min-width:0}
      .answer-area .btn{width:100%;justify-content:center}
      .game-progress{padding:10px 12px;gap:8px}
      .gp-label{font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:130px}
      .side-card{overflow:hidden}
      .placar-row{gap:6px}
      .placar-sep{display:none}
    }
    .encerrar-mobile{display:none}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title" id="topbar-title">Carregando…</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
      <div class="topbar-right">
        <div class="timer-box" id="timer-display">--:--</div>
      </div>
    </div>
    <div class="content" id="content">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">Iniciando atividade…</div>
    </div>
  </div>
</div>

<script>(()=>{const t=localStorage.getItem("tema");if(t==="escuro")document.documentElement.setAttribute("data-theme","dark");})()</script>
<script type="module">
import {
  BASES, FATORES_TENTATIVA,
  MAX_TENTATIVAS_ATIVIDADE, carregarPerguntas, intercalarPorDificuldade,
  respostasEquivalentes, formatarTempo, dataAgora
} from "/js/constants.js";
import {
  addResultado, updateResultado, saveDetalhes,
  getLiberadasParaTurma, contarTentativas,
  addConquista, hasConquista, addAlerta, verificarTentativasSuspeitas,
  getResultadosByAluno, getAtividadeStatus
} from "/js/db.js";
import { requireAluno, renderSidebarAluno, clearSession, setJogo } from "/js/auth.js";
import { initAvBanner } from "/js/avaliacao_banner.js";

const sess = requireAluno();
if (!sess) throw new Error();
renderSidebarAluno("sidebar", "atividades");
window.sair = () => {
  if (jogo && !jogo.finalizado) {
    if (!confirm("Encerrar a atividade? Atenção: uma tentativa será consumida mesmo encerrando antes do tempo.")) return;
    encerrar();
  } else {
    clearSession(); window.location.href = "/index.html";
  }
};

const { alunos, turma } = sess;
initAvBanner(turma, alunos[0]);

const nomeAtivParam = new URLSearchParams(window.location.search).get("ativ");
if (!nomeAtivParam) { window.location.href = "/aluno/atividades.html"; throw new Error(); }

// Verifica liberação
const liberadas = await getLiberadasParaTurma(turma);
const liberada = liberadas.find(l => l.atividade === nomeAtivParam);
if (!liberada) {
  alert("Esta atividade não está mais liberada para sua turma.");
  window.location.href = "/aluno/atividades.html";
  throw new Error();
}
const nomeAtiv = liberada.atividade;
for (const al of alunos) {
  const tent = await contarTentativas(al, nomeAtiv);
  if (tent >= MAX_TENTATIVAS_ATIVIDADE) {
    alert(`${al} já usou as ${MAX_TENTATIVAS_ATIVIDADE} tentativas disponíveis para esta atividade.`);
    window.location.href = "/aluno/atividades.html";
    throw new Error();
  }
}

// Verificar status manual da atividade
const statusInfo = await getAtividadeStatus(turma, nomeAtiv);
if (statusInfo.status === 'encerrada') {
  alert("Atividade encerrada pela professora.");
  window.location.href = "/aluno/atividades.html";
  throw new Error();
}
if (statusInfo.status !== 'ativa') {
  if (!confirm(`Atenção: esta atividade vale ${statusInfo.percentual}% da nota agora. Deseja continuar?`)) {
    window.location.href = "/aluno/atividades.html";
    throw new Error();
  }
}

const percentual = typeof liberada.percentual === "number" ? liberada.percentual : 100;
const tempoMax   = liberada.tempo_maximo;
document.getElementById("topbar-title").textContent = nomeAtiv;
const pctLabel = statusInfo.percentual < 100 ? ` · ⏰ ${statusInfo.percentual}% da nota` : '';
document.getElementById("topbar-sub").textContent = `Turma ${turma}${pctLabel} · ${tempoMax/60} min`;

const perguntas  = await carregarPerguntas(nomeAtiv);
const fatorAtr   = percentual / 100;
const agora      = dataAgora();

// Estado do jogo
const jogo = {
  nome: nomeAtiv, perguntas: [...perguntas], indice: 0,
  pontuacao: 0, acertos: 0, erros: 0, respondidas: 0,
  tentativas: 0, ajudaUsada: false, historico: [],
  percentual, tempoMaximo: tempoMax, fatorAtraso: fatorAtr,
  resultadoIds: {}, inicioTs: Date.now() / 1000,
  finalizado: false, alunos, turma, questaoNum: 1,
  encerradoVoluntariamente: false,
};

// Cria registro inicial — tentativa consumida mesmo se o aluno fechar o browser
for (const al of jogo.alunos) {
  const novoId = await addResultado({
    aluno: al, turma: jogo.turma, atividade: jogo.nome,
    concluido: false, pontuacao: 0, acertos: 0, erros: 0, respondidas: 0,
    tempo: "0s", data: agora,
  });
  jogo.resultadoIds[al] = novoId;
}

let processando = false;

function pergAtual() { return jogo.perguntas[jogo.indice]; }
function valeAtual() {
  const perg = pergAtual();
  const base = BASES[perg.dificuldade] || 10;
  const fat  = FATORES_TENTATIVA[Math.min(jogo.tentativas, 3)];
  const fa   = jogo.ajudaUsada ? 0.5 : 1.0;
  return Math.max(1, Math.floor(base * fat * fa));
}

function renderJogo() {
  const perg = pergAtual();
  const base = BASES[perg.dificuldade] || 10;
  const nivelMap = {1:["Fácil","facil"], 2:["Média","media"], 3:["Difícil","dificil"]};
  const [nivel, nivelCls] = nivelMap[perg.dificuldade] || ["Fácil","facil"];

  document.getElementById("content").innerHTML = `
    <div class="game-progress">
      <span class="gp-label">Questão #${jogo.questaoNum} · <span id="resp-count">${jogo.respondidas}</span> respondidas</span>
      <div class="gp-bar"><div class="gp-fill" id="gp-fill" style="width:0%"></div></div>
      <span class="gp-pts" id="pts-display">${jogo.pontuacao} pts</span>
    </div>
    <div class="game-layout">
      <div class="game-side">
        <div class="side-card">
          <div class="side-label">Pontuação</div>
          <div class="side-value" style="color:var(--gold)" id="pts-side">${jogo.pontuacao}</div>
          <div class="side-sub">pontos acumulados</div>
        </div>
        <div class="side-card">
          <div class="side-label">Nível</div>
          <div class="side-value" id="nivel-display">${nivel}</div>
          <div class="side-sub">Vale <span id="vale-display">${valeAtual()}</span> pts agora</div>
          <div class="tent-dots" id="tent-dots">${[0,1,2,3].map(i=>`<div class="tent-dot ${i<jogo.tentativas?'used':'avail'}" id="dot-${i}"></div>`).join('')}</div>
        </div>
        <div class="side-card">
          <div class="side-label">Placar</div>
          <div class="placar-row">
            <div><div class="side-value" style="color:var(--green);font-size:18px" id="acertos-side">${jogo.acertos}</div><div class="side-sub">acertos</div></div>
            <div class="placar-sep">·</div>
            <div><div class="side-value" style="color:var(--red);font-size:18px" id="erros-side">${jogo.erros}</div><div class="side-sub">erros</div></div>
          </div>
        </div>
        ${!jogo.ajudaUsada ? `<button class="btn btn-ghost" id="btn-ajuda" onclick="pedirAjuda()" style="width:100%">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
          Pedir ajuda (-50%)
        </button>` : `<div class="side-card" style="text-align:center;color:var(--text-muted);font-size:12px">💡 Ajuda utilizada</div>`}
        <button class="btn btn-ghost encerrar-desktop" onclick="encerrar()" style="width:100%;color:var(--red);border-color:#FECACA">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          Encerrar
        </button>
      </div>
      <div>
        <div class="question-card">
          <span class="q-badge ${nivelCls}">
            ${perg.dificuldade===1?'● Fácil':perg.dificuldade===2?'◆ Média':'■ Difícil'} · base ${base} pts
          </span>
          <div class="q-text" id="q-text">${perg.enunciado || perg.pergunta || ''}</div>
          <div id="input-area">
            <div class="answer-area">
              <input type="text" id="resposta-input" class="input" placeholder="Digite sua resposta…" autocomplete="off" autofocus onkeydown="if(event.key==='Enter')responder()"/>
              <button class="btn btn-blue" id="btn-responder" onclick="responder()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                Responder
              </button>
            </div>
          </div>
          <div id="alts-area" style="display:none">
            <p style="font-size:12px;color:var(--text-muted);margin-bottom:8px">💡 Escolha a alternativa correta:</p>
            <div class="alts-grid" id="alts-grid"></div>
          </div>
          <div id="feedback" class="hidden"></div>
        </div>
      </div>
    </div>
    <button class="btn btn-ghost encerrar-mobile" onclick="encerrar()" style="width:100%;color:var(--red);border-color:#FECACA;margin-top:12px">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      Encerrar
    </button>`;

  document.getElementById("resposta-input")?.focus();
}

function atualizarDots(n) {
  for (let i=0;i<4;i++) {
    const d = document.getElementById("dot-"+i);
    if (d) d.className = "tent-dot "+(i<n?"used":"avail");
  }
}

function mostrarFeedback(tipo, msg) {
  const el = document.getElementById("feedback");
  if (el) { el.className=tipo; el.textContent=msg; }
}

function beep(freq, dur) {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur/1000);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime+dur/1000);
  } catch(e) {}
}

function avancarQuestao() {
  jogo.questaoNum++;
  if (jogo.indice >= jogo.perguntas.length - 1) {
    jogo.perguntas = intercalarPorDificuldade(jogo.perguntas);
    jogo.indice = 0;
  } else {
    jogo.indice++;
  }
  jogo.tentativas = 0; jogo.ajudaUsada = false;
}

window.responder = function(respSelecionada) {
  if (processando) return;
  const input = document.getElementById("resposta-input");
  const resposta = respSelecionada !== undefined ? respSelecionada : (input ? input.value.trim() : "");
  if (!resposta) { mostrarFeedback("err", "⚠️ Digite uma resposta."); return; }

  processando = true;
  const btn = document.getElementById("btn-responder");
  if (btn) btn.disabled = true;

  const perg = pergAtual();
  const base = BASES[perg.dificuldade] || 10;
  const fat  = FATORES_TENTATIVA[Math.min(jogo.tentativas, 3)];
  const fa   = jogo.ajudaUsada ? 0.5 : 1.0;

  if (respostasEquivalentes(resposta, String(perg.resposta))) {
    const pts = Math.max(1, Math.floor(base * fat * fa));
    jogo.pontuacao   += pts;
    jogo.acertos     += 1;
    jogo.respondidas += 1;
    jogo.tentativas  += 1;
    jogo.historico.push({ enunciado: perg.enunciado || perg.pergunta || '—', resposta_aluno: resposta, resposta_correta: perg.resposta != null ? String(perg.resposta) : '—', pontos: pts, tentativas: jogo.tentativas, acertou: true });
    beep(1000, 150);
    mostrarFeedback("ok", `✅ Correto! +${pts} pontos`);
    document.getElementById("pts-display").textContent = jogo.pontuacao+" pts";
    document.getElementById("pts-side").textContent = jogo.pontuacao;
    avancarQuestao();
    setTimeout(() => { processando=false; renderJogo(); }, 1500);

  } else {
    jogo.tentativas++;
    if (jogo.tentativas >= 4) {
      jogo.erros       += 1;
      jogo.respondidas += 1;
      jogo.historico.push({ enunciado: perg.enunciado || perg.pergunta || '—', resposta_aluno: resposta, resposta_correta: perg.resposta != null ? String(perg.resposta) : '—', pontos: 0, tentativas: jogo.tentativas, acertou: false });
      beep(400, 300);
      mostrarFeedback("err", `❌ Errou 4× — Resposta: ${perg.resposta}`);
      document.getElementById("erros-side").textContent = jogo.erros;
      avancarQuestao();
      setTimeout(() => { processando=false; renderJogo(); }, 2000);
    } else {
      beep(400, 150);
      atualizarDots(jogo.tentativas);
      const novoVale = Math.max(1, Math.floor(base * FATORES_TENTATIVA[Math.min(jogo.tentativas,3)] * fa));
      document.getElementById("vale-display").textContent = novoVale;
      mostrarFeedback("err", `❌ Errado (${jogo.tentativas}/4) — tente novamente`);
      if (btn) btn.disabled = false;
      if (input) { input.value=""; input.focus(); }
      processando = false;
    }
  }
};

window.pedirAjuda = function() {
  jogo.ajudaUsada = true;
  jogo.tentativas = 0;
  const perg = pergAtual();
  const alts = perg.alternativas || perg.opcoes || [];
  const grid = document.getElementById("alts-grid");
  grid.innerHTML = "";
  alts.forEach(alt => {
    const btn = document.createElement("button");
    btn.className = "alt-btn"; btn.textContent = alt;
    btn.onclick = () => { document.getElementById("resposta-input").value=alt; window.responder(alt); };
    grid.appendChild(btn);
  });
  document.getElementById("alts-area").style.display = "block";
  document.getElementById("input-area").style.display = "none";
  document.getElementById("btn-ajuda")?.remove();
  mostrarFeedback("ok", "💡 Alternativas exibidas — pontuação reduzida 50%");
};

window.encerrar = async function() {
  if (processando) return;
  if (!confirm("Encerrar a atividade? Atenção: uma tentativa será consumida mesmo encerrando antes do tempo.")) return;
  jogo.encerradoVoluntariamente = true;
  await finalizarJogo();
  window.location.href = "/aluno/resultado.html";
};

async function finalizarJogo() {
  if (jogo.finalizado) return;
  jogo.finalizado = true;
  const tt  = Math.round(Date.now()/1000 - jogo.inicioTs);
  const pb  = jogo.pontuacao;
  const agr = dataAgora();

  // Lê status atual para registrar percentual no momento do encerramento
  let percentualNota = 100;
  try {
    const statusFim = await getAtividadeStatus(jogo.turma, jogo.nome);
    percentualNota = statusFim.percentual ?? 100;
  } catch(e) {}
  const pfSafe = pb > 0 ? Math.max(1, Math.floor(pb * percentualNota / 100)) : 0;

  jogo.tempoSegundos  = tt;
  jogo.pontuacaoFinal = pfSafe;
  jogo.pontuacaoBruta = pb;

  const dadosFinais = {
    pontuacao_bruta: pb,
    pontuacao: pfSafe,
    percentual_nota: percentualNota,
    com_abatimento: percentualNota < 100,
    acertos: jogo.acertos,
    erros: jogo.erros,
    respondidas: jogo.respondidas,
    tempo: `${tt}s`,
    data: agr,
    concluido: true,
  };

  jogo.salvoFirebase = false;
  try {
    for (const al of jogo.alunos) {
      const id = jogo.resultadoIds[al];
      await updateResultado(id, { aluno: al, turma: jogo.turma, atividade: jogo.nome, ...dadosFinais });
      try { await saveDetalhes(id, jogo.historico); } catch(e) { console.warn("[saveDetalhes]", e); }
    }
    jogo.salvoFirebase = true;
  } catch(err) {
    console.error("[finalizarJogo] Erro ao salvar no Firebase:", err);
    jogo.erroSalvar = err.message || String(err);
  }

  // Conquistas — só tenta se o save deu certo
  const novas = [];
  if (jogo.salvoFirebase) {
    try {
      for (const al of jogo.alunos) {
        const rid       = jogo.resultadoIds[al];
        const todoAluno = await getResultadosByAluno(al);
        const histConc  = todoAluno.filter(r => r.concluido);
        const histAtiv  = histConc.filter(r => r.atividade === jogo.nome);

        const conceder = async (tipo, desc) => {
          if (!(await hasConquista(al, tipo, jogo.nome))) {
            await addConquista({ aluno: al, turma: jogo.turma, atividade: jogo.nome, tipo, descricao: desc, data: agr });
            novas.push(desc);
          }
        };

        const completo = !jogo.encerradoVoluntariamente;
        if (completo && jogo.erros === 0 && jogo.respondidas > 0) await conceder("sem_erros", "Sem erros! ✨");
        if (completo && jogo.respondidas > 0 && jogo.erros === 0 && jogo.historico.every(h => h.tentativas === 1)) await conceder("nota_maxima", "Nota máxima! 🏆");
        if (histConc.length <= 1) await conceder("primeira_atividade", "Primeira atividade! 🎉");
        else {
          const prev = histAtiv.filter(r => r.id !== rid).map(r => r.pontuacao || 0);
          if (prev.length && pfSafe > Math.max(...prev)) await conceder("melhorou_nota", "Melhorou a nota! 📈");
          const maxGeral = Math.max(...histConc.filter(r => r.id !== rid).map(r => r.pontuacao || 0), 0);
          if (pfSafe > maxGeral) await conceder("superou_recorde_pessoal", "Novo recorde pessoal! 🌟");
        }
        if (await verificarTentativasSuspeitas(al, jogo.nome)) {
          await addAlerta({ aluno: al, turma: jogo.turma, atividade: jogo.nome, motivo: "3+ tentativas em 10 minutos", data: agr });
        }
      }
    } catch(e) {
      console.warn("Conquistas:", e);
    }
  }

  jogo.novasConquistas = novas;
  // Sempre salva no sessionStorage — resultado.html mostra aviso se salvoFirebase=false
  sessionStorage.setItem("sm_jogo_resultado", JSON.stringify(jogo));
}

// Timer
function atualizarTimer() {
  const decorrido = Date.now()/1000 - jogo.inicioTs;
  const restante  = Math.max(0, jogo.tempoMaximo - decorrido);
  const timer = document.getElementById("timer-display");
  if (timer) {
    timer.textContent = formatarTempo(restante);
    if (restante <= 60)  { timer.style.color="var(--red)"; timer.style.background="#FEF2F2"; timer.style.borderColor="#FECACA"; }
    else if (restante <= 120) { timer.style.color="var(--orange)"; }
    // Barra
    const pct = Math.min(100, (decorrido/jogo.tempoMaximo)*100);
    const fill = document.getElementById("gp-fill");
    if (fill) { fill.style.width=pct+"%"; fill.style.background=restante<=60?"var(--red)":restante<=120?"var(--orange)":"var(--blue)"; }
  }
  if (restante <= 0 && !jogo.finalizado) {
    jogo.encerradoVoluntariamente = false;
    finalizarJogo().then(() => { window.location.href="/aluno/resultado.html"; }).catch(e => { console.error("Timer finalizarJogo:", e); window.location.href="/aluno/resultado.html"; });
  }
}

renderJogo();
setInterval(atualizarTimer, 1000);
atualizarTimer();

window.addEventListener("beforeunload", e => {
  if (!jogo.finalizado) { e.preventDefault(); e.returnValue=""; }
});
</script>
