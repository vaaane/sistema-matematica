<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎮 Jogos — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    /* ── Gaming theme vars ── */
    :root {
      --g-purple:#7c5cfc; --g-pl:#9b7ffe;
      --g-cyan:#00d4ff;   --g-orange:#ff7b2e;
      --g-gold:#ffd700;   --g-green:#00e676;
      --g-red:#ff4444;    --g-diamond:#a8f0ff;
      --g-bg:#0d0f1a;     --g-bg2:#131627; --g-bg3:#1a1f35;
      --g-text:#e8eaf6;   --g-muted:#8892b0;
      --g-bdr:rgba(124,92,252,0.2);
    }

    /* ── Force dark on whole page ── */
    .content {
      background: var(--g-bg);
      min-height: calc(100vh - 60px);
      position: relative;
    }
    .content::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(124,92,252,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,92,252,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }

    /* ── Animations ── */
    @keyframes g-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes g-shimmer{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes g-blink{0%,100%{opacity:1}50%{opacity:.25}}
    @keyframes g-pulse-lv{0%,100%{text-shadow:0 0 20px rgba(155,127,254,.5)}50%{text-shadow:0 0 30px rgba(155,127,254,.9),0 0 60px rgba(155,127,254,.3)}}
    @keyframes g-pulse-cur{0%,100%{box-shadow:0 0 10px rgba(124,92,252,.4)}50%{box-shadow:0 0 18px rgba(124,92,252,.7)}}
    @keyframes g-glow-g{0%,100%{box-shadow:0 0 8px rgba(0,230,118,.2)}50%{box-shadow:0 0 16px rgba(0,230,118,.4)}}
    @keyframes g-shine{0%{left:-100%}100%{left:200%}}
    @keyframes g-bounce{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
    @keyframes g-sk{0%,100%{opacity:.5}50%{opacity:.15}}

    /* ── Page ── */
    .g-page {
      position: relative; z-index: 1;
      max-width: 900px; margin: 0 auto;
      padding: 20px 20px 40px;
      color: var(--g-text); font-family: 'Inter', sans-serif;
    }
    .g-page-hdr { display:flex;align-items:center;gap:12px;margin-bottom:22px; }
    .g-page-hdr h1 { font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;letter-spacing:1px;background:linear-gradient(135deg,#fff,var(--g-pl));-webkit-background-clip:text;-webkit-text-fill-color:transparent; }
    .g-page-hdr span { font-size:12px;color:var(--g-muted); }

    /* ── Skeleton ── */
    .g-sk { background:var(--g-bg3);border-radius:6px;animation:g-sk 1.4s ease-in-out infinite; }

    /* ── Game card ── */
    .g-card {
      background:linear-gradient(135deg,#1a1f35,#151929);
      border:1px solid var(--g-bdr); border-radius:20px;
      overflow:hidden; margin-bottom:18px;
      position:relative; animation:g-up .4s ease both;
    }
    .g-card::before { content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--g-purple),var(--g-cyan),transparent);animation:g-shimmer 3s infinite; }
    .g-card::after { content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(124,92,252,.15),transparent 70%);pointer-events:none; }

    .g-card-top { padding:20px 24px 16px;display:flex;align-items:center;justify-content:space-between; }
    .g-title { display:flex;align-items:center;gap:10px; }
    .g-icon { width:42px;height:42px;background:linear-gradient(135deg,var(--g-purple),#5a3fcf);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 15px rgba(124,92,252,.4);flex-shrink:0; }
    .g-title h2 { font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;color:var(--g-text); }
    .g-title p { font-size:12px;color:var(--g-muted);margin-top:2px; }
    .g-lv-badge { display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0; }
    .g-lv-badge .lbl { font-size:10px;color:var(--g-muted);text-transform:uppercase;letter-spacing:1px; }
    .g-lv-badge .val { font-family:'Orbitron',monospace;font-size:26px;font-weight:900;color:var(--g-pl);line-height:1;animation:g-pulse-lv 2s infinite; }

    .g-stats { display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.04);border-top:1px solid var(--g-bdr);border-bottom:1px solid var(--g-bdr); }
    .g-stat { padding:12px 14px;text-align:center;background:var(--g-bg2); }
    .g-stat .v { font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;line-height:1; }
    .g-stat .l { font-size:10px;color:var(--g-muted);text-transform:uppercase;letter-spacing:.8px;margin-top:3px; }

    .g-dist { padding:13px 24px 0;border-top:1px solid var(--g-bdr); }
    .g-dist-lbl { font-size:10px;color:var(--g-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px; }
    .g-dist-row { display:flex;align-items:center;gap:10px;margin-bottom:5px; }
    .g-dist-you { font-family:'Orbitron',monospace;font-size:11px;font-weight:700;color:var(--g-pl);white-space:nowrap; }
    .g-dist-bw { flex:1;height:6px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden; }
    .g-dist-bf { height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g-purple),var(--g-cyan));transition:width .6s ease; }
    .g-dist-top { font-family:'Orbitron',monospace;font-size:11px;font-weight:700;color:var(--g-gold);white-space:nowrap; }
    .g-dist-cap { font-size:11px;color:var(--g-muted);text-align:center;padding-bottom:12px; }
    .g-dist-cap strong { color:var(--g-orange); }

    .g-live { padding:11px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-top:1px solid var(--g-bdr);border-bottom:1px solid var(--g-bdr); }
    .g-live-dot { display:flex;align-items:center;gap:6px;font-size:12px;color:var(--g-muted); }
    .g-live-dot .dot { width:7px;height:7px;border-radius:50%;background:var(--g-orange);box-shadow:0 0 6px var(--g-orange);animation:g-blink 1.5s infinite;flex-shrink:0; }
    .g-live-dot strong { color:var(--g-orange);font-size:14px; }
    .g-ldr-info { display:flex;align-items:center;gap:6px;font-size:12px;color:var(--g-muted); }
    .g-ldr-info strong { color:var(--g-gold); }
    .g-ldr-lv { background:rgba(0,212,255,.1);color:var(--g-cyan);padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid rgba(0,212,255,.3); }
    .g-pos-badge { margin-left:auto;background:linear-gradient(135deg,rgba(0,230,118,.15),rgba(0,230,118,.05));border:1px solid rgba(0,230,118,.3);color:var(--g-green);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;animation:g-glow-g 2s infinite; }

    .g-modes { display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:13px 24px; }
    .g-mode { position:relative;padding:12px 16px;border-radius:13px;border:1.5px solid transparent;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px;overflow:hidden;font-family:'Rajdhani',sans-serif;text-align:left;background:none;color:inherit; }
    .g-mode .ico { font-size:20px;flex-shrink:0; }
    .g-mode .nm { font-size:15px;font-weight:700;display:block; }
    .g-mode .ds { font-size:10px;font-weight:400;opacity:.7;font-family:'Inter',sans-serif;display:block; }
    .g-mode.normal { background:linear-gradient(135deg,rgba(124,92,252,.18),rgba(124,92,252,.07));border-color:rgba(124,92,252,.4);color:var(--g-pl); }
    .g-mode.normal.active,.g-mode.normal:hover { background:linear-gradient(135deg,rgba(124,92,252,.32),rgba(124,92,252,.14));border-color:var(--g-purple);box-shadow:0 4px 18px rgba(124,92,252,.28);transform:translateY(-1px); }
    .g-mode.sprint { background:linear-gradient(135deg,rgba(255,123,46,.18),rgba(255,123,46,.07));border-color:rgba(255,123,46,.35);color:var(--g-orange); }
    .g-mode.sprint.active,.g-mode.sprint:hover { background:linear-gradient(135deg,rgba(255,123,46,.32),rgba(255,123,46,.14));border-color:var(--g-orange);box-shadow:0 4px 18px rgba(255,123,46,.28);transform:translateY(-1px); }

    .g-play-area { padding:0 24px 20px; }
    .g-play-btn { width:100%;padding:13px;border-radius:13px;border:none;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:17px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s;position:relative;overflow:hidden;color:#fff; }
    .g-play-btn.nm { background:linear-gradient(135deg,var(--g-purple),#5a3fcf);box-shadow:0 4px 18px rgba(124,92,252,.4); }
    .g-play-btn.nm:hover { transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,92,252,.6); }
    .g-play-btn.sp { background:linear-gradient(135deg,var(--g-orange),#e05a1a);box-shadow:0 4px 18px rgba(255,123,46,.4); }
    .g-play-btn.sp:hover { transform:translateY(-2px);box-shadow:0 8px 28px rgba(255,123,46,.6); }
    .g-play-btn::after { content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:g-shine 3s infinite; }
    .g-play-btn .arr { font-size:18px;animation:g-bounce 1s infinite; }

    /* ── Bottom grid ── */
    .g-bottom { display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;animation:g-up .4s .1s ease both; }
    .g-mini { background:var(--g-bg2);border:1px solid var(--g-bdr);border-radius:14px;padding:16px;position:relative;overflow:hidden; }
    .g-mini::before { content:'';position:absolute;top:0;left:0;right:0;height:2px; }
    .g-mini.ops::before { background:linear-gradient(90deg,var(--g-cyan),transparent); }
    .g-mini.hist::before { background:linear-gradient(90deg,var(--g-purple),transparent); }
    .g-mini h3 { font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--g-muted);margin-bottom:12px; }
    .g-ops { display:grid;grid-template-columns:1fr 1fr;gap:7px; }
    .g-op { background:var(--g-bg3);border-radius:9px;padding:9px;text-align:center; }
    .g-op .v { font-family:'Orbitron',monospace;font-size:17px;font-weight:700;line-height:1; }
    .g-op .n { font-size:10px;color:var(--g-muted);margin-top:3px; }
    .g-op .p { font-size:9px;margin-top:2px; }
    .g-hist { display:flex;flex-direction:column;gap:5px; }
    .g-hi { display:flex;align-items:center;gap:7px;padding:6px 9px;background:var(--g-bg3);border-radius:7px;font-size:11px; }
    .g-hi-b { font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;min-width:30px;text-align:center; }
    .g-hi-b.ok { background:rgba(0,230,118,.15);color:var(--g-green);border:1px solid rgba(0,230,118,.3); }
    .g-hi-b.fail { background:rgba(255,68,68,.15);color:var(--g-red);border:1px solid rgba(255,68,68,.3); }
    .g-hi-c { font-size:9px;color:var(--g-orange);font-weight:600; }
    .g-hi-t { color:var(--g-muted);margin-left:auto;font-size:9px; }
    .g-hi-s { font-family:'Rajdhani',sans-serif;font-weight:600;color:var(--g-muted);font-size:10px; }

    /* ── Ranking ── */
    .g-rank-wrap { display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;animation:g-up .4s .2s ease both; }
    .g-rb { background:var(--g-bg2);border:1px solid var(--g-bdr);border-radius:14px;overflow:hidden; }
    .g-rb.geral::before { content:'';display:block;height:2px;background:linear-gradient(90deg,var(--g-gold),var(--g-orange),transparent); }
    .g-rb.turma::before { content:'';display:block;height:2px;background:linear-gradient(90deg,var(--g-cyan),var(--g-purple),transparent); }
    .g-rb-hdr { padding:11px 14px 7px; }
    .g-rb-hdr h3 { font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--g-muted); }
    .g-rb-list { padding:0 8px 10px; }
    .g-ri { display:flex;align-items:center;gap:7px;padding:6px 5px;border-radius:7px;transition:background .2s; }
    .g-ri:hover { background:var(--g-bg3); }
    .g-ri.me { background:rgba(124,92,252,.1);border:1px solid rgba(124,92,252,.2);margin:2px 0; }
    .g-ri-medal { font-size:15px;min-width:20px;text-align:center;line-height:1; }
    .g-ri-pos { font-family:'Orbitron',monospace;font-size:10px;font-weight:700;min-width:20px;text-align:center;color:var(--g-muted); }
    .g-ri-av { width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;flex-shrink:0; }
    .g-ri-info { flex:1;min-width:0; }
    .g-ri-name { font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--g-text); }
    .g-ri-meta { font-size:10px;color:var(--g-muted);margin-top:1px; }
    .g-ri-right { display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0; }
    .g-ri-lv { font-family:'Orbitron',monospace;font-size:13px;font-weight:700; }
    .g-ri-delta { font-size:9px;font-weight:600; }
    .g-ri-delta.up { color:var(--g-green); }
    .g-ri-delta.down { color:var(--g-red); }
    .g-ri-delta.same { color:var(--g-muted); }

    /* ── Level map ── */
    .g-lvmap { background:var(--g-bg2);border:1px solid var(--g-bdr);border-radius:14px;overflow:hidden;margin-bottom:20px;animation:g-up .4s .3s ease both; }
    .g-lvmap::before { content:'';display:block;height:2px;background:linear-gradient(90deg,var(--g-gold),var(--g-purple),transparent); }
    .g-lvmap-hdr { padding:11px 14px 8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px; }
    .g-lvmap-hdr h3 { font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--g-muted); }
    .g-legend { display:flex;gap:10px;flex-wrap:wrap; }
    .g-leg { display:flex;align-items:center;gap:4px;font-size:9px;color:var(--g-muted); }
    .g-leg-d { width:6px;height:6px;border-radius:50%; }
    .g-leg-d.dm { background:var(--g-diamond);box-shadow:0 0 3px var(--g-diamond); }
    .g-leg-d.pf { background:var(--g-gold);box-shadow:0 0 3px var(--g-gold); }
    .g-leg-d.dn { background:var(--g-pl); }
    .g-leg-d.lk { background:#3a3f5c; }
    .g-grid { display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:0 10px 12px; }
    .g-lc { aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .15s;border:1px solid transparent; }
    .g-lc:hover { transform:scale(1.12);z-index:2; }
    .g-lc.dm { background:rgba(168,240,255,.1);border-color:rgba(168,240,255,.5); }
    .g-lc.dm:hover { background:rgba(168,240,255,.2);box-shadow:0 3px 10px rgba(168,240,255,.35); }
    .g-lc.pf { background:rgba(255,215,0,.1);border-color:rgba(255,215,0,.3); }
    .g-lc.pf:hover { background:rgba(255,215,0,.2);box-shadow:0 3px 10px rgba(255,215,0,.25); }
    .g-lc.dn { background:rgba(124,92,252,.12);border-color:rgba(124,92,252,.28); }
    .g-lc.dn:hover { background:rgba(124,92,252,.22); }
    .g-lc.cur { background:rgba(124,92,252,.3);border-color:var(--g-purple);animation:g-pulse-cur 2s infinite; }
    .g-lc.lk { background:rgba(255,255,255,.02);border-color:rgba(255,255,255,.04);cursor:default;opacity:.28; }
    .g-lc.lk:hover { transform:none; }
    .g-lc-n { font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;line-height:1; }
    .g-lc.dm .g-lc-n { color:var(--g-diamond); }
    .g-lc.pf .g-lc-n { color:var(--g-gold); }
    .g-lc.dn .g-lc-n { color:var(--g-pl); }
    .g-lc.cur .g-lc-n { color:#fff; }
    .g-lc.lk .g-lc-n { color:var(--g-muted); }
    .g-lc-op { position:absolute;bottom:2px;left:2px;font-size:7px;opacity:.6;line-height:1; }
    .g-lc.dm .g-lc-op { color:var(--g-diamond); }
    .g-lc.pf .g-lc-op { color:rgba(255,215,0,.8); }
    .g-lc.dn .g-lc-op { color:rgba(155,127,254,.8); }
    .g-lc.cur .g-lc-op { color:rgba(255,255,255,.8); }
    .g-lc-bdi { position:absolute;top:2px;right:2px;font-size:7px;line-height:1; }
    .g-lc:not(.lk):hover::after { content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#1a1f35;border:1px solid var(--g-bdr);color:var(--g-text);font-size:10px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:10;pointer-events:none;font-family:'Inter',sans-serif; }
    /* Chefão cells */
    @keyframes g-chefao-glow{0%,100%{box-shadow:0 0 6px rgba(239,68,68,.3)}50%{box-shadow:0 0 14px rgba(239,68,68,.7)}}
    .g-lc.boss-lk { background:rgba(239,68,68,.06);border-color:rgba(239,68,68,.25);cursor:default;opacity:.55; }
    .g-lc.boss-lk:hover { transform:none; }
    .g-lc.boss-lk .g-lc-n { color:rgba(239,68,68,.6); }
    .g-lc.boss-dn { background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4); }
    .g-lc.boss-dn:hover { background:rgba(239,68,68,.18);box-shadow:0 3px 10px rgba(239,68,68,.25); }
    .g-lc.boss-dn .g-lc-n { color:#F87171; }
    .g-lc.boss-dn .g-lc-op { color:rgba(239,68,68,.7); }
    .g-lc.boss-pf { background:rgba(250,184,0,.12);border-color:rgba(250,184,0,.45);animation:g-chefao-glow 2s infinite; }
    .g-lc.boss-pf:hover { background:rgba(250,184,0,.22);box-shadow:0 3px 10px rgba(250,184,0,.3); }
    .g-lc.boss-pf .g-lc-n { color:var(--g-gold); }
    .g-lc.boss-cur { background:rgba(239,68,68,.22);border-color:#EF4444;animation:g-chefao-glow 1s infinite; }
    .g-lc.boss-cur .g-lc-n { color:#fff; }

    /* ── Responsive ── */
    @media(max-width:600px) {
      .g-bottom,.g-rank-wrap { grid-template-columns:1fr; }
      .g-grid { grid-template-columns:repeat(8,1fr); }
      .g-modes { grid-template-columns:1fr; }
      .g-card-top { flex-direction:column;align-items:flex-start;gap:10px; }
    }
    @media(max-width:400px) { .g-grid { grid-template-columns:repeat(6,1fr); } }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">🎮 Jogos</div>
        <div class="topbar-sub">Mini-jogos educativos</div>
      </div>
      <div class="topbar-right">
        <div class="avatar-wrap">
          <div class="avatar avatar-orange" id="avatar-initials" onclick="toggleAvatarMenu()">?</div>
          <div class="avatar-menu" id="avatar-menu">
            <a href="/aluno/config.html" class="avatar-menu-item">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
              Configurações
            </a>
            <button class="avatar-menu-item avatar-menu-danger" onclick="sair()">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>

</div>

<script>(()=>{ document.documentElement.setAttribute('data-theme','dark'); })()</script>
<script type="module">
import { requireAluno, renderSidebarAluno, clearSession } from "/js/auth.js";
import { db } from "/js/firebase-config.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const sess = requireAluno("/index.html");
if (!sess) throw new Error("não autenticado");
renderSidebarAluno("sidebar", "jogos");
window.sair = () => { clearSession(); window.location.href = "/index.html"; };

const { alunos, turma } = sess;
const nomeAluno = alunos[0];
const isDupla   = alunos.length > 1;
const uid = (turma + '_' + nomeAluno).replace(/[.#$\[\]/\s]/g, '_');

document.getElementById("avatar-initials").textContent = nomeAluno[0].toUpperCase();

function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Standard ranking: empates compartilham posição, próximo pula
function calcStdPos(lista) {
  let pos = 0, n = 0, last = null;
  return lista.map(item => {
    n++;
    const v = item.melhor_nivel || 0;
    if (v !== last) { pos = n; last = v; }
    return pos;
  });
}

// ── Skeleton ──────────────────────────────────────────────────
document.getElementById("content").innerHTML = `
<div class="g-page">
  <div class="g-card">
    <div class="g-card-top">
      <div class="g-title">
        <div class="g-icon">🎯</div>
        <div><h2>Tabuada</h2><p>Combine operações com seus resultados</p></div>
      </div>
      <div class="g-sk" style="width:60px;height:36px;border-radius:8px"></div>
    </div>
    <div class="g-stats" id="sk-stats">
      ${[1,2,3].map(()=>`<div class="g-stat"><div class="g-sk" style="height:22px;width:50%;margin:0 auto 6px"></div><div class="g-sk" style="height:9px;width:70%;margin:0 auto"></div></div>`).join('')}
    </div>
    <div style="padding:16px 24px"><div class="g-sk" style="height:6px;border-radius:4px"></div></div>
    <div class="g-live" id="sk-live">
      ${[1,2].map(()=>`<div class="g-sk" style="height:10px;width:120px;border-radius:5px"></div>`).join('')}
    </div>
    <div class="g-modes">
      <div class="g-mode normal active"><span class="ico">▶</span><div><span class="nm">Normal</span><span class="ds">Suba de nível no seu ritmo</span></div></div>
      <div class="g-mode sprint"><span class="ico">⚡</span><div><span class="nm">Sprint</span><span class="ds">Máximo de pares em 3 min</span></div></div>
    </div>
    <div class="g-play-area">
      <button class="g-play-btn nm"><span class="arr">▶</span> JOGAR AGORA</button>
    </div>
  </div>
  <div class="g-bottom">
    <div class="g-mini ops"><h3>📊 Operações praticadas</h3><div class="g-sk" style="height:80px;border-radius:8px"></div></div>
    <div class="g-mini hist"><h3>🕐 Últimas partidas</h3><div class="g-sk" style="height:80px;border-radius:8px"></div></div>
  </div>
  <div class="g-rank-wrap">
    <div class="g-rb geral"><div class="g-rb-hdr"><h3>🏆 Ranking Geral</h3></div><div class="g-rb-list"><div class="g-sk" style="height:120px;border-radius:8px"></div></div></div>
    <div class="g-rb turma"><div class="g-rb-hdr"><h3>🏫 Turma ${escH(turma)}</h3></div><div class="g-rb-list"><div class="g-sk" style="height:120px;border-radius:8px"></div></div></div>
  </div>
  <div class="g-lvmap">
    <div class="g-lvmap-hdr"><h3>⭐ Mapa de Níveis</h3></div>
    <div style="padding:8px 10px 12px"><div class="g-sk" style="height:80px;border-radius:8px"></div></div>
  </div>
</div>`;

// ── Load Firebase data ─────────────────────────────────────────
const hojeISO = new Date().toISOString().slice(0, 10);
const ontemISO = new Date(Date.now() - 86400000).toISOString().slice(0, 10);

let niveisSnap, rankSnap, sessoesSnap;
try {
  [niveisSnap, rankSnap, sessoesSnap] = await Promise.all([
    get(ref(db, `tabuada_niveis/${uid}`)).catch(e => { console.error('[jogos] tabuada_niveis:', e); return null; }),
    get(ref(db, 'tabuada_ranking')).catch(e => { console.error('[jogos] tabuada_ranking:', e); return null; }),
    get(ref(db, 'tabuada_sessoes')).catch(e => { console.error('[jogos] tabuada_sessoes:', e); return null; }),
  ]);
} catch(e) {
  document.getElementById("content").innerHTML =
    `<div style="text-align:center;padding:60px;color:var(--g-muted);font-family:'Inter',sans-serif">
      <div style="font-size:36px;margin-bottom:12px">⚠️</div>
      <div style="font-size:15px;font-weight:700;color:var(--g-text);margin-bottom:6px">Erro ao carregar dados</div>
      <button onclick="location.reload()" style="margin-top:12px;padding:8px 20px;background:var(--g-purple);color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif">Tentar novamente</button>
    </div>`;
  throw e;
}

// ── Parse data ─────────────────────────────────────────────────
const niveis      = niveisSnap?.exists() ? niveisSnap.val() : {};
const nivelAtual  = Math.max(niveis.nivel_atual || 1, niveis.melhor_nivel || 1);
const melhorNivel = niveis.melhor_nivel || nivelAtual;
const totalPart   = niveis.total_partidas || 0;
const maiorCombo  = niveis.maior_combo || 0;

// Ranking
const rankAll = [];
if (rankSnap?.exists()) {
  rankSnap.forEach(c => { const v = c.val(); if (v?.nome) rankAll.push(v); });
  rankAll.sort((a, b) => (b.melhor_nivel||0) - (a.melhor_nivel||0) || (b.total_partidas||0) - (a.total_partidas||0));
} else {
  console.warn('[jogos] tabuada_ranking vazio ou inacessível. rankSnap:', rankSnap);
}
console.log('[jogos] ranking:', rankAll.length, 'entradas totais');
const rankTurma = rankAll.filter(r => r.turma === turma);

const liderGeral = rankAll[0] || null;
const liderTurma = rankTurma[0] || null;
const myGeralIdx = rankAll.findIndex(r => r.nome === nomeAluno && r.turma === turma);
const myTurmaIdx = rankTurma.findIndex(r => r.nome === nomeAluno && r.turma === turma);
const rankAllPos   = calcStdPos(rankAll);
const rankTurmaPos = calcStdPos(rankTurma);
const myGeral    = myGeralIdx >= 0 ? rankAllPos[myGeralIdx]   : null;
const myTurma    = myTurmaIdx >= 0 ? rankTurmaPos[myTurmaIdx] : null;

// Sessions today (no dedup)
let sessoesHoje = 0;
if (sessoesSnap?.exists()) {
  sessoesSnap.forEach(c => { const v = c.val(); if (v?.data === hojeISO) sessoesHoje++; });
}

// ── Helper functions ───────────────────────────────────────────
function getLvOp(lv) {
  if (lv <= 27) return '+';
  if (lv <= 54) return '±';
  if (lv <= 65) return '×';
  return '÷';
}

function computeMyDelta() {
  if (!niveis.historico) return 0;
  const entries = Object.entries(niveis.historico)
    .map(([ts, v]) => ({ ts: Number(ts), ...v }))
    .sort((a, b) => b.ts - a.ts);
  for (const e of entries) {
    const d = new Date(e.ts).toISOString().slice(0, 10);
    if (d <= ontemISO && e.nivel) return nivelAtual - e.nivel;
  }
  return 0;
}
const myDelta = computeMyDelta();

function buildRankRow(p, pos, isMe) {
  const medals  = ['🥇','🥈','🥉'];
  const lvCols  = ['var(--g-gold)','#c0c0c0','#cd7f32'];
  const avSt    = [
    'background:rgba(255,215,0,.18);color:var(--g-gold);border:1.5px solid rgba(255,215,0,.35)',
    'background:rgba(192,192,192,.15);color:#c0c0c0;border:1.5px solid rgba(192,192,192,.3)',
    'background:rgba(205,127,50,.15);color:#cd7f32;border:1.5px solid rgba(205,127,50,.28)',
  ];
  const posSlot = pos <= 3
    ? `<span class="g-ri-medal">${medals[pos-1]}</span>`
    : `<span class="g-ri-pos">${pos}</span>`;
  const pi = pos - 1;  // índice de cor (0,1,2)
  const avStyle = isMe
    ? 'background:rgba(124,92,252,.2);color:var(--g-pl);border:1.5px solid rgba(124,92,252,.5)'
    : pos <= 3 ? avSt[pi]
    : 'background:var(--g-bg3);color:var(--g-muted);border:1.5px solid var(--g-bdr)';
  const lvColor = isMe ? 'var(--g-pl)' : pos <= 3 ? lvCols[pi] : 'var(--g-muted)';
  const delta = isMe ? myDelta : 0;
  const dc = delta > 0 ? 'up' : delta < 0 ? 'down' : 'same';
  const dt = delta > 0 ? `↑${delta}` : delta < 0 ? `↓${Math.abs(delta)}` : '–';
  return `<div class="g-ri${isMe?' me':''}">
    ${posSlot}
    <div class="g-ri-av" style="${avStyle}">${(p.nome||'?')[0].toUpperCase()}</div>
    <div class="g-ri-info">
      <div class="g-ri-name" style="${isMe?'color:var(--g-pl)':''}">${escH(p.nome)}${isMe?' ★':''}</div>
      <div class="g-ri-meta">${escH(p.turma||'?')} · ${p.total_partidas||0} part.</div>
    </div>
    <div class="g-ri-right">
      <span class="g-ri-lv" style="color:${lvColor}">${p.melhor_nivel||1}</span>
      <span class="g-ri-delta ${dc}">${dt}</span>
    </div>
  </div>`;
}

function isChefaoLv(lv) { return lv >= 130 && lv % 10 === 0; }

function buildLevelMap() {
  const hist = niveis.historico || {};
  const entries = Object.entries(hist)
    .map(([ts, v]) => ({ ts: Number(ts), ...v }))
    .sort((a, b) => a.ts - b.ts);

  const li = {}; // level -> { done, perfect, maestria, consec }
  for (const e of entries) {
    const lv = e.nivel; if (!lv) continue;
    if (!li[lv]) li[lv] = { done: false, perfect: false, maestria: false, consec: 0 };
    if (e.resultado === 'completou') {
      li[lv].done = true;
      const isP = (e.erros || 0) === 0;
      if (isP) { li[lv].perfect = true; li[lv].consec++; if (li[lv].consec >= 3) li[lv].maestria = true; }
      else li[lv].consec = 0;
    } else {
      if (li[lv]) li[lv].consec = 0;
    }
  }

  const maxLv = Math.max(nivelAtual, melhorNivel, 10);
  const displayCount = Math.ceil(Math.max(maxLv + 9, 20) / 10) * 10;

  let html = '';
  for (let lv = 1; lv <= displayCount; lv++) {
    const info   = li[lv] || {};
    const boss   = isChefaoLv(lv);
    let cls, tip, badge = '';

    if (lv === nivelAtual) {
      cls = boss ? 'boss-cur' : 'cur';
      tip = boss ? '👹 Nível Chefão — enfrente agora!' : 'Nível atual';
    } else if (lv > Math.max(nivelAtual, melhorNivel)) {
      cls = boss ? 'boss-lk' : 'lk';
      tip = boss ? '👹 Nível Chefão · Derrote para avançar!' : '';
    } else if (boss) {
      // Chefão já passado
      if (info.perfect) {
        cls = 'boss-pf'; tip = '👹 Chefão derrotado! ⭐ Perfeito!'; badge = '<span class="g-lc-bdi">💀</span>';
      } else if (info.done) {
        cls = 'boss-pf'; tip = '👹 Chefão derrotado!'; badge = '<span class="g-lc-bdi">💀</span>';
      } else {
        cls = 'boss-dn'; tip = '👹 Nível Chefão · Tente de novo!';
      }
    } else if (info.maestria) {
      cls = 'dm'; tip = '💎 Maestria! 3x perfeito'; badge = '<span class="g-lc-bdi">💎</span>';
    } else if (info.perfect) {
      cls = 'pf'; tip = '⭐ Perfeito! Pode refazer'; badge = '<span class="g-lc-bdi">⭐</span>';
    } else {
      cls = 'dn'; tip = 'Refazer para ganhar ⭐';
    }

    const isLocked = cls === 'lk' || cls === 'boss-lk';
    const op    = !isLocked ? `<span class="g-lc-op">${getLvOp(lv)}</span>` : '';
    const click = !isLocked ? `onclick="jogarNivel(${lv})"` : '';
    // Chefões bloqueados mostram 👹 no lugar do número
    const numDisplay = (cls === 'boss-lk') ? `<span style="font-size:12px;line-height:1">👹</span>` : `<span class="g-lc-n">${lv}</span>`;
    html += `<div class="g-lc ${cls}" data-tip="${tip}" ${click}>${badge}${numDisplay}${op}</div>`;
  }
  return html;
}

// ── Operations stats ───────────────────────────────────────────
const opT = { add:0, sub:0, mul:0, div:0 };
for (const [, v] of Object.entries(niveis.historico || {})) {
  if (v.tipos_acertos) {
    opT.add += v.tipos_acertos.add || 0;
    opT.sub += v.tipos_acertos.sub || 0;
    opT.mul += v.tipos_acertos.mul || 0;
    opT.div += v.tipos_acertos.div || 0;
  }
}
const opSum = opT.add + opT.sub + opT.mul + opT.div;
const opPct = k => opSum > 0 ? Math.round(opT[k] / opSum * 100) : 0;

// ── History entries (last 6) ───────────────────────────────────
const histDisplay = Object.entries(niveis.historico || {})
  .map(([ts, v]) => ({ ts: Number(ts), ...v }))
  .sort((a, b) => b.ts - a.ts)
  .slice(0, 6);

// ── Position badge ─────────────────────────────────────────────
let posBadge = '';
if (myGeral === 1)                        posBadge = '🏆 #1 Geral!';
else if (myTurma === 1)                    posBadge = '👑 #1 na turma';
else if (myTurma !== null && myTurma <= 5) posBadge = `🎉 #${myTurma} na turma`;
else if (myTurma !== null)                 posBadge = `#${myTurma} na turma`;
else if (myGeral !== null)                 posBadge = `#${myGeral} geral`;

// ── Distance bar ───────────────────────────────────────────────
const topLv   = liderGeral ? (liderGeral.melhor_nivel || 1) : nivelAtual;
const barPct  = topLv > 0 ? Math.min(100, Math.round(nivelAtual / topLv * 100)) : 100;
const distCap = liderGeral && liderGeral.nome !== nomeAluno
  ? `<strong>${topLv - nivelAtual}</strong> nível${topLv - nivelAtual !== 1 ? 'is' : ''} de distância para ${escH(liderGeral.nome)} · ${escH(liderGeral.turma||'?')}`
  : `<strong>🏆 Você é o líder geral!</strong>`;

// ── Ranking rows ───────────────────────────────────────────────
function buildRankList(list, listPos, meIdx) {
  try {
    const top = list.slice(0, 7);
    const meInTop = top.some(p => p.nome === nomeAluno && p.turma === turma);
    if (!meInTop && meIdx >= 7) top.push(list[meIdx]);
    return top.map(p => {
      const realIdx = list.findIndex(r => r.nome === p.nome && r.turma === p.turma);
      const isMe = p.nome === nomeAluno && p.turma === turma;
      return buildRankRow(p, listPos[realIdx], isMe);
    }).join('');
  } catch(e) {
    console.error('[jogos] buildRankList:', e);
    return '<div style="color:var(--g-red);font-size:11px;padding:8px">Erro ao carregar ranking.</div>';
  }
}

// ── Render full page ───────────────────────────────────────────
document.getElementById("content").innerHTML = `
<div class="g-page">

  <!-- ── Tabuada card ── -->
  <div class="g-card">
    <div class="g-card-top">
      <div class="g-title">
        <div class="g-icon">🎯</div>
        <div>
          <h2>Tabuada</h2>
          <p>Combine operações com seus resultados</p>
        </div>
      </div>
      <div class="g-lv-badge">
        <span class="lbl">Nível atual</span>
        <span class="val">${nivelAtual}</span>
      </div>
    </div>

    <div class="g-stats">
      <div class="g-stat"><div class="v" style="color:var(--g-pl)">${melhorNivel}</div><div class="l">Melhor nível</div></div>
      <div class="g-stat"><div class="v" style="color:var(--g-cyan)">${totalPart}</div><div class="l">Partidas</div></div>
      <div class="g-stat"><div class="v" style="color:var(--g-orange)">🔥 ${maiorCombo||'—'}</div><div class="l">Maior combo</div></div>
    </div>

    <!-- Distância pro líder -->
    <div class="g-dist">
      <div class="g-dist-lbl">Distância pro líder geral</div>
      <div class="g-dist-row">
        <span class="g-dist-you">Nv ${nivelAtual}</span>
        <div class="g-dist-bw"><div class="g-dist-bf" style="width:${barPct}%"></div></div>
        <span class="g-dist-top">Nv ${topLv}</span>
      </div>
      <div class="g-dist-cap">${distCap}</div>
    </div>

    <!-- Live info -->
    <div class="g-live">
      <div class="g-live-dot"><span class="dot"></span><strong>${sessoesHoje}</strong>&nbsp;sessões hoje</div>
      ${liderTurma && liderTurma.nome !== nomeAluno ? `
      <div class="g-ldr-info">
        <span>🏫</span>
        <strong>${escH(liderTurma.nome)}</strong>
        <span>lidera ${escH(turma)}</span>
        <span style="color:var(--g-muted);opacity:.5">·</span>
        <span class="g-ldr-lv">Nv ${liderTurma.melhor_nivel||1}</span>
      </div>` : liderTurma ? `<div class="g-ldr-info">👑 <strong style="color:var(--g-gold)">Você lidera ${escH(turma)}!</strong></div>` : ''}
      ${posBadge ? `<div class="g-pos-badge">${posBadge}</div>` : ''}
    </div>

    <!-- Mode selector -->
    <div class="g-modes">
      <button class="g-mode normal active" id="gBtnNormal" onclick="gSetMode('normal')">
        <span class="ico">▶</span>
        <div><span class="nm">Normal</span><span class="ds">Suba de nível no seu ritmo</span></div>
      </button>
      <button class="g-mode sprint" id="gBtnSprint" onclick="gSetMode('sprint')">
        <span class="ico">⚡</span>
        <div><span class="nm">Sprint</span><span class="ds">Máximo de pares em 3 min</span></div>
      </button>
    </div>

    <!-- Play button -->
    <div class="g-play-area">
      <button class="g-play-btn nm" id="gPlayBtn" onclick="gPlay()">
        <span class="arr">▶</span> JOGAR AGORA
      </button>
    </div>
  </div>

  <!-- ── Bottom grid: ops + history ── -->
  <div class="g-bottom">
    <div class="g-mini ops">
      <h3>📊 Operações praticadas</h3>
      <div class="g-ops">
        ${[
          ['add','+','Soma','var(--g-green)'],
          ['sub','−','Subtração','var(--g-cyan)'],
          ['mul','×','Multiplicação','var(--g-orange)'],
          ['div','÷','Divisão','#ff79c6'],
        ].map(([k,sym,nome,col]) => `
        <div class="g-op">
          <div class="v" style="color:${col}">${opT[k]||0}</div>
          <div class="n">${sym} ${nome}</div>
          <div class="p" style="color:${col}">${opPct(k)}%</div>
        </div>`).join('')}
      </div>
    </div>

    <div class="g-mini hist">
      <h3>🕐 Últimas partidas</h3>
      <div class="g-hist">
        ${histDisplay.length ? histDisplay.map(e => {
          const ok = e.resultado === 'completou';
          const ts = new Date(e.ts);
          const tm = `${ts.getHours()}:${String(ts.getMinutes()).padStart(2,'0')}`;
          const combo = e.maior_combo_sessao || 0;
          const tag = ok ? (e.erros===0 ? '✨ Perfeito' : '✓ Ok') : '⏱ Tempo';
          const tagCol = ok ? 'var(--g-green)' : 'var(--g-red)';
          return `<div class="g-hi">
            <span class="g-hi-b ${ok?'ok':'fail'}">N${e.nivel||'?'}</span>
            <span class="g-hi-s">✓${e.acertos||0} ✗${e.erros||0}</span>
            <span style="color:${tagCol};font-size:10px">${tag}</span>
            <span class="g-hi-c">🔥${combo}</span>
            <span class="g-hi-t">${tm}</span>
          </div>`;
        }).join('')
        : '<div style="color:var(--g-muted);font-size:12px;padding:8px 0">Nenhuma partida ainda.</div>'}
      </div>
    </div>
  </div>

  <!-- ── Ranking blocks ── -->
  <div class="g-rank-wrap">
    <div class="g-rb geral">
      <div class="g-rb-hdr"><h3>🏆 Ranking Geral</h3></div>
      <div class="g-rb-list">
        ${rankAll.length
          ? buildRankList(rankAll, rankAllPos, myGeralIdx)
          : '<div style="color:var(--g-muted);font-size:12px;padding:8px">Nenhum dado ainda.</div>'}
      </div>
    </div>
    <div class="g-rb turma">
      <div class="g-rb-hdr"><h3>🏫 Turma ${escH(turma)}</h3></div>
      <div class="g-rb-list">
        ${rankTurma.length
          ? buildRankList(rankTurma, rankTurmaPos, myTurmaIdx)
          : '<div style="color:var(--g-muted);font-size:12px;padding:8px">Nenhum aluno da turma ainda.</div>'}
      </div>
    </div>
  </div>

  <!-- ── Level map ── -->
  <div class="g-lvmap">
    <div class="g-lvmap-hdr">
      <h3>⭐ Mapa de Níveis</h3>
      <div class="g-legend">
        <div class="g-leg"><span class="g-leg-d dm"></span>Maestria</div>
        <div class="g-leg"><span class="g-leg-d pf"></span>Perfeito</div>
        <div class="g-leg"><span class="g-leg-d dn"></span>Concluído</div>
        <div class="g-leg"><span class="g-leg-d lk"></span>Bloqueado</div>
        <div class="g-leg"><span style="font-size:8px;line-height:1">👹</span>Chefão</div>
      </div>
    </div>
    <div class="g-grid">${buildLevelMap()}</div>
  </div>

</div>`;

// ── Event handlers ─────────────────────────────────────────────
let gMode = 'normal';

window.gSetMode = function(mode) {
  gMode = mode;
  document.getElementById('gBtnNormal')?.classList.toggle('active', mode === 'normal');
  document.getElementById('gBtnSprint')?.classList.toggle('active', mode === 'sprint');
  const btn = document.getElementById('gPlayBtn');
  if (!btn) return;
  if (mode === 'sprint') {
    btn.className = 'g-play-btn sp';
    btn.innerHTML = '<span class="arr">⚡</span> SPRINT';
  } else {
    btn.className = 'g-play-btn nm';
    btn.innerHTML = '<span class="arr">▶</span> JOGAR AGORA';
  }
};

window.gPlay = function() {
  window.location.href = gMode === 'sprint'
    ? '/aluno/tabuada.html?modo=sprint'
    : '/aluno/tabuada.html';
};

window.jogarNivel = function(lv) {
  window.location.href = lv === nivelAtual
    ? '/aluno/tabuada.html'
    : `/aluno/tabuada.html?nivel=${lv}`;
};

window.toggleAvatarMenu = function() {
  document.getElementById('avatar-menu').classList.toggle('open');
};
document.addEventListener('click', e => {
  if (!e.target.closest('.avatar-wrap'))
    document.getElementById('avatar-menu')?.classList.remove('open');
});
</script>
</body>
</html>
