<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>⚔️ Duelo — Sistema de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    :root {
      --eu:  #3b82f6;
      --adv: #ef4444;
    }
    body { min-height: 100dvh; background: var(--bg); }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: var(--card);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
    }
    .topbar-title { font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700; }
    .topbar-sub   { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

    /* ── Arena ── */
    .duelo-arena {
      max-width: 560px; margin: 0 auto;
      padding: 20px 16px 40px;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* ── Placar ── */
    .placar-wrap {
      display: grid; grid-template-columns: 1fr auto 1fr;
      gap: 10px; align-items: center;
    }
    .lado {
      background: var(--card); border: 2px solid;
      border-radius: 16px; padding: 12px 10px; text-align: center;
    }
    .lado.eu  { border-color: var(--eu);  box-shadow: 0 0 16px rgba(59,130,246,.2); }
    .lado.adv { border-color: var(--adv); box-shadow: 0 0 16px rgba(239,68,68,.15); }
    .lado-av  {
      width: 46px; height: 46px; border-radius: 50%; overflow: hidden;
      margin: 0 auto 6px; border: 2px solid; background: var(--card2);
    }
    .lado.eu  .lado-av { border-color: var(--eu); }
    .lado.adv .lado-av { border-color: var(--adv); }
    .lado-av img { width: 100%; height: 100%; object-fit: cover; }
    .lado-nome { font-size: 10px; font-weight: 700; color: var(--text-muted);
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lado-pts  { font-size: 30px; font-weight: 900; line-height: 1.1; margin-top: 3px; }
    .lado.eu  .lado-pts { color: var(--eu); }
    .lado.adv .lado-pts { color: var(--adv); }
    .lado-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }

    .vs-center  { text-align: center; }
    .vs-label   { font-size: 16px; font-weight: 900; color: var(--text-muted); margin-bottom: 4px; }
    .vs-timer   {
      font-family: 'Orbitron', monospace; font-size: 24px; font-weight: 900;
      color: var(--text); font-variant-numeric: tabular-nums;
    }
    .vs-timer.urgente { color: var(--adv); animation: blink .5s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ── Questão ── */
    .questao-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; padding: 28px 20px; text-align: center;
    }
    .questao-expr {
      font-family: 'Orbitron', monospace; font-size: 42px; font-weight: 900;
      color: var(--text); margin-bottom: 8px; line-height: 1.1;
    }
    .questao-num { font-size: 12px; color: var(--text-muted); }

    /* ── Opções ── */
    .opcoes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .opcao {
      padding: 18px 10px; background: var(--card); border: 2px solid var(--border);
      border-radius: 14px; font-size: 24px; font-weight: 800;
      font-family: 'Orbitron', monospace; text-align: center;
      cursor: pointer; transition: all .12s; color: var(--text);
    }
    .opcao:hover:not(:disabled)  { border-color: var(--eu); color: var(--eu); }
    .opcao.certo  { border-color: #22c55e; background: rgba(34,197,94,.15); color: #22c55e; }
    .opcao.errado { border-color: var(--adv); background: rgba(239,68,68,.12); color: var(--adv); }
    .opcao:disabled { cursor: not-allowed; }

    /* ── Loading ── */
    .loading-wrap {
      text-align: center; padding: 60px 20px;
      color: var(--text-muted); font-size: 14px;
    }
    .loading-spinner {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--purple); border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Resultado ── */
    .resultado-wrap {
      text-align: center; padding: 32px 20px;
      display: flex; flex-direction: column; gap: 18px; align-items: center;
    }
    .resultado-emoji { font-size: 64px; }
    .resultado-titulo { font-size: 26px; font-weight: 900; font-family: 'Rajdhani', sans-serif; }
    .resultado-placar {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%;
    }
    .resultado-lado {
      background: var(--card); border: 2px solid;
      border-radius: 14px; padding: 16px; text-align: center;
    }
    .resultado-lado.eu  { border-color: var(--eu); }
    .resultado-lado.adv { border-color: var(--adv); }
    .resultado-nome { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
    .resultado-pts  { font-size: 38px; font-weight: 900; }
    .resultado-lado.eu  .resultado-pts { color: var(--eu); }
    .resultado-lado.adv .resultado-pts { color: var(--adv); }
    .resultado-xp {
      font-size: 22px; font-weight: 800;
      padding: 10px 24px; border-radius: 12px;
      background: var(--card); border: 1px solid var(--border);
    }
    .btn-voltar-duelos {
      padding: 13px 32px; background: var(--purple); color: #fff;
      border: none; border-radius: 12px; font-size: 15px;
      font-weight: 700; cursor: pointer;
    }
    .btn-voltar-duelos:hover { opacity: .85; }

    @media (max-width: 400px) {
      .questao-expr { font-size: 32px; }
      .opcao { font-size: 20px; padding: 14px 8px; }
      .lado-pts { font-size: 24px; }
      .vs-timer { font-size: 18px; }
    }
  </style>
</head>
<body>
<script>(()=>{const t=localStorage.getItem('tema');if(t==='escuro')document.documentElement.setAttribute('data-theme','dark');})()</script>

<div class="topbar">
  <div>
    <div class="topbar-title">⚔️ Duelo em andamento</div>
    <div class="topbar-sub" id="topbar-diff"></div>
  </div>
  <button onclick="confirmarSair()"
    style="padding:7px 14px;border-radius:9px;border:1px solid var(--border);
           background:transparent;color:var(--text-muted);font-size:12px;
           font-weight:600;cursor:pointer;margin-left:auto">
    ✖ Sair do duelo
  </button>
  <div id="topbar-avatar-circle" style="width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--card2)"></div>
</div>

<div id="dupla-badge-partida" style="display:none;text-align:center;padding:4px 0 0;font-size:12px;color:#00d4ff;font-weight:600"></div>
<div id="duelo-arena" class="duelo-arena">
  <div class="loading-wrap">
    <div class="loading-spinner"></div>
    Carregando duelo...
  </div>
</div>

<script type="module">
import { requireAluno, clearSession, lerDuplaAtiva } from '/js/auth.js';
import { db } from '/js/firebase-config.js';
import { ref, get, set, update, onValue } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
import { getPerfil } from '/js/db.js';
import { avatarUrl, avatarHtml, avatarConfigDefault, DUELO_DURACAO_SEGUNDOS, DUELO_ERRO_PENALIDADE, XP_DUELO } from '/js/gamificacao.js';
import { atualizarPresenca } from '/js/presenca.js';

// ── Setup ──────────────────────────────────────────────────────
const sess = requireAluno('/index.html');
if (!sess) throw new Error();
const { alunos, turma } = sess;
const uid = (turma + '_' + alunos[0]).replace(/[.#$[\]/\s]/g, '_');

const params  = new URLSearchParams(location.search);
const dueloId = params.get('id');
if (!dueloId) { window.location.href = '/aluno/duelos.html'; throw new Error(); }

const perfil   = await getPerfil(uid);
const apelido  = perfil?.apelido_ativo || alunos[0];
const meuAvatar = avatarUrl(perfil?.avatar || avatarConfigDefault());

const _duplaPartida = lerDuplaAtiva();

// Avatar topbar
(async () => { try {
  const _c = document.getElementById('topbar-avatar-circle');
  if (_c) _c.innerHTML = avatarHtml(perfil?.avatar || avatarConfigDefault(), alunos[0], '100%');
} catch(_) {} })();

// ── Carregar duelo ─────────────────────────────────────────────
const dueloSnap = await get(ref(db, `duelos/${dueloId}`));
if (!dueloSnap.exists()) { window.location.href = '/aluno/duelos.html'; throw new Error(); }
const duelo = dueloSnap.val();

if (duelo.status === 'encerrado' || duelo.status === 'expirado') {
  window.location.href = '/aluno/duelos.html';
  throw new Error();
}
// Badge de dupla
try {
  const _dd = _duplaPartida;
  if (_dd?.nome) {
    const el = document.getElementById('dupla-badge-partida');
    if (el) { el.textContent = `👥 Dupla: ${_dd.nome} · ${_dd.turma}`; el.style.display = 'block'; }
  }
} catch(e) {}

const adversarioUid   = duelo.criador_uid === uid ? duelo.adversario_uid   : duelo.criador_uid;
const adversarioNome  = duelo.criador_uid === uid ? (duelo.adversario_nome || '?') : duelo.criador_nome;

const _meuParceiroNome  = _duplaPartida?.nome  || duelo.criador_parceiro_nome  || duelo.adversario_parceiro_nome  || '';
const _meuParceiroTurma = _duplaPartida?.turma || duelo.criador_parceiro_turma || duelo.adversario_parceiro_turma || '';
const _advParceiroNome  = duelo.criador_uid === uid
  ? (duelo.adversario_parceiro_nome  || '')
  : (duelo.criador_parceiro_nome     || '');
const _advParceiroTurma = duelo.criador_uid === uid
  ? (duelo.adversario_parceiro_turma || '')
  : (duelo.criador_parceiro_turma    || '');

const _meuParcUid = _meuParceiroNome
  ? (_meuParceiroTurma + '_' + _meuParceiroNome).replace(/[.#$[\]/\s]/g, '_')
  : null;
const _advParcUid = _advParceiroNome
  ? (_advParceiroTurma + '_' + _advParceiroNome).replace(/[.#$[\]/\s]/g, '_')
  : null;

const adversarioPerfil = await getPerfil(adversarioUid).catch(() => ({}));
const adversarioAvatar = avatarUrl(adversarioPerfil?.avatar || avatarConfigDefault());

const dificuldade = duelo.dificuldade || 'medio';
const duracaoS    = DUELO_DURACAO_SEGUNDOS[dificuldade];
const diffLabels  = { facil: '🟢 Fácil · 3 min', medio: '🟡 Médio · 4 min', dificil: '🔴 Difícil · 5 min' };
document.getElementById('topbar-diff').textContent = diffLabels[dificuldade] || dificuldade;

// ── Estado ────────────────────────────────────────────────────
const estado = {
  questaoAtual: 0,
  meusPontos:   0,
  advPontos:    0,
  finalizado:   false,
};

let _timerInterval;

// ── Helpers ───────────────────────────────────────────────────
function escH(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function r(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function fmtPts(n) {
  const s = n.toFixed(1);
  return s.endsWith('.0') ? s.slice(0,-2) : s;
}

// ── Questões ──────────────────────────────────────────────────
function gerarUmaQuestao() {
  // offset por dificuldade: medio começa na faixa 3, dificil na faixa 4-5
  const offset = dificuldade === 'dificil' ? 24 : dificuldade === 'medio' ? 16 : 0;
  const faixaNum = estado.questaoAtual + 1 + offset;

  let tipo;
  if      (faixaNum <= 8)  tipo = 'aquecimento';
  else if (faixaNum <= 16) tipo = 'subtNeg';
  else if (faixaNum <= 24) tipo = 'sinalFrente';
  else if (faixaNum <= 32) tipo = 'multDiv';
  else if (faixaNum <= 40) tipo = 'parenteses';
  else {
    const tipos = ['subtNeg', 'sinalFrente', 'multDiv', 'parenteses'];
    tipo = tipos[Math.floor(Math.random() * tipos.length)];
  }

  let expr, resp;

  if (tipo === 'aquecimento') {
    const ops = ['+', '-', '×'];
    const op = ops[Math.floor(Math.random() * ops.length)];
    if (op === '+') {
      const a = r(1,12), b = r(1,12);
      expr = `${a} + ${b}`; resp = a + b;
    } else if (op === '-') {
      const b = r(1,12), a = r(b,12);
      expr = `${a} - ${b}`; resp = a - b;
    } else {
      const a = r(1,11), b = r(1,11);
      expr = `${a} × ${b}`; resp = a * b;
    }

  } else if (tipo === 'subtNeg') {
    const b = r(2,12), a = r(1, b - 1);
    expr = `${a} - ${b}`; resp = a - b;

  } else if (tipo === 'sinalFrente') {
    const A = r(1,12), b = r(1,12);
    const op = Math.random() > 0.5 ? '+' : '-';
    expr = `-${A}${op}${b}`;
    resp = op === '+' ? (-A + b) : (-A - b);

  } else if (tipo === 'multDiv') {
    const usaDiv = Math.random() > 0.5;
    const sA = Math.random() > 0.5 ? -1 : 1;
    const sB = Math.random() > 0.5 ? -1 : 1;
    if (usaDiv) {
      const bAbs = r(1,11), rAbs = r(1,11);
      const A = sA * bAbs * rAbs, B = sB * bAbs;
      resp = A / B;
      expr = `${A}÷${B}`;
    } else {
      const A = sA * r(1,11), B = sB * r(1,11);
      resp = A * B;
      expr = `${A}×${B}`;
    }

  } else { // parenteses
    const a = r(1,10), b = r(1,10);
    const fmt = Math.floor(Math.random() * 4);
    if (fmt === 0) {
      expr = `${a}-(${b})`; resp = a - b;
    } else if (fmt === 1) {
      expr = `-${a}-(-${b})`; resp = -a + b;
    } else if (fmt === 2) {
      expr = `(-${a})+(${b})`; resp = -a + b;
    } else {
      expr = `-(${a})+${b}`; resp = -a + b;
    }
  }

  return { expr, resp };
}

function proximaQuestao() {
  const questao = gerarUmaQuestao();
  estado.questaoAtual++;
  renderQuestaoUnica(questao);
}

// ── Opções ────────────────────────────────────────────────────
function gerarOpcoes(resp) {
  const erradas = new Set();
  // distrator de sinal: incluir -resp para treinar regra de sinais
  if (resp !== 0) erradas.add(-resp);
  let tentativas = 0;
  while (erradas.size < 3 && tentativas < 100) {
    tentativas++;
    const delta = r(1, 10);
    const candidato = Math.random() > 0.5 ? resp + delta : resp - delta;
    if (candidato !== resp && !erradas.has(candidato)) erradas.add(candidato);
  }
  return [...erradas, resp].sort(() => Math.random() - 0.5);
}

// ── Render placar (template) ──────────────────────────────────
function renderArena() {
  document.getElementById('duelo-arena').innerHTML = `
    <div class="placar-wrap">
      <div class="lado eu">
        <div class="lado-av"><img src="${meuAvatar}" alt="" onerror="this.src=''"></div>
        <div class="lado-nome">
          ${escH(apelido)}
          ${_meuParceiroNome ? `<span style="font-size:10px;opacity:.6"> + ${escH(_meuParceiroNome)}</span>` : ''}
        </div>
        <div class="lado-pts" id="eu-pts">0</div>
        <div class="lado-label">pares</div>
      </div>
      <div class="vs-center">
        <div class="vs-label">VS</div>
        <div class="vs-timer" id="vs-timer">${Math.floor(duracaoS/60)}:00</div>
      </div>
      <div class="lado adv">
        <div class="lado-av"><img src="${adversarioAvatar}" alt="" onerror="this.src=''"></div>
        <div class="lado-nome">
          ${escH(adversarioNome)}
          ${_advParceiroNome ? `<span style="font-size:10px;opacity:.6"> + ${escH(_advParceiroNome)}</span>` : ''}
        </div>
        <div class="lado-pts" id="adv-pts">0</div>
        <div class="lado-label">pares</div>
      </div>
    </div>
    <div class="questao-card">
      <div class="questao-expr" id="questao-expr">...</div>
      <div class="questao-num"  id="questao-num"></div>
    </div>
    <div class="opcoes-grid" id="opcoes-grid"></div>
  `;
}

// ── Render questão ────────────────────────────────────────────
function renderQuestaoUnica(q) {
  document.getElementById('questao-expr').textContent = q.expr;
  document.getElementById('questao-num').textContent  = `Questão ${estado.questaoAtual}`;

  const opcoes = gerarOpcoes(q.resp);
  document.getElementById('opcoes-grid').innerHTML = opcoes.map(op =>
    `<button class="opcao" onclick="responder(${op},${q.resp},this)">${op}</button>`
  ).join('');
}

// ── Responder ─────────────────────────────────────────────────
window.responder = function(escolha, respCorreta, btnEl) {
  if (estado.finalizado) return;
  // desabilitar todos
  document.querySelectorAll('.opcao').forEach(b => { b.onclick = null; b.disabled = true; });

  const certo = escolha === respCorreta;
  const erroSinal = !certo && respCorreta !== 0 && escolha === -respCorreta;
  btnEl.classList.add(certo ? 'certo' : 'errado');

  if (certo) {
    estado.meusPontos += 1;
  } else {
    estado.meusPontos = Math.max(0, estado.meusPontos - DUELO_ERRO_PENALIDADE);
    document.querySelectorAll('.opcao').forEach(b => {
      if (Number(b.textContent) === respCorreta) b.classList.add('certo');
    });
    if (erroSinal) {
      const numEl = document.getElementById('questao-num');
      if (numEl) numEl.textContent += ' ⚠️ Cuidado com o sinal!';
    }
  }

  // placar ao vivo
  set(ref(db, `duelos/${dueloId}/placar_live/${uid}`), estado.meusPontos).catch(() => {});
  const euEl = document.getElementById('eu-pts');
  if (euEl) euEl.textContent = fmtPts(estado.meusPontos);

  setTimeout(() => {
    if (estado.finalizado) return;
    proximaQuestao();
  }, erroSinal ? 1000 : 600);
};

// ── Timer ─────────────────────────────────────────────────────
async function iniciarTimer() {
  const snap = await get(ref(db, `duelos/${dueloId}/ts_aceito`));
  const tsInicio  = snap.val() || Date.now();
  const tsEncerra = tsInicio + (duracaoS * 1000);

  _timerInterval = setInterval(() => {
    const restMs = tsEncerra - Date.now();
    const restS  = Math.max(0, Math.ceil(restMs / 1000));
    const m = Math.floor(restS / 60);
    const s = restS % 60;
    const el = document.getElementById('vs-timer');
    if (el) {
      el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
      el.className = 'vs-timer' + (restS <= 30 ? ' urgente' : '');
    }
    if (restMs <= 0) encerrarPartida('tempo');
  }, 500);
}

// ── Iniciar partida ───────────────────────────────────────────
async function iniciarPartida() {
  renderArena();
  proximaQuestao();
  iniciarTimer();

  // Escutar placar do adversário em tempo real
  onValue(ref(db, `duelos/${dueloId}/placar_live/${adversarioUid}`), snap => {
    if (snap.exists()) {
      estado.advPontos = snap.val();
      const el = document.getElementById('adv-pts');
      if (el) el.textContent = fmtPts(estado.advPontos);
    }
  });

  // Encerrar se adversário abandonar (status vai para 'encerrado' antes do tempo)
  onValue(ref(db, `duelos/${dueloId}/status`), snap => {
    if (snap.val() === 'encerrado' && !estado.finalizado) {
      encerrarPartida('tempo');
    }
  });
}

// ── Encerrar ──────────────────────────────────────────────────
async function encerrarPartida(motivo) {
  if (estado.finalizado) return;
  estado.finalizado = true;
  clearInterval(_timerInterval);

  if (motivo === 'abandono') {
    await set(ref(db, `duelos/${dueloId}/resultado/${uid}`), {
      pares: 0, tempo_ms: 0, abandono: true,
    });
    await update(ref(db, `duelos/${dueloId}`), {
      status:                 'encerrado',
      vencedor_uid:           adversarioUid,
      encerrado_por_abandono: true,
    });
    try {
      const { adicionarXP } = await import('/js/db.js');
      await adicionarXP(uid, XP_DUELO[dificuldade].derrota);
      if (_meuParcUid) {
        try { await adicionarXP(_meuParcUid, XP_DUELO[dificuldade].derrota); } catch(e) {}
      }
    } catch(e) {}
    await atualizarPresenca({ em_duelo: false, status: 'disponivel' });
    window.location.href = '/aluno/duelos.html';
    return;
  }

  // Salvar meu resultado
  await set(ref(db, `duelos/${dueloId}/resultado/${uid}`), {
    pares:    estado.meusPontos,
    tempo_ms: duracaoS * 1000,
  });

  // Aguardar resultado do adversário (max 5s) — timer sincronizado, encerram juntos
  let tentativas = 0;
  const aguardar = setInterval(async () => {
    tentativas++;
    const snap = await get(ref(db, `duelos/${dueloId}/resultado`));
    const res  = snap.val() || {};
    if ((res[uid] && res[adversarioUid]) || tentativas >= 5) {
      clearInterval(aguardar);
      await update(ref(db, `duelos/${dueloId}`), { status: 'encerrado' });
      await atualizarPresenca({ em_duelo: false, status: 'disponivel' });
      mostrarResultado(res);
    }
  }, 1000);
}

// ── Salvar histórico local ─────────────────────────────────────
async function salvarHistoricoLocal(euGanhei, empate, xpDelta, meuRes, advRes,
                                    _adversarioUid, _adversarioNome, _adversarioTurma) {
  try {
    const perfSnap = await get(ref(db, `perfis/${uid}`));
    const perf = perfSnap.exists() ? perfSnap.val() : {};

    await set(ref(db, `perfis/${uid}/historico_duelos/${dueloId}`), {
      duelo_id:           dueloId,
      dificuldade:        dificuldade,
      adversario_uid:     _adversarioUid  || '',
      adversario_nome:    _adversarioNome || '',
      adversario_turma:   _adversarioTurma || '',
      parceiro_nome:      _meuParceiroNome  || '',
      parceiro_turma:     _meuParceiroTurma || '',
      adv_parceiro_nome:  _advParceiroNome  || '',
      adv_parceiro_turma: _advParceiroTurma || '',
      meus_pares:         meuRes?.pares  ?? 0,
      adv_pares:          advRes?.pares  ?? 0,
      resultado:          euGanhei ? 'vitoria' : empate ? 'empate' : 'derrota',
      xp_delta:           xpDelta,
      ts:                 Date.now(),
    });

    await update(ref(db, `perfis/${uid}`), {
      duelos_total:    (perf.duelos_total    || 0) + 1,
      duelos_vitorias: (perf.duelos_vitorias || 0) + (euGanhei ? 1 : 0),
    });
    if (_meuParcUid) {
      try {
        const parcSnap = await get(ref(db, `perfis/${_meuParcUid}`));
        const parc = parcSnap.exists() ? parcSnap.val() : {};
        await update(ref(db, `perfis/${_meuParcUid}`), {
          duelos_total:    (parc.duelos_total    || 0) + 1,
          duelos_vitorias: (parc.duelos_vitorias || 0) + (euGanhei ? 1 : 0),
        });
      } catch(e) { console.warn('[Ranking parceiro]', e); }
    }
    if (_advParcUid) {
      try {
        const advParcSnap = await get(ref(db, `perfis/${_advParcUid}`));
        const advParc = advParcSnap.exists() ? advParcSnap.val() : {};
        await update(ref(db, `perfis/${_advParcUid}`), {
          duelos_total:    (advParc.duelos_total    || 0) + 1,
          duelos_vitorias: (advParc.duelos_vitorias || 0) + (euGanhei ? 0 : empate ? 0 : 1),
        });
      } catch(e) { console.warn('[Ranking parceiro adv]', e); }
    }

    console.log('[Histórico] salvo com sucesso');
  } catch(e) {
    console.error('[Histórico ERRO]', e);
  }
}

// ── Resultado ─────────────────────────────────────────────────
async function mostrarResultado(resultadosParam) {
  let resultados = resultadosParam;
  if (!resultados) {
    const snap = await get(ref(db, `duelos/${dueloId}/resultado`));
    resultados = snap.val() || {};
  }

  // Re-carregar duelo para pegar vencedor_uid e dados atualizados
  const dueloAtualSnap = await get(ref(db, `duelos/${dueloId}`));
  const dueloAtual     = dueloAtualSnap.val() || duelo;

  const _adversarioUid  = dueloAtual.criador_uid === uid
    ? dueloAtual.adversario_uid
    : dueloAtual.criador_uid;
  const _adversarioNome = dueloAtual.criador_uid === uid
    ? (dueloAtual.adversario_nome  || adversarioNome)
    : (dueloAtual.criador_nome     || adversarioNome);
  const _adversarioTurma = dueloAtual.criador_uid === uid
    ? (dueloAtual.adversario_turma || '')
    : (dueloAtual.criador_turma    || '');

  const meuRes  = resultados[uid]            || { pares: estado.meusPontos };
  const advRes  = resultados[_adversarioUid] || { pares: estado.advPontos  };

  // Se vencedor_uid já está definido (abandono), usar isso
  let euGanhei, empate;
  if (dueloAtual.vencedor_uid) {
    euGanhei = dueloAtual.vencedor_uid === uid;
    empate   = false;
  } else {
    euGanhei = meuRes.pares > advRes.pares;
    empate   = meuRes.pares === advRes.pares;
  }

  const xpDelta = euGanhei
    ? XP_DUELO[dificuldade].vitoria
    : empate ? 0 : XP_DUELO[dificuldade].derrota;

  // Aplicar XP
  if (xpDelta !== 0) {
    try {
      const { adicionarXP } = await import('/js/db.js');
      await adicionarXP(uid, xpDelta);
      if (_meuParcUid) {
        try { await adicionarXP(_meuParcUid, xpDelta); } catch(e) { console.warn('[XP parceiro]', e); }
      }
    } catch(e) { console.error('[XP ERRO]', e); }
  }

  // XP de vitória para quem ficou quando o adversário abandonou
  if (dueloAtual.encerrado_por_abandono && euGanhei) {
    try {
      const { adicionarXP } = await import('/js/db.js');
      await adicionarXP(uid, XP_DUELO[dificuldade].vitoria);
      if (_meuParcUid) {
        try { await adicionarXP(_meuParcUid, XP_DUELO[dificuldade].vitoria); } catch(e) {}
      }
    } catch(e) { console.error('[XP abandono ERRO]', e); }
  }

  // Salvar histórico (guarda duplicação internamente)
  await salvarHistoricoLocal(
    euGanhei, empate, xpDelta,
    meuRes, advRes,
    _adversarioUid, _adversarioNome, _adversarioTurma
  );
  // Dupla: salvar histórico para parceiro
  if (_meuParceiroNome && _meuParceiroTurma) {
    const _parcUid = (_meuParceiroTurma + '_' + _meuParceiroNome).replace(/[.#$[\]/\s]/g, '_');
    try {
      await set(ref(db, `perfis/${_parcUid}/historico_duelos/${dueloId}`), {
        duelo_id:           dueloId,
        dificuldade:        dificuldade,
        adversario_uid:     _adversarioUid  || '',
        adversario_nome:    _adversarioNome || '',
        adversario_turma:   _adversarioTurma || '',
        adv_parceiro_nome:  _advParceiroNome  || '',
        adv_parceiro_turma: _advParceiroTurma || '',
        parceiro_nome:      alunos[0],
        parceiro_turma:     turma,
        meus_pares:         meuRes?.pares  ?? 0,
        adv_pares:          advRes?.pares  ?? 0,
        resultado:          euGanhei ? 'vitoria' : empate ? 'empate' : 'derrota',
        xp_delta:           xpDelta,
        ts:                 Date.now(),
      });
    } catch(e) { console.error('[Histórico parceiro ERRO]', e); }
  }
  if (_advParcUid) {
    try {
      await set(ref(db, `perfis/${_advParcUid}/historico_duelos/${dueloId}`), {
        duelo_id:              dueloId,
        dificuldade:           dificuldade,
        adversario_uid:        uid,
        adversario_nome:       alunos[0],
        adversario_turma:      turma,
        adv_parceiro_nome:     _meuParceiroNome  || '',
        adv_parceiro_turma:    _meuParceiroTurma || '',
        parceiro_nome:         _adversarioNome   || '',
        parceiro_turma:        _adversarioTurma  || '',
        meus_pares:            advRes?.pares  ?? 0,
        adv_pares:             meuRes?.pares  ?? 0,
        resultado:             euGanhei ? 'derrota' : empate ? 'empate' : 'vitoria',
        xp_delta:              euGanhei
                                 ? XP_DUELO[dificuldade].derrota
                                 : XP_DUELO[dificuldade].vitoria,
        ts:                    Date.now(),
      });
    } catch(e) { console.warn('[Histórico parceiro adv]', e); }
  }

  // Feed global — escrever evento do duelo (só quem ganhou escreve, evita duplicação)
  if (euGanhei) {
    try {
      const { push: fbPush } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
      const diffLabel = { facil: 'Fácil', medio: 'Médio', dificil: 'Difícil' }[dificuldade] || dificuldade;
      await set(fbPush(ref(db, 'feed_global')), {
        tipo:  'duelo',
        uid,
        nome:  apelido,
        turma,
        texto: `⚔️ ${apelido}${_meuParceiroNome ? ' + ' + _meuParceiroNome : ''} venceu ${_adversarioNome}${_advParceiroNome ? ' + ' + _advParceiroNome : ''} no duelo ${diffLabel}`,
        ts:    Date.now(),
      });
    } catch(e) { console.warn('[Feed duelo]', e); }
  }
  try {
    const { verificarConquistas } = await import('/js/conquistas.js');
    await verificarConquistas(uid, {});
    if (_meuParcUid) {
      try { await verificarConquistas(_meuParcUid, {}); } catch(e) {}
    }
    if (_advParcUid) {
      try { await verificarConquistas(_advParcUid, {}); } catch(e) {}
    }
  } catch(e) {}

  // Renderizar tela de resultado
  document.getElementById('duelo-arena').innerHTML = `
    <div style="text-align:center;padding:32px 20px;
                display:flex;flex-direction:column;gap:20px;align-items:center">
      <div style="font-size:64px">
        ${euGanhei ? '🏆' : empate ? '🤝' : dueloAtual.encerrado_por_abandono ? '🏃' : '😤'}
      </div>
      <div style="font-size:24px;font-weight:900">
        ${euGanhei
          ? (dueloAtual.encerrado_por_abandono ? 'Vitória! Adversário saiu.' : 'Você venceu!')
          : empate ? 'Empate!'
          : 'Você perdeu!'}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%">
        <div style="background:var(--card);border:2px solid var(--eu,#3b82f6);
                    border-radius:14px;padding:16px;text-align:center">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">
            ${escH(apelido)}${_meuParceiroNome ? `<br><span style="font-size:10px;opacity:.6">+ ${escH(_meuParceiroNome)}</span>` : ''}
          </div>
          <div style="font-size:36px;font-weight:900;color:var(--eu,#3b82f6)">
            ${meuRes.pares?.toFixed(1).replace('.0','') ?? 0}
          </div>
          <div style="font-size:10px;color:var(--text-muted)">pares</div>
        </div>
        <div style="background:var(--card);border:2px solid var(--adv,#ef4444);
                    border-radius:14px;padding:16px;text-align:center">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">
            ${escH(_adversarioNome)}${_advParceiroNome ? `<br><span style="font-size:10px;opacity:.6">+ ${escH(_advParceiroNome)}</span>` : ''}
          </div>
          <div style="font-size:36px;font-weight:900;color:var(--adv,#ef4444)">
            ${advRes.pares != null ? advRes.pares.toFixed(1).replace('.0','') : '—'}
          </div>
          <div style="font-size:10px;color:var(--text-muted)">pares</div>
        </div>
      </div>
      <div style="font-size:20px;font-weight:800;
                  color:${xpDelta >= 0 ? 'var(--green,#22c55e)' : '#ef4444'}">
        ${xpDelta >= 0 ? '+' : ''}${xpDelta} XP
      </div>
      <button onclick="window.location.href='/aluno/duelos.html'"
        style="padding:12px 28px;background:var(--purple,#7F77DD);color:#fff;
               border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer">
        Voltar aos duelos
      </button>
    </div>
  `;
}

// ── Sair ──────────────────────────────────────────────────────
window.confirmarSair = async function() {
  console.log('[confirmarSair] estado.finalizado =', estado.finalizado);
  console.log('[DEBUG]', { uid, adversarioUid, dueloId, dificuldade, adversarioNome, apelido });

  if (estado.finalizado) {
    window.location.href = '/aluno/duelos.html';
    return;
  }

  const confirmado = confirm(
    '⚠️ Sair do duelo?\n\n' +
    '• Você perde\n' +
    '• Adversário ganha automaticamente\n\n' +
    'Tem certeza?'
  );
  if (!confirmado) return;

  estado.finalizado = true;
  clearInterval(_timerInterval);

  // Salvar L para mim
  await set(ref(db, `perfis/${uid}/historico_duelos/${dueloId}`), {
    duelo_id:        dueloId,
    dificuldade:     dificuldade,
    adversario_nome: adversarioNome,
    resultado:       'derrota',
    abandono:        true,
    ts:              Date.now(),
  });

  // Salvar W para adversário
  await set(ref(db, `perfis/${adversarioUid}/historico_duelos/${dueloId}`), {
    duelo_id:        dueloId,
    dificuldade:     dificuldade,
    adversario_nome: apelido,
    resultado:       'vitoria',
    ganhou_abandono: true,
    ts:              Date.now(),
  });

  // Marcar duelo encerrado
  await update(ref(db, `duelos/${dueloId}`), {
    status:       'encerrado',
    vencedor_uid: adversarioUid,
  });

  // XP
  try {
    const { adicionarXP } = await import('/js/db.js');
    await adicionarXP(uid,           XP_DUELO[dificuldade].derrota);
    await adicionarXP(adversarioUid, XP_DUELO[dificuldade].vitoria);
    if (_meuParcUid) {
      try { await adicionarXP(_meuParcUid, XP_DUELO[dificuldade].derrota); } catch(e) {}
    }
    if (_advParcUid) {
      try { await adicionarXP(_advParcUid, XP_DUELO[dificuldade].vitoria); } catch(e) {}
    }
  } catch(e) {}

  // Presença
  await atualizarPresenca({ em_duelo: false, status: 'disponivel' });

  window.location.href = '/aluno/duelos.html';
};

// ── Interceptar navegação durante duelo ───────────────────────
document.addEventListener('click', function(e) {
  if (estado?.finalizado) return;
  const link = e.target.closest('a[href]');
  if (!link) return;
  const href = link.getAttribute('href');
  if (!href || href === '#') return;
  e.preventDefault();
  e.stopPropagation();
  const confirmado = confirm(
    '⚠️ Sair do duelo?\n\n' +
    '• Você será marcado como PERDEDOR\n' +
    '• Adversário ganha automaticamente\n' +
    '• O duelo encerra para os dois\n\n' +
    'Tem certeza?'
  );
  if (confirmado) {
    encerrarPartida('abandono').then(() => { window.location.href = href; });
  }
}, true);

history.pushState({ duelo: true }, '', location.href);
window.addEventListener('popstate', function() {
  if (estado?.finalizado) return;
  history.pushState({ duelo: true }, '', location.href);
  const confirmado = confirm(
    '⚠️ Sair do duelo?\n\n' +
    '• Você perde automaticamente\n\n' +
    'Tem certeza?'
  );
  if (confirmado) {
    encerrarPartida('abandono').then(() => { history.back(); history.back(); });
  }
});

window.addEventListener('beforeunload', function(e) {
  if (estado?.finalizado) return;
  e.preventDefault();
  e.returnValue = '';
});

// ── Start ──────────────────────────────────────────────────────
iniciarPartida();
</script>
